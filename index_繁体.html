<script>
const DATA = {"chapters": [{"i": -1, "title": "序", "kind": "preface", "summary": ["序言宣稱股市確有投資絕技，正確途徑是親手畫k線加老師指點，方能積累經驗捕捉靈感。", "畫完七十年k線，作者學會孤獨、獨立思考與沉靜，江湖性格變得沉穩而有些固執，投資重塑人格。", "美國股市紅色代表下跌，作者見k線如見鮮血，深感殘酷；對沖基金深知恐懼威力，慣於沽空狙擊。", "上海朋友畫線後淚流滿面，悟出股市真諦是「講故事」；虧損者滔滔不絕，賺錢的永遠是沉默者。", "作者給出兩條路：勤畫線以智慧管理自己，或撤銷帳戶遠離市場，過平常而簡單的幸福生活。"], "qa": [{"q": "莊家與對沖基金深知何種心理弱點？最喜歡用什麼戰術？", "a": "對沖基金深知恐懼對人的影響力巨大，善於抓住一切不利因素狙擊目標，最喜歡沽空，藉大眾恐慌下跌而獲利。"}, {"q": "作者為何對紅色產生血淋淋的過度反應？", "a": "因美國股市紅色代表下跌，下跌意味更多人虧損，他站在k線圖前看到的不是紅色顏料，而是一滴滴紅色血液，一直被資本市場的殘酷折磨。"}, {"q": "畫完七十年數據後，作者的心理與性格有何變化？", "a": "他學會了孤獨、獨立思考與沉靜，原本愛說話、好抱打不平的江湖性格，變成沉穩而有些固執，投資經歷徹底重塑其內在人格。"}, {"q": "「賺錢的永遠是沉默者」反映什麼心理機制？", "a": "沉默者深知賺錢的艱辛與苦難；善言者則是為了推脫責任，用語言撫平虧損帶來的心靈創傷，屬認知失調式的自我合理化。"}, {"q": "上海朋友前後行為反差說明了什麼心理變化？", "a": "從前虧損累累時見面就滔滔不絕談股票，是藉語言自我安慰；連續三年年收益80%後反而沉默，不超過五句話談股市，心態由浮躁歸於沉靜。"}, {"q": "上海朋友悟出的「講故事」與股市心理有何關聯？", "a": "股市價格由故事與消息驅動，知道開頭就能猜出結尾；在結尾未到時做旁觀者、早早謝幕，才能不被故事牽著鼻子走。"}, {"q": "作者為何厭惡面對市場滔滔不絕的投資人？", "a": "他認為投資人應靜靜傾聽k線的敘述，而不是自言自語地陶醉；自我陶醉正是過度自信、不願面對市場真實聲音的心理防衛。"}, {"q": "眾人夢想「投資絕技」背後隱含什麼心理動機？", "a": "投資人共同的夢想是洞察先機、抓住機會獲取無限財富，反映攀比與暴富敘事心理，渴望一條不勞而獲的捷徑。"}, {"q": "啟蒙老師戴維交給作者什麼任務？", "a": "兩張3寸軟盤：一是美國股市七十年數據，畫成k線圖並加成交量與均線；二是一戰以來經濟政治文字資料，把重大事件標註圖上，等於獲得七十年投資經歷。"}, {"q": "作者給投資人的兩個選擇是什麼？", "a": "一、從畫k線圖做起，努力學習投資專業知識，用智慧管理自己、用知識獲取財富；二、撤銷股票帳戶，遠離股市及一切金融衍生品市場，過平常而簡單的幸福生活。"}], "quotes": ["他们深知恐惧对人的影响力是巨大的。所以，他们最喜欢干的就是沽空。", "我站在k线图面前的时候，我看到不是红色颜料，而是一滴滴红色血液，一直被资本市场的血淋淋的残酷所折磨。", "他已经知道股市生存的法则和真谛了，所有的一切总结起来就是一句话：讲故事。", "真应了一句话：赚钱的永远是沉默者，因为他深知其艰辛和苦难。善言的则是为了推脱责任，用语言抚平亏损所带来心灵创伤。", "当这本几十万字的书变成一张k线图的时候，你已经成为一个智者，高高的站在资本市场之上，俯视在这个市场上表演的形形色色的各色人等。"], "psych": [{"p": "情緒操縱", "a": "他们深知恐惧对人的影响力是巨大的。所以，他们最喜欢干的就是沽空。", "n": "對沖基金利用大眾恐懼沽空獲利，注解莊家操控情緒以達成目的。"}, {"p": "孤獨與異化", "a": "当我画完70年的数据之后，我已经开始学会了孤独、独立思考、沉静。我的性格也就是那个时候发生了改变", "n": "畫線訓練令主角走向孤獨沉靜，職業投資徹底改變其內在性格。"}, {"p": "認知失調／合理化", "a": "善言的则是为了推脱责任，用语言抚平亏损所带来心灵创伤。", "n": "虧損散戶滔滔不絕談股，正是用語言合理化虧損、推脫責任。"}, {"p": "信息瀑布（謠言市）", "a": "他已经知道股市生存的法则和真谛了，所有的一切总结起来就是一句话：讲故事。", "n": "股市由故事與消息驅動，注解信息瀑布與預期自我實現。"}]}, {"i": 0, "title": "前言", "kind": "preface", "summary": ["作者借前言立纲：化繁为简、安全赚钱为核心理念，以抵御谣言与盯盘带来的心理噪音。", "认识股市更须认识自己，否则无论亏赚都糊里糊涂，点明自我认知是投资的第一课。", "紧盯每时每刻的价格易被短期数字锚定而陷入价格谜局，放远眼光看趋势方得大局观。", "价值投资保资金安全、趋势投机抓买卖时机，以平常心处变不惊，对抗情绪波动。", "本书被誉为中国股市心理学教科书，以虚构笔法再现庄家博弈背后的腥风血雨与人性较量。"], "qa": [{"q": "從心理學角度看，作者為何主張「化繁為簡」？", "a": "市場有許多虛假信息與謠言，無時無刻不在影響投資決策，人的心理極易被噪音左右，故只關心政府政策與上市公司公告，其餘聽而不聞、視而不見，以免被蒙蔽。"}, {"q": "作者說要「認識股市、認識自己」，這「認識自己」有何心理內涵？", "a": "只具備正確理念還不夠，若不明白自己在市場中扮演的角色、認不清自己的貪婪與恐懼，無論虧賺都會糊里糊塗，自我認知因此是投資的心理前提。"}, {"q": "為何眼睛總盯在每時每刻的價格變化上，就會陷入「價格謎局」？", "a": "緊盯眼前價格會被短期數字錨定，缺少大局觀，只見漲跌不見趨勢；應放遠眼光只看波動趨勢，價格非漲即跌，趨勢一目了然。"}, {"q": "作者如何防範謠言對散戶心理的侵蝕？", "a": "按化繁為簡的原則，只關心政府有關經濟發展的政策與上市公司公告信息，其餘的完全聽而不聞、視而不見，以此截斷信息瀑布式的謠言衝擊。"}, {"q": "巴菲特「以平常心對待投資」體現了怎樣的心理素質？", "a": "以時間換取空間，處變不驚、寧靜致遠，不被短期波動挑動情緒，把價值投資與趨勢投機結合，是戰勝市場情緒波動的心理典範。"}, {"q": "本書為何被投資人譽為「中國股市心理學教科書」？", "a": "它以虛構的第一人稱揭開莊家做莊的內幕，展示價格變動背後不為人知的心理博弈，使讀者看到真實的股市，故獲此美譽。"}, {"q": "作者說讀完本書讀者會「恍然大悟」，這背後是什麼心理機制？", "a": "股市真相的揭示令讀者啞然失色、心有余悸，原有困惑一旦被點破便豁然開朗，對應的正是認知被重構後的釋然與覺醒。"}, {"q": "「生存的時間越久機會則越大」反映了怎樣的投資心理觀？", "a": "價值投資保障資金安全才能活得久，避免因貪婪與恐懼被市場淘汰，機會屬於長期存活者，是對抗短期暴富心理的清醒認知。"}, {"q": "作者為何強調「安全賺錢」而不只是「賺錢」？", "a": "直指散戶追漲貪婪、割肉恐懼的心理弱點，唯有安全第一才能在腥風血雨中生存下去，這是一套立足心理防線的生存策略。"}, {"q": "作者從1997年想寫書到2003年才動筆，反映了什麼心理？", "a": "一直謹小慎微、不敢動筆，源於對揭露股市內幕的敬畏與顧慮，直到以虛構手法在網絡發表，才找到安全表達的方式，可見內幕之沉重。"}], "quotes": ["化繁为简，安全赚钱！", "市场有许多虚假的信息和谣言，无时无刻不在影响着我们的投资决策。", "如果您把眼睛总是盯在每时每刻的价格变化上，那么，您就缺少大局观，自然就会陷入价格谜局。", "要认识股市、认识自己。", "再现了股市的腥风血雨，真相使每一位读者都会感到哑然失色，心有余悸。"], "psych": [{"p": "信息瀑布（謠言市）", "a": "市场有许多虚假的信息和谣言，无时无刻不在影响着我们的投资决策。", "n": "前言直指謠言左右散戶決策，主張只信官方信息以截斷信息瀑布。"}, {"p": "錨定效應", "a": "如果您把眼睛总是盯在每时每刻的价格变化上，那么，您就缺少大局观，自然就会陷入价格谜局。", "n": "緊盯眼前價格即被短期數字錨定，失去大局觀而墜入價格謎局。"}, {"p": "恐慌性拋售（恐懼）", "a": "再现了股市的腥风血雨，真相使每一位读者都会感到哑然失色，心有余悸。", "n": "以腥風血雨描摹股市，點明恐懼氛圍正是散戶恐慌出逃的心理底色。"}]}, {"i": 1, "title": "第一回　夢繞股海冬夜長", "kind": "hui", "summary": ["1992年上海冬夜，敘述者因巧合踏入股市，自稱「平靜得嚇人」，透露入市者的麻木與疏離。", "父親視炒股為「賭博」並擔憂婚事，反映鄉村社會對股市的污名，主角背負道德衝突與罪疚。", "報載有人賠錢自殺，敘述者自問是否步其後塵，死亡焦慮縈繞心頭，恐懼在無意識中蔓延。", "入行兩年漸覺枯燥仍難以抽身，以「解決就業」自我合理化，透露沉沒成本與認知失調心理。", "久居酒店、厭惡職業微笑，闖紅燈險被撞仍無感，職業投資人逐步陷入孤獨與異化。"], "qa": [{"q": "敘述者說自己「心中一直很平靜，平靜得嚇人」，這背後是什麼心理狀態？", "a": "兩年股海沉浮已令他情感麻木，對風險與後果近乎無感；這種超乎常人的平靜，其實是長期壓力下的心理防衛，也是職業投資人異化於常人的開端。"}, {"q": "故事開頭交代了什麼時代背景？", "a": "1992年的上海，「怎麼看這兒都不像冬天」，寒冬時節的繁華都市隱隱預示股市狂熱的時代氛圍。"}, {"q": "父親把炒股視為「賭博」並擔憂婚事，反映什麼社會心理？", "a": "鄉村社會視股市為投機賭局，對「賭徒」敬而遠之；主角的職業選擇與傳統道德相衝突，內心背負污名與道德衝突，甚至生出罪疚感。"}, {"q": "報載有人炒股賠錢自殺，為何令敘述者反問自己會不會也去自殺？", "a": "同業的悲劇直接擊中他的死亡焦慮，虧損即死亡的末日聯想縈繞心頭，連夜裡都難以平靜，對股市的恐懼已在無意識中蔓延開來。"}, {"q": "入行兩年已覺枯燥無味，敘述者為何仍無法抽身？", "a": "兩年的時間與精力已成沉沒成本，加上生計繫於此業，明知枯燥仍繼續，正是「因已投入而無法放手」的典型心理寫照。"}, {"q": "敘述者對老師「虛擬經濟沒有效益」的異議，如何體現自我合理化？", "a": "他明知價格上落不創造社會價值，卻以「解決就業」為自己辯護，用合理化扭曲現實，藉此緩解身處投機行業的認知失調。"}, {"q": "久居酒店、厭惡大堂經理的職業微笑，透露什麼心理？", "a": "他在酒店住了一年多，居無定所，職業微笑更把人與人的距離拉大；他渴望真實情感連結而不可得，孤獨與異化日益加深。"}, {"q": "闖紅燈險被車撞，他仍「淡淡看了一眼」，說明了什麼？", "a": "對生死險境反應淡漠，說明他對危險已然麻木；連自我保存都遲鈍，內心深處的疏離與自棄已接近臨界點。"}, {"q": "章末以「高空落石」比喻股價下跌，從心理學看有何深意？", "a": "落石無休止下跌的意象，渲染散戶面對崩跌的無助與恐慌，也暗示心理支撐位蕩然無存，前路如墜深淵。"}], "quotes": ["走在这个繁华的都市，我心中一直很平静，平静得吓人。", "记得父亲总是问我：“你这样‘赌博’，怎么找媳妇啊？”", "报纸上的消息让我很苦恼，说是有个人炒股赔钱以后自杀了，我不知道我会不会也去自杀。", "老师说过：“虚拟经济没有效益，只有效用。”", "价格像谁从高处扔下的石头一样，无休止地在下跌。"], "psych": [{"p": "孤獨與異化", "a": "在这个酒店已经住了1年多了，每当看见大堂经理脸上那种职业的微笑，我就想冲上去狠狠地给上一拳", "n": "職業股民居無定所，連職業微笑都令其窒息，人際疏離感溢於言表。"}, {"p": "死亡焦慮", "a": "报纸上的消息让我很苦恼，说是有个人炒股赔钱以后自杀了，我不知道我会不会也去自杀", "n": "同業自殺新聞直擊其生死恐懼，股海沉浮牽動末日感。"}, {"p": "沉沒成本", "a": "两年了，介入了一个不认识的新行当，干到现在也变得枯燥无味", "n": "入行兩年已成沉沒成本，明知枯燥無味仍無法放手離場。"}, {"p": "恐慌性拋售（恐懼）", "a": "价格像谁从高处扔下的石头一样，无休止地在下跌", "n": "股價如落石無休止下跌，散戶面對崩跌的無助與恐慌已現端倪。"}]}, {"i": 2, "title": "第二回　股海滄桑見浮沉", "kind": "hui", "summary": ["深圳主力出貨誘發散戶恐慌性拋盤，如山洪暴發，群體恐懼放大跌勢。", "主角眺望靜安寺佛像，在崩盤中湧起祈禱之念，恐懼與無助畢現。", "大哥大、BB機成身份象徵，街頭炫機映照暴富時代的攀比虛榮。", "昨日出貨獲證實，主角竟無喜悅，反幻想未出貨會笑，職業性異化令人心悸。", "老太太暈倒而主角無動於衷，自省越改越糟，終以《殺手無笑容》自嘲孤獨。"], "qa": [{"q": "莊家用了什麼心理戰術，讓跌勢一發不可收拾？", "a": "深圳主力出貨，起初拋壓隱而不顯，待散戶察覺時已兵敗如山倒——先蓄勢再引爆恐慌，令散戶在恐懼中爭相割肉，莊家從容完成出貨。"}, {"q": "散戶在暴跌中表現出什麼群體心理？", "a": "散戶見主力出貨便集體恐慌性拋售，如羊群般爭先離場；跌勢越兇，眾人越不敢留，拋盤如山洪暴發，群體恐懼反過來又加劇了下跌。"}, {"q": "主角的心理狀態如何被股市改變？", "a": "主角變得冷漠、無動於衷：老太太暈倒他也毫無反應，還幻想自己若沒出貨、看著暴跌可能會笑。股市的殺伐已把他訓練成冷血職業客，性格被徹底重塑。"}, {"q": "面對狂跌，主角為何湧起「去祈禱」的強烈願望？", "a": "面對狂跌與散戶無助的眼神，主角感到個人的渺小無力，下意識想起寺中佛像，湧起祈禱之念——用宗教儀式安撫暴跌帶來的恐懼與幾近死亡的壓力。"}, {"q": "為什麼有人偏要在十字路口打大哥大？", "a": "主角用過大哥大後發現，那些人並非真忙，只因十字路口能看見的人多，藉著大聲通話顯示自己的身份——典型的攀比炫耀心理，也是暴富時代的虛榮寫照。"}, {"q": "早上進場的散戶為何十有八九虧損？", "a": "早上股價向上，散戶見漲便追入，未料主力趁勢出貨；他們出來得慢，十有八九虧損。貪婪追高、反應遲鈍，正是散戶虧損的群體性心理根源。"}, {"q": "昨天與領導爭執出貨，今天證明對了，主角為何不高興反有惡念？", "a": "證明自己對了，他卻毫不高興，甚至惡毒地幻想別人虧損自己會笑。長期的博弈已令他麻木，勝負對錯都激不起情緒，反而以旁觀者的冷血自嘲，心理早已被股市異化。"}, {"q": "主角為什麼覺得自己像《殺手無笑容》？", "a": "他自比職業殺手：面無笑容、出手冷靜、不帶感情。在股市的廝殺中，主角學會壓抑一切情緒，連憐憫與喜悅都被磨去，這是職業投資人孤獨異化的自況。"}, {"q": "老太太暈倒時，眾人的反應與主角有何對比？", "a": "眾人忙著追問「沒事吧」，主角卻冷冷地聽、毫無反應，自己也驚訝怎會無動於衷；想強裝笑容反而令人誤會、急忙解釋。他與人群的情感節奏已完全脫節。"}, {"q": "為何暴跌一旦開始就「難以收拾」？", "a": "主力拋壓引動散戶恐慌，恐慌又招來更多拋盤，跌勢在群體情緒的傳染中自我強化、滾雪球般難以收拾——正是恐慌性拋售與信息瀑布的疊加效應。"}], "quotes": ["散户恐慌性抛盘一出来，就像山洪暴发一样，下跌的场面难以收拾。", "这时候我的心中就会想起寺庙里慈祥的佛像，我有一种很强烈的愿望：去祈祷！", "我冷冷地听大家说话没有任何反应，我这时候也惊讶自己怎么就会无动于衷。", "等我自己用起“大哥大”以后才觉得，那些人之所以那样在大街上打电话，是想显示自己的身份而已", "我忽然想起，有个录相叫《杀手无笑容》！"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "散户恐慌性抛盘一出来，就像山洪暴发一样，下跌的场面难以收拾。", "n": "莊家出貨引爆散戶恐慌，眾人爭相不計成本離場，群體恐懼如洪水決堤。"}, {"p": "情緒操縱", "a": "深圳那边开始有主力出货，抛压开始还看不出来，一阵子就不得了", "n": "主力先隱藏拋壓、再集中引爆，操控市場情緒完成出貨，散戶在恐懼中接盤。"}, {"p": "孤獨與異化", "a": "我冷冷地听大家说话没有任何反应，我这时候也惊讶自己怎么就会无动于衷。", "n": "主角對老太太暈倒無動於衷，股市搏殺已把他異化成冷血旁觀者。"}, {"p": "攀比與暴富敘事", "a": "那些人之所以那样在大街上打电话，是想显示自己的身份而已", "n": "大哥大成為身份象徵，街頭炫機正是暴富年代攀比與炫耀心理的寫照。"}]}, {"i": 3, "title": "第三回　衡山夜半叉头声", "kind": "hui", "summary": ["主角深夜乘车赶往酒店，一路盘算着报复大堂经理，把人际互动化为心理较量。", "他把“劝人明天买股票”当作报复武器，足见股市在他心中如陷阱，庄家心性初露。", "深夜街头人来人往，他认定路人大都“和自己一样有心事”，是内心孤寂的投射。", "面对果篮致歉，他用木匠笑话反唇相讥，以言语为盾宣泄不满、博取心理补偿。", "两年长住饭店、被催醒电话困扰，他恨透服务员，职业投资者的疏离异化已现端倪。"], "qa": [{"q": "主角把“劝大堂经理买股票”当作报复手段，这暴露了他怎样的心理？", "a": "他把劝人买股票当作惩罚性建议，想亲眼看看对方还能否笑得出来，足见在他眼中股市凶险如陷阱，也暴露他睚眦必报、暗中较劲的庄家心性。"}, {"q": "深夜两点的衡山路，主角为何觉得路人大都“和我一样有心事”？", "a": "他把自己深夜独行、满怀心事的状态投射到街上行人身上，认定众人同病相怜。这种移情正透出他长居饭店、与日常世界隔绝的孤寂，是职业投资人疏离感的流露。"}, {"q": "“我倒是要看看这小子还会不会这样一如既往地笑”体现了一种怎样的博弈心理？", "a": "这是一场暗中较量的心理战：他要以“劝买股票”这根刺去戳破经理的笑容，看谁先沉不住气，把人际交往变成承受力比拼，正是庄家“看谁先崩溃”式博弈本能的预演。"}, {"q": "女孩送果篮致歉时始终微笑，主角猜想她笑脸下藏着什么？", "a": "他猜想女孩笑脸下的潜台词是“你这个猪”之类更难听的话，只是表面不发作。他深知微笑可以是情绪伪装，习惯以怀疑眼光解读他人的表情与动机。"}, {"q": "主角用“父亲是木匠”的玩笑回敬对方后，为何在电梯里暗暗高兴？", "a": "他自认用巧语占了上风、赢了这场言语交锋，便把胜利归功于自己的机敏，暗自得意。这种自我陶醉式的满足，是他长居酒店、精神压抑生活中的心理补偿。"}, {"q": "“侬要叉头”是什么意思？主角为何始终得不到满意的答复？", "a": "这是上海话“你要不要出租车”的意思。他来上海许久仍只听懂这一句，问过几个上海人，对方看他的眼神总是怪怪的，却始终没人给他满意的解释。"}, {"q": "酒店为何送果篮致歉？主角如何借果篮反唇相讥？", "a": "因酒店装修六楼噪音影响休息，送果篮表示歉意。他冷冷反问果篮能否挂在耳朵上隔音，讽刺这份歉意只是表面功夫，对实际问题毫无用处。"}, {"q": "“两年来一直这样”的催醒电话，反映出主角怎样的生活状态？", "a": "两年间前台天天打电话催他起床，他认定服务员天天折磨自己，恨之入骨。长住饭店、昼夜颠倒、把例行服务当作恶意，正是他远离人际、孤独异化的生活写照。"}, {"q": "主角见到迎上来的高个子女孩，为什么会“很失望”？", "a": "他一路盘算着报复那个总冲他笑的大堂经理，结果经理偏偏不在，迎上来的是个操普通话的漂亮女孩，报复对象落空，他的计划无从施展，故而失望。"}, {"q": "主角以“父亲是木匠”自嘲“打小被吵惯”，体现了他怎样的防御心理？", "a": "他先用“没有声响反而不舒服”婉拒换房，又借“打击乐”暗讽对方，以幽默作盾化解不快。表面满不在乎，实则以言语掩饰对噪音打扰的真实不满与烦躁。"}], "quotes": ["“侬要叉头？”一声上海话打断了我的思路，来上海这么久我大概就能听懂这句话，意思就是“你要不要出租车”？", "我发誓这家伙今天要是再那样冲着我笑，我一定建议他明天买股票，我倒是要看看这小子还会不会这样一如既往地笑。", "看看表，已经凌晨2点了，上海就是繁华，2点钟的衡山路还是人来人往，估计这些人大都和我一样有心事吧。", "我猜想在她笑脸下面的潜台词就是：“你这个猪！”或者更难听的话，只是表面不发作而已。", "电话铃声没命地响，我知道又是前台打电话催我起床，两年来一直这样。我对这些服务员可以说是恨之入骨——天天这样折磨我。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "我倒是要看看这小子还会不会这样一如既往地笑。", "n": "他要亲眼看着对方的笑容被戳破，看谁先撑不住，庄家式承受力比拼的预演。"}, {"p": "情緒操縱", "a": "车子在淮海路上飞奔，夜里的淮海路显得非常安静，快到外滩的时候，我忽然又想起那个大堂经理的脸，心里又开始烦躁，我发誓这家伙今天要是再那样冲着我笑，我一定建议他明天买股票，我倒是要看看这小子还会不会这样一如既往地笑。", "n": "他把“劝人买股票”当作报复武器，欲以言语操控对方情绪，预演庄家操纵人心。"}, {"p": "孤獨與異化", "a": "看看表，已经凌晨2点了，上海就是繁华，2点钟的衡山路还是人来人往，估计这些人大都和我一样有心事吧。", "n": "深夜街头独行、两年长住酒店，他把心事投射给路人，职业投资人疏离孤独的心理写照。"}, {"p": "自我服務偏差（吹噓）", "a": "小姐还没有反应过来，我就扬长而去，在电梯里我还暗暗地高兴了好一阵子，一直走进房间，居然连澡都没有洗就倒在床上呼呼大睡。", "n": "他把口舌之胜归功于自己的机敏，暗自得意，靠自我陶醉补偿压抑的日常。"}]}, {"i": 4, "title": "第四回　股海冬深忆故牛", "kind": "hui", "summary": ["五日狂瀉二百餘點，領導驚惶問還敢否建倉，主角以乖離率斷言強勢並令全倉，勝於心理承受力之爭。", "散戶在暴跌中拼命出逃，群體恐慌蔚為風潮，主角反手全倉建倉，把眾人的恐懼化作自己的機會。", "窗前遐想古時必為得道高僧，卻因自持不足、好色貪戀而自嘲無緣方丈，理想自我與慾望交戰。", "報單姑娘名牌加身、洩漏內幕揩油，主角藉簽單留證自清，暗諷紀律與利益之鬥。", "老牛墜溝摔死，父親傷慟入院，主角竟暗喜其省心；聞股票上漲卻冷然以對，人情與行情一熱一冷。"], "qa": [{"q": "面對同一場暴跌，領導與主角的反應有何不同？這是一場怎樣的心理較量？", "a": "領導驚惶失色，連問還敢不敢建倉；主角卻稱害怕應在五天前，如今乖離率由正轉負恰是介入良機，遂下令全倉買入。比的是心理承受力，誰先崩潰誰就輸。"}, {"q": "散戶在暴跌中表現出什麼群體心理？主角如何利用它？", "a": "散戶拼命出逃，是典型的恐慌性拋售，眾人一致看空。主角視其為絕佳機會，逆勢把全部資金砸進去，正是利用群體恐慌與自身冷靜的落差建倉。"}, {"q": "主角為何在領導面前湧起「無限的優越感」？這反映他什麼心理？", "a": "他一口气搬出布林線、乖離率、expma等一大串術語，把領導堵得瞠目結舌。以專業知識壓制對方換取優越感，是過度自信與自我服務偏差的表現。"}, {"q": "主角自認會是得道高僧，卻為何當不上方丈？這透出他怎樣的心理矛盾？", "a": "友人說他自持能力不夠、總愛看女孩子，競爭激烈的僧界容不下；他自己又記掛父親囑咐的傳宗接代。理想自我與現實慾望相互撕扯，遂以自嘲收場。"}, {"q": "主角從報單員換穿名牌聯想到什麼？這暴露了市場什麼祕密？", "a": "一個月工資就那點錢，買衣服只夠每月一套，卻三天兩頭換裝，傻瓜都知是借資金運作訊息揩油。看似嚴禁外洩的紀律形同虛設，內幕消息暗流湧動。"}, {"q": "主角簽報單時為何認為這是「有意識保留的證據」？", "a": "他知道自己說過的話不會改變，但手續仍須履行；寫有他名字的表格會如聖旨般保存，一旦出事便能洗涮藉單揩油者。制度與人情並存，防的是暗箱。"}, {"q": "老牛摔死、父親傷痛入院，主角為何「心裡偷偷地樂」？", "a": "他早已視老牛為父親的負擔，牛死正好讓父親省心。親人痛徹心扉之際，他竟暗自慶幸，職業投機者的情感已然異化，人與人之間只剩利害計算。"}, {"q": "助手報說「股票漲起來了」，主角為何只冷冷應一聲？", "a": "他正沉浸於故鄉老牛的思緒中，一時回不過神；更可見漲跌在他心中已稀鬆平常，市場的起伏遠不及家事牽動他。對行情麻木，正是被股市異化的表徵。"}, {"q": "本章的行情背景如何？指數五天內從多少跌到多少？", "a": "1992年12月，指數由800多點一路下跌至600多點，五天狂瀉二百餘點，跌幅駭人，領導為此憂心忡忡，不敢再建倉。"}, {"q": "主角援引了哪些技術指標支持其建倉判斷？", "a": "布林線價格明顯穿破上軌、12日乖離率一度高達50%餘、expma單邊走勢，並稱布林線中軌就是最佳介入點，據此斷言現在是絕對強勢。"}], "quotes": ["害怕的不是现在，而是5天以前，看看布林线价格明显地穿破上轨，12日的乖离率已经高达50%还多，这是世界股票史上的奇迹。", "你看看散户，拼命地出逃，我们应该怎么办？", "看着老头子瞠目结舌的样子，我心里涌现出无限的优越感。", "我问为什么，他说和尚的竞争也很激烈的，我的自持能力还是不够，总是喜欢看女孩子。", "父亲伤心得吃不下饭，几天折磨下来，生病住医院。看着父亲伤心的样子，心里偷偷地乐，这下子父亲终于可以省心了。"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "你看看散户，拼命地出逃，我们应该怎么办？", "n": "暴跌中散戶不計成本出逃，主角卻視為最佳介入點，群體恐慌正是他的對手盤。"}, {"p": "心理較量（看誰先崩潰）", "a": "害怕的不是现在，而是5天以前，看看布林线价格明显地穿破上轨", "n": "同一場暴跌，領導驚惶、主角篤定，心理承受力之爭中先潰敗者先出局。"}, {"p": "錨定效應", "a": "从800多点一路下跌，到现在600多点，5天时间就跌成这样子", "n": "以八百點高位定錨，五日狂瀉便覺天崩地裂，整數關口放大了領導的恐懼。"}, {"p": "孤獨與異化", "a": "看着父亲伤心的样子，心里偷偷地乐，这下子父亲终于可以省心了。", "n": "至親傷慟入院，主角竟暗自慶幸，職業投機者對人情的冷漠與疏離畢現。"}]}, {"i": 5, "title": "第五回　心战股海忆父恩", "kind": "hui", "summary": ["股价疯狂上涨，主角逆势巨量吸筹，账面亏损逾四成仍面无表情接盘，内心极力克制恐惧。", "股市本质是心理较量：双方实力相近，悬殊在心理承受力，看谁先崩溃，坚持到最后者胜。", "散户在暴跌中陷入极度恐慌，争相不计成本出逃；庄家却视恐慌为吸筹良机，顺势完成布局。", "回忆父亲：背儿走几十里山路求医，盼儿读书当队长，又巴结城里人替儿积人缘，亲情深沉。", "主角以面无表情、冷冷言语压抑内心恐惧，职业使其情感疏離；散户恐慌未复，恰是行情爆发前兆。"], "qa": [{"q": "庄家在众人恐慌时用了什么心理战术？", "a": "逆势吸筹的心理战术：他深知恐慌时刻“谁坚持到最后谁就是赢家”，在散户恐慌抛售时反而加大买进，把所有的抛单全部接过来，赌对方先崩溃。"}, {"q": "主角认为这场股市较量的本质是什么？", "a": "不是知识的较量，而是智慧和胆量、更重要的是心理上的较量；大家实力相当，悬殊的差距在于心理承受能力，看谁先崩溃。"}, {"q": "散户在暴跌中表现出怎样的群体心理？", "a": "恐慌性抛售：价格像断线的珍珠滑落，资金转眼损失10%以上，散户在极度恐慌中抛售、越买越慌，正是“人们最恐慌的时候”。"}, {"q": "为什么“恐慌过后的心理恢复阶段，就是行情爆发的前兆”？", "a": "散户心态从恐慌到恢复的过程正是行情的临战状态；大家提起股票就害怕、见上涨就犹豫，越是如此，庄家越判断行情即将爆发。"}, {"q": "账面亏损40%时，主角内心经历了什么？", "a": "他心理一颤，不敢估算这个百分比背后的真实含义，但努力克制内心的恐惧，面无表情地下令继续买进、加大数量，把恐惧压进心底。"}, {"q": "主角如何表现出职业带来的情感异化？", "a": "他面无表情、冷冷地说话，把恐惧深锁心底，以亲情记忆与股市冰冷相互对照；职业投资使他压抑常人情緒，正是孤獨與異化。"}, {"q": "父亲关于坐飞机的叮嘱反映了什么心理？", "a": "父亲用想象安排安全：叮咛坐中间、别坐窗边，还问有没有窗户、要不要绳子绑人；主角附和“有绳子绑人”，彼此以合理化安顿焦虑。"}, {"q": "童年饭馆的愿望如何成为主角读书的动力？", "a": "发高烧时父亲背他走几十里山路进城求医，饭馆玻璃窗上胖厨师端着面条的画面刻进记忆，他立志好好念书，长大带父亲吃那碗面条。"}, {"q": "父亲为何对主角单位的人特别恭敬？", "a": "在父亲眼里，别人都是城里人，只有儿子是农村人；他巴结这些城里人是为了替儿子积点人缘，免得儿子被打发回老家种地。"}, {"q": "收市前助手报告股价又跌，主角如何应对与预判？", "a": "他冷冷地说忙去吧、明天再说；心里清楚这种平衡不会维持太久，对方不会白白损失40%，一场恶战避免不了，宁静不会持久。"}], "quotes": ["价格就像断线的珍珠往下滑落，资金一旦入市，转眼间就损失10％还多", "谁坚持到最后谁就是赢家，这是心理的较量，最后总有一些坚持不住的人，股市就是这样一个心理较量的过程。", "我努力地克制自己内心的恐惧，面无表情地说：“继续买进，加大买进的数量，把所有的抛单全部接过来。”", "大概是智慧和胆量的较量，更重要的是心理上的较量，论实力大家应该都差不多，悬殊的差距就是对方的心理承受能力——看谁先崩溃。", "恐慌过后的心理恢复阶段，就是行情爆发的前兆。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "谁坚持到最后谁就是赢家，这是心理的较量，最后总有一些坚持不住的人", "n": "主角直陈股市本质：胜负取决于谁的心理承受力先崩溃。"}, {"p": "恐慌性拋售（恐懼）", "a": "价格就像断线的珍珠往下滑落，资金一旦入市，转眼间就损失10％还多", "n": "散户在暴跌中不计成本出逃，正构成庄家逆势吸筹的契机。"}, {"p": "情緒操縱", "a": "理智告诉我这时候正是人们最恐慌的时候，谁坚持到最后谁就是赢家，这是心理的较量，最后总有一些坚持不住的人，股市就是这样一个心理较量的过程。", "n": "庄家驾驭大众恐慌的情绪节奏，在恐慌高峰反手接盘完成建仓。"}, {"p": "孤獨與異化", "a": "我努力地克制自己内心的恐惧，面无表情地说：“继续买进，加大买进的数量", "n": "职业要求他压抑情感、面无表情，投资生涯使主角與常人情感疏離。"}]}, {"i": 6, "title": "第六回　峰巅收缰身自轻", "kind": "hui", "summary": ["春節前人心渙散、無心戀戰之際，股市悄悄發動襲擊，莊家專挑大眾意志薄弱之時出手。", "莊家以BRAR人氣指標窺探散戶恐慌，眾人六神無主之處，恰是莊家建倉的良機。", "股價由拆細後40元飆至300餘元，散戶陷入追漲狂熱，幻想自己的股票衝向數千元天價。", "當衝動人群不顧一切湧入市場之時，即是莊家全部出貨之刻，心理較量在此見分曉。", "主角自省昔日自尊實為自卑，勝後如釋重負，卻總獨自走向散戶最多的證券大廳。"], "qa": [{"q": "春節前股市為何會「悄悄地進行襲擊」？這利用了什麼心理時機？", "a": "節前一兩個月人們就沒心思工作，股市裡的人也是無心戀戰；莊家正是利用大眾注意力鬆懈、意志渙散之際發動行情，令沒有準備的人措手不及，這是典型的心理時機戰術。"}, {"q": "主角斥責恐慌的助手時，點破了散戶什麼群體心理？", "a": "他說這種回調「肯定具有很大的殺傷力」，不然怎會讓助手這樣的蠢豬恐慌；外面戰戰兢兢的散戶正是群體恐慌的寫照，人氣指標大幅滑落，說明這些膽小的人已被嚇得六神無主。"}, {"q": "主角為何斷言「衝入市場之時就是全部出貨之時」？", "a": "這是一場心理較量：散戶的情緒在恐慌與貪婪兩極之間搖擺，當他們不顧一切追高衝入市場時，情緒已衝到頂點，正是莊家逆向收割、從容全身而退的最佳時機。"}, {"q": "股價漲到300多元時，散戶表現出怎樣的追漲心理？", "a": "人們已經瘋狂，不再擔憂價格會不會太高，因為有些股票已是幾千元，區區幾百元不算什麼；人人幻想自己的股票也會衝上幾千元，貪婪已完全取代了理性的估價。"}, {"q": "領導勸阻「現在賣掉太可惜」，背後是哪種心理在作祟？", "a": "他眼見價格猛漲而不捨離場，是散戶式貪婪與錨定於眼前漲勢的心理；主角卻冷靜算賬：平均成本不足50元、已有六倍利益，大資金不可能在最高價出完貨，現在就是最好的選擇。"}, {"q": "主角為何要求「把握節奏、順其自然」地出貨？", "a": "他深知一旦讓介入的實力資金感到賣壓，會引發連鎖性的群體拋售，故以15天溫水出貨、不驚動市場情緒；這正是莊家操控節奏、避免群體恐慌反噬自己的心理戰術。"}, {"q": "主角說當年的「自尊」其實是什麼？這說明他內在有何變化？", "a": "他承認那其實是一種自卑，自卑自己是農村人；這個自我剖析說明股市生涯令他不斷內省，原先強撐的面子被還原為出身情結，內在已被市場洗禮得冷峻而異化。"}, {"q": "為什麼每次大戰結束，主角總想去散戶最多的證券大廳轉轉？", "a": "他下意識要親眼看看那些被他收割的人群，既為觀察群體情緒的餘溫，也透出職業投資人與大眾之間的疏離與孤獨——贏了市場，卻離人越來越遠。"}, {"q": "主角簽字出貨時為何「如釋重負」？這反映了他承受著什麼？", "a": "六倍利潤落袋、壓力瞬間卸下，感覺如走下剛剛降落的飛機一般輕鬆；這也揭示大資金操盤者長期背負的心理重壓，勝利的輕鬆不過是片刻的喘息，之後他又會陷入新的較量。"}, {"q": "從心理博弈的角度看，莊家與散戶在本章誰才是真正的對手？", "a": "表面是莊家與散戶的對壘，實則莊家的對手是散戶的情緒：恐慌時悄悄建倉、瘋狂時從容出貨，主角贏的不是行情本身，而是對群體心理的預判與駕馭。"}], "quotes": ["人们在节前无心恋战，而恰恰就是在这节前,股市悄悄地对这些可怜的人们进行了袭击。", "人气大幅度地滑落，说明什么?就足以说明这些胆小的人们已经被吓得六神无主", "记住，当这些冲动的人们，再一次不顾一切地冲入这个市场的时候，就是我们全部出货的时候。", "股票的价格由拆细以后的40元已经上涨到眼下的300多元，但是人们已经疯狂了，已经不再担忧这样的价格会不会很高", "我有个习惯，每次大战结束，我总是想去散户最多的证券大厅转转，我不知道为什么，但是我有这个习惯。"], "psych": [{"p": "情緒操縱", "a": "人们在节前无心恋战，而恰恰就是在这节前,股市悄悄地对这些可怜的人们进行了袭击。", "n": "莊家專挑節前人心渙散之際發動行情，操控大眾注意力以收突襲之效。"}, {"p": "恐慌性拋售（恐懼）", "a": "人气大幅度地滑落，说明什么?就足以说明这些胆小的人们已经被吓得六神无主", "n": "莊家以人氣指標度量散戶恐慌程度，眾人嚇破膽之處正是建倉良機。"}, {"p": "追漲（貪婪）", "a": "但是人们已经疯狂了，已经不再担忧这样的价格会不会很高，因为在这个时候有些股票的价格是几千元", "n": "股價越高越不嫌貴，狂熱幻想自己的股票也衝向幾千元，貪婪吞沒理性。"}, {"p": "心理較量（看誰先崩潰）", "a": "当这些冲动的人们，再一次不顾一切地冲入这个市场的时候，就是我们全部出货的时候。", "n": "散戶情緒衝頂之際莊家逆向出貨，勝負繫於誰先崩潰、誰更冷靜。"}]}, {"i": 7, "title": "第七回　除夕股海話歸程", "kind": "hui", "summary": ["除夕當日散戶仍圍著股市轉，節日也擋不住的市場誘惑，可見群體心理之深。", "主角指點割肉阿婆買進，並以「360元」定錨賣點，心理支撐位主導操作節奏。", "助手小張洩露消息致親友跟風入市，情報外流釀成羊群效應，主角冷言點破。", "主角以「割肉」喻賠錢之痛、撕心裂肺——損失厭惡書寫股民的集體創傷。", "主角拒絕領導加碼冒險拂袖而去，被當成賺錢機器，孤獨與異化縈繞心頭。"], "qa": [{"q": "除夕大年三十，證券大廳的人為何不回家團圓？", "a": "股市的誘惑壓過闔家團圓，眾人把全部精力放在市場上，主角一直不明白人們為何不顧家人——暴富慾望支配下的群體心理讓他深感不解。"}, {"q": "老太太割肉空倉後看著股價上漲，為何忐忑不安？", "a": "她1992年10月割肉離場，如今眼見上漲既怕追高又怕踏空，損失的痛苦陰影令她不知該買還是該賣，所以顫巍巍地盯著跳動的價格發愁。"}, {"q": "主角為何指定「360元」作為阿婆的賣出價？", "a": "他以具體價位為阿婆建立心理定錨，把模糊的行情變成可執行的紀律——正月初五開盤後天天看盤，漲到360元必須賣掉，避免情緒化操作。"}, {"q": "主角警告阿婆「過完年20天後千萬別再買」，用意何在？", "a": "這是反追漲的告誡：他預見不敢買的散戶會在漲勢末期按捺不住追高接盤，所以提醒她若現在不敢買，日後更別進場，否則剩下的錢恐怕保不住。"}, {"q": "助手小張為何建議再買進做短線？主角如何回應？", "a": "小張見股價未跌、大盤將破1100點，貪婪驅動想加碼；主角冷冷拒絕，點破他老丈母娘跟風買股的事實，諷刺別讓丈母娘「割你的肉」。"}, {"q": "主角為何說很多股民說話「語無倫次」？", "a": "他估計股民是被一次次割肉「給疼壞了」——反覆撕心裂肺的賠錢經歷造成損失厭惡的創傷，進而侵蝕了他們的判斷力與表達。"}, {"q": "主角為何對「股民」這個稱呼大動肝火？", "a": "他認為買了股票就是公司東家，董事長在電視上居高臨下口稱「給廣大股民回報」是胡說，「誰是誰爸都搞不清楚」——這是職業認同感的自我防衛與不滿。"}, {"q": "領導要「砸資金擴大收益」，主角為何堅拒？", "a": "他深知這是刀口上舔血：懷疑領導把利潤吹噓上去交不了差才想加倉賭一把，拒絕賭徒式冒險，守住「牛可以吹，但是這險不能冒」的紀律底線。"}, {"q": "主角為何感到「心裡的那種不平衡」再次萌生？", "a": "他清楚領導留他只是因為能賺錢，父親在領導眼中只是老實巴交的農民——自己淪為賺錢機器，價值與人格被金錢異化，孤獨感縈繞心頭。"}, {"q": "大盤「勉強收到1100點之上」有何心理深意？", "a": "1100點是整數關口的心理大關，指數恰好多出不到一點收在其上，顯示市場對關鍵點位的執念左右了收盤預期——千點關口的錨定力量可見一斑。"}], "quotes": ["赔钱就像割肉一样的感觉，那就是撕心裂肺的感觉。", "价格涨到360元的时候，你必须卖掉！", "我是不小心说漏了嘴，她们才跟进的，不是有意识的。", "大盘勉强地收到1100点之上，较前几天的高点稍微多出不到一个点。", "这是他不愿意让我走的最大理由，绝对不是看在我父亲对他的笑脸上"], "psych": [{"p": "損失厭惡（割肉）", "a": "赔钱就像割肉一样的感觉，那就是撕心裂肺的感觉。", "n": "以「割肉」喻賠錢之痛，注解損失的痛苦遠大於獲利快樂的集體創傷。"}, {"p": "錨定效應", "a": "我就对阿婆讲：“我能帮你，但是你必须听我的话，你现在可以买进，但是你无论如何要在正月初五开盘以后天天来看盘，价格涨到360元的时候，你必须卖掉！", "n": "360元賣點與1100點整數關口都是心理定錨，主導買賣時機與收盤預期。"}, {"p": "信息瀑布（謠言市）", "a": "我是不小心说漏了嘴，她们才跟进的，不是有意识的。", "n": "助手無意洩露的消息讓親友跟進，注解消息傳播引發的從眾入市。"}, {"p": "孤獨與異化", "a": "这是他不愿意让我走的最大理由，绝对不是看在我父亲对他的笑脸上", "n": "主角被當成賺錢機器，價值僅繫於金錢，注解職業投資人的疏離。"}]}, {"i": 8, "title": "第八回　雪夜归乡思股海", "kind": "hui", "summary": ["大雪歸鄉勾起童年回憶，養父煮肉、篝火避邪、兩毛壓歲錢，慈愛躍然紙上。", "節前清倉獲利卻難捨利潤，自剖人性「本我的暴露」，貪婪與恐懼難以根除。", "職業操盤者最大障礙非資金智慧，而在於克服貪婪恐懼等天性弱點。", "為安撫養父謊稱已有女友，實則黑西裝不過是工作服，孤獨與愧疚交織。", "統計學難解非常行情，轉向陰陽相生相剋的中國古哲，視股市為心理之戰。"], "qa": [{"q": "節前出掉大部分股票並獲利，為何主人公卻心緒難平？", "a": "面對不斷上漲的股價他心中沒有底氣，放棄到手的利潤讓他體會到旁人難以想像的痛，這正是人性「本我的暴露」，貪婪與恐懼難以克服，更不可能消除。"}, {"q": "主人公認為職業資本運作者最大的障礙是什麼？", "a": "不是資金和智慧，而是如何克服這種天性的弱點；因為一旦放棄到手的利潤，那種感覺別人體會不到，天性弱點幾乎無法全部克服。"}, {"q": "主人公如何用中國古代哲學理解股市的爭鬥？", "a": "他把世界看成「陰」「陽」兩個物質構成，二者相互制約也相互支持，既是矛盾的統一體也是發展的推動力；站在鬥爭的角度看待股市上的爭鬥更顯合理。"}, {"q": "為何說主人公已被股市「異化」、與生活疏離？", "a": "回鄉本應輕鬆，他卻感慨暖屋天倫從未享受；無女友卻謊稱有對象、獨自下廚擀麵，思緒又遊弋回節前行情，職業投資人的孤獨與疏離躍然紙上。"}, {"q": "面對無法判斷的行情，主人公為何捨棄統計學？", "a": "他認為行情發展到這個狀態不是統計學能解決的，西方科學難有更深突破正是無法面對非常時刻；工具要由使用者的能耐賦予靈魂，哲學才是靈魂所在。"}, {"q": "主人公對父親說謊的背後藏著怎樣的心理？", "a": "他並無女友，黑西裝只是工作服；為讓養父了卻多年心願而謊稱有對象，默默在心底自嘲，湧起難言的苦澀，是孤獨者以善意謊言合理化現實的寫照。"}, {"q": "大雪中主人公憶起養父哪些深情的細節？", "a": "父親是養父卻比親生更疼愛他：過年煮肉湯泡饃叫醒睡著的他、燃篝火抱他繞圈避邪、大年初一往口袋塞兩毛壓歲錢，他最怕孩子長不大，總顯得很虔誠。"}, {"q": "隊長介紹的女孩是什麼情況？主人公如何應對？", "a": "二隊一個高中畢業、長得不錯、在村小學教書的女孩子，算是公家人；主人公謊稱已和單位穿黑色西裝的女孩有主了，說過完年帶回家給父親看看。"}, {"q": "「正月初五就開盤」一句透露出主人公怎樣的心境？", "a": "人在故鄉卻心繫股海，他覺得假期「卻顯得很漫長」，越是刻意不去想股票，思緒越遊弋回節前行情，足見職業操盤者已被市場深深牽絆。"}, {"q": "主人公說自己有什麼手藝？他隨後做了什麼？", "a": "他告訴父親自己從小就會擀麵條，而且水平還不錯；隨後說「我現在去給咱們做飯」，親自下廚為父子倆張羅飯菜。"}], "quotes": ["人性里的这种“贪婪和恐惧”，很难全部克服，更不可能消除。", "一旦放弃了到手的利润，那种感觉是别人体会不到的，这可能就是人的本性，也就是心理学讲的“本我的暴露”。", "作为一个职业资本运作者，最大的障碍不是资金和智慧，最大的障碍就是如何克服这种天性的弱点。", "父亲那时候最担心的就是怕我不能长大，因此，在这方面他总是显得很虔诚。", "我一直有一种感觉，西方的统计学只是一个量化的工具，如何使用好这个工具，最关键的还是要看使用工具的这个人的能耐以及赋予这个工具的灵魂。"], "psych": [{"p": "損失厭惡（割肉）", "a": "一旦放弃了到手的利润，那种感觉是别人体会不到的，这可能就是人的本性", "n": "放棄已到手利潤的痛楚難以承受，正是損失厭惡在操盤者身上的赤裸展現。"}, {"p": "心理較量（看誰先崩潰）", "a": "站在斗争的这个角度看待股市上的这种争斗，可能更显得合理一些", "n": "以陰陽相生相剋解讀股市，揭示莊散較量實為心理承受力之爭。"}, {"p": "孤獨與異化", "a": "思绪再次游弋到节前的行情，确确实实我无法判断我的决策是否正确", "n": "歸鄉仍被股海牽絆、以謊言粉飾孤獨，職業投資人的疏離躍然紙上。"}, {"p": "死亡焦慮", "a": "父亲那时候最担心的就是怕我不能长大，因此，在这方面他总是显得很虔诚", "n": "篝火避邪的虔誠儀式，折射出父親對孩子無法長大的死亡焦慮。"}]}, {"i": 9, "title": "第九回　父子炉前忆股潮", "kind": "hui", "summary": ["主角以煮麵開場，思緒飛回初到上海那日，於外灘望江水感慨商海興衰與人事無常，職業生涯的蒼涼由此鋪開。", "父親問主角職業，主角自稱買賣股票如做生意，父親卻急於向村人證明此非賭博，折射炒股身份背後的道德焦慮與合理化。", "憶1992年5月，8日突破460點、20日尾盤放量急拉、21日救市政策令股市暴漲600點，壓抑的群體情緒瞬間釋放。", "主角坦承大資金最難是出貨，須極力營造「還要漲1000點」的架勢，讓眾人希望值遠超實際，正是莊家情緒操縱的核心。", "主角憂心散戶一旦領悟「跌了進貨、漲起就跑」的規律市場便難玩，末尾父子對坐吃麵，只剩兩人的年，盡顯孤獨與異化。"], "qa": [{"q": "主角為什麼必須「極力作出向上還要漲1000點的架勢」？這體現莊家什麼心理戰術？", "a": "因為大資金最難的是遠離持倉成本後的出貨，必須以「還要漲1000點」的誘多架勢讓人人對未來充滿希望，且希望值遠大於初始願望，這是典型的誘多與情緒操縱戰術。"}, {"q": "5月20日尾盤放量急拉、21日暴漲600點，主角為何如釋重負？", "a": "8日傳來的消息終於在20日被證實，被壓抑的感覺一下子釋放；暴漲大大縮短了出貨時間，莊家最怕的漫長出貨因群體狂熱而提前完成，所以他通知所有人到茂名路喝酒。"}, {"q": "「萝卜快了不洗泥」「雞犬升天」反映散戶什麼群體心理？", "a": "行情一來所有股票齊漲、不需選擇，反映散戶不辨個股、盲目跟風的羊群效應；主力正是利用這種從眾心理，在人人看好時輕鬆完成出貨。"}, {"q": "主角為何擔心散戶「下跌以後才進貨、漲起來就跑」？", "a": "散戶若都按此規律行事，思維一旦簡單化，這個市場就難弄了，遊戲沒法再玩；莊家的獲利正建立在散戶追漲殺跌、屢屢被情緒牽著走的錯誤之上。"}, {"q": "主角為何奇怪「人們為什麼就不觀察一下股票的走勢規律」？", "a": "他既盼散戶永遠蒙在鼓裡，又深知規律一旦被眾人看破、思維簡單化，自己賴以生存的博弈便無法繼續，這種矛盾正是莊家對群體認知水平的恐懼。"}, {"q": "1992年5月8日、5月20日、5月21日股市分別發生什麼？", "a": "8日股票價格突破460點後行情根本逆轉；20日死氣沉沉的大盤收盤前不到半小時忽然放大量急拉，壓抑感釋放；21日三大救市政策令股市暴漲600點，主角也驚呆了。"}, {"q": "父親為什麼想努力弄明白主角的工作？", "a": "他總想按自己的理解盡量搞清楚，這樣就可以告訴村人這個工作和賭博有區別，免得村上的人都說主角在外面賭博，既是維護兒子的名聲，也折射對炒股職業的世俗偏見。"}, {"q": "主角向父親解釋工作時為何說「差不多跟做生意一樣」？", "a": "用「做生意」的框架自我合理化炒股，迴避賭博的道德污名，是認知失調下的說辭，讓職業在親情與鄉鄰面前顯得更體面、更可理解。"}, {"q": "北京朋友與主角對上海女人的看法有何不同？", "a": "朋友只讚上海女人能打扮、什麼髮型都好看；主角笑說「你可能沒有看到她們精明的那一面」，點出光鮮外表之下精明能幹才是本色。"}, {"q": "本章結尾「過我們只有兩個人的年」傳達主角怎樣的內在狀態？", "a": "縱使縱橫股市、呼風喚雨，職業投資人的情感世界卻孤寂疏離；父子對坐吃麵的溫馨與蒼涼並存，是主角內心異化、遠離人群的寫照。"}], "quotes": ["看着缓缓流动的黄浦江水，我感慨千百年来，就是在这个黄浦江的两边发生过多少悲欢离合,也曾发生过多少的商海沉浮", "5月21日三大救市政策刺激得整个股市就像屁股挨了一鞭子的野马，一下子就蹿得老高，600点的涨幅让我也惊呆了", "你必须极力地作出一种向上还要涨1000点的架势，你也必须让人和人对市场的未来充满希望，而且这个希望值远远大于人们的初始愿望", "我总是奇怪，也根本想不明白，人们为什么就不观察一下股票的走势规律", "中国有句古话：“萝卜快了不洗泥。”稍微有点行情所有的股票都是鸡犬升天，哪有一只不好的？"], "psych": [{"p": "情緒操縱", "a": "你必须极力地作出一种向上还要涨1000点的架势，你也必须让人和人对市场的未来充满希望", "n": "莊家以誘多架勢操控大眾預期，讓希望值遠超現實，方能順利出貨。"}, {"p": "羊群效應（從眾）", "a": "稍微有点行情所有的股票都是鸡犬升天，哪有一只不好的？", "n": "行情一來齊漲齊跌，散戶不辨個股盲目跟風，正好被主力利用。"}, {"p": "心理支撐位", "a": "股票价格突破460点以后，整个行情发生了根本性的逆转", "n": "460點成為關鍵點位，突破後行情逆轉，顯示點位對群體心理的定錨作用。"}, {"p": "孤獨與異化", "a": "面条做好了，我和父亲还像我小时候一样坐在一起，过我们只有两个人的年", "n": "縱橫股市的莊家年節僅餘父子二人，職業生涯換來的是孤獨與疏離。"}]}, {"i": 10, "title": "第十回　煤油燈下話滄桑", "kind": "hui", "summary": ["除夕父子圍爐，父親年老體衰改由兒子掌勺，父親在旁燒火打下手，看起來比兒子還忙。", "主角向父親講述砸盤建倉、誘多出貨的操盤手法，父親一句「這不是騙人嗎」直擊職業良心。", "村會計一句「假錢」讓父親拒收美金，一樁誤解足以撼動最樸素的信任，主角心頭苦澀。", "父親攢一萬餘元為兒娶媳，主角聞之落淚點煙，職業的孤獨與家庭的溫情在此交織。", "主角謊報禮物價錢哄一生節儉的父親，煤油燈下望見蒼老面容，心中陣陣發酸。"], "qa": [{"q": "庄家建仓用的是什么心理战术？主角如何向父亲描述？", "a": "先买一点股票低价卖出去，引诱大家都跟着卖出，等众人抛售后再低价买回，三番五次折腾直至买进大把股票——利用散户恐慌跟风完成建仓。"}, {"q": "建仓完成后，庄家如何把便宜买回的股票卖出去？", "a": "把自己手中的股票高价卖出高价买回来，引诱那些不知道内幕的人跟进，就这样一直折腾下去，把便宜买回的股票高价卖出去赚差价。"}, {"q": "父亲问别人怎么知道买卖股票很害怕，主角如何回答？", "a": "主角说天天这样宣传的，外国也有人亏了钱自杀的，这在国外很常见——庄家靠反复宣传与亏钱自杀的恐慌叙事，让大众对风险深信不疑。"}, {"q": "父亲听完儿子的操盘手法后作何评价？", "a": "父亲直言「这不是骗人吗？」以内心善良的道德标准衡量，他始终认为这不是好事情，又不明白国家怎么会允许这样的市场存在。"}, {"q": "主角如何为操纵股价的行为自我开脱？", "a": "他说也算不上是骗人，国外也有专门成立机构以资金实力控制股价走势；且人人明知风险大、可能倾家荡产仍愿参与，因为只有这个市场来钱亏钱最容易。"}, {"q": "父亲为什么认定美金是假钱？体现了什么心理现象？", "a": "因为村会计说这钱跟其他钱不一样、哪有100块钱就那么窄一点、上面的像还像外国人，父亲便信以为真拒收——权威一句话即可如谣言般在乡间传开。"}, {"q": "主角为什么无法向父亲讲清自己的工作与汇率？", "a": "父亲的道德标准衡量这份工作是坏事，又不能明白国家为何允许；汇率、市场运作这些职业知识父亲也听不懂，主角只能岔开说闲话——精神世界日渐疏离。"}, {"q": "主角如何解释人们明知股市风险大仍愿意参与？", "a": "因为只有这个市场来钱和亏钱最容易，人人都知道可能倾家荡产，但暴利的诱惑盖过了恐惧，所以人们都愿意参与这个市场的交易。"}, {"q": "父亲为儿子攒钱做什么？儿子听后有何反应？", "a": "父亲说二叔给孩子娶媳妇花了2万多，自己这几年攒了1万多，再攒一年就差不多，等儿子娶媳妇时用；儿子眼泪不由自主流了出来，转身点烟。"}, {"q": "主角为什么买任何东西都向父亲报「便宜」的价？", "a": "父亲一生节俭，因家里太穷从没花过大钱，一直反对儿子大手大脚；主角只好谎称东西很便宜才买来，这样父亲听了才高兴。"}], "quotes": ["父亲说：“这不是骗人吗？”我说：“也算不上是骗人，这在国外也有这样的做法，有些国家专门成立了这样的单位，就是利用这些单位的资金实力，控制股票价格走势。", "我们一般在开始的时候先买一点股票，低价卖出去引诱大家都跟着我们卖出，等他们卖出的时候我们再在低价的时候买回来，就这样三番五次地折腾", "天天这样宣传的，外国也有人亏了钱自杀的，这在国外很常见的。", "村上的会计说，这是假钱，跟其他的钱不一样", "透过煤油灯的光亮，看到苍老的父亲的面孔，我心里一阵阵的发酸。"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "我们一般在开始的时候先买一点股票，低价卖出去引诱大家都跟着我们卖出，等他们卖出的时候我们再在低价的时候买回来", "n": "庄家故意压价诱使散户恐慌割肉，正是砸盘建仓的心理战术。"}, {"p": "認知失調／合理化", "a": "我说：“也算不上是骗人，这在国外也有这样的做法，有些国家专门成立了这样的单位，就是利用这些单位的资金实力，控制股票价格走势", "n": "主角以国外先例与风险自担为由，为操纵市场的行为自我开脱。"}, {"p": "道德衝突／罪疚感", "a": "父亲越听越糊涂，但是在他心里总是认为这不是好事情，何况这个事情是从国外来的。", "n": "父亲的质朴道德质问，使主角的职业成为一场良心的拷问。"}, {"p": "孤獨與異化", "a": "这其中的原因我给父亲讲不清楚，也就不多讲了", "n": "职业投资人无法向至亲讲清自己的工作，精神世界日渐疏离。"}]}, {"i": 11, "title": "第十一回　村口别父赴股海", "kind": "hui", "summary": ["股市節奏凌駕節日人情，主角心繫初五開盤，年假未盡已須返滬，年味匆匆而過。", "主角自責「要是沒念書該多好」，卻以叛逆性格註定漂泊為由自我開脫，離鄉抉擇充滿內在衝突。", "回憶家族團拜、盼姊姊送燒餅洗衣的童年，鄉土人情是主角情感的原鄉，也是他告別的溫柔參照。", "父子村口淚別，父親明知主角不會回家，仍天天在村口等候，執念守望折射分離之痛與孤獨。", "章末主角重返繁華喧囂的上海，從親情故土回到股海搏殺之地，職業投資人的孤獨異化已然註定。"], "qa": [{"q": "主角為何感嘆「要是沒有念書該多好」？他如何自我開脫？", "a": "他後悔念書離鄉，無法陪父親過一個完整的年；隨即以「叛逆性格根本不具備在家鄉長久生存的可能」為離鄉開脫，是認知失調後的自我合理化。"}, {"q": "主角對「明天就是初五」的反應，暴露了他怎樣的心態？", "a": "他抱怨年假太短，不明白為何不利用過年多休息，顯示股市開盤的節奏已凌駕節日人情，職業的時鐘支配了他的生活與情緒。"}, {"q": "離別場景中，父子各自用了什麼心理防禦來承受分離之痛？", "a": "主角努力克制感情、以「大人」自居強裝堅強；父親默默不做聲，流淚哆嗦說不出話，用沉默壓抑不捨：一個理性壓抑，一個無言承受。"}, {"q": "父親「明知道我不可能回家，還是天天在村口等候」，體現了什麼心理？", "a": "明知無望仍日日守望，是思念與不捨驅動的非理性執念；等候本身成了老父寄託情感、對抗孤獨與空虛的唯一方式。"}, {"q": "主角把故鄉親情與城市工作對立起來，反映了他內在怎樣的矛盾？", "a": "他眷戀與父親團聚的溫情，卻深知自己註定漂泊無法久留；親情歸屬與職業歸屬在他心中互相撕扯，構成他日後異化的起點。"}, {"q": "正月初一村子裡有什麼風俗？主角怎麼看待？", "a": "以家族為單位挨家挨戶拜年、成群結隊團拜，若哪個家族不派人拜年會被看作沒有教養；主角認為這與國家級團拜一樣，主要是加強聯繫。"}, {"q": "主角童年最深的回憶與姊姊有關，具體是什麼？", "a": "他整天盼姊姊來家，才能吃一頓可口的飯菜；姊姊每週來一次幫父子洗衣服，那時條件差，穿的都是打滿補丁的衣裳，破了就眼巴巴等姊姊來。"}, {"q": "「喜鵲叫」一段寫了什麼童年場景？", "a": "主角在院子裡玩，聽到樹上喜鵲叫就大聲喊「我姐來了」，急忙跑出院門，果然見姊姊提著一提兜自家做的燒餅；他接過燒餅大搖大擺走在前面，十分自豪。"}, {"q": "離家時父親叮嚀了什麼？主角如何回應？", "a": "父親叮嚀路上小心、早點吃飯、晚上別出去、城裡人多車多要照顧自己；主角哭著叫父親「伯」，說自己已是大人，請父親好好照顧自己、別再幹活。"}, {"q": "章末主角如何返回上海？與老家形成什麼對比？", "a": "他坐兩小時汽車、兩小時飛機回到繁華喧囂的上海，與貧寒寧靜的鄉村老家形成鮮明對比，也預示他將重新投入初五開盤的股市生活。"}], "quotes": ["我要是没有念书该多好，我就可以在家了，最起码能和父亲在一起过一个完整的年。", "我性格里边的那种叛逆精神，根本就不具备让我在这儿长久生存下去的可能", "我努力地克制自己的感情，父亲依然眼巴巴地看着我，眼泪不断地在流，嘴巴哆哆嗦嗦地说不出话", "后来我知道我走后父亲就这样天天在村口看，天天如此，他明知道我不可能在这个时候回家，但是他还是忍不住地天天在这儿等候。", "坐了两个小时的汽车，2个小时的飞机，我回到了这个繁华喧嚣的都市上海。"], "psych": [{"p": "孤獨與異化", "a": "我性格里边的那种叛逆精神，根本就不具备让我在这儿长久生存下去的可能", "n": "以叛逆性格註定漂泊為宿命，注解職業投資人式疏離與回不了家的異化。"}, {"p": "認知失調／合理化", "a": "我想即使我没有干到目前的工作，那么至少也是一个游走四方，闯天下的打工仔。", "n": "把離鄉開脫為「反正也要闖天下」的必然，是對痛苦抉擇的自我合理化。"}, {"p": "道德衝突／罪疚感", "a": "这个时候的我总是非常地恨自己：“我要是没有念书该多好，我就可以在家了，最起码能和父亲在一起过一个完整的年。", "n": "無法陪伴年邁父親的自責與罪疚，是主角內心道德衝突的呈現。"}, {"p": "死亡焦慮", "a": "你要好好照顾你自己，你现在这么大岁数，就不要再干活了。", "n": "叮嚀父親「歲數大、別再幹活」，流露對父親衰老與離別無常的隱憂。"}]}, {"i": 12, "title": "第十二回　萬人搶籌我獨清", "kind": "hui", "summary": ["主角與父親離別後鬱鬱抵滬，孤獨心境中更添對市場的警覺。", "大盤高開猛漲，他看遍指標仍堅守出貨，謹防自信淪為自負。", "領導慫恿反手加倉，他卻因三月漲幅逾三倍而無法定下盈利目標。", "新開戶增四成、老人入市、人人籌錢，群體狂熱令他脊背發涼。", "BR值兩倍於AR值，他識破莊家趁眾人情緒派發，決意三日清倉獨醒。"], "qa": [{"q": "大盤高開上衝時，主角為何「百思不得其解」仍不敢放棄出貨決定？", "a": "他看遍所有技術指標卻無一支持出貨，深恐沒有依據的自信成了自負；這正是自我懷疑與市場表象之間的認知失調。"}, {"q": "領導提議反手加倉，主角為何「無法說服自己內心的那種恐慌」？", "a": "由400點啟動、不足三個月漲幅逾300%，他為即將投入的資金無法確定盈利目標，理性算賬勝過了對暴利的貪念。"}, {"q": "主角查完數據後「感到脊梁骨發冷」，說明了什麼群體心理？", "a": "新開戶增逾四成、老人與外地客湧入、大戶滿倉無人交易——眾人一致樂觀、爭相籌錢，典型追漲與開戶潮狂熱令他警覺。"}, {"q": "「有股票就持有，到底是誰在出貨」的疑問揭示了什麼？", "a": "全場只買不賣、無人願出貨時必有隱形賣方；他由此悟出統一與寂靜過後將產生更大震動，這是逆向思維的清醒時刻。"}, {"q": "BR值高於AR值兩倍半，主角得出什麼結論？", "a": "在眾人興奮衝動之際，有一個理智冷靜者在暗處悄悄提供入市籌碼——莊家正利用大眾情緒派發，這是最典型的「情緒操縱」。"}, {"q": "看盤人罵主角「你腦子有毛病啊」，反映了什麼心理？", "a": "漲勢中人人自覺理所當然，把風險提示當成異類；這是群體狂熱下的認知封閉，主角因此成了眾人眼中的「外星人」。"}, {"q": "蹬黃油車的人說「幾天就賺好幾百，傻瓜才不炒股」，屬於哪種心理？", "a": "暴富敘事刺激下人人躍躍欲試，連底層勞動者也認定股市是提款機；攀比與暴富傳說令散戶忽視風險、爭相入場。"}, {"q": "主角吩咐助手查了什麼數據？結果如何？", "a": "查最近新開戶人數與大券商客戶交易情況；結果新開戶增40%還多，外地客戶與老年人佔相當比例，大券商客戶幾乎全部滿倉。"}, {"q": "主角最終做出什麼決定？", "a": "他不同意加倉，要求三天內把股票全部出完，比原計劃減掉一半時間，並沒等領導罵完就掛斷電話。"}, {"q": "主角為何寧可與領導決裂也要執意清倉？", "a": "他靠數據與逆向思考對抗全場狂熱，寧可孤獨清醒也不隨波逐流；這種與眾隔絕的堅持，正是職業投資人內在異化的寫照。"}], "quotes": ["在这个市场上很多人失败都是因为自负的缘故，我是不是错了？", "我发现每个人都对未来满怀信心，人人都在想方设法筹集资金，我感到脊梁骨发冷。", "当所有的思路和矛盾都归于统一的时候，那么新的裂变马上就会发生，而且这种发生在战场上的统一和寂静过后将会产生更大的震动。", "那个人回过头像看外星人一样看着我说：“你脑子有毛病啊？才涨了几天啊，就怕成这样子。”", "炒啊，干什么不炒，几天就赚好几百，傻瓜才不炒股。"], "psych": [{"p": "追漲（貪婪）", "a": "我再看看柜台前人们争先恐后地在存钱，柜台后面的小姐根本谈不上什么服务态度，能让你早早存上钱就算帮你忙了，还计较什么态度，人们确实疯狂了。", "n": "櫃台前爭先存錢、人人認定漲勢才剛開始，是典型追漲貪婪的寫照。"}, {"p": "心理帳戶／開戶潮", "a": "新开户数增加了40％还多，短短的三个月时间居然这么厉害，看来股市确实涨了，涨得在家坐着的人都坐不住了。", "n": "新開戶激增四成、老人與外地客入市，注解開戶潮背後的群眾心理。"}, {"p": "情緒操縱", "a": "在大家极为兴奋、冲动的时候，有一个比较理智、冷静的人，在我们看不到的地方在悄悄地给大家提供入市的筹码。", "n": "莊家趁眾人興奮衝動時暗中派發籌碼，注解其操縱大眾情緒的手法。"}, {"p": "孤獨與異化", "a": "那个人回过头像看外星人一样看着我说：“你脑子有毛病啊？才涨了几天啊，就怕成这样子。”", "n": "獨醒的主角被狂熱大眾視為外星人，注解職業投資人的疏離與異化。"}]}, {"i": 13, "title": "第十三回　跳空惊澜独醒时", "kind": "hui", "summary": ["一九九三年一月二十九日清倉離場，大盤收於一千二百點附近，漲勢一時難止。", "咖啡館聚會眾人一致看好，唯獨主角警示過熱與開戶資金風險，爭論無果，清醒者反成局外人。", "新股與降印花稅傳言刺激預期，行情往往一邊倒，芝加哥咖啡期貨之例印證預期自我實現。", "週一開盤跳空高開，乃爆發行情第四個缺口，全日強勢交易，幾乎沒有回調。", "以足球裁判為喻：看裁判、看對手、心繫資金，隨時向有利方向調動，方能穩贏；訓斥助手後情緒稍緩。"], "qa": [{"q": "聚會中眾人為何一致看好、無人理會主角的警告？這反映什麼群體心理？", "a": "眾人見技術指標沒有一個偏空，又因春節後股市漲得好而興高采烈，一致看多；這是典型的羊群效應，群體觀點趨同，使清醒者反成局外人。"}, {"q": "主角不願加倉的核心理由是什麼？他如何看大資金的處境？", "a": "他認為市場太熱，存量資金因上漲幾乎不交易，參與交易的幾乎全是新開戶資金，一旦風吹草動，新錢不進、舊錢離場，後果可怕；大資金進出困難，反成弱勢。"}, {"q": "報上傳言新股額度不大、印花稅或降，主角為何斷定星期一股市會發瘋般上漲？", "a": "他認為行情往往一邊倒，這正是預期心理的作用：無論傳言真假，只要眾人形成上漲預期，價格便會向預期方向走去，預期自我實現。"}, {"q": "芝加哥咖啡期貨的例子說明什麼心理學規律？", "a": "颱風使咖啡減產，期貨卻不漲反跌，因為人們預期經銷商會大量進口；影響價格變動的並非基本面轉變，而是人們的預期心理，共識即方向。"}, {"q": "主角提到北方機構一九九二年五月二十七日的遭遇，用意何在？", "a": "他以此警告：若逆轉非由自己資金引起，逆轉過程便是走入滑鐵盧的第一步，屆時根本沒有出貨機會；這是莊家與市場的心理較量，看誰先崩潰。"}, {"q": "主角如何用踢足球比喻股市中的心理博弈？", "a": "足球場上球員只須拼搏，不必看裁判眼色；股市卻要一隻眼看裁判、一隻眼看對手，把心放在自己資金上，隨時向有利方向調動，才能穩贏。"}, {"q": "主角為何斷言營業部大廳那些傻看行情的股民賺不到錢？", "a": "他認為不能想像不勞而獲，站著看一天價格變動並非真本事；若股民都能賺錢，全中國行業都會關門。此言暗含對散戶從眾盲動的輕蔑。"}, {"q": "主角清倉後「憂心忡忡」「忐忑不安」，反映了他怎樣的心理狀態？", "a": "他清醒卻與眾人分歧，成為局外人，既怕市場繼續上漲使自己告別市場，又被預期心理折磨；訓斥助手發洩情緒後方稍安，職業投資人的孤獨與異化盡顯。"}, {"q": "星期一開盤出現跳空缺口，為何主角早已預見強勢行情？", "a": "因預期心理與開戶資金湧入，加上新股、印花稅傳言刺激，行情往往一邊倒；跳空缺口已是爆發行情中第四個，全日強勢交易幾乎沒有回調，驗證其判斷。"}, {"q": "主角訓斥助手後為何提早離開辦公室？", "a": "一場淋漓盡致的訓斥使壓抑三天的情緒有所發洩，心情好許多；但他最怕見到領導那張圓呼呼的胖臉，遂早早離去，可見其對外界的戒慎與疏離。"}], "quotes": ["由于在观点上的分歧，我几乎成了局外人，可能是朋友们照顾我的情绪，希望我能说说怎么不愿意加仓的理由。", "在这样的局面下一旦有风吹草动，外面的新开户资金不介入，里面的资金开始离场，那么那种局面是非常可怕的", "影响价格变动的并不是基本情况的转变，而最主要的就是人们的预期心理", "但是，股市却不一样，我们不仅仅要看对手的眼色，更重要的是要看裁判的眼色，这样我们才能稳赢。", "我们就是操纵市场价格的人，我们的资金进出是发生在技术指标之前"], "psych": [{"p": "羊群效應（從眾）", "a": "你看看所有的技术指标没有一个是偏空的，即便是要逆转也需要一个过程", "n": "眾人一致看好、無一唱空，群體觀點趨同，清醒的主角反而成了局外人。"}, {"p": "信息瀑布（謠言市）", "a": "这就是人们对这种预期达成共识，价格就会向人们预期的方向走去。", "n": "新股與降稅傳言經預期自我實現，價格隨集體預期而行，正是謠言市特徵。"}, {"p": "心理帳戶／開戶潮", "a": "参与交易的资金几乎全部是新开户资金", "n": "新資金蜂擁入市正是開戶潮信號，主角據此預警行情脆弱、隨時反轉。"}, {"p": "孤獨與異化", "a": "由于在观点上的分歧，我几乎成了局外人", "n": "清醒的職業投資人在群體狂熱中與眾疏離，孤獨與異化油然而生。"}]}, {"i": 14, "title": "第十四回　股海虚火K线凉", "kind": "hui", "summary": ["主角從K線的缺口、縮量、上影線讀出市場虛弱，獨醒的輕鬆與眾人狂熱的苦悶交織。", "莊家利用人們對第八屆人大會議過高的心理預期發動行情，利好兌現後消息便失去價值。", "股指已達1300點，眾人忘乎所以忽略點位，領頭羊回調近半，大盤僅靠少數股票支撐續漲。", "營業部買進櫃前人擠人、賣出櫃前寥寥無幾，豫園商城百元狂漲萬元的暴富敘事刺激發財神經。", "K線源於日本米市依排隊人數定價，主角以中國古代哲學支撐K線分析，自認能把握市場。"], "qa": [{"q": "從心理博弈的角度看，莊家（大資金運作者）在本章發動行情時運用了什麼心理戰術？", "a": "莊家充分利用人們對第八屆人大會議過高的普遍心理預期來發動行情，讓行情如眾人所願地展開——借大眾預期自我實現來誘多，這正是典型的利用群體心理操縱走勢。"}, {"q": "為什麼「會議開完就是利好兌現」，消息一旦證實就失去價值？", "a": "因為支撐股價上漲的本來就不是消息本身，而是眾人對消息的心理預期；一旦預期兌現、消息被證實，行情便失去心理支撐，如同預期自我實現之後瀑布式退潮。"}, {"q": "股指已達1300點，眾人為何「瘋狂得忘乎所以」、忽略點位？", "a": "狂熱使人們喪失對整數關口1300點這一心理定錨的警覺，心理預期進一步膨脹，即使領頭羊已回調近半、大盤僅靠少數股票支撐，眾人仍視而不見地追漲。"}, {"q": "營業部買進櫃台前人擠人、賣出櫃台前寥寥無幾，反映了散戶什麼群體心理？", "a": "這是典型的羊群效應與追漲貪婪：眾人一致看多、只進不出，跟風大眾的熱情淹沒了理性判斷，與主角從K線讀出的危險訊號形成強烈反差。"}, {"q": "豫園商城的暴富事例為何能時刻刺激眾人？", "a": "100元發行短短幾個月狂漲到10000元，這種暴富敘事勾起攀比與暴富幻想，刺激著發財神經，讓更多人湧進買進櫃台追高，群體熱情因此不斷升溫。"}, {"q": "主角看到市場虛弱跡象時，為何感到輕鬆的同時又無比苦悶？", "a": "輕鬆是因提前看穿風險、可以及早應對；苦悶則因身處眾人狂熱之中獨自清醒，無人聽從自己的判斷，職業投資人的孤獨與異化令他無可奈何。"}, {"q": "主角如何用K線解讀今天市場的供需變化？", "a": "成交量就是排隊的人數，K線就是米價的牌子：縮量說明排隊買進的人變少，上影線說明高位拋出的人太多、已有人擔憂價格太高，供需天平正悄然傾斜。"}, {"q": "K線最早源於哪裡？米店老闆當初是如何定價的？", "a": "K線最早來自日本米市：米店老闆在門前掛上一塊可自由填寫價格的牌子，依每天排隊人數多少決定米價——人多了價格上漲，人少了價格下跌，再據此決定進貨量與價格。"}, {"q": "這一波行情的原始起因是什麼？", "a": "1992年2月鄧小平南巡講話全面公開，引發一輪瘋狂漲勢，人們對政策的敏感與種種預期自此而起；本次又借助第八屆人大會議的召開與過高的心理預期，行情如人所願發動。"}, {"q": "在眾多技術分析方法中，主角為什麼最喜歡K線？", "a": "因為K線簡單、實用，更重要的是它具有中國古代哲學這一高深理論的支撐；他相信以古代哲學觀照K線，可以將這個虛擬的市場把握得淋漓盡致。"}], "quotes": ["缺口、上影线、缩量、涨幅减少，我从这根K线上，看出了市场虚弱的迹象，为此我感到轻松的同时，也感到无比的苦闷。", "大资金的运作者也充分利用了人们的这种普遍的心理，发动了行情。", "假如人大开会是利好，那么这个会议开完了就是利好兑现，对于资本市场来说一旦某一个消息被证实的话，那么这个消息也就失去了价值。", "人们津津乐道的就是豫园商城100元的发行价，短短几个月就狂涨到10000元的高价，这种暴富的事例时时刻刻在刺激着人们发财的神经", "买进的柜台前人挤人，而卖出的柜台前却聊聊无几。"], "psych": [{"p": "情緒操縱", "a": "大资金的运作者也充分利用了人们的这种普遍的心理，发动了行情。", "n": "莊家借大眾對人代會過高的心理預期順勢發動行情，注解情緒操縱之術。"}, {"p": "錨定效應", "a": "股指经过这段时间的上涨，已经达到1300点，但是人们疯狂得忘乎所以，已经忽略了这个点位", "n": "1300點整數關口本具心理定錨意義，狂熱中人卻忽略點位、預期失控。"}, {"p": "攀比與暴富敘事", "a": "豫园商城100元的发行价，短短几个月就狂涨到10000元的高价，这种暴富的事例时时刻刻在刺激着人们发财的神经", "n": "百元狂漲萬元的暴富傳說刺激發財神經，注解攀比與暴富敘事之力。"}, {"p": "孤獨與異化", "a": "缺口、上影线、缩量、涨幅减少，我从这根K线上，看出了市场虚弱的迹象，为此我感到轻松的同时，也感到无比的苦闷", "n": "眾人狂熱中主角獨自看穿虛弱，輕鬆與苦悶並存，注解職業投資人的疏離。"}]}, {"i": 15, "title": "第十五回　回光返照梦难眠", "kind": "hui", "summary": ["大資金運作者坦言：操盤本質是把握人的心理，開盤半小時即打破散戶預先設想的投資計劃。", "K線是心理寫照：上影小陽示人心謹慎，長下影陰線是恐慌釋放，主力藉走勢撫平大眾恐懼。", "縮量回補缺口實為回光返照：主力謹小慎微維護價格，實則維護投資者信心，誘使眾人保持美妙想像。", "尾市急拉點燃踏空者悔恨，媒體添油加醋，群體情緒被集體放大，眾人竟怨證監會不開夜市。", "主角一意孤行逆領導指令，行情上漲似證其錯，職業投資人在孤獨與自我懷疑中漸被異化。"], "qa": [{"q": "主角為何說今天的高開帶有「欺騙」的味道？莊家運用什麼心理戰術？", "a": "昨日整日弱勢、尾市勉強拉起，今日卻高開，目的是吸引更多人追進，再一路下跌，令上午進場者想走也走不掉——這是典型的誘多戰術，利用散戶的追漲心理製造接盤。"}, {"q": "主角認為真正要漲，開盤應如何表現？這體現了怎樣的博弈心理？", "a": "真漲勢必低開下砸，把意志不堅定者在開盤就趕出去，再迅速拉起，讓其在悔恨中度日。因為大資金運作主要就是把握人的心理，一開盤就打破人們預先想好的投資計劃，正是心理較量。"}, {"q": "散戶如何被K線走勢所安撫？主力如何藉圖形操縱大眾情緒？", "a": "長下影線讓散戶感到主力資金強大，無形中產生安全感；主力藉走勢有意識告訴人們「不要怕」，恢復信心、消除謹慎，讓人們對未來產生更美妙的想像，圖形遂成為情緒操縱的工具。"}, {"q": "為什麼說回補缺口是「回光返照」？這對散戶意味著什麼？", "a": "大振幅回補昨日缺口，說明缺口已不再意味突破而是最後的誘多；主力謹小慎微維護價格，實則維護投資者信心，不能讓市場感到不安與恐懼——越是掩飾，越見出貨已成事實。"}, {"q": "成交量萎縮對散戶與莊家分別意味著什麼？", "a": "縮量說明跟風資金不多，對處於出貨階段的大資金是致命信號；對散戶而言，缺乏跟風即缺乏接盤，一旦主力撤退，恐慌性拋售便無人承接，損失被迅速放大。"}, {"q": "本章描述的行情中，大盤開盤後走勢如何？高低點各是多少？", "a": "早上略微高開衝高後一路下跌，最高點1320點左右，最低跌至1260多點，振幅60多點；上午跟進的人絕對出不來，強行出貨就要以虧損為代價。"}, {"q": "尾市急拉後，踏空者為何整夜難眠？媒體在其中起什麼作用？", "a": "沒買進的人會在自責與激動中度過漫漫長夜，後悔自己愚昧；電視電台再添油加醋地描述分析，群體情緒互相放大，眾人竟責怪證監會為何不開夜市交易——信息瀑布與群體極化由此成形。"}, {"q": "主角與領導之間發生什麼矛盾？主角如何應對？", "a": "領導連日不高興，因主角未遵指令、一意孤行不再介入資金；行情上漲似乎在證明領導對了、主角錯了，主角在壓力與孤獨中堅守自己的判斷。"}, {"q": "主角為何感嘆「不知道是誰創造了心理學」？心理學對操盤有何用？", "a": "因為心理學與古代哲學對他的實際工作指導極大：K線反映人心，大資金運作就是把握人的心理、打破其既定計劃，所以他對創造這些智慧的人感激不盡。"}, {"q": "主角目睹機構加速出貨卻讚嘆其操作水平，反映了他怎樣的心理狀態？", "a": "他一面看清出貨事實，一面驚嘆同行把行情把握到這種地步，並歸因於股市規模小；職業投資人隔岸觀戰，理性與感嘆並存，透出孤獨與異化下的冷眼旁觀。"}], "quotes": ["其实，运作大资金主要就是把握人的心理，在一开盘就打破人们的预先想好的投资计划。", "但是我们从今天这么大振幅回补了昨天的缺口，就足以说明现在的缺口已经不是意味着突破，而是一种回光返照。", "这时候千万不能让在市场上的所有参与者感到丝毫的不安和恐惧，一定要让大家对未来有一个更为美妙的想象。", "紧接着就是一根带有长长的下影线的阴线，也伴随着萎缩的成交量，这是有人为了恢复人们的信心，消除人们心中的这种谨慎，有意识地告诉人们：‘不要怕，你看看不是涨起来了吗？’", "没有买进的人们一定会在对自己的不满和对行情的激动之中度过漫漫的长夜，后悔自己没有买进的行为是多么的愚昧"], "psych": [{"p": "情緒操縱", "a": "紧接着就是一根带有长长的下影线的阴线，也伴随着萎缩的成交量，这是有人为了恢复人们的信心，消除人们心中的这种谨慎", "n": "主力藉尾市拉升與圖形語言撫慰大眾，操縱集體情緒以利自己出貨。"}, {"p": "心理較量（看誰先崩潰）", "a": "运作大资金主要就是把握人的心理，在一开盘就打破人们的预先想好的投资计划", "n": "開盤半小時擊潰散戶既定計劃，雙方比拼誰先動搖、誰先認輸。"}, {"p": "錨定效應", "a": "最高点在1320点左右最低跌倒1260多点，振幅达到60多点", "n": "千點關口與昨日高低點成為心理定錨，牽動眾人的買賣抉擇。"}, {"p": "信息瀑布（謠言市）", "a": "看到电视或者听到电台对今天走势的添油加醋地描述和分析", "n": "媒體添油加醋的報導擴散訊息，集體放大踏空者的悔恨情緒。"}]}, {"i": 16, "title": "第十六回　密谋托市夜深沉", "kind": "hui", "summary": ["莊家密謀托市：政策將出、出貨時間不足，主角被迫再度入市扮演接盤者。", "輿論造勢：找專家評論、放風聲、行情配合，用心理戰穩住市場預期。", "群體心理：樓下股民人人自封專家、談笑風生，與即將崩盤的真相形成反差。", "主角異化：罪孽感日益深重，紅酒如血幾欲作嘔，職業投資人的孤獨疏離。", "莊家互搏：各席位虧損自負，利益同盟在危局中互相算計、誰也不肯吃虧。"], "qa": [{"q": "莊家們準備用哪些心理戰術穩住市場？", "a": "他們找專家開始評論、有意識地放出風聲，再以行情配合，用輿論造勢穩住散戶預期，讓市場承接力看起來仍然強勁，這是典型的情緒操縱與信息瀑布。"}, {"q": "主角為何在出貨前查大券商客戶交易與各地新開戶情況？", "a": "他透過客戶交易與開戶數據判斷市場承接力不足，提前出貨全身而退；這是對群體心理的冷靜偵測，不靠消息與情緒，而靠數據看穿散戶接盤的能力。"}, {"q": "樓下「有錢人」談笑風生、人人自稱資深專家，反映什麼群體心理？", "a": "眾人一致看好行情、人人都有見解，正是羊群效應與倖存者偏差：只看得到賺錢的贏家，看不到即將到來的崩盤，集體樂觀與真相嚴重脫節。"}, {"q": "主角看到紅酒杯為何想吐？", "a": "他知道自己已舉起「鋒利的快刀」卻不能說破；紅酒在他眼中是血，計畫將傷害無數散戶，罪孽感與道德衝突使他生理性地厭惡、幾欲作嘔。"}, {"q": "老胡所說的「麻煩」具體是什麼？", "a": "北京來電稱明日可能出台新股發行額度政策，政策出台後最多只能維持五天強勢，但出清手中貨物至少需十天，時間嚴重不足，成為莊家們的燃眉之急。"}, {"q": "主角制定的托市計畫，體現莊家之間怎樣的博弈？", "a": "五天他托盤眾人先撤、三天眾人助他退出，交易分置各席位、虧損自負——表面團結互助，實則利益切割分明，誰也不願替別人的風險買單。"}, {"q": "有人罵主角「心黑」不願出血時，主角如何反擊？", "a": "他笑答「不願意給我損失，那好你們就交給市場吧」，眾人連連認輸；這是一場心理較量，比誰更敢承受風險，主角以威脅脫離同盟逼對方讓步。"}, {"q": "主角最初的成就感為何被罪孽感取代？", "a": "初入市時每次大贏成就感極強、自認無人能及，但看過有人自殺、經歷越深後，他體會到市場是「趟著一條血河走過」，道德衝突壓過了勝利的快感。"}, {"q": "樓下股民嘲笑主角「踏空」時，為何他格外難受？", "a": "眾人以為他只是看空踏空，不知他正舉刀準備收割；以暴富敘事嘲笑的背後，是散戶與莊家之間巨大的信息鴻溝，也加深了他無人理解的孤獨感。"}, {"q": "主角稱「這兒就是戰場」，表現出怎樣的心態轉變？", "a": "他把股市當成生死搏殺、強調節骨眼上無人退縮，態度冷酷果決；但愈懂殺戮愈感罪孽，冷血的博弈者與自責的旁觀者在他心中互相撕裂。"}], "quotes": ["资本市场走过十年，回首过去，血淋淋的，你是趟着一条血河走过。", "不愿意给我损失，那好你们就交给市场吧！", "你赶快出货吧，傻瓜，你没有看到我已经举起了一把锋利的快刀吗！", "找一些专家开始评论，然后有意识地放一些风声出去，我们这边在行情上配合一下", "这小子，你看看踏空了，难受吧！"], "psych": [{"p": "道德衝突／罪疚感", "a": "我不知道为什么从上次看到那个人自杀以后，我一直有一种深深的罪孽感", "n": "莊家的良心拷問：每次計畫都拿散戶的血淚做代價，罪孽感壓過了勝利的快感。"}, {"p": "信息瀑布（謠言市）", "a": "找一些专家开始评论，然后有意识地放一些风声出去，我们这边在行情上配合一下", "n": "輿論造勢：專家背書加風聲放出，使市場預期沿著莊家設計的方向自我實現。"}, {"p": "羊群效應（從眾）", "a": "我看到下面那群所谓的有钱人，坐在那儿谈笑风生，每个人都有对股市的见解，每个人这时候都是资深的专家", "n": "集體樂觀的溫床：人人自封專家、一致看好，正是莊家趁勢收割的對象。"}, {"p": "孤獨與異化", "a": "我心里感到特别的苦，我想哭！我走过去，有人给我倒上酒", "n": "職業莊家與散戶隔著信息鴻溝，明知真相卻無人可說，愈懂市場愈感孤獨。"}]}, {"i": 17, "title": "第十七回　夜设奇局梦白发", "kind": "hui", "summary": ["主力借助手小张向大户与领导传话，步步设局，酝酿明日建仓的舆论攻势。", "主角自省由外向变孤僻，宁可独往郊外，职业投资者的孤独与异化渐深。", "借领导权力取得资金运作许可，条件快进快出，一场心理战悄然展开。", "午夜密会势利主持人，故意泄密任其炫耀，以虚荣心制造信息瀑布造势。", "梦里白发老大娘哭泣如良心镜像，主角自嘲尔虞我诈，罪疚隐隐发作。"], "qa": [{"q": "主角对助手小张用了什么心理战术？他内心真实的想法是什么？", "a": "他以商量的口气示好，制造被信任的错觉，让小伙子满心释然；内心却暗想「小伙子，我不得不利用你了」，要把小张变成替自己向大户和领导传话的棋子。"}, {"q": "主角为何断定那位主持人会在电视上吹嘘建仓消息？", "a": "他深知这女人势利、爱炫耀的小聪明，故意告知明日建仓又不许外传；正话反说反而激起她的炫耀冲动，断定她不到自己起床就会在电视上吹嘘，正好替庄家造势。"}, {"q": "主角为什么觉得「目的达到了」？这体现了怎样的信息传递心理？", "a": "因为小张必把意思传达给领导，也肯定会通知那些大户，他的举动都可以卖钱；消息沿人脉网络自动逐级扩散，无需亲口宣传，预期便在众人跟风中走向自我实现。"}, {"q": "主角与领导夜谈达成了什么原则？前提是什么？", "a": "原则上他同意领导提出的资金介入建议，但前提是快进快出；他自知是在利用领导的权力，因为他是资金运作人，没有书面许可便无权私自进出资金，必须有人点头同意。"}, {"q": "主角为何觉得自己「变了一个人」？这反映了他怎样的心理状态？", "a": "他自认上学时外向爱交往，工作后却总爱往没人的地方走，连自己都怀疑精神出问题；职业让他日渐孤独疏离，只能以无人之处安放心中的烦躁与不安。"}, {"q": "主角说「我们这个行业为什么少朋友，多利益的伙伴」，含义是什么？", "a": "他一天之内利用了助手、领导、主持人等身边能利用的一切，处处算计、尔虞我诈；深知此行业以利益为纽带，人人在利用别人也被别人利用，交不到真朋友，只剩利益结合的伙伴。"}, {"q": "主角梦见营业部那位白发老大娘在哭，有什么心理含义？", "a": "老大娘是无数散户受害者的象征，主角的良心与罪疚在梦中浮现；预示明日建仓将令像她一样的小股民流泪，利用消息操纵行情终要以散户的眼泪为代价，令他难以安睡。"}, {"q": "本章的建仓布局如何体现「温水煮青蛙」式的逐步造势？", "a": "主角先借小张让大户、领导逐步知情，层层铺垫；再以媒体主持人引爆消息，让市场在不知不觉间被诱导跟进，待众人察觉时建仓早已完成，这正是庄家惯用的渐进操纵。"}, {"q": "主角「没有看电视，没有洗澡就睡觉」，反映了他怎样的心态？", "a": "不看电视是不愿目睹主持人吹嘘的场面，倒头就睡则透出心力交瘁与自我厌弃；明知布局卑劣却不得不做，只能以「明天我要重上沙场」强撑自己面对残酷厮杀。"}, {"q": "主角说自己的行为是「尔虞我诈」的注解，说明了什么？", "a": "他利用身边能利用的一切，明知卑劣却别无选择；道德感与职业需求激烈冲突，他看不起自己，却又不得不以利益伙伴的规则行事，内心的自我审判贯穿始终。"}], "quotes": ["小伙子，我不得不利用你了。", "每一次在出手救别人的时候我都有这种担心，心里一直感到很不安，也许是因为这个市场上的风险和陷阱太多的缘故。", "助手小张肯定把我的意思传达给老头子，我更知道小张这家伙肯定会通知那些大户的，我的一举一动都是可以卖钱的，想到这儿我心里一阵阵的发紧，这次我不知道这样做会给这个小伙子带来多大的灾难，但是麻烦肯定会少不了。", "我知道不到我明天起床的时候，这个聪明的女人一定会在电视上吹嘘得没完没了，我就要的是她这样的小聪明。", "梦里我再次梦见我在营业部经常看到的那个可怜的白发苍苍的、炒股的老大娘！我梦见她在哭⋯⋯"], "psych": [{"p": "情緒操縱", "a": "我知道不到我明天起床的时候，这个聪明的女人一定会在电视上吹嘘得没完没了，我就要的是她这样的小聪明。", "n": "庄家利用主持人的虚荣心故意泄密，让舆论自发替其冲锋造势。"}, {"p": "信息瀑布（謠言市）", "a": "我更知道小张这家伙肯定会通知那些大户的，我的一举一动都是可以卖钱的", "n": "建仓消息沿人脉逐级扩散，大户跟风买入，预期自我实现。"}, {"p": "孤獨與異化", "a": "总是喜欢到没有人的地方走走，连我自己都开始怀疑，我的精神会不会出问题", "n": "职业投资者远离人群、自我怀疑，人被股市异化而日益孤独。"}, {"p": "道德衝突／罪疚感", "a": "梦里我再次梦见我在营业部经常看到的那个可怜的白发苍苍的、炒股的老大娘！我梦见她在哭", "n": "建仓前的良心不安化作老大娘之哭，庄家的罪疚无处安放。"}]}, {"i": 18, "title": "第十八回　殺手整裝佈陷阱", "kind": "hui", "summary": ["視資金搏殺為廝殺而非投資，盛裝上陣以儀式感強化信心，儼然資本市場高級殺手。", "莊家以小單分批試探拉升，依跟進比率判讀散戶跟風熱度，誘多後趁回落加碼，操弄買盤情緒。", "鋼管股份暴跌近百元令操盤手心生莫名恐懼，怒斥同伴後緊急掃單近乎垂直拉回，心理防線不容失守。", "臨收盤拉起深圳大盤，令未進場者對明日滿懷希望——最後的上漲是刺激貪婪欲望而設的陷阱。", "「您」與「你」之別道出對領導的懺悔，道德撕裂與背負數十億資金的死亡焦慮交織浮現。"], "qa": [{"q": "莊家上陣前為何要全副武裝打扮成資本市場高級殺手？", "a": "這是自我心理武裝的儀式：全副武裝才能信心十足投入戰鬥，並模仿老師描述的資金操縱者形象，在心理上完成「資本市場高級殺手」的身分認同。"}, {"q": "開盤後莊家憑什麼判斷散戶已被釣上鉤？", "a": "莊家以跟進比率(gp)為儀表板：開盤後每15分鐘、加碼後改每分鐘一次運算，讀取買盤跟風強度，確認散戶群體情緒已被點燃才決定出貨節奏。"}, {"q": "誘多過程暴露了散戶什麼群體心理？", "a": "散戶高度興奮、不計價格瘋狂追進，正是追漲貪婪與羊群效應的典型；莊家正是利用這股群體情緒，先在高位出貨、待回落再拉起誘多。"}, {"q": "臨收盤前莊家為何要猛然拉起深圳大盤？", "a": "為促使沒買進者形成無限想像力、對明日行情滿懷希望——利用散戶的貪婪與僥倖心理設下誘多陷阱，讓次日出貨「活就好幹」。"}, {"q": "下午鋼管股份暴跌近100元時，「我」為何「一下子有點發暈」？", "a": "計劃外的暴跌瞬間擊潰心理防線：盤面失控觸發從心靈深處升起的莫名恐懼，暴露操盤手對失去節奏、前功盡棄的深度不安。"}, {"q": "莊家說「善良的人們永遠也不會明白」最後的上漲是陷阱，這注解了什麼心理現象？", "a": "散戶被刺激的欲望蒙蔽雙眼，看不穿莊家刻意製造的虛假希望——信息不對稱下的情緒操縱，善良反而成為被利用的群體盲點。"}, {"q": "面對領導的誇獎與請客，「我」為何鼻子發酸並體會到「您」與「你」之別？", "a": "領導是毫無戒心的好人，自己卻在暗中佈局欺騙他；道德衝突與罪疚感湧上心頭，改請羊肉泡饃正是無聲的懺悔。"}, {"q": "晚上聚會「我」為何警告「10%的閃失，槍斃我100次」？", "a": "數十億資金背負的壓力轉化為死亡焦慮：閃失等同槍斃，失控即死——既是對團隊的威懾，也是自己對失敗的恐懼投射。"}, {"q": "「我」為何斷言「8天時間結束應該沒有問題」？", "a": "因散戶追高瘋狂、其他股票根本用不上托盤，走勢盡在掌握；對群體心理操控成功的自信，讓他斷言8天完成拉抬出貨沒有問題。"}], "quotes": ["资金的搏杀并没有被看成是金钱的投资，而是一场厮杀。", "善良的人们永远也不会明白，最后的这种上涨就是为了刺激他们那种欲望而设的陷阱。", "我一下子有点发晕，一种莫名的恐惧从心灵的深处升起", "价格就像点燃的爆竹蹿天猴，唰地一下几乎90度角被拉上来", "我这个时候才感觉到\"您\"和\"你\"是不一样的。"], "psych": [{"p": "情緒操縱", "a": "最后的这种上涨就是为了刺激他们那种欲望而设的陷阱", "n": "莊家藉臨收盤拉升製造虛假希望，操控大眾貪婪情緒以利次日出貨。"}, {"p": "追漲（貪婪）", "a": "人们疯狂的买单开始不计价格地追进", "n": "散戶見漲即追、不計成本，正是莊家誘多拉抬所依賴的貪婪盲從心理。"}, {"p": "孤獨與異化", "a": "资金的搏杀并没有被看成是金钱的投资，而是一场厮杀", "n": "職業操盤手把資金搏殺視為廝殺，自我異化為戰場殺手，與普通人情感疏離。"}, {"p": "死亡焦慮", "a": "几十亿的资金要是有10％的闪失，枪毙我100次不是什么大问题", "n": "背負數十億資金，操盤手把「閃失」等同於「槍斃」，失控即死的焦慮無處不在。"}]}, {"i": 19, "title": "第十九回　暗涌浙资夜梦惊", "kind": "hui", "summary": ["庄家集合競價高價掛單、再推價十五元鼓舞鬥志，以誘多戰術營造瘋漲氛圍，操控大眾情緒。", "買盤蜂擁、跟盤比率升至七，投資大眾陷盲目興奮、無人跟賣，盡顯從眾追漲的群體心理。", "小張洩密浙資介入，庄家以「勞務費」合理化其受賄，認知失調下扭曲現實而心安理得。", "為證實浙資承接，庄家一次性拋萬股試盤，見市場我行我素，遂加大五成出貨力度。", "收市後庄家潛意識恐懼、怒斥慶賀者，自責白日拋股未接回，職業孤獨與異化令其惡夢連連。"], "qa": [{"q": "集合競價時庄家用了什麼心理戰術吸引買盤？", "a": "誘多：每只股票掛兩萬股、價格比昨天高六十元，製造強勢開盤假象，刺激買盤蜂擁而入、價格迭創新高。"}, {"q": "跟盤比率升至七，反映散戶處於何種群體心理？", "a": "盲目興奮、追進情緒接近瘋狂，大眾仍無人跟盤賣出，從眾與貪婪令其集體失去理性判斷。"}, {"q": "庄家為何要「鼓舞人們的鬥志」把價格再推高十五元？", "a": "情緒操縱：見買盤熱度將退，以新高強化賺錢預期、維持跟風人氣，好趁大眾興奮之際繼續出貨。"}, {"q": "庄家如何讓小張心安理得收下那五萬元？", "a": "認知失調與合理化：把賄款說成別人給的勞務費、業餘勞動所得，以扭曲現實的方式消解罪惡感。"}, {"q": "庄家為何擔心浙江資金斬倉出局？", "a": "心理較量：市場中人警覺如受驚之兔，浙資一旦看出苗頭不對便會斬倉，雙方比的是誰先承受不住、誰先潰敗。"}, {"q": "下午庄家為何一次性拋出一萬股試探？", "a": "試盤心理：以萬股拋單測試市場承接力，見跟盤比率幾無反應、市場我行我素，證實浙資介入後再加碼出貨五成。"}, {"q": "庄家對慶賀之人破口大罵又後悔，反映什麼心理？", "a": "恐懼與愧疚交織：他憂眾人得意鬆懈、懼未來風險，罵後又自責，因大家壓力大難得開心，顯示其情緒的孤獨與兩難。"}, {"q": "章末庄家徹夜惡夢，說明他的心理狀態如何？", "a": "長期博弈令其潛意識恐懼未來，職業生涯的孤獨異化使他無人可訴，壓力在夜裡爆發為惡夢。"}, {"q": "小張的消息從何而來？", "a": "朋友透露浙江有一批資金最近大批量介入、且與庄家進同一批股票，小張為此收了對方五萬元好處。"}, {"q": "庄家如何發現消息可能走漏？", "a": "想起這幾天樓下總停有外地車輛，聯想到小張洩密，遂警覺浙江資金早已盯上同一批股票。"}], "quotes": ["意外地得到这个消息让我非常兴奋，但是长时间在这个市场上生存，让我练得是表里不一，心里想的外边看不出来。", "从这些记录上可以看出，投资大众还处于一种盲目的兴奋之中依然没有人跟盘卖出。", "我看了一下已经达到7，这是我没有想到的，人们追进的这种情绪已经接近疯狂。", "在这个市场上，人们警觉的那个程度不比受惊的兔子差多少。", "今天的成交量很大，晚上我不想跟任何人说话，心理潜意识有一种恐惧，我不知道未来会发生什么。"], "psych": [{"p": "情緒操縱", "a": "但是我也知道这种局面不会维持太久，我还需要再鼓舞一下人们的斗志，于是，我吩咐报单员：“把价格再推高15元，加大成交量。", "n": "庄家以推高價格鼓舞鬥志，操控大眾情緒以便在高位出貨。"}, {"p": "羊群效應（從眾）", "a": "投资大众还处于一种盲目的兴奋之中依然没有人跟盘卖出", "n": "買盤蜂擁、無人跟賣，大眾盲目追進盡顯從眾群體心理。"}, {"p": "認知失調／合理化", "a": "别人给你的劳务费，也是应该的收入，你替别人分析股票，安排资金进出，这是你业余的劳动所得", "n": "庄家把受賄美化成勞務所得，以自我合理化扭曲現實。"}, {"p": "孤獨與異化", "a": "今天的成交量很大，晚上我不想跟任何人说话，心理潜意识有一种恐惧", "n": "職業庄家無人可訴、表裡不一，內心恐懼日漸異化。"}]}, {"i": 20, "title": "第二十回　破千五布连环计", "kind": "hui", "summary": ["庄家借恐慌急跌出货，深谙散户抢反弹心理，急跌反成放量良机。", "咖啡馆布连环计：高开诱多、封死盘口，制造后悔情绪逼散户追进套牢。", "散户报单迟缓成软肋，撤单排队耗整天，三十分钟内被套，全天近乎单向出货。", "营业部门口散户炫耀抢反弹获利，只见眼前小利，不知风暴将至，群体盲目乐观。", "主角自问是否好人，同伴疏远、独往南山寺祈祷，操盘者的良心拷问与内在异化。"], "qa": [{"q": "庄家为什么认为「价格的急跌反而是一件好事情」？", "a": "他深知散户普遍有急跌抢反弹的赌徒心理，急跌会引来短线客抢进，成交量放大，正好掩护自己出货，把市场的恐慌变成自己出货的工具。"}, {"q": "高开并封死盘口的战术，如何操纵散户情绪？", "a": "先让昨日抢反弹者获利，制造「踏空」的焦虑与后悔，诱使未介入者开盘后迫不及待追进；随后30分钟砸盘，把追高者牢牢套住。"}, {"q": "老胡担心散户卖出，庄家怎样戳破散户的软肋？", "a": "散户报单迟缓，上午的单下午才成交，最快也要半小时；他们不断撤单、排队、再撤单，一天就在等待中耗尽，等于全天任庄家单向出货。"}, {"q": "大盘跌破1500点引发了怎样的群体心理？", "a": "整数关口失守触发恐慌气氛，钢管股份领跌带动汽车下挫，众人夺路而逃，羊群效应使跌幅被恐慌情绪放大，庄家趁机反向出货。"}, {"q": "营业部门口的散户为何得意地炫耀抢反弹？", "a": "他把急跌抢反弹的运气归功于自己的「果断」，自我服务偏差让他看不见风险，反而在众人面前鼓吹「战场要果断」，成了庄家出货的活广告。"}, {"q": "主角为什么说「我不知道我是不是好人」？", "a": "他亲手布下套牢散户的连环计，面对那些善良而盲目的股民良心不安，道德冲突与罪疚感浮现，连想去南山寺祈祷都说不清为谁而祈。"}, {"q": "众人为何不肯陪主角去吃油泼面？", "a": "他刚部署完屠杀散户的计划，同伴以「违心的话」婉拒亲近，他自嘲独行，凸显职业操盘者被群体疏远的孤独与精神上的异化。"}, {"q": "主角为何一夜不安、清晨抢先赶到公司？", "a": "他为证实想法动用实盘，犯了职业大忌，恐惧「灭顶之灾」，焦虑驱使他一早布置当日交易，可见操盘者如履薄冰的心理重负。"}, {"q": "这场博弈中，庄家最核心的心理战术是什么？", "a": "不与价格硬扛，而是摸透散户抢反弹、怕踏空、不肯割肉三种心理：诱多、砸盘、封盘口环环相扣，让散户始终被动等待、无法反击。"}, {"q": "「厄运好像不分天气好坏」有什么心理寓意？", "a": "晴空与杀机并置，散户只见阳光明媚的盘面，不见主力出逃的阴影；群体的盲目乐观与庄家的清醒算计形成强烈反差。"}], "quotes": ["作为一个职业资本运作者，我不能原谅自己昨天盲目的行为，更不能因为要证实自己的一种想法而用实盘，我担心就是因为我的这个不小心导致灭顶之灾。", "我知道很多人都有那种急跌抢反弹的意识，因此价格的急跌反而是一件好事情，当这种局面维持到临收盘的时候", "这样以来那些昨天在下跌过程中没有参与抢反弹的人，都会很着急很后悔，在开盘以后他们都会迫不及待地介入", "股市是什么？战场！懂吗？战场就应该果断的，你们知道吗！", "我不知道我是不是好人，我想要是有时间我一定要到海南的南山寺去祈祷，我不知道为什么？更不知道为谁！"], "psych": [{"p": "情緒操縱", "a": "这样以来那些昨天在下跌过程中没有参与抢反弹的人，都会很着急很后悔，在开盘以后他们都会迫不及待地介入", "n": "庄家高开诱多、封死盘口，专挑散户后悔与急切心理下手，操纵情绪完成出货。"}, {"p": "賭徒謬誤", "a": "我知道很多人都有那种急跌抢反弹的意识，因此价格的急跌反而是一件好事情", "n": "散户认定急跌必反弹而抢进，庄家正好借这种赌徒心理放量出货。"}, {"p": "自我服務偏差（吹噓）", "a": "我今天下午抢反弹已经有5块钱的获利了，我跟你们说啊，这急跌的时候你要大胆地跟进，不要犹豫", "n": "散户把抢反弹的运气归功于自己的果断，吹嘘战绩，反成庄家出货的活广告。"}, {"p": "孤獨與異化", "a": "我不知道我是不是好人，我想要是有时间我一定要到海南的南山寺去祈祷，我不知道为什么？更不知道为谁！", "n": "操盘者屠杀散户后良心难安、无人亲近，连祈祷都说不清为谁，尽显职业投资者的疏离。"}]}, {"i": 21, "title": "第二十一回　断珠惊魂沪上夜", "kind": "hui", "summary": ["高開疊加利好報道調動散戶情緒，主力半小時內完成誘多，買盤蜂擁湧入。", "價格如斷線珍珠狂瀉，散戶撤單無門陷絕望；主角憶起老太太，靈魂顫抖。", "跟進比率5.4顯示散戶未恐慌，主力加倍砸盤；助手欲逃，主角順水推舟試人心。", "老孫斷言明日必反彈，眾人盲從失自信；主角看破群體心理，定計低開誘其成交。", "夜遊滬上主角自感孤獨異化，被城市同化卻無法融入，睡前覺得自己在裂變。"], "qa": [{"q": "主力如何利用消息與走勢調動散戶情緒完成誘多？", "a": "媒體報道不增加新股發行額度，8隻領頭羊高開令大盤高開40多點，高開回調再大幅拉高，半小時內誘使買盤大量湧進，隨即電話通知全部出貨。"}, {"q": "散戶在暴跌中表現出什麼群體心理？", "a": "價格以5元、10元、15元的幅度狂跌，當時撤單根本不可能，買進者只能眼睜睜看著單子被成交、價格繼續下墜，陷入無法逃離的絕望與恐慌。"}, {"q": "主角為何先恐懼後興奮？這說明他的心理發生什麼變化？", "a": "恐懼源於太感情用事、總想起可憐的老太太；下午指數砸破1400點，市場氣勢把他先前的仁慈掃蕩殆盡，他反而興奮——內心的良知正被行情一點點吞噬。"}, {"q": "為何巨大拋單並未引發散戶恐慌？主角從中得到什麼教訓？", "a": "8隻股票各買進1萬股價格竟猛漲15元，跟進比率達5.4，說明散戶尚無懼意；主角醒悟自己先前的恐懼不過是過於感情用事，情緒影響了判斷。"}, {"q": "老孫的「明日必反彈」論斷體現什麼心理？主角為何要讓他說對？", "a": "老孫以今日跌幅與成交量斷言必大幅反彈，是典型的賭徒謬誤；主角故意成全他，讓眾人獲利後跟風不殺出，利用群體心理把老孫變成自己的工具。"}, {"q": "咖啡館聚會中眾人表現出什麼心理弱點？主角如何評價人與人的差距？", "a": "高人觀點被能言善辯者否定，眾人缺乏自信；主角認為人和人智商差不了多少，唯一區別是承受壓力和打擊的能力，失敗者總懷疑自己或懷疑被人針對。"}, {"q": "主角從券商營業部的數據中得出什麼結論？", "a": "各券商客戶交易大致相同：新開戶資金沒有進場，老開戶資金幾乎全是股票，參與交易的人不多；他判斷下跌對新股民太恐怖，照此仍難激起他們的衝動。"}, {"q": "主角為明日制定了什麼計劃？", "a": "吩咐明天低開讓老孫等人全部成交，開盤15分鐘以內拉起來；只要讓老孫這次說對、眾人都有利可圖，他們就不會帶來麻煩，因為他已摸透這群人的心理。"}, {"q": "主角在滬上之夜表現出怎樣的心理狀態？", "a": "他自覺孤獨，單身住在酒店，深夜在馬路上晃悠；他感到自己一直被這個城市同化卻根本無法融入，睡前認為自己在裂變，顯露職業投資人深處的疏離感。"}, {"q": "主角對鏡自誇體現了什麼心理？", "a": "他自認除了個子矮其他都很滿意，連矮也被說成省布料的優勢，自誇優點多得說不完；把自身一切都歸功於自己，顯露典型的自我服務偏差心態。"}], "quotes": ["人们看到价格上涨开始有买盘大量涌进。", "我能感觉到那些上午挂单买进的人，来不及撤单的那种绝望，我又想起那个可怜的老太太，我不知道这时候的她是什么样的心情，更不知道她目前是持股还是持币，我的灵魂在颤抖。", "结果没有想到价格竟然向上猛涨15元，我忽然明白，巨大的抛单并没有引起散户的过度恐慌，我之所以陷到这种恐惧气氛中的缘故就是太过于感情用事，影响我情绪的就是那个留在我记忆深处的那个老太太。", "我知道人和人的智商差不了多少，没有谁比谁高明多少，唯一的区别是承受压力和打击的能力。", "睡觉前洗澡，我觉得自己在裂变，睡觉的时候穿睡衣，我不知道这是一种进步还是愚昧，"], "psych": [{"p": "情緒操縱", "a": "人们看到价格上涨开始有买盘大量涌进", "n": "主力以高開與利好報道調動散戶情緒，半小時內完成誘多出貨。"}, {"p": "恐慌性拋售（恐懼）", "a": "价格开始以5元的幅度下跌，紧跟着就是10元、15元人们来不及反应", "n": "暴跌中散戶撤單無門，只能眼睜睜被成交，陷入集體恐慌。"}, {"p": "賭徒謬誤", "a": "照今天的这种跌幅和成交量，明天开盘一定会大幅度反弹的", "n": "老孫以「跌久必漲」斷言反彈，正是賭徒謬誤的典型心態。"}, {"p": "孤獨與異化", "a": "我觉得自己在裂变，睡觉的时候穿睡衣，我不知道这是一种进步还是愚昧", "n": "主角被城市同化卻無法融入，睡前深感自己在裂變。"}]}, {"i": 22, "title": "第二十二回　灯红酒绿夜筹谋", "kind": "hui", "summary": ["大戶夜聚咖啡館，老孫斷言明日必反彈，眾人心悅誠服，主角卻看穿其不自信。", "主角點破勝負之別在承受壓力與打擊的能力，嘲笑散戶「單子大就會被莊家發現」的迷思。", "主角密令明日低開讓眾人全部成交，十五分鐘內拉抬股價，使老孫預言自我實現以收服人心。", "夜行南京路，戲言發明「漂亮女孩指數」，燈紅酒綠的繁華都市中更顯孤獨與疏離。", "睡前自覺「裂變」被城市同化，照鏡自誇矮個，明白自己終究無法融入滬上生活。"], "qa": [{"q": "主角認為「人和人的智商差不了多少」，他眼中人與人唯一的區別是什麼？這透露出怎樣的較量心理？", "a": "唯一的區別是承受壓力和打擊的能力。失敗對投資者是家常便飯，多數人卻把失敗歸咎於被針對或懷疑自己，贏家勝在心理承受力——博弈本質就是看誰先崩潰的心理較量。"}, {"q": "老孫憑什麼斷言明天一定大幅反彈？他犯了什麼心理偏差？", "a": "老孫僅憑今天的跌幅和成交量，就斷言明天開盤必大幅度反彈，把「跌久了必漲」當成鐵律，正是賭徒謬誤——用過去的隨機走勢推斷必然的未來，而莊家恰恰利用這種信念設局。"}, {"q": "主角為何刻意讓老孫的預言應驗？這說明輿論與預期能起什麼作用？", "a": "主角吩咐低開讓眾人全部成交，再在十五分鐘內拉起股價，使老孫的「反彈」預言成真。眾人獲利後更加信服老孫、安心跟隨，預期自我實現、愈滾愈大，形成信息瀑布，莊家樂得順勢而為。"}, {"q": "咖啡館裡眾人對老孫「佩服得五體投地」，反映出散戶什麼群體心理？", "a": "眾人對能言善道的老孫盲目信服，把言辭氣勢當成判斷依據，這是典型的羊群效應：缺乏自信的人寧願跟風大多數人的意見，也不敢相信自己的分析，因而被意見領袖牽著走。"}, {"q": "主角為什麼說「只要老孫在」就不怕眾人中途殺出？他用了什麼心理戰術？", "a": "老孫是眾人的精神支柱，只要他這次說對、人人有利可圖，眾人便會持續信服、安分跟隨。主角借意見領袖之口輿論造勢、誘多聚人，自己隱身幕後掌控節奏，用群體情緒為自己背書。"}, {"q": "老孫勸小李「大清早大膽跟進掛單」，這種行為背後是什麼心理？", "a": "見老孫臨收盤買入已有10塊錢賺頭，眾人眼紅貪婪，急於掛單追漲，深怕晚一步便成交不了。追漲是貪婪驅動的從眾行為，主角正是利用這份急迫，設計低開讓所有追高者悉數成交。"}, {"q": "主角說失敗者「總是懷疑自己的能力或者懷疑被人有針對性地傷害」，這屬於什麼心理？", "a": "這是認知失調後的自我合理化：不願承認判斷失誤，便把虧損歸咎於運氣差或被莊家針對，用扭曲的解釋安撫自尊，卻始終不肯直面自己承受打擊的能力不足。"}, {"q": "主角深夜在南京路上為何感到孤獨？這與他的職業有什麼關係？", "a": "他獨自住在酒店，深夜在燈紅酒綠的街上晃悠，對都市的熱鬧無從融入。這是職業投資人的孤獨與異化：長年與數字、籌碼和人博弈，內心卻與普通人的生活漸行漸遠。"}, {"q": "主角照鏡子時如何看待自己矮個的缺點？這透露什麼心理？", "a": "他把矮個也說成優勢——省衣服、不怕天上掉石頭——認為自己優點多得說不完。這是自我服務偏差：將一切特質都歸功於自己、美化自我，用吹噓支撐自信，也是他在博弈中保持強勢的心理盔甲。"}, {"q": "主角為何堅持「明天低開，15分鐘以內拉起來」？莊家如何運用節奏與心理點位？", "a": "低開讓追漲的掛單全部成交，隨即快速拉起製造「反彈成真」的錯覺，形成心理支撐位。莊家掌控開盤節奏，用盤面走勢引導眾人情緒，讓散戶以為自己判斷正確，心甘情願地接盤。"}], "quotes": ["我知道人和人的智商差不了多少，没有谁比谁高明多少，唯一的区别是承受压力和打击的能力。", "说句实在话，你就是一次买一手我也能感觉到你们在做什么，难道庄家的操盘手真的会愚昧到发现大单子才认为你们跟进或者出逃，真的很可笑。", "老孙说：“照今天的这种跌幅和成交量，明天开盘一定会大幅度反弹的，我们可以大胆地跟进，你看我今天临收盘的时候进去，到收盘每股已经有10块钱的赚头，明天一大早继续上涨我不是赚多了吗？", "回家睡觉吧，不要多想，照我说的去做，明天低开，15分钟以内拉起来，明天是个好日子。", "睡觉前洗澡，我觉得自己在裂变，睡觉的时候穿睡衣，我不知道这是一种进步还是愚昧，总之我一直被这个城市同化，但是我知道我根本不能融入这个城市的生活，我不喜欢站在菜市场和小贩斤斤计较，更不愿意在厨房拳打脚踢，最不能接受的就是那种母权等等。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "我知道人和人的智商差不了多少，没有谁比谁高明多少，唯一的区别是承受压力和打击的能力", "n": "主角點破博弈勝負在於誰先承受不住，承受壓力與打擊的能力才是唯一區別。"}, {"p": "賭徒謬誤", "a": "照今天的这种跌幅和成交量，明天开盘一定会大幅度反弹的，我们可以大胆地跟进", "n": "老孫以今日跌幅斷言明日必反彈，正是跌久必漲的賭徒謬誤，反被莊家設局利用。"}, {"p": "情緒操縱", "a": "回家睡觉吧，不要多想，照我说的去做，明天低开，15分钟以内拉起来，明天是个好日子", "n": "莊家設計低開再快速拉抬，讓老孫預言應驗，操控眾人預期以收服人心。"}, {"p": "孤獨與異化", "a": "我觉得自己在裂变，睡觉的时候穿睡衣，我不知道这是一种进步还是愚昧，总之我一直被这个城市同化", "n": "職業投資人被都市同化卻無法融入，深夜獨行，顯露孤獨與自我異化。"}]}, {"i": 23, "title": "第二十三回　晨筹低吸午砸盘", "kind": "hui", "summary": ["開篇俯瞰車流自比操控者，視眾生如鐵盒，透出職業操盤手的孤獨與異化。", "明知不妥仍放「今日大漲」消息並索二十萬回報，以資訊預期左右浙江資金，是典型的輿論造勢。", "低開砸出新低後悄然分批吸籌，待價格回升再令同夥分批出貨，步步踩準散戶跟風節奏。", "見新客戶大半追高買進便斷言成交量難持久，看穿小資金承受力差、風吹草動即恐慌出逃。", "收市前急令砸盤三成，又斥老胡猛跌只帶來恐懼而非機會，盡顯操控情緒與守衛心理支撐位的博弈。"], "qa": [{"q": "開篇主角俯瞰車流、把小轎車比作「屎殼郎」，透露出他怎樣的心理狀態？", "a": "居高臨下俯瞰眾生，視行人車輛如鐵盒子，顯出職業操盤手與市井生活徹底隔絕的疏離感，以及操控全局、冷眼旁觀的姿態。"}, {"q": "主角明知放「今日大漲」的消息不合適，為何仍執意讓助手傳出？這用了什麼心理戰術？", "a": "這是輿論造勢與資訊操縱：先散布利多預期，待行情真的上漲，消息便自我實現；既引浙江資金跟風抬轎，又向對方索要二十萬元回報。"}, {"q": "浙江人在無人監督之下為何絕不賴賬？", "a": "他們明白這條資訊管道價值千金，賴賬便斷絕消息來源；守信是維繫資訊優勢的籌碼，所以拿不到錢的一方也不敢聲張。"}, {"q": "主角為何選在大盤低開、創出新低、成交量極小時才下單吸籌？", "a": "趁市場恐慌、拋壓枯竭、無人搶籌之際悄然建倉，一次一千股、每三分鐘一次，動作隱蔽，不驚動對手盤，正合砸盤建倉之道。"}, {"q": "「人們好像一下子活明白了，大批量的單子開始買入」反映了什麼群體心理？", "a": "這是典型的羊群效應與追漲心理：價格回升的訊號一出，散戶不問原因蜂擁跟買，成交放大反過來又吸引更多人入場。"}, {"q": "主角為何嫌棄新開戶的內地小賬戶？這類資金有何心理弱點？", "a": "每戶下限僅五千元，資金小、承受力差，稍一風吹草動便恐慌拋售逃跑，容易干擾視線、打亂莊家控盤的節奏。"}, {"q": "老胡「每次三千股、兩分鐘一次」的下單節奏為何遭主角痛罵？", "a": "時間緊迫卻節奏遲緩，砸不出應有跌幅；莊家深知快慢即心理戰術，緩跌引不起恐慌，只有急砸才能在收盤前營造預期的恐懼。"}, {"q": "主角為何斥責老胡「往死裏砸」？「猛跌帶來的是恐懼而非機會」如何注解股民心理？", "a": "砸盤過猛令指數近乎九十度下墜，只會嚇垮散戶、引發恐慌性拋售，而非誘人上車；莊家須拿捏幅度，讓價格落在跟風者「滿意的價位」。"}, {"q": "老胡以「gp現在還是6」報平安，這句話透露了什麼心理機制？", "a": "價格回升後跟盤踴躍，因為六元是散戶心中的心理支撐位：守住它跌勢便顯可控；一旦跌破信心瓦解，下午就拉不回來。"}, {"q": "收盤前主角對眾人說「都去吃飯吧，下午要出力」，有何深意？", "a": "上午已完成低吸與拉高，下午要繼續派發；讓同夥養足精力，暗示莊家是連續作戰的團體博弈，控盤節奏一刻不能鬆懈。"}], "quotes": ["从楼上往下看，汽车就是一个带着四个轱辘的小铁盒子，公共汽车就是一个长方形的铁盒子，那里面有很多人。", "一阵子人们好像一下子活明白了，大批量的单子开始买入，上涨的速度一下子变得很快，这时候的成交量越来越大。", "我知道这样的成交量不会维持太久。", "我让你砸的意思想给那些没有追进而后悔的人一个机会，让他们能够在自己满意的价格进去，你他妈的往死里砸啊！", "这样没有命的往下跌，带来的不是机会而是恐惧，你能不能把握一下那些要被你害死的人的心理反应啊。"], "psych": [{"p": "情緒操縱", "a": "这样没有命的往下跌，带来的不是机会而是恐惧，你能不能把握一下那些要被你害死的人的心理反应啊", "n": "莊家以砸盤與拉抬的節奏操控散戶的貪婪與恐懼，為派發鋪路。"}, {"p": "羊群效應（從眾）", "a": "一阵子人们好像一下子活明白了，大批量的单子开始买入，上涨的速度一下子变得很快", "n": "價格回升訊號一出，散戶不問緣由集體跟買，新客戶大半追進。"}, {"p": "信息瀑布（謠言市）", "a": "对方答应一旦股市今天真的上涨，给小伙子20万元当回报", "n": "莊家預先散布利多，行情上漲令消息自我實現，消息即成賺錢工具。"}, {"p": "心理支撐位", "a": "价格已经开始回升了，而且跟盘还是比较踊跃的，gp现在还是6，你放心吧", "n": "六元是市場心理防線，守住關鍵價位方能維持跟盤信心。"}]}, {"i": 24, "title": "第二十四回　驚魂周五急出倉", "kind": "hui", "summary": ["散戶圍住評論員奉若神明，評論員以「震倉」安撫人心；主角暗罵其蠢，今年行情豈能與去年相比。", "主角限價分批吃貨，女報單員多問遭冷眼，一句「穩當」的廢話安撫軍心，自我合理化連自己都騙不過。", "主力停手跟盤狂漲，散戶盲目追漲；老胡欲拖至下週，主角怒斥「還有沒有明天」，逼其當場出貨。", "股價急跌，主角令同盟護盤，於1400點心理支撐位以上按節奏出貨，情緒終須讓位於算賬。", "佇立窗前等待1400點，心潮起伏、煩惱莫名——殘酷博弈中的莊家亦難逃孤獨與異化，無人可訴。"], "qa": [{"q": "散戶把評論員當「神」一樣圍住、評論員高高在上盲目解答，這反映了什麼心理？", "a": "這是典型的專家崇拜：散戶在行情看不懂的焦慮中放棄獨立判斷，把希望寄託於權威；評論員高高在上盲目解答，又進一步鞏固了散戶的迷信與依賴。"}, {"q": "評論員說「目前屬於震倉階段，大家要耐心、大膽，不要被震出去」，這在莊家博弈中是什麼戰術？", "a": "這是輿論造勢的情緒操縱：用「震倉」的說法安撫散戶，讓他們相信下跌只是洗盤、死抱籌碼不賣，莊家便可從容按自己的節奏出貨。"}, {"q": "主角聽到評論員的話後為何心裡感到「踏實」？", "a": "因為散戶正「按照我們的設想在思考問題」：大眾的情緒與預期完全落入莊家設計的軌道，思維被掌控，莊家自然踏實——這正是情緒操縱的目的。"}, {"q": "本章散戶的「追漲」心理表現在哪裡？", "a": "主力已經停止拉抬，股價卻「飛似地向上躥」，只因跟盤太強勁——散戶見漲就追、盲目跟風，貪婪的追漲買盤替莊家把價格推高，莊家無須動手。"}, {"q": "主角對女報單員說「我只是想做得穩當一點，這就是我的性格」，為何自己又覺得「全是廢話」？", "a": "這是認知失調下的自我合理化：他明知自己以殘酷果斷著稱、此次佈局別有算計，卻用「穩當」的藉口掩飾，連自己都騙不過，只好說廢話安撫對方。"}, {"q": "主角一聽老胡說「明天出貨」就勃然大怒，這說明了什麼心理？", "a": "這是主力間的心理較量與危機意識：當天是周五，兩天休息變數難測，拖到下週便滿盤皆輸；風險當前誰也不能賭「明天」，一步遲疑就足以致命。"}, {"q": "「1400點」在主角的操盤中有什麼心理意義？", "a": "1400點是整數關口與心理支撐位：他在1400點以上接貨托盤、按節奏出貨，價格跌破便意味支撐失守——這個數字是衡量信心與成敗的心理錨點。"}, {"q": "主角怒摔咖啡杯之後，為何又立刻恢復冷靜指揮托盤？", "a": "職業操盤手的情緒必須讓位於利益：怒氣發洩完，他馬上算清「否則我還得進資金托盤」的賬，改令同盟護盤、按節奏出貨——情緒化只是一瞬，算賬才是常態。"}, {"q": "章末主角「心潮起伏」卻「不知道該去對誰訴說」，揭示了什麼？", "a": "職業投資人的孤獨與異化：殘酷博弈中他不能向任何人吐露真實意圖與壓力，安撫報單員也只能說廢話，喧囂散場後只剩下無人可訴的莫名煩惱。"}, {"q": "開盤前主角向報單員下了什麼指令？為何這樣安排？", "a": "每隻股票3萬股，一次下單吃進2000股、3分鐘一次，價格有限制、超過即停止執行——嚴格控制節奏與成本，避免大手筆打草驚蛇、抬高建倉成本。"}], "quotes": ["目前属于震仓阶段，大家要耐心、大胆，不要被震出去，你们还能想起去年12月份和今年1月份那两次震仓吗？现在和那时候一样。", "你真是一个蠢货，今年的行情怎么能和去年的比，这有必然联系吗？", "我们刚才都通了一下电话，已经停止拉抬了，现在这么强劲的跟盘不用再拉了。", "去你妈的，你混蛋，你是不是想到提篮桥去住一阵子，明天？你他妈的还有没有明天，今天是周五，两天休息会发生什么你知道吗？", "站在窗前，等待价格再上1400点的时候，我心潮起伏，心底升起一股莫名的烦恼，不知道该去对谁诉说！"], "psych": [{"p": "專家崇拜／過度自信", "a": "看到那群可怜的人们把那个家伙当神一样围住，而那个家伙也高高在上得为大家盲目地解答，我心里骂到", "n": "散戶在行情看不懂時迷信評論員權威、放棄獨立判斷，正是專家崇拜的典型寫照。"}, {"p": "情緒操縱", "a": "目前属于震仓阶段，大家要耐心、大胆，不要被震出去，你们还能想起去年12月份和今年1月份那两次震仓吗", "n": "莊家借「震倉」輿論安撫散戶情緒，令其死抱籌碼，為出貨爭取時間與空間。"}, {"p": "追漲（貪婪）", "a": "我们刚才都通了一下电话，已经停止拉抬了，现在这么强劲的跟盘不用再拉了", "n": "主力一停手，散戶跟風買盤便自行推高股價，貪婪使大眾成為莊家的免費拉抬工具。"}, {"p": "孤獨與異化", "a": "站在窗前，等待价格再上1400点的时候，我心潮起伏，心底升起一股莫名的烦恼，不知道该去对谁诉说", "n": "博弈中無人可訴的煩惱，暴露莊家內心深處的孤獨與職業異化。"}]}, {"i": 25, "title": "第二十五回　黃昏出盡滿倉愁", "kind": "hui", "summary": ["主角每五分鐘千股掃貨誘多，指數創新高後悄然出貨，收最高點創最大量——莊家誘多之術畢現。", "先起盼行情翻空懲罰同伴的惡念，一顫後醒悟同坐一條船，壓下不平冷靜指揮出貨，內在撕裂可見。", "清算顯示占用資金14.7億、八股浮盈17%，1992年滬市大戶以資金操縱群體情緒的狂潮畢現。", "老師以坐飛機買保險喻拋物線指標：行情發展到一定程度非人力所能操縱，恐懼貪婪是人性死穴。", "貨盡而出，暮色異常沉重，主角只餘空虛壓抑與對新一輪殺戮的預感——操盤手的孤獨與異化。"], "qa": [{"q": "指數來到1400時，主角如何操縱盤面？這屬於莊家的哪種心理戰術？", "a": "他吩咐報單員每五分鐘買入1000股、不限價不間斷，人為推高指數，正是「誘多」——以持續買盤製造強勢假象，引散戶蜂擁接盤，再趁勢出貨。"}, {"q": "主角為何說「只有這個時候對自己最佩服」？", "a": "因為他能利用行情走勢影響眾人的情緒，再通過情緒的變化間接支配他們的行為——連董事長、上海城裡人也逃不出他的情緒操縱，這正是他成就感的來源。"}, {"q": "主角腦中的「惡毒念頭」是什麼？他為何又渾身一顫打消了它？", "a": "他盼賬面變成負數好打擊那幫同伴，卻一顫醒悟：彼此已是一條繩上的螞蚱，出事誰也跑不了。他於是用利益綁定壓下不平，合理化內心的道德不安，冷靜指揮出貨。"}, {"q": "指數創新高、買盤蜂擁而入時，散戶表現出什麼群體心理？", "a": "追漲的貪婪：見指數創新高便蜂擁搶進，成交量創本輪最大，gp值達10，是行情啟動以來最強烈的一次——人們追高的欲望多麼強烈，恰好成了莊家出貨的接盤者。"}, {"q": "收盤前老胡報告「已經出完了」，主角為何反而空蕩蕩、特別難受？", "a": "因為他知道這個特殊戰場上的新一輪殺戮又要開始，不知多少英雄豪傑要倒下；出貨完成沒有輕鬆，只有對輸家的預感，以及職業操盤手深處的孤獨與異化。"}, {"q": "老師用「坐飛機買保險」來比喻什麼？這折射出何種心理？", "a": "買保險不是認定一上去就掉下來，而是萬一掉下來能為生命增加最後的價值；拋物線就是資本運作者的保險單——暗藏對行情崩落的死亡焦慮與敬畏。"}, {"q": "主角為何「慶幸」多數人看不懂拋物線這張保險單？", "a": "他慶幸人們不能擺脫自身天性——恐懼和貪婪。正因散戶無法克服貪婪與恐懼，他才能影響行情與眾人的情緒、支配他們的行為，這是莊家獲利的心理基礎。"}, {"q": "主角向領導匯報了什麼計劃與風險？他如何權衡貪婪與恐懼？", "a": "總共進去不到15億，計劃出貨、利潤保證約15%；行情估計維持不長，一旦翻轉風險達85%、虧損約30%——他清醒算計貪婪與恐懼的臨界點，決定快刀斬亂麻。"}, {"q": "主角為何婉拒領導晚上到家做客，一出門卻約同伴到酒店？", "a": "他以今晚要約會為藉口婉拒領導，卻馬上通知同伴到他住的酒店來——他不願領導知曉自己的盤算，在信任與籌謀之間，選擇了保留與算計。"}, {"q": "章首對靜安寺的好奇與章末「天，灰蒙蒙的」有何心理呼應？", "a": "開篇說人在孤獨無助、對人失去信任時易走進寺廟尋求寄託，結尾天色灰蒙、貨盡而心頭異常沉重——前後呼應主角在股市中愈陷愈深的孤獨與異化。"}], "quotes": ["我只有在这个时候对我自己最佩服，能够利用行情的走势影响这么多人的情绪，然后通过他们情绪的变化间接地支配他们的行为", "我庆幸这些人看不懂这个保险单，更庆幸人们不能摆脱自身天性——恐惧和贪婪。", "想到这儿我浑身一颤，我被我这个恶毒的念头震颤，要是真的这样不是他们几个人的事情，现在我和他们已经是一条绳子上的蚂蚱", "我知道这个特殊战场上的新一轮杀戮又要开始了，不知道有多少英雄豪杰要倒下去。", "他们的货都出完了，没有给我留下轻松，却带来了异常得沉重！"], "psych": [{"p": "情緒操縱", "a": "能够利用行情的走势影响这么多人的情绪，然后通过他们情绪的变化间接地支配他们的行为", "n": "主角以拉抬指數誘多，操控大眾情緒再支配其行為，正是莊家情緒操縱的教科書示範。"}, {"p": "追漲（貪婪）", "a": "当指数创新高以后，买盘蜂拥而入，我们的买单早就停了，但是价格还是飞快地上涨。", "n": "散戶見指數創新高便蜂擁追高，貪婪沖昏頭腦，成為莊家高位出貨的接盤力量。"}, {"p": "孤獨與異化", "a": "我想人可能在感到孤独无助、对周围人或者事物都失去信任的时候，就很容易走进这儿寻求寄托", "n": "主角自認孤獨無助、對人失去信任，出貨後更覺空虛沉重，職業投資人的疏離畢現。"}, {"p": "認知失調／合理化", "a": "我心里这时候忽然产生一个恶毒的念头，要是负数的话对这些家伙肯定是一个很大的打击，想到这儿我浑身一颤", "n": "惡念與「一條繩上的螞蚱」的自辯交戰，主角以利益綁定合理化內心的道德不安。"}]}, {"i": 26, "title": "第二十六回　酒酣论股测人心", "kind": "hui", "summary": ["眾人上海名店聚飲西鳳酒，救人資金已按計劃出貨，老胡舉杯謝主角及時出手。", "主角點破股市是騙與被騙的鬥智遊戲，買賣根本在情緒，大資金當操控投資人心理。", "散戶追漲殺跌非愚笨，而是看不清未來；不懂資本流動，只信消息、捷徑與專家。", "定計下周一高開拉抬股價，三日成交逾百億即可出清；對倒消耗太大棄而不用。", "主角自嘲資本運作僅幾句話，感嘆投資者對莊家只有神秘、對專家卻崇敬，資金未出不算成功。"], "qa": [{"q": "老胡這次營救行動中感受最深的是什麼？", "a": "老胡舉杯致謝，坦言資金運作時對投資大眾心理的把握非常重要，過去想得不多，這次真正領教了——把群體心理視為資金博弈的成敗關鍵。"}, {"q": "主角認為股市的本質是什麼？", "a": "股市就是一場鬥智的遊戲，說白了是騙與被騙的過程，世界任何市場都存在；人們買賣股票最根本的因素是情緒的變化，忽視情緒就無法掌握對手在想什麼。"}, {"q": "莊家如何利用散戶的恐懼與貪婪來操縱情緒？", "a": "恐懼是天性，暴跌時散戶怕虧損會不計成本賣出；大漲時怕賺不到錢又急急跟進。大資金只要操控得了投資人情緒，就能讓他們幹你最需要他們幹的事。"}, {"q": "大山困惑散戶為何追漲殺跌，主角如何解釋？", "a": "不是他們反應不過來，而是根本看不明白未來怎麼走；對股市了解近乎零，從未想過從基本處了解市場，只靠打聽消息、走捷徑，還模仿電視專家。"}, {"q": "主角如何看散戶對電視專家的迷信？", "a": "專家對每次下跌都有理由解釋，大眾投資人便開始模仿；散戶自己懶惰，不願勞動，總等候專家推薦。主角感嘆投資者對莊家只有神秘、對專家卻是崇敬。"}, {"q": "老胡如何批評散戶對技術分析的態度？", "a": "他們把技術分析看成萬能，不管哪一類指標都想看出買賣點，好像什麼指標都能拿來分析買賣，卻連最基本的資本流動規律也搞得亂七八糟。"}, {"q": "主角為順利出貨安排了什麼方案？為何選高開？", "a": "下周一開盤把手頭股票折騰一番，令價格大幅走高，但必須用高開形式；對倒消耗太大，高開比較輕鬆，若三天成交超過一百億就能順利出貨。"}, {"q": "主角為何自嘲資本運作並不神秘？", "a": "他笑稱資本運作對外界神秘，實際也就是幾句話；自己寫計劃總想有點水平，文字表達卻不爭氣，反佩服專家天天說術語——神秘與崇敬的落差全在人心的距離。"}, {"q": "為何主角說資金沒出來之前不能算成功？", "a": "十五億一旦有閃失，按照協定眾人就算白做了；為求穩妥，他決定明天去咖啡館和那些人聊聊，聽聽他們對市場的看法，摸清大眾心理再行動。"}], "quotes": ["股市是什么？就是一场斗智的游戏，说白了就是骗跟被骗的一个过程，这在世界任何一个市场上都是存在的，其实人们买卖股票最根本的因素就是情绪的变化，你要是忽视了这个，你根本就不能掌握对方在想什么。", "恐惧对人类来说，是天性，没有人完全能够丢弃这些天性，疯狂地下跌，他们因为担心自己的股票遭受巨大亏损，就会不计成本地卖出，你要是大涨，那么他们也会因为担心自己不能获取利益而急急忙忙地跟进，不是这些人傻，而是条件决定了他们只能如此而已。", "他们没有什么基础，对股市的了解几乎等于0，他们也根本没有想过从最基本的地方来了解这个市场，他们所具有的概念就是打听消息，走捷径。", "投资者对我们只有神秘，对那些人却是崇敬。", "把技术分析看成万能的，不管是哪一类的指标都想在上面看出买卖点，好像不管是什么指标，只要是指标都可以拿来分析买进卖出。"], "psych": [{"p": "情緒操縱", "a": "我们是大资金，有能力控制局面，那么就应该有能力调控这些人的情绪，能够操纵投资人的情绪你就能让他干你最需要他干的事情", "n": "主角直言大資金應調控投資人情緒，驅使散戶做莊家所需之事，正是情緒操縱的赤裸自白。"}, {"p": "恐慌性拋售（恐懼）", "a": "疯狂地下跌，他们因为担心自己的股票遭受巨大亏损，就会不计成本地卖出", "n": "主力點破散戶暴跌時因恐懼而不計成本割肉，注解了恐慌性拋售的內在機制。"}, {"p": "追漲（貪婪）", "a": "你要是大涨，那么他们也会因为担心自己不能获取利益而急急忙忙地跟进", "n": "散戶上漲時怕錯失利益而急急追進，貪婪驅使的追漲行為在此被莊家親口點破。"}, {"p": "專家崇拜／過度自信", "a": "投资者对我们只有神秘，对那些人却是崇敬", "n": "散戶不懂莊家卻對滿口術語的專家頂禮膜拜，注解了迷信專家的群體心理。"}]}, {"i": 27, "title": "第二十七回　酒吧夜話全民兵", "kind": "hui", "summary": ["庄家夜谈中坦承内疚渐深，良心在疯狂牛市里备受拷问。", "老师三分股市行为：投资、投机、赌博，投机者方为赢家。", "暴富神话无时无刻不在刺激浮躁人心，全民狂热埋下隐患。", "大资金以BRAR窥人气、揣摩散户心理，一举一动皆在操纵情绪。", "单边市里人人脆弱，投资决策多半只是心理冲动的产物。"], "qa": [{"q": "叙述者的内疚感为何越来越深？", "a": "大家说得开心，没有人感到内疚，唯独叙述者近一年内疚渐深——大资金深知疯狂行情终将伤人，良心在获利与骗局之间备受拷问。"}, {"q": "老师把股市行为分为哪三类？为何投机者才能真正成功？", "a": "投资、投机、赌博三类。小资金投资难有耐心收获，赌博者很快被市场淘汰，真正成功的是不分资金大小的投机。"}, {"q": "为什么人们不愿承认自己在投机？", "a": "投机在我国是贬义词，被视为投机倒把的坏人，因此没人正视这种赚钱手段——人们以「投资」之名自我美化，正是认知失调下的合理化。"}, {"q": "暴富神话如何刺激股市参与者？", "a": "股市的暴富神话无时无刻不在刺激每个参与者，人们心理浮躁，不再适合四平八稳的生活，贪婪推动全民疯狂入市。"}, {"q": "叙述者为何凭BRAR人气指标早早出货？", "a": "人气过于高涨。1月中旬起全民疯狂，连蹬黄油车的人也在炒股，让他想起老师的话：整个社会以股市为中心就麻烦了。"}, {"q": "大资金如何操纵投资者的情绪？", "a": "技术指标发生在资金运作之后，只能暴露弱点；下一步全靠分析和推测散户心理，一举一动都影响投资人情绪，进而改变其交易行为。"}, {"q": "报纸报道的开户潮为何让叙述者警惕？", "a": "内地开户者晚上排队等候，这是全民皆兵的信号，说明股市影响太大、新资金蜂拥入市，行情已到危险的高潮期。"}, {"q": "大山为何说投资者其实脆弱得很？", "a": "我国股市是单边市，赚钱唯一办法是上涨，下跌便全线亏损，无人能摆脱规则约束；一旦明白涨跌非无缘无故，庄家就更难操纵。"}, {"q": "叙述者怎样看待投资决策的本质？", "a": "人们在投资决策时并没有考虑任何问题，只是心理上的一种冲动；即便有明白人，也没胆量逆势而为。"}, {"q": "众人开心与叙述者内疚的对比说明了什么？", "a": "众人说得开心无人内疚，唯叙述者内疚渐深——这是庄家与散户的心理反差：散户在狂欢中麻木，庄家清醒地背负道德压力。"}], "quotes": ["大家说得开心，但是没有人能够在心里感到内疚，我不知道为什么在最近一年里，这种内疚越来越深。", "股市的暴富神话无时无刻不在刺激着每个参与股市投资的人们，人们浮躁的心理已经不再适合过那种四平八稳的或者琐碎的生活", "那时候我看到一个蹬黄油车的人也在炒股。", "全部靠分析和推测散户的心理变化，你的一举一动都会影响投资人的情绪变化，他们的这些微妙的情绪变化直接影响他们的交易行为。", "其实人们在投资决策的时候并没有考虑过任何问题，只是心理上的一种冲动而已。"], "psych": [{"p": "情緒操縱", "a": "全部靠分析和推测散户的心理变化，你的一举一动都会影响投资人的情绪变化", "n": "莊家以散戶心理為決策依據，一舉一動皆在操縱情緒、引導交易。"}, {"p": "道德衝突／罪疚感", "a": "大家说得开心，但是没有人能够在心里感到内疚，我不知道为什么在最近一年里，这种内疚越来越深", "n": "莊家在眾人狂歡中獨自內疚，良心拷問隨行情愈演愈烈。"}, {"p": "心理帳戶／開戶潮", "a": "在内地开户的人晚上排队等候开户，这是很危险的全民皆兵的时候", "n": "全民排隊開戶、新資金蜂擁入市，正是行情狂熱見頂的信號。"}, {"p": "攀比與暴富敘事", "a": "股市的暴富神话无时无刻不在刺激着每个参与股市投资的人们", "n": "暴富傳說撩撥浮躁人心，令人失去四平八穩生活的耐心。"}]}, {"i": 28, "title": "第二十八回　苦咖座中听涨声", "kind": "hui", "summary": ["莊家與散戶同處一室，主角旁聽看多高論，證實砸盤後群體情緒仍被操縱。", "老孫因豫園商城百元變萬元被奉為高人，專家崇拜令眾人喪失獨立判斷。", "眾人以均線、量價、兩千點互相唱和，羊群效應與錨定讓看多敘事自我強化。", "主角直言用利益操縱情緒最簡單：男人在利益衝擊下智商等於零，貪婪令人易上當。", "主角以模型回看猛砸嚇人的行為脊梁發冷，散戶學模型只為給買賣找理由，合理化成癮。"], "qa": [{"q": "老孫為何能成為眾人眼中的股市高人？他的「先見之明」是什麼？", "a": "豫園商城發行原始股每股一百元沒人要，老孫慷慨為人解圍接下，上市後短時間衝上萬元，他變成大戶、成為股市最有發言權的人，從此不上班，坐在證券營業部做大戶。"}, {"q": "老孫看多的理由有哪些？他如何論證「強勢不怕利空」？", "a": "他指大盤跌不下去、被超級機構資金拉起，浙江資金大舉入市，連續兩次利空價格仍漲，說明強勢根本不怕利空；昨日成交量為年內最大，外圍資金都等著買股票，故應繼續持股。"}, {"q": "年輕人估計大盤能漲到2000點並拿香港作比，這背後是什麼心理？", "a": "他以移動平均線多頭排列、量價配合為據，斷言至少漲到兩千點，又以香港指數為參照，說大陸比香港大得多。整數關口與境外高點成為心理定錨，屬典型的錨定效應與過度自信。"}, {"q": "老孫一席話為何引來附和？眾人看多為何愈講愈堅定？", "a": "有人「隨聲附和：就是，講得有道理」。在咖啡館群體中，權威發言加上眾人唱和，看多觀點被反覆強化、無人唱反調，體現羊群效應與群體極化——人群聚集後觀點走向極端。"}, {"q": "主角從眾人言談中得到什麼「明顯感覺」？說明昨日什麼算計成功？", "a": "他明顯感到人們看多心理非常強烈，證明「昨天的努力沒有白干」——昨日的砸盤與操作已成功把情緒調向預期方向；作為操盤手，能把大眾心理調到這種狀態就算成功，這是情緒操縱的實證。"}, {"q": "主角為何說「用利益操縱人們的情緒是最簡單的一件事情」？", "a": "因為人都是為了賺錢才走進股市，貪欲驅使下判斷力大打折扣；他引用「男人在利益衝擊下智商等於零」，說明利益衝擊下讓人上當受騙比較容易，情緒操縱因此成本最低、最易得手。"}, {"q": "主角對前人總結的數學模型為何既讚賞又「脊梁骨發冷」？", "a": "他讚賞模型對資金運作的跟蹤簡直天衣無縫；但每次猛砸一陣、嚇唬別人出局後，用前人模型回看自己的行為，都會脊梁骨發冷——行為被模型看穿，暴露操盤者的破綻與職業孤獨。"}, {"q": "人們學習數學模型的真實目的是什麼？這反映什麼心理？", "a": "他們不是讓模型指導自己的資金運作，而是為行情走勢和自己的買賣行為尋找一種理由，把技能當作學問去研究。這是認知失調下的合理化：先有結論，再找證據自我說服，而非修正判斷。"}, {"q": "開篇「咖啡很苦所以加糖」的比喻，與本章股民心態有何關聯？", "a": "主角不解嫌苦為何不乾脆不喝，隱喻股民明知股市苦澀風險仍戀棧其中，靠各種理由自我安慰；眾人的看多依據正如給苦咖啡加糖，用合理化掩蓋不願面對的真相。"}, {"q": "滿座股民「意氣風發、指點江山」，主角卻覺得他們可憐，心理落差何在？", "a": "眾人沉浸在集體看多的狂熱中，自認勝券在握；主角以莊家視角看穿他們只是被操縱的獵物，可憐而不自知。狂歡的群體心理與操盤者的冷眼異化，構成全章最深的心理對照。"}], "quotes": ["咖啡很苦，所以人们在喝咖啡的时候都喜欢加糖，加糖喝咖啡看起来是顺理成章的事情，但是我就是不明白，如果嫌苦的话还不如不喝。", "我们从这儿明显地感觉到人们看多的心理非常明显，就是说昨天的努力没有白干，人们的情绪还是在一定程度上被操纵", "女人在谈恋爱的时候智商等于零，男人在利益冲击下智商等于零。", "人们学习这些模型的时候并不是想让这些模型指导自己的资金运作，而是为了行情走势以及自己的买卖行为寻找一种理由而已。", "我试图在猛砸一阵子以后，吓唬别人出来，往往都很有成效，但是我用前人总结的数学模型去观察我的行为的时候，每次都会脊梁骨发冷"], "psych": [{"p": "情緒操縱", "a": "我们从这儿明显地感觉到人们看多的心理非常明显，就是说昨天的努力没有白干，人们的情绪还是在一定程度上被操纵", "n": "主角親證砸盤之後眾人看多情緒仍在掌控之中，莊家操縱大眾情緒的實例。"}, {"p": "專家崇拜／過度自信", "a": "老孙在大家心中的影响力也很大。", "n": "眾人因老孫一次暴富便奉其為高人，盲目信從其看多分析，喪失獨立判斷。"}, {"p": "羊群效應（從眾）", "a": "有人随声附和：“就是，讲得有道理。”", "n": "老孫一言既出眾人齊聲附和，看多觀點在群體中迅速成為一致，無人唱反調。"}, {"p": "認知失調／合理化", "a": "人们学习这些模型的时候并不是想让这些模型指导自己的资金运作，而是为了行情走势以及自己的买卖行为寻找一种理由而已", "n": "散戶學技術模型只為給自己的買賣找理由，先有結論再找證據自我說服。"}]}, {"i": 29, "title": "第二十九回　钟鸣惊梦停报单", "kind": "hui", "summary": ["报载新股额度高达100亿，政策利空压制市场情绪，主角急于出货却高开诱多，跟风寥寥如自买自卖。", "钟声与墙上警语「你为什么不停下来」点醒主角，立即停止报单，打破紧张情绪下的盲目行动。", "价格回落反放量，试抛3000股被一抢而空，主角看穿散户贪小利抢短线的追涨心态，心理包袱反而卸下。", "主角独访静安寺寻求灵魂净化，自嘲作孽与神明会计之喻，尽显职业投资人的孤独与庄家的良心拷问。", "下午改以五分钟千股小单试盘、顺势出货，2:30消息灵通者抢跑引跳水，主角接货护盘守住心理价位。"], "qa": [{"q": "报纸头版关于新股额度的报道是什么？与市场传闻有何不同，透露了管理层的什么意图？", "a": "报道称新股额度不是原40亿、也非传说的25亿，而是高达100亿，对市场规模是致命打击，反映管理层限制股市上涨的意图。主角判断若市场继续不跌，后面必有更厉害的政策。"}, {"q": "开盘半小时成交量很小、gp一直低于2，主角为何说自己在跟自己交易？这暴露了什么心态？", "a": "高开缩量、跟风者寥寥，成交多半是自己的委托，等于自买自卖无法出货。他脑子一片空白、烦躁走动，承认这种被动的局面对他是头一次，情绪已压过理性。"}, {"q": "「你为什么不停下来！！！」这句警语是什么来历？为何能在关键时刻点醒主角？", "a": "原是主角在寺庙所见警语，请名人书写挂在墙上。11点钟声响起，他抬头见到此句忽然清醒，快步吩咐报单员停止报单——一句警语中断了紧张情绪下的自动化行为。"}, {"q": "价格下跌后成交量反而放大，试抛3000股瞬间被吃掉，主角如何解释这反常现象？", "a": "对方确认并未接盘，他明白人们虽害怕却仍想抢短线赚蝇头小利，小资金总以为短线利润最大、风险最小，有机会便不惜冒险——抢反弹的贪念压过了恐惧。"}, {"q": "主角认为「让他们赚一次钱地球都小了」，这句话揭示了散户的什么心理？", "a": "揭示追涨贪婪与短线幻觉：散户一旦尝到甜头便贪欲膨胀、高估自己，很多人高位长期被套正是源于这种思路。庄家正是利用这份贪小利心理诱其高位接盘。"}, {"q": "中午主角为何独自去静安寺？他在那里寻求什么？", "a": "他心里空荡荡，觉得需要到寺里净化另外一个灵魂。佛乐香火间没有恐惧担忧、勾心斗角和骗人计谋——这是职业投资人对清净世界的渴望，也是异化的短暂逃离。"}, {"q": "走出寺庙后主角为何笑自己愚蠢？「神明旁边有会计」的比喻说明什么？", "a": "他自认操盘在神明眼里是作孽，神明公正必不帮他。调侃神明旁有会计，按奉献与庇护结算——自己花不到50元，佛岂会保佑15亿资金。用自嘲的合理化卸下良心重负。"}, {"q": "下午主角改用何种方式出货？与上午的急拉相比有何心理转变？", "a": "改为每次抛1000股、每5分钟下单一次的小单慢出，静静观察。gp升到4，人们愿在较低位置介入，顺其自然比死命拉抬更好——从对抗情绪转向顺势而为。"}, {"q": "下午2:30价格忽然大跌，主角如何判断并应对？", "a": "从成交看是消息灵通的聪明人抢先离场。他命人接货护盘，不让价格跌下去；15分钟后止跌回升，但走势脆弱仍无法出货，成交量较昨日严重萎缩。"}, {"q": "本章主角背负的「沉重的情感负担」指什么？如何影响他的行为？", "a": "他说一旦失误自己责任有限，老头子的责任很大。这份牵挂让他越想越烦、越烦越乱，甚至躲进里间不愿让人看到狼狈，也使他上午在紧张中做出不理智的高开出货举动。"}], "quotes": ["如果市场继续不跌，那么我估计后面一定会有更厉害的政策。", "你为什么不停下来！！！", "你只要让他们赚一次钱，在他们的眼里地球都很小，地球已经不能满足他们的生存需要，", "我总共就花了50元不到，我想佛肯定不会保佑我15亿的资金，如果要是真的保佑了，我想那个人肯定是失职的。", "还是古人说得好，自己吓自己要比别人吓自己结果更糟糕。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "我精神一振，通知报单员抛出去3000股试一下，结果很快就被吃掉", "n": "庄家以试盘探市场承接力，散户抢反弹接货，心理较量高下立判。"}, {"p": "追漲（貪婪）", "a": "你只要让他们赚一次钱，在他们的眼里地球都很小，地球已经不能满足他们的生存需要，", "n": "散户赚一次便贪欲膨胀，追高抢短成惯性，最终高位被套。"}, {"p": "孤獨與異化", "a": "就这样我在这个纯净的世界里净化我另外的灵魂", "n": "职业投资人独自赴寺洗涤心灵，道尽操盘生涯的孤寂与自我疏离。"}, {"p": "道德衝突／罪疚感", "a": "我这样的做法在神明眼里应该是作孽，所以神明肯定不会帮我的", "n": "庄家自认操纵股价是作孽、神明必不庇护，良心拷问尽在其中。"}]}, {"i": 30, "title": "第三十回　哀乐忆父股海愁", "kind": "hui", "summary": ["夜闔燈獨聽哀樂，反從如泣如訴中聽出生命可貴，為自己還活著而興奮振作。", "對鏡自斟驚覺鏡中人陌生，回想歲月空過潸然淚下，索性放聲大哭，哭盡童年與父恩。", "哭股市煉獄折磨，沉穩冷漠使我看來足有四十，內在已被股市異化改變。", "憶九歲雪夜窯洞前等父歸，見煤油燈下父親滄桑面容而哭，從父親學會堅強。", "開盤遲滯清淡眾人觀望看多；莊家砸盤試探、撤單造壓，一比一點五顯示散戶未絕望。"], "qa": [{"q": "主角為何關燈獨聽哀樂？從中他得到了什麼心理安慰？", "a": "他從哀樂中聽不到恐懼，反而聽到生命的可貴與歡樂；如泣如訴的韻律讓他不平靜的靈魂得到安慰，因為他知道「我最起碼還活著」，在死亡意象中反確認了生命。"}, {"q": "主角對鏡獨酌時為何流淚，甚至被鏡中的自己嚇了一跳？", "a": "他越看越覺得鏡中的自己陌生，回想走過的這麼多年好像什麼也沒做，一下子就這個歲數；看到鏡中自己在流淚竟吃了一驚，奇怪自己居然也會流淚，正是職業投資人自我疏離的寫照。"}, {"q": "主角放聲大哭哭的是哪三件事？這反映他怎樣的內在狀態？", "a": "一哭苦難深重的童年，二哭不能在父親床前行孝，三哭自己在股市這個煉獄裡遭受折磨；他實際年齡不大，卻因沉穩冷漠被看成足有四十歲，內心已被股市異化。"}, {"q": "雪夜等父歸那一幕，主角從父親身上學到了什麼？", "a": "半夜醒來，見煤油燈昏光映出父親充滿艱辛的臉孔，他躲在被子裡哭了；翌晨父親什麼也沒說，只往書包裡裝一個饅頭說「念書去吧」，他從父親那裡學會了堅強。"}, {"q": "開盤後「我」憑什麼判斷散戶的群體心理？", "a": "走勢極其遲滯、成交清淡，低開上推收效不大，盤口幾乎一對一；他判斷大家都在看勢頭、起碼沒人想跑出去，否則成交量早就下去了，可見眾人看多意願仍很強。"}, {"q": "莊家為何選擇向下砸盤而非硬性上推？運用了什麼心理戰術？", "a": "硬性上推會引起大家疑慮，猛然下砸反而能吸引做短線的人，所以沿用上次做法；他吩咐同夥不能跟著砸、也不能接貨，需要托盤時再通知，正是以節奏試盤操縱情緒。"}, {"q": "「我」如何用報單製造賣壓假象？見效後又做了什麼？", "a": "他吩咐報單員一分鐘報單一次、每次兩千股不計價位拋出；單子無法成交而積壓，讓人們明顯感到賣壓的存在，見效後他便吩咐把未成交單子全部撤掉，操控大眾情緒。"}, {"q": "一個一百股的小單把價格拉起來，「我」從中看出了什麼群體心態？", "a": "他明白這一隻股票的反應說明其他股票的走勢也一樣，人們顧慮比較大但絕對沒有絕望；眾人只是跟風看勢頭、不願出逃，正是典型的觀望從眾心理。"}, {"q": "盤口一比一點五說明什麼？莊家與散戶之間在進行什麼較量？", "a": "一比一點五說明別人不願意跟他拋空、還想賺錢，只是觀望而非恐慌出逃；這是莊家與散戶的心理較量，雙方都在試探對方承受力，看誰先撐不住。"}], "quotes": ["我最喜欢听的音乐就是哀乐，我从那个乐曲里听不到恐惧，我听到了生命的可贵，我能听到生命的欢乐。", "我知道我最起码还活着，这就是最珍贵的。", "看着镜子里边那个陌生的我，就这样我越看越觉得自己很陌生", "我哭我自己苦难深重的童年，我哭我不能在父亲床前行孝，我还哭自己在这个股市的炼狱里遭受这样的折磨", "因为我抛单的gp是1比1.5，这就充分说明别人还不愿意跟我抛空，还想赚钱。"], "psych": [{"p": "孤獨與異化", "a": "看着镜子里边那个陌生的我，就这样我越看越觉得自己很陌生", "n": "職業投資人自我疏離，鏡中自己竟覺陌生，內在已被股市異化。"}, {"p": "死亡焦慮", "a": "我最喜欢听的音乐就是哀乐，我从那个乐曲里听不到恐惧，我听到了生命的可贵", "n": "以哀樂直面死亡焦慮，反從中確認自己還活著而得到安慰。"}, {"p": "情緒操縱", "a": "人们能够很明显地感到卖压的存在，看到这个现象我吩咐报单员：“把刚才报出去没有成交的单子全部撤掉。”", "n": "莊家以虛假賣壓操控大眾情緒，撤單製造壓力假象試探人心。"}, {"p": "心理較量（看誰先崩潰）", "a": "因为我抛单的gp是1比1.5，这就充分说明别人还不愿意跟我抛空，还想赚钱", "n": "莊家與散戶比心理承受力，看誰先撐不住，砸盤正是試盤較量。"}]}, {"i": 31, "title": "第三十一回　夜听人言谋退路", "kind": "hui", "summary": ["散戶群體心理：數月漲勢令人遺忘下跌，莊家拋售近億籌碼，市場一碰即垮，眾人仍在等漲。", "心理較量：莊家出貨前先算承接力與跌幅，三天清倉恐跌二百至五百點，改延五日以維繫信心。", "信息瀑布：營業部門前缺口論、人代會、香港點位皆成看多理由，掌聲雷動、觀點互相強化。", "主角異化：職業資金運作者只信己見，與散戶談資格格不入，職業名聲竟比金錢更重。", "情緒壓抑：老胡因孕欲婚，主角以推妻入江的黑色玩笑應對，笑談間暗藏沉重與疏離。"], "qa": [{"q": "莊家拋售近億籌碼後，為何說市場「一碰就垮」？散戶當時是什麼心理狀態？", "a": "市場脆弱得稍微一碰都可能迅速垮台；但散戶並無一碰就垮的預感，只等待何時繼續上漲——數月漲勢已令他們忘記股價還可以下跌。"}, {"q": "從心理學看，散戶為何在莊家出貨時仍堅信只是回調？", "a": "數月漲勢形成心理定錨，眾人以缺口、人代會、香港點位自圓其說，群體一致的樂觀互為印證，風險感知完全鈍化，無人相信頂部已至。"}, {"q": "營業部門前的「消息集散地」如何注解散戶的群體心理？", "a": "賣茶蛋、賣報、賣K線圖與江恩四方形者聚集於此，眾人三五成群交換看多理由，並以掌聲互相強化——典型的信息瀑布與從眾氛圍。"}, {"q": "主角為何說職業資金運作者「誰都不相信，只相信自己的所見」？", "a": "操盤靠資金與籌碼博弈，任何輿論都可能被對手利用；只信親眼所見才能避開信息瀑布的干擾，這正是莊家與散戶的心理落差所在。"}, {"q": "主角面對散戶的東拉西扯為何自感「孤陋寡聞」？反映什麼心理反差？", "a": "散戶談美國股市、人代會、香港點位，主角卻只算計如何操縱參與者的情緒——一方在信息瀑布中狂歡，一方獨自承受風險，兩者已完全異化。"}, {"q": "會計計算清倉對指數的影響，體現了莊家的什麼心理戰術？", "a": "三天清倉恐跌二百至五百點，任何跌幅都會導致價格崩潰；莊家須按承接力延長出貨時間，以節奏與試盤避免擊穿散戶的心理承受底線。"}, {"q": "主角為何說「這不是錢的問題」？反映其職業心理怎樣的變化？", "a": "他怕擔「無能」的惡名，圈圈不大，日後人人會說他在高位入市——職業聲譽已內化為比金錢更高的執念，自我認同與股市深深綁定。"}, {"q": "老胡轉述專家的「中繼缺口」理論，台下反應如何？有何心理意義？", "a": "專家稱指數在此基礎上還要上漲一半，台下鼓掌，上海老漢竟起身道謝——專家崇拜與過度自信，讓散戶把別人的「研究結果」當成救命稻草。"}, {"q": "主角如何評價「老頭」與「專家」？注解了什麼心理現象？", "a": "「老頭可憐是因為糊塗，但是還要賺錢，專家可憐是因為胡說害人害己」——散戶的無知與專家的過度自信互相成全，構成一場可憐又可嘆的博弈。"}, {"q": "老胡宣布結婚一事，主角用什麼方式回應？反映怎樣的心理狀態？", "a": "主角戲言把懷孕的女友推到外灘、待掛外國國旗的船過來再推下黃浦江——以黑色幽默消解壓力，笑談之下是職業異化者情感疏離與壓抑的投射。"}], "quotes": ["几个月的涨势让人们已经忘记股票价格还可以下跌，看着临收盘前的走势我在沉思。", "一个职业的资金运作者最大的特点就是在资金运作的时候谁都不相信，只相信自己的所见。", "从他们喜悦的脸上我没有看到惊惶失措和危机，只是感觉到他们还是很自信、很幸福地等待财富的降临。", "老头可怜是因为糊涂，但是还要赚钱，专家可怜是因为胡说害人害己。", "不管出现什么情况，必须听我指挥，不能乱来更不许自作主张，如果谁愿意再次被套进去谁就自由一点。"], "psych": [{"p": "信息瀑布（謠言市）", "a": "有人说：“现在绝对是一个小小的回调，不会是下跌的，你看看前几天的缺口说明什么？", "n": "看多言論在集散地經掌聲互相強化，預期自我實現，散戶集體喪失獨立判斷。"}, {"p": "錨定效應", "a": "几个月的涨势让人们已经忘记股票价格还可以下跌，看着临收盘前的走势我在沉思。", "n": "數月漲勢成為心理錨點，令散戶只預期上漲而徹底遺忘下跌的可能。"}, {"p": "專家崇拜／過度自信", "a": "谢谢你X先生，你确实是一个大好人啊，能把自己的研究结果毫无保留地告诉我们，我们这些小户怎么感谢你啊！", "n": "專家一句「中繼缺口」便贏得掌聲與老漢起身道謝，散戶迷信權威研究。"}, {"p": "孤獨與異化", "a": "说句实在话，自从这次杀入重围解救兄弟们以来我很少看电视，一门心思只是在想怎么操纵好参与市场的投资者的情绪，我们这样一个小小规模的市场在国民经济发展中占的比例实在太小，", "n": "職業操盤手與散戶世界徹底割裂，只算情緒操縱，自感孤陋寡聞而疏離。"}]}, {"i": 32, "title": "第三十二回　冬晨股海起波澜", "kind": "hui", "summary": ["主角晨見路人行色匆匆，感嘆人明知遲早要死仍勤奮忙碌，死亡意識下更顯生存執念。", "證券公司未開門股民已聚候門前，開盤拉升後買進窗口再度排隊，追漲從眾之態畢現。", "關鍵時刻全封閉會計助手以防洩密，主角自感事業神聖高不可測，流露操盤者的孤獨異化。", "主角改打為拉誘使散戶入場，gp升7後加碼出貨，恐引恐慌性拋售而緊急收手。", "主角自述對上升K線天生恐懼，收盤前又強拉營造漲勢，深諳並操控市場情緒。"], "qa": [{"q": "開盤前，主角為何臨時調整計劃「向上拉」而非往下打？這是莊家常用的什麼心理戰術？", "a": "他認為上漲才有吸引力，用拉抬營造賺錢氛圍誘使散戶入場，這正是莊家「誘多」與「情緒操縱」——先製造火熱行情，再趁人氣高漲悄悄出貨。"}, {"q": "主角從「gp已達7」與「買進窗口排隊」中讀出了散戶的什麼心理？", "a": "他讀出散戶沉浸在漲勢喜悅中、風險意識薄弱，見漲便排隊搶買，表現出典型的羊群效應與追漲心理；眾人一致看好，正是莊家出貨的溫床。"}, {"q": "主角說自己對K線「向下安全、向上恐懼」，這種心理如何注解「心理支撐位」？", "a": "他習慣下跌的節奏，把下行當作心理安全區，上行反而因失控而恐懼，等於把市場節奏內化為心理定錨，恐懼感成為他決定出貨的信號。"}, {"q": "主角為何在鋼管股價上漲時「加大一倍出貨量」，之後又緊急停止？", "a": "他判斷散戶還沉浸在上漲喜悅、未察覺風險，趁機加快出貨；但其他股票跟跌、gp暴跌至3，他怕引發恐慌性拋售導致價格崩潰，只得停手觀望。"}, {"q": "文中「gp」是什麼？它從7跌到3說明了什麼群體心理變化？", "a": "gp是反映散戶買進熱情的指標。它從7跌到3，說明十幾分鐘內買氣迅速消退，群體熱情由沸騰轉為觀望，恐慌隨時可能被引爆。"}, {"q": "主角「連自己都崇敬起來」反映了他怎樣的心理狀態？", "a": "封閉信息、掌控行情讓他自感事業神聖、高不可測，這既是職業孤獨下的自我崇拜，也是把操盤能力歸功於自己的自我服務偏差，是典型的異化。"}, {"q": "收盤前主角下令「拉起來給人一種重新向上的感覺」，這是什麼心理戰術？", "a": "這是典型的「誘多」與情緒操縱：用尾盤強拉製造行情重新向上的錯覺，穩定散戶信心、吸引接盤，讓散戶誤以為下跌只是暫時調整。"}, {"q": "主角怒斥大山「是不是瘋了」的原因是什麼？體現了莊家之間怎樣的較量？", "a": "大山不顧gp已高仍猛拉股價、吃進大量籌碼，害主角出不了貨。這體現莊家間的心理較量——誰亂了節奏，誰就可能被對手拖入險境。"}, {"q": "本章開頭主角對行色匆匆路人的感慨，蘊含什麼心理學意味？", "a": "他感嘆人明知遲早要死仍勤奮忙碌，暗含死亡焦慮下的人性執念；也映照他自己在生死感觸與股市搏殺之間的孤獨心境。"}, {"q": "主角「每次有恐懼感就準備出貨」的習慣，說明他如何與市場博弈？", "a": "他用自己的心理節奏反周期操作——大眾狂熱時他恐懼出貨、行情失控時他拉抬護盤，正是莊家與散戶心理較量「看誰先崩潰」的縮影。"}], "quotes": ["其实每个人都知道自己迟早会死的，但是只要活着总是这样行色匆匆地忙碌", "每到关键的时候这些人都是全部被封闭起来，跟外界断绝来往，就是怕他们在关键时候泄漏信息，导致我们的行为被外界发现", "我感觉要立即停止出货，不然会引起恐慌性抛盘出来的，那样就麻烦大了", "我对K线天生有一种恐惧感，这个东西一直向下的时候我感觉很安全，但是一旦它一直向上我就感到越来越恐惧", "开始拉吧，不能让价格这样无休止地下跌，上午收盘前一定要拉起来，给人一种重新向上的感觉，而且力度要大。"], "psych": [{"p": "情緒操縱", "a": "我觉得没有必要开盘往下打了，应该向上涨，这样才有吸引力", "n": "先拉抬造勢吸引散戶入場，再趁人氣高漲出貨，操控大眾情緒以達目的。"}, {"p": "羊群效應（從眾）", "a": "gp已经达到7，各营业部的交易都很不错，买进窗口的人们又开始排队了", "n": "見漲即排隊搶買、眾人一致看好，散戶的從眾與追漲之態躍然紙上。"}, {"p": "恐慌性拋售（恐懼）", "a": "我感觉要立即停止出货，不然会引起恐慌性抛盘出来的，那样就麻烦大了", "n": "莊家深知下跌一旦擴散，散戶不計成本拋售將引發崩潰，故在恐慌前收手。"}, {"p": "孤獨與異化", "a": "每当这个时候我就特别地感到我这个事业的神圣，更加感觉到高不可测，连我自己对自己都开始崇敬起来", "n": "幕後操盤與世隔絕，主角對自己產生異化的崇敬，職業投資人的疏離畢現。"}]}, {"i": 33, "title": "第三十三回　笑看資潮逐浪高", "kind": "hui", "summary": ["尾盤指數急升創新高，主角斷定新資金追高入場，急命助手查券商開戶印證判斷。", "開戶資料顯示億元大戶一周內集中開戶，主角算出其獲利約兩成，料資金重心移向股市。", "欣喜之餘難免惆悵：預料實業致富者與散戶資金將隨富人倒下，幻覺中K線如電線桿崩塌。", "桿下人身被高壓電燒盡，主角自認旁觀者、可全身而退，流露職業投資人的孤獨與異化。", "午後以節奏性分批拋售壓價，收盤仍微漲，以「幾個點的希望」維繫追高者，穩住盤面。"], "qa": [{"q": "莊家用了什麼心理戰術，讓追高的新資金「不產生任何懷疑和擔憂」？", "a": "靠控制盤中節奏出貨：只要節奏把握好價格就跌不下去，再以微漲收盤維繫希望，追高資金便不生疑、不擔憂，安心把籌碼接過去。"}, {"q": "新資金為何不在低價時買進，偏偏「追高」入市？這反映什麼群體心理？", "a": "新資金不懂股市，低價時疑懼觀望、見漲才敢進場，一味追高；這是典型的追漲貪婪與羊群從眾——眾人一致看好，便爭相搶進。"}, {"q": "主角看到開戶資訊後為何「欣喜之餘難免有一種惆悵」？", "a": "欣喜於自己可安全獲利出局；惆悵則因預料實業致富者與眾多散戶資金將隨富人一塊兒倒下，眼見他人將成祭品而喜憂參半。"}, {"q": "「K線像倒塌的高壓電線桿」的幻覺象徵什麼？主角為何打冷顫？", "a": "象徵大資金撤離時股價崩塌的毀滅性：電線桿倒下，杆下人身被高壓電燒盡；他明白自己能全身而退、是旁觀者，故生此幻覺而震動。"}, {"q": "主角「怎麼就不明白這些人的思路」——追高者為何不問股票是誰賣給他們的？", "a": "源於對證券市場的無知與從眾心態：只知買進、不問賣方是誰，生意場上精明的人入市後也失去判斷，任由主力悄悄出貨。"}, {"q": "收盤價「比昨天上漲幾個點」對追高者有何心理意義？", "a": "微漲就是「希望」：有這幾個點他們就不會對行情絕望，繼續安心持倉；莊家刻意維持這幾個點，正注解心理支撐位的定錨作用。"}, {"q": "主角自認「是一個站在旁邊看的人」，反映他怎樣的心理狀態？", "a": "職業莊家的孤獨與異化：他眼看他人將被燒盡，卻自認站在一旁、只求自己全身而退，對別人的苦難近乎麻木冷眼。"}, {"q": "主角為何責罵自己「簡直是昏頭了」？", "a": "他記起從上次助手賣消息起這些大戶已賺約兩成，如今更把資金重心移向股市；懊悔自己忘了這件大事、遲未盤算，故罵自己昏了頭。"}, {"q": "保安部把追高的大戶代表「接到預先訂好的酒店」，用意何在？", "a": "既控制其行動、防其察覺拋售真相，次日再準時送回；也便於主角晚間與兄弟聚會統計手中籌碼，部署後續出貨節奏。"}, {"q": "結尾主角「只想回農田轉轉」，流露什麼樣的心理？", "a": "農民兒子的土地情結：目標清楚、思路清晰之時，田園是他排遣緊張、安放心緒的歸宿；股市是戰場，唯有土地令他感到踏實。"}], "quotes": ["我仿佛看到那个K线就像一个倒塌下去的高压电线杆，慢慢地慢慢地往下倒，下面是一群被高压电击中而燃烧的人的躯体，那些躯体变形歪曲，人们在痛苦中就这样被烧死，燃尽。", "他们不知道在低价的时候大量地买进，而是追高。", "只要盘中节奏把握好，价格肯定跌不下去，这些资金根本不会产生任何怀疑和担忧。", "虽然少，这对这些不懂股市的人来说就是希望，有这几个点他们就不会对行情产生绝望。", "我是一个站在旁边看的人，我并没有被烧死被燃尽。"], "psych": [{"p": "追漲（貪婪）", "a": "他们不知道在低价的时候大量地买进，而是追高", "n": "新資金不懂低位吸納，見漲才敢追，注解追漲的貪婪心理。"}, {"p": "情緒操縱", "a": "只要盘中节奏把握好，价格肯定跌不下去，这些资金根本不会产生任何怀疑和担忧", "n": "莊家以節奏控盤、維持價位，讓接盤者不起疑，正是情緒操縱。"}, {"p": "心理支撐位", "a": "虽然少，这对这些不懂股市的人来说就是希望，有这几个点他们就不会对行情产生绝望", "n": "收盤微漲數點成為追高者的心理支撐，使其不至絕望而安心持倉。"}, {"p": "孤獨與異化", "a": "我是一个站在旁边看的人，我并没有被烧死被燃尽", "n": "眼看他人將被燒盡而自認旁觀者，注解職業投資人的疏離異化。"}]}, {"i": 34, "title": "第三十四回　春野爭田悟股場", "kind": "hui", "summary": ["田野爭地之鬥，注解財富佔有慾使人鋌而走險，與股市搏殺本質同源。", "實業資金目標僅一成、漲時從容跌時無策，因無知而自負，是過度自信的典型。", "操盤手的職業本能令他不安，查證持倉與對手價差後，心中方才踏實。", "大山賭氣猛拉兩萬餘股，主角譏其心理測試至少七十分，情緒化交易險成禍端。", "莊家定計以百分之十五深跌打亂對手思維，臨收盤再拉，盡顯心理較量與節奏操控。"], "qa": [{"q": "主角從農人爭地之鬥看出什麼人性？與股市有何關聯？", "a": "農人為不多的地盤打得頭破血流，主角由此想到人對財富的佔有慾望讓人不顧一切，所以股市上鋌而走險的行為也完全可以理解——貪婪與佔有慾是兩者共同的人性驅力。"}, {"q": "主角如何剖析實業資金的『過度自信』心理？", "a": "他們在實業界摸爬滾打出來，人人都有自己的觀點，對股市無知反而顯得很自負；目標只在一成左右，漲時得心應手，跌時毫無應對策略——因無知而輕敵，正是過度自信的寫照。"}, {"q": "主角為何斷言對手『往下跌也會斬倉』？反映什麼心理？", "a": "因為他們缺乏下跌應對策略，也不會像散戶一樣死等，若續跌必毫不猶豫斬倉；這反映損失厭惡與恐慌——寧願割肉認虧，也不願承受虧損擴大的煎熬。"}, {"q": "大山今天為何『狠命往上拉』？主角如何評價他？", "a": "他不知跟誰飆上，對方在他拉抬時就出貨，賭氣之下猛拉，吃進兩萬餘股；主角怒斥此時不是賭氣的時候，譏他該測試心理、最少七十分——情緒化的意氣之爭險成禍端。"}, {"q": "主角明天的『打十五巴仙』計劃屬於什麼心理戰術？", "a": "他令大山開盤拋售、跌幅至少打到百分之十五以打亂對方思維，下午臨收盤再拉；這是典型的砸盤與節奏操控，用深度下殺動搖對手心理定力，再擇機拉抬，看誰先撐不住。"}, {"q": "主角為何不願用專門的人和車？體現什麼心理狀態？", "a": "他不願別人知道自己的生活規律，寧可臨時叫計程車；他感嘆城市的好處是要什麼服務馬上就能得到，只要口袋有錢——這種刻意隱藏與獨來獨往，是職業投資人被股市異化的孤獨寫照。"}, {"q": "主角從資料中看出對手資金有哪些特點？", "a": "開戶資金很多但單個賬戶不大、進出容易，跑道通暢；對利益追求不高，目標一般在一成左右，漲時得心應手，跌時缺乏策略，個性固執、特別自負。"}, {"q": "主角為何認為明天不論漲跌都很麻煩？他的不安如何消除？", "a": "若續漲，對手會在拉抬時把籌碼交出；若下跌，他們會毫不猶豫斬倉，兩種結果都糟，況且他尚不知己方持倉狀態；搞清問題後他內心踏實——不安源於未知，踏實源於查證。"}, {"q": "主角在酒吧為何暗罵大山『真不是東西』？", "a": "大山與陪酒小姑娘一人一杯比賽喝酒已近醉，主角本想掏錢替他付酒錢，領班卻說都記在主角賬上，他心想『給老子記在賬上』，故此暗罵；亦見其被同伴依賴的無奈。"}, {"q": "查明對手價差百分之十三後，主角為何能當機立斷？", "a": "老胡查出對方進貨與出貨價差約百分之十三，證實正是那批實業資金；資訊確定後主角立即定下拋貨、砸盤、臨收盤拉抬三步棋，說明莊家的決策建立在查證之上，而非情緒與猜測。"}], "quotes": ["我想到人不管是做什么的，对财富的占有欲望让人们不顾一切，就为了这不多的地盘这两个人打得头破血流，所以在股市上这种铤而走险的行为也完全可以理解。", "因为他们都是在实业界摸爬滚打出来的，每个人都有自己的观点和对事物的看法，对股市的无知让他们显得非常自负", "如果往下跌他们也会毫不犹豫地斩仓，这样结果更糟糕。", "你真是王八蛋，他妈的这时候不是赌气的时候，你小子看来是病了，你应该测试一下心理，我感觉你最少在70分。", "明天最少的跌幅也要打到15％，打乱他们的思维，下午临收盘的时候再拉。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "明天最少的跌幅也要打到15％，打乱他们的思维，下午临收盘的时候再拉", "n": "莊家以百分之十五深跌動搖對手定力，逼其先崩潰，正是心理較量。"}, {"p": "專家崇拜／過度自信", "a": "因为他们都是在实业界摸爬滚打出来的，每个人都有自己的观点和对事物的看法，对股市的无知让他们显得非常自负", "n": "實業資金憑實業經驗自負輕敵，因對股市無知而過度自信。"}, {"p": "孤獨與異化", "a": "我不愿意别人知道我的生活规律，所以不愿意要专门的人专门的车", "n": "職業操盤手隱藏生活規律、獨來獨往，透出被股市異化的疏離。"}, {"p": "恐慌性拋售（恐懼）", "a": "如果往下跌他们也会毫不犹豫地斩仓，这样结果更糟糕", "n": "缺乏跌勢對策的實業資金，一旦下殺便毫不猶豫斬倉出逃。"}]}, {"i": 35, "title": "第三十五回　卅点低开梦碎时", "kind": "hui", "summary": ["低開三十點令前幾日參與者的收益化為烏有，眾人悔恨與憤怒交織，正是損失厭惡的集體爆發。", "主角面無表情研判盤面，判斷此刻拉升乏人跟進，改以反彈加大出貨，盡顯莊家節奏算計。", "主角自認已無良心道德，下令不限價密集狂拋，以恐慌性暴跌製造崩潰氣氛，掩護自身出貨。", "報單員清脆聲音與指數高空墜物式暴跌並置，成千上萬投資者血本無歸，反諷股市的殘酷。", "浮雕因特哥瑞提與竊賊之神赫爾摩斯並置，點破證券市場以美好表象掩飾欺騙的古老本質。"], "qa": [{"q": "低開三十點為何讓參與者集體陷入悔恨與憤怒？這注解了什麼心理現象？", "a": "浮盈一夜化為烏有，眾人既憤怒莊家的殘酷，又悔恨自己未在適當時候賣出，損失的劇痛遠超獲利的喜悅，正是損失厭惡在群體中的集體爆發。"}, {"q": "主角為何判斷此刻「向上拉」不會吸引資金？這反映莊家什麼心理算計？", "a": "他深知眾人已在暴跌與落差中信心受創，此刻拉升缺乏跟風資金，遂按節奏先探持倉、借反彈加大出貨，顯示莊家善於踩準群體心理的節奏。"}, {"q": "主角「已經沒有什麼良心或者道德」的自白，注解了什麼現象？", "a": "他明知不限價狂拋將令成千上萬投資者血本無歸，仍冷靜下令，說明莊家的道德底線在利益前崩潰，良心的自我拷問已讓位於赤裸的獲利邏輯。"}, {"q": "主角給報單員下達了什麼具體指令？他預計會帶來什麼後果？", "a": "每分鐘三千股、不限價格拋出，持續十分鐘；他知道這種密集大單會對市場造成巨大衝擊，指數會如高空墜物般快速下降。"}, {"q": "為何主角面無表情反而讓屋裡所有人感到緊張？", "a": "眾人從他毫無表情的臉上讀不出方向，未知與壓抑比暴跌本身更折磨神經；莊家的冷靜本身就是一種無形的心理施壓，令旁觀者率先繃不住。"}, {"q": "報單員清脆的聲音與股價暴跌之間構成什麼反諷？", "a": "聲音愈是清脆動聽，指數跌得愈是猛烈，成千上萬投資者血本無歸——悅耳的形式承載最殘酷的內容，反諷股市以動聽表象掩飾毀滅本質。"}, {"q": "浮雕「因特哥瑞提保護人類工作」的構圖如何？", "a": "群像中央是因特哥瑞提，一邊是科學、進步、工業、勞動發明者的形象，另一邊是礦業和農業，象徵證券市場具有保護人類的意義。"}, {"q": "讓女人戴竊賊之神赫爾摩斯的頭盔，主角如何解讀？", "a": "他猜想是以女人善良美麗的一面來掩飾證券市場的欺騙行為，感嘆一九○三年美國人便深知股市欺騙乃尋常之事，道破美好裝飾背後的騙局本質。"}, {"q": "本章如何描寫暴跌中時間與氛圍的異樣？這折射什麼心理狀態？", "a": "指數下降快到讓人感覺不到向右傾斜，時間過得特別慢，安靜的辦公室讓報單員聲音更清脆；凝滯的窒息感正是群體恐慌蔓延時的心理寫照。"}, {"q": "本章中莊家與散戶的心理處境有何對照？", "a": "散戶在悔恨、憤怒與精神折磨中煎熬，主角卻面無表情、視暴跌為出貨良機；一方以意志煎熬為賭注，一方以群體恐懼為工具，正是心理較量的兩端。"}], "quotes": ["低开30点，这几乎让前几天参与交易所有人的利益所得全部化为乌有", "人们的精神就这样在遭受残酷地折磨和摧残", "我知道这时候的我已经没有什么良心或者道德的观念", "指数就像一个高空落下的物体，快速地下降，以至于由于下降的速度太快而让人感觉不到它是向右倾斜", "也就是这个动听的声音会有成千上万的投资者血本无归"], "psych": [{"p": "情緒操縱", "a": "我知道这样密集的大单抛售会给这个市场带来巨大地冲击，报单员在接到指令以后猛烈的抛盘就蜂拥而出", "n": "莊家以不限價密集砸盤製造恐慌氣氛，藉群體恐懼完成出貨。"}, {"p": "心理較量（看誰先崩潰）", "a": "我始终没有任何表情的脸让屋子里所有的人感觉到紧张", "n": "主角面無表情，屋內眾人率先緊張，心理承受力高低立判。"}, {"p": "損失厭惡（割肉）", "a": "人们这时候的感觉一定是悔恨或者愤怒，人们愤怒庄家的残酷和悔恨自己没有在适当的时候卖出", "n": "浮盈瞬間歸零，賠錢的劇痛化作悔恨與憤怒，折磨眾人精神。"}, {"p": "道德衝突／罪疚感", "a": "我知道这时候的我已经没有什么良心或者道德的观念", "n": "主角自認喪失良心道德，正是莊家良心底線崩潰的自我剖白。"}]}, {"i": 36, "title": "第三十六回　股海翻云出货忙", "kind": "hui", "summary": ["庄家停止抛售静观盘面，见下跌量缩、散户趋理智，反手抬价买回诱使跟风。", "价格上涨时主角心情轻松，为准确判断而兴奋，却自警此情绪对职业操盘手是要不得的。", "交易数据中gp竟达12，得知弟兄们联手拉抬，遂减半吃进控节奏，撤单改以每分钟5000股抛出。", "加大抛单至每分钟一万股，价格应声回落，上午临收盘仅触昨日收盘价即下行，成交不足五千股。", "午后不限价狂抛至全天新低，以上下70点震幅两次、总计超140点重创做多信心，跟风盘不足，出货转慢。"], "qa": [{"q": "庄家停止抛售后，从盘面看出散户怎样的群體心理變化？", "a": "下跌過程中成交量越來越小，越到最後人們越不願跟進，說明散戶已趨理智：對下跌行情習以為常、不驚惶失措，也知道要漲起來很容易。庄家據此判斷反手拉升的時機已經成熟。"}, {"q": "主角為何要「每分鐘1000股、每次價格抬高5元」地買回股票？", "a": "因為他深知沒有這樣的漲幅和成交量，不會有太多的人參與跟進——用持續抬高的價格製造賺錢效應，才能誘使散戶跟風接盤，這是典型的誘多心理戰術。"}, {"q": "「價格上漲時心情非常輕鬆」反映主角怎樣的心理，他如何自我警醒？", "a": "他為判斷準確而興奮，一到上漲心情就輕鬆；但他清醒地知道這種情緒對職業操盤手是要不得的，因為輕敵與情緒化正是操盤大忌——這是他對自己內在異化的自覺。"}, {"q": "得知弟兄們在向上拉抬後，主角為何要求減半吃進、不許大幅推高？", "a": "若再大幅推高，價格會比昨天高，那樣「那些人就有可能出貨」——庄家最怕散戶高位兌現，必須把價格控制在既誘人又不至於讓散戶獲利了結的區間，這是對散戶心理的精確算計。"}, {"q": "上午臨收盤前的價格走勢與成交情況如何？", "a": "價格沒有停止向上的速度，主角把拋單加大到每分鐘1萬股，價格開始往下走，臨收盤前只在昨天收盤價的基礎上摸了一下就下去了，成交大概不到5000股。"}, {"q": "「昨天收盤價」在主角的操作中具有什麼心理意義？", "a": "昨日收盤價是市場公認的心理參照點：價格摸到它即回落，說明庄家故意不給散戶解套與獲利的機會，把收盤價當作操縱預期、壓制跟風的心理支撐位來運用。"}, {"q": "主角用70點震幅、全天震盪兩次的方式出貨，想擊潰散戶的什麼心理？", "a": "這是心理較量：第二次大幅下跌讓散戶做多的信心受損，價格再漲時跟風盤已明顯不足——庄家以劇烈震盪擊潰散戶「跌久必漲」的期待與持倉信心，令其不敢再進場。"}, {"q": "大幅震盪之後，主角的出貨遇到什麼困難？", "a": "價格再次上漲時跟風盤明顯不足，他出貨量只能控制在每三分鐘1000股，而且大概有一半是賣給了自己的弟兄，說明砸盤出貨的誘多效果正在衰減。"}, {"q": "主角說「這樣的大手筆估計一般人受不了」，體現庄家與散戶怎樣的博弈關係？", "a": "這是典型的心理較量——誰先崩潰誰就輸：庄家用超出常人承受範圍的巨幅震盪施加壓力，賭散戶的心理承受力先於自己崩盤，從而交出籌碼或不敢接盤。"}, {"q": "主角為何認為「每天大部分工作都在上午完成，下午只是延續」？", "a": "全天策略已在上午定局，下午只是機械執行；對操盤手而言，交易節奏本身就是心理戰的一部分——上午定調、下午收拾，體現職業投資人對日復一日博弈的麻木與疏離。"}], "quotes": ["从所能掌握的证据和线索来看，人们并没有因为这样地下跌而惊惶失措，他们对这样的行情已经习惯了，也知道要涨起来很容易。", "开始买进刚才抛出的股票，每分钟1000股，每次价格抬高5元，一直到收盘。", "我不知道为什么总是在价格上涨的时候心情非常轻松，这对于一个职业操盘手来说是要不得的", "这样的大手笔估计一般人受不了，但是由于第二次地大幅度下跌让人们做多的信心开始受损", "3天之内把所有的货全部出完，只好这样大幅度地振荡了，上下70点的震幅，全天上下震荡两次，总计震幅超过140点。"], "psych": [{"p": "情緒操縱", "a": "想到这儿我吩咐报单员：“开始买进刚才抛出的股票，每分钟1000股，每次价格抬高5元，一直到收盘。", "n": "庄家以抬价拉升制造赚钱效应，操纵散户情绪诱其跟风接盘。"}, {"p": "心理較量（看誰先崩潰）", "a": "这样的大手笔估计一般人受不了，但是由于第二次地大幅度下跌让人们做多的信心开始受损", "n": "庄家以巨幅震荡施加压力，赌散户的心理承受力先崩溃。"}, {"p": "心理支撐位", "a": "在上午临收盘前价格只是在昨天收盘价的基础上摸了一下就下去了", "n": "昨日收盘价成为心理参照，庄家刻意压制不让散户解套获利。"}, {"p": "孤獨與異化", "a": "我不知道为什么总是在价格上涨的时候心情非常轻松，这对于一个职业操盘手来说是要不得的", "n": "主角以操盘手标准自我审查情绪，职业理性已异化为心理常态。"}]}, {"i": 37, "title": "第三十七回　独倚阳台望寒星", "kind": "hui", "summary": ["莊家夜聚佈局出貨，主角當日出空兩隻股票，散戶卻把學費、嫁妝等人生希望盡押股市。", "主角計算手中籌碼，深知將使大批人的終身積蓄化為烏有，陷入深深自責與良心拷問。", "深夜獨坐陽台觀星，追憶由農入城的來路，操縱著全城情緒卻毫無自豪，孤獨異化漸深。", "生日無人知曉，主角戲謔丘比特與月老，竟想用炒股消息換姻緣，自嘲孤家寡人。", "週六下鄉助老農挑水澆地，暫離股海喧囂；歸途醉酒駕車，在蘇州河邊撞車出事。"], "qa": [{"q": "主角看到那根「紅紅的陽線」時，為何為散戶感到傷感？", "a": "他感嘆小資金把股市當成滿足所有希望的地方：孩子的上學、家用電器、老婆的衣服、光棍的媳婦、女孩子的嫁妝化妝品；善良的人沒有傷害誰，卻總在市場上屢受打擊，他為人們的單純而傷感。"}, {"q": "散戶把股市當成了什麼？這反映了何種群體心理？", "a": "他們把股市當成滿足孩子上學、家電、衣飾、嫁妝等所有希望的地方，人人指望靠一輪行情改變命運——這是暴富敘事與心理帳戶作祟，新資金因此蜂擁入市，也註定被莊家收割。"}, {"q": "主角計算手中籌碼後，為何陷入深深的自責？", "a": "他深知自己的籌碼將使一大批人的終身所得化為烏有；大哭一場後，他開始無意識地對鏡審視自己善良的面孔，懷疑為人，不知性格中的殘酷從何而來——莊家的良心在道德衝突中備受拷問。"}, {"q": "主角操縱著城裡人的情緒，卻不為此自豪，這說明他的心理發生了怎樣的變化？", "a": "他面對自己的作為心很平靜，彷彿原本就該幹這一行；成功與罪疚並存，讓他對自身面孔產生懷疑，情感日益麻木——股市已把他從單純農家子弟異化成冷酷的「殺手」。"}, {"q": "主角為何喜歡夜裡坐在陽台上看星星？", "a": "陽台是他在這個房間唯一的寄託；聽說天上的星星代表地上的人，他卻不知道哪顆是自己——孤獨的職業投資人透過星空尋找自我，也映照出他與人群、與自身的疏離。"}, {"q": "上周六是主角的生日，他為何沒有告訴任何人？", "a": "他習慣把心事藏起來：生日無人知曉，那夜他獨自思考走過的幾年，感慨農村出身卻在城市操縱他人情緒；成功帶不來喜悅，反而加深了單身漢的孤獨與惆悵。"}, {"q": "主角調侃丘比特與月老，反映了他怎樣的心態？", "a": "他笑稱生日13日對情人節14日是近水樓台，怪丘比特太忙、月老保守，竟胡思亂想給月老炒股消息換姻緣往前排——股市思維已滲透生活，連姻緣都想用「內部消息」來交易。"}, {"q": "主角為何常去鄉下找老農聊天、幫他挑水澆地？", "a": "在莊家的殺伐與罪疚之
