金变故后，主角如何处置差价利润？分配比例如何？", "a": "對方變卦險將他送入六扇門，他拒絕報復而安排高價對倒，將差價作獎金：會計得40%，其餘三人各20%，且叮囑必須合理合法。"}, {"q": "山子建议如何对付变卦之人？主角为何拒绝？", "a": "山子建議把對方套在裏邊、謊稱行情好讓其自行折騰；主角因領導有責任、老頭待他不錯，即便被套仍須自己收拾，故寧可吃虧也不報復。"}], "quotes": ["他们永远都不会明白的，因为，他们一直以为自己是一个战士，在疆场上驰骋。所以，即便是战死他们也会因此而感到骄傲。", "那些可怜的人，望着耀眼的金色，总是把自己幻想成那金色的主人，因此，他们从来不会觉得主人哪儿有不对的地方。", "要是全世界的小投资人都知道通过防守获取胜利的话，那么所有的机构都会毙命的。", "大部分小散户都是拿自己的养命钱在赌，他们成功不了的。", "我明白两天的田园生活不会改变我，正如一匹不饿的狼远远地看着羊群不是因为善良，而仅仅是因为不饿！"], "psych": [{"p": "情緒操縱", "a": "这我已经安排小马去北京策划媒体宣传了，我们需要的声音一定会占主流地位的。", "n": "莊家以媒體造勢操控大眾情緒與預期，是典型的輿論心理戰。"}, {"p": "錨定效應", "a": "指数一直维持在1200点之上，到今天17号了，指数连最高点1400点都没有碰到", "n": "千點整數關口成為多空心理錨點，主力藉高位橫盤掩護出逃。"}, {"p": "認知失調／合理化", "a": "他们永远都不会明白的，因为，他们一直以为自己是一个战士，在疆场上驰骋。", "n": "散戶以戰士幻想合理化虧損處境，拒絕承認自己其實是獵物。"}, {"p": "孤獨與異化", "a": "我明白两天的田园生活不会改变我，正如一匹不饿的狼远远地看着羊群不是因为善良，而仅仅是因为不饿！", "n": "田園淨土滌不盡資本心性，職業投資人的疏離與冷漠畢現。"}]}, {"i": 117, "title": "第一百一十七回　阴线高悬引狂潮", "kind": "hui", "summary": ["小馬定三日輿論造勢：草莽先講貼近散戶，學者研討引導話語權，周五借利好統一媒體口徑推向高潮。", "主角凝視牆上K線圖，末根陰線高懸盼觸均線；視1213點均線交匯處為心理安全位，暗忖眾人同感。", "早盤巨量砸盤跌破千二，停手後抄底資金湧入，老胡山子股票大漲，主角股票獨滯綠盤成搶進漩渦。", "撤單反手巨量買入，三分鐘由負轉正飆漲三成；午間散戶大廳人人自誇英明，主角自得於按兵不動的誘局。", "主角以小偷之喻道破出逃須萬眾矚目；誤入公司聚餐飯館，冷面迴避熱情，一路後悔，與人群漸生隔閡。"], "qa": [{"q": "小馬的宣傳計劃分哪三步？體現了莊家什麼心理戰術？", "a": "三步：草莽先講以民間英雄形象貼近散戶，媒體只談制度；周三學者研討引導話語權；周五借實質利好做更高級別對話，媒體統一宣傳推向高潮。這是典型輿論造勢，先鋪墊情緒、再統一口徑收割市場關注。"}, {"q": "主角為何覺得1213點很安全？這屬於哪種心理現象？", "a": "因是10日與64日均線交匯之處，他潛意識認定安全，並猜想大多數人同樣會這樣想。這正是心理支撐位：關鍵點位經均線等技術位定錨，眾人心理共振後便成為真實的支撐防線。"}, {"q": "主角第一輪拋售採用什麼手法？盤面出現什麼群體反應？", "a": "每筆500萬股、級差50元連續賣出，股票快速下跌、成交迅速放大，指數跌破1200點；低位掛單的抄底資金仍大有人在。他以砸盤試探承接，散戶見跌搶底，反成其出貨的對手盤。"}, {"q": "主角的股票越不漲，散戶買單為何反而越積極？", "a": "因連三線股都漲逾兩成，人人認定好股票不可能不漲，買單形成搶進的漩渦。散戶以漲跌推斷價值、見漲追入，羊群效應與追漲心理使跟風盤成為莊家撤離的掩護。"}, {"q": "主角撤單反手巨量買入、三分鐘由負轉正，散戶為何會發狂？", "a": "他先20分鐘按兵不動吸引全場目光，再以每筆600萬股、級差100元掃入，三分鐘漲逾四成。先抑後揚的反差愈懸殊，情緒愈被放大，再冷靜的人也難以自持，這是莊家的節奏操控。"}, {"q": "主角用「小偷」的比喻說明了什麼出逃策略？", "a": "小偷偷摸離開容易被人抓住，因世上從無絕對安全；若光天化日大搖大擺、聲勢浩蕩地離開，說不定還有鮮花與掌聲。他點破出逃要義：製造萬眾矚目，讓關注與跟風成為自己的掩護。"}, {"q": "中午散戶大廳裡，股民表現出哪些群體心理？", "a": "人人眉飛色舞談論他的股票，低位買入者誇誇其談、稱後面還將大漲特漲，未買者後悔不已、發誓再買。這正是羊群效應與追漲的寫照，買入者更把跟風的運氣歸功於自己的英明，屬自我服務偏差。"}, {"q": "聽到散戶的讚許，主角作何感想？反映他怎樣的內在變化？", "a": "他佩服自己的耐心與才能，自得於20分鐘按兵不動的設計，並稱股市是智慧者取財之地、缺乏智慧者不斷送錢。他已徹底以博弈者自居，把散戶的狂熱當作可操控的注腳，情感日漸異化。"}, {"q": "主角誤入高安路飯館後為何難堪、後悔？", "a": "飯館裡坐滿公司同事，老闆娘熱情伸來帶油水的手，他藉口吃過匆匆退出，老闆強留喝酒被他冷面拒絕，一路後悔覺得讓眾人都不舒服。長期博弈使他與人群格格不入，連同事聚餐也成負擔。"}, {"q": "主角上車聽哀樂而心情平淡，與他的操盤狀態有何呼應？", "a": "天氣陰沉似要下雨，他閉眼沉浸於哀樂對生命的讚美，心情卻非常平淡；開盤後他同樣以冷靜執行砸盤誘多。哀樂不是悲悼而是自我疏解，職業博弈已把生死哀樂都化為平淡的背景。"}], "quotes": ["1213点，10日均线和64日均线的交汇之处，潜意识里我感觉这个点位看起来很安全，是不是大多数人都会这样想呢？", "这好比一个小偷，你要偷偷摸摸地离开，很容易被人抓住，因为世界上从来就没有绝对安全那一说。", "整整20分钟按兵不动，所有的股票都在涨，就是我的不涨，这足以引起大家地注意。", "短短的三分钟上涨幅度超过40%，再冷静的人都会发狂。", "你有多高的智慧就能获取多大的财富，因为，有那么多缺乏智慧的人在不断地送钱给你。"], "psych": [{"p": "心理支撐位", "a": "1213点，10日均线和64日均线的交汇之处，潜意识里我感觉这个点位看起来很安全，是不是大多数人都会这样想呢？", "n": "主角以均線交匯處為心理錨點，堅信眾人同感，支撐位由此而生。"}, {"p": "情緒操縱", "a": "整整20分钟按兵不动，所有的股票都在涨，就是我的不涨，这足以引起大家地注意。", "n": "莊家以不漲製造反差吸引全場目光，再用暴漲點燃狂熱，操控情緒以求出逃。"}, {"p": "羊群效應（從眾）", "a": "连三线股都能涨起来，我的这些好股票不可能不涨，人人都会这样想的，所以，买单非常积极。", "n": "散戶認定好股票必漲而蜂擁搶籌，跟風盤反成莊家撤離的漩渦。"}, {"p": "孤獨與異化", "a": "看看大家的神态和老板娘热情的向我伸出她还带着油水的手，我生怕她抓住我的手或者我的衣服急忙说", "n": "操盤手與人群格格不入，連同事聚餐都急於抽身，博弈生涯使人際日漸疏離。"}]}, {"i": 118, "title": "第一百一十八回　高台沽货笑泪间", "kind": "hui", "summary": ["莊家高位放量誘多、尾盤撤單，重倉股日漲55%，一切盡在心理博弈。", "以「最高價」為錨操弄人心：追高者後悔、獲利者捨不得賣，兩面夾擊。", "輿論造勢點燃做多激情：股評爭功、報紙點名、高開34點，行情自我實現。", "散戶追漲狂熱、翻本賭咒，只記輝煌不記虧損，群體心理盡顯愚昧。", "主角以「掠奪」合理化殺手作風，自詡好人卻痛下殺手，內心日益異化。"], "qa": [{"q": "尾盤撤單後股價為何被快速拉起？追漲資金為何如此踴躍？", "a": "撤單使上方賣壓消失，見股價拉起，追漲資金踴躍進場，不到一分鐘股價即被托起，收盤重倉股漲55%。莊家利用散戶「見漲追高」的貪婪，把出貨變成一場順勢的收割。"}, {"q": "「最高价对他来说是永远的希望」——主角如何利用散戶這層心理？", "a": "他控制漲幅不高不低，讓未進場者持續後悔、獲利者捨不得賣，因誰也不願失去到手的金錢。散戶錨定在最高價幻想復漲，正好替他托住股價、承接拋壓。"}, {"q": "主角為何說「一切全部在于心理上的一种博弈」？", "a": "低迷行情、55%漲幅、快速出貨三者並存，靠的並非單純資金，而是操縱散戶貪婪與追漲情緒，讓對手盤自己送上門——這是莊家與散戶之間的心理較量。"}, {"q": "營業部裡的散戶表現出哪些群體心理？", "a": "兩天賺50%高呼「天上掉錢」，旁人跟著哈哈大笑；沒買的圍著問「下午還能買嗎」，賺錢者揚言「多高都能追」——追漲貪婪、羊群從眾與攀比炫耀混雜成一片狂熱。"}, {"q": "主角為何罵散戶「只记得自己辉煌的时候从来不想自己倒霉的时候」？", "a": "因為他們談股只記贏家戰績、不提整體虧損，賺了沾沾自喜、虧了閉口不提——既看不見多數輸家，又把運氣歸功於自己，正是倖存者偏差與自我服務偏差。"}, {"q": "散戶為何「每次都发誓只要翻本绝不再玩，每次发完誓继续玩」？", "a": "已投入的資金成為沉沒成本，不甘心認賠離場，總寄望下一把翻本，於是越陷越深。這是典型的賭徒心理，也是股市「沾惹上就不要試圖撒手」的魔力所在。"}, {"q": "主角為何說「老子的地盘老子失去控制还行」，隨即再度砸盤？", "a": "媒體造勢使大盤高開34點、股票高開20%，漲勢脫離他的節奏，他擔心行情失控，遂以每筆800萬股、級差40元持續賣出，把主導權重新奪回手中。"}, {"q": "主角如何查出三線股背後的資金？", "a": "他逐席分析資料室提供的交易明細，發現活躍資金集中於兩家券商的三個席位，遂命小張查淮海路營業部千萬以上資金的分布與交易情況，明日中午要用。"}, {"q": "主角為何執意要「灭掉」洋操盤手？", "a": "他懷疑是張先生的資金和「狗屁老外操盤手」所為，揚言「不为别的，就为这个操盘手」——高手相爭的較勁與佔有慾，不容他人染指自己主導的行情。"}, {"q": "主角自認「所有人都是好人」，為何卻每每痛下殺手？", "a": "他把市場定義為人人互相掠奪的戰場，用「優勝劣汰是自然法則」為冷酷開脫，將殘忍合理化——這是認知失調的防禦，也是莊家良心與殺伐之間的道德衝突。"}], "quotes": ["我不想下跌太多，也不想上涨太多。让上午没有来得及进来的人持续后悔，让那些进来赚到钱的人舍不得卖出，因为，最高价对他来说是永远的希望。谁也不愿意失去曾经到手的金钱。", "如此低迷的行情，如此大的涨幅，出货的速度如此之快，一切全部在于心理上的一种博弈。", "有人高兴地在说：“两天时间赚了50%了，这不是天上掉钱吗？”", "我心想小子你赶快跑吧，你不想想股市上任何一个人的笑声是用别人的哭声换来的么，别人凭什么要让你如此开心地赚钱？", "不管亏损成什么样子，大家都不会这样做的，每次都发誓只要翻本绝不再玩，每次发完誓继续玩。"], "psych": [{"p": "情緒操縱", "a": "如此低迷的行情，如此大的涨幅，出货的速度如此之快，一切全部在于心理上的一种博弈。", "n": "莊家以高位放量與輿論造勢操控大眾情緒，於低迷市中完成快速出貨。"}, {"p": "錨定效應", "a": "让那些进来赚到钱的人舍不得卖出，因为，最高价对他来说是永远的希望。谁也不愿意失去曾经到手的金钱。", "n": "散戶錨定於曾經的最高價，遲遲不肯賣出，正好成為莊家出貨的對手盤。"}, {"p": "追漲（貪婪）", "a": "干什么不能买？多高都能追。昨天收盘的时候我追进不是都骂我找死吗？", "n": "見漲追高、不計價格，散戶的貪婪被莊家牽著走，淪為接盤主力。"}, {"p": "專家崇拜／過度自信", "a": "每一个股评都在信誓旦旦地向大家保证，今天走势最为凶猛的几只股票都是他之前推荐的。", "n": "股評爭相攬功，散戶迷信權威說辭，成了莊家輿論造勢的免費工具。"}]}, {"i": 119, "title": "第一百一十九回　阴线蓄势夜筹谋", "kind": "hui", "summary": ["指數回探1233點，主角以千萬股級差大單掃貨，價格瞬間躥上當日高點，持倉五成後撤單，全程掌控節奏。", "全天高開低走小漲12點；三線股乃對手資金，虧損逾四成，需200%行情方能翻本，主角斷言其難以翻身。", "主角畫K線沉思：陰線顯強勢、缺口引聯想，悟出價格厭惡感帶來恐高症，曲線如畫，線條優美方聚人氣。", "安排媒體發通稿宣揚蓄勢待發，邀民間股神上電視造勢，配合輿論趁勢倒倉，情緒操弄與信息布陣環環相扣。", "深夜獨對走勢圖沉思大眾心理，酒吧間對情愛家事漠然一笑，主角已異化為冷眼旁觀大眾的操盤機器。"], "qa": [{"q": "主角在1233點以每筆1000萬股、級差50元掃貨，把價格瞬間推上當日高點，這一手在心理上起了什麼作用？", "a": "大單掃貨製造人氣旺盛的假象，令猶豫的觀望者以為行情啟動而跟風追入；會計統計持倉50%、人氣極旺後，主角隨即撤單，任由小資金按他的意圖主導午後走勢，屬典型的節奏試盤加情緒操弄。"}, {"q": "主角為何擔心短線客獲利出逃形成風氣？這折射出散戶怎樣的群體心理？", "a": "短時間上漲太多會讓人落袋為安，連續搶眼表現吸引更多短線客出逃，一旦成風便動搖行情；這折射出散戶恐高、見好就收的群體心理，追漲之後旋即落袋，情緒極易被走勢牽引。"}, {"q": "「價格厭惡感就會帶來恐高症」揭示了怎樣的心理機制？", "a": "價格上漲過快、突破歷史罕見高位後，投資者以舊價位為錨，生出價格厭惡與恐懼，不敢再追高；錨定於既有價格，恐高源於對新高位抗拒，這正是主角用來揣度大眾情緒的鑰匙。"}, {"q": "主角覺得「一個陰線看起來卻是強勢，一個缺口能讓很多人浮想聯翩」，他在利用什麼心理？", "a": "走勢圖本身即是心理暗示工具：陰線顯強勢可誘導觀望者入場，缺口則留下想像空間讓眾人自行補全預期；主角借K線形態與斜率調動人氣，是情緒操弄在盤面上的美學化表達。"}, {"q": "主角為何要小馬發通稿宣揚「蓄勢待發」，並邀請民間股神上電視？", "a": "借媒體與民間股神這些權威渠道把樂觀預期廣傳，令眾人爭相相信強勢股仍會發力，預期自我實現；他利用專家崇拜與信息瀑布，讓散戶的期待順著通稿流向自己設好的倒倉方向。"}, {"q": "主角計劃趁媒體宣傳的時機完成倒倉，這是怎樣的心理戰術？", "a": "先以輿論造勢點燃樂觀情緒，再趁人氣旺盛時出貨，把籌碼轉給追漲接盤的散戶；誘多與溫水煮青蛙並用，讓對手在持續上漲的幻覺中接過高位籌碼，自己全身而退。"}, {"q": "主角為何斷定三線股投資人「肯定做不到」200%行情的業績？", "a": "對手按現價虧損逾四成，要賺錢並順利出場至少需要200%行情，而其水平有限又遭主角一方搗亂；虧損越深越難放手，主角正是看穿其沉沒成本與結構性劣勢，斷定其無翻身之機。"}, {"q": "主角深夜獨對K線沉思交易行為與大眾心理，反映了他怎樣的內在狀態？", "a": "他獨處畫線、把大眾心理當作研究對象來復盤，連老胡、山子被逼婚的煩惱都懶得理會；職業操盤令他日漸疏離人情與家常，異化為冷眼算計、只與行情為伴的機器。"}, {"q": "全天走勢有何特徵？收盤數據如何？", "a": "全天高開低走，開盤即當日最高價，收盤即全天最低價，振幅不大，整體上漲12點，較上一交易日多漲3點；收盤後主角吩咐封存資料下班，回酒店把走勢圖畫在客廳牆上端詳。"}, {"q": "主角為何說連續兩天過於搶眼不是好事？他如何盤算化解？", "a": "搶眼上漲會讓更多短線客獲利出逃，形成風氣便不好；未買入者後悔之餘，也會因短時上漲過多產生價格厭惡與恐高，故他盤算再添一根陰線、以媒體宣傳控住節奏與人心。"}], "quotes": ["这样的走势很容易让人感到恐惧，短时间上涨太多一定会有落袋为安的打算，再高的价格也没有出现过，所以，大多数投资人对未来容易感到迷茫和担忧。", "是的，价格厌恶感就会带来恐高症。", "一个阴线看起来却是强势，一个缺口能让很多人浮想联翩。", "股票价格的波动曲线实际上就是一幅画，这幅画的线条越优美结果就越好，一个拙劣的画家是不会画出一幅传世佳作的。", "我看着k线在沉思，思考自己的交易行为有没有需要检讨的地方，思考投资大众的心理思维。"], "psych": [{"p": "情緒操縱", "a": "指令进场之后，价格瞬间蹿上当日的最高点，我看了会计的统计数据：持仓50%，gp86。这样的数据结果表明人气极度旺盛", "n": "主角以大單瞬間推高價格製造人氣假象，隨即撤單，全程操控大眾情緒。"}, {"p": "錨定效應", "a": "再高的价格也没有出现过，所以，大多数投资人对未来容易感到迷茫和担忧。", "n": "以歷史最高價為心理錨點，價越攀高越生厭惡恐高，散戶定錨舊位而不敢追新。"}, {"p": "信息瀑布（謠言市）", "a": "我想如果有媒体的配合宣传，那么，事情就好办一些。计划好明天的交易，我想趁明天的机会，完成倒仓。", "n": "以通稿與民間股神造勢傳播預期，令看多消息自我實現，為倒倉鋪路。"}, {"p": "孤獨與異化", "a": "我看着k线在沉思，思考自己的交易行为有没有需要检讨的地方，思考投资大众的心理思维。", "n": "主角獨處畫線、只研究大眾心理，對婚戀家常漠然，已成冷眼操盤的異化者。"}]}, {"i": 120, "title": "第一百二十回　雨中哀乐倒仓时", "kind": "hui", "summary": ["主角洞悉散戶認定下跌股必補漲的從眾心理，故意留單誘多，讓資金低位吃貨，賺錢效應擴大受關注度。", "深夜輾轉難眠：倒倉雖不為自己、不損公司利益，卻違職業道德，莊家良心在利益與原則間煎熬。", "暴雨哀樂中集合競價，股票低開四成三分鐘收復，k線留長下影線，倒倉兼激人氣一箭雙雕。", "主角刻意不讓今日收高價，令踏空者後悔、獲利者遺憾，以遺憾心理維繫眾人齊心看多的共識。", "營業部人氣鼎沸，股民看不懂開盤卻一致認為是好事，小張嘆其可憐，羊群熱情令人悲憫。"], "qa": [{"q": "老胡稱讚主角「這一手忒黑」，這招利用了散戶的什麼心理？", "a": "散戶認定下跌的股票必然補漲，主角故意不撤單讓資金在低位吃貨，賺錢效應越大受關注度越高，正是以追漲貪婪心理為對手盤。"}, {"q": "主角說這套打法並非事先設計，而是臨場想到的，體現莊家怎樣的博弈素養？", "a": "他從板塊走勢與交易數據中讀出資金盯上下跌股的思維，順勢而為、滿足對手需求，邊觀察邊調整節奏，靠的是心理分析而非預設套路。"}, {"q": "主角安排次日集合競價倒倉的具體方案是什麼？", "a": "低開40%拋出1500萬股，估計約1000萬股能到老胡山子手裡；若到帳不足500萬股便電話聯繫，開盤後來不及撤單的部分由他自己買回。"}, {"q": "深夜回到房間，主角為何輾轉難眠、心中不舒服？", "a": "他認為此舉雖不是為自己、也不傷害公司利益，卻不符合職業道德；但一線人員失去這次機會便一生再無機會，他別無選擇，並厭惡那些小利益集團。"}, {"q": "連續暴雨與司機播放的哀樂，對主角的心境有什麼象徵意義？", "a": "早晨雨勢是近日最大的，配上哀樂在雨中穿行，一切都異乎尋常地沉重，宛如死亡焦慮般的壓抑氛圍，烘托他對倒倉行動的罪疚與緊張。"}, {"q": "低開40%又迅速收復、留下長長下影線，對市場心理有何作用？", "a": "三分鐘內恢復正常價位，巨量低價掛單顯示承接力強，k線下影線構成心理支撐位的假象，既是洗盤也是激發人氣的宣傳。"}, {"q": "主角為何決定今天不收高價、要讓股價下跌？", "a": "他刻意讓踏空而後悔的人有一次機會，給已賺錢者留下沒抓住高點的遺憾，使大家始終懷念那個高點，齊心協力往上看，這是典型的情緒操縱。"}, {"q": "營業部人氣鼎沸、股民看不懂開盤卻都認為是好事，體現什麼群體心理？", "a": "眾人議論同一隻股票、一致看好而不作獨立判斷，正是羊群效應：跟風大眾的熱情淹沒了懷疑，熱鬧的表象本身就是莊家需要的氛圍。"}, {"q": "小張說炒股票的人可憐，主角以「人為財死」作答，反映主角怎樣的轉變？", "a": "小張認為股民什麼都不懂只憑一股熱情，主角卻把冒險視為想得通的常態，顯示他已習慣股市的貪婪邏輯，對散戶的狂熱不再憫惜。"}, {"q": "集合競價倒倉當天盤面結果如何？", "a": "指數低開一個點，主角股票低開約40%，不到一分鐘約1200萬股被吃掉；撤銷未成交單後價格迅速回升，倉位降至48%，但巨量低價掛單顯示下法和沒下一樣。"}], "quotes": ["我当时分析他们的思维就是这股票肯定补涨，所以，我就想为什么不满足他们的需求呢？", "虽然，不是为了我自己，也不会伤害公司的利益，但是这样还是不符合职业道德的。", "这样的天气配上这样的的音乐，一切都显得异乎寻常地沉重。", "让那些之前没有介入而后悔的人有一次机会，对那些已经赚钱的人留下一个遗憾，让他们始终怀念没有抓住的那个高点，这样一来大家都会齐心协力往上看。", "看到里面还是人气鼎沸，大部分都在议论我重仓的股票走势，都对上午的开盘看不懂，但是，都认为是好事情。"], "psych": [{"p": "情緒操縱", "a": "让那些之前没有介入而后悔的人有一次机会，对那些已经赚钱的人留下一个遗憾，让他们始终怀念没有抓住的那个高点", "n": "莊家以遺憾與後悔情緒維繫集體看多，是典型的情緒操縱手法。"}, {"p": "追漲（貪婪）", "a": "才发现很多资金都盯上这几只下跌的股票了，我当时分析他们的思维就是这股票肯定补涨", "n": "散戶認定下跌股必補漲，貪婪驅動追入，恰成莊家誘多的對手盤。"}, {"p": "道德衝突／罪疚感", "a": "虽然，不是为了我自己，也不会伤害公司的利益，但是这样还是不符合职业道德的", "n": "主角深夜失眠，莊家良心在利益與職業道德間遭受拷問。"}, {"p": "死亡焦慮", "a": "司机打开哀乐之后启动车子，车子在雨中穿行，这样的天气配上这样的的音乐，一切都显得异乎寻常地沉重", "n": "哀樂與暴雨將倒倉行動渲染出末日般的沉重壓抑感。"}]}, {"i": 121, "title": "第一百二十一回　股海陰雲夢飛山", "kind": "hui", "summary": ["小張獲赴英簽證通知，感嘆資金運作實為心理博弈，因情緒緊張而患上胃潰瘍。", "主角級差巨量賣出，股價由漲轉跌，刻意留15%跌幅以維繫持股人信心與抄底熱情。", "收盤指數跌至1222點，大盤縮量、三線股如死水，缺賺錢效應，主角趁勢倒倉。", "電視專家持交割單鼓吹黑馬，主角深知大眾思維常錯，群體安全感正是可利用之處。", "深夜復盤K線與指標，確認散戶情緒已調動，計畫繼續加溫出貨，夢中如鳥飛降草原。"], "qa": [{"q": "小張為何患上胃潰瘍？他如何體會這次資金運作？", "a": "小張因最近情緒特別緊張，被醫院診斷出胃潰瘍。他感慨這次建倉與最近的出貨，讓他真正體會到運作資金就是心理博弈，並坦言自己永遠學不到主角那種平淡從容、不為所動的心理承受力。"}, {"q": "主角認為什麼樣的人適合炒股？這反映何種心理特質？", "a": "主角認為股票投資更多時候是天性，有些人天生適合投機，有些人就不適合，這和性格關係很大；努力只是其一，綜合實力與悟性更為關鍵，道出心理素質決定投資成敗。"}, {"q": "下午開盤約三十分鐘，主角下了什麼指令？股價有何反應？", "a": "主角吩咐報單員「每筆1000萬股，級差價格50元，賣出」，股票不到五分鐘便全線下跌，由漲10%左右直落至跌20%；隨後下令停止交易，任股價緩慢回升。"}, {"q": "主角為何讓重倉股維持15%左右的跌幅？體現何種心理戰術？", "a": "這樣的跌幅不會影響抄底資金的熱情，也能更加堅定現有持股人的信心；他深知最大難度在於鼓勵持股人繼續持股，不能見風吹草動就亂跑，正是運用心理支撐位維繫人氣。"}, {"q": "當天收盤與大盤量能如何？縮量的關鍵原因是什麼？", "a": "指數收盤下跌13點至1222點左右，成交量為近期最小，振幅極小，多數板塊紋風不動，三線股回到啟動前的一潭死水；關鍵還是缺乏賺錢效應，短線參與熱情冷卻。"}, {"q": "電視節目上的專家如何鼓吹黑馬？散戶為何容易相信？", "a": "專家宣稱買入不到一星期獲利30%多，並專程拿交割單作證；草莽英雄斷言強勢股必成黑馬。主角指出他們的話正代表大眾觀點，常人聽來特別有理，而大眾思維往往是錯的。"}, {"q": "主角為何說股市上大眾的思維往往是錯誤的？", "a": "他認為真理掌握在少數人手中，股市是少數人對、多數人錯的地方；因此大多數人都能接受的觀點，自然而然就是錯誤的，反過來成為莊家順勢利用的依據。"}, {"q": "主角如何看待散戶追求群體安全感的心態？", "a": "他點出股市上人們追求的是群體安全感，而非獨立自主的見解，大家都覺得抱成團才最安全，買賣總愛參考別人的看法，有人作伴就不擔憂——這正是莊家最可利用的羊群心理。"}, {"q": "主角為何說人最瘋狂是在加快出貨速度的時候？", "a": "因為出貨前一定要先調動起大眾的投資熱情；他從專家言論與技術指標判斷，散戶情緒已被點燃，接下來就是繼續加溫的事，讓散戶在狂熱中接走籌碼。"}, {"q": "主角當晚做了什麼夢？夢境有何象徵？", "a": "他夢見自己從很高的山上往下掉卻毫不害怕，能像鳥一樣自己掌握飛行的方向與速度，平安降落在有山有水、牛羊遍野的美麗草原。象徵他對操盤節奏與市場人心掌控自如、孤身成竹在胸。"}], "quotes": ["最近我情绪特别紧张，昨天去医院说是胃溃疡，主要是情绪紧张所致，可您还是这样平淡。", "在股市上大众的思维往往是错误的，真理掌握在少数人手中；换句话说就是股市是少数人对，多数人错的地方。", "可实际上股市上人们追求的是群体安全感，而不是独立自主的见解，大家都觉得抱成团才是最安全的。", "人其实最为疯狂的时候，就是你加快出货速度的时候，你在出售筹码之前，一定要调动起大众的投资热情才行。", "我做了一个梦，梦见我自己从一个很高的山上往下掉，我居然不害怕，这样一直往下掉的时候，忽然自己像鸟一样，能自己掌握飞行的方向和速度，很安全的降落在一个有山有水的地方"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "最近我情绪特别紧张，昨天去医院说是胃溃疡，主要是情绪紧张所致，可您还是这样平淡。", "n": "小張緊張致病而主角平淡如水，正是心理承受力的較量寫照。"}, {"p": "羊群效應（從眾）", "a": "股市上人们追求的是群体安全感，而不是独立自主的见解，大家都觉得抱成团才是最安全的。", "n": "散戶抱團求安、跟風別人的看法，正是莊家最易利用的從眾心理。"}, {"p": "情緒操縱", "a": "你在出售筹码之前，一定要调动起大众的投资热情才行。", "n": "主角藉專家節目與指標走勢點燃散戶熱情，為出貨蓄勢加溫。"}, {"p": "心理支撐位", "a": "这样的跌幅不会影响抄底资金的热情，也能更加坚定现在持仓的投资人的信心。", "n": "主角刻意控制跌幅，以關鍵價位維繫持股信心與抄底人氣。"}]}, {"i": 122, "title": "第一百二十二回　晴空股海千层浪", "kind": "hui", "summary": ["報紙齊聲唱多、眾人眉開眼笑，主角冷笑旁觀：輿論造勢中群眾集體亢奮，正是情緒操縱的溫床。", "主角先巨單砸盤、再猛力拉抬，以大起大落掌握節奏，注解莊家迎合散戶心理需求的操縱戰術。", "散戶鍾情一夜暴富、快進快出、只算當日收益，缺乏耐心，正是羊群效應與賭徒心態的典型寫照。", "營業部人滿為患、散戶連飯都不吃，委託櫃台人踩人方稱「出神入化」，人氣狂熱是群體極化的極端表徵。", "市場發瘋之際主角卻惴惴不安、孤身吃午飯，操縱者的孤獨與異化在繁華喧囂中愈發清晰。"], "qa": [{"q": "莊家先砸盤再拉抬，動用了哪些心理戰術？", "a": "他先以每筆一千萬股、級差百元賣出，十分鐘內令股價跌約兩成，再以每筆五百萬股、級差三十元持續買入，五分鐘拉高六十元；先打垮信心再點燃貪婪，用節奏與試盤操縱大眾情緒。"}, {"q": "主角砸盤之後，散戶表現出什麼群體心理？", "a": "報紙異口同聲唱多、眾人眉開眼笑；砸盤後場內賣出掛單好多價位都是0，散戶受大師影響仍堅定看好，正是跟風從眾的羊群效應，也為莊家反手拉抬備足了跟風盤。"}, {"q": "主角如何把握散戶的心理弱點？", "a": "他認為散戶總想一夜暴富，不想依靠穩定方法長期獲勝，看重當日收益、缺乏耐心；走勢必須大起大落、大幅下跌又快速上漲，才能刺激大眾神經。本次激活人氣正是抓住這些心理弱點出擊。"}, {"q": "主角為何痛恨「高拋低吸」這句口頭禪？", "a": "他視之為專家顯示高明、糊弄大眾的口頭禪，每次聽到都想朝專家嘴巴來一拳；散戶那點小錢根本折騰不出高低，何時算高、何時算低無人能解，正戳破專家崇拜的空洞。"}, {"q": "「短线做好了一天就是30%」反映散戶什麼心理？", "a": "這是營業部常見口頭禪，說的人眉飛色舞、聽的人點頭不已；人人都指望一天三成暴利、快進快出，把投機當捷徑，正是追漲貪婪與暴富敘事下的集體幻想。"}, {"q": "主角為何期待「櫃台前人踩人、保安拿棍子亂打」？", "a": "依他經驗，沒人排隊就沒人氣，有人排隊說明還有理智克制情緒；唯有櫃台前人踩人、保安揮棍維持秩序，才是人氣「出神入化」，也意味散戶理智徹底喪失，最易被收割。"}, {"q": "從報紙唱多到會計數據，主角表現出怎樣的心態？", "a": "他冷笑唱多者只是「非常幸运」，認為這幾隻股票「一定能造就一批股神」；又憑會計數據斷言「有足够的空间和能力操纵下一步的交易」，把行情盡歸己功，流露操縱者的過度自信。"}, {"q": "營業部收緊透支，為何令主角惴惴不安？", "a": "散戶都說大行情要來、抱怨沒法透支，他卻立刻懷疑營業部預感危機或另有傳言，急忙叫小張查幾個大城市的透支情況；消息與預期互相強化，連操縱者也被信息瀑布牽動。"}, {"q": "主角為何讓股價「自由落體」而不加干預？", "a": "他想看跌到什麼位置有人進來撿便宜，藉此試探承接盤與散戶的心理底線，為下午操盤找準節奏與支撐位；這是莊家試盤、測試散戶心理承受力的典型手法。"}, {"q": "本章結尾主角的孤獨與異化體現在哪裡？", "a": "眾人為行情狂歡、連飯都不吃，他卻擠不進人群，獨自在包子店草草吃了兩籠包子一碗小餛飩便趕回公司；操縱者看透所有人的貪婪，卻無人可與之交心，疏離感躍然紙上。"}], "quotes": ["这些人非常幸运，这几只股票一定能造就一批股神出来的，今天大家都会满载而归的。", "我对散户的了解在于他们总是喜欢一夜暴富，不想依靠稳定的方法长期获胜，你的股票要能吸引他们疯狂地追捧，那么你的走势就必须符合他们的心理需求，大起大落。", "这个市场疯了，所有人都疯了，我这样想。", "要是委托柜台那儿人站在人身上，保安拿个棍子乱打的时候，这是最出神入化的时候。我需要出神入化这样的情形。", "我怀着惴惴不安的心情在附近的包子店买了2笼包子，一碗小馄饨，简单地吃了午饭就赶回公司。"], "psych": [{"p": "情緒操縱", "a": "我对散户的了解在于他们总是喜欢一夜暴富，不想依靠稳定的方法长期获胜，你的股票要能吸引他们疯狂地追捧，那么你的走势就必须符合他们的心理需求", "n": "莊家先砸盤再拉抬，刻意以走勢撩撥散戶貪婪與恐懼，注解情緒操縱的完整鏈條。"}, {"p": "羊群效應（從眾）", "a": "卖出的挂单居然好多价位都是0，人们受到这些大师的影响，还是坚定地看好这些股票。", "n": "被砸盤仍堅定看好、賣單掛零，眾人跟風唱多，是典型從眾行為。"}, {"p": "群體極化", "a": "要是委托柜台那儿人站在人身上，保安拿个棍子乱打的时候，这是最出神入化的时候。", "n": "人群聚集後理智喪失、情緒互相點燃，極化到櫃台人踩人的地步。"}, {"p": "孤獨與異化", "a": "我怀着惴惴不安的心情在附近的包子店买了2笼包子，一碗小馄饨，简单地吃了午饭就赶回公司。", "n": "眾人狂歡之際操縱者獨自吃飯、心事重重，職業投資人的疏離感盡顯。"}]}, {"i": 123, "title": "第一百二十三回　股海狂潮夜运筹", "kind": "hui", "summary": ["庄家查明资金集中之谜：透支只放大户，主力以「亏损不影响生活」自欺，合理化消解操盘内疚。", "每笔千万股级差扫单，五分钟股价狂涨七成，财富效应令人踩人抢单，散户集体追涨陷入疯狂。", "七成成交量扎堆几只股票，涨幅五成的股票仍被视为低价，锚定与贪婪在散户群体中互相强化。", "新制度消息当夜传遍市场，次日交易笼罩传言，媒体文章一致鼓吹牛市，信息瀑布推动预期自我实现。", "庄家定「有张有弛」之策，明日反向控盘牵制对手，令投资人不能心想事成，行出其不意之心理战。"], "qa": [{"q": "庄家查明资金之谜后为何「心情一下子轻松起来」？他如何为自己的行为开脱？", "a": "小张查实全国营业部基本不给散户透支，仅实有资金五十万以上的大户可透支。主角认为能在股市投数十万的人亏损不影响生活，干掉其资金不必内疚——以合理化消解道德罪疚。"}, {"q": "主角命令「每笔1000万股，级差价格100元」连续买入，产生什么心理效果？", "a": "指令进场不到五分钟，股价蹿升至当日最高点，涨幅逾七成；财富效应刺激全场，柜台前人不排队、踩着肩膀往前爬，贪婪令散户在狂涨中反而更加勇敢追进。"}, {"q": "「财富效应在关键的时候会让所有的人勇敢起来」揭示了什么群体心理？", "a": "揭示羊群效应与贪婪的放大：股价狂涨吸引所有目光，七成成交量扎堆几只股票，持有者惜售、空仓者争先买入，群体在疯狂人气中集体追涨，理性被财富幻觉取代。"}, {"q": "涨幅已达五成的股票，散户为何仍认为「至少应该还有30%的涨幅」？", "a": "这是锚定效应与追涨心理：投资人以已有涨幅为锚，把五成涨幅的股票视作「低价」，由已经上涨便推断仍会涨，属赌徒式的惯性预期，完全忽略回调风险。"}, {"q": "停止下单后庄家为何说「我只需要在关键的时候加以引导即可」？", "a": "人气已被点燃，持有者不愿卖、空仓者抢着买，股价自行向上。庄家深谙情绪操纵：不必持续推动，只需在关键节点略加引导，让大众情绪替自己抬轿。"}, {"q": "新制度消息传来后，主角为何预判次日交易会「笼罩在传言之中」？", "a": "消息当晚就开始传开，次日全天交易都受传言支配；他预见很多人会借利好刺激高开走人，这是正常的心理反应。传言与预期互为因果，正是信息瀑布的雏形。"}, {"q": "主角安排媒体「一致倡导新制度将彻底奠定牛市基础」，属于什么心理战术？", "a": "舆论造势：通过平面媒体文章与电视节目统一口径，把新制度与长期牛市绑定，向大众灌输单边预期，制造信息瀑布，让利好预期在传播中自我实现。"}, {"q": "主角为何认为「出现一根阴线也是必须的」？体现怎样的博弈心理？", "a": "阴线能控制局面，防止行情失控；必须完全牵制住对手，不能让投资人的意愿顺利实现。这是庄家与散户的心理较量，以出人意料的走势打乱大众预期。"}, {"q": "主角说「有张有弛才是大道，凡事不可太强，否则容易折断」，何意？", "a": "涨势太猛会让获利者落袋为安、空仓者恐高不进场，反而无利可图。这是情绪操纵的节奏控制：张弛交替、留出机会，让更多人参与，众人合力把市抬起来。"}, {"q": "主角最后引用「出其不意，攻其不备」，表明他怎样的自我定位？", "a": "他坚信有独立见解与行为才能成为领袖，平淡无奇只能做大众的一员。明日他决定反向控盘、令对手不能心想事成，凸显庄家以孤独算计凌驾群体情绪之上的异化心态。"}], "quotes": ["财富效应在关键的时候会让所有的人勇敢起来。", "干掉这些人的资金不需要太多的内疚，因为能在股市上投资数十万的人，亏损完了不会影响生活。", "在我眼里这是一幅非常完美的画，添上今天的这一笔，向上就成了一种必然，向下你则会发现特别难看。", "有张有弛才是大道，凡事不可太强，否则容易折断", "你总是需要有自己独立的见解和行为，那样你才能成为领袖，如果你的见解和行为总是平淡无奇，那么，你也就只能是大众的一员了。"], "psych": [{"p": "情緒操縱", "a": "这时候的股价有我们推进和没有我们推进基本上是一样的，持有股票的不愿意卖出，没有的争先恐后地要买入，股价只会越来越高，我只需要在关键的时候加以引导即可。", "n": "庄家点燃人气后撤手，只在关键处引导，让大众情绪自行推高股价。"}, {"p": "追漲（貪婪）", "a": "对于涨幅在50%来说的几只股票来说，投资人都会认为是低价，至少应该还有30%的涨幅的。", "n": "散户以已有涨幅为参照仍觉低价，贪婪使其在涨势中继续追买。"}, {"p": "信息瀑布（謠言市）", "a": "下午收盘之后出消息，那么整整一天的交易都会笼罩在传言之中", "n": "新制度消息未公布先传开，传言支配次日交易，预期在传播中自我实现。"}, {"p": "道德衝突／罪疚感", "a": "干掉这些人的资金不需要太多的内疚，因为能在股市上投资数十万的人，亏损完了不会影响生活。", "n": "庄家以「亏完不影响生活」自我开脱，用合理化消解杀伐操盘的罪疚。"}]}, {"i": 124, "title": "第一百二十四回　晴日股海暗潮生", "kind": "hui", "summary": ["晴日令主角心情輕快，紅藍咖啡杯隱喻理智與激情，操盤者刻意調節自我情緒。", "主力借「新制度」傳言高開，派人探聽散戶與偏遠地區口風，消息面成博弈首戰場。", "巨量砸盤令指數兩小時內自1395瀉至1255，貪婪抵禦恐懼，接盤者眾令主力意外。", "營業部胖子空話連篇卻被奉為專家，群眾圍捧之下「長牛」「搶盤」成集體信仰。", "散戶錨定百元價位死守虧損籌碼，主力鎖價自如；收市宴客，冷酷與溫情並存。"], "qa": [{"q": "開篇為何特意描寫紅、藍兩個咖啡杯？這反映操盤者怎樣的心態管理？", "a": "紅杯令心情輕快明朗，藍杯使人理智卻缺激情。他盤算晴天用藍杯、陰天用紅杯以平衡情緒，顯示職業操盤者時刻在調節自己心理，把情緒視為可以主動操控的變量。"}, {"q": "主力開盤後為何急派小張打聽營業部散戶與偏遠地區的傳言？", "a": "指數高開21點、重倉股高開15%，他判斷「新制度」消息已在市場流傳。打聽傳言即研判信息瀑布的流向與速度，好決定何時、以何種力度拋售，消息面是他博弈的第一張牌。"}, {"q": "主力「每筆1000萬股、級差100元」連續拋售25分鐘，運用的是什麼心理戰術？", "a": "這是典型的砸盤式心理打壓：以巨量賣單把價格直接封在下方，逼出恐慌盤後再從容出貨。他堅稱「要想在高價位落袋為安這是絕對辦不到的」，因為只有壓低價格才能誘出接盤者。"}, {"q": "看到「持仓38%、gp10」的統計後，主力為何感嘆「在利益面前人们的贪婪完全可以抵御恐惧」？", "a": "他本以為深跌會嚇退買盤，誰知接盤者依然眾多，貪婪壓過了恐懼。散戶見跌勢既深反而貪圖便宜搶進，正是追漲殺跌群體心理的縮影，也讓他領悟到出貨之難。"}, {"q": "為何「曾经到过100块钱的股票，现在只有60元」，散戶卻寧可26天不賣？", "a": "散戶的心理被100元的歷史價位牢牢錨定，認定非回百元不賣，死守虧損籌碼而不肯割肉。主力正是利用這一錨定心理，把未成交賣單釘在低位，令股價在60元附近鎖死、進退自如。"}, {"q": "營業部胖子鼓吹「長期牛市」「搶盤」，為何眾人深信不疑且奉他為專家？", "a": "在新興市場普遍缺乏專業知識的環境下，敢說、能自圓其說便被奉為專家；眾人圍觀、搶著請教的場景更令說法互相強化。這正是專家崇拜與羊群效應的疊加，空話也因此變成集體信仰。"}, {"q": "主力聽完胖子講股回程途中，如何解讀散戶對當日下跌的反應？", "a": "他認為散戶其實仍看好股市，對下跌不以為然，是沒等到意料之中的高點、失去賣出欲望後的本能反應，多數人觀點傾向多頭思維——這是他對群體心理的冷靜觀察，也是再度拋售的依據。"}, {"q": "午後主力為何「停止交易、不撤單」？這與散戶的心理支撐位有何關係？", "a": "把未成交巨單掛在低位，使賣單成為股價不可逾越的障礙，股價便穩在該區間震盪。消息朦朧時散戶對走勢模稜兩可，最安全的做法就是把籌碼鎖在低價位，讓錨定心理替自己「看盤」。"}, {"q": "收盤「持仓31%、gp3」，尾盤跟風盤為何越來越少？", "a": "全天成交量較上日放大近一倍，指數僅跌7點報收1260點。人們見股市並未大跌，看漲信心回升，跟風拋售者自然減少——恐慌一退，貪婪與希望便再度抬頭。"}, {"q": "兇悍拋售一天之後，主角為何張羅請客、帶眾人去古鎮？", "a": "這是他兇悍操盤之外的溫柔一面：請吃飯、開麵包車載滿吃喝、還打算給當地孩子買文具。市場中他是冷酷莊家，市場外渴望人情溫暖，正反映職業投資人內心的孤獨與自我異化。"}], "quotes": ["在利益面前人们的贪婪完全可以抵御恐惧。", "要想在高价位落袋为安这是绝对办不到的。", "曾经到过100块钱的股票，现在只有60元，散户至少在26天之内不会卖出的。", "在这个普遍缺乏专业知识的新兴领域，能说到他这个份上，也应该算是专家了。", "大多数人的观点还是基本上倾向于多头思维。"], "psych": [{"p": "錨定效應", "a": "曾经到过100块钱的股票，现在只有60元，散户至少在26天之内不会卖出的。", "n": "散戶死守百元歷史價位，主力順勢鎖價，錨定心理反成出貨工具。"}, {"p": "信息瀑布（謠言市）", "a": "这些人都在传说新制度的问题，说是今天要发布了。", "n": "一則傳言口耳相傳便推高指數，預期自我實現，主力再借勢拋售。"}, {"p": "專家崇拜／過度自信", "a": "在这个普遍缺乏专业知识的新兴领域，能说到他这个份上，也应该算是专家了。", "n": "空話連篇的胖子被群眾奉為專家，專業稀缺之處崇拜愈盛。"}, {"p": "情緒操縱", "a": "我疯狂抛售的时间持续了25分钟，我想把价格直接封在下面", "n": "莊家以巨量砸盤誘發恐慌與貪婪交替，在情緒起伏中完成出貨。"}]}, {"i": 125, "title": "第一百二十五回　夜释私仇心自宽", "kind": "hui", "summary": ["陰線不改多頭主動權，31%持倉正處資金運作最關鍵時刻，莊家對節奏與趨勢自信十足。", "新規則消息經電視專家口徑統一傳播，主角盼開盤前以更大力度傳遞，輿論造勢暗藏預期操控。", "三線股暴跌勾起復仇念頭，主角兩日在私仇與君子風範間猶疑，算計與良心交戰不休。", "父親「你不舒服別人就好受」之言，點破零和博弈中心理承受力此消彼長的鐵律。", "決定與人為善、放棄落井下石後怨氣煙消雲散，合理化讓主角卸下道德重負重歸輕鬆。"], "qa": [{"q": "主角為何以「美」形容那根陰線？這反映莊家怎樣的心理？", "a": "陰線不改向上勢頭，主動權仍在多頭手中。莊家眼中的「美」不在單日漲跌，而在趨勢與控制感——只要勢在自己這邊，局部回調便不足為懼，這是操盤者對節奏的自信。"}, {"q": "電視專家一致看好新規則，主角還盼消息以更大力度傳遞，這注解了什麼心理戰術？", "a": "這正是輿論造勢與信息瀑布：權威聲音統一了口徑，眾口一詞形成「長期牛市」的預期，再經電視放大，投資人便會在開盤前相信並跟進，預期自我實現，利好方能落地。"}, {"q": "三線股暴跌時，主角為何想趁低建倉發動「自殺式襲擊」？", "a": "他要在最後時刻以自身倉位為賭注，用資金與心理雙重壓力逼對手徹底出局，這是一場心理較量：比誰先崩潰。因屬私仇，兩日猶豫更顯其報復心與君子風範的拉扯。"}, {"q": "父親「你自己不舒服別人就受不了」的話，如何注解股市博弈的心理本質？", "a": "股市是零和博弈，一方的舒坦意味著另一方的痛苦。此話點明：贏家之所以難受，往往因為他正把壓力轉嫁給對手；心理承受力此消彼長，誰先撐不住誰就出局。"}, {"q": "主角決定放棄報復後為何忽然輕鬆愉快？", "a": "他用「與人為善」「對方終將傾家蕩產」之說自我開解，把放棄合理化成明智之舉，怨氣與道德負擔同時卸下，認知失調得以修復，內心便重歸平靜。"}, {"q": "主角反覆用「君子風範」「與人為善」說服自己，說明了什麼？", "a": "面對復仇誘惑，他需要一個說得過去的理由才能心安。把「不落井下石」包裝成德行，其實也是為自己找台階——合理化讓放棄報復不再像示弱，而像一種主動選擇。"}, {"q": "主角為何對新規則播出的時機如此在意？", "a": "他深知消息的效力取決於時機與力度：周一開盤前是投資人決策的窗口，若利好能在此時以更大力度傳遞，便能先入為主地鎖定大眾預期，為手中多頭倉位營造順風。"}, {"q": "主角說「這畢竟屬於私仇」，說明他如何看待市場中的對手？", "a": "他把三線股視為有恩怨的具體對手，而非抽象市場——報復心把理性博弈染上個人色彩，險些讓私仇凌駕於資金計劃之上，幸而君子之念最終壓過了戾氣。"}, {"q": "小馬、小張、小麗為何都要離開？這對主角意味著什麼？", "a": "公司撤銷，一線人員各奔前程：小張學歷史考古，小麗與小馬赴美留學。團隊散場標誌一段生涯的結束，主角雖幫大家推薦，內裡卻是職業路上愈發孤獨的開始。"}, {"q": "眾人出遊時「第一次這樣開心地笑」，有何心理意味？", "a": "合作兩年來大家難得放下職場與資金壓力，開懷一笑。壓抑久了的情緒終於有了出口，歡笑背後是即將解散的團隊在告別前的最後溫情，愈開心愈顯離散之味。"}], "quotes": ["画上去之后虽然是根阴线，但是向上的势头还是压抑不住，主动权依然在多头手中的形态看起来非常得美。", "整体上专家们的意思很明白，新规则有利于股市长期发展，从而奠定了中国股市长期的牛市格局。", "不管遇到什么事情，你自己想着不舒服这就对了，你要是觉得舒服了别人就受不了。", "他已经糟糕成这样子了，我何苦再落井下石呢。再说只要他不离开股市，用这样的方法面对股市的话，迟早要倾家荡产的。", "非常奇怪，当我决定放弃惩罚对手的时候，我的心情忽然非常轻松愉快，原来所有的怨气和不满都烟消云散了。"], "psych": [{"p": "信息瀑布（謠言市）", "a": "整体上专家们的意思很明白，新规则有利于股市长期发展，从而奠定了中国股市长期的牛市格局。", "n": "利好言論經專家統一傳播，莊家盼開盤前加大力度，注解輿論造勢與預期自我實現。"}, {"p": "心理較量（看誰先崩潰）", "a": "不管遇到什么事情，你自己想着不舒服这就对了，你要是觉得舒服了别人就受不了。", "n": "父親之言點破零和博弈：一方難受即對方舒坦，考驗彼此心理承受力。"}, {"p": "道德衝突／罪疚感", "a": "这毕竟属于私仇，如果不顾一切这样做的话，好像有失君子风范。", "n": "復仇誘惑與良心拷問交戰，主角以君子風範自持，最終放下私仇。"}, {"p": "認知失調／合理化", "a": "非常奇怪，当我决定放弃惩罚对手的时候，我的心情忽然非常轻松愉快，原来所有的怨气和不满都烟消云散了。", "n": "以與人為善、對方終將傾家蕩產之說自我開解，消解怨氣換來平靜。"}]}, {"i": 126, "title": "第一百二十六回　古镇月明别宴长", "kind": "hui", "summary": ["庄家看穿散户利好出尽是利空的误读，以巨量买单拉起走势，用实际行情反向引导大众情绪。", "高位横盘化作心理支撑，价位稍回调即有新资金抢入，散户只怕踏空不问成交，追涨从众毕现。", "主力趁市场疯狂悄然大笔出货，持仓降至35%，在众人只忧买不到股票的掩护下完成减仓。", "最后一次聚会，主角鞠躬道别、安排前程与奖金，月夜联欢与平日操盘判若两人，职业异化暂得缓解。", "主角将顺利归因于古镇风水，以外部神秘因素置换市场因果，自我合理化悄然遮蔽操盘真相。"], "qa": [{"q": "庄家用了什么心理战术来扭转市场对利好的误读？", "a": "主角看穿散户集体认定利好出尽是利空的误读，反其道而行，以每笔千万股、级差百元的持续性买单直线拉起股价，用实际走势对大众加以引导，告诉大家利好出来是牛市，以气势重造市场预期。"}, {"q": "市场高开走低时，散户表现出什么群体心理？", "a": "指数高开38点后迅速下探，热门权重股均有超百万股抛单，众人一致认定利好出尽是利空、抢着离场，是典型的群体一致化误判，恰好为主力低位承接、反手造势提供了可乘之机。"}, {"q": "1330点高位横盘为何价位一回调就有新资金入场？", "a": "上午单边大涨后指数稳守高位，横盘本身成了心理支撑位，价位稍一回落，踏空者与跟风者便认定是买点蜂拥抢筹，恐惧踏空胜过恐惧下跌，羊群效应在反复抢筹中不断自我强化。"}, {"q": "疯狂行情中散户只担心买不到股票，反映了什么心理？", "a": "追涨的贪婪与错失恐惧压倒理性，人们只担心买不到股票，不关心成交的大小和涨幅的比例，主力正是利用这种心态，在众人眼中毫不起眼的掩护下悄然大笔出货。"}, {"q": "主角为何偏偏选在行情最疯狂时出货？", "a": "情绪高潮时众人的注意力与怀疑都被稀释，大笔卖单混在汹涌买盘中毫不显眼；他据此在上午收盘前以每笔五百万股、级差六十元连续卖出，持仓降至35%而不惊动小投资人。"}, {"q": "主角把操作顺利归因于风水宝地，背后是什么心理？", "a": "这是典型的自我合理化：将复杂市场中的顺利成果归因于古镇风水这类外部神秘因素，既回避了运气与实力的真实比例，也回避了对自身筹码布局和人性操作的清醒审视。"}, {"q": "告别会上主角为何两次打住、不让沉重话题深入？", "a": "谈及栽培之恩、改变后半生这类话题时他立刻叫停，只谈去向安排、奖金发放与唱歌联欢，用事务性事项和欢笑稀释离别感伤，回避道德与情感的正面清算，正是职业操盘者的情感防御。"}, {"q": "老胡、山子为何也偷偷出货并维持涨幅不变？", "a": "他们与主角同一策略：趁高位横盘持续卖出，力争把仓位降到15%以下，同时以涨幅不动维系人气，避免散户察觉出货，是庄家之间配合默契的节奏与心理控制。"}, {"q": "主角以秦腔唱词良善不欺人收尾，有何心理意味？", "a": "唱词自道家贫困却心底良善不欺人，与白天操盘时的诱多造势、暗地出货形成对照，隐约流露庄家内心的道德自辩与罪疚，狂欢夜既是放松，也是良心的片刻喘息与自我安顿。"}], "quotes": ["我必须用实际走势对大家加以引导，告诉大家利好出来是牛市。", "整个市场疯了，整整一个上午指数维持在1330点的高位横盘，价位只要往下回调一下，马上就有新资金入场。", "这样疯狂地交易，人们只会担心买不到股票，不大关心成交的大小和涨幅的比例。", "叫声大嫂你听清，老六我虽然家贫困，心底良善不欺人⋯⋯", "我就感觉这古镇一定是个风水宝地。"], "psych": [{"p": "情緒操縱", "a": "我必须用实际走势对大家加以引导，告诉大家利好出来是牛市。", "n": "庄家以巨量买单制造走势，反向改写大众对利好的集体解读。"}, {"p": "追漲（貪婪）", "a": "这样疯狂地交易，人们只会担心买不到股票，不大关心成交的大小和涨幅的比例。", "n": "只怕踏空、不问成交，贪婪压过理性，掩护主力悄然出货。"}, {"p": "羊群效應（從眾）", "a": "价位只要往下回调一下，马上就有新资金入场。", "n": "高位横盘成为共识支撑，回调即被跟风盘蜂拥抢回。"}, {"p": "認知失調／合理化", "a": "我就感觉这古镇一定是个风水宝地。", "n": "把操盘顺利归因于风水，回避对自身判断与运气的审视。"}]}, {"i": 127, "title": "第一百二十七回　哀乐声中收巨阳", "kind": "hui", "summary": ["主力刻意誘導多頭情緒至極端，藉砸盤與急拉在短時間內出清籌碼。", "指數自1300點關口拉升至1345點收市，漲85點，散戶追漲盤與透支資金蜂擁入場。", "主角以哀樂隔離全民狂熱，自比交響樂指揮，於眾人瘋狂中強迫自己保持冷靜。", "愈近尾聲，盟友心理承受力愈差：主角以「繼續收拾對手」的承諾緩解老胡與山子的恐懼。", "小麗贈禮稱主角為「高高在上的神」，折射出職業操盤者與常人之間的心理距離與孤獨。"], "qa": [{"q": "莊家運用什麼心理戰術，讓散戶在極短時間內承接他的籌碼？", "a": "先砸盤製造恐慌讓跟風者割肉，再急速拉抬激發追漲情緒，將多頭情緒推向極端，令「沒人會眼睜睜看著利益流失」的散戶蜂擁接盤。"}, {"q": "主角為什麼先賣出砸盤、讓指數跌破1300點，再立刻買回？", "a": "他要讓剛才賣出的人後悔，被迫在高價追回；利用1300點整數關口的心理錨定，反覆收割恐慌與貪婪兩種對立情緒。"}, {"q": "收盤前散戶表現出怎樣的群體心理？", "a": "指數瘋狂上漲超出忍耐極限，眾人被激起買入激情，大批買盤蜂擁而至，透支交易的資金也大批量入場，是典型的追漲與羊群效應。"}, {"q": "主角為何在所有股民瘋狂時播放哀樂？這反映他怎樣的心理狀態？", "a": "他用哀樂強迫自己與全民狂熱隔離，保持冷靜理智以防全盤皆輸，顯現職業操盤手在狂潮中孤獨、異化的心理狀態。"}, {"q": "主角如何評價自己這一天的操盤？這暴露了什麼心理偏差？", "a": "他自認具有天才，能以手中籌碼與資金調動眾人積極性並成功降倉，把局勢與運氣歸功於自身能力，正是自我服務偏差的表現。"}, {"q": "主角為什麼要讓老胡知道他還想「收拾對手」而不是單純出逃？", "a": "讓老胡產生心理上的惰性，以緩解其緊張與恐懼，避免他在關鍵時刻失去控制提前拋空籌碼，毀掉整個出逃計劃。"}, {"q": "從老胡與山子的反應，主角領悟到關於人心的什麼道理？", "a": "越是最後關頭，人的心理承受能力越差，因此不能讓他們知道這就是最後；山子已失控過一次，關鍵時刻萬萬不能再失控。"}, {"q": "下午開盤橫盤半小時後，主角下達的第一筆指令參數如何？效果怎樣？", "a": "每筆1000萬股、級差價格100元賣出；成交量猛然增大，持續約5分鐘後價格續跌，指數迅速跌至1300點附近。"}, {"q": "收盤時的走勢與成交量有何特徵？主角如何解讀？", "a": "指數自1300點漲至1345點最高收盤，全天漲85點、漲幅逾7%，帶下影線的光頭陽線，成交量較前日多近3成，他認為是人氣極致的表現。"}, {"q": "小麗的禮物與留言反映主角在她心中是什麼形象？主角作何反應？", "a": "小麗視他為「高高在上的神」，稱彼此是兩代人並誓言隨時聽候召喚；主角嗔怪自己大不了幾歲，認為她有意打擊自己，可氣又可愛。"}], "quotes": ["今天一定要引导大家做多的情绪达到极端状态，只有这样才能在短时间内迅速出清手头的筹码。", "是的，股票投资就是一场大型的交响乐演奏，操盘手就是整个乐队的指挥，你必须将整个乐队所有成员的积极性调动起来，而且必须让他们按照乐谱规定扮演自己的角色。只要能达到这个境界，投机就成为一种艺术。", "人们彻底被激起了买入的激情，大批量的买盘蜂拥而至，看得出透支交易的资金开始大批量入场了。", "此时此刻，在所有股民都疯狂的时候，我必须有足够的冷静和理智，稍有不慎就会全盘皆输。", "越是最后的关头心理承受能力越差，因此，我不能让他们知道这就是最后。"], "psych": [{"p": "情緒操縱", "a": "今天一定要引导大家做多的情绪达到极端状态，只有这样才能在短时间内迅速出清手头的筹码。", "n": "主力以砸盤與急拉操控大眾情緒，讓散戶在極端多頭中替他出貨。"}, {"p": "羊群效應（從眾）", "a": "人们彻底被激起了买入的激情，大批量的买盘蜂拥而至，看得出透支交易的资金开始大批量入场了。", "n": "漲幅超出忍耐極限後眾人爭相追入、透支資金蜂擁，從眾效應盡顯。"}, {"p": "錨定效應", "a": "价格一直在横盘，指数维持在1320点附近震荡，看起来观望的情绪还是比较浓厚", "n": "1320、1300等整數點位成為散戶買賣的心理定錨，主力刻意在關口試探誘導。"}, {"p": "孤獨與異化", "a": "我一路闭着眼睛听着哀乐，此时此刻，在所有股民都疯狂的时候，我必须有足够的冷静和理智", "n": "全民狂熱之際主角以哀樂隔離自我，職業操盤者的孤獨與異化盡現。"}]}, {"i": 128, "title": "第一百二十八回　一夕狂澜万家泪", "kind": "hui", "summary": ["集合競價高開80%誘多，散戶蜂擁追入，主力趁跳空缺口暗中佈局。", "午間「馬路專家」鼓吹突破性缺口，主角授意媒體造勢，散播牛市僅過一半論調。", "尾市最後十分鐘狂拋五千萬股，追漲者來不及撤單，一生積蓄毀於一旦。", "指數收1363點，成就一人輝煌的同時，千家萬戶傾家蕩產。", "夜歸酒店聽哀樂、砸錄音機至手見血，失落與懺悔折磨著靈魂。"], "qa": [{"q": "主角為何在集合競價高開80%後吩咐「撤銷未成交的單子」？這一連串動作有什麼心理用意？", "a": "先以鉅額買單製造高開80%的火爆氣象，讓散戶以為行情啟動而蜂擁追入，隨即撤單，目的在誘多造勢、虛張聲勢，引散戶進場接盤。"}, {"q": "主角為何總在指數衝到1400點整數關口時拋售？1400點對散戶有何心理意義？", "a": "1400點是整數關口，散戶慣以整數位為心理錨點，以為站上即會續漲；主力利用此錨定心理在關口附近出貨，散戶仍堅信還有行情而不肯撤。"}, {"q": "聽到「馬路專家」說缺口是「突破性缺口」後，主角為何立刻想到「把這個缺口加以利用」？", "a": "他意識到專家言論能影響大眾預期，馬上授意小馬在盤後分析與晚間證券節目播出「牛市才剛剛進行了一半」，藉媒體造勢強化散戶看漲預期。"}, {"q": "尾市最後十分鐘，為何追漲掛單「不會有漏網之魚」？", "a": "收盤在即，散戶見股價發瘋上漲而貪婪追高，來不及撤單；莊家鉅額拋單一路成交所有掛單，追漲的羊群效應讓散戶集體接盤，損失慘重。"}, {"q": "資金運作告一段落、倉位快速下降後，主角為何「沒有任何高興的心情」？", "a": "他深知自己的成功建立在別人的傾家蕩產之上，成就一批財富與一個人輝煌的同時，許多人被毀掉一生；他認為市場注定只有一方能生存。"}, {"q": "回到酒店後主角為何聽哀樂、砸錄音機，直到手見血才平靜？", "a": "收割萬家積蓄後他罪疚與懺悔交加，哀樂更添末日感，狂躁無法克制；砸機自傷、見血之後才漸趨平靜，正是良心拷問與死亡焦慮的外化。"}, {"q": "27日早晨集合競價時，主角下達了什麼指令？重倉股開盤情況如何？", "a": "他吩咐報單員「買入2000萬股，級差價格300元」，重倉股高開80%；指數跳空高開34個點，開盤在1379點，開盤後大批買單湧入。"}, {"q": "上午拋售持續了多久？股價從最高漲幅回落多少？", "a": "拋售持續了差不多40分鐘，股價從最高漲幅90%回落到60%附近；原倉位下降1%，剛才吃進的股票基本上全部吐出去了。"}, {"q": "當天收盤指數報多少點？成交量有什麼特點？", "a": "指數收盤在1363點，上漲18點；成交量是春節過後最大的一天，金額也是最大的，因為全天大部分交易發生在他持有的高價股上。"}, {"q": "手上流著血時，主角給老胡打了什麼電話？", "a": "他吩咐老胡明天上午把那部分盈利分到銀行賬戶上；老胡說「你們那幾個人一定會感激你一輩子的」，主角沒有說話便掛了電話。"}], "quotes": ["今天的缺口属于突破性缺口，表明后市发展至少还有一半的行情。", "在这最后的10分钟里，彻底毁掉了许多人一生的积蓄。", "每次到这个时候我都是心情极为低落，失落和忏悔深深地折磨着我的灵魂。", "在成就了一批财富和一个人的辉煌的时候，却有许多人为此而倾家荡产。", "我强迫自己冷静下来，但是内心却特别狂躁，即便打开哀乐听也无济于事"], "psych": [{"p": "情緒操縱", "a": "股价快速上扬，瞬间的飙升再次刺激了场内人气", "n": "莊家借跳空高開與急砸，反覆操控大眾情緒，使其在貪婪與恐慌間失去理性。"}, {"p": "信息瀑布（謠言市）", "a": "今天的缺口属于突破性缺口，说明现在的牛市才刚刚进行了一半", "n": "莊家借媒體散播牛市論調，散戶跟風搶籌，預期自我實現而抬轎接貨。"}, {"p": "追漲（貪婪）", "a": "之前追涨未成交的买单挂单，这个时候会一路被成交掉，不会有漏网之鱼", "n": "散戶見漲眼紅、追高搶進，尾市瞬間成交，貪婪成為被收割的入口。"}, {"p": "道德衝突／罪疚感", "a": "每次到这个时候我都是心情极为低落，失落和忏悔深深地折磨着我的灵魂", "n": "收割萬家積蓄後，莊家深陷罪疚，哀樂與自傷皆無法平息靈魂的拷問。"}]}, {"i": 129, "title": "第一百二十九回　股海雪崩钟摆停", "kind": "hui", "summary": ["五月四日主角以自杀式清仓引爆雪崩，先诱多拉高吸引跟风盘，再级差砸盘，大众财富灰飞烟灭。", "连日减仓后主角被莫名恐惧笼罩，深夜如孤魂野鬼游荡，以卖唱排解，警署插曲成为雪崩前短暂喘息。", "深夜关灯播哀乐为灵魂与大众默哀，次日着名贵西装体面赴死，仪式背后是死亡焦虑与罪疚的交织。", "清仓封盘后主角情绪决堤，狂砸电脑、窗玻璃与挂钟，钟摆停摆，象征亲手终结股海生涯的异化仪式。", "主角与小丽、老会计泪别工作两年的办公室，头也不回离去，职业投资人在疏离中完成自我放逐。"], "qa": [{"q": "主角为何说「5月4日」彻底解脱了自己，却又成为许多人心中永远的痛？", "a": "他以自杀式清仓彻底结束近两年的资金运作，职业上得到解脱；但他亲手制造的雪崩让大众损失惨重，解脱与罪疚由此交织，这正是操盘手道德冲突的根源。"}, {"q": "出货当天主角为何先「拉高股价」？", "a": "这是庄家的诱多战术：先拉升制造上涨繁荣的假象，吸引追涨的跟风盘介入，指数冲上1365点附近后，他再以级差500元的抛单砸盘出货，实现情绪操纵下的完美收割。"}, {"q": "低迷四日之后仍有大量跟风盘，说明散户处于何种心理状态？", "a": "散户受贪婪与羊群效应驱使，见指数上冲便蜂拥追高，把庄家的诱多当作突破信号；庄家正是看准这种从众心理，才敢把全部筹码抛给跟风盘。"}, {"q": "周五夜主角为何像「孤魂野鬼」般游荡，甚至心血来潮去卖唱？", "a": "仓位降至7%以下意味着资金运作已近尾声，职业投资人骤然失去目标，被莫名的恐惧与空虚笼罩，行为出现异化，借卖唱这种反常举动排解压抑。"}, {"q": "主角深夜为何关灯播放哀乐，为自己和股价雪崩默哀？", "a": "他明知次日将亲手制造血淋淋的雪崩，哀乐既是给大众投资人的悼念，也是给自己灵魂的预演；对死亡的焦虑、对罪孽的预感，在默哀仪式中被推到极致。"}, {"q": "1365点和1300点对主角各有什么心理意义？", "a": "1365点是最近数日交易中枢，形成难以逾越的心理阻力位，是他判断拉高极限的锚点；1300点则是整数关口心理支撑，一旦跌破即触发恐慌性抛售，引发股价雪崩。"}, {"q": "小丽痛哭，主角却逗她说「可以去留学实现心愿」，是什么心理？", "a": "这是认知失调下的自我合理化：他用幽默把伤害包装成解脱，既安慰小丽也开脱自己，回避亲手制造悲剧的罪疚，恰恰暴露了他不敢正视的良心。"}, {"q": "主角的抛单指令有何特点，市场反应如何？", "a": "他吩咐报单员把全部持仓抛出，级差价格500元，几乎跌去股价的三分之二；不到20分钟大盘破位下行，一小时后单子全部成交，指数跌破1300点后大部分股价雪崩。"}, {"q": "小丽和老会计听到「结束了」时落泪，说明团队处于何种心境？", "a": "两人对共事近两年的集体满怀不舍，以泪表达告别；主角强作笑容掩饰自己，情绪却在小丽哭泣中动摇，众人悲戚的氛围折射出这场收割背后沉重的道德代价。"}, {"q": "挂钟的钟摆象征什么，砸停它意味着什么？", "a": "钟摆均匀摆动如市场节奏与不可逆的时间，也像在向主角示威；他砸停钟摆，是亲手终结这段岁月的仪式，象征职业投资人斩断异化自我、与股海生涯一刀两断。"}], "quotes": ["这一天我彻底地解脱了自己，但是，这一天也成为许多人心中永远的痛。", "莫名其妙的恐惧感笼罩了我的身体和我的灵魂。", "关闭所有的灯，打开哀乐我为自己的灵魂默哀，更为即将发生的股价雪崩默哀，也为大众投资人祈祷。", "在低迷四个交易日之后还有如此地大的跟风盘也算是非常理想了。", "我知道这个位置是最近几天以来的交易中枢，很难逾越。"], "psych": [{"p": "情緒操縱", "a": "我们一起开始拉高股价，吸引更多的跟风盘介入，指数开始上冲，最高见到1365点附近", "n": "莊家先誘多拉升製造繁榮假象，再以級差五百元砸盤出貨，操控大眾情緒完成收割。"}, {"p": "羊群效應（從眾）", "a": "在低迷四个交易日之后还有如此地大的跟风盘也算是非常理想了", "n": "散戶見漲便追、見跌便逃，跟風盤正是莊家最理想的接盤者。"}, {"p": "死亡焦慮", "a": "关闭所有的灯，打开哀乐我为自己的灵魂默哀，更为即将发生的股价雪崩默哀", "n": "哀樂與默哀是主角對自我與大眾的雙重死亡預演，雪崩前夜的儀式感盡顯焦慮。"}, {"p": "心理支撐位", "a": "我知道这个位置是最近几天以来的交易中枢，很难逾越", "n": "1365點是數日交易中樞的心理錨點，跌破1300整數關口隨即觸發恐慌性拋售。"}]}, {"i": 130, "title": "第一百三十回　泪别沪上熊途遥", "kind": "hui", "summary": ["主角不告而別悄然離滬，僅留一信託付小張處置酒店全部舊物。", "電腦硬碟隨身帶走，象徵將股海經驗與教訓一同帶離上海。", "飛機上閉目垂淚，職業投資人的孤獨與疏離於無聲中盡顯。", "四日前1391.42點成遙不可及制高點，市場就此步入漫漫熊途。", "捨棄舊物、斬斷沉沒成本，主角以決絕姿態與滬上歲月訣別。"], "qa": [{"q": "主角為何選擇「不告而別」？這反映出職業投資人怎樣的心理？", "a": "主角看透股海人情冷暖，寧可悄然離去也不作辭別寒暄；獨自登機、無人送行，正是一個被股市異化、與人群疏離的投資者的典型寫照。"}, {"q": "主角把酒店所有東西送人、不要的就扔掉，從心理學看意味著什麼？", "a": "這是他主動斬斷沉沒成本：昔日投入的物質與情感已無法挽回，與其被舊物羈絆，不如全部捨棄，輕裝決絕離場，讓自己徹底放下過去。"}, {"q": "「1391.42點」這個數字對身處熊市的人們有什麼心理意義？", "a": "它是牛市的制高點，也是眾人心中難以抹去的心理錨點；此後指數再難企及，這個數字反而在漫漫熊途中反覆提醒人們昔日的輝煌與當下的落差。"}, {"q": "主角在飛機上「眼淚不由自主地流了下來」，說明他的真實情緒是什麼？", "a": "表面決絕離開，內心卻難捨多年股海生涯；強抑的悲傷在獨處時潰堤，淚水既是對逝去行情的祭奠，也是對自己異化人生的無聲告別。"}, {"q": "本章中主角的「孤獨與異化」表現在哪些細節？", "a": "不向任何人打招呼、只留一封處置遺物的信、獨自登機落淚——他與舊日交際徹底切割，職業投資人的疏離感在無人送別的離場中暴露無遺。"}, {"q": "從群體心理看，「漫漫熊途」中的市場會出現什麼典型現象？", "a": "牛市錨點已然失效，散戶群體卻仍以1391.42點為參照，恐慌性拋售與割肉離場相互強化，行情越跌，群體的絕望情緒越被放大。"}, {"q": "主角帶走電腦硬碟這一細節，透露出他怎樣的心態？", "a": "硬碟承載交易記錄與經驗教訓，是他唯一捨不得丟棄之物；這象徵他把傷痕與教訓隨身帶走，也暗示他仍以交易為業，難以真正抽身。"}, {"q": "為何說主角的離開帶有「訣別」的意味？", "a": "送盡舊物、不告而別、登機垂淚，舉止宛如為一段人生送終；牛市的終結與個人的離場交疊，讓這次離開蒙上哀悼與訣別的陰影。"}, {"q": "本章以「淚」與「遙不可及的制高點」收束，傳遞了什麼心理基調？", "a": "以無聲之淚和無法回望的高點，寫盡繁華散盡後的蒼涼：主角既為逝去的行情哀悼，也為自己孤獨的投資人生落淚，悲情貫穿全章。"}, {"q": "主角的種種舉動，如何體現他與過去「決裂又不捨」的矛盾心理？", "a": "捨棄舊物是決裂，帶走硬碟是保留，兩者並存顯示他內心矛盾：想斬斷沉痛的過去，卻仍放不下那段用血淚換來的經驗，離場而不解脫。"}], "quotes": ["离开上海的时候，我没有给任何人打招呼，在酒店给小张留了一封信，告诉他把我酒店里所有东西送给酒店门迎老头，他不要的就扔掉。", "电脑的硬盘我带走了。", "坐在飞往北京的飞机上，我头靠在椅背上，闭着眼睛，我的眼泪不由自主地流了下来⋯⋯", "我的眼泪不由自主地流了下来⋯⋯", "4日之前的1391.42点，成为未来股市漫漫熊途遥不可及的制高点！"], "psych": [{"p": "孤獨與異化", "a": "离开上海的时候，我没有给任何人打招呼，在酒店给小张留了一封信", "n": "職業投資人離場無人送別，只留一信，疏離感盡顯於無聲告別。"}, {"p": "沉沒成本", "a": "把我酒店里所有东西送给酒店门迎老头，他不要的就扔掉", "n": "主角捨棄上海一切舊物，主動斬斷無法挽回的沉沒成本，決絕離場。"}, {"p": "錨定效應", "a": "4日之前的1391.42点，成为未来股市漫漫熊途遥不可及的制高点！", "n": "制高點成為熊市中難以逾越的心理錨點，反覆映照今昔落差。"}, {"p": "死亡焦慮", "a": "坐在飞往北京的飞机上，我头靠在椅背上，闭着眼睛，我的眼泪不由自主地流了下来", "n": "主角以淚祭奠逝去的牛市，離場如訣別，透出末日般的哀慟。"}]}, {"i": 131, "title": "附錄一：和職業操盤手的對話", "kind": "appendix", "summary": ["操盤手直言散戶直接投機勝算不足25%，多數虧損源於自身能力不足與資本市場零和博弈的本質。", "失敗投機者三大共性：不懂市場、無正確理念方法、無紀律約束，買賣全憑運氣與一腔熱血。", "散戶絕望拋售之際莊家悄然吸籌，全民追漲之時莊家悄悄出貨，散戶情緒正是莊家收割的槓桿。", "失敗者把虧損歸咎於運氣與市場，成功者反省自身、克制情緒欲望，歸因方式決定投資命運。", "操盤手透過指標推測散戶投資心理並制定應對策略，股市是知識與智慧、更是心理承受力的較量。"], "qa": [{"q": "依操盤手估計，大眾投資人直接投機的勝算有多大？虧損最主要歸因於什麼？", "a": "能獲利的投機者不會超過25%，已是樂觀估計。虧損最主要源於投資人自身能力不足，資本投機是零和博弈，一個人的虧損需要至少一個以上的人承擔損失。"}, {"q": "失敗的投機者具備哪三個共性特點？", "a": "一是對資本市場的了解近乎為零；二是缺乏正確的投資理念和方法；三是缺乏有效紀律約束買賣行為。三者疊加，使買賣行為完全依靠賭運氣完成。"}, {"q": "從心理學看，失敗投資人把虧損歸咎於什麼？這種歸因暴露了什麼心理？", "a": "失敗投資人大都認為損失是因為運氣不好，對市場抱怨較多，不尊重市場和知識，經常要求市場滿足自己的需求。這是用外部歸因合理化失敗，拒絕反省自身能力不足的認知失調。"}, {"q": "散戶「絕望拋售」與「全民追漲」兩種極端情緒，在莊家眼裡分別意味著什麼？", "a": "散戶因股價長期下跌而絕望、不計成本拋售時，莊家不動聲色吸籌；散戶忍不住誘惑、任何高價都敢追漲、全民買股時，莊家悄悄出貨。莊家的買賣時機正建立在散戶的情緒極端之上。"}, {"q": "操盤手看技術指標嗎？他如何利用指標揣摩散戶心理？", "a": "操盤手基本不看指標，因為指標是莊家資金進出後的產物。他只關注指標對自己的跟蹤情況與散戶反應，從指標走勢和交易變化推測散戶的投資心理，再作出適當的應對策略。"}, {"q": "莊家和散戶最大的區別在哪？這種區別對心理博弈有何意義？", "a": "莊家依靠操縱股價賺錢，散戶只能跟蹤莊家走勢賺錢。但多數散戶對莊家深惡痛絕，把莊家看作敵人而不去跟莊，這種敵意情緒使他們錯失博弈中唯一可行的生存策略。"}, {"q": "成功的投資人與失敗的投資人在心態上有何不同？", "a": "失敗者把損失歸咎於運氣，抱怨市場，要求市場滿足自己；成功者遭遇挫折時反省自己的不足，努力學習專業知識，克制自己的情緒和欲望，尊重市場的價格走勢和知識。"}, {"q": "股票買賣之所以發生，最根本原因是什麼？相同市場裡分歧為何如此之大？", "a": "買賣源於雙方對未來走勢判斷的嚴重分歧：賣出者認為不能再漲，買入者認為還要漲。分歧大小歸咎於了解市場的程度與專業技能等綜合素質，判斷正確靠專業知識，判斷失誤者則全靠運氣。"}, {"q": "操盤手如何看待「最佳買賣點」？這對散戶的完美主義心理有何警示？", "a": "他直言買到最低、賣到最高的理想行為根本不存在，只須在合理價位買入、持有相當長時間後再合理賣出，有差價獲利就是成功。追求做得比別人好，並非投資的目的。"}, {"q": "對長期虧損又不願改變的投資人，操盤手的建議是什麼？", "a": "他直言「永遠離開」，這看似殘酷實則是最好的結局，至少知道自己不適合做股票投資，沒必要把生命消耗在不適合自己的行業。留下來繼續虧損，只是對錯誤選擇的執著。"}], "quotes": ["能在股市上通过投机获得利益的投机者不会超过25%，这是比较乐观的估计。", "资本投机属于零和搏奕的市场，一个人的亏损需要至少一个以上的人来承担损失。", "当小投资人都因为股价长期下跌，对未来走势产生绝望的时候，纷纷不计成本抛售自己手头的筹码，那么庄家就会不动声色地吸筹。", "当大众投资人都因为股价长期上涨，忍不住诱惑，任何高价位都敢于追涨，全民买股票，成交量不断地放大，这个时候庄家就开始悄悄地出货了。", "失败的投资人大都认为自己的损失是因为运气不好，对市场抱怨的时候比较多。"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "当小投资人都因为股价长期下跌，对未来走势产生绝望的时候，纷纷不计成本抛售自己手头的筹码", "n": "散戶在絕望恐懼中不計成本拋售，恰成莊家低價吸籌的良機。"}, {"p": "追漲（貪婪）", "a": "当大众投资人都因为股价长期上涨，忍不住诱惑，任何高价位都敢于追涨，全民买股票", "n": "全民追漲的貪婪狂熱，正是莊家悄悄出貨的信號。"}, {"p": "情緒操縱", "a": "操盘手可以根据指标的走势以及交易的变化，推测散户的投资心理，然后作出适当的应对策略", "n": "莊家推測並利用散戶心理波動，反過來操控其情緒以達成吸籌出貨。"}, {"p": "心理較量（看誰先崩潰）", "a": "当小投资人都因为股价长期下跌，对未来走势产生绝望的时候，纷纷不计成本抛售自己手头的筹码，那么庄家就会不动声色地吸筹", "n": "散戶先扛不住而崩潰拋售，莊家沉住氣悄然接籌，比的是心理承受力。"}]}, {"i": 132, "title": "附錄二：作者手札", "kind": "appendix", "summary": ["作者手札以「自信」開篇：投資人須相信自己能獲取財富，點出信念先於方法的心態基礎。", "認識股市分投資與投機兩角度，投機角度直指股價變動的內因與投資人的心理需求。", "作者斷言影響股價最主要的因素是投資者的心理預期，股價如被一雙無形的手操縱，市場實為心理戰場。", "正確理念為價值投資加趨勢投機：前者令人立於不敗之地，後者可規避短期風險並使利益最大化。", "作者自1997年著手寫書，2007年《股道》問世，化繁為簡、安全賺錢，並以戰勝自我為投資終極功課。"], "qa": [{"q": "作者認為投資人首先必須具備什麼心理條件？", "a": "足夠的自信，相信自己能夠在股市上獲取財富，只是目前還沒有找到正確的方法而已；自信是獲取財富的心理前提。"}, {"q": "作者指出股票投資必須從哪三個方面入手？", "a": "一是了解股市，二是樹立正確的理念，三是掌握科學的方法；三者從認識股市、確立戰略思想到具體實施，構成完整框架。"}, {"q": "認識股市分為哪兩個角度？各有何重點？", "a": "分為投資與投機兩角度；投資角度需掌握經濟與財務知識評估企業價值，投機角度則要研究股價變動的內因，貼近投資人的投資需求。"}, {"q": "作者認為影響股價變動最主要的因素是什麼？", "a": "宏觀政策、經濟環境與企業業績預期都會影響股價，但最主要的還是投資者的心理預期，其對股價變動的影響巨大，揭示市場由預期驅動的心理本質。"}, {"q": "「一雙無形的手在操縱」指什麼？《股路不歸》站在什麼角度寫作？", "a": "作者以無形的手形容股價背後的操縱力量；《股路不歸》站在投機角度，向投資人展現股市不為人知的另一面，提供認識股價變動的新視角。"}, {"q": "作者把自信置於投資首位，與過度自信有何關聯？", "a": "作者強調信念先於方法，正是股市中過度自信、迷信自我判斷的心理根源：先相信自己能贏，再去找正確方法，容易陷入高估自身的陷阱。"}, {"q": "作者主張的正確投資理念是什麼？各有什麼好處？", "a": "價值投資加趨勢投機；堅持價值投資可以讓投資人立於不敗之地，趨勢投機則可以在規避短期風險的同時讓投資人的利益最大化。"}, {"q": "作者說此書能「戰勝自我」，體現了什麼心理意義？", "a": "作者以戰勝自我、獲取財富為寫作目的，說明投資成敗的關鍵在於與自己的心理較量，能否駕馭貪婪與恐懼等內在情緒。"}, {"q": "作者何時開始嘗試寫書，又到何時才如願以償？", "a": "大約在1997年作者就試圖寫一本能傳授科學方法的書，直到2007年《股道》問世，才終於完成了這一心願。"}, {"q": "《股道》一書的特點及配套輔助是什麼？", "a": "它直接將理念和方法揉和在一起，倡導價值投資加趨勢投機，操作上化繁為簡、安全賺錢；並配以長達八小時的教學光碟，助人快速掌握方法。"}], "quotes": ["作为投资人，首先必须有足够的自信，相信自己能够在股市上获取财富，只是目前还没有找到正确的方法而已。", "但是，最主要的还是投资者的心理预期对股价变动影响巨大。", "股票价格的变动是一双无形的手在操纵，如何能更深刻的了解到这一点呢？", "坚持价值投资可以让投资人立于不败之地。趋势投机则可以在规避短期风险的同时，让投资人的利益最大化。", "希望能为投资者建立一个科学的方法，为战胜自我，获取财富提供力所能及的帮助！"], "psych": [{"p": "專家崇拜／過度自信", "a": "作为投资人，首先必须有足够的自信，相信自己能够在股市上获取财富，只是目前还没有找到正确的方法而已。", "n": "作者把自信置於投資首位，反映股市中信念先於方法、過度自信的普遍心態。"}, {"p": "信息瀑布（謠言市）", "a": "但是，最主要的还是投资者的心理预期对股价变动影响巨大。", "n": "點明股價由投資者心理預期主導，預期自我實現正是訊息驅動市場的寫照。"}, {"p": "情緒操縱", "a": "股票价格的变动是一双无形的手在操纵，如何能更深刻的了解到这一点呢？", "n": "「無形的手」暗示股價背後有人操縱大眾心理，正是情緒操縱的市場寫照。"}, {"p": "心理較量（看誰先崩潰）", "a": "希望能为投资者建立一个科学的方法，为战胜自我，获取财富提供力所能及的帮助！", "n": "以「戰勝自我」為投資終極功課，呼應投資本質是與自己心理承受力的較量。"}]}, {"i": 133, "title": "附錄三：《股道》前言", "kind": "appendix", "summary": ["作者十年躊躇不敢動筆，自認非文曲星下凡而誠惶誠恐，寫書的神聖感折射敬畏與自我懷疑。", "歷經老八股、327期貨、911暴跌等市場滄海均淡淡走過，唯有寫書難以坦然，兩種考驗迥異。", "信息真假難辨、價格瞬息萬變令人焦慮，「化繁為簡」是應對資訊過載的心理防衛。", "以銀行股為最安全之錨，最多持兩隻做波段，貪婪讓位於風險規避，執著於確定性。", "自認懶人、發現股市能躺著幹一輩子而入行，把懶惰合理化為入市因緣。"], "qa": [{"q": "作者為何對寫書如此誠惶誠恐？這反映什麼心理？", "a": "他認為寫書神聖，能寫書者是文曲星下凡，自認不像，因而更加誠惶誠恐——把寫書理想化為權威象徵，反被敬畏與自我懷疑壓住，十年不敢動筆。"}, {"q": "作者歷經多次市場動盪卻「淡淡地走了過來」，唯有寫書不能坦然，說明什麼？", "a": "暴跌千點考驗的是心理承受力，他一一挺過；寫書考驗的是自我價值，屬更深層的心理較量，壓力反而更重，故多年躊躇、年過不惑才動筆。"}, {"q": "「化繁為簡」在心理上是如何運作的？", "a": "股票信息真假難辨、價格瞬息萬變，逐一應對會造成認知負擔；只取公告、盤後K線與組合指標，是通過簡化信息來源來降低焦慮的心理防衛。"}, {"q": "作者為何認定銀行股最安全？這是什麼心理現象？", "a": "他錨定「沒有任何企業有銀行那麼安全」，以銀行股為安全心理定錨，只持兩隻做波段，用確定性幻想壓制對市場不確定性的恐懼，是典型的錨定效應。"}, {"q": "作者自稱「懶人」並因「能躺著幹一輩子」入市，體現什麼心理？", "a": "這是典型的合理化：把懶惰轉化為職業選擇的正當理由，用「這活能躺著幹一輩子」為入市、用電腦代勞找台階，消解勤勉焦慮與父親的擔憂。"}, {"q": "作者說「投資股票本來不是很複雜的事情」，反映什麼心態？", "a": "體現簡化思維下的自信，也是對專家式講解的抗拒——他不像專家從計算公式開講，而是直接告訴買點，暗含破除權威、自我肯定的意味。"}, {"q": "作者為何把寫書拖了十年、年過不惑才完成？", "a": "1997年即有打算卻一直不敢動筆，因把寫書看得神聖、怕辜負期望；直至2007年過了不惑之年，如中年得子般珍惜，才謹小慎微地了結心願。"}, {"q": "「安全賺錢」體現了怎樣的情緒管理？", "a": "把資金放到最安全處、只選基本面優良的長期股票，是典型的損失厭惡——寧可少賺也不願虧損，用嚴格紀律壓制貪婪與恐懼的波動。"}, {"q": "作者強調「用大量圖片結合實戰技巧講解」，心理上有何用意？", "a": "他認為讀者要的是直接可用的買點而非高深學問，圖文並茂、直指結果能降低學習門檻，減少信息過載帶來的困惑與不確定感。"}, {"q": "327期貨、911暴跌、德隆苦難等親歷對作者心態有何塑造？", "a": "這些極端行情都是心理承受力的試煉，經受洗禮後他對漲跌「淡淡走過」，煉出職業投資者的淡定，也加深了對安全與簡化的執著。"}], "quotes": ["通过这本书我想倡导一直以来我所信奉的投资理念：化繁为简，安全赚钱。", "年过不惑方成此书，犹如中年得子一般，十分珍惜，所以，总是显得谨小慎微。", "股市沧海，曾经历了老八股时代一天几十元的震荡，也经历了327国债期货的洗礼", "我是一个懒人，以至于当年我年迈的老父亲总是常常担忧地看着我说：\"娃呀，你不勤快怎办啊，以后有什么事情能让你躺着干一辈子的？\"", "我想没有任何企业有银行那么安全了，所有银行股都是我关注的对象"], "psych": [{"p": "錨定效應", "a": "我想没有任何企业有银行那么安全了，所有银行股都是我关注的对象", "n": "以「銀行股最安全」為心理定錨，據此構建整個投資體系與操作紀律。"}, {"p": "認知失調／合理化", "a": "我是一个懒人，以至于当年我年迈的老父亲总是常常担忧地看着我说：\"娃呀，你不勤快怎办啊，以后有什么事情能让你躺着干一辈子的？\"", "n": "把懶惰合理化為入市的正當因緣，用「能躺著幹一輩子」消解父親的擔憂。"}, {"p": "損失厭惡（割肉）", "a": "何谓安全赚钱？把资金放到最安全的地方，选几只基本面优良、具有长期持有价值的股票。", "n": "資金只放最安全處、寧可少賺，反映對虧損的強烈規避勝過對利潤的追逐。"}, {"p": "心理較量（看誰先崩潰）", "a": "股市沧海，曾经历了老八股时代一天几十元的震荡，也经历了327国债期货的洗礼，外汇市场上经历了911美元几分钟之内暴跌千点的暴力升华", "n": "暴跌千點是心理承受力的極限考驗，作者以「淡淡走過」完成與市場的自我較量。"}]}, {"i": 134, "title": "附錄四：《股道》目錄", "kind": "appendix", "summary": ["附錄四收錄《股道》目錄，八章體系以理念為首，揭示炒股實為心性之爭。", "作者視貪婪與恐懼為最優秀品質，與大眾常識相反，直指情緒是博弈籌碼。", "「無形的手」操縱股價，注解莊家對價格與人心的雙重操控。", "戒憤怒、虛榮、自負，強調忍耐與面對挫折，心態即勝負手。", "主張遠離投資大眾，因「大眾的思維都是錯誤的」，異化孤獨成為職業特質。"], "qa": [{"q": "作者為何說「貪婪和恐懼是股票投資最優秀的品質」？", "a": "作者逆大眾常識，認為貪婪與恐懼正是驅動買賣的情緒本能，善用而非壓抑它，才能把握追漲與離場的節奏，把情緒變成博弈武器。"}, {"q": "「無形的手」指什麼？背後是什麼心理博弈？", "a": "指操縱股價變動的隱蔽力量（莊家）。它利用人性弱點製造漲跌節奏誘導散戶，看不懂這雙手的人便淪為被情緒牽引的對手盤，是莊家與散戶的心理較量。"}, {"q": "理念章為何多條告誡「憤怒」「虛榮」「自負」？", "a": "憤怒徹底毀掉投資生涯、虛榮傷害金錢、自負使人失去學習機會，三者皆是人性弱點被行情放大後反噬自我的表現，注解戰勝自己比戰勝莊家更難。"}, {"q": "「忍無可忍的時候再忍一會兒」體現什麼心理素質？", "a": "體現與市場、與莊家的心理承受力較量：多數人在最後關頭情緒崩潰而割肉出局，忍到極限再忍一下，正是考驗誰先崩潰的耐性博弈。"}, {"q": "為何作者主張「儘可能地遠離股票投資大眾」？", "a": "因為大眾的思維都是錯誤的思維，聚集在一起只會強化從眾與極端情緒；遠離大眾才能獨立判斷，也預示職業投資者孤獨異化的生存狀態。"}, {"q": "「不要試圖去用任何理由解釋股票價格漲跌」有何心理深意？", "a": "散戶總愛為虧損編造理由自我安慰，其實是認知失調下的合理化；作者主張只認成交與紀律，拒絕用虛構邏輯扭曲現實。"}, {"q": "作者為何告誡「千萬不要愛上股票」？", "a": "愛上股票會讓人因感情投入而無法放手，錯過止損時機，正是沉沒成本心理：對持倉產生情感依附後，割肉比虧錢更痛苦。"}, {"q": "「成交量一定不會騙人」與其他指標相比有何心理優勢？", "a": "價格可被莊家做手腳，成交量卻是群體真實行為留下的痕跡：謠言可造假、行為難造假，看量即看真實的人心與資金動向。"}, {"q": "「如何知道莊家持股成本」為何令人興奮？", "a": "搞清主力成本價等同摸清莊家的心理底線：成本位附近莊家必然護盤，散戶可據此推算心理支撐位，把心理較量變成可計算的籌碼。"}, {"q": "「追漲殺跌絕對離不開cci」注解什麼群體心理？", "a": "追漲殺跌正是貪婪與恐懼的群體行為寫照：漲時追高、跌時割肉，莊家利用這種本能洗盤吸籌，CCI不過是為這一人性節奏標定買賣點。"}], "quotes": ["贪婪和恐惧是股票投资最优秀的品质", "股票价格变动是受一双无形的手在操纵", "大众的思维都是错误的思维", "尽可能地远离股票投资大众", "不要试图去用任何理由解释股票价格涨跌"], "psych": [{"p": "情緒操縱", "a": "股票价格变动是受一双无形的手在操纵", "n": "以「無形的手」喻莊家操控價格與人心，注解主力藉漲跌節奏誘導散戶情緒。"}, {"p": "追漲（貪婪）", "a": "追涨杀跌绝对离不开cci", "n": "追漲殺跌是貪婪與恐懼的本能行為，莊家常利用此節奏洗盤吸籌。"}, {"p": "羊群效應（從眾）", "a": "大众的思维都是错误的思维", "n": "斷言大眾思維皆錯，注解群體從眾與極化下的錯誤決策。"}, {"p": "孤獨與異化", "a": "尽可能地远离股票投资大众", "n": "主張遠離大眾獨立思考，注解職業投資者疏離人群的異化狀態。"}]}], "phen": {"恐慌性拋售（恐懼）": [{"hui": "前言", "anchor": "再现了股市的腥风血雨，真相使每一位读者都会感到哑然失色，心有余悸。", "note": "以腥風血雨描摹股市，點明恐懼氛圍正是散戶恐慌出逃的心理底色。"}, {"hui": "第一回　夢繞股海冬夜長", "anchor": "价格像谁从高处扔下的石头一样，无休止地在下跌", "note": "股價如落石無休止下跌，散戶面對崩跌的無助與恐慌已現端倪。"}, {"hui": "第二回　股海滄桑見浮沉", "anchor": "散户恐慌性抛盘一出来，就像山洪暴发一样，下跌的场面难以收拾。", "note": "莊家出貨引爆散戶恐慌，眾人爭相不計成本離場，群體恐懼如洪水決堤。"}, {"hui": "第四回　股海冬深忆故牛", "anchor": "你看看散户，拼命地出逃，我们应该怎么办？", "note": "暴跌中散戶不計成本出逃，主角卻視為最佳介入點，群體恐慌正是他的對手盤。"}, {"hui": "第五回　心战股海忆父恩", "anchor": "价格就像断线的珍珠往下滑落，资金一旦入市，转眼间就损失10％还多", "note": "散户在暴跌中不计成本出逃，正构成庄家逆势吸筹的契机。"}, {"hui": "第六回　峰巅收缰身自轻", "anchor": "人气大幅度地滑落，说明什么?就足以说明这些胆小的人们已经被吓得六神无主", "note": "莊家以人氣指標度量散戶恐慌程度，眾人嚇破膽之處正是建倉良機。"}, {"hui": "第十回　煤油燈下話滄桑", "anchor": "我们一般在开始的时候先买一点股票，低价卖出去引诱大家都跟着我们卖出，等他们卖出的时候我们再在低价的时候买回来", "note": "庄家故意压价诱使散户恐慌割肉，正是砸盘建仓的心理战术。"}, {"hui": "第二十一回　断珠惊魂沪上夜", "anchor": "价格开始以5元的幅度下跌，紧跟着就是10元、15元人们来不及反应", "note": "暴跌中散戶撤單無門，只能眼睜睜被成交，陷入集體恐慌。"}, {"hui": "第二十六回　酒酣论股测人心", "anchor": "疯狂地下跌，他们因为担心自己的股票遭受巨大亏损，就会不计成本地卖出", "note": "主力點破散戶暴跌時因恐懼而不計成本割肉，注解了恐慌性拋售的內在機制。"}, {"hui": "第三十二回　冬晨股海起波澜", "anchor": "我感觉要立即停止出货，不然会引起恐慌性抛盘出来的，那样就麻烦大了", "note": "莊家深知下跌一旦擴散，散戶不計成本拋售將引發崩潰，故在恐慌前收手。"}, {"hui": "第三十四回　春野爭田悟股場", "anchor": "如果往下跌他们也会毫不犹豫地斩仓，这样结果更糟糕", "note": "缺乏跌勢對策的實業資金，一旦下殺便毫不猶豫斬倉出逃。"}, {"hui": "第三十八回　狼来三唤人犹醉", "anchor": "这些小资金急了多少钱都敢卖出，跟他们多少钱都敢买入是一样的胆大", "note": "散户在恐惧与贪婪两极摆动，恐慌时不计成本割肉抛售。"}, {"hui": "第四十一回　三震急抛哀乐眠", "anchor": "这种不计成本地下跌，让那些原来成竹在胸的投资人一下子就从一个极乐世界进入一个万劫不复的地狱", "note": "莊家刻意製造不計成本的暴跌，讓散戶在恐懼中從極樂墜入地獄。"}, {"hui": "第四十二回　红盘如饵钓浮沉", "anchor": "我不认为这是一时的失误而是一种恐慌的表示，紧接着有好几只股票大同小异地这样交易", "note": "低開試盤點燃新股民集體恐慌，價格如多米諾骨牌般連環崩落。"}, {"hui": "第四十四回　砸破千二誘眾生", "anchor": "那些高价位的股票价格开始以几十元的价格在下跌，有限制的交易技术让那些小资金疯狂地不计价格地抛售自己的股票。", "note": "暴跌中小資金不計成本奪路而逃，正是群體恐慌的寫照。"}, {"hui": "第四十六回　血雨腥风葬股魂", "anchor": "开始有大批量的单子抛售，我吩咐：“不要着急就在这个价位接进，甚至可以把单子挂得低一点。", "note": "散戶在強平恐懼下不計成本拋售，正好讓主力揀到低價籌碼。"}, {"hui": "第六十七回　夜宴谋成独怅然", "anchor": "击破1000点的整数关，引致投资人的恐慌抛盘，然后我们在1000点左右，大批量地接货", "note": "莊家故意砸破千點製造恐慌，散戶不計成本拋售，莊家再低吸接貨。"}, {"hui": "第七十四回　千点失守老妪惊", "anchor": "巨大的恐惧完全控制了她所有的思维，只剩下一个信念，尽快卖掉股票", "note": "暴跌中散戶不計成本逃命，恐懼取代一切理性判斷。"}, {"hui": "第七十五回　静安寺前泪染襟", "anchor": "跟风盘终于显示出巨大的恐慌，小资金终于不能承受下跌的痛苦煎熬，大部分选择了放弃", "note": "兩日暴跌79%令小資金不計成本離場，正是砸盤建倉所要的恐慌效果。"}, {"hui": "第七十八回　谣传救市股海惊", "anchor": "人站在人身上希望自己的单子早点成交的心情足以让人发疯", "note": "指數暴跌時散戶爭先出逃、不計成本，正是恐慌性拋售的寫照。"}, {"hui": "第七十九回　洗盘建仓雨转晴", "anchor": "上涨的时候敢于追进，下跌的时候恐慌性的抛盘更严重。", "note": "主角以砸盤試出散戶追漲殺跌的天性，恐慌拋售正是他建倉的獵物。"}, {"hui": "第八十五回　万骨功成独怅然", "anchor": "在大盘自由落体下降30点的时候，说明有投资人恐慌性的抛盘卖出", "note": "主力砸盤製造恐慌，逼散戶不計成本拋售交出籌碼。"}, {"hui": "第八十六回　弄堂独行闻雪崩", "anchor": "从最初10分钟的交易情况看，小资金恐慌性的抛单还是存在，成交量极度下降。", "note": "散戶在縮量行情中仍不計成本拋單，恐懼情緒主導其交易行為。"}, {"hui": "第九十二回　蛇夢縈心股海狂", "anchor": "对方终于撑不住了，价格开始向下急速下跌，这样重量级的对决差不多进行了7分钟", "note": "主力連續巨量拋售逼出散戶恐慌拋盤，不計成本奪路而逃，正是恐慌性拋售的典型。"}, {"hui": "第九十四回　砸盘洗筹隐忧长", "anchor": "会计统计报表显示：gp达到25。看起来恐慌性抛盘还是有的，但是买盘也不少。", "note": "莊家砸盤瞬間引爆散戶恐慌性拋盤，證實恐慌可被人為製造。"}, {"hui": "第九十七回　独斟哀乐夜未央", "anchor": "他不仅不会增仓，很可能——开盘就将剩下的筹码自杀式出掉", "note": "山子一旦逆反便可能不计成本清仓，正是恐惧支配下的恐慌性抛售。"}, {"hui": "第一百零一回　翻云覆雨股海惊", "anchor": "三线股的股价还在雪崩式地下跌，抛单虽然不大，但是自杀式的多杀多形成的压力却很大，每个价位之间相差几乎十几元", "note": "暴跌中散戶不計成本互相踩踏，恐懼驅使眾人爭相奪路而逃。"}, {"hui": "第一百零五回　蓝筹初兴股海波", "anchor": "看起来恐慌性的投资人还是有的，不计成本的抛售已经成为自我解脱的一种最好的选择", "note": "gp38显示暴跌中散户不计成本割肉，把抛售当作自我解脱，恐惧主宰盘面。"}, {"hui": "第一百零六回　雪崩驚魂鎖局深", "anchor": "本来就疲惫不堪的指数，在热点股票地打击下开始急转直下，三线股所有股票闻风而动，价格雪崩式地下跌。", "note": "主力砸盤點燃恐慌，三線股聞風雪崩，注解恐慌性拋售的連鎖傳導。"}, {"hui": "第一百零八回　红房夜宴谋推涨", "anchor": "个股的跌幅达到30%的比比皆是。三线股受到打击之后，也开始猛烈地下跌，一些随波逐流的三线个股跌幅更大一些。", "note": "砸盘引发恐慌，散户不计成本抛售，随波逐流者跌得更惨。"}, {"hui": "第一百一十四回　砸盘惊魂洗浮筹", "anchor": "看起来这个时候恐慌性的抛盘开始出现，但是，底部作短线的人也开始增加", "note": "連續砸盤製造的恐慌令散戶不計成本拋售，正落入莊家低位接籌的算計。"}, {"hui": "附錄一：和職業操盤手的對話", "anchor": "当小投资人都因为股价长期下跌，对未来走势产生绝望的时候，纷纷不计成本抛售自己手头的筹码", "note": "散戶在絕望恐懼中不計成本拋售，恰成莊家低價吸籌的良機。"}], "追漲（貪婪）": [{"hui": "第六回　峰巅收缰身自轻", "anchor": "但是人们已经疯狂了，已经不再担忧这样的价格会不会很高，因为在这个时候有些股票的价格是几千元", "note": "股價越高越不嫌貴，狂熱幻想自己的股票也衝向幾千元，貪婪吞沒理性。"}, {"hui": "第十二回　萬人搶籌我獨清", "anchor": "我再看看柜台前人们争先恐后地在存钱，柜台后面的小姐根本谈不上什么服务态度，能让你早早存上钱就算帮你忙了，还计较什么态度，人们确实疯狂了。", "note": "櫃台前爭先存錢、人人認定漲勢才剛開始，是典型追漲貪婪的寫照。"}, {"hui": "第十八回　殺手整裝佈陷阱", "anchor": "人们疯狂的买单开始不计价格地追进", "note": "散戶見漲即追、不計成本，正是莊家誘多拉抬所依賴的貪婪盲從心理。"}, {"hui": "第二十四回　驚魂周五急出倉", "anchor": "我们刚才都通了一下电话，已经停止拉抬了，现在这么强劲的跟盘不用再拉了", "note": "主力一停手，散戶跟風買盤便自行推高股價，貪婪使大眾成為莊家的免費拉抬工具。"}, {"hui": "第二十五回　黃昏出盡滿倉愁", "anchor": "当指数创新高以后，买盘蜂拥而入，我们的买单早就停了，但是价格还是飞快地上涨。", "note": "散戶見指數創新高便蜂擁追高，貪婪沖昏頭腦，成為莊家高位出貨的接盤力量。"}, {"hui": "第二十六回　酒酣论股测人心", "anchor": "你要是大涨，那么他们也会因为担心自己不能获取利益而急急忙忙地跟进", "note": "散戶上漲時怕錯失利益而急急追進，貪婪驅使的追漲行為在此被莊家親口點破。"}, {"hui": "第二十九回　钟鸣惊梦停报单", "anchor": "你只要让他们赚一次钱，在他们的眼里地球都很小，地球已经不能满足他们的生存需要，", "note": "散户赚一次便贪欲膨胀，追高抢短成惯性，最终高位被套。"}, {"hui": "第三十三回　笑看資潮逐浪高", "anchor": "他们不知道在低价的时候大量地买进，而是追高", "note": "新資金不懂低位吸納，見漲才敢追，注解追漲的貪婪心理。"}, {"hui": "第四十回　跌市拉红戏众生", "anchor": "一会儿gp就达到了12，人们做短线的这种愿望原来这样的迫切", "note": "價格一抬跟風盤便蜂擁而至，短線貪婪被莊家精準點燃。"}, {"hui": "第四十一回　三震急抛哀乐眠", "anchor": "刚才在价格上涨的时候跟进的那些人眼睁睁地看着自己被套，欲哭无泪", "note": "散戶因貪婪追高入場，正中莊家誘多後砸盤的圈套。"}, {"hui": "第四十五回　千点疯涨血雨腥", "anchor": "那些迟钝的人正在疯狂地买进，价格不断地追高挂单", "note": "散户在暴涨中不顾高位疯狂追涨，贪婪被行情点燃而失去理性。"}, {"hui": "第五十回　晴日高开暗出货", "anchor": "这说明人们还是看多，下跌不慌，上涨就追，典型的死多头思维", "note": "散户大跌不割肉、上涨就追，贪婪与损失厌恶交织的死多头心态。"}, {"hui": "第六十二回　股海翻雲夜獨行", "anchor": "看起来涨势还是不错，是不是行情又开始了？", "note": "漲勢乍起大戶便壓不住追進衝動，貪婪蓋過已知的風險。"}, {"hui": "第六十四回　谣风催涨暗抛筹", "anchor": "开盘居然高开60点，瞬间的上冲以后，没有更多的跟风盘", "note": "大眾被傳言激起的貪婪推高指數，卻缺乏跟風盤接續，追高注定後繼乏力。"}, {"hui": "第六十六回　股海沉浮一碗麵", "anchor": "看来市场上的人们还是处于那种梦想之中，不愿意也不舍得抛出自己手头的筹码", "note": "眾人沉醉於上漲夢想不捨兌現，貪婪使其甘冒回吐風險，反成庄家砸盤對象。"}, {"hui": "第八十回　夜雨江湖谋冷暖", "anchor": "赚钱的欲望刺激着他们发狂。", "note": "貪婪慾望壓過危機警覺，散戶在貪婪驅使下盲目追高。"}, {"hui": "第九十三回　人氣如潮人將散", "anchor": "连最偏远的哈尔滨营业部的交易席位也开始出现疯狂的买单。可见这次信息对人们的刺激达到了极致。", "note": "漲勢本身就是最強誘餌，貪婪驅使全國買盤競相追高。"}, {"hui": "第九十五回　惊涛股海孤舟撑", "anchor": "上午的上涨在一定程度上还是吸引了不少人下午参战", "note": "漲勢本身即誘餌，散戶見漲而動，熱點愈明顯跟風愈烈。"}, {"hui": "第一百一十回　股海屠牛夜话长", "anchor": "在我猛烈地抛盘压力下，上午一路追涨买入未成交的单子，全部成交", "note": "散戶貪婪追高，恰在莊家砸盤前接盤，淪為出逃的犧牲品。"}, {"hui": "第一百一十一回　十字星照人间路", "anchor": "上午的高价给人们画出了一个非常有希望的饼，虽然没有吃到，但是，谁也不愿意轻易放手", "note": "高價畫餅放大貪婪，散戶寧可苦等也不放手，反成莊家出貨的助力。"}, {"hui": "第一百一十四回　砸盘惊魂洗浮筹", "anchor": "上涨的跟风盘随交易时间地延续而逐渐下降。看起来人们追涨的激情在消退", "note": "散戶追漲熱情隨行情起伏被莊家反覆利用，成為其洗盤節奏的依據。"}, {"hui": "第一百一十八回　高台沽货笑泪间", "anchor": "干什么不能买？多高都能追。昨天收盘的时候我追进不是都骂我找死吗？", "note": "見漲追高、不計價格，散戶的貪婪被莊家牽著走，淪為接盤主力。"}, {"hui": "第一百二十回　雨中哀乐倒仓时", "anchor": "才发现很多资金都盯上这几只下跌的股票了，我当时分析他们的思维就是这股票肯定补涨", "note": "散戶認定下跌股必補漲，貪婪驅動追入，恰成莊家誘多的對手盤。"}, {"hui": "第一百二十三回　股海狂潮夜运筹", "anchor": "对于涨幅在50%来说的几只股票来说，投资人都会认为是低价，至少应该还有30%的涨幅的。", "note": "散户以已有涨幅为参照仍觉低价，贪婪使其在涨势中继续追买。"}, {"hui": "第一百二十六回　古镇月明别宴长", "anchor": "这样疯狂地交易，人们只会担心买不到股票，不大关心成交的大小和涨幅的比例。", "note": "只怕踏空、不问成交，贪婪压过理性，掩护主力悄然出货。"}, {"hui": "第一百二十八回　一夕狂澜万家泪", "anchor": "之前追涨未成交的买单挂单，这个时候会一路被成交掉，不会有漏网之鱼", "note": "散戶見漲眼紅、追高搶進，尾市瞬間成交，貪婪成為被收割的入口。"}, {"hui": "附錄一：和職業操盤手的對話", "anchor": "当大众投资人都因为股价长期上涨，忍不住诱惑，任何高价位都敢于追涨，全民买股票", "note": "全民追漲的貪婪狂熱，正是莊家悄悄出貨的信號。"}, {"hui": "附錄四：《股道》目錄", "anchor": "追涨杀跌绝对离不开cci", "note": "追漲殺跌是貪婪與恐懼的本能行為，莊家常利用此節奏洗盤吸籌。"}], "心理較量（看誰先崩潰）": [{"hui": "第三回　衡山夜半叉头声", "anchor": "我倒是要看看这小子还会不会这样一如既往地笑。", "note": "他要亲眼看着对方的笑容被戳破，看谁先撑不住，庄家式承受力比拼的预演。"}, {"hui": "第四回　股海冬深忆故牛", "anchor": "害怕的不是现在，而是5天以前，看看布林线价格明显地穿破上轨", "note": "同一場暴跌，領導驚惶、主角篤定，心理承受力之爭中先潰敗者先出局。"}, {"hui": "第五回　心战股海忆父恩", "anchor": "谁坚持到最后谁就是赢家，这是心理的较量，最后总有一些坚持不住的人", "note": "主角直陈股市本质：胜负取决于谁的心理承受力先崩溃。"}, {"hui": "第六回　峰巅收缰身自轻", "anchor": "当这些冲动的人们，再一次不顾一切地冲入这个市场的时候，就是我们全部出货的时候。", "note": "散戶情緒衝頂之際莊家逆向出貨，勝負繫於誰先崩潰、誰更冷靜。"}, {"hui": "第八回　雪夜归乡思股海", "anchor": "站在斗争的这个角度看待股市上的这种争斗，可能更显得合理一些", "note": "以陰陽相生相剋解讀股市，揭示莊散較量實為心理承受力之爭。"}, {"hui": "第十五回　回光返照梦难眠", "anchor": "运作大资金主要就是把握人的心理，在一开盘就打破人们的预先想好的投资计划", "note": "開盤半小時擊潰散戶既定計劃，雙方比拼誰先動搖、誰先認輸。"}, {"hui": "第二十二回　灯红酒绿夜筹谋", "anchor": "我知道人和人的智商差不了多少，没有谁比谁高明多少，唯一的区别是承受压力和打击的能力", "note": "主角點破博弈勝負在於誰先承受不住，承受壓力與打擊的能力才是唯一區別。"}, {"hui": "第二十九回　钟鸣惊梦停报单", "anchor": "我精神一振，通知报单员抛出去3000股试一下，结果很快就被吃掉", "note": "庄家以试盘探市场承接力，散户抢反弹接货，心理较量高下立判。"}, {"hui": "第三十回　哀乐忆父股海愁", "anchor": "因为我抛单的gp是1比1.5，这就充分说明别人还不愿意跟我抛空，还想赚钱", "note": "莊家與散戶比心理承受力，看誰先撐不住，砸盤正是試盤較量。"}, {"hui": "第三十四回　春野爭田悟股場", "anchor": "明天最少的跌幅也要打到15％，打乱他们的思维，下午临收盘的时候再拉", "note": "莊家以百分之十五深跌動搖對手定力，逼其先崩潰，正是心理較量。"}, {"hui": "第三十五回　卅点低开梦碎时", "anchor": "我始终没有任何表情的脸让屋子里所有的人感觉到紧张", "note": "主角面無表情，屋內眾人率先緊張，心理承受力高低立判。"}, {"hui": "第三十六回　股海翻云出货忙", "anchor": "这样的大手笔估计一般人受不了，但是由于第二次地大幅度下跌让人们做多的信心开始受损", "note": "庄家以巨幅震荡施加压力，赌散户的心理承受力先崩溃。"}, {"hui": "第四十一回　三震急抛哀乐眠", "anchor": "大体上就是把往下砸的幅度加大，砸的过程中不能有喘息的机会", "note": "不給喘息之機，正是比拚誰先崩潰的心理較量。"}, {"hui": "第四十三回　哀乐低回股海长", "anchor": "急速地下跌会让这些人在手忙脚乱的情况下产生自暴自弃的行为，因此在出货的最后阶段用这样的手段一般成功的概率都很高。", "note": "莊家以急跌擊潰高位被套者的心理防線，看誰先崩潰。"}, {"hui": "第四十五回　千点疯涨血雨腥", "anchor": "我只需要用快速的下跌就能把这些人全部给吃掉，我计算了一下幅度", "note": "庄家测算砸盘幅度，与追高盘比谁先崩溃，一击吞噬全部。"}, {"hui": "第四十六回　血雨腥风葬股魂", "anchor": "这是一场猫和老鼠的游戏，我的单子越低这些人的价位也越低，他们急切出货的心情可以想象得来，他们别无选择必须在下午收盘前全部平仓。", "note": "莊家以不漲不跌的震盪與低掛單，與散戶比拼誰先心理崩潰。"}, {"hui": "第五十一回　哀乐声中别股海", "anchor": "这样的震幅可以算是惊天动地，但是还是没有惊醒这些固执的投资人。", "note": "庄家以极端震幅考验散户心理承受力，比拼谁先崩溃。"}, {"hui": "第五十二回　海畔觀潮識盈虛", "anchor": "难得就是大家所有的思维都是在股票上，而机构操盘手的所有的思维都在人身上，他们每天都在琢磨别人在干什么，而小资金一直在琢磨股票在干什么，其实股票啥都不能干，能干的就是人。", "note": "莊家琢磨人、散戶琢磨股票，揭示博弈本質是心理承受力的較量。"}, {"hui": "第五十六回　山道夜話憶童年", "anchor": "不行，不打的话吃两块，要是打我的话就吃三块，还要加一根骨头肉。", "note": "童年的讨价还价实为心理较量雏形，双方试探底线、看谁先让步。"}, {"hui": "第五十八回　山村歸途念姐恩", "anchor": "我当时看到二姐受惊的样子心里很难过，我发誓一定要报仇，一定要对二姐好，我一直没有吭声，心里默默地在想：“我长大一定要干大事，一定不会让我的父亲和姐姐再吃苦，再受人家的欺负。", "note": "童年受欺他沉默隱忍、暗下誓言，是與命運比誰先崩潰的心理較量。"}, {"hui": "第六十回　黄浦江畔夜布局", "anchor": "人们那种不愿意认输的情绪上涨没人追下跌没有人出，这是一种典型的观望状态", "note": "全場互相觀望、無人認輸，正是比誰心理先崩潰的僵局。"}, {"hui": "第六十一回　暗燈哀樂布虛實", "anchor": "但是我们在下跌前一定要做出向上的架式，让这些人上套，这样才能顺利地实现自己的计划", "note": "下跌前擺出上攻架式騙散戶入套，比的是誰先看穿對方。"}, {"hui": "第六十四回　谣风催涨暗抛筹", "anchor": "我感觉我还是需要坚持自己的观点，应该趁这个机会大批量地卖出", "note": "主角不信大眾的亢奮，趁高開反向出貨，是一場比誰先動搖的心理較量。"}, {"hui": "第六十五回　哀乐涤心探虚实", "anchor": "人们这段时间来的恐高心理需要一次释放，也只有释放了这种情绪以后你才能改变他", "note": "主力須先擊潰散戶恐高心理方能成事，比的是誰的心理先崩潰。"}, {"hui": "第六十六回　股海沉浮一碗麵", "anchor": "对方迫不及待地想给我吃进，看来对方还是沉不住气，另外也能看出对方太着急压力太大", "note": "主角從對手急於倒貨讀出其壓力極限，庄家之間比的是誰先撐不住。"}, {"hui": "第七十回　酒醒麻局悟股机", "anchor": "由于所有的高手把精力全部用在防范对方的攻击上，结果到最后高手们都输了", "note": "麻將局即心理戰：高手互防內耗自敗，不防他人、做好自己者反勝。"}, {"hui": "第七十三回　寒夜谋破千点关", "anchor": "一定要击破这个位置，给小投资人彻底打击，迫使大部分人在1000点位置崩溃，吐出手中的筹码", "note": "莊家與散戶比心理承受力，逼對方在千點關口先崩潰。"}, {"hui": "第七十五回　静安寺前泪染襟", "anchor": "投机就是人玩人，一个心理上的较量，也是专业知识和智慧的比拼", "note": "莊家以撤單試盤、先拉後砸的節奏與散戶比拼心理承受力，看誰先崩潰。"}, {"hui": "第八十二回　自拉自唱建仓难", "anchor": "这是一种非常尴尬的局面，涨跌都不能吸引小投资人。", "note": "自拉自唱無人跟隨，莊家與散戶比耐心與承受力，看誰先崩潰。"}, {"hui": "第八十三回　温水煮蛙破僵局", "anchor": "打破常规，不涨不跌，让看涨的人担忧下跌，让看跌的人担忧上涨。", "note": "以無方向走勢與散戶比拼心理承受力，看誰先失去觀點、先崩潰。"}, {"hui": "第八十四回　静水藏锋守盘局", "anchor": "这种交易是考验双方耐性的时候，谁的耐性大谁最终取胜的概率就大。", "note": "平淡盤局中莊家與散戶比耐性，看誰先失去耐心先動手。"}, {"hui": "第八十五回　万骨功成独怅然", "anchor": "等他们杀到没有方向感的时候，你再加入猛砸股价，让他们搞不清楚到底是怎么回事", "note": "主力放任小資金自相殘殺，比誰先喪失方向感與定力。"}, {"hui": "第八十八回　拉抬打压测浮沉", "anchor": "看得出恐慌性的抛盘也不是很大。如果继续砸的话也没有多大的意义", "note": "莊家拉高砸盤反覆試探散戶承受力，誰先撐不住誰就輸。"}, {"hui": "第九十五回　惊涛股海孤舟撑", "anchor": "山子的压力太大了，他的精神已经不能承受这种高压", "note": "莊家聯盟內部同樣是心理較量，山子先崩潰使護盤計劃驟然陷入被動。"}, {"hui": "第九十六回　衡山夜酌定沉浮", "anchor": "山子继续一动不动地躺着，我坐在他对面的桌子上看报纸", "note": "装睡与等待对峙，老大以沉默消耗山子的意志，看谁先崩溃开口。"}, {"hui": "第九十七回　独斟哀乐夜未央", "anchor": "镇静和理智是给大家的一剂良药，其实我心里慌乱得不行", "note": "庄家首领强装镇定稳住军心，博弈胜负取决于谁先心理崩溃。"}, {"hui": "第九十八回　满城喊涨我独抛", "anchor": "我暗暗在想：“这帮小子也阴得很，可以说不动声色。”", "note": "山子老胡与主角各自高位出货却心照不宣，比的是谁先撑不住。"}, {"hui": "第九十九回　情义冲天收长阳", "anchor": "三线股开始走弱，股价不断地下滑，看起来人们的情绪还是不稳定", "note": "主力以砸盤試探散戶與對手的心理極限，誰先鬆手誰出局。"}, {"hui": "第一百零一回　翻云覆雨股海惊", "anchor": "“他娘的，今天就想翻身那还了得，老子还要在里面呆一阵子，岂能让你先走。”", "note": "莊家與對手比拼心理承受力，誰先崩潰誰就交出倉位。"}, {"hui": "第一百零三回　豪饮释嫌谋退兵", "anchor": "加上三线股的小机构今天被打残，估计需要一个缓冲的时间，让他们在情绪上放松一下，不然，一直绷得这样紧会让他们崩溃", "note": "莊家把對手逼到崩潰邊緣又故意鬆綁，比的是誰先撐不住。"}, {"hui": "第一百零五回　蓝筹初兴股海波", "anchor": "我看你能挺多久，有多少钱来支撑这个行情？", "note": "庄家以连续巨量抛压比拼心理承受力，谁先崩溃谁就输掉整场博弈。"}, {"hui": "第一百零六回　雪崩驚魂鎖局深", "anchor": "我耐心地等候他风头正劲的时候过去，我不相信他一直能持续到收盘。", "note": "主力尾盤對轟比定力，賭對手先崩潰，正是看誰先撐不住的心理較量。"}, {"hui": "第一百零八回　红房夜宴谋推涨", "anchor": "我忽然想到是否这小子根本就没有意识到买入的未成交单子需要撤销，否则的话自己买别人高价抛出的筹码就是做好人好事了。", "note": "庄家对庄家以砸盘试探底线，对方不撤单先崩溃，输在心理较量上。"}, {"hui": "第一百零九回　夜阑把盏话浮沉", "anchor": "搞不好我的持仓会增加到80%以上，否则，他很难顺利出逃。可是那样的话，我完全把自己放进了烤箱", "note": "庄家间比拼心理承受力，谁先撑不住谁先崩潰，主角押上全部身家。"}, {"hui": "第一百一十回　股海屠牛夜话长", "anchor": "我必须痛下杀手，不能给任何人以喘息的机会。", "note": "莊家與散戶比拼心理承受力，主角主動出擊逼對手先崩潰。"}, {"hui": "第一百一十一回　十字星照人间路", "anchor": "三线股上午暴跌彻底打残了对手的心态，上午收盘前上涨过快对方来不及反应", "note": "暴跌打殘對手心態、漲跌節奏拿捏，比的是誰先承受不住而崩潰。"}, {"hui": "第一百一十二回　夜读红楼悟机心", "anchor": "我看老胡的股票，借助股价上涨的过程抛售筹码，成交量很大，但是基本上没有什么涨幅", "note": "庄家与老胡相互试探、比谁先撑不住，注解多空博弈中先崩溃者出局的心理较量。"}, {"hui": "第一百一十三回　浴读红楼悟杀机", "anchor": "拉抬不愿意跟，砸盘不愿意出。散户的心态实际上处于一种游离状态，看多总觉得不踏实", "note": "主力拉抬無人跟、砸盤散戶不願割，雙方在僵持中比拚心理承受力，誰先崩潰誰就輸。"}, {"hui": "第一百二十一回　股海陰雲夢飛山", "anchor": "最近我情绪特别紧张，昨天去医院说是胃溃疡，主要是情绪紧张所致，可您还是这样平淡。", "note": "小張緊張致病而主角平淡如水，正是心理承受力的較量寫照。"}, {"hui": "第一百二十五回　夜释私仇心自宽", "anchor": "不管遇到什么事情，你自己想着不舒服这就对了，你要是觉得舒服了别人就受不了。", "note": "父親之言點破零和博弈：一方難受即對方舒坦，考驗彼此心理承受力。"}, {"hui": "附錄一：和職業操盤手的對話", "anchor": "当小投资人都因为股价长期下跌，对未来走势产生绝望的时候，纷纷不计成本抛售自己手头的筹码，那么庄家就会不动声色地吸筹", "note": "散戶先扛不住而崩潰拋售，莊家沉住氣悄然接籌，比的是心理承受力。"}, {"hui": "附錄二：作者手札", "anchor": "希望能为投资者建立一个科学的方法，为战胜自我，获取财富提供力所能及的帮助！", "note": "以「戰勝自我」為投資終極功課，呼應投資本質是與自己心理承受力的較量。"}, {"hui": "附錄三：《股道》前言", "anchor": "股市沧海，曾经历了老八股时代一天几十元的震荡，也经历了327国债期货的洗礼，外汇市场上经历了911美元几分钟之内暴跌千点的暴力升华", "note": "暴跌千點是心理承受力的極限考驗，作者以「淡淡走過」完成與市場的自我較量。"}], "情緒操縱": [{"hui": "序", "anchor": "他们深知恐惧对人的影响力是巨大的。所以，他们最喜欢干的就是沽空。", "note": "對沖基金利用大眾恐懼沽空獲利，注解莊家操控情緒以達成目的。"}, {"hui": "第二回　股海滄桑見浮沉", "anchor": "深圳那边开始有主力出货，抛压开始还看不出来，一阵子就不得了", "note": "主力先隱藏拋壓、再集中引爆，操控市場情緒完成出貨，散戶在恐懼中接盤。"}, {"hui": "第三回　衡山夜半叉头声", "anchor": "车子在淮海路上飞奔，夜里的淮海路显得非常安静，快到外滩的时候，我忽然又想起那个大堂经理的脸，心里又开始烦躁，我发誓这家伙今天要是再那样冲着我笑，我一定建议他明天买股票，我倒是要看看这小子还会不会这样一如既往地笑。", "note": "他把“劝人买股票”当作报复武器，欲以言语操控对方情绪，预演庄家操纵人心。"}, {"hui": "第五回　心战股海忆父恩", "anchor": "理智告诉我这时候正是人们最恐慌的时候，谁坚持到最后谁就是赢家，这是心理的较量，最后总有一些坚持不住的人，股市就是这样一个心理较量的过程。", "note": "庄家驾驭大众恐慌的情绪节奏，在恐慌高峰反手接盘完成建仓。"}, {"hui": "第六回　峰巅收缰身自轻", "anchor": "人们在节前无心恋战，而恰恰就是在这节前,股市悄悄地对这些可怜的人们进行了袭击。", "note": "莊家專挑節前人心渙散之際發動行情，操控大眾注意力以收突襲之效。"}, {"hui": "第九回　父子炉前忆股潮", "anchor": "你必须极力地作出一种向上还要涨1000点的架势，你也必须让人和人对市场的未来充满希望", "note": "莊家以誘多架勢操控大眾預期，讓希望值遠超現實，方能順利出貨。"}, {"hui": "第十二回　萬人搶籌我獨清", "anchor": "在大家极为兴奋、冲动的时候，有一个比较理智、冷静的人，在我们看不到的地方在悄悄地给大家提供入市的筹码。", "note": "莊家趁眾人興奮衝動時暗中派發籌碼，注解其操縱大眾情緒的手法。"}, {"hui": "第十四回　股海虚火K线凉", "anchor": "大资金的运作者也充分利用了人们的这种普遍的心理，发动了行情。", "note": "莊家借大眾對人代會過高的心理預期順勢發動行情，注解情緒操縱之術。"}, {"hui": "第十五回　回光返照梦难眠", "anchor": "紧接着就是一根带有长长的下影线的阴线，也伴随着萎缩的成交量，这是有人为了恢复人们的信心，消除人们心中的这种谨慎", "note": "主力藉尾市拉升與圖形語言撫慰大眾，操縱集體情緒以利自己出貨。"}, {"hui": "第十七回　夜设奇局梦白发", "anchor": "我知道不到我明天起床的时候，这个聪明的女人一定会在电视上吹嘘得没完没了，我就要的是她这样的小聪明。", "note": "庄家利用主持人的虚荣心故意泄密，让舆论自发替其冲锋造势。"}, {"hui": "第十八回　殺手整裝佈陷阱", "anchor": "最后的这种上涨就是为了刺激他们那种欲望而设的陷阱", "note": "莊家藉臨收盤拉升製造虛假希望，操控大眾貪婪情緒以利次日出貨。"}, {"hui": "第十九回　暗涌浙资夜梦惊", "anchor": "但是我也知道这种局面不会维持太久，我还需要再鼓舞一下人们的斗志，于是，我吩咐报单员：“把价格再推高15元，加大成交量。", "note": "庄家以推高價格鼓舞鬥志，操控大眾情緒以便在高位出貨。"}, {"hui": "第二十回　破千五布连环计", "anchor": "这样以来那些昨天在下跌过程中没有参与抢反弹的人，都会很着急很后悔，在开盘以后他们都会迫不及待地介入", "note": "庄家高开诱多、封死盘口，专挑散户后悔与急切心理下手，操纵情绪完成出货。"}, {"hui": "第二十一回　断珠惊魂沪上夜", "anchor": "人们看到价格上涨开始有买盘大量涌进", "note": "主力以高開與利好報道調動散戶情緒，半小時內完成誘多出貨。"}, {"hui": "第二十二回　灯红酒绿夜筹谋", "anchor": "回家睡觉吧，不要多想，照我说的去做，明天低开，15分钟以内拉起来，明天是个好日子", "note": "莊家設計低開再快速拉抬，讓老孫預言應驗，操控眾人預期以收服人心。"}, {"hui": "第二十三回　晨筹低吸午砸盘", "anchor": "这样没有命的往下跌，带来的不是机会而是恐惧，你能不能把握一下那些要被你害死的人的心理反应啊", "note": "莊家以砸盤與拉抬的節奏操控散戶的貪婪與恐懼，為派發鋪路。"}, {"hui": "第二十四回　驚魂周五急出倉", "anchor": "目前属于震仓阶段，大家要耐心、大胆，不要被震出去，你们还能想起去年12月份和今年1月份那两次震仓吗", "note": "莊家借「震倉」輿論安撫散戶情緒，令其死抱籌碼，為出貨爭取時間與空間。"}, {"hui": "第二十五回　黃昏出盡滿倉愁", "anchor": "能够利用行情的走势影响这么多人的情绪，然后通过他们情绪的变化间接地支配他们的行为", "note": "主角以拉抬指數誘多，操控大眾情緒再支配其行為，正是莊家情緒操縱的教科書示範。"}, {"hui": "第二十六回　酒酣论股测人心", "anchor": "我们是大资金，有能力控制局面，那么就应该有能力调控这些人的情绪，能够操纵投资人的情绪你就能让他干你最需要他干的事情", "note": "主角直言大資金應調控投資人情緒，驅使散戶做莊家所需之事，正是情緒操縱的赤裸自白。"}, {"hui": "第二十七回　酒吧夜話全民兵", "anchor": "全部靠分析和推测散户的心理变化，你的一举一动都会影响投资人的情绪变化", "note": "莊家以散戶心理為決策依據，一舉一動皆在操縱情緒、引導交易。"}, {"hui": "第二十八回　苦咖座中听涨声", "anchor": "我们从这儿明显地感觉到人们看多的心理非常明显，就是说昨天的努力没有白干，人们的情绪还是在一定程度上被操纵", "note": "主角親證砸盤之後眾人看多情緒仍在掌控之中，莊家操縱大眾情緒的實例。"}, {"hui": "第三十回　哀乐忆父股海愁", "anchor": "人们能够很明显地感到卖压的存在，看到这个现象我吩咐报单员：“把刚才报出去没有成交的单子全部撤掉。”", "note": "莊家以虛假賣壓操控大眾情緒，撤單製造壓力假象試探人心。"}, {"hui": "第三十二回　冬晨股海起波澜", "anchor": "我觉得没有必要开盘往下打了，应该向上涨，这样才有吸引力", "note": "先拉抬造勢吸引散戶入場，再趁人氣高漲出貨，操控大眾情緒以達目的。"}, {"hui": "第三十三回　笑看資潮逐浪高", "anchor": "只要盘中节奏把握好，价格肯定跌不下去，这些资金根本不会产生任何怀疑和担忧", "note": "莊家以節奏控盤、維持價位，讓接盤者不起疑，正是情緒操縱。"}, {"hui": "第三十五回　卅点低开梦碎时", "anchor": "我知道这样密集的大单抛售会给这个市场带来巨大地冲击，报单员在接到指令以后猛烈的抛盘就蜂拥而出", "note": "莊家以不限價密集砸盤製造恐慌氣氛，藉群體恐懼完成出貨。"}, {"hui": "第三十六回　股海翻云出货忙", "anchor": "想到这儿我吩咐报单员：“开始买进刚才抛出的股票，每分钟1000股，每次价格抬高5元，一直到收盘。", "note": "庄家以抬价拉升制造赚钱效应，操纵散户情绪诱其跟风接盘。"}, {"hui": "第三十七回　独倚阳台望寒星", "anchor": "一个原本农村的人，能够生活在城里，过着城里人也不一定都能享受到的生活，还在操纵着城里人的情绪，我好像并不自豪", "note": "莊家以籌碼與節奏操控全城散戶情緒，主角對這份「權力」既麻木又不以為傲。"}, {"hui": "第三十八回　狼来三唤人犹醉", "anchor": "我们首先不能制造恐慌气氛，一开盘低开走高，先把这些人给麻痹一下", "note": "庄家主动设计开盘节奏麻痹散户情绪，等其习惯后再发动真跌。"}, {"hui": "第三十九回　诱多砸盘路不归", "anchor": "只要能够在半小时内控制走势，用以操纵小资金持有者的情绪变化", "note": "主力先以低開誘多撫平恐慌、再砸盤製造絕望，全程掌控散戶情緒節奏。"}, {"hui": "第四十回　跌市拉红戏众生", "anchor": "我们可以用价格走势操纵这些人的思维方式，也可以操纵这些人的情绪波动进而操纵这些人的行为", "note": "莊家以價格走勢與拉抬節奏，先動搖散戶情緒，再驅動其跟風行為。"}, {"hui": "第四十二回　红盘如饵钓浮沉", "anchor": "这时候必须给所有人一种无限的希望，不然我们剩下的这点钱就准备拿出来一半吧", "note": "莊家以強力買盤製造無限希望，誘使眾人淡忘風險而追高。"}, {"hui": "第四十三回　哀乐低回股海长", "anchor": "资本运作的核心就是情绪调整，把自己的情绪调整到最佳的状态，把别人的情绪调整到最恶劣的状态。", "note": "莊家自白操盤核心即調節大眾情緒，本章直接注解情緒操縱。"}, {"hui": "第四十四回　砸破千二誘眾生", "anchor": "继续砸！加大力度，一定要让人们感到崩盘的感觉。", "note": "莊家以砸盤製造崩盤恐慌，操控大眾情緒以達成吸籌目的。"}, {"hui": "第四十五回　千点疯涨血雨腥", "anchor": "我们的价格每抬高一次就会有无数的投资人把自己低价位的单子撤掉，换一个高的价位追涨", "note": "庄家以连续抬价操纵群体情绪，诱使散户自动撤低追高。"}, {"hui": "第四十八回　静安寺前股海潮", "anchor": "因此，我如法炮制，再次吩咐报单员停止买进。价格再次开始慢慢回落", "note": "莊家以買進與停買反覆拉扯價格，直接操控散戶的情緒與預期。"}, {"hui": "第四十九回　破千四陽線如刀", "anchor": "我打算给所有人一点兴奋，争取在15分钟内迅速打破1400点。", "note": "主力以強力買盤製造興奮情緒，誘使散戶追高接盤，完成拉高出貨。"}, {"hui": "第五十回　晴日高开暗出货", "anchor": "按照昨天的走势高开是正常的，要不然人们那种狂热的情绪就不会延续到今天", "note": "庄家利用既有狂热情绪高开诱多，再撤单砸盘，全程操纵大众情绪。"}, {"hui": "第五十一回　哀乐声中别股海", "anchor": "开盘了，我吩咐报单员：“就在现在这个价格的基础上，以150元的下降幅度，30万一次，抛售。”价格再次被打下去，指数就这样在接近1400点的位置调头向下", "note": "庄家以大单砸盘制造恐慌，操控大众情绪以完成收割。"}, {"hui": "第六十回　黄浦江畔夜布局", "anchor": "这个布局和设想足以显示人类本性的残忍", "note": "莊家算計眾人的貪婪與恐懼，以佈局操控市場情緒。"}, {"hui": "第六十一回　暗燈哀樂布虛實", "anchor": "我要把他们吊起来，今天轻微的上涨，让他们把自己的期望值再提高一点，但是我绝对不会给他们机会的", "note": "莊家先吊高期望再拒絕兌現，是典型的情緒操控手法。"}, {"hui": "第六十二回　股海翻雲夜獨行", "anchor": "我们要做的就是利用股票价格变动来控制这些人的情绪，然后间接地支配他们的行为，让他们的情绪一直处于我们的控制之中", "note": "主角直言炒股本質即操控大眾情緒、支配其行為，為全章心理戰術之綱。"}, {"hui": "第六十三回　月临黄浦夜藏锋", "anchor": "高兴的心情还没有转换成冲动的时候，巨大的恐惧一定会让他们目瞪口呆，毫无思想。", "note": "莊家先衝高再猛砸，用恐懼替換貪婪，令散戶失去理智交出籌碼。"}, {"hui": "第六十六回　股海沉浮一碗麵", "anchor": "我明白了，消息就是从这儿来的，这一定是谣言了，对方迫不及待地想给我吃进", "note": "對手散布利好謠言誘他接盤，用輿論造勢操控市場情緒，是典型的誘多。"}, {"hui": "第六十七回　夜宴谋成独怅然", "anchor": "明天做一个向上的假动作，然后把你们手头的筹码做掉一半", "note": "莊家以向上假動作誘多，再借澄清消息猛砸，全程操控散戶情緒以達目的。"}, {"hui": "第六十八回　冲高回落山洪近", "anchor": "大盘低开顺势向下猛跌几十点，一阵子就被疯狂的买盘推起，打下去再拉上来，最终指数在整整一个上午做出了向上突破的架式", "note": "主力以反复打压与拉抬营造突破假象，诱使跟风盘进场，便于顺利出货。"}, {"hui": "第七十回　酒醒麻局悟股机", "anchor": "整整两天都很平静，没有任何有关发行额度减少或者增加的报道，这反而是一种好现象", "note": "莊家樂見消息真空期，散戶的主觀臆斷正是可被引導操縱的土壤。"}, {"hui": "第七十一回　鹤颈折时千点寒", "anchor": "我则躲在暗处给了他们一个虚无飘渺的幻觉。", "note": "庄家借盘面与舆论给散户制造幻觉，操控大众情绪以完成打压拉升的计划。"}, {"hui": "第七十二回　申江夜筹护千点", "anchor": "我希望明天整个市场能够有一个保卫1000点的说法", "note": "莊家炮製「保衛千點」輿論，操控散戶情緒與市場預期。"}, {"hui": "第七十三回　寒夜谋破千点关", "anchor": "我需要有人安慰这些散户，不能在我出的时候他也出", "note": "莊家以輿論安撫散戶持股信心，確保破千點後自己能從容出貨。"}, {"hui": "第七十四回　千点失守老妪惊", "anchor": "所有股票每个级差价格120元，每笔单量150万股，连续追加抛出。", "note": "莊家以連環砸盤與節奏掌控大眾情緒與行情走向。"}, {"hui": "第七十五回　静安寺前泪染襟", "anchor": "用股价操纵投资人情绪变化是一个方面，还要利用周边环境，让投资人产生你自己所需要的情绪体验", "note": "莊家以價格走勢導演恐懼與貪婪，引導散戶在不該怕時怕、不該貪時貪。"}, {"hui": "第七十六回　哀乐声中谋千点", "anchor": "这些可爱的经济学家和股评人士正好用他们善良的良心，为我当了一次非常合格的帮凶。", "note": "主角借學者與媒體之口造勢，操控大眾情緒以低價吸籌。"}, {"hui": "第七十七回　双阴如碑血未干", "anchor": "媒体的力量是巨大的，人们压抑在心底里那种渴望终于被点燃，每个人激动地做着同一件事情——买进。", "note": "主力借媒體輿論造勢點燃散戶貪婪，再拉高出貨，全程操控大眾情緒節奏。"}, {"hui": "第七十八回　谣传救市股海惊", "anchor": "我听后告诉她：“明天下午收盘之后，我想有消息在市场流传，救市政策即将公布。”", "note": "主角以救市謠言操控大眾情緒，是莊家輿論造勢的典型手法。"}, {"hui": "第八十回　夜雨江湖谋冷暖", "anchor": "晚上搞一个辟谣的信息出来，让小散户理解成利空，有利于下周建仓。", "note": "莊家以辟謠為名製造利空解讀，操控大眾情緒為建倉鋪路。"}, {"hui": "第八十一回　股评喧嚣人独醒", "anchor": "必须在媒体上大做文章，再一次给市场以恐惧，从而加大建仓力度。", "note": "庄家借媒体制造恐惧以压低股价吸筹，正是操纵大众情绪以达成目的。"}, {"hui": "第八十二回　自拉自唱建仓难", "anchor": "你让他亏钱可以，但是，你一定要让他心情舒畅才行。否则，他不陪你玩就麻烦了。", "note": "莊家把散戶情緒當作操盤資源：虧錢可以，但必須令其心情舒暢以留住對手。"}, {"hui": "第八十三回　温水煮蛙破僵局", "anchor": "今天开始，连续三天温水煮青蛙。切忌急躁！", "note": "以溫水煮青蛙式震盪操控大眾情緒，消磨耐心逼出低位籌碼。"}, {"hui": "第八十四回　静水藏锋守盘局", "anchor": "让整个市场都处于极度压抑的状态，然后向上突破才能引来更多的资金积极参与", "note": "莊家壓抑全場交易欲望，積聚能量再突破誘引資金入場。"}, {"hui": "第八十五回　万骨功成独怅然", "anchor": "你打压他建仓，你拉高他出货，你们完全成了他们的苦力", "note": "主力以打壓、拉高調控散戶情緒，使散戶淪為搬運籌碼的苦力。"}, {"hui": "第八十六回　弄堂独行闻雪崩", "anchor": "内容主要突出地量地价即可。一定要具有煽动性和诱惑性。", "note": "主角以煽動性通稿操控輿論，誘導散戶進場承接，為出貨鋪路。"}, {"hui": "第八十七回　地量收阳蓄深机", "anchor": "现在要利用建仓的最后期限，牺牲一些成本，刺激人气，为后来的出货做准备。", "note": "莊家犧牲成本拉高收盤價刺激人氣，為出貨布下誘餌。"}, {"hui": "第八十九回　孤影临江谋决战", "anchor": "到会的人选都很有影响力，而且电视台那边也已经安排好节目的时间，周一晚上证券时间播出", "note": "論壇、電視、報紙預告層層造勢，用輿論左右散戶預期以利拉抬出貨。"}, {"hui": "第九十一回　股海焚香祈出货", "anchor": "刚才还向下的股价忽然直线掉头向上，其他股票也开始向上回升，老胡和山子大概看出我的意图，也开始大量买入，指数开始急速向上，强势股票纷纷翻红。", "note": "主力先砸後拉，以價格節奏操縱全場情緒，瞬間激活追漲人氣。"}, {"hui": "第九十三回　人氣如潮人將散", "anchor": "从心理上的攻击一直到情绪上的操纵，直至在你的灵魂深处造成刻骨铭心地打击", "note": "本章自白操盤手以心理攻擊與情緒操縱打擊散戶，直至其喪失鬥志。"}, {"hui": "第九十四回　砸盘洗筹隐忧长", "anchor": "人们渐渐地在向理智回归，这不是个好事情。大家要是都理智了那就麻烦了。", "note": "莊家的命脈在於大眾情緒，理智回歸反而令其無法操縱行情。"}, {"hui": "第九十五回　惊涛股海孤舟撑", "anchor": "发一个通稿的股评文章，就说今天放量一个换手十字星，明日必定大涨", "note": "主角以股評通稿與救市傳言調控散戶預期，驅使買盤入場接貨。"}, {"hui": "第九十六回　衡山夜酌定沉浮", "anchor": "在波士顿的唐人剧院我们一起听费翔唱故乡的云的时候，我老泪纵横", "note": "老大以乡愁与患难情谊软化山子，用情感叙事逼其增仓配合。"}, {"hui": "第九十八回　满城喊涨我独抛", "anchor": "几个专家都异口同声地说：“今日必定大涨，昨日巨量庄家完成换手，今日一定会继续承接昨日走势放量大涨。”", "note": "庄家借媒体专家造势，操控散户情绪与预期，为高位出货铺路。"}, {"hui": "第九十九回　情义冲天收长阳", "anchor": "我想我应该帮助一下这位不知名的勇士，一定要鼓励这些资金大胆介入。", "note": "莊家以買單與節奏調控大眾情緒，誘使資金按計劃入場。"}, {"hui": "第一百回　冷雨操盘杀机藏", "anchor": "我和老胡开始先砸盘，紧跟着再狂拉，在我们狂拉的时候，你把你手头所有筹码，全部抛出", "note": "莊家以砸盤製造恐慌、狂拉誘多，一手掌控節奏，操縱大眾情緒達成出貨。"}, {"hui": "第一百零一回　翻云覆雨股海惊", "anchor": "报单员的指令进入场内之后，刚才还死气沉沉的大盘一下子被注入了活力，指数开始直线向上，老胡的股票涨", "note": "莊家先放任恐慌蔓延，再注入資金拉升，全程操控大眾情緒。"}, {"hui": "第一百零二回　股海危局谋砥柱", "anchor": "既要做到让眼下小投资人不看好三线股，又要培养他们继续看高热门股的未来股价。", "note": "莊家借媒體通稿雙向引導散戶情緒，使其棄三線股而捧藍籌股。"}, {"hui": "第一百零三回　豪饮释嫌谋退兵", "anchor": "我的计划就是把三线股的小机构套住，不让他离开股市，然后我们再从媒体方面鼓吹大行情的走势即将到来，稳定人心", "note": "莊家以媒體統一通稿鼓吹大行情、穩定人心，注解情緒操縱。"}, {"hui": "第一百零七回　噩梦惊魂筹大计", "anchor": "必须给市场参与各方一些希望，只有希望才能激发无穷的欲望。", "note": "莊家刻意製造希望以調動全場情緒，視欲望為可被點燃的市場燃料。"}, {"hui": "第一百零八回　红房夜宴谋推涨", "anchor": "听说23号证券法要出台。我希望利用这一点推高指数，媒体方面需要协助。", "note": "庄家借政策消息与媒体造势操控大众预期，以配合拉升出货。"}, {"hui": "第一百零九回　夜阑把盏话浮沉", "anchor": "今天的走势震荡激烈，虽然采用这种大幅度震荡的目的激发了人气，但是成本消耗实在太大。", "note": "庄家以三次大幅震荡制造火爆假象，主动操控市场情绪以激发人气。"}, {"hui": "第一百一十回　股海屠牛夜话长", "anchor": "可以想象得出市场上一片恐慌，委托窗口一定是哭爹喊娘的声音。", "note": "莊家以猛烈砸盤操控市場恐慌情緒，散戶在情緒中喪失理性。"}, {"hui": "第一百一十一回　十字星照人间路", "anchor": "不能让任何人感到这是最后的关头，只有这样大家才能够有足够平静的心态", "note": "主角壓抑真實進度、維持眾人平靜，以氛圍操控完成收官的心理戰。"}, {"hui": "第一百一十二回　夜读红楼悟机心", "anchor": "不一会儿指数开始加速下跌，其余股票也不同程度地跟随指数而下降", "note": "庄家砸盘撤单、托盘拉升，一砸一拉间操控市场情绪与跟风盘，注解情绪操弄战术。"}, {"hui": "第一百一十三回　浴读红楼悟杀机", "anchor": "还不如单边下跌，让散户心头疑云彻底消除，然后，再开始倡导急跌必有急涨的理念", "note": "主力設計單邊下跌洗清散戶疑雲，再宣揚急跌必漲誘其搶反彈，是典型的操控情緒以出貨。"}, {"hui": "第一百一十四回　砸盘惊魂洗浮筹", "anchor": "顺应投资人的心理倾向，这对于大资金地运作来说是成败的关键，利用股价变动以及媒体造势，影响小投资人的心理变化", "note": "莊家借砸盤與造勢操控散戶情緒，把心理戰術當作操盤手的核心任務。"}, {"hui": "第一百一十五回　夜宿水乡听蛙声", "anchor": "这次研讨会从明天就开始，一直持续到5月份，每天会安排专业媒体进行报道的。", "note": "借研討會與每日媒體報道持續造勢，是操控公眾預期的輿論手法。"}, {"hui": "第一百一十六回　水乡鼓乐涤尘心", "anchor": "这我已经安排小马去北京策划媒体宣传了，我们需要的声音一定会占主流地位的。", "note": "莊家以媒體造勢操控大眾情緒與預期，是典型的輿論心理戰。"}, {"hui": "第一百一十七回　阴线高悬引狂潮", "anchor": "整整20分钟按兵不动，所有的股票都在涨，就是我的不涨，这足以引起大家地注意。", "note": "莊家以不漲製造反差吸引全場目光，再用暴漲點燃狂熱，操控情緒以求出逃。"}, {"hui": "第一百一十八回　高台沽货笑泪间", "anchor": "如此低迷的行情，如此大的涨幅，出货的速度如此之快，一切全部在于心理上的一种博弈。", "note": "莊家以高位放量與輿論造勢操控大眾情緒，於低迷市中完成快速出貨。"}, {"hui": "第一百一十九回　阴线蓄势夜筹谋", "anchor": "指令进场之后，价格瞬间蹿上当日的最高点，我看了会计的统计数据：持仓50%，gp86。这样的数据结果表明人气极度旺盛", "note": "主角以大單瞬間推高價格製造人氣假象，隨即撤單，全程操控大眾情緒。"}, {"hui": "第一百二十回　雨中哀乐倒仓时", "anchor": "让那些之前没有介入而后悔的人有一次机会，对那些已经赚钱的人留下一个遗憾，让他们始终怀念没有抓住的那个高点", "note": "莊家以遺憾與後悔情緒維繫集體看多，是典型的情緒操縱手法。"}, {"hui": "第一百二十一回　股海陰雲夢飛山", "anchor": "你在出售筹码之前，一定要调动起大众的投资热情才行。", "note": "主角藉專家節目與指標走勢點燃散戶熱情，為出貨蓄勢加溫。"}, {"hui": "第一百二十二回　晴空股海千层浪", "anchor": "我对散户的了解在于他们总是喜欢一夜暴富，不想依靠稳定的方法长期获胜，你的股票要能吸引他们疯狂地追捧，那么你的走势就必须符合他们的心理需求", "note": "莊家先砸盤再拉抬，刻意以走勢撩撥散戶貪婪與恐懼，注解情緒操縱的完整鏈條。"}, {"hui": "第一百二十三回　股海狂潮夜运筹", "anchor": "这时候的股价有我们推进和没有我们推进基本上是一样的，持有股票的不愿意卖出，没有的争先恐后地要买入，股价只会越来越高，我只需要在关键的时候加以引导即可。", "note": "庄家点燃人气后撤手，只在关键处引导，让大众情绪自行推高股价。"}, {"hui": "第一百二十四回　晴日股海暗潮生", "anchor": "我疯狂抛售的时间持续了25分钟，我想把价格直接封在下面", "note": "莊家以巨量砸盤誘發恐慌與貪婪交替，在情緒起伏中完成出貨。"}, {"hui": "第一百二十六回　古镇月明别宴长", "anchor": "我必须用实际走势对大家加以引导，告诉大家利好出来是牛市。", "note": "庄家以巨量买单制造走势，反向改写大众对利好的集体解读。"}, {"hui": "第一百二十七回　哀乐声中收巨阳", "anchor": "今天一定要引导大家做多的情绪达到极端状态，只有这样才能在短时间内迅速出清手头的筹码。", "note": "主力以砸盤與急拉操控大眾情緒，讓散戶在極端多頭中替他出貨。"}, {"hui": "第一百二十八回　一夕狂澜万家泪", "anchor": "股价快速上扬，瞬间的飙升再次刺激了场内人气", "note": "莊家借跳空高開與急砸，反覆操控大眾情緒，使其在貪婪與恐慌間失去理性。"}, {"hui": "第一百二十九回　股海雪崩钟摆停", "anchor": "我们一起开始拉高股价，吸引更多的跟风盘介入，指数开始上冲，最高见到1365点附近", "note": "莊家先誘多拉升製造繁榮假象，再以級差五百元砸盤出貨，操控大眾情緒完成收割。"}, {"hui": "附錄一：和職業操盤手的對話", "anchor": "操盘手可以根据指标的走势以及交易的变化，推测散户的投资心理，然后作出适当的应对策略", "note": "莊家推測並利用散戶心理波動，反過來操控其情緒以達成吸籌出貨。"}, {"hui": "附錄二：作者手札", "anchor": "股票价格的变动是一双无形的手在操纵，如何能更深刻的了解到这一点呢？", "note": "「無形的手」暗示股價背後有人操縱大眾心理，正是情緒操縱的市場寫照。"}, {"hui": "附錄四：《股道》目錄", "anchor": "股票价格变动是受一双无形的手在操纵", "note": "以「無形的手」喻莊家操控價格與人心，注解主力藉漲跌節奏誘導散戶情緒。"}], "羊群效應（從眾）": [{"hui": "第九回　父子炉前忆股潮", "anchor": "稍微有点行情所有的股票都是鸡犬升天，哪有一只不好的？", "note": "行情一來齊漲齊跌，散戶不辨個股盲目跟風，正好被主力利用。"}, {"hui": "第十三回　跳空惊澜独醒时", "anchor": "你看看所有的技术指标没有一个是偏空的，即便是要逆转也需要一个过程", "note": "眾人一致看好、無一唱空，群體觀點趨同，清醒的主角反而成了局外人。"}, {"hui": "第十六回　密谋托市夜深沉", "anchor": "我看到下面那群所谓的有钱人，坐在那儿谈笑风生，每个人都有对股市的见解，每个人这时候都是资深的专家", "note": "集體樂觀的溫床：人人自封專家、一致看好，正是莊家趁勢收割的對象。"}, {"hui": "第十九回　暗涌浙资夜梦惊", "anchor": "投资大众还处于一种盲目的兴奋之中依然没有人跟盘卖出", "note": "買盤蜂擁、無人跟賣，大眾盲目追進盡顯從眾群體心理。"}, {"hui": "第二十三回　晨筹低吸午砸盘", "anchor": "一阵子人们好像一下子活明白了，大批量的单子开始买入，上涨的速度一下子变得很快", "note": "價格回升訊號一出，散戶不問緣由集體跟買，新客戶大半追進。"}, {"hui": "第二十八回　苦咖座中听涨声", "anchor": "有人随声附和：“就是，讲得有道理。”", "note": "老孫一言既出眾人齊聲附和，看多觀點在群體中迅速成為一致，無人唱反調。"}, {"hui": "第三十二回　冬晨股海起波澜", "anchor": "gp已经达到7，各营业部的交易都很不错，买进窗口的人们又开始排队了", "note": "見漲即排隊搶買、眾人一致看好，散戶的從眾與追漲之態躍然紙上。"}, {"hui": "第三十八回　狼来三唤人犹醉", "anchor": "多少次了都是下去马上就上来，小资金已经习惯了狼来了", "note": "散户在重复模式中形成群体性条件反射，麻木从众而不独立判断。"}, {"hui": "第三十九回　诱多砸盘路不归", "anchor": "参与交易的老账户比较多，这就说明这些在市场上生存的\"老糨糊\"也开始忽略政策风险了", "note": "連資深老手也跟風忽略政策利空，群體一致看好使警覺集體失效。"}, {"hui": "第四十八回　静安寺前股海潮", "anchor": "我看了一下gp是6，这说明这些人目前还是有点放不开，受到昨天的打击", "note": "gp跟風盤指標量化散戶從眾活躍度，據此決定拉抬與出貨的節奏。"}, {"hui": "第四十九回　破千四陽線如刀", "anchor": "疯狂的人们在抢购，我的那些兄弟已经在这一小时内，把手中的筹码毫不吝啬地全部交给了这些争先恐后的人们。", "note": "散戶見指數突破便爭先搶購，集體狂熱正好讓主力全身而退。"}, {"hui": "第五十二回　海畔觀潮識盈虛", "anchor": "那些后知后觉的小机构发现苗头不对以后，就会开始想方设法地折腾", "note": "小機構後知後覺、跟風折騰，正是從眾滯後、慢半拍的群體心理。"}, {"hui": "第五十三回　卸甲收官看众生", "anchor": "旁边很多人露出羡慕的眼光，有些人悄悄地跑到柜台排队买进去了", "note": "見人帶頭搶買便一窩蜂跟進，散戶的從眾心理在狂歡中徹底釋放。"}, {"hui": "第五十四回　口脂书血记归期", "anchor": "看着人们灿烂的笑容，我实在不愿意再看到十几分钟后这些人的表现", "note": "众人仍沉浸于集体乐观，主角却预见群体崩溃，注解股民盲目跟风的从众心理。"}, {"hui": "第六十二回　股海翻雲夜獨行", "anchor": "在他的带动下，其他股票也开始出现了抢盘的现象，他立即放慢了买进的速度和频率", "note": "單股猛漲帶動全場搶盤，莊家放手任散戶從眾接力、自相爭鬥。"}, {"hui": "第六十三回　月临黄浦夜藏锋", "anchor": "那儿有个姓杨的，看起来很有号召力，他对后市尤其看好，认为这是新一轮行情的开始，附和的人也比较多。", "note": "散戶與電視專家一致看好，姓楊者一呼百應，市場氛圍被從眾心理主導。"}, {"hui": "第六十四回　谣风催涨暗抛筹", "anchor": "这个传言在一定程度上却对投资大众是一个强心剂，加深了他们的看好的信心", "note": "眾人因同一條傳言集體轉多、一致看好，正是從眾心理下的群體一致行動。"}, {"hui": "第六十八回　冲高回落山洪近", "anchor": "我试着放了几笔单子，发现跟风的人还是有，虽然不是很多但是要是下午开盘按照这个架式再向上推动，还是能够吸引很多人的", "note": "跟风盘见强势便蜂拥追入，主力正是利用众人的从众心理完成派发。"}, {"hui": "第七十七回　双阴如碑血未干", "anchor": "走进证券营业部大厅的时候，里面热闹的场景我没有预料到，看起来人们对后面行情的希望非常大。", "note": "專家言論與大廳熱鬧氛圍互相強化，散戶集體跟風搶買，無人願獨立思考。"}, {"hui": "第七十九回　洗盘建仓雨转晴", "anchor": "整个营业部内人山人海，委托窗口排了长长的队，有两个人在吵架，围观的不多起哄的不少", "note": "人人搶排隊發財、連吵架都不肯圍觀，從眾熱情令主角改判加速建倉。"}, {"hui": "第八十回　夜雨江湖谋冷暖", "anchor": "这帮散户目前看起来做多的信心很大，稍微有点风吹草动就往里冲。跟风盘大得吓人。", "note": "散戶見漲齊衝、跟風盤驚人，正是眾人一致看好的從眾心理。"}, {"hui": "第八十一回　股评喧嚣人独醒", "anchor": "哪儿有报告会都参加，不管是谁在讲，去了能不能听出什么名堂倒是其次，主要是心理上有了一个依靠。", "note": "股民不问内容只求心理依靠、赶场跟风，从众行为清晰可辨。"}, {"hui": "第九十回　醉醒思亲对股潮", "anchor": "正好投资人人心思多，推动行情上涨应该是顺水推舟", "note": "眾人一致看多時主力順水推舟，注解散戶跟風的羊群效應。"}, {"hui": "第九十一回　股海焚香祈出货", "anchor": "当然是涨了，你没有看看大家都拍巴掌，跌了准拍巴掌啊？", "note": "散戶不看事實只看掌聲，群體情緒成為個人判斷的唯一依據。"}, {"hui": "第九十三回　人氣如潮人將散", "anchor": "委托窗口那儿排队的人几乎从另外一个大门排出去了，人和人之间几乎是互相搂抱在一起。", "note": "散戶蜂擁排隊搶進，跟風從眾，個體理性完全讓位於群體狂熱。"}, {"hui": "第九十六回　衡山夜酌定沉浮", "anchor": "你手头持有的股票和我们的都属于同一类型，对小散户的人气影响很大", "note": "庄家深知散户跟风，山子股票不动便拖垮整体人气。"}, {"hui": "第九十九回　情义冲天收长阳", "anchor": "人满为患。委托窗口根本就挤不进去，有的营业部开辟了新的委托窗口，就这样还是人挤人。", "note": "散戶見行情火爆便蜂擁跟風追漲，群體氣氛吞噬獨立判斷。"}, {"hui": "第一百回　冷雨操盘杀机藏", "anchor": "三线股很明显都是乌合之众在参与，关键的时候狼上狗不上，一遇到风吹草动就四散逃跑", "note": "三線資金如羊群般跟風狂拉，風吹草動便四散奔逃、互相踩踏。"}, {"hui": "第一百零二回　股海危局谋砥柱", "anchor": "这样只要连续说一个星期的时间，所有人都学会了什么叫蓝筹股，那些专家也很喜欢凑热闹，", "note": "持續一週的輿論灌輸令眾人齊聲認可同一敘事，個體喪失獨立判斷。"}, {"hui": "第一百零三回　豪饮释嫌谋退兵", "anchor": "散户现在的思想都基本上集中在三线股板块，因为散户最大的毛病就是喜欢捡便宜，不愿意涉足高价股票", "note": "散戶思維與小機構趨同、愛撿便宜，正是莊家可乘的從眾心理。"}, {"hui": "第一百零七回　噩梦惊魂筹大计", "anchor": "我比较惊讶今天的状态，怎么这么多人跟风？看起来人们做多的思维在压抑了2天之后被完全调动起来了。", "note": "巨單拉抬瞬間點燃壓抑兩日的做多思維，散戶見漲齊步跟風，正是典型從眾。"}, {"hui": "第一百一十二回　夜读红楼悟机心", "anchor": "看多的人还是多数，上涨时候跟风的人比较多，散户做多的积极心态仍然没有太多消失", "note": "指数一涨散户便热情跟风做多，人气不散，正是追涨从众的羊群心理。"}, {"hui": "第一百一十七回　阴线高悬引狂潮", "anchor": "连三线股都能涨起来，我的这些好股票不可能不涨，人人都会这样想的，所以，买单非常积极。", "note": "散戶認定好股票必漲而蜂擁搶籌，跟風盤反成莊家撤離的漩渦。"}, {"hui": "第一百二十一回　股海陰雲夢飛山", "anchor": "股市上人们追求的是群体安全感，而不是独立自主的见解，大家都觉得抱成团才是最安全的。", "note": "散戶抱團求安、跟風別人的看法，正是莊家最易利用的從眾心理。"}, {"hui": "第一百二十二回　晴空股海千层浪", "anchor": "卖出的挂单居然好多价位都是0，人们受到这些大师的影响，还是坚定地看好这些股票。", "note": "被砸盤仍堅定看好、賣單掛零，眾人跟風唱多，是典型從眾行為。"}, {"hui": "第一百二十六回　古镇月明别宴长", "anchor": "价位只要往下回调一下，马上就有新资金入场。", "note": "高位横盘成为共识支撑，回调即被跟风盘蜂拥抢回。"}, {"hui": "第一百二十七回　哀乐声中收巨阳", "anchor": "人们彻底被激起了买入的激情，大批量的买盘蜂拥而至，看得出透支交易的资金开始大批量入场了。", "note": "漲幅超出忍耐極限後眾人爭相追入、透支資金蜂擁，從眾效應盡顯。"}, {"hui": "第一百二十九回　股海雪崩钟摆停", "anchor": "在低迷四个交易日之后还有如此地大的跟风盘也算是非常理想了", "note": "散戶見漲便追、見跌便逃，跟風盤正是莊家最理想的接盤者。"}, {"hui": "附錄四：《股道》目錄", "anchor": "大众的思维都是错误的思维", "note": "斷言大眾思維皆錯，注解群體從眾與極化下的錯誤決策。"}], "錨定效應": [{"hui": "前言", "anchor": "如果您把眼睛总是盯在每时每刻的价格变化上，那么，您就缺少大局观，自然就会陷入价格谜局。", "note": "緊盯眼前價格即被短期數字錨定，失去大局觀而墜入價格謎局。"}, {"hui": "第四回　股海冬深忆故牛", "anchor": "从800多点一路下跌，到现在600多点，5天时间就跌成这样子", "note": "以八百點高位定錨，五日狂瀉便覺天崩地裂，整數關口放大了領導的恐懼。"}, {"hui": "第七回　除夕股海話歸程", "anchor": "我就对阿婆讲：“我能帮你，但是你必须听我的话，你现在可以买进，但是你无论如何要在正月初五开盘以后天天来看盘，价格涨到360元的时候，你必须卖掉！", "note": "360元賣點與1100點整數關口都是心理定錨，主導買賣時機與收盤預期。"}, {"hui": "第十四回　股海虚火K线凉", "anchor": "股指经过这段时间的上涨，已经达到1300点，但是人们疯狂得忘乎所以，已经忽略了这个点位", "note": "1300點整數關口本具心理定錨意義，狂熱中人卻忽略點位、預期失控。"}, {"hui": "第十五回　回光返照梦难眠", "anchor": "最高点在1320点左右最低跌倒1260多点，振幅达到60多点", "note": "千點關口與昨日高低點成為心理定錨，牽動眾人的買賣抉擇。"}, {"hui": "第三十一回　夜听人言谋退路", "anchor": "几个月的涨势让人们已经忘记股票价格还可以下跌，看着临收盘前的走势我在沉思。", "note": "數月漲勢成為心理錨點，令散戶只預期上漲而徹底遺忘下跌的可能。"}, {"hui": "第七十二回　申江夜筹护千点", "anchor": "我希望这种声音能够有分量，没有人怀疑它的真实性", "note": "千點整數關口成為市場心理定錨，主導散戶對支撐位的判斷。"}, {"hui": "第七十三回　寒夜谋破千点关", "anchor": "1000点是牛市的生命线，管理层能否出台相关的救市政策，直接关系到千千万万股民的人气", "note": "千點整數關口成為股民的心理定錨，莊家反向利用此關口佈局。"}, {"hui": "第七十六回　哀乐声中谋千点", "anchor": "几个经济学家都呼吁救市，同时也谈到了1000点的重要性", "note": "全社會把千點塑造成生死關口，散戶據此定錨預期。"}, {"hui": "第七十九回　洗盘建仓雨转晴", "anchor": "高开之后，大盘一路向上直至1000点的整数关，成交量渐渐地缩小", "note": "千點整數關是散戶的心理定錨，莊家反覆在其上下試盤，牽動多空情緒。"}, {"hui": "第八十四回　静水藏锋守盘局", "anchor": "按照目前这样的状态，1000点之下能否满足75%的仓位确实有点难度", "note": "千點整數關口成為主角操盤的心理錨點與倉位標尺。"}, {"hui": "第九十回　醉醒思亲对股潮", "anchor": "可以在上涨突破1000点的时候，大量收取获利回吐的短线筹码", "note": "1000點整數關口成為散戶的心理定錨，莊家借突破關口收取獲利回吐籌碼。"}, {"hui": "第九十二回　蛇夢縈心股海狂", "anchor": "买单撤销之后，股价带动指数开始向下回调，指数跌破1000点，一直跌到975点附近。", "note": "千點整數關口成為心理錨點，突破引來拋壓、失守又觸發承接，多空皆據此布局。"}, {"hui": "第九十八回　满城喊涨我独抛", "anchor": "指数已经连续突破1150点、1200点大关，最高直逼1300点一线的前期颈线位置。买盘蜂拥而入。", "note": "整数关口与前期颈线成为心理锚点，突破即引来追涨买盘。"}, {"hui": "第一百回　冷雨操盘杀机藏", "anchor": "1300点上下成了指数震荡的中心区域，我看着山子的股票在上涨的时候，涨幅微乎其微，但是成交巨大", "note": "整數關口1300點成為多空心理定錨，收於1268吉利數字，連數字也成暗示。"}, {"hui": "第一百零一回　翻云覆雨股海惊", "anchor": "报单员的指令进入场内之后，刚才还死气沉沉的大盘一下子被注入了活力，指数开始直线向上，老胡的股票涨幅达到60%以上，我重仓的几只股票涨幅都达到50%以上，大盘指数迅速上穿1300点，最高达到1340点，成为自从2月16日下跌以后开始反弹的最高点，市场人气鼎沸。", "note": "千點整數關口成為多空的心理錨，莊家反覆穿越以牽動預期。"}, {"hui": "第一百零四回　千金一诺转头空", "anchor": "朋友说低价股至少能涨到高价股的一半", "note": "以高价股价位为心理锚，幻想低价股必然补涨，正是心理定锚的典型表现。"}, {"hui": "第一百零七回　噩梦惊魂筹大计", "anchor": "这样不死不活地交易持续了大约5分钟的时间，指数向下面临1200点失守的境地。", "note": "千點整數關口成為多空心理定錨，主角據此設計護盤與打壓的節奏。"}, {"hui": "第一百一十一回　十字星照人间路", "anchor": "人们的思维还没有从刚才那个高价当中走出来，继续怀念那个高价位曾经给自己带来的利益", "note": "散戶對高價位的眷戀成心理錨點，主力據此斷定拋壓稀少、區域安全。"}, {"hui": "第一百一十六回　水乡鼓乐涤尘心", "anchor": "指数一直维持在1200点之上，到今天17号了，指数连最高点1400点都没有碰到", "note": "千點整數關口成為多空心理錨點，主力藉高位橫盤掩護出逃。"}, {"hui": "第一百一十八回　高台沽货笑泪间", "anchor": "让那些进来赚到钱的人舍不得卖出，因为，最高价对他来说是永远的希望。谁也不愿意失去曾经到手的金钱。", "note": "散戶錨定於曾經的最高價，遲遲不肯賣出，正好成為莊家出貨的對手盤。"}, {"hui": "第一百一十九回　阴线蓄势夜筹谋", "anchor": "再高的价格也没有出现过，所以，大多数投资人对未来容易感到迷茫和担忧。", "note": "以歷史最高價為心理錨點，價越攀高越生厭惡恐高，散戶定錨舊位而不敢追新。"}, {"hui": "第一百二十四回　晴日股海暗潮生", "anchor": "曾经到过100块钱的股票，现在只有60元，散户至少在26天之内不会卖出的。", "note": "散戶死守百元歷史價位，主力順勢鎖價，錨定心理反成出貨工具。"}, {"hui": "第一百二十七回　哀乐声中收巨阳", "anchor": "价格一直在横盘，指数维持在1320点附近震荡，看起来观望的情绪还是比较浓厚", "note": "1320、1300等整數點位成為散戶買賣的心理定錨，主力刻意在關口試探誘導。"}, {"hui": "第一百三十回　泪别沪上熊途遥", "anchor": "4日之前的1391.42点，成为未来股市漫漫熊途遥不可及的制高点！", "note": "制高點成為熊市中難以逾越的心理錨點，反覆映照今昔落差。"}, {"hui": "附錄三：《股道》前言", "anchor": "我想没有任何企业有银行那么安全了，所有银行股都是我关注的对象", "note": "以「銀行股最安全」為心理定錨，據此構建整個投資體系與操作紀律。"}], "損失厭惡（割肉）": [{"hui": "第七回　除夕股海話歸程", "anchor": "赔钱就像割肉一样的感觉，那就是撕心裂肺的感觉。", "note": "以「割肉」喻賠錢之痛，注解損失的痛苦遠大於獲利快樂的集體創傷。"}, {"hui": "第八回　雪夜归乡思股海", "anchor": "一旦放弃了到手的利润，那种感觉是别人体会不到的，这可能就是人的本性", "note": "放棄已到手利潤的痛楚難以承受，正是損失厭惡在操盤者身上的赤裸展現。"}, {"hui": "第三十五回　卅点低开梦碎时", "anchor": "人们这时候的感觉一定是悔恨或者愤怒，人们愤怒庄家的残酷和悔恨自己没有在适当的时候卖出", "note": "浮盈瞬間歸零，賠錢的劇痛化作悔恨與憤怒，折磨眾人精神。"}, {"hui": "第五十六回　山道夜話憶童年", "anchor": "万一打怎么办？这可是值钱的东西，肯定会打的。", "note": "怕挨打的痛苦预期超过修钟责任，恐惧驱动两人互相推诿。"}, {"hui": "第五十七回　别却青苗入市寒", "anchor": "老师，你救救我，我倾家荡产没有关系，但是有些钱我亏不起啊！", "note": "虧損者寧可傾家蕩產也不肯虧欠他人之錢，賠錢的痛苦被放大到極致。"}, {"hui": "第六十回　黄浦江畔夜布局", "anchor": "那些相对而言还是具有实力的资金不愿意认输出场", "note": "有實力的資金也不願認輸割肉，印證賠錢之痛令人死扛。"}, {"hui": "第七十三回　寒夜谋破千点关", "anchor": "从盈利变为亏损心理上的落差短时间内很难适应，不卖出并不是因为看好后市的发展", "note": "散戶寧願套牢也不願承認虧損，正是損失厭惡的典型表現。"}, {"hui": "第九十四回　砸盘洗筹隐忧长", "anchor": "手里有股票的人大都还没有解套，早些时候割肉走了的人目前不敢进，市场处于一个矛盾的时候。", "note": "割肉者因痛苦記憶而不敢再入場，貪婪與恐懼並存形成市場矛盾。"}, {"hui": "第九十六回　衡山夜酌定沉浮", "anchor": "他现在不但脱离了危险还获得了利润，所以，要放弃这种已经得到的利益那是非常困难的", "note": "山子已获利在手，放弃既得利益的痛苦令其抗拒增仓托市。"}, {"hui": "第一百一十回　股海屠牛夜话长", "anchor": "内心一直被失败感和账面亏损30%所折磨，心里很苦。", "note": "瞿小姐被帳面虧損折磨卻遲遲不敢果斷止損，正是損失厭惡的寫照。"}, {"hui": "附錄三：《股道》前言", "anchor": "何谓安全赚钱？把资金放到最安全的地方，选几只基本面优良、具有长期持有价值的股票。", "note": "資金只放最安全處、寧可少賺，反映對虧損的強烈規避勝過對利潤的追逐。"}], "處置效應": [{"hui": "第六十一回　暗燈哀樂布虛實", "anchor": "他们都是想着担心，但是又舍不得走，就是想着再涨一下就走人", "note": "散戶被套後捨不得割肉、總想再漲就走，正是處置效應的寫照。"}, {"hui": "第一百零六回　雪崩驚魂鎖局深", "anchor": "这傻瓜真是个生瓜蛋子，缺乏突发事件的应变能力。", "note": "危急時刻死扛不割、與散戶無異，正是處置效應不願賣虧損股的寫照。"}], "沉沒成本": [{"hui": "第一回　夢繞股海冬夜長", "anchor": "两年了，介入了一个不认识的新行当，干到现在也变得枯燥无味", "note": "入行兩年已成沉沒成本，明知枯燥無味仍無法放手離場。"}, {"hui": "第五十八回　山村歸途念姐恩", "anchor": "姐姐随着年龄的增长对我的思念也越强", "note": "姐姐把一生心血投注於弟弟身上，付出愈多愈放不下，猶如無法割捨的沉沒成本。"}, {"hui": "第一百零九回　夜阑把盏话浮沉", "anchor": "目前过度持仓是最大的麻烦，大幅度亏损和这个有很大的关系。", "note": "瞿小姐多单深亏仍不愿砍仓，被已投入的仓位困住，正是沉沒成本作祟。"}, {"hui": "第一百三十回　泪别沪上熊途遥", "anchor": "把我酒店里所有东西送给酒店门迎老头，他不要的就扔掉", "note": "主角捨棄上海一切舊物，主動斬斷無法挽回的沉沒成本，決絕離場。"}], "專家崇拜／過度自信": [{"hui": "第二十四回　驚魂周五急出倉", "anchor": "看到那群可怜的人们把那个家伙当神一样围住，而那个家伙也高高在上得为大家盲目地解答，我心里骂到", "note": "散戶在行情看不懂時迷信評論員權威、放棄獨立判斷，正是專家崇拜的典型寫照。"}, {"hui": "第二十六回　酒酣论股测人心", "anchor": "投资者对我们只有神秘，对那些人却是崇敬", "note": "散戶不懂莊家卻對滿口術語的專家頂禮膜拜，注解了迷信專家的群體心理。"}, {"hui": "第二十八回　苦咖座中听涨声", "anchor": "老孙在大家心中的影响力也很大。", "note": "眾人因老孫一次暴富便奉其為高人，盲目信從其看多分析，喪失獨立判斷。"}, {"hui": "第三十一回　夜听人言谋退路", "anchor": "谢谢你X先生，你确实是一个大好人啊，能把自己的研究结果毫无保留地告诉我们，我们这些小户怎么感谢你啊！", "note": "專家一句「中繼缺口」便贏得掌聲與老漢起身道謝，散戶迷信權威研究。"}, {"hui": "第三十四回　春野爭田悟股場", "anchor": "因为他们都是在实业界摸爬滚打出来的，每个人都有自己的观点和对事物的看法，对股市的无知让他们显得非常自负", "note": "實業資金憑實業經驗自負輕敵，因對股市無知而過度自信。"}, {"hui": "第五十七回　别却青苗入市寒", "anchor": "小张显得很为难，但是还是走过去跟那些人说了半天，忽然有一个胖乎乎的男人，冲过来扑通一下跪在我面前哭道：“老师，你救救我，我倾家荡产没有关系，但是有些钱我亏不起啊！", "note": "虧損散戶把翻本希望寄託於「老師」，迷信高手能救命卻不問虧損本源。"}, {"hui": "第六十三回　月临黄浦夜藏锋", "anchor": "他们连这些最基本的游戏规则都不知道，但是你听他们谈论股票的时候俨然是一个从事证券投资一百年的老者。", "note": "散戶連基本規則都不懂卻儼然百年老手，正是過度自信的典型寫照。"}, {"hui": "第六十九回　股海孤眠听妄言", "anchor": "不管是所谓的专家还是所谓的民间股神，怎么就不动动脑子想想，大盘要不要创出新高是你们几个人能说了算的？", "note": "專家與民間股神對一無所知的行情指手畫腳，正是過度自信害人害己的寫照。"}, {"hui": "第七十一回　鹤颈折时千点寒", "anchor": "这家营业部聘请了据说是来自深圳的专家在分析股市，作午间指导。", "note": "散户迷信深圳专家的高抛低吸而掌声雷动，正是迷信权威与盲从的写照。"}, {"hui": "第七十二回　申江夜筹护千点", "anchor": "股评人士的车轱辘话几百年如一日花样都不变一个", "note": "散戶迷信股評權威，而莊家早已看穿其套話糊弄的本質。"}, {"hui": "第八十一回　股评喧嚣人独醒", "anchor": "他传授给我一个机构专门用的特殊指标，特别准确，庄家的买卖你一看就知道。", "note": "散户把操盘手内幕与庄家专用指标奉为圭臬，盲目迷信专家，正是专家崇拜的典型写照。"}, {"hui": "第八十七回　地量收阳蓄深机", "anchor": "之后又有一位著名的专家，就有关地量地价的问题作了详细地分析，并给出属于自己的看法", "note": "散戶迷信專家解釋漲跌，恰被莊家輿論造勢利用。"}, {"hui": "第八十八回　拉抬打压测浮沉", "anchor": "虽然对投资的专业知识一无所知，这并不影响她说股票的激情，更不影响其他人对她的膜拜。", "note": "散戶迷信權威轉述與內幕消息，不核實便盲從膜拜。"}, {"hui": "第一百零二回　股海危局谋砥柱", "anchor": "那些专家也很喜欢凑热闹，会及时抓住一些新鲜的名词乱叫的。", "note": "專家追新名詞放大輿論，散戶迷信權威，判斷完全外包。"}, {"hui": "第一百一十八回　高台沽货笑泪间", "anchor": "每一个股评都在信誓旦旦地向大家保证，今天走势最为凶猛的几只股票都是他之前推荐的。", "note": "股評爭相攬功，散戶迷信權威說辭，成了莊家輿論造勢的免費工具。"}, {"hui": "第一百二十四回　晴日股海暗潮生", "anchor": "在这个普遍缺乏专业知识的新兴领域，能说到他这个份上，也应该算是专家了。", "note": "空話連篇的胖子被群眾奉為專家，專業稀缺之處崇拜愈盛。"}, {"hui": "附錄二：作者手札", "anchor": "作为投资人，首先必须有足够的自信，相信自己能够在股市上获取财富，只是目前还没有找到正确的方法而已。", "note": "作者把自信置於投資首位，反映股市中信念先於方法、過度自信的普遍心態。"}], "認知失調／合理化": [{"hui": "序", "anchor": "善言的则是为了推脱责任，用语言抚平亏损所带来心灵创伤。", "note": "虧損散戶滔滔不絕談股，正是用語言合理化虧損、推脫責任。"}, {"hui": "第十回　煤油燈下話滄桑", "anchor": "我说：“也算不上是骗人，这在国外也有这样的做法，有些国家专门成立了这样的单位，就是利用这些单位的资金实力，控制股票价格走势", "note": "主角以国外先例与风险自担为由，为操纵市场的行为自我开脱。"}, {"hui": "第十一回　村口别父赴股海", "anchor": "我想即使我没有干到目前的工作，那么至少也是一个游走四方，闯天下的打工仔。", "note": "把離鄉開脫為「反正也要闖天下」的必然，是對痛苦抉擇的自我合理化。"}, {"hui": "第十九回　暗涌浙资夜梦惊", "anchor": "别人给你的劳务费，也是应该的收入，你替别人分析股票，安排资金进出，这是你业余的劳动所得", "note": "庄家把受賄美化成勞務所得，以自我合理化扭曲現實。"}, {"hui": "第二十五回　黃昏出盡滿倉愁", "anchor": "我心里这时候忽然产生一个恶毒的念头，要是负数的话对这些家伙肯定是一个很大的打击，想到这儿我浑身一颤", "note": "惡念與「一條繩上的螞蚱」的自辯交戰，主角以利益綁定合理化內心的道德不安。"}, {"hui": "第二十八回　苦咖座中听涨声", "anchor": "人们学习这些模型的时候并不是想让这些模型指导自己的资金运作，而是为了行情走势以及自己的买卖行为寻找一种理由而已", "note": "散戶學技術模型只為給自己的買賣找理由，先有結論再找證據自我說服。"}, {"hui": "第四十回　跌市拉红戏众生", "anchor": "我终于为自己自责不安找到了一种合理解释，就是这样合理的解释让我感觉不到我有什么过错。", "note": "主角以「位置不同」的哲言為自己的罪疚開脫，完成自我合理化。"}, {"hui": "第四十七回　哀曲繞梁夜謀深", "anchor": "其实我们谁也没有有意识地要把别人怎么样，我们只是在工作，为工作而努力", "note": "把害人悲劇說成「只是工作」，用合理化卸下道德重負。"}, {"hui": "第五十四回　口脂书血记归期", "anchor": "他说：“当然啊，干啥没有一点门道，不然你怎么混啊？”", "note": "主角以各行各业皆有骗术合理化股市骗局，为自己身陷其中寻找开脱。"}, {"hui": "第五十五回　独饮还乡步夜山", "anchor": "你不认字啊？那都是我写的字，你不认识吗？！出去，出去！", "note": "把酒後失態的滿牆亂寫解釋為「練習書法」，用合理化維護自我形象。"}, {"hui": "第五十六回　山道夜話憶童年", "anchor": "没有挨打只能吃两块肉，不行，太便宜这小子了，我得想点办法。", "note": "老三把骗肉吃合理化为对方占便宜，用自欺压下愧疚。"}, {"hui": "第五十九回　村口望断慈父影", "anchor": "我恨我自己，我真的恨我自己，那时候为什么要干什么狗屁的事业，父亲辛苦抚养我长大不知道为什么？", "note": "既投身事業又覺虧欠父親，主角貶斥事業以緩解矛盾，是典型的自我調和。"}, {"hui": "第六十八回　冲高回落山洪近", "anchor": "他会安慰自己现在失去100元，明天一定会有1000元进账的，就这样人们慢慢地习惯了、麻痹了", "note": "亏钱后用预期收益自我安慰，将损失合理化，在自欺欺人中渐渐麻木。"}, {"hui": "第六十九回　股海孤眠听妄言", "anchor": "不认识自己是投资大众在这个市场招致挫折最主要的因素，不关心自己的操作是否接近市场的实际走势，反而对市场价格走势指点江山", "note": "投資大眾不認識自己卻對行情指點江山，用幻想合理化判斷，是認知失調的典型。"}, {"hui": "第七十回　酒醒麻局悟股机", "anchor": "小投资人在消息面真空的情况下，往往会尊重自己的主观意愿，自以为是地认为自己的选择是正确的。", "note": "消息真空下散戶自以為選擇正確，用主觀意願合理化自己的無知與盲從。"}, {"hui": "第八十七回　地量收阳蓄深机", "anchor": "投资人输得越多越能对股市说得头头是道，但是，就是做不好股票", "note": "輸家以滔滔說辭合理化虧損，離真金白銀越來越遠。"}, {"hui": "第九十九回　情义冲天收长阳", "anchor": "所有的不安和内疚都随指数的上涨而烟消云散。", "note": "山子以指數上漲為自己的違規加倉開脫，用結果合理化衝動。"}, {"hui": "第一百零四回　千金一诺转头空", "anchor": "看在咱们都是朋友的份上，除过那30万块钱给你们大家之外，我私人在私下给黄先生5万块钱，就算朋友一场", "note": "张先生用小恩小惠包装赖账食言，以「朋友情分」为背信自我开脱。"}, {"hui": "第一百一十三回　浴读红楼悟杀机", "anchor": "就是因为王熙凤对所有的对手痛下杀手，才能游刃有余，至于后来的结局谁能逃脱一死？", "note": "主角以「人終歸一死」合理化殺伐決斷，用重讀《紅樓夢》為自己的冷酷賦予正當性。"}, {"hui": "第一百一十六回　水乡鼓乐涤尘心", "anchor": "他们永远都不会明白的，因为，他们一直以为自己是一个战士，在疆场上驰骋。", "note": "散戶以戰士幻想合理化虧損處境，拒絕承認自己其實是獵物。"}, {"hui": "第一百二十五回　夜释私仇心自宽", "anchor": "非常奇怪，当我决定放弃惩罚对手的时候，我的心情忽然非常轻松愉快，原来所有的怨气和不满都烟消云散了。", "note": "以與人為善、對方終將傾家蕩產之說自我開解，消解怨氣換來平靜。"}, {"hui": "第一百二十六回　古镇月明别宴长", "anchor": "我就感觉这古镇一定是个风水宝地。", "note": "把操盘顺利归因于风水，回避对自身判断与运气的审视。"}, {"hui": "附錄三：《股道》前言", "anchor": "我是一个懒人，以至于当年我年迈的老父亲总是常常担忧地看着我说：\"娃呀，你不勤快怎办啊，以后有什么事情能让你躺着干一辈子的？\"", "note": "把懶惰合理化為入市的正當因緣，用「能躺著幹一輩子」消解父親的擔憂。"}], "賭徒謬誤": [{"hui": "第二十回　破千五布连环计", "anchor": "我知道很多人都有那种急跌抢反弹的意识，因此价格的急跌反而是一件好事情", "note": "散户认定急跌必反弹而抢进，庄家正好借这种赌徒心理放量出货。"}, {"hui": "第二十一回　断珠惊魂沪上夜", "anchor": "照今天的这种跌幅和成交量，明天开盘一定会大幅度反弹的", "note": "老孫以「跌久必漲」斷言反彈，正是賭徒謬誤的典型心態。"}, {"hui": "第二十二回　灯红酒绿夜筹谋", "anchor": "照今天的这种跌幅和成交量，明天开盘一定会大幅度反弹的，我们可以大胆地跟进", "note": "老孫以今日跌幅斷言明日必反彈，正是跌久必漲的賭徒謬誤，反被莊家設局利用。"}, {"hui": "第四十回　跌市拉红戏众生", "anchor": "哪儿有这样的下跌啊，急跌就是抢反弹最好的时候。", "note": "老大爺堅信急跌必反彈，正是「跌久必漲」的典型誤判。"}, {"hui": "第四十二回　红盘如饵钓浮沉", "anchor": "就像一个赌徒试图通过最后的一击挽救自己倾家荡产的败局", "note": "虧損失衡的散戶執著於最後一擊翻本，越賠越不肯收手。"}, {"hui": "第五十一回　哀乐声中别股海", "anchor": "可以放心大胆地买进的，你看看这一闹都多少次了，有什么好怕的，前几次你看看人家胆子大的都赚钱了", "note": "散户以为震荡多次后必然再涨，大胆买进正是赌徒谬误。"}, {"hui": "第六十七回　夜宴谋成独怅然", "anchor": "刺激人们的赌徒心理滋生，他们一定会在强烈的翻本心态支配下追涨", "note": "莊家預期散戶在翻本心態下追漲，誤以為跌久必漲，賭徒謬誤正是其突破口。"}], "信息瀑布（謠言市）": [{"hui": "序", "anchor": "他已经知道股市生存的法则和真谛了，所有的一切总结起来就是一句话：讲故事。", "note": "股市由故事與消息驅動，注解信息瀑布與預期自我實現。"}, {"hui": "前言", "anchor": "市场有许多虚假的信息和谣言，无时无刻不在影响着我们的投资决策。", "note": "前言直指謠言左右散戶決策，主張只信官方信息以截斷信息瀑布。"}, {"hui": "第七回　除夕股海話歸程", "anchor": "我是不小心说漏了嘴，她们才跟进的，不是有意识的。", "note": "助手無意洩露的消息讓親友跟進，注解消息傳播引發的從眾入市。"}, {"hui": "第十三回　跳空惊澜独醒时", "anchor": "这就是人们对这种预期达成共识，价格就会向人们预期的方向走去。", "note": "新股與降稅傳言經預期自我實現，價格隨集體預期而行，正是謠言市特徵。"}, {"hui": "第十五回　回光返照梦难眠", "anchor": "看到电视或者听到电台对今天走势的添油加醋地描述和分析", "note": "媒體添油加醋的報導擴散訊息，集體放大踏空者的悔恨情緒。"}, {"hui": "第十六回　密谋托市夜深沉", "anchor": "找一些专家开始评论，然后有意识地放一些风声出去，我们这边在行情上配合一下", "note": "輿論造勢：專家背書加風聲放出，使市場預期沿著莊家設計的方向自我實現。"}, {"hui": "第十七回　夜设奇局梦白发", "anchor": "我更知道小张这家伙肯定会通知那些大户的，我的一举一动都是可以卖钱的", "note": "建仓消息沿人脉逐级扩散，大户跟风买入，预期自我实现。"}, {"hui": "第二十三回　晨筹低吸午砸盘", "anchor": "对方答应一旦股市今天真的上涨，给小伙子20万元当回报", "note": "莊家預先散布利多，行情上漲令消息自我實現，消息即成賺錢工具。"}, {"hui": "第三十一回　夜听人言谋退路", "anchor": "有人说：“现在绝对是一个小小的回调，不会是下跌的，你看看前几天的缺口说明什么？", "note": "看多言論在集散地經掌聲互相強化，預期自我實現，散戶集體喪失獨立判斷。"}, {"hui": "第六十四回　谣风催涨暗抛筹", "anchor": "传言新股发行额度有可能下降。这个消息跟我原来的思路有点不配合，但是还是没有经过证实", "note": "一條未經證實的傳言便牽動全場情緒，
