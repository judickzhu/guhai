外，與樸實老農的相處是他少有的輕鬆時光——暫時逃離城市與股市的人情冷暖，在單純的勞動中尋找精神寄託。"}, {"q": "主角有哪些冒險嗜好？這與他的職業心理有何關聯？", "a": "他喜歡駕駛三菱吉普，還能將太子摩托開到200邁玩命、就地360度打轉；反覆以生死邊緣的刺激麻痺自己，正是長期操盤壓力與內心空虛的一種宣洩出口。"}, {"q": "本章結尾，主角遭遇了什麼意外？", "a": "歸途在蘇州河邊新疆餐館吃油潑面、與老闆喝了一瓶白酒，暈暈乎乎上車後便不行了，半路停車打電話叫司機來，說「我跟人撞了」。"}], "quotes": ["一根红红的阳线，这对人们来说就意味着金钱和财富，很多小资金对股市寄的希望实在太大", "我为人们的单纯而伤感，善良的人们其实没有伤害谁，但是他们却总是在这个市场上遭受到一次次地打击。", "我知道这将使一大批人的终身所得化为乌有", "我开始无意识地对着镜子看我自己，我总是对我善良的面孔产生怀疑", "还在操纵着城里人的情绪，我好像并不自豪。"], "psych": [{"p": "情緒操縱", "a": "一个原本农村的人，能够生活在城里，过着城里人也不一定都能享受到的生活，还在操纵着城里人的情绪，我好像并不自豪", "n": "莊家以籌碼與節奏操控全城散戶情緒，主角對這份「權力」既麻木又不以為傲。"}, {"p": "攀比與暴富敘事", "a": "孩子的上学、家里的家用电器、老婆身上的衣服，光棍的媳妇，女孩子的嫁妆和化妆品等等，人们居然把这个市场当成了满足所有希望的地方", "n": "散戶把學費、嫁妝等人生願望盡數押注股市，暴富幻想驅使新資金蜂擁入市。"}, {"p": "道德衝突／罪疚感", "a": "我知道这将使一大批人的终身所得化为乌有，看着电视上呼呼闪闪的画面，我不想知道上面在演什么，我陷入深深地自责当中", "n": "莊家明知出貨將毀人積蓄，卻不願看電視畫面，良心在逃避與自責間備受煎熬。"}, {"p": "孤獨與異化", "a": "我喜欢在夜里坐在阳台上看星星，我童年怎么就没有一点关于星星的想象？", "n": "職業投資人獨坐陽台望星、生日無人知曉，成功與罪疚並存，人在股市中日益疏離。"}]}, {"i": 38, "title": "第三十八回　狼来三唤人犹醉", "kind": "hui", "summary": ["星期天腰酸背痛醒来，惊觉已失农民本色，主角自感蜕变，为不能再干活而伤心。", "新股额度200亿第三次公告，光大山已跌逾三成，主角预感这次大跌将令所有参与者刻骨铭心。", "庄家定下低开走高再抢抛的策略，利用散户习惯「狼来了」的群体性麻痹，抢先出逃。", "散户无完整思路，恐慌时多少钱都敢卖、贪时多少钱都敢买，每次下跌都有人盲目抄底。", "大战前夕主角安然入眠，职业投资人已将博弈化为日常，孤独与异化尽在无声处。"], "qa": [{"q": "主角为何断定这次下跌会「刻骨铭心」？", "a": "他凭感觉认为下跌不会在短期内结束，幅度必令所有参与者刻骨铭心：短时间暴涨虽令市值翻番，散户却几乎没赚到钱，小资金的未来将被彻底改写。"}, {"q": "主角为抢在散户之前出逃，设计了什么开盘策略？", "a": "一开盘就拼命抛售、不给散户机会，并采用低开走高手法先麻痹散户，利用其「狼来了」的惯性，等他们反应过来真正的狼来了时已来不及。"}, {"q": "为什么说散户「多少钱都敢卖出，多少钱都敢买入」？", "a": "因为他们没有完整思路，也没有良好的交易环境：急了便不计成本恐慌抛售，贪婪时又不顾风险追买，恐惧与贪婪交替支配着群体的每一次动作。"}, {"q": "小资金为何会「习惯了狼来了」？", "a": "因多次下跌都是下去马上就上来，散户在重复模式中形成条件反射，群体性认定每次跌后都会回升，从而麻木于风险，从众而不作独立判断。"}, {"q": "每次下跌都有人进场抄底，反映了什么心理？", "a": "散户把下跌当作捡便宜的机会，抱持「跌久必涨、急跌必反弹」的赌徒式预期，在群体抄底的气氛中失去理性，主力正是看穿这点才敢放手做空。"}, {"q": "主角为何因不能干农活而伤心？", "a": "他感到自己已经蜕变、失去了农民的本色，不能再干活——长期职业投资使他的双手与土地、劳动相疏离，身份认同的失落带来深深的孤独与异化感。"}, {"q": "主角为何把抢先撤离自嘲为「劫富济贫」？", "a": "这是认知失调下的自我合理化：把高位出逃、抢先抛售坑害散户的行为美化为正义之举，借此消解内心的道德压力，让计划在自我叙事中变得心安理得。"}, {"q": "老胡为何盛赞「老大的决策英明」？", "a": "团队将此前顺利出逃归功于主角的英明决策，把运气与顺势而为的收益都记在自己的账上，正是自我服务偏差中吹嘘式的归因——胜券仿佛早已在握。"}, {"q": "1300点关口对这批资金意味着什么？", "a": "他们的仓位基本都在1300点以上，光大山股票已跌去三成多——千点整数关口是市场公认的心理支撑位，也是他们衡量撤退时机的心理标尺。"}, {"q": "电视播报了什么消息？主角作何反应？", "a": "播音员宣布最新新股发行额度为200亿，这是第三次公告。主角心想「完了」，仿佛看到股市的人一个接一个倒下，同时为自己的先见庆幸、佩服自己的计划。"}], "quotes": ["完了，我仿佛看到股市上的人一个接一个地倒下，我同时为自己的行为庆幸，我很佩服我的计划。", "这些小资金急了多少钱都敢卖出，跟他们多少钱都敢买入是一样的胆大，他们没有完整的思路，也没有良好的交易环境", "多少次了都是下去马上就上来，小资金已经习惯了狼来了，这样等他们反应过来真正的狼来了的时候就来不及了。", "目前仍然处于下跌途中，但是每次的下跌这些股票都会有人进来抄底的", "我感到自己有点蜕变，已经失去了农民的本色，不能干活了，我很伤心。"], "psych": [{"p": "情緒操縱", "a": "我们首先不能制造恐慌气氛，一开盘低开走高，先把这些人给麻痹一下", "n": "庄家主动设计开盘节奏麻痹散户情绪，等其习惯后再发动真跌。"}, {"p": "羊群效應（從眾）", "a": "多少次了都是下去马上就上来，小资金已经习惯了狼来了", "n": "散户在重复模式中形成群体性条件反射，麻木从众而不独立判断。"}, {"p": "恐慌性拋售（恐懼）", "a": "这些小资金急了多少钱都敢卖出，跟他们多少钱都敢买入是一样的胆大", "n": "散户在恐惧与贪婪两极摆动，恐慌时不计成本割肉抛售。"}, {"p": "孤獨與異化", "a": "我感到自己有点蜕变，已经失去了农民的本色，不能干活了，我很伤心", "n": "职业投资生涯使主角与劳动世界疏离，身份失落带来内在异化。"}]}, {"i": 39, "title": "第三十九回　诱多砸盘路不归", "kind": "hui", "summary": ["主角宿醉未醒仍硬撐起床，手頭十五億籌碼須三天出清七億，開盤前的博弈已然展開。", "散戶屢見大盤死而復生，習慣跌不下去的思維，主力正利用這份慣性步步佈局。", "放棄開盤猛拋，改用低開誘多，半小時拉上1500點，讓散戶先忘卻政策利空。", "交易數據顯示老帳戶居多，連老糨糊也忽略政策風險，群體在習慣與貪婪中喪失警覺。", "收盤前連環砸盤配合禁撤單，令散戶坐以待斃；主角聽見報單聲竟生心理刺激，自我日益異化。"], "qa": [{"q": "主角為何放棄「開盤就猛烈拋售」的計劃，改採何種心理戰術？", "a": "他判斷開盤猛拋成交有限反會引起散戶警覺，改為低開後快速拉高，先讓散戶短時間忘卻政策利空；只要半小時內控制走勢，操縱小資金持有者的情緒，接下來幾天便成他進出天堂。"}, {"q": "主角為何認定散戶不會因政策利空而恐懼？", "a": "大盤已好幾次死而復生，散戶習慣了大盤跌不下去的思維；他自認能清醒意識恐懼，也是出於自己要出貨的緣故，並非來自小資金的威脅，這正是群體慣性思維的可乘之隙。"}, {"q": "「半小時內控制走勢」的目標是什麼？", "a": "用以操縱小資金持有者的情緒變化，令接下來的幾天都成為他進進出出的天堂，讓所有人的思維都按他設計的模式去思考，如此便已成功三分之二。"}, {"q": "從券商送來的交易數據中，主角發現了什麼群體心理現象？", "a": "參與交易的老帳戶較多，說明在市場上生存已久的「老糨糊」也開始忽略政策風險；連資深散戶都被習慣思維與貪婪支配，集體喪失警覺，正是主力可以利用的破綻。"}, {"q": "主力為何要在上午收盤前把價格快速打下去？", "a": "若跌得太慢，散戶會在喪失信心時撤單或出貨；只有快速打破其心理預期，他們才會坐以待斃、繼續死等，最終在更低價位割肉，慘痛損失皆來自盲目等待。"}, {"q": "為什麼追高買進的散戶無法撤單逃脫？", "a": "最近幾個月行情好、大家爭著買進賣出，各營業部幾乎都規定不允許客戶撤單，買進賣出報單皆不易；這種權利被剝奪，使散戶失去了挽救錯誤的機會。"}, {"q": "價格猛烈下跌時，主角彷彿看到了什麼景象？內心有何反應？", "a": "他彷彿看到人們絕望地一個個倒下去，男人流露無助目光、老人顫巍巍盯盤、女人眼裡盡是悔恨，剛掛進單子者百感交集；他深切感到小資金的可憐，靈魂深受刺激。"}, {"q": "報單員的聲音對主角意味著什麼？", "a": "那是「動聽而冷酷」的聲音，他每次聽到都像在接受一種心理、情感的刺激；殘酷的操盤已內化為他感官上的快感，職業投資人的孤獨與異化在這一刻表露無遺。"}, {"q": "主角拋下違章司機自行離開的舉動有何心理意涵？", "a": "他冷冰冰責備司機「有警察你不信」，留其與警察交涉，自己改搭計程車；冷酷對待身邊人，映照出他對散戶同樣缺乏共情，異化早已從最親近的人開始。"}, {"q": "為何說散戶的損失「來自盲目地等待」？", "a": "價格跌破心理預期時他們不肯斬倉，只會繼續死等，等到實在等不下去才賣，此時價位已非原價；損失厭惡與沉沒成本令虧損越拖越大，最終無法挽回。"}], "quotes": ["已经好几次了，大盘都是死而复生，他们已经习惯了大盘跌不下去的思维。", "只要能够在半小时内控制走势，用以操纵小资金持有者的情绪变化，那么接下来的几天都将会成为你进进出出的天堂，人们的所有思维都会按照你设计的模式去思考，这样就已经成功了2/3。", "要是价格在短时间内打破这些人的心理预期，他们就会坐以待毙，不会想到斩仓出局的，他们会继续死等，一定会在实在等不下去的情况下卖掉，但是这个时候已经不是这个价格了，他们惨痛的损失就是来自盲目地等待。", "我再次听到报单员那种动听而冷酷的声音，我每次听到这样的声音的时候简直是在接受一种刺激，一种心理、情感地刺激。", "我深切地感到这些小资金的可怜，一个小小的营业部就能剥夺他们的权利，也就是这种剥夺可能让他们失去了挽救错误的机会。"], "psych": [{"p": "情緒操縱", "a": "只要能够在半小时内控制走势，用以操纵小资金持有者的情绪变化", "n": "主力先以低開誘多撫平恐慌、再砸盤製造絕望，全程掌控散戶情緒節奏。"}, {"p": "心理支撐位", "a": "开盘也就是半小时的时间，价格在低开近50点的基础上迅速冲上1500点", "n": "快速拉回1500點整數關口，令散戶深信跌不下去，心理支撐淪為誘多道具。"}, {"p": "羊群效應（從眾）", "a": "参与交易的老账户比较多，这就说明这些在市场上生存的\"老糨糊\"也开始忽略政策风险了", "n": "連資深老手也跟風忽略政策利空，群體一致看好使警覺集體失效。"}, {"p": "孤獨與異化", "a": "我每次听到这样的声音的时候简直是在接受一种刺激，一种心理、情感地刺激", "n": "主角對殘酷操盤生出心理快感，與散戶痛苦隔絕，職業投資人日益異化。"}]}, {"i": 40, "title": "第四十回　跌市拉红戏众生", "kind": "hui", "summary": ["莊家以價格走勢同時操縱散戶思維與情緒，被操縱者在劇痛中竟無痛苦之感。", "營業部散戶群體齊聲吹噓遠見，老大爺傲慢斷言急跌必反彈，羊群心態一覽無遺。", "主角在眾聲喧嘩中愈顯孤獨異化，以「位置不同」的哲言為自己的罪疚找到合理化開脫。", "下午試盤、加碼拉抬、兄弟配合收口，步步驗證散戶追漲貪婪，做短線的願望何等迫切。", "章末自嘲「人在死亡時看到更美麗的世界」，暗喻操縱者眼中的眾生早已被貪婪蒙蔽而不自知。"], "qa": [{"q": "莊家操縱散戶的完整心理機制是什麼？", "a": "主角明言可用價格走勢操縱散戶的思維方式與情緒波動，進而操縱其行為；被操縱者因站的位置不同，看不到危險，幾乎沒有痛苦。"}, {"q": "老大爺「急跌就是搶反彈最好的時候」的說法，暴露了什麼群體心理？", "a": "他傲慢地以老股民自居，堅信下午一定會被拉起來，把急跌視為撿錢良機，是典型的賭徒謬誤，也顯示散戶群體在狂熱中集體看多、不辨風險。"}, {"q": "主角聽到散戶們吹噓「明天至少20%收益」時，為何幾乎不相信自己的耳朵？", "a": "散戶面對逼近最低點的暴跌，卻個個洋洋得意吹噓自己有遠見，絲毫不覺災難將至；群體性的盲目樂觀與現實的巨大反差，令主角難以置信。"}, {"q": "「一旦他們被操縱的時候，幾乎沒有什麼痛苦」這句話的心理學含義是什麼？", "a": "散戶把莊家的操縱當成希望、把危險當成機會；正因認知被引導、情緒被操控，他們在被收割時仍感到滿足與自信，痛苦被徹底遮蔽。"}, {"q": "主角用哲人「位置不同，結論不同」的話為自己開脫，體現了什麼心理？", "a": "這是典型的認知失調與合理化：主角為自己的操縱行為與自責不安尋找合理解釋，用理論說服自己「沒有什麼過錯」，從而卸下道德重擔。"}, {"q": "下午成交漸稀時，主角為何下令停止賣出、改以小單試盤？", "a": "成交縮小表示散戶已開始思考，再跌恐生變；先以每分鐘1000股小量試盤探測跟風力度，若跟風合理就拉紅，為反手再往下鋪路——這是典型的試盤節奏戰術。"}, {"q": "主角從「每分鐘1000股」加碼到「每分鐘3000股」拉抬，驗證了散戶什麼心理？", "a": "15分鐘後跟風盤踴躍、gp約6，說明散戶思維與老大爺一樣仍看多；加價拉抬後gp迅速達12，短線客蜂擁，驗證了散戶追漲的貪婪願望何等迫切。"}, {"q": "主角見gp升至12反而「一腔的惆悵」，並聯想到死者的笑容，有何深意？", "a": "惆悵源於散戶做短線的願望如此迫切、如此容易被誘惑；他聯想人在死亡時因看到更美麗的世界而滿足，暗喻被操縱者沉溺於漲勢幻象而不自知。"}, {"q": "章末「上漲還是能夠令人興奮，畢竟上漲就賺錢啊」反映了散戶什麼心理？", "a": "這句自嘲點明散戶只認漲跌、不辨真假，把「上漲」本身當成信仰與快樂的來源；即使是被莊家拉起的假象，只要在漲，眾人便甘願入場。"}, {"q": "收盤前主角為何承認自己的情緒「已經不屬於理智思維」？", "a": "他先前受假設影響判斷，見價格近最低收盤、gp仍在5以上，自覺情緒已被帶動。此細節說明操縱者亦是人，同樣難逃情緒波動與自我懷疑的影響。"}], "quotes": ["人站的位置不一样，观察事物的角度不一样，那么得出的结论就不一样。", "一旦他们被操纵的时候，几乎没有什么痛苦。", "我这才知道人在死亡的时候为什么脸上充满满足的笑容，因为他们在那个时候看到了一个更加美丽的世界。", "哪儿有这样的下跌啊，急跌就是抢反弹最好的时候。", "上涨还是能够令人兴奋，毕竟上涨就赚钱啊！"], "psych": [{"p": "情緒操縱", "a": "我们可以用价格走势操纵这些人的思维方式，也可以操纵这些人的情绪波动进而操纵这些人的行为", "n": "莊家以價格走勢與拉抬節奏，先動搖散戶情緒，再驅動其跟風行為。"}, {"p": "追漲（貪婪）", "a": "一会儿gp就达到了12，人们做短线的这种愿望原来这样的迫切", "n": "價格一抬跟風盤便蜂擁而至，短線貪婪被莊家精準點燃。"}, {"p": "賭徒謬誤", "a": "哪儿有这样的下跌啊，急跌就是抢反弹最好的时候。", "n": "老大爺堅信急跌必反彈，正是「跌久必漲」的典型誤判。"}, {"p": "認知失調／合理化", "a": "我终于为自己自责不安找到了一种合理解释，就是这样合理的解释让我感觉不到我有什么过错。", "n": "主角以「位置不同」的哲言為自己的罪疚開脫，完成自我合理化。"}]}, {"i": 41, "title": "第四十一回　三震急抛哀乐眠", "kind": "hui", "summary": ["莊家先以猛烈上漲近乎創全天高點誘多，再壓低三十元狂拋，追高散戶盡數被套。", "一日三次上下震盪、震幅相加超過兩百點，主力以節奏與試盤折磨市場神經。", "收盤前回升價格以防散戶絕望，莊家精準操控大眾情緒，為明日出貨留下活口。", "老胡那邊反增倉百分之五，出貨計劃被迫延長，主力加大砸盤、不給喘息之機。", "酒桌玩笑因他素無笑容而被當真，夜裏孤身聽哀樂入眠，主角在博弈中徹底異化。"], "qa": [{"q": "莊家在這次拋售中先後用了哪些心理戰術？", "a": "先藉猛烈上漲近乎創出全天高點來誘多，再以每分鐘一萬股、壓低三十元的密度砸盤，讓追高者盡數被套；收盤前又回升價格安撫情緒，為明日繼續出貨鋪路。"}, {"q": "追高進場的散戶表現出什麼樣的心理？", "a": "他們見價格上漲便蜂擁跟進，是典型的追漲心理；價格掉頭後不到五分鐘賣單湧出，只能眼睜睜看著自己被套、欲哭無淚，從極樂世界跌入萬劫不復的地獄。"}, {"q": "為什麼臨近收盤主角要停止拋售、讓價格回升？", "a": "他不能讓人們產生絕望，必須給明天的走勢做點準備；這是對大眾情緒的精準操控，留一線希望才有人繼續接盤，正是心理支撐位的運用。"}, {"q": "「砸的過程中不能有喘息機會」體現了什麼心理戰？", "a": "這是典型的心理較量：把往下砸的幅度加大、過程不給喘息之機，就是要讓對手在持續壓力下先崩潰、先交出籌碼，比拼的是誰的心理承受力更強。"}, {"q": "主角說「面對的是明天而不是過去」反映了什麼心理機制？", "a": "一旦有了對策便很快從不快的氣氛中走出來、不陷入無休止的自責，用面向未來來合理化過去的失誤，這是莊家避免被情緒拖垮的自我調節。"}, {"q": "主角為什麼只有聽哀樂才能入眠？", "a": "哀樂是他唯一的音樂磁帶，只有在這種音樂的陶冶下才能入睡、才能每天保持清醒頭腦；長年操控市場，使他與常人情感疏離，只能在哀樂中尋求安寧。"}, {"q": "老胡來電說他們的持倉發生什麼變化？出貨計劃如何調整？", "a": "一天折騰下來他們那邊持倉不減反增，比以前增倉差不多5%；數字尚可接受，但原計劃出不來貨，於是改為老胡等人只負責出貨、主角加大砸盤力度。"}, {"q": "當天大盤的震盪與成交情況如何？", "a": "價格上下折騰了三次，大盤指數下跌幾乎接近100點，三次上下震幅相加絕對超過200點，全天成交超過10億資金，讓人體會到什麼叫大幅震盪。"}, {"q": "眾人和老胡為何把主角的伴郎玩笑信以為真？", "a": "因為主角總是沒有笑容，說的話大家都認為是真的，也認定他會堅持家鄉風俗；長期的冷漠形象使玩笑喪失辨識度，老胡寧可另找他人做伴郎。"}, {"q": "聽到老胡增倉的消息，主角的心理經歷了什麼變化？", "a": "他本以為照此速度兩天內能全部出貨、今天結果很理想，一聽對方增倉5%便罵出「他媽的」，先喜後怒，瞬間認清出貨遠沒有想像中順利。"}], "quotes": ["这种不计成本地下跌，让那些原来成竹在胸的投资人一下子就从一个极乐世界进入一个万劫不复的地狱。", "在这个市场没有人会给你更多的解释，亏损或者盈利，高兴或者痛苦也只有你自己慢慢地去品尝。", "我不能让人们产生绝望，必须给明天的走势做点准备。", "我们这些人最大的优点就是，一旦有了对策就会很快从那种不快乐的气氛当中走出来，不会把自己陷入那种无休止地自责当中去。", "我只有在这种音乐的陶冶下才能入睡，才能每天保持清醒的头脑。"], "psych": [{"p": "追漲（貪婪）", "a": "刚才在价格上涨的时候跟进的那些人眼睁睁地看着自己被套，欲哭无泪", "n": "散戶因貪婪追高入場，正中莊家誘多後砸盤的圈套。"}, {"p": "恐慌性拋售（恐懼）", "a": "这种不计成本地下跌，让那些原来成竹在胸的投资人一下子就从一个极乐世界进入一个万劫不复的地狱", "n": "莊家刻意製造不計成本的暴跌，讓散戶在恐懼中從極樂墜入地獄。"}, {"p": "心理較量（看誰先崩潰）", "a": "大体上就是把往下砸的幅度加大，砸的过程中不能有喘息的机会", "n": "不給喘息之機，正是比拚誰先崩潰的心理較量。"}, {"p": "孤獨與異化", "a": "我只有在这种音乐的陶冶下才能入睡，才能每天保持清醒的头脑", "n": "操盤者唯有借哀樂入眠，職業生涯已使其與常人情感疏離。"}]}, {"i": 42, "title": "第四十二回　红盘如饵钓浮沉", "kind": "hui", "summary": ["主角將股市視為一場豪賭，對手是除己以外的所有人，把全部生命交給市場，孤獨而異化。", "低開試盤引爆新股民恐慌性拋售，無維護的股票如多米諾骨牌連跌，羊群恐懼迅速蔓延。", "莊家強力拉抬製造無限希望，操控大眾情緒，令眾人淡忘昨日巨震而貪婪追入。", "主角以gp=8為買進意願峰值閘門，翻紅即全力拋售，順勢利用散戶失衡的短線心態。", "翻紅後突以每分鐘五萬股狂拋套人，主角自認近於失去人性，在殘酷中完成脫身。"], "qa": [{"q": "莊家開盤用了什麼心理戰術，讓散戶主動交出籌碼？", "a": "主角吩咐把所有股票低開十五元、每隻報出五千股試盤，製造恐慌性拋售，讓心理承受力差的新股民像兔子般逃離，繼而低吸建倉，屬典型的砸盤試盤與情緒操縱。"}, {"q": "為什麼新股民「多高的價格都敢追進」？反映什麼心理？", "a": "新股民膽小卻貪婪，初入市有盈利便對買入沒有概念，上漲時失去理性錨點，只敢追高不敢承接，體現追漲的貪婪心理與缺乏風險意識。"}, {"q": "主角為何斷言「至少有98％的短線客都是虧錢的」？", "a": "因為虧損使他們心理失衡，卻仍在每次震盪時參與，像賭徒企圖最後一擊翻本，體現沉沒成本與賭徒謬誤：越賠越不肯離場。"}, {"q": "「gp在8時正是人們買進意願最強的時候」，主角如何運用這一心理？", "a": "他把gp=8視為散戶買進意願的心理峰值：超過則有人獲利、難再推動，故以此為出貨閘門，翻紅且gp超過8便全力以赴拋售，絲毫不猶豫。"}, {"q": "主角「不怕輸錢，卻輸不起人」的心理根源是什麼？", "a": "錢不是他的，故無損失厭惡；但他把全部生命押注市場，恐懼市場消失後無處安身，反映職業投資人與市場融為一體的孤獨與異化。"}, {"q": "老胡擔心計劃被識破，主角為何不以為然？", "a": "因為散戶「還沒有下跌的概念」，只盤算能做多少次短線、多賺多少錢，陷入貪婪的自我合理化中，無法辨識昨日與今日同一走勢的陷阱。"}, {"q": "主角拉抬時要求「必須給所有人一種無限的希望」，是什麼心理操作？", "a": "這是典型的情緒操縱：以強力買盤製造繁榮假象與無限希望，誘導羊群跟風追入，讓交易熱情淹沒理性，為自己高位出貨鋪路。"}, {"q": "翻紅後「第一筆單子低掛20元」有什麼心理用意？", "a": "以低掛單造成價格快速下墜的視覺衝擊，讓來不及撤單者全盤套住，利用人類反應遲鈍與恐慌本能，實現出其不意的脫身計劃。"}, {"q": "主角為何自認這一天「接近失去起碼人性」，卻又為此自豪？", "a": "他以四成振幅碾壓散戶籌碼，清醒意識到自己的殘酷，卻又因無人能料其手法的出奇制勝而自豪，反映自我服務偏差與道德衝突的雙重心理。"}, {"q": "「人為什麼活著活著就死掉了」的感嘆與炒股有何關聯？", "a": "主角明知前方是死亡仍奮力前行，如同明知市場殘酷仍全身投入，折射死亡焦慮下以賭博式生存麻醉自我、在名利場中尋求存在感的心理。"}], "quotes": ["我不怕输钱，因为这钱不是我的，但是我输不起的是人。", "稍微有风吹草动就像兔子一样迅速消失，但是一旦上涨他们也很容易再次杀入。", "我几乎把自己生命的全部交给了这个市场，我总是担心一旦有一天这个市场忽然不存在了，我该怎么办？", "就像一个赌徒试图通过最后的一击挽救自己倾家荡产的败局。", "没有人会用自己的金钱在这个名利场上援助任何人。"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "我不认为这是一时的失误而是一种恐慌的表示，紧接着有好几只股票大同小异地这样交易", "n": "低開試盤點燃新股民集體恐慌，價格如多米諾骨牌般連環崩落。"}, {"p": "情緒操縱", "a": "这时候必须给所有人一种无限的希望，不然我们剩下的这点钱就准备拿出来一半吧", "n": "莊家以強力買盤製造無限希望，誘使眾人淡忘風險而追高。"}, {"p": "賭徒謬誤", "a": "就像一个赌徒试图通过最后的一击挽救自己倾家荡产的败局", "n": "虧損失衡的散戶執著於最後一擊翻本，越賠越不肯收手。"}, {"p": "孤獨與異化", "a": "我几乎把自己生命的全部交给了这个市场，我总是担心一旦有一天这个市场忽然不存在了", "n": "主角把生命押給市場，自認接近失去人性，與自身愈發疏離。"}]}, {"i": 43, "title": "第四十三回　哀乐低回股海长", "kind": "hui", "summary": ["午間走訪數家證券營業部，感知散戶的不安與煩躁；午後改以吃進股票安撫，以免過度摧殘令跟風者流失。", "價格回升至開盤位附近即反手賣出，以一分鐘三萬股的密度小範圍震盪，了結當日被動籌碼並超計畫減倉。", "自認資本運作核心是情緒調整：以酒與咖啡將自身情緒調至最佳，把別人的情緒調整到最惡劣的狀態。", "夜聽哀樂感悟生死無常，珍惜自己生命卻摧毀他人生命；每每全身而退便陷入深深自責，懺悔無人可訴。", "預判明日將是摧殘人性的暴風雨，冷笑1450點上方揚言戰勝莊家的大資金——戰勝是為強者準備的。"], "qa": [{"q": "主力上午拋售摧殘散戶，午後為何又改為吃進股票、給以安慰？", "a": "因為一味摧殘折磨會讓跟風者流失，必須同時給予愛護與安慰，這樣他們才能始終如一地跟著主力前仆後繼，繼續充當接盤者。"}, {"q": "「資本運作的核心就是情緒調整」具體指什麼？", "a": "即把自己的情緒調整到最佳的狀態，把別人的情緒調整到最惡劣的狀態；如此自己活得很好，被調整的人則活得非常痛苦。"}, {"q": "主力在出貨最後階段為何採用急速下跌的手法？", "a": "高位被套者在下跌初期都不願出貨，因前面三番五次震盪都突破了高點；急速下跌令其手忙腳亂、自暴自棄，此時出貨成功率很高，比的是誰先心理崩潰。"}, {"q": "主角用哀樂調整情緒，從中流露出怎樣的生死感悟？", "a": "他從哀樂如泣如訴中感受生命的可貴、學會珍惜生命，卻在珍惜自己生命的同時摧毀別人的生命，感受生活美好時葬送別人生活的美好，隱含死亡焦慮與罪疚。"}, {"q": "每次「全身而退」主角都陷入深深自責，反映了他怎樣的內心衝突？", "a": "那些把全部希望寄託股市的老頭老太、有志青年、家庭主婦都是最艱難的人群，卻被他一次次毀滅夢想與希望；冷酷操盤與良心懺悔交織，是莊家的道德拷問。"}, {"q": "文中說「這個階段是最殘忍的」，指的是什麼？為何比出貨更殘忍？", "a": "指大資金再次介入時對股價的刻意打壓。出貨只是保護自己，刻意打壓則完全是為了徹底摧毀別人，故比出貨行為本身更為殘忍。"}, {"q": "午後價格回升時，主角為何不能像上午那樣大幅度拉抬震盪？", "a": "大幅度拉抬容易把自己套住，當天拉盤買回的股票若當天不能處理掉便是麻煩；前幾天他們就因沒能了結被動買進籌碼而被迫重新計畫。"}, {"q": "主角夜裡不想出去、最怕為行情發展設計圈套的聚會，說明了什麼？", "a": "操作即將結束他已無所期待，更厭惡為行情設圈套的行為；內心的懺悔無人可訴，只能獨處聽哀樂，體現職業投資人的孤獨與疏離。"}, {"q": "面對1450點之上那些大資金，主角為何露出冷冷的微笑？", "a": "那些資金曾口出狂言要戰勝股市莊家；在主角看來「戰勝」包含實力、背景、計謀與對市場的認識，是強者的專利，故冷笑其自不量力。"}, {"q": "主角如何預判明日走勢？依據是什麼？", "a": "他依據今日走勢與交易狀態分析，預判明日將是暴風雨：今天給人留點希望，明天則是對人性的摧殘；今日六十多點震幅已如生離死別，明日跌幅更大，令人痛苦不可自拔。"}], "quotes": ["资本运作的核心就是情绪调整，把自己的情绪调整到最佳的状态，把别人的情绪调整到最恶劣的状态。", "摧残和折磨的同时也必须爱护和安慰，这样他们才能始终如一地跟着我们前仆后继。", "那些高位被套的人这时候在下跌的初期都不愿意出货，因为前面三番五次的震荡都突破了高点", "我在珍惜自己生命的同时却在摧毁别人的生命，我在感受生活的美好时候却在葬送别人生活的美好。", "战胜是为强者准备的。"], "psych": [{"p": "情緒操縱", "a": "资本运作的核心就是情绪调整，把自己的情绪调整到最佳的状态，把别人的情绪调整到最恶劣的状态。", "n": "莊家自白操盤核心即調節大眾情緒，本章直接注解情緒操縱。"}, {"p": "心理較量（看誰先崩潰）", "a": "急速地下跌会让这些人在手忙脚乱的情况下产生自暴自弃的行为，因此在出货的最后阶段用这样的手段一般成功的概率都很高。", "n": "莊家以急跌擊潰高位被套者的心理防線，看誰先崩潰。"}, {"p": "道德衝突／罪疚感", "a": "也正是我一次次毁灭了他们的所有梦想和希望，我忏悔。", "n": "主角全身而退即陷深深自責，注解莊家的良心拷問。"}, {"p": "孤獨與異化", "a": "我不能向任何人去诉说我的感受。", "n": "懺悔與痛苦只能深埋心底，體現職業投資人的疏離。"}]}, {"i": 44, "title": "第四十四回　砸破千二誘眾生", "kind": "hui", "summary": ["主角自認善良卻在股市暴露殘忍本性，職業操盤手一步步異化，連自己都不認識自己。", "開盤前令全線低開十五元、每分鐘萬股不限價拋售，蓄意半小時內砸破千二點心理關口。", "跌破千二後見老手已停手，主角改拋為買、每次抬價三十元，翻手誘多反手吸籌。", "他深知散戶健忘：暴跌之痛必被暴富美夢沖散，十分鐘後眾人又會不顧一切搶進。", "老胡質疑其殘忍，主角以「血淋淋的屠殺場」自辯，靠他人鮮血療傷的市場邏輯盡顯。"], "qa": [{"q": "莊家為何要刻意培養那些自命不凡的短線高手？", "a": "讓他們沉浸蠅頭小利的喜悅與自負之中——只有散戶自負、衝動，主力才能如魚得水；若眾人冷靜平淡地看待價格波動，所有手段都會失效。這正是對散戶貪婪與過度自信的操控。"}, {"q": "主角為何斷言十分鐘後散戶會不顧一切搶進？", "a": "他深知群體心理的健忘性：剛剛經過的傷痛會被對未來美好的夢想沖擊得一乾二淨，價格一漲眾人便忘卻風險搶進，恐懼與貪婪在群體中循環往復，使恐慌性拋售與追漲交替上演。"}, {"q": "開盤前主角給報單員下了什麼指令？", "a": "所有股票低開15元、每隻掛單1萬股；開盤後不限價格，以每分鐘1萬股密度拋售。他估算30分鐘之內必破1200點，可利用眾人驚慌失措達到自己的目的。"}, {"q": "主角為何要讓投資人在心理上始終處於「比較成功的狀態」？", "a": "他不能讓投資人對股市失去信心和夢想——許多人只重過程不重結果，沉迷短期暴富夢想，恰恰是這夢想令自己失去理智；主力唯有維繫其虛幻自信，才能時時操縱其決策。"}, {"q": "指數跌破1200點後，主角從報表中看出什麼並如何調整？", "a": "報表顯示gp已至9、最高時20，說明有經驗的投資者已停止出貨；他判斷不能執意而為，遂吩咐停止拋售改為買進，每次抬價30元、以5萬股單量吸納，與同伙節奏配合。"}, {"q": "小資金在暴跌中表現出什麼群體心理？", "a": "高價股以數十元幅度跳水，小資金「瘋狂地不計價格地拋售」，這是典型的恐慌性拋售——眾人爭相奪路而逃，拋售本身又加劇跌勢，形成自我強化的恐慌螺旋。"}, {"q": "老胡與主角的對話折射出莊家怎樣的心理衝突？", "a": "老胡質疑「會把那些人坑死」，主角以「我不屠殺別人別人就要屠殺我」自辯——道德罪疚感被叢林邏輯壓制，良知與生存的拉扯正是莊家內在的博弈。"}, {"q": "主角調查幾個營業部的交易情況後看到了什麼？他作何反應？", "a": "半小時後資料顯示，那些老江湖們都開始瘋狂搶進，把即將面臨的死亡當成美好的開始；主角冷冷一笑，說明他精心布置的誘多陷阱已然奏效。"}, {"q": "主角的心理狀態如何被股市改變？", "a": "他一直認為自己是善良的人，卻在股市的殘忍中「連自己都不認識自己」，明知行動將帶來滅頂之災仍不改決策——職業化生存令其良知麻木，完成了自我的異化。"}, {"q": "主角如何運用1200點這一心理關口？", "a": "他精算拋售密度，斷言30分鐘內必破1200點，深知整數關口在散戶心中的心理支撐意義——擊破它即擊垮眾人信心，待其絕望後再反手買進，正是心理支撐位的典型運用。"}], "quotes": ["人性的残忍在股市上体现得淋漓尽致，我一直认为我是一个善良的人，但是在股市上的残忍连我自己都不认识自己了。", "这个市场本身就是血淋淋的，总是需要有人用别人的鲜血为自己疗伤。", "也只有培养这些人的这种自负的性格，我们才能如鱼得水，不然等他们都很冷静平淡地对待价格波动的话，所有的手段都会失效", "继续砸！加大力度，一定要让人们感到崩盘的感觉。", "那些老江湖们都开始疯狂地抢进，他们把即将面临的死亡当成一次美好的开始。"], "psych": [{"p": "情緒操縱", "a": "继续砸！加大力度，一定要让人们感到崩盘的感觉。", "n": "莊家以砸盤製造崩盤恐慌，操控大眾情緒以達成吸籌目的。"}, {"p": "恐慌性拋售（恐懼）", "a": "那些高价位的股票价格开始以几十元的价格在下跌，有限制的交易技术让那些小资金疯狂地不计价格地抛售自己的股票。", "n": "暴跌中小資金不計成本奪路而逃，正是群體恐慌的寫照。"}, {"p": "心理支撐位", "a": "我大概计算了一下，这样地抛售30分钟之内一定会打破1200点的。", "n": "千二整數關口是散戶的心理支撐，擊破即擊潰眾人信心。"}, {"p": "孤獨與異化", "a": "我一直认为我是一个善良的人，但是在股市上的残忍连我自己都不认识自己了。", "n": "職業操盤手在血腥博弈中與善良自我漸行漸遠，完成異化。"}]}, {"i": 45, "title": "第四十五回　千点疯涨血雨腥", "kind": "hui", "summary": ["大盘自1200点疯涨，追高者蜂拥，庄家以抬价诱多蓄势待砸。", "庄家信奉原始资本积累血淋淋，冷眼操弄散户贪婪与券商融资透支。", "操盘手封闭思维、拒听建言，把所有人当作看不出规律的博弈對手。", "收市後庄家深陷压抑與靈魂拷問，不敢面對散戶狂喜，孤獨異化。", "因憂心報單姑娘背負道德重債，莊家暴怒拳打經理，以透支罪相脅。"], "qa": [{"q": "大盘从多少点开始大幅上涨？上涨速度为何比下跌时更快？", "a": "从1200点开始。因为只有上涨人们才能意识到是机会：赚钱者谆谆教导迟钝者，迟钝者疯狂买进追高，所以涨速远快于跌速。"}, {"q": "会计提醒价格已40多、悬空单将有6倍，操盘手为何不许她发言？", "a": "他奉行封闭的思维方式，为的是让所有人看不出他的规律；任何影响思维的言论都可能泄露操盘节奏，故会计被他一瞪便赶快闭嘴离去。"}, {"q": "庄家一次次抬高价格、诱使散户撤低单追高，属于何种心理战术？", "a": "这是典型的诱多與情緒操縱：每抬一次价，无数投资人便撤掉低价单换高价追涨，庄家以价格节奏操纵群体贪婪，为砸盘囤积猎物。"}, {"q": "券商给追高的客户融资透支，对投资人意味着什么？", "a": "挂单不成交没钱也能交易，无形中加剧了投资人死亡的机会，白痴的券商也因此陷入困境，成为一个迟早要暴露的隐患。"}, {"q": "股票每分钟到58、客户四倍资金交易时，操盘手若猛然下砸会怎样？", "a": "若猛然往下砸，一定会送走将近一半的人和三分之一的券商营业部，可见追高盘已狂热到一触即溃、赌徒式加杠杆的地步。"}, {"q": "上午收市后操盘手为何不敢去证券公司、不想吃饭说话？", "a": "他害怕看到人们兴高采烈大谈自己多勇敢、赚了多少，这些景象他熟悉得不能再熟悉；巨大的压抑感令他不想吃饭说话，只能独坐办公室。"}, {"q": "报单小姑娘为何闷闷不乐？操盘手说她背负了什么？", "a": "她预感下跌将至：券商总是出卖消息给大户，间接害了一大批人，操盘手也利用了他们的无知；她将背负一辈子不能偿还的感情债，永远接受灵魂的拷问。"}, {"q": "庄家为何突然暴怒，一拳打向后勤经理？", "a": "狂怒源于想到小姑娘会因下跌背负一生的感情债、灵魂永受拷问，经理职业化的笑与话恰如火上浇油，他一拳打得对方鼻血喷溅后平静喊「滚」。"}, {"q": "后勤经理挨打后为何乖乖洗净血迹、买水果赔罪？", "a": "他看清方向、绝不敢作对：光透支客户资金一条就足以让他住进提篮桥监狱，恐惧驱使他服软，操盘手也佩服他识时务。"}, {"q": "人们「大谈自己多么勇敢、追进股票有多少利益」反映什么群体心理？", "a": "幸存者偏差與過度自信：只炫耀赢家多勇敢，看不见将被砸盘吞没的大多数；追高者把行情运气当作自己的本事，正是崩盘前最危险的群体狂热。"}], "quotes": ["原始资本的积累都是血淋淋的，这是马克思说的。", "那些进得早赚钱的人这时候正在谆谆教导那些比较迟钝的人，那些迟钝的人正在疯狂地买进，价格不断地追高挂单。", "我封闭的思维方式是为了让所有人看不出我的规律。", "这种行为无形中加剧了投资人死亡的机会，这些白痴的券商也因此会陷入困境，这是一个隐患，一个要迟早暴露的隐患。", "我很害怕看到那些人们在兴高采烈地大谈他是多么的勇敢，追进的股票已经有多少利益，这些现象我早已经熟悉得不能再熟悉了。"], "psych": [{"p": "追漲（貪婪）", "a": "那些迟钝的人正在疯狂地买进，价格不断地追高挂单", "n": "散户在暴涨中不顾高位疯狂追涨，贪婪被行情点燃而失去理性。"}, {"p": "情緒操縱", "a": "我们的价格每抬高一次就会有无数的投资人把自己低价位的单子撤掉，换一个高的价位追涨", "n": "庄家以连续抬价操纵群体情绪，诱使散户自动撤低追高。"}, {"p": "心理較量（看誰先崩潰）", "a": "我只需要用快速的下跌就能把这些人全部给吃掉，我计算了一下幅度", "n": "庄家测算砸盘幅度，与追高盘比谁先崩溃，一击吞噬全部。"}, {"p": "道德衝突／罪疚感", "a": "一个一辈子都不能偿还的感情债，精神上将会一辈子接受灵魂的拷问", "n": "庄家预见小姑娘将因崩盘背负终身罪疚，也暴露自身的良心拷问。"}]}, {"i": 46, "title": "第四十六回　血雨腥风葬股魂", "kind": "hui", "summary": ["莊家與散戶的博弈是場「貓和老鼠」的心理較量，看誰先崩潰，弱者傾家蕩產。", "主力步步操控情緒：砸盤、低掛單、長時間震盪、尾盤急拉，散戶節奏全被掌握。", "散戶在強平恐懼下恐慌性拋售、急切出貨，群體不計成本地潰逃離場。", "短短六十分鐘從盈利到一無所有，價格重回原位，悔恨將耗盡爆倉者一生。", "主角對成功只有深深自責，獨聽哀樂、聞人跳樓而落淚，職業操盤人的孤獨與異化畢現。"], "qa": [{"q": "下午臨開盤時，老頭子給主角送來什麼？說了什麼話？", "a": "老頭子給主角送來換洗的衣服，說是他和老婆一塊兒買的「名牌」，用他的工資買的，勸他「不要壓力太大」；主角換上後乾乾淨淨走出來，老頭子已離開。"}, {"q": "主角向報單員和兄弟們下達了什麼操盤指令？", "a": "他吩咐每分鐘以10萬股密度、下跌50元一檔賣出，斷言1250點以上的單子當天將全部爆倉，並稱這是一場「殺戮」、「血雨腥風」，營業部也將受慘痛打擊。"}, {"q": "下午的盤面，莊家與散戶其實在比拼什麼？", "a": "比拼心理承受力：主力把價格釘在1230點附近不漲不跌，讓急於出逃者在煎熬中崩潰，等待券商強平單湧出——看誰先撐不住。"}, {"q": "主力用了哪些心理戰術折磨對手？", "a": "砸盤製造恐慌、長時間震盪「溫水煮青蛙」、掛低單層層壓價、尾盤急拉讓出局者眼見回本，每一步都在操控對手的情緒與節奏。"}, {"q": "散戶在暴跌中表現出什麼群體心理？", "a": "陷入恐慌性拋售——大批單子不計成本湧出，急切出貨、別無選擇，群體在恐懼中互相踩踏，兩袖清風地潰逃離場。"}, {"q": "為什麼收盤價回到盈利位，反而讓爆倉者更痛苦？", "a": "因為失去的痛苦遠大於賺到的快樂：60分鐘內從盈利到一無所有，而收盤價又回到他們本可盈利的位置，雙重落差讓悔恨耗盡一生。"}, {"q": "操盤成功後，主角為何只有深深自責？", "a": "他對自己成功並不感到高興，只有深深自責，恨透支交易把「可憐善良的人們」清洗一空——莊家的良心在殺戮後開始拷問，自我發生內在異化。"}, {"q": "老胡的電話帶來了什麼消息？主角為何落淚？", "a": "老胡報告深圳一打工者被清倉、欠債跳樓。主角愣住，默念「量力而行」「順勢而為」，想到白髮老太太，眼淚不由自主流下——死亡陰影籠罩整個操盤生涯。"}, {"q": "那些透支交易者為何遲遲無法放手？", "a": "已投入巨資無法放手，又懷著「跌久必漲」的賭徒謬誤，寧可透支扛單等待反彈，最終被強平清洗得兩袖清風，把悔恨留給一生。"}, {"q": "尾盤拉抬時，其他資金為何「隨聲附和」？", "a": "5分鐘後那幾個人感覺主角的行為便隨聲附和，眾人一致抬價，價格很快被打起來——跟風資金成了主力拉抬的免費推力。"}], "quotes": ["这是一场杀戮，一场血雨腥风，1250点以上的单子在今天将会全部爆仓，这些证券营业部也将会受到惨痛地打击。", "这是一场猫和老鼠的游戏，我的单子越低这些人的价位也越低，他们急切出货的心情可以想象得来，他们别无选择必须在下午收盘前全部平仓。", "短短的60分钟，他们就变得一无所有，但是让他们一无所有的那个价格再次回到原来他们还是盈利的那个状态，悔恨会把这些人的一生消耗掉。", "我恨是谁他妈的搞的那个透支交易，就是这些透支交易把这些可怜善良的人们清洗得两袖清风。", "晚上我不打算去喝咖啡了，我想一个人静静地聆听哀乐，为那些今天葬送了炒股生涯的人们哀悼。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "这是一场猫和老鼠的游戏，我的单子越低这些人的价位也越低，他们急切出货的心情可以想象得来，他们别无选择必须在下午收盘前全部平仓。", "n": "莊家以不漲不跌的震盪與低掛單，與散戶比拼誰先心理崩潰。"}, {"p": "恐慌性拋售（恐懼）", "a": "开始有大批量的单子抛售，我吩咐：“不要着急就在这个价位接进，甚至可以把单子挂得低一点。", "n": "散戶在強平恐懼下不計成本拋售，正好讓主力揀到低價籌碼。"}, {"p": "道德衝突／罪疚感", "a": "我对自己这样的成功并不感到高兴，只有深深地自责。", "n": "莊家的良心在血洗散戶後受拷問，成功與罪疚同時壓身。"}, {"p": "死亡焦慮", "a": "晚上我不打算去喝咖啡了，我想一个人静静地聆听哀乐，为那些今天葬送了炒股生涯的人们哀悼。", "n": "哀樂、跳樓與「葬送」之語，把股市博弈推到生死與末日的高度。"}]}, {"i": 47, "title": "第四十七回　哀曲繞梁夜謀深", "kind": "hui", "summary": ["哀怨的《天堂之約》迴盪夜空，敘述者幻想死者在天堂安息——股市之外，人方能逃離欲望的歷練。", "凝視一張張善良面孔，主角終於明白內疚之源：無人存心害人，工作本身卻釀成悲劇。", "老胡剖析死者：六千元是全家積蓄，更因入市期望過高，重挫後萬念俱灰走上絕路。", "散戶健忘而樂觀，勸其注意風險反遭「你懂什麼」的教訓，滿口騙人騙己的大話。", "湊錢撫慰良心之後，主角重算倉位，定下更狠的出局計劃——道德的妥協換來手段的毒辣。"], "qa": [{"q": "敘述者一直「內疚」，他找到的內疚根源是什麼心理機制？", "a": "他凝視一張張善良面孔，發現誰也無意害人，只是為工作努力，但這份工作釀成悲劇——害人者與內疚者同體，正是道德衝突的根源。"}, {"q": "老胡如何從心理層面解釋死者自殺？", "a": "他認為六千元是全家積蓄，更因入市期望過高，遭受毀滅性打擊後萬念俱灰——期望落空的絕望遠超金錢損失本身。"}, {"q": "散戶面對風險警告為何滿口「你懂什麼」式的大話？", "a": "他們把過往的運氣當成本事，用「現在是什麼時候啊，我曾經有一次」自我吹噓，騙自己騙別人，正是自我服務偏差的表現。"}, {"q": "莊家明知明天要大幅度折騰，為何斷言散戶臉上依然幸福？", "a": "因為散戶健忘、只願相信利好，被反覆收割後仍不改樂觀，情緒始終被莊家的節奏牽著走，這正是情緒操縱的結果。"}, {"q": "「我們只是在工作，為工作而努力」這句話在心理學上如何解讀？", "a": "這是典型的認知失調合理化：莊家把害人慘劇歸因於職業行為，用「工作」二字卸下道德責任，使良心得以暫時安頓。"}, {"q": "主角湊錢送死者家屬，「使自己心裡平衡而已」反映出什麼心理？", "a": "他明知金錢無法償命，仍以此安撫內疚，用捐贈換取心理平衡，是罪疚感催生的道德補償行為。"}, {"q": "敘述者幻想「天堂沒有股市」有何深意？", "a": "他把股市視為人間的歷練與苦難之源，天堂是沒有欲望博弈的彼岸，寄託了對死亡與自己罪孽的雙重焦慮。"}, {"q": "對死者因六千元自殺一事，大山與老胡的看法有何不同？", "a": "大山不解區區六千元何足輕生；老胡則指出那是全家積蓄，且入市期望過高，遭重創後萬念俱灰，那種絕望旁人難以體會。"}, {"q": "老胡對新出局計劃的反應與主角的堅持是什麼？", "a": "老胡一愣，質問豈不是又要害死一批人、未免太黑，勸能出來就算了；主角堅持唯有狠辣才能安全出局，寧可手段毒辣不可馬虎。"}, {"q": "主角說「我們這時候的心情可能要比任何人都差」，反映操盤者怎樣的內心世界？", "a": "外人眼中他們神秘優越，實則負罪沉重、心情低落，風光背後的孤獨與異化，使他們與人群隔絕。"}], "quotes": ["一曲哀怨的《天堂之约》在整个夜的空间游荡。", "其实我们谁也没有有意识地要把别人怎么样，我们只是在工作，为工作而努力，但是就是这些有着善良面孔的人的工作，结果造成了这样谁也不愿意看到的悲惨结局。", "你要是劝他们注意风险，他们就会教育你：“你懂什么？现在是什么时候啊，我曾经有一次怎么怎么。”", "我们这样做虽然少，但是使自己的心里平衡而已。", "不行，只有这样做，我们才能更加安全顺利地出局，要不然的话稍微有闪失，我们又得麻烦，因此宁肯这样手段狠辣，也不能马虎大意。"], "psych": [{"p": "道德衝突／罪疚感", "a": "我们这样做虽然少，但是使自己的心里平衡而已。", "n": "莊家以捐款撫慰良心，罪疚感與道德衝突貫穿全章。"}, {"p": "認知失調／合理化", "a": "其实我们谁也没有有意识地要把别人怎么样，我们只是在工作，为工作而努力", "n": "把害人悲劇說成「只是工作」，用合理化卸下道德重負。"}, {"p": "自我服務偏差（吹噓）", "a": "你要是劝他们注意风险，他们就会教育你：“你懂什么？现在是什么时候啊，我曾经有一次怎么怎么。”", "n": "散戶把一次運氣吹成經驗，勸阻反遭大話教訓。"}, {"p": "死亡焦慮", "a": "一曲哀怨的《天堂之约》在整个夜的空间游荡", "n": "哀樂縈迴與天堂幻想，折射莊家對死亡與罪孽的焦慮。"}]}, {"i": 48, "title": "第四十八回　静安寺前股海潮", "kind": "hui", "summary": ["主角自省雙重人格：剛為死者憂傷，轉眼又製造股市殺戮，內在異化表露無遺。", "以靜安寺祈禱者對照炒股者，斥後者把希望寄託運氣，陷入自欺欺人的群體狀態。", "莊家以拉高、停買、再拉高的節奏試探並操縱散戶情緒，直到群眾瘋狂才放手出貨。", "gp跟風盤指標量化散戶從眾心理：從放不開的6升到瘋狂的50，羊群效應步步加劇。", "主角預言營業部不擇手段誘客透支，蠢豬般的貪婪終將把透支者送上死路。"], "qa": [{"q": "主角為自己的「雙重人格」感到不理解，這反映了他的什麼心理狀態？", "a": "他剛為一個人的死憂傷半天，轉眼又繼續製造股市殺戮，顯示職業操盤使他在悲憫與算計之間撕裂，自我認知開始分裂、異化。"}, {"q": "主角說炒股的人「把希望完全寄托在一種運氣上，一種自欺欺人的狀態之中」，他如何評價這種心理？", "a": "他認為股民不像祈禱者那樣承認自身力量的局限，而是把希望寄託於運氣，處於自我欺騙之中；而莊家正是利用這種心理，操控他們的預期。"}, {"q": "開盤後主角為何反覆「停止買進」讓價格回落、再重新拉高？他運用了什麼心理戰術？", "a": "他如法炮製地停買、回落、再拉高，目的是洗掉跟風盤哪怕一點點的擔憂，趁散戶還沒起顧慮就把他們帶上車，這是典型的節奏與試盤心理戰術。"}, {"q": "「gp」指標反映了散戶的什麼群體心理？數值由6升到超過50說明了什麼？", "a": "gp衡量跟風盤的活躍程度，正是羊群效應的量度：6顯示散戶受昨日打擊仍放不開，30時開始活躍，超過50時人們真正瘋狂，從眾追漲到達頂點。"}, {"q": "指數從1350點回落到1300點附近時，主角為何立即大舉買進？1300點有何特殊意義？", "a": "1300點是整數關口，具有心理支撐位的意義；指數一旦逼近或跌破，散戶就會起恐慌，所以他以5萬股連續報單接住，迅速把指數拉回1360點之上。"}, {"q": "章末主角為何斷言營業部會「不擇手段勸客戶透支交易」？這種行為背後是什麼心理？", "a": "群眾瘋狂時，營業部想借透支交易增加收入，實則在放大人們的貪婪；主角預言這些蠢豬的舉動會把自己送上死路，被慫恿透支的客戶終將被市場吞噬。"}, {"q": "主角看到「鋼管股份」突然躥起又沒有後文，他如何判斷與應對？", "a": "他判斷這不是自家兄弟發暈，而是某個不怕死的所謂遊資激動的表現，於是吩咐報單員接住該價位，不讓價格掉下來，其餘股票仍按原計劃進行。"}, {"q": "主角與「老胡」如何配合出貨？為何說「到底是一起的兄弟」？", "a": "他吩咐老胡在自己停止買進時開始出貨，上午把手頭貨全部出空；老胡擔心部分貨會被主角接走，他卻毫不在意，顯出這批內線兄弟配合默契。"}, {"q": "gp超過50、群眾真正瘋狂之後，主角為何「靜靜地觀察」不再動作？", "a": "他深知此刻掛高單出貨才是最佳狀態，且不能有絲毫大意——一旦買進的人發現漲勢停滯或股票下跌就會起顧慮；他冷眼旁觀，靜待群眾情緒替他出貨。"}, {"q": "主角說「连整天在身边的人都难以想明白我想干什么」並為此暗暗得意，這說明了什麼？", "a": "他以無人能看透自己的思路為榮，顯示職業莊家的孤獨與異化——連貼身助手都猜不透他，他活在與所有人對立的算計之中，自我與他人徹底疏離。"}], "quotes": ["这边刚刚为一个人的死而忧伤了半天，那边又开始制造新的杀戮。", "而股市上的那些人却把希望完全寄托在一种运气上，一种自欺欺人的状态之中。", "我想不能这样一意孤行，一定要在上去的时候把这些人也带上，不然我交给谁去？", "这时候人们才开始真正地疯狂了，看看gp已经超过50", "但是这些蠢猪愚蠢地举动一定会把自己送上死路的。"], "psych": [{"p": "情緒操縱", "a": "因此，我如法炮制，再次吩咐报单员停止买进。价格再次开始慢慢回落", "n": "莊家以買進與停買反覆拉扯價格，直接操控散戶的情緒與預期。"}, {"p": "羊群效應（從眾）", "a": "我看了一下gp是6，这说明这些人目前还是有点放不开，受到昨天的打击", "n": "gp跟風盤指標量化散戶從眾活躍度，據此決定拉抬與出貨的節奏。"}, {"p": "心理支撐位", "a": "大盘指数开始从1350点的位置开始回落到1300点左右", "n": "1300點整數關口成為心理支撐位，指數一逼近即被莊家迅速拉回。"}, {"p": "孤獨與異化", "a": "我心中暗暗地得意，连整天在身边的人都难以想明白我想干什么", "n": "主角以無人能懂為榮，連身邊人也猜不透他，職業操盤的疏離盡顯。"}]}, {"i": 49, "title": "第四十九回　破千四陽線如刀", "kind": "hui", "summary": ["上午收盤前買盤轉弱，主力按兵不動，靜待午後再行布局。", "午間勸老阿婆賣股獲利了結，阿婆自信滿滿拒不聽勸，堅信明日續漲。", "午後主力於1360點大單掃貨，十分鐘推上1400點，散戶情緒瞬間沸騰。", "散戶集體狂熱搶購，主力趁勢拋光籌碼，巨陽線實為誘多出貨陷阱。", "收盤前主力再護1400點，主角自詡曲線完美，卻對老阿婆懷著沉重內疚。"], "qa": [{"q": "上午收盤前主角為什麼不再動作？", "a": "價格向上速度漸慢，成交量顯示買進熱情下降，主角判斷無需動作，讓大盤維持現狀，把真正的大動作留到午後，足見其善於觀察群體熱情的節奏。"}, {"q": "主角午間為何特意勸老阿婆賣股？", "a": "他深知午後將砸盤出貨，不忍見固執的散戶高位接盤，遂勸阿婆獲利了結，甚至自稱虧錢相勸，是良心對操盤行為的抗拒。"}, {"q": "阿婆拒絕賣股的心理根源是什麼？", "a": "她堅信自己穩健「不會虧完」，又認定明天還會漲、行情好，把僥倖與經驗誤當成能力，是過度自信與自我合理化的典型寫照。"}, {"q": "主角「破天荒地吃西餐」暗示什麼心理狀態？", "a": "勸不動阿婆令他心情沉重，又明知午後將有大動作，反常之舉折射出操盤者既內疚又孤獨的複雜心境。"}, {"q": "午後主角用什麼手法把指數推上1400點？", "a": "價格降到1360點附近時，他吩咐報單員每次下單10萬股、價格抬高30元一個層次，以瘋狂買盤在十分鐘內把指數從1370點推上1400點。"}, {"q": "「整数关还是让人们有所顾忌」說明了什麼心理現象？", "a": "1400點是整數關口，多空雙方都在此產生心理定錨與顧忌，指數觸及便回落，正是錨定效應與心理支撐位的體現。"}, {"q": "指數突破1400點後散戶表現出什麼群體心理？", "a": "營業部裡人人歡呼雀躍、爭先搶購，眾人被突破行情裹挾而集體狂熱，主角判斷「人們已經瘋了，已經失去理智了」，典型羊群效應。"}, {"q": "「gp已經達到60」在文中指什麼？", "a": "指主力出貨進度已達六成（原文僅作「gp」）。突破1400點後主角停止買進，因為他已斷定散戶失去理智，無需再護盤。"}, {"q": "收盤前主角為何執意把指數重新推上1400點？", "a": "跌破1400點他才介入，收盤前重新推上1400點，令收盤價「非常完美」，意在維護關鍵心理支撐位，讓散戶繼續相信強勢。"}, {"q": "「一把高高舉起準備往下砍落的刀」有什麼心理含義？", "a": "巨陽線看似完美實為誘多陷阱，如舉刀待落，暗喻主力拉高出貨後行情將砍向散戶，也流露主角對老阿婆接盤的擔憂。"}], "quotes": ["阿婆说：“你们年轻人就是胆子大，搞那个透支交易，我没有你们那样的胆量，我现在也是亏钱的，但是我这样不会亏完的。你看看你，要是跟我一样就不会没有钱炒股了呀。”", "这样一个固执的老太太，我根本无法说服她不炒股，她总是认为自己应该有能力在这个市场生存。", "我打算给所有人一点兴奋，争取在15分钟内迅速打破1400点。", "我想这时候人们已经疯了，已经失去理智了，我不知道那个可怜的老阿婆把自己赚钱的股票卖掉没有？", "一根巨大的阳线几乎吃掉了前面两根阴线，这样完美的形态总是让我感觉那个长长的大阳线彷佛是一把高高举起地准备往下砍落的刀。"], "psych": [{"p": "情緒操縱", "a": "我打算给所有人一点兴奋，争取在15分钟内迅速打破1400点。", "n": "主力以強力買盤製造興奮情緒，誘使散戶追高接盤，完成拉高出貨。"}, {"p": "羊群效應（從眾）", "a": "疯狂的人们在抢购，我的那些兄弟已经在这一小时内，把手中的筹码毫不吝啬地全部交给了这些争先恐后的人们。", "n": "散戶見指數突破便爭先搶購，集體狂熱正好讓主力全身而退。"}, {"p": "心理支撐位", "a": "指数在没有人护理的情况下一直维持到收盘前的40分钟左右，开始往下走，最高冲到1420多点，当指数向下触及1400点的时候，我没有理睬，在跌破1400点以后，我开始介入，在收盘前我重新把指数推上1400点，收盘价格在人们的眼中看起来是非常地完美。", "n": "主力刻意護住1400點關鍵位，令收盤形態完美，以維繫散戶信心。"}, {"p": "道德衝突／罪疚感", "a": "我想这时候人们已经疯了，已经失去理智了，我不知道那个可怜的老阿婆把自己赚钱的股票卖掉没有？", "n": "操盤者明知散戶將高位接盤，仍記掛老阿婆，良心備受拷問。"}]}, {"i": 50, "title": "第五十回　晴日高开暗出货", "kind": "hui", "summary": ["庄家趁晴日高开制造强势假象，以买盘诱多，散户透支追涨陷入狂热。", "信息单向传递的市场里，大资金只能左右自身资金，克制贪婪与恐惧方为制胜原则。", "诱多后突然撤单砸盘，指数如水银倾泻，散户猝不及防被吓傻，群体反应迟钝。", "减仓过半后转手低吸，散户「下跌不慌、上涨就追」的死多头思维暴露无遗。", "主角闭眼想象营业部众生相，与人群隔绝，凸现职业操盘手的孤独与异化。"], "qa": [{"q": "开篇主角为什么在「美好的阳光下」反而决定出货？", "a": "阳光公平美好，正好烘托人们狂热的乐观情绪，主角深知要利用这种氛围，趁市场沉浸在看多情绪中悄悄出货，表面晴日高开，实则暗藏杀机。"}, {"q": "主角认为大资金与小资金最大的区别是什么？", "a": "大资金没有能力改变整个市场走势，但最大的长处是有能力左右自己运作的资金；控制资金进出的是人，因此克制人性中的贪婪和恐惧，是在信息单向交流市场上取胜的原则。"}, {"q": "开盘前「高开50元买进」的指令是什么心理战术？", "a": "这是典型的诱多战术：利用昨天的强势让狂热情绪延续，先以买盘抬高价格制造强势假象，让散户以为涨势确立纷纷跟风追涨，为随后的出货埋下伏笔。"}, {"q": "交易开始后散户表现出怎样的群体心理？", "a": "几乎所有股票高价开盘，五分钟内跟盘(gp)由15升至40，透支交易疯狂进行——众人一致看多、互相壮胆，贪婪的羊群效应推动他们不顾风险追高。"}, {"q": "主角为何在指数冲上1440点后突然「撤单转抛」？", "a": "这是节奏与试盘的心理战：先诱导追涨情绪到极致，再瞬间反转砸盘，让多头来不及把看多思维转向空头，正好在情绪最高点收割对手盘。"}, {"q": "抛售时「人们一定是被吓傻了」说明什么心理现象？", "a": "说明散户缺乏应对突变的心理准备：走势电闪雷鸣般快速，昨天一天树立的信心不会在短时间内土崩瓦解，恐惧来不及转化为行动，群体反应迟钝，任由场内单子全部被成交。"}, {"q": "主角闭眼想象营业部众人反应，体现其怎样的状态？", "a": "他想象卖出窗口前站着身强力壮的男人、大户室里自负无知的家伙暴跳如雷，自己却像旁观者一样冷眼审视人群——这种与人群的隔绝，正是职业操盘手孤独与异化的写照。"}, {"q": "价格回升时散户「下跌不慌、上涨就追」反映什么心理？", "a": "这是典型的死多头思维与追涨心理：大跌时不愿割肉、承受亏损，上涨时又急着跟风怕错过，结果在赚钱散户愿意抛售的点位上暴露了自己的行为模式。"}, {"q": "主角为何能准确判断「散户愿意抛售的点位」？", "a": "因为散户的行为模式很容易暴露：涨到能回本赚钱的位置，急于兑现的处置效应就会发作。庄家正是利用这种心理定势，在关键点位完成低吸布局。"}, {"q": "主角说「选择就是最困难的事情」有何深意？", "a": "信息单向传递、无法与对手面对面讨价还价，散户只能被动接收信息再决定行动；而庄家恰好利用这种不对称，把「选择」变成对散户心理的操纵。"}], "quotes": ["今天的天气很不错，但是阳光对于大地来说是公平的，也是美好的，然而在这美好的阳光下今天我想出货。", "控制资金进出的是人，因此努力克制人性中的贪婪和恐惧，是在这个信息单向交流市场上取胜的原则。", "我想这些人疯了，狂热了，我开始让助手查看交易部的交易情况，透支交易正在疯狂地进行。", "人们一定是被吓傻了，随着我们不断地抛售，大盘指数直逼1300点而去，我对报单员说：“停止抛售，让价格自由落体吧。", "这说明人们还是看多，下跌不慌，上涨就追，典型的死多头思维，我开始放缓买进的速度和幅度，价格还在向上但是已经没有刚才那么猛烈。"], "psych": [{"p": "情緒操縱", "a": "按照昨天的走势高开是正常的，要不然人们那种狂热的情绪就不会延续到今天", "n": "庄家利用既有狂热情绪高开诱多，再撤单砸盘，全程操纵大众情绪。"}, {"p": "追漲（貪婪）", "a": "这说明人们还是看多，下跌不慌，上涨就追，典型的死多头思维", "n": "散户大跌不割肉、上涨就追，贪婪与损失厌恶交织的死多头心态。"}, {"p": "孤獨與異化", "a": "我闭上眼睛，想象着营业部那些疯狂的人们", "n": "主角以旁观者姿态审视人群，职业操盘手的疏离感跃然纸上。"}, {"p": "心理支撐位", "a": "但是我知道现在这个位置是赚钱的散户愿意抛售的点位", "n": "庄家利用散户获利兑现的心理定势，在关键点位完成低吸。"}]}, {"i": 51, "title": "第五十一回　哀乐声中别股海", "kind": "hui", "summary": ["主角劝老阿婆午后抛股，阿婆却执意再看行情，沉没成本与侥幸令其难舍亏损筹码。", "西餐厅食客高谈放心买进，赌徒谬误与幸存者偏差使其无视即将到来的砸盘。", "主角遥望静安寺，将祈祷与赌博并论为懒惰，显露其对众生的疏离与异化。", "午后主角令大单连番砸盘，指数自1400点调头急挫，个股较昨日跌逾三成，庄家借恐惧操纵情绪。", "收市后主角核算净利逾三成，谢绝老胡独处，夜聆哀乐悼众生，翌日独赴奉贤海滨，孤寂而哀恸。"], "qa": [{"q": "老阿婆面对下跌为何仍不肯抛售股票？这体现了何种心理？", "a": "阿婆见“上午还是涨的，都上涨一档了”，心存侥幸想再看行情；这体现损失厌恶与处置效应——不肯割肉，因已投入而不愿放手，沉没成本令其难逃深套。"}, {"q": "西餐厅两人的言论反映了散户的什么群体心理？", "a": "他们高喊“可以放心大胆地买进”，称“这一闹都多少次了”，既犯赌徒谬误——以为跌久必涨、震荡后必反弹；又犯幸存者偏差——只看到前几次大胆者赚钱，无视多数输家。"}, {"q": "主角说“我下午不会给任何人机会的”，显示庄家什么心理战术？", "a": "这是心理较量与情绪操纵：他已决意午后砸盘，不给犹豫者逃命机会，先稳住阿婆等人的侥幸情绪，再以恐慌收割，比的正是谁先崩溃、谁先认输。"}, {"q": "午后开盘，主角用什么手法把指数打下去？", "a": "主角吩咐报单员在现价基础上以150元的下降幅度、30万一次连续抛售，价格再次被打下去，指数在接近1400点调头向下，跌速快于上午，何时进场的人都无法出来。"}, {"q": "主角把祈祷和赌博相提并论，反映他怎样的心理状态？", "a": "主角认为两者都是懒惰行为，只是温和与激进之别；他推崇勤恳劳作、安分守己之人，显露出看透人性贪婪后的孤傲与异化，与求神拜佛、赌市求财的众生隔离开来。"}, {"q": "指数接近1300点时，主角采取了什么操作？", "a": "主角指令停止抛售，大单维持在这个价位，只要有人买进就给他成交，价格在小幅度内震荡至收盘，指数几乎以最低点收盘，个股较昨日普遍跌去30%以上。"}, {"q": "主角夜里欣赏哀乐、为所有人哀悼，透露什么心理？", "a": "透露死亡焦虑与罪疚感：他亲手制造暴跌，深知散户血本无归，遂以哀乐自悼，愿众人“珍惜自己的生命”，是庄家良心受拷问后的不安与自赎。"}, {"q": "主角为何骂播音员“王八蛋”？", "a": "播音员说“今天是周末，股市在开盘以后冲高向下，一根长阴线结束了全天的交易”，主角认为这种事后解说等于把股民当傻瓜，讽刺股评之肤浅，也流露他对市场游戏规则的了然。"}, {"q": "主角谢绝老胡邀约、独自去海边，反映什么心理状态？", "a": "反映孤独与异化：操盘得胜后他不想见任何人，“需要休息也需要放松”，独自驱车奉贤海滨，职业操盘带来的疏离使他从人际与市场中抽身，独自承受一切。"}, {"q": "这一轮运作下来，主角的盈利情况如何？", "a": "仅后面进场救人的那笔资金盈利就在20%左右，加上那些人的补偿，估计净利润应在30%以上，远超主角预料；他打算次日若无意外就把资金全部上交。"}], "quotes": ["我走出营业部的大门，心里默默地为这位可怜的老人家祈祷，我希望她能很快走掉，按照我的思路，我下午不会给任何人机会的。", "可以放心大胆地买进的，你看看这一闹都多少次了，有什么好怕的，前几次你看看人家胆子大的都赚钱了，他们就是这样大幅震荡的时候才有钱赚啊！", "祈祷和赌博都是懒惰的行为，一种采取了较为温和的表现手段，另一种则表现出较为激进的行为而已。", "这样的震幅可以算是惊天动地，但是还是没有惊醒这些固执的投资人。", "开始欣赏哀乐，我希望为所有的人哀悼，也希望他们能够珍惜自己的生命。"], "psych": [{"p": "情緒操縱", "a": "开盘了，我吩咐报单员：“就在现在这个价格的基础上，以150元的下降幅度，30万一次，抛售。”价格再次被打下去，指数就这样在接近1400点的位置调头向下", "n": "庄家以大单砸盘制造恐慌，操控大众情绪以完成收割。"}, {"p": "心理較量（看誰先崩潰）", "a": "这样的震幅可以算是惊天动地，但是还是没有惊醒这些固执的投资人。", "n": "庄家以极端震幅考验散户心理承受力，比拼谁先崩溃。"}, {"p": "賭徒謬誤", "a": "可以放心大胆地买进的，你看看这一闹都多少次了，有什么好怕的，前几次你看看人家胆子大的都赚钱了", "n": "散户以为震荡多次后必然再涨，大胆买进正是赌徒谬误。"}, {"p": "孤獨與異化", "a": "明天我想利用休息的时间到海边去走走，不想见任何人了，我需要休息也需要放松。", "n": "操盘得胜后谢绝一切应酬独赴海滨，职业投资人的疏离与孤寂尽显。"}]}, {"i": 52, "title": "第五十二回　海畔觀潮識盈虛", "kind": "hui", "summary": ["主角海邊觀潮，竟仍聯想成交量指標，休假也無法放下股市，職業慣性深入骨髓。", "他厭惡股票與沒人性的工作，運作完便逃離，深知此刻無數散戶正將遭受無情打擊。", "以殺手殺人後沉淪自比，掠奪財富的罪疚令他低落，轉而思念故鄉老父，渴望歸屬。", "酒店獨處讀《邪派高手》，願望被打敗、回鄉修煉再戰，自我懷疑變態，孤獨承受。", "悟出機構操盤手琢磨人、小資金琢磨股票，股市博弈本質是人與人的心理較量。"], "qa": [{"q": "主角說自己「也有點神經質了」，這反映出職業投資人什麼樣的心理狀態？", "a": "他本想休息放鬆，卻看到海濤就聯想技術指標，休假也無法擺脫股市思緒，正是職業投資人與工作深度綁定、難以抽離的異化表現。"}, {"q": "主角為什麼把資金運作後的自己比作「殺人後沉淪的殺手」？", "a": "他認為無論殺人還是掠奪別人的財富，都是把美好事物毀掉的醜陋行為，故不應興奮；這種罪疚感讓他情緒低落，正是操盤手的道德衝突。"}, {"q": "主角明知自己離開後會有很多人遭受打擊，他為何仍然厭惡股票？", "a": "他討厭股票與每天沒人性的工作，逃離工作場所正是疏離的表現；但職業使然，他清楚後知後覺的小機構會折騰，巨型資金再次介入時殺傷力最大。"}, {"q": "主角為什麼會喜歡《邪派高手》這部小說？這反映了他怎樣的心理？", "a": "他天生叛逆，希望壞人贏，把自己代入邪派高手，幻想被打敗後回鄉修煉再戰，反映他在莊家博弈中的孤獨、自我懷疑與身份的矛盾認同。"}, {"q": "「機構操盤手的所有的思維都在人身上，而小資金一直在琢磨股票」，這句話揭示了什麼博弈心理？", "a": "揭示股市博弈的本質是心理較量：莊家研究對手盤的人心，散戶卻只看股票本身；股票啥都不能幹，能幹的是人，琢磨人者勝。"}, {"q": "主角在海邊走著忽然「想家、想老父親」，這說明他處於什麼心理狀態？", "a": "他在殺傷無數散戶後產生罪疚與厭倦，情感上渴望親情與歸屬來安撫自己，顯示職業操盤手在道德衝突下的孤獨與異化。"}, {"q": "主角自問「我是不是有點變態」，為何連這種想法都不敢對人講？", "a": "因為他希望自己被人打敗、幻想變成邪派高手，與常理相悖；他害怕被當成精神病，只能把自我懷疑深埋心底，孤獨地承受。"}, {"q": "主角認為「殺傷力最大的時候是巨型資金再次介入時」，這體現了莊家的什麼心理戰術？", "a": "說明莊家的節奏操控：離開讓對手鬆懈，再次介入才是致命一擊；後知後覺的小機構此時才發現苗頭不對而折騰，正中莊家下懷。"}, {"q": "「把成交量看作推動股價的原動力」的指標傳說，為何會讓主角聯想到人？", "a": "他聯想到操盤手借潮起潮落般的資金節奏推動股價、操控情緒；指標只是表象，背後的人心與資金博弈才是本質。"}, {"q": "主角說「能幹的就是人」，這對散戶有什麼心理學啟示？", "a": "散戶盯盤面、跟消息，卻忽略對手的心理；莊家每天琢磨別人在幹什麼，散戶若不懂心理較量，只會淪為被收割的對象。"}], "quotes": ["把成交量看作是推动股价的原动力，利用潮起潮落这种原理推测股市价格的后市发展。", "我讨厌股票，讨厌那样每天没有人性的工作。", "无论是杀人还是掠夺别人的财富，都是丑陋的把美好的事物给毁掉了。", "难得就是大家所有的思维都是在股票上，而机构操盘手的所有的思维都在人身上，他们每天都在琢磨别人在干什么，而小资金一直在琢磨股票在干什么，其实股票啥都不能干，能干的就是人。", "那些后知后觉的小机构发现苗头不对以后，就会开始想方设法地折腾，因此这时候我们的离开并不是杀伤力最大的时候，而杀伤力最大的时候就是这些巨型资金要准备再次介入的时候。"], "psych": [{"p": "孤獨與異化", "a": "每次资金运作完了，我都会像逃一样离开工作的地方，我讨厌股票，讨厌那样每天没有人性的工作。", "n": "職業操盤手厭惡工作、逃離職場，正是職業投資人疏離與孤獨的寫照。"}, {"p": "道德衝突／罪疚感", "a": "无论是杀人还是掠夺别人的财富，都是丑陋的把美好的事物给毁掉了。因此我觉得不应该兴奋才是对的", "n": "主角以殺手自比，掠奪散戶財富的罪疚令其低落，注解莊家的良心拷問。"}, {"p": "心理較量（看誰先崩潰）", "a": "难得就是大家所有的思维都是在股票上，而机构操盘手的所有的思维都在人身上，他们每天都在琢磨别人在干什么，而小资金一直在琢磨股票在干什么，其实股票啥都不能干，能干的就是人。", "n": "莊家琢磨人、散戶琢磨股票，揭示博弈本質是心理承受力的較量。"}, {"p": "羊群效應（從眾）", "a": "那些后知后觉的小机构发现苗头不对以后，就会开始想方设法地折腾", "n": "小機構後知後覺、跟風折騰，正是從眾滯後、慢半拍的群體心理。"}]}, {"i": 53, "title": "第五十三回　卸甲收官看众生", "kind": "hui", "summary": ["主角週一懷著失落感上班，認定今天是最後一戰，吩咐開盤拋售、每筆十萬股逐單降價清貨。", "為下次運作留一成籌碼砸盤用，小張愕然發問；自由落體式出貨令指數在千三關口上下震盪。", "無量陰跌破千二點卻無恐慌盤，買盤踴躍，主角漠然結算資金，宣告本次資金運作全部結束。", "午後他如卸甲士兵混入散戶大廳，別人看大盤他看人，冷眼旁觀群眾的貪婪與狂歡。", "老阿婆抱股住院仍盼漲，有人鼓吹低位殺入必賺，眾人蜂擁搶買，他暗嘆輝煌短暫、代價沉重。"], "qa": [{"q": "主角週一早晨為何懷著失落感上班？這反映他怎樣的心理狀態？", "a": "因為今天將是最後一戰，他要親手結束自己主導的行情；失落感源於職業莊家與戰場告別時的複雜情緒，既有如釋重負，也有對搏殺生涯的依戀。"}, {"q": "助手小張為何在指數跌破1300點時停手、回升至整數關再拋？這運用了什麼心理戰術？", "a": "他利用1300整數關作心理支撐位，讓價格在關口反覆試探：破位停手放人回補，回升即拋，以自由落體式的節奏出貨，頻率與幅度恰到好處，正合結帳時機。"}, {"q": "為何跌破1200點時幾乎沒有恐慌性拋盤，反而有人踴躍買進？", "a": "因成交量保守、陰跌溫和，令散戶淡忘風險，誤以為是正常回檔而貪婪抄底；主角深知這正是溫水煮青蛙式的殺戮前奏，平靜之下暗藏殺機。"}, {"q": "老阿婆住院仍不肯賣股、堅稱「以後還要漲」，體現什麼心理？", "a": "這是認知失調下的自我合理化：她深套不肯割肉，無法承認失敗，只好用「還會漲」安慰自己；主角心裡一顫，深知她越病越難脫身，一病便成死結。"}, {"q": "大聲鼓吹「低位殺入等莊家拉升」的那人，其話語有何心理陷阱？", "a": "他只炫耀春節前後幾次賺大錢的經歷，無視多數失敗者，是典型的倖存者偏差與自我服務偏差，把運氣歸功於自己；主角痛罵他死到臨頭還要拉人墊背。"}, {"q": "眾人為何一見拉升便亂成一鍋粥搶買？主角如何解讀這個場面？", "a": "這是羊群效應與追漲貪婪：見人帶頭、見股票暴漲便不假思索跟進，隊形擠散、亂成一鍋粥；主角暗想這或許是最輝煌的時刻，但喜悅短暫、代價巨大。"}, {"q": "「別人看大盤我看人」這句話如何注解主角的異化？", "a": "他站在散戶大廳卻以旁觀者自居，看散戶如看戲，職業莊家的身份使他與人群隔絕，只能孤獨地審視人性；別人看大盤，他看人，正是投資人疏離異化的寫照。"}, {"q": "主角為何感嘆「戰爭或殺戮開始時總是這樣平靜」？", "a": "因為真正的殺戮往往隱於平靜：出貨尾聲波瀾不驚，散戶放鬆警惕之際正是鉅虧之始；他看透此理，卻只能冷眼旁觀眾人從平靜中一敗塗地。"}, {"q": "主角吩咐會計如何處理籌碼與資金？", "a": "他吩咐留10%的籌碼作日後砸盤用，其餘全部拋出，資金一旦套現立即清算；中午向領導報告資金已結算、戰績尚可，並讓員工回家住，再不用住酒店。"}, {"q": "主角為何說「一病起來就麻煩了，乾脆就接著病算了」？", "a": "他見老阿婆抱病仍不肯割肉、幻想還會漲，深知她病好後還會再度入市被宰，寧願她一直病著；這句狠話背後，是對散戶宿命的無奈與悲哀。"}], "quotes": ["战争或者是杀戮开始的时候为什么总是这样的平静，我很明白从今天这种平静中开始肯定会有很多人要一败涂地。", "我就像一个从战场上下来的士兵一样，总是想回头再看看我为之奋斗的这个战场。", "我心里一颤，完了！这一病起来就麻烦了，干脆就接着病算了。", "无知的家伙你死到临头了还要拉着别人一起下啊！", "我心里在想这可能是最辉煌的时候了，可怜的人们，这个喜悦实在太短暂也需要太多的代价啊。"], "psych": [{"p": "心理支撐位", "a": "等到接近1300整数关的时候他再次吩咐报单员抛出，频率价格幅度都是恰到好处", "n": "莊家利用千三整數關作心理支撐位，控制拋售節奏，正是心理戰術的運用。"}, {"p": "羊群效應（從眾）", "a": "旁边很多人露出羡慕的眼光，有些人悄悄地跑到柜台排队买进去了", "n": "見人帶頭搶買便一窩蜂跟進，散戶的從眾心理在狂歡中徹底釋放。"}, {"p": "倖存者偏差", "a": "你们看到过没有，春节前到现在哪一次不是这样的走势赚大钱", "n": "只記住賺錢的幾次而無視多數輸家，暴富敘事正是倖存者偏差的產物。"}, {"p": "孤獨與異化", "a": "下午开盘以后，我就像一个散户一样，站在交易大厅里，别人看大盘我看别人。", "n": "職業莊家與散戶群體隔絕，冷眼旁觀人性，正是投資人的孤獨與異化。"}]}, {"i": 54, "title": "第五十四回　口脂书血记归期", "kind": "hui", "summary": ["行情将变，主角预见众人由喜转悲，不忍目睹而独行街头，群体乐观与个体清醒形成强烈反差。", "天桥下偶遇收破烂人，主角自嘲\"自己就是个废品\"，职业投资人的落魄与身份疏离尽显。", "收破烂人传授称重做手脚的骗术，主角苦笑各行各业皆有门道，借合理化为自身处境开脱。", "主角谎称屠宰场杀猪月入两千余，以市井身份掩饰真实自我，自我放逐于人群之外。", "深夜以口红书血红日期，状近疯狂，异化灵魂在崩溃边缘反复书写归期。"], "qa": [{"q": "主角为何不愿再看营业部里人们灿烂的笑容？", "a": "行情即将生变，他预见十几分钟后这些人将从喜转悲、仓皇抛售，群体的盲目乐观与将临的崩溃让他不忍目睹，于是默默离场，独自游荡街头。"}, {"q": "主角为什么说\"我自己就是个废品\"？", "a": "炒股失意使他自我贬低、否定价值，职业投资人的身份已让他疏离于人群，连收破烂的人都比他\"踏实\"，这正是孤独与异化的写照。"}, {"q": "收破烂人说\"干啥没有一点门道\"，主角听后有何心理反应？", "a": "他原以为只有股市骗得厉害，没想到这行也有骗，遂以\"各行各业皆有门道\"自我合理化，为股市的骗局与自身身陷其中寻找开脱。"}, {"q": "主角为何谎称自己是屠宰场杀猪的、月入两千余？", "a": "他不敢承认投资人的身份，刻意用市井职业伪装自己，既掩饰落魄，也折射出职业投资人的身份疏离与自我放逐。"}, {"q": "收破烂人为何几杯酒后\"一下子放开了\"？这衬托出主角什么心理？", "a": "酒精卸下穷人的防备，他随之大声说笑；反衬主角借酒浇愁，渴望像市井之人一样放下重负，却终究放不下。"}, {"q": "面对老胡\"和谁喝的\"之问，主角为何答\"和我爸\"又说\"别这么神经质\"？", "a": "他下意识流露出独饮的孤寂与思念，随即用玩笑掩饰；一句\"神经质\"更见他拒绝被看穿、不愿与人深谈的心理防线。"}, {"q": "一餐828元对收破烂人是天文数字，主角为何仍大手笔挥霍？", "a": "他借金钱维持虚假的体面，用慷慨掩饰内心的破产感，向一个陌生人证明自己\"还是有钱人\"，是失意后的补偿心理。"}, {"q": "主角为何执意要跟收破烂人学转行？", "a": "他视转行为精神出口，想逃离股市的泥潭与门道；可连收破烂一行也有骗术，令他苦笑\"算了，我还是干我的那个吧\"，逃无可逃。"}, {"q": "深夜主角用口红反复书写日期，有何象征意味？", "a": "口红鲜红如血，象征亏损如流血的伤口；他疯狂写满镜墙床被，状近崩溃，书写归期即渴望逃离，透出末日般的死亡焦虑。"}, {"q": "主角\"农民儿子的本色一下子显现出来\"说明什么？", "a": "他借市井的豪爽与大声说笑掩饰内心创伤，在两种身份间摇摆；越是表现得豪迈，越暴露其精神的无依与异化。"}], "quotes": ["我说：“没有什么废品，我感觉我自己就是个废品。”", "他说：“当然啊，干啥没有一点门道，不然你怎么混啊？”", "我说：“这样啊？这行也有骗啊，我以为光是炒股票骗得那么厉害，没想到你这个行业也不怎么样啊。”", "我说：“是，我一个月能挣2000多块，杀猪的，活重，就拿得多一点。”", "看着这血红的字，我感觉那就是血，我忽然像疯了一样，拿起那个口红在墙上、床单上、被子上到处都写上这几个字，直至把那支口红全部写完。"], "psych": [{"p": "羊群效應（從眾）", "a": "看着人们灿烂的笑容，我实在不愿意再看到十几分钟后这些人的表现", "n": "众人仍沉浸于集体乐观，主角却预见群体崩溃，注解股民盲目跟风的从众心理。"}, {"p": "孤獨與異化", "a": "我说：“没有什么废品，我感觉我自己就是个废品。”", "n": "职业投资人自贬为废品、谎称杀猪者，注解其身份疏离与精神孤独。"}, {"p": "認知失調／合理化", "a": "他说：“当然啊，干啥没有一点门道，不然你怎么混啊？”", "n": "主角以各行各业皆有骗术合理化股市骗局，为自己身陷其中寻找开脱。"}, {"p": "死亡焦慮", "a": "看着这血红的字，我感觉那就是血，我忽然像疯了一样", "n": "血红字迹如血、疯狂书写归期，注解崩溃边缘的末日感与死亡焦虑。"}]}, {"i": 55, "title": "第五十五回　独饮还乡步夜山", "kind": "hui", "summary": ["孤獨難眠，獨飲一瓶五糧液買醉，酒精成為他對抗寂寞的唯一出口。", "一句「我不行了」被前台當真，酒店報警撬門，都市人際的冷漠誤解一覽無遺。", "滿牆亂寫被自我合理化成「練習書法」，他急於粉飾醉酒失態以維持體面。", "婉拒四人隨行只求一張機票，父親只要兒子活著站在面前，親情成了唯一的錨。", "夜走三十二公里山路，靜中重聞自己的呼吸，才發現自己早已不知在喘氣。"], "qa": [{"q": "昨晚「我」為何獨飲一整瓶五糧液？", "a": "巨大的孤獨和寂寞讓他無法平靜，只能一口氣灌下一瓶五糧液，迷迷糊糊睡去。酒是他排解都市孤獨的唯一出口，也為次日清晨「我不行了」的誤會埋下伏筆。"}, {"q": "一句「我不行了」為何會驚動警署與領導？", "a": "前台小姐把醉話當真，認定房客出事；酒店怕有人「睡死」在自己單位，立刻報警並聯繫領導。一句醉言在傳遞中被不斷放大，成了驚動多方的「事件」。"}, {"q": "面對警察撬門，「我」為何怒罵並自稱「祖上三代都是窮光蛋」？", "a": "他怒斥警察不抓壞人反來騷擾自己，急著自證「絕對良民」、祖上三代皆窮。急於撇清與「壞人」的關係，隱約透露出對自身來路不明之財的不安與罪疚。"}, {"q": "酒店經理見到滿牆字跡，「我」如何解釋？", "a": "他反問「你不認字啊」，說那都是自己寫的字，不耐煩地把人趕出去；對領導才解釋昨晚睡不著，在房間裏「練習書法」，滿牆墨跡是酒後發洩的痕跡。"}, {"q": "「練習書法」的說法有什麼心理學意味？", "a": "把酒後失控、滿牆亂寫的失態重新解釋為風雅的「練習書法」，是典型的認知失調後自我合理化，藉此保住體面，迴避承認自己已被寂寞逼到失序的地步。"}, {"q": "「我」向領導告假返鄉，只要了什麼？", "a": "他只求一張機票，說買啥都不如回去，老父親不希望他帶多少東西，只要他能站在面前喘氣就夠了，因而婉拒了領導安排人買東西的提議。"}, {"q": "「我」為何在機場趕走公司派來陪同的四人？", "a": "他反問「你看我像病人嗎」，又說父親只有他一個兒子，去太多人老人家不知哪個是兒子。他拒絕被當病人、被簇擁，想獨自以兒子的身份回家。"}, {"q": "由西安回老家的路程為何走了近六個小時？", "a": "上海到西安乘飛機僅兩個多小時，西安到老家一百五十公里反而耗時近六小時；趕到縣城時已沒有車，他便決定徒步走三十二公里山路回家。"}, {"q": "夜走山路時，「我」產生了什麼異樣感受？", "a": "山間靜得出奇，從鬧市回到安靜環境，他清晰聽見自己的呼吸聲，才驚覺此前自己根本不知道還在喘氣——股市與都市的喧囂，已讓他忘了自己也是活著的人。"}, {"q": "本章的孤獨與書中的股市人生有何呼應？", "a": "白天的他在股市、公司與人周旋，夜晚卻只能靠酒精與滿牆塗鴉打發寂寞；回鄉夜路上才重新聽見呼吸、找回自我，暗示名利場與故土之間，人已嚴重異化。"}], "quotes": ["昨天晚上，巨大的孤独和寂寞让我根本无法平静，我一口气喝下去一瓶五粮液，就这样迷迷糊糊地睡去。", "去你妈的，什么警署，你不好好的去抓坏人，找我干什么？老子绝对良民，祖上三代都是穷光蛋！！！", "我昨晚睡不着练习书法。", "买啥都不如我回去，我老父亲不希望我带多少东西，只要我能站在他面前喘气就可以了。", "这儿静得出奇，一下子从闹市那种喧嚣之中回到这样一个安静的环境里，我感觉我呼吸的声音是那么的清晰，而在之前我根本就不知道自己还在喘气。"], "psych": [{"p": "孤獨與異化", "a": "昨天晚上，巨大的孤独和寂寞让我根本无法平静，我一口气喝下去一瓶五粮液", "n": "職業投資人獨飲買醉、滿牆亂寫，都市股市生活已讓他與自己嚴重疏離。"}, {"p": "死亡焦慮", "a": "酒店总是怕在自己单位忽然睡死一个人，那谁还敢来这儿住", "n": "一句「我不行了」被當真即驚動警署酒店，折射都市交易關係中對死亡的恐懼。"}, {"p": "認知失調／合理化", "a": "你不认字啊？那都是我写的字，你不认识吗？！出去，出去！", "n": "把酒後失態的滿牆亂寫解釋為「練習書法」，用合理化維護自我形象。"}, {"p": "道德衝突／罪疚感", "a": "去你妈的，什么警署，你不好好的去抓坏人，找我干什么？老子绝对良民，祖上三代都是穷光蛋！！！", "n": "聞警即怒、急證三代貧農出身，隱約透出對自身財富來路的罪疚與不安。"}]}, {"i": 56, "title": "第五十六回　山道夜話憶童年", "kind": "hui", "summary": ["老三独行夜色中重走儿时小路，触景生情追忆童年，孤独心境与怀旧温情交织。", "拴柱贷款买拖拉机拉煤却叹不赚钱，成年人的无奈认命与旧日无忧形成反差。", "抢拨学校闹钟的争胜心最终闯祸，竞争意识在孩童群体中早已埋下伏笔。", "闹钟摔坏后的讨价还价是心理较量雏形，双方试探底线、层层加码互不退让。", "红墨水骗局露馅，老三将占便宜合理化，童年博弈在重逢笑声中化为温情。"], "qa": [{"q": "鬧鐘摔壞後，老三與拴柱的討價還價為何是一場心理較量？", "a": "兩人都怕挨打、不肯吃虧，用牛肉塊數互相加碼試探對方底線，誰先鬆口誰就輸，是一場比耐心與承受力的博弈。"}, {"q": "老三用紅墨水偽裝挨打的舉動，反映了什麼心理機制？", "a": "他把騙肉吃合理化成「太便宜那小子了」，用自欺的理由壓下愧疚，是典型的認知失調與自我合理化。"}, {"q": "兩人都寧願推諉也不肯把鬧鐘拿回家，背後是什麼心理在驅動？", "a": "怕被父親打的痛苦預期壓過了修鐘的責任，損失厭惡讓兩個孩子費盡心思把損失推給對方。"}, {"q": "主角為何會在夜色中獨自走這條小路並陷入回憶？", "a": "熟悉的路喚起童年記憶，獨行的孤獨與舊日群體同行的溫暖形成對照，他藉回憶尋求心靈慰藉。"}, {"q": "拴柱感嘆「拉煤的人多得很，不赚钱」，透露了什麼心態？", "a": "他把生計艱難歸於外部競爭，語氣認命而無奈，透出成年人被現實磨平稜角後的疲憊。"}, {"q": "老三提出「要是下次你的拖拉机坏了，我们给你推」，是什麼心理？", "a": "以回報承諾維繫互惠關係，既是真心的感激，也是一種讓對方安心的社交博弈策略。"}, {"q": "兩人搶著撥鬧鐘最後釀成摔鐘事故，說明了什麼？", "a": "搶著在老師面前出頭是爭勝心與表現欲作祟，小群體裡的競爭沖昏了頭腦，忘了鐘表脆弱的後果。"}, {"q": "多年後兩人為何能一見如故、越聊越起勁？", "a": "共同的童年記憶是牢固的情感紐帶，熟悉的舊路與舊事瞬間消融了歲月的隔閡。"}, {"q": "老三算計「沒有挨打只能吃兩塊肉」時，展現了怎樣的思維？", "a": "他先掂量得失再主動設計騙局，對利益精打細算，顯示出與生俱來的博弈意識。"}, {"q": "本章結尾的笑聲有什麼心理意義？", "a": "揭穿騙局、大打一架的往事如今只換來開懷大笑，時間與情誼化解了當年的衝突，成了情感聯結的印記。"}], "quotes": ["师傅，捎上我们吧。", "这是没有办法，贷款买了这个烂拖拉机卖煤，不赚钱，现在拉煤的人多得很。", "不行，不打的话吃两块，要是打我的话就吃三块，还要加一根骨头肉。", "没有挨打只能吃两块肉，不行，太便宜这小子了，我得想点办法。", "说到这儿我们笑得都喘不过气来了。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "不行，不打的话吃两块，要是打我的话就吃三块，还要加一根骨头肉。", "n": "童年的讨价还价实为心理较量雏形，双方试探底线、看谁先让步。"}, {"p": "損失厭惡（割肉）", "a": "万一打怎么办？这可是值钱的东西，肯定会打的。", "n": "怕挨打的痛苦预期超过修钟责任，恐惧驱动两人互相推诿。"}, {"p": "認知失調／合理化", "a": "没有挨打只能吃两块肉，不行，太便宜这小子了，我得想点办法。", "n": "老三把骗肉吃合理化为对方占便宜，用自欺压下愧疚。"}, {"p": "孤獨與異化", "a": "两个儿时的同伴就坐在我们小时候一起走过的这条山道上，聊起了我们小时候念书的快乐时光。", "n": "主角独行夜路追忆童年，借旧友旧事寻回温暖，反衬成人世界的孤寂疏离。"}]}, {"i": 57, "title": "第五十七回　别却青苗入市寒", "kind": "hui", "summary": ["深夜歸家，父親摸頭問「是你嗎」，一夜長談又提媳婦，主角睏倦倚牆睡去。", "夥伴清晨喚醒，白天下地夜裡吹牛，過了最開心、最輕鬆的幾天，暫別股海得以喘息。", "3月13日轎車進村，原非領導視察，而是小張帶浙江資金虧損者上門跪求相助。", "胖男人跪地哭求「有些錢我虧不起」，主角恪守不碰私人資金之原則，令其縣城等候。", "別離故土，自問離開黃土地「不知是毀滅還是創造」；象徵生命的綠色，在股海中卻最令人畏懼。"], "qa": [{"q": "主人公半夜十点多回到家时，父亲见了他有什么反应？", "a": "父亲已睡，窑洞漆黑一片，主人公叫门后，父亲看到是他，用手摸着他的头问：“是你吗？”随后父子俩在热炕上说了一夜的话。"}, {"q": "胖男人跪地哭喊“有些钱我亏不起”，反映了什么心理？", "a": "典型的损失厌恶：赔钱的痛苦远大于赚钱的快乐，他把亏欠他人的钱视为“输不起”的账，痛苦被进一步放大，甚至超过倾家荡产的恐惧。"}, {"q": "“倾家荡产没有关系，但是有些钱我亏不起”——这背后是什么心理账户现象？", "a": "同样是一块钱，自有资金与亏不起的钱（别人的、借来的）被划入不同心理账户；后者一旦亏损，心理代价远高于前者，所以宁可倾家荡产也不肯亏欠。"}, {"q": "亏损者为何不惜千里寻到山村、跪求“老师”相助？", "a": "专家崇拜与过度自信的投射：散户亏损后把翻本希望寄托于高手“老师”，迷信有人能救自己，却回避了亏损本源于自身决策失误这一事实。"}, {"q": "父亲说到媳妇的事情时，主人公“不知道为什么那么地瞌睡”，如何解读？", "a": "这是无意识的逃避：对无法面对的话题以困倦入睡来回避，也是长期股海高压之下，对家庭责任与乡土期待的一种心理退缩。"}, {"q": "主人公说离开黄土地“不知道我是在毁灭还是创造”，反映了他怎样的心理状态？", "a": "职业投资人的孤独与异化：他与土地、与传统生活彻底疏离，对自身职业的意义产生怀疑，陷入“我究竟在做什么”的自我认同迷茫。"}, {"q": "为什么“象征生命的绿色”在股市里成了“最害怕的颜色”？", "a": "职业异化颠覆了自然价值：绿色代表下跌与亏损，市场条件反射已浸入他的知觉，使象征生命的颜色被赋予了相反的恐惧含义。"}, {"q": "主人公为什么坚决拒绝浙江资金，连水也不让进家喝？", "a": "“从来不做私人的资金”既是规定也是他信奉的原则，守住职业边界以防卷入不可控的资金纠葛，也避免被亏损者的情绪与哀求绑架。"}, {"q": "主人公最终给了小张什么答复？", "a": "考虑很长时间后，他把小张叫到一边，让他们先走、在县城等他；小张要留一部车子给他，他婉拒说不用，自己能到县城。"}, {"q": "归家几天的轻松与回都市的“压抑窒息”形成对比，说明了什么？", "a": "故土淳厚的生活是主人公的心理疗愈之所，给了他“最开心、最轻松”的几天；而喧嚣的股市都市则是持续消耗其心智的压力场域，离开即重返窒息。"}], "quotes": ["当父亲看到站在他面前的是我的时候，用手摸着我的头说：“是你吗？”", "老师，你救救我，我倾家荡产没有关系，但是有些钱我亏不起啊！", "父亲不停地给我说这说那，最后还是说到媳妇的事情，我回到家不知道为什么那么地瞌睡", "我现在离开了黄土地在干什么，我不知道我是在毁灭还是创造，总之这一切都跟淳厚的黄土地是不相干的啊！", "但是这个很能够激起人们热爱生活、象征生命的绿色，在我的那个行当里，在那个喧嚣的缺乏绿色都市里，却是人们最害怕的颜色。"], "psych": [{"p": "損失厭惡（割肉）", "a": "老师，你救救我，我倾家荡产没有关系，但是有些钱我亏不起啊！", "n": "虧損者寧可傾家蕩產也不肯虧欠他人之錢，賠錢的痛苦被放大到極致。"}, {"p": "心理帳戶／開戶潮", "a": "他们就是上次浙江的那些资金，托人找到领导的，希望能够得到帮助", "n": "自有資金與虧不起的錢分屬不同心理帳戶，主角拒絕為這筆資金操盤。"}, {"p": "專家崇拜／過度自信", "a": "小张显得很为难，但是还是走过去跟那些人说了半天，忽然有一个胖乎乎的男人，冲过来扑通一下跪在我面前哭道：“老师，你救救我，我倾家荡产没有关系，但是有些钱我亏不起啊！", "n": "虧損散戶把翻本希望寄託於「老師」，迷信高手能救命卻不問虧損本源。"}, {"p": "孤獨與異化", "a": "我现在离开了黄土地在干什么，我不知道我是在毁灭还是创造", "n": "職業投資人離開土地與傳統生活，對自身意義產生疏離與自我懷疑。"}]}, {"i": 58, "title": "第五十八回　山村歸途念姐恩", "kind": "hui", "summary": ["主角歸鄉，父親既傷心又高興；他強忍離愁不露情緒，顯露歷經磨礪後的內在異化。", "憶起身世：養母早逝，父親買羊以羊奶餵養，親情在貧困中傾盡全力的心理刻畫。", "大姐出嫁哭成淚人、二姐以身護弟挨打，主角默默立誓幹大事，是童年心理較量的起點。", "姐夫以「我娃他舅本事大」為榮，折射鄉村以城裏身份為榮的攀比群體心理。", "牆上滿是主角的照片，姐姐思念如母；主角落淚之際，顯露親情虧欠與孤獨異化的交織。"], "qa": [{"q": "父親看到遠去的汽車時，心情為何既傷心又高興？", "a": "傷心是因兒子又要離開；高興是因兒子受單位器重，竟有城裏人遠道來到偏僻小山村找他。既捨不得又引以為榮，是複雜的親情心理。"}, {"q": "主角「也很難受，但是沒有流露出一點傷心的情緒」，這說明他怎樣的心理？", "a": "他把悲傷深藏心底，用平靜掩蓋離愁，是長期獨自承受壓力養成的隱忍；正如歷經股市沉浮的職業人，習慣了不把軟弱示人，內心日漸疏離。"}, {"q": "養母去世後，父親買羊用羊奶餵主角，這個細節反映父親怎樣的心理？", "a": "貧困喪妻、幼子待哺，父親無力延醫，只能傾其所有買羊救兒，把全部希望寄託在保住孩子的命上，是無助之下的孤注一擲與深沉父愛。"}, {"q": "大姐出嫁那天為何哭成淚人？父親不讓主角送親對大姐有何影響？", "a": "大姐不放心年幼的主角和沒有母親的家庭，哭得跟淚人一樣；父親怕路上哭鬧不讓主角送行，她臨走前抱著主角放聲大哭，掛念愈深、離愁愈重。"}, {"q": "二姐以身護弟挨打時，主角為何「一直沒有吭聲」？他立下什麼誓言？", "a": "他見二姐受驚而難過，卻把委屈與憤恨咽進肚裏，沉默不語；心中立誓長大一定要幹大事，不讓父親和姐姐再吃苦、再受欺負，隱忍化為奮發動力。"}, {"q": "父親對主角的期望是「要麼開拖拉機，要麼當村長」，這反映他怎樣的心理？", "a": "父親眼中最好的未來是像姐夫一樣有手藝，或當個隊長，期望樸實而固定；反映鄉村生活中以身邊榜樣為參照、不敢奢望更遠前程的定式心理。"}, {"q": "姐夫為何總向別人誇「我娃他舅本事大，在大城市工作」？", "a": "他把主角當親弟弟，也以城裏親戚為榮，逢人便誇；這種攀比式炫耀既有真摯自豪，也折射鄉人把「城裏人」視為成功符號的群體心理。"}, {"q": "主角看到牆上大部分是自己的照片，為何「眼淚不由自主地掉了下來」？", "a": "姐夫傾盡特產款待，牆上滿是自己的照片，他感到家人待己如親子、思己如念子，卻因長年在外無法回報而愧疚，眼淚是虧欠與感動交織的流露。"}, {"q": "姐姐對主角的思念「不亞於一個母親思念遠在他鄉的兒子」，說明什麼？", "a": "姐姐把大半生情感都投入這個弟弟身上，年齡越大牽掛越深，連颳風下雨都怕他受苦；情感投入越深越放不下，如同無法收回的心血，愈積愈濃。"}, {"q": "綜合本章，主角的童年經歷可能對他日後的性格產生什麼影響？", "a": "幼年喪母、姐姐護佑、立誓幹大事，使他重情而隱忍、自強而不示弱；這種「有淚不輕彈」的孤獨型人格，與職業投資人獨自承受盈虧的異化狀態一脈相承。"}], "quotes": ["这时候的我也很难受，但是我没有流露出一点伤心的情绪", "我长大一定要干大事，一定不会让我的父亲和姐姐再吃苦，再受人家的欺负。", "为了能让我活下来，父亲便买了一只山羊，用羊奶喂我。", "他总是因为有我这样一个弟弟而自豪，经常跟别人提起：“我娃他舅本事大，在大城市工作。”", "姐姐想我的那种心情不亚于一个母亲思念远在他乡的儿子"], "psych": [{"p": "孤獨與異化", "a": "这时候的我也很难受，但是我没有流露出一点伤心的情绪", "n": "主角強忍離愁不露情緒，見歷經城市與股市磨礪後情感收斂、與家鄉日漸疏離的內在異化。"}, {"p": "心理較量（看誰先崩潰）", "a": "我当时看到二姐受惊的样子心里很难过，我发誓一定要报仇，一定要对二姐好，我一直没有吭声，心里默默地在想：“我长大一定要干大事，一定不会让我的父亲和姐姐再吃苦，再受人家的欺负。", "n": "童年受欺他沉默隱忍、暗下誓言，是與命運比誰先崩潰的心理較量。"}, {"p": "攀比與暴富敘事", "a": "他总是因为有我这样一个弟弟而自豪，经常跟别人提起：“我娃他舅本事大，在大城市工作。”", "n": "鄉人以城裏親戚為榮四處炫耀，攀比心理把城市身份當作成功的符號。"}, {"p": "沉沒成本", "a": "姐姐随着年龄的增长对我的思念也越强", "n": "姐姐把一生心血投注於弟弟身上，付出愈多愈放不下，猶如無法割捨的沉沒成本。"}]}, {"i": 59, "title": "第五十九回　村口望断慈父影", "kind": "hui", "summary": ["親情博弈的暗湧：姐姐以煎湯麵與省錢的叮嚀留住“我”，家常話裡盡是不捨的試探。", "父親的克制戰術：以“拿公家的錢就要幹活”催“我”歸隊，把不捨壓進沉默寡言之中。", "主角的內在異化：事業與孝道撕扯，“我”恨自己把父親拋在破窯洞，只身去追那狗屁事業。", "臨別感與死亡焦慮：不敢看父親顫巍巍的身影與期待眼神，怕歲月與生死終將帶走他。", "村口拐角的隱忍默契：父子都強忍眼淚，怕對方帶著包袱離開，孤獨的守望自此開始。"], "qa": [{"q": "父親催“我”回單位說的“拿公家的錢就要幹活”，在心理博弈上起了什麼作用？", "a": "他以“公家的錢”這道義名分替“我”做了決定，把不捨壓進沉默寡言裡：既讓兒子安心歸隊，也以克制守住淚水，是替對方著想的心理退讓。"}, {"q": "“我”為什麼拼命往箱子裡裝父親準備的東西？這背後是什麼心理？", "a": "知道這是父親的心，拿得越多父親越高興，於是借多裝物品替父親儲存心意；也借忙碌收拾的動作逃避離別情緒，是轉移注意與情感補償。"}, {"q": "姐姐勸“我”省錢娶媳婦、父親叮嚀婚姻大事，家人為何反覆催婚？", "a": "婚姻在家人眼裡是“我”落地生根的歸宿，是讓二老放心的心理錨點；催婚實為對遠行遊子的牽掛與託付，盼兒子安頓下來不再漂泊。"}, {"q": "“我”為何斷定轉過拐角後父親才開始哭？這體現了怎樣的默契？", "a": "父親很堅強，不願兒子帶著包袱離開，送行時強忍淚水；轉過拐角彼此看不見了才敢哭。父子都以隱忍保護對方，是心照不宣的情感博弈。"}, {"q": "姐姐說父親夜裡常聽到敲門聲而驚醒，這反映父親怎樣的心理狀態？", "a": "長期分離令父親把“兒子歸來”內化成執念，連夜半敲門聲都當作兒子回家，日日站在村口守望，是孤獨老人思念成疾的心理寫照。"}, {"q": "“在父親的心裡兒子就是一切。可是在兒子的眼裡，父親能占多少啊！”道出了什麼？", "a": "道出親情投入的不對稱：父親視兒子為全部，兒子卻被事業佔滿身心。主角由此看清自己的異化與虧欠，繼而罵自己“真不是東西”。"}, {"q": "“我”為何罵自己“我他媽的真不是東西”？這屬於什麼心理？", "a": "事業與盡孝衝突之後，主角以強烈自責清算自己，把“狗屁的事業”貶為與父親無關的執念，是道德愧疚與認知失調後的自我審判。"}, {"q": "父親為何沉默寡言，不多問“我”的事？", "a": "父親把千言萬語嚥下，怕多問徒添兒子牽掛，只在煤油燈下默默收拾行李，以行動代替言語，是克制型、行動型的愛的表達。"}, {"q": "“我”為什麼不敢看父親顫巍巍的身影和滿懷期待的眼神？", "a": "父親的身影與眼神照見歲月流逝與即將到來的別離，也照見自己的虧欠；不敢看是回避喪失感與愧疚，是死亡焦慮下的逃避機制。"}, {"q": "姐姐說住店被人“宰”，“我”回說“錢都是公司的”，透露出什麼心態？", "a": "以“反正是公司的錢”為花銷開脫，回避與家人談論自己的真實處境，也維持體面，是逃避交代、自我合理化的心理。"}], "quotes": ["父亲说：“做饭去吧，待在家里干什么？单位有事情就要做的，拿公家的钱就要干活的。”", "我知道这是父亲的心，我拿得越多父亲就会越高兴。眼泪模糊了我的眼睛", "父亲是一个很坚强的人，他不愿意我带着包袱离开他", "在父亲的心里儿子就是一切。可是在儿子的眼里，父亲能占多少啊！", "我他妈的真不是东西！！！"], "psych": [{"p": "孤獨與異化", "a": "在未来的日子里只有父亲一个人孤单单地在这个窑洞里生活", "n": "事業與親情兩端，父親陷於孤獨守望，主角亦與家漸行漸遠，雙向異化。"}, {"p": "道德衝突／罪疚感", "a": "我恨我自己不是东西，把父亲一个人扔在这个破窑洞里，无依无靠", "n": "事業與盡孝的拉扯令主角反覆自責，以強烈罪疚清算對父親的虧欠。"}, {"p": "死亡焦慮", "a": "我不敢看父亲颤巍巍的身影，更不敢看父亲满脸期待的眼神", "n": "父親衰老的身影與期待眼神，喚起主角對歲月與喪失的隱隱恐懼。"}, {"p": "認知失調／合理化", "a": "我恨我自己，我真的恨我自己，那时候为什么要干什么狗屁的事业，父亲辛苦抚养我长大不知道为什么？", "n": "既投身事業又覺虧欠父親，主角貶斥事業以緩解矛盾，是典型的自我調和。"}]}, {"i": 60, "title": "第六十回　黄浦江畔夜布局", "kind": "hui", "summary": ["主角怒斥逆勢死扛的團隊，賭徒式自信終將被市場趨勢碾壓。", "黃浦江邊的自白暴露職業投資人的孤獨，繁華都市裡他找不到歸屬。", "泡澡後研究走勢，看穿全場觀望、無人認輸的集體心理僵局。", "大資金撤走、強勢資金死扛不出，損失厭惡令各方都等對方先崩潰。", "兩小時內布下冷酷之局，莊家以算計人性貪婪與恐懼為職業樂趣。"], "qa": [{"q": "主角怒斥小張「和市場趨勢對著幹」，從心理學看他們犯了什麼錯？", "a": "這是賭徒式的過度自信：把自我判斷置於市場趨勢之上，逆勢死扛、拒不認錯，在主角眼中這不是勇氣，而是找死。"}, {"q": "「上漲沒人追、下跌沒有人出」反映市場什麼群體心理？", "a": "典型的觀望與心理較量：大家都不認輸，誰也不肯先出手，人人等候最後結局，比的是誰的心理先崩潰。"}, {"q": "大資金撤走、有實力的資金卻「不願意認輸出場」，體現哪種心理？", "a": "損失厭惡：寧可死扛也不承認虧損，賠錢的痛苦令強勢資金也無法理智地割肉離場。"}, {"q": "主角自認布局「足以顯示人類本性的殘忍」，反映莊家什麼心態？", "a": "情緒操縱的職業心態：他享受算計眾人貪婪與恐懼的過程，把人性弱點當作可以佈局的獵場。"}, {"q": "主角為何說「不能失去這個能夠讓我舒展自己人性的戰場」？", "a": "孤獨與異化：職業習慣使他只有在博弈中才感到興奮與存在，戰場成了他唯一能舒展人性的地方。"}, {"q": "主角站在黃浦江邊為何感到疏離、找不到歸屬感？", "a": "他自認只是匆匆過客，繁華都市的博弈生活無法安放內心，每次想到歸屬都想起千里之外的小山村。"}, {"q": "胖男人用「假惺惺」的客套挽留，是生意場什麼心理伎倆？", "a": "以熱情關懷包裝的軟性施壓，想用人情攻勢拖延主角決策，主角識破後斥其別再表演，拒絕被情緒操縱。"}, {"q": "散戶「根本看不明白市場發展的趨勢」，說明散戶處於什麼心理狀態？", "a": "羊群效應下的迷茫：缺乏獨立判斷，只能隨大流觀望，被大資金與強勢資金的心理較量裹挾。"}, {"q": "主角為什麼執意不在縣城住宿、連夜趕回上海？", "a": "資料不全無法決策，他拒絕在信息不足時下注，寧可連夜趕路也要回到能掌握完整資料的戰場。"}, {"q": "「上海灘這個冒險家的樂園」象徵什麼？與主角有何對照？", "a": "象徵充滿暴富敘事與悲歡離合的競逐之地；別人在此逐利搏殺，主角卻自比過客，心中只有山村的歸屬。"}], "quotes": ["他妈的，真是王八蛋，这样做下去肯定是找死，和市场趋势对着干，你以为你是谁啊？", "上涨没人追下跌没有人出，这是一种典型的观望状态", "大资金基本上都已经撤走，但是那些相对而言还是具有实力的资金不愿意认输出场", "我不能失去这个能够让我舒展自己人性的战场。", "这个布局和设想足以显示人类本性的残忍"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "人们那种不愿意认输的情绪上涨没人追下跌没有人出，这是一种典型的观望状态", "n": "全場互相觀望、無人認輸，正是比誰心理先崩潰的僵局。"}, {"p": "情緒操縱", "a": "这个布局和设想足以显示人类本性的残忍", "n": "莊家算計眾人的貪婪與恐懼，以佈局操控市場情緒。"}, {"p": "孤獨與異化", "a": "我不能失去这个能够让我舒展自己人性的战场。", "n": "職業投資人只在戰場中舒展人性，日常生活已然異化疏離。"}, {"p": "損失厭惡（割肉）", "a": "那些相对而言还是具有实力的资金不愿意认输出场", "n": "有實力的資金也不願認輸割肉，印證賠錢之痛令人死扛。"}]}, {"i": 61, "title": "第六十一回　暗燈哀樂布虛實", "kind": "hui", "summary": ["主角銷假歸來按兵不動，等十足把握才向領導攤牌，戰前氛圍肅穆如臨大敵。", "領導礙於情面應允資金，主角直言市場必須有人買單，「大家」的定義因人而異。", "向資金老闆保證一成五淨利，附帶分紅與不得過問條件，金錢契約全是心理籌碼。", "一杯酒、暗燈與哀樂瀰漫，座右銘「能微笑麼」點破市場只有痛苦煎熬，戰前空虛是職業異化的徵兆。", "教小張虛虛實實兵法：輕漲吊高散戶期望卻絕不給機會，示範效應帶動人氣，指數上漲近四十點。"], "qa": [{"q": "主角這次回辦公室，距離上次出現已經多久？眾人見到他為何驚訝？", "a": "快半個月沒見面，大家看到他突然出現都很驚訝，急忙打招呼；他自己也覺得不自在，說跟待在莊稼地裡的感覺不一樣。"}, {"q": "主角說市場「根本不可能做到各方面都滿意」，這句話點出市場的什麼本質？", "a": "市場是零和博弈，必須有人買單才能成交；莊家的「大家」與散戶的「大家」定義不同，利益永遠不可能皆大歡喜。"}, {"q": "主角向資金老闆保證15％淨利潤，附帶了哪兩個條件？為何要這樣安排？", "a": "一是小張與報單姑娘各分紅1.5％作為應得酬勞，二是運作期間老闆不得詢問或建議；把資金全權交予操盤手，才能不受干擾、按計畫佈局虛實。"}, {"q": "主角每次資金運作之前都會感到「心裡空蕩蕩的」，這種反應說明了什麼？", "a": "這是他的戰前必然反應，明知故犯的孤獨與不確定感，顯示職業操盤手長年高壓、輸贏自負之下，內心已趨向疏離與異化。"}, {"q": "座右銘「能微笑麼」揭示了市場的什麼心理本質？", "a": "市場沒給任何人留下微笑的機會，能有的只是痛苦和煎熬；每天如趕考般不知明日試題，洋洋得意時市場馬上就會教訓你，理智冷靜才是生存的基本條件。"}, {"q": "一杯酒、暗色燈與瀰漫的哀樂，開頭場景渲染了什麼心理氛圍？", "a": "以葬禮般的哀樂與暗燈渲染末日感，暗示股市如生死場；莊家每次操盤都如赴一場不知輸贏的喪禮，死亡與不祥的氣氛揮之不去。"}, {"q": "小張猜主角會「大幅度拉升」，主角為何說這樣做會失敗？", "a": "3月7日拉升的失敗與8日的百點上影線，證明市場裡的人都很聰明；他若大漲正好迎合散戶「再漲一下就走人」的出貨思路，成交量不放大是因大家已經警覺。"}, {"q": "主角說「要把他們吊起來」，這是什麼心理戰術？", "a": "情緒操縱——用輕微上漲讓散戶把期望值再提高一點，卻絕不給兌現的機會；先吊足胃口再收網，讓眾人上套而不自知。"}, {"q": "「下跌前一定要做出向上的架式讓眾人上套」，體現了怎樣的博弈心理？", "a": "心理較量與兵法虛虛實實——故意擺出上攻架式騙散戶誤判方向，比的是誰先看穿對方、誰先崩潰，且絕不低估小資金者的智商。"}, {"q": "價格回落到今天漲幅的上2/3時，主角為何下令再次強力買進？", "a": "他把回檔位置當作心理支撐位，在此托住跌勢、快速拉回，穩定人氣後反覆震盪，上午幾乎持續創新高，指數上漲近四十點。"}], "quotes": ["一杯酒、一盏暗色的灯，整个空气里弥漫着哀乐⋯⋯", "这个市场没有给任何人留下微笑的机会，能有的就是痛苦和煎熬。", "他们都是想着担心，但是又舍不得走，就是想着再涨一下就走人", "我要把他们吊起来，今天轻微的上涨，让他们把自己的期望值再提高一点，但是我绝对不会给他们机会的，你明白吗？", "但是我们在下跌前一定要做出向上的架式，让这些人上套，这样才能顺利地实现自己的计划，兵法讲的虚虚实实就是这个意思"], "psych": [{"p": "情緒操縱", "a": "我要把他们吊起来，今天轻微的上涨，让他们把自己的期望值再提高一点，但是我绝对不会给他们机会的", "n": "莊家先吊高期望再拒絕兌現，是典型的情緒操控手法。"}, {"p": "心理較量（看誰先崩潰）", "a": "但是我们在下跌前一定要做出向上的架式，让这些人上套，这样才能顺利地实现自己的计划", "n": "下跌前擺出上攻架式騙散戶入套，比的是誰先看穿對方。"}, {"p": "處置效應", "a": "他们都是想着担心，但是又舍不得走，就是想着再涨一下就走人", "n": "散戶被套後捨不得割肉、總想再漲就走，正是處置效應的寫照。"}, {"p": "死亡焦慮", "a": "一杯酒、一盏暗色的灯，整个空气里弥漫着哀乐⋯⋯", "n": "哀樂暗燈如葬禮，股市成了生死場，注解操盤手的末日焦慮。"}]}, {"i": 62, "title": "第六十二回　股海翻雲夜獨行", "kind": "hui", "summary": ["主角剖析市場兩類失敗者：大戶有思路卻受情緒控制，散戶無思路只會怨環境。", "炒股本質被點破：以價格變動操控大眾情緒，間接支配其行為按設定套路走。", "試盤時將拉升指令加倍，令憤怒者更怒、聰明人更信明天，誘使散戶進場。", "猛烈拉升後放手自由交易，羊群效應擴散，其他股票亦現搶盤，莊家控節奏。", "收盤後獨行鬧市忽感孤獨，無友可訴、戰友難尋，操控市場者自身亦被異化。"], "qa": [{"q": "主角為何說樓上的大戶與樓下的散戶都是「失敗者」？他們各自敗在何種心理？", "a": "大戶有思路卻控制不了情緒，明知風險仍把希望寄託在明天；散戶毫無思路，輸了只怪別人與環境，從不檢討自己，浮躁懶惰又不學習。兩者皆被情緒而非理性支配。"}, {"q": "主角認為「炒股」的祕訣是什麼？這體現了何種心理戰術？", "a": "利用股價變動控制大眾情緒、間接支配其行為，讓其情緒始終處於莊家控制中，行為便按事先設計好的套路走。這正是情緒操縱：以行情漲跌作為操控人心的武器。"}, {"q": "上午大廳散戶罵莊家「神經病」，反映了什麼群體心理？", "a": "散戶把漲跌歸咎於莊家反覆無常，只會責怪外部而不反思自身，顯示其缺乏思路、怨天尤人的心態；行情一變情緒即劇烈波動，是典型的認知失調與外歸因心理。"}, {"q": "大戶說「只要把昨天的陰線吃掉就好了」，體現什麼心理現象？", "a": "以昨日陰線為心理支撐位與參照點：行情吃掉陰線即確認漲勢成立，眾人便敢進場。這種對歷史價位的執著正是錨定效應，也讓莊家易於借位造勢、操縱預期。"}, {"q": "大戶明知風險卻說「有得賺總比虧損好」，暴露何種心理？", "a": "急於在獲利時兌現、生怕到嘴的利潤溜走，反映處置效應：對小利斤斤計較、不敢讓利潤奔跑；同時把希望寄託在明天，情緒主導決策而無法理性離場。"}, {"q": "試盤時主角為何把助手的指令「乘2」？其心理用意何在？", "a": "因為小幅推升太慢，必須大幅度拉升，讓那些憤怒的人更加憤怒，讓聰明人更相信希望就在明天甚至後天，以劇烈漲勢調動兩類人的情緒，誘使他們按莊家節奏進場。"}, {"q": "價格猛烈上漲後，主角為何放慢買進、任價格自由交易？", "a": "讓所有老百姓都來參與這場爭鬥，其他股票也隨之出現搶盤，羊群效應蔓延使散戶接力推升；莊家不再自買，改由大眾的情緒與從眾行為維持行情並從中脫身。"}, {"q": "主角吩咐小張去新世界咖啡屋感受氣氛，目的何在？", "a": "藉實地觀察散戶聚集之地的氣氛，判斷市場情緒的溫度與群體心態，再據以定明日對策，顯示他永遠先讀人心、再定戰術的操盤習慣。"}, {"q": "章末主角為何「忽然感到很孤獨」？這與其職業有何關聯？", "a": "他幾乎沒有朋友，行業內的兄弟只能算戰友；整天算計與操控他人情緒，卻無人可訴，職業生涯使其與常人疏離，孤獨感自童年延續至今，正是職業投資人的異化。"}, {"q": "當天下午收盤時的結果如何？", "a": "整整一個下午助手把節奏控制得很好，到收盤時價格比昨天整整高了30%，大盤在最後收盤時也收在最高點，拉升策略獲得圓滿效果。"}], "quotes": ["我们要做的就是利用股票价格变动来控制这些人的情绪，然后间接地支配他们的行为，让他们的情绪一直处于我们的控制之中，那么他们的行为也就会一直按照我们事先设计好的套路走，这就是炒股，知道了吗？", "他妈的，这庄家是神经病啊？昨天还是下跌今天一下子就涨起来了，跟前段时间比越来越难做了啊。", "只要把昨天的那个阴线吃掉就好了，不管怎么说这次涨起来我要跑了，有得赚总比亏损好。", "在他的带动下，其他股票也开始出现了抢盘的现象，他立即放慢了买进的速度和频率，让价格处于自由交易的状态，让所有的老百姓都来参与这场争斗。", "这时候我忽然感觉到很孤独，我几乎没有什么朋友，除过行业内的那几个兄弟，也只能算是战友了，根本找不出谁是我的朋友，我感觉自己活得很没有意思"], "psych": [{"p": "情緒操縱", "a": "我们要做的就是利用股票价格变动来控制这些人的情绪，然后间接地支配他们的行为，让他们的情绪一直处于我们的控制之中", "n": "主角直言炒股本質即操控大眾情緒、支配其行為，為全章心理戰術之綱。"}, {"p": "追漲（貪婪）", "a": "看起来涨势还是不错，是不是行情又开始了？", "n": "漲勢乍起大戶便壓不住追進衝動，貪婪蓋過已知的風險。"}, {"p": "羊群效應（從眾）", "a": "在他的带动下，其他股票也开始出现了抢盘的现象，他立即放慢了买进的速度和频率", "n": "單股猛漲帶動全場搶盤，莊家放手任散戶從眾接力、自相爭鬥。"}, {"p": "孤獨與異化", "a": "这时候我忽然感觉到很孤独，我几乎没有什么朋友，除过行业内的那几个兄弟，也只能算是战友了", "n": "能操控萬千情緒的莊家自身卻無友可訴，職業使人與人、與己雙重疏離。"}]}, {"i": 63, "title": "第六十三回　月临黄浦夜藏锋", "kind": "hui", "summary": ["主角倦於單調高壓的炒股生涯，自比「家庭主婦綜合徵」，孤坐黃浦江邊望月，職業人的疏離感油然而生。", "散戶與電視專家一致看好後市，姓楊者一呼百應、附和者眾，群體氛圍壓倒個別異見，正是羊群心理的寫照。", "小張欲推高四成再出貨，主角斷其逆勢：兩日漲兩百點只會激起恐懼，跟風盤不足必致散戶反身出逃。", "主角定下砸盤吸籌之計：先衝高再猛砸三百點，趁散戶樂極生悲、目瞪口呆之際，在低位大批接貨攤低成本。", "主角以「順勢而為」為行當護身符，斥散戶不懂遊戲規則卻談股儼然百年老者，盡顯莊家的心理操縱之道。"], "qa": [{"q": "主角形容自己的疲勞狀態在心理學上叫什麼？為何他自認比家庭主婦更容易疲勞？", "a": "叫「家庭主婦綜合徵」，源於工作和生活幾乎沒有區別；他認為自己這種單調而高壓的工作，一定比家庭主婦的枯燥工作更容易產生疲勞。"}, {"q": "小張匯報的市場氛圍呈現出怎樣的群體心理？", "a": "散戶對後市普遍樂觀，姓楊者很有號召力，一說「這是新一輪行情的開始」附和者眾；電視上的專家與主持人觀點幾乎一致也是看好——典型的羊群效應與群體極化。"}, {"q": "主角為何斷定小張「兩天推高200點」會適得其反？", "a": "因為跟風盤本就不多且普遍有顧慮，兩日漲200點無吸引力、成交量跟不上；對有炒股經歷的人這是最不好的信號，他們會反身出逃，而且漲太快只會讓人產生恐懼而非熱情。"}, {"q": "主角的砸盤計劃運用了什麼心理戰術？", "a": "開盤衝高後猛砸三百點，打散戶一個措手不及：趁其高興的心情尚未轉成衝動，用巨大的恐懼令其目瞪口呆、失去理智交出籌碼，莊家則在下方大批量接貨。"}, {"q": "主角說「跌了以後心裡也就踏實了」，他如何利用散戶這種心理？", "a": "他指出散戶無非是怕跌，跌過之後心裡反而踏實；此時再發動行情，他們跟風的意願就比較強烈，四百點漲幅誰也不會料到是出貨，正利用了散戶的心理支撐需求。"}, {"q": "「看多不做多」揭示了散戶什麼真實心態？", "a": "他們嘴上看好實則想做空，只是選擇一個更好的做空位置而已，並非真心做多；若是真心做多，今日成交量必然很大，價格也就不會只是那麼一點點。"}, {"q": "主角為何把「順勢而為」視為行當的生存護身符？", "a": "因為不管資金實力多大都必須遵從市場規律、順勢而為；失敗的人大都不遵從此戒律，把自己的實力看得過於重要，小資金之所以失敗正是太把自己當回事。"}, {"q": "主角諷刺散戶不懂哪些基本規則？這反映什麼心理？", "a": "散戶以為股票在證券公司買賣、把證券公司當成股票商店，連最基本的遊戲規則都不懂，談起股票卻儼然從業百年的老者——典型的過度自信與自我服務偏差。"}, {"q": "主角在黃浦江邊的月下獨白反映了他怎樣的心境？", "a": "他自感孤零零地置身人潮湧動的大上海，猜想古時是否也有人如此望月思考，孤獨與疏離的職業人生在滄桑江景與彎月下流露無遺。"}, {"q": "小張原計劃如何操作？為何主角認為它忽視了市場心理？", "a": "小張想再推高40%、周五開始大幅度出貨、下周前全部出來；主角指出他未看到跟風者顧慮未消，逆勢而為、沒把握到行為背後的實質，結果必然糟糕。"}], "quotes": ["我想这个月亮就这样挂了不知道多少年，在过去的上海，会不会也有一个人就这样孤零零地在人潮涌动的大上海，看着这弯月亮在思考⋯⋯", "这样打他们一个措手不及，高兴的心情还没有转换成冲动的时候，巨大的恐惧一定会让他们目瞪口呆，毫无思想。", "他们无非就是怕跌，跌了以后心里也就踏实了。我们再发动行情他们跟风的意愿就比较强烈，400点的涨幅谁也不会料到是出货行为。", "你不管资金的实力有多大，你都必须遵从市场的规律，顺势而为，历史上我们这个行当几乎把这一条看作是生存的护身符，没有人敢逾越这个戒律。", "他们连这些最基本的游戏规则都不知道，但是你听他们谈论股票的时候俨然是一个从事证券投资一百年的老者。"], "psych": [{"p": "情緒操縱", "a": "高兴的心情还没有转换成冲动的时候，巨大的恐惧一定会让他们目瞪口呆，毫无思想。", "n": "莊家先衝高再猛砸，用恐懼替換貪婪，令散戶失去理智交出籌碼。"}, {"p": "羊群效應（從眾）", "a": "那儿有个姓杨的，看起来很有号召力，他对后市尤其看好，认为这是新一轮行情的开始，附和的人也比较多。", "n": "散戶與電視專家一致看好，姓楊者一呼百應，市場氛圍被從眾心理主導。"}, {"p": "孤獨與異化", "a": "会不会也有一个人就这样孤零零地在人潮涌动的大上海，看着这弯月亮在思考⋯⋯", "n": "主角在人潮萬千中自感孤零零，職業投資人的疏離感在月下獨白中顯露。"}, {"p": "專家崇拜／過度自信", "a": "他们连这些最基本的游戏规则都不知道，但是你听他们谈论股票的时候俨然是一个从事证券投资一百年的老者。", "n": "散戶連基本規則都不懂卻儼然百年老手，正是過度自信的典型寫照。"}]}, {"i": 64, "title": "第六十四回　谣风催涨暗抛筹", "kind": "hui", "summary": ["謠言未經證實即令大眾亢奮，開盤高開六十點，信息瀑布推動追漲。", "主角不信傳言、堅守己見，趁大眾追高之機分批拋售，與群眾反向博弈。", "一上午拋出兩成持貨，主角視為意外收穫，冷靜中暗藏得意。", "怕消息證實後砸盤無路，主角壓縮出貨至三成，留回手餘地。", "消息市裡群體情緒被一條傳言牽動，主角以克制對抗從眾狂熱。"], "qa": [{"q": "主角早上看到了什麼消息？他為何難以相信？", "a": "他看見傳言稱新股發行額度有可能下降；此消息與他原來的思路不配合，又未經證實，他自然難以相信，只能將信將疑。"}, {"q": "這條傳言對投資大眾產生了怎樣的心理作用？", "a": "傳言成了投資大眾的一支強心劑，加深他們看好的信心，使群體情緒集體轉多、開盤踴躍買進——一條未證實的消息便能撬動全場預期。"}, {"q": "開盤高開六十點之後，市場為何後繼乏力？", "a": "指數瞬間上沖後沒有更多跟風盤，追高資金耗盡、缺乏持續跟進，羊群效應難以為繼，漲勢由亢奮轉為觀望，讓主角看清行情虛實。"}, {"q": "主角為何不跟大眾一樣追高？", "a": "他堅持自己的觀點，明白傳言未經證實，高開不過是大眾情緒的投射，因而把這次上沖看作分批出貨的良機，不為從眾氛圍所動。"}, {"q": "主角給報單員下達了什麼指令？結果如何？", "a": "每筆三萬股、不限價賣出，成交後緊跟著拋出下一筆；一個上午便從容拋出手頭持貨的百分之二十，堪稱意外的收穫。"}, {"q": "主角為何不敢貿然出手向下砸？", "a": "因為傳言一旦被證實，行情可能繼續走高，此時向下砸就是死路一條；他只能不緊不慢地交易，避免在真假未明時押上全部判斷。"}, {"q": "主角最終如何調整出貨方針？", "a": "仍以出貨為主，但把幅度控制在三成之內；即便判斷做反，回手再接也來得及，進退皆留有餘地，不把籌碼一次拋盡。"}, {"q": "本章中主角與投資大眾的心理博弈體現在哪裡？", "a": "大眾被傳言點燃、集體追高，主角卻冷靜逆向減倉——這是莊家與散戶之間「看誰先動搖」的心理較量，主角以對群體情緒的清醒判斷佔得先機。"}, {"q": "「回手再接也來得及」體現了主角怎樣的博弈心態？", "a": "他不求一擊全勝，而是控制出貨節奏與倉位幅度，確保判斷失誤時能反手接回，以心理與籌碼的雙重餘裕壓制對手，掌握主導權。"}, {"q": "主角如何看待上午出貨兩成這個結果？", "a": "他視之為「很了不起的意外收穫」：在缺乏跟風盤的高開行情中，能從容拋出五分之一持貨，已超出預期，冷靜背後暗藏得意。"}], "quotes": ["传言新股发行额度有可能下降。这个消息跟我原来的思路有点不配合，但是还是没有经过证实，很难相信。", "这个传言在一定程度上却对投资大众是一个强心剂，加深了他们的看好的信心。", "开盘居然高开60点，瞬间的上冲以后，没有更多的跟风盘", "每笔3万股，不限价卖出，成交以后紧跟着就抛出下一笔。", "这样即便是做反的话，回手再接也来得及。"], "psych": [{"p": "信息瀑布（謠言市）", "a": "传言新股发行额度有可能下降。这个消息跟我原来的思路有点不配合，但是还是没有经过证实", "n": "一條未經證實的傳言便牽動全場情緒，預期在傳播中自我實現，正是消息市的寫照。"}, {"p": "追漲（貪婪）", "a": "开盘居然高开60点，瞬间的上冲以后，没有更多的跟风盘", "n": "大眾被傳言激起的貪婪推高指數，卻缺乏跟風盤接續，追高注定後繼乏力。"}, {"p": "羊群效應（從眾）", "a": "这个传言在一定程度上却对投资大众是一个强心剂，加深了他们的看好的信心", "n": "眾人因同一條傳言集體轉多、一致看好，正是從眾心理下的群體一致行動。"}, {"p": "心理較量（看誰先崩潰）", "a": "我感觉我还是需要坚持自己的观点，应该趁这个机会大批量地卖出", "n": "主角不信大眾的亢奮，趁高開反向出貨，是一場比誰先動搖的心理較量。"}]}, {"i": 65, "title": "第六十五回　哀乐涤心探虚实", "kind": "hui", "summary": ["情緒跌入谷底，主角棄教助手、趕回酒店放哀樂獨飲，靠死亡樂章自淨心緒。", "從1976年聞哀樂之懼，到深圳高壓孤獨中以哀樂滌魂，職業生涯令其日益異化。", "高開低走收實體陰線，主角醒悟另有同路人在出貨，自省輕慢市場的過度自信。", "神乎其神的謠言令其迷糊一天——消息傳播極速、散戶爭相轉述，群體心理被操弄。", "認定唯有向下才能成功：散戶恐高心理須經一次釋放，此乃莊散間的心理較量。"], "qa": [{"q": "主角心情糟糕透顶时做了哪些事让自己平静下来？", "a": "他没有吃晚饭，赶回酒店打开哀乐、倒了一杯酒，闭上眼睛任头脑空荡荡，靠哀乐与酒精的作用让思路慢慢清晰起来。"}, {"q": "哀乐为何成为主角随身携带的唯一音乐？", "a": "深圳高压工作让他每天被孤独、寂寞、烦恼包围，现代音乐的浮躁雪上加霜；哀乐令他感到纯洁、灵魂仿佛得到净化，从此随身只带哀乐，还会不由自主地哼唱。"}, {"q": "主角1976年第一次听到哀乐时有何感受？", "a": "那是毛主席去世、人人悲声痛哭之时，他从广播里听到哀乐，那时听起来很害怕，总是感觉心里发紧——少年对死亡之声的本能恐惧。"}, {"q": "当日大盘走势如何？主角从中悟出了什么？", "a": "高开却下跌二十多点收盘，成交量不大但交易重心几乎都在上方，收出无上影线的实体阴线，他由此醒悟肯定有人在借势出货，自己不能大意。"}, {"q": "主角如何解释昨日上涨得那样顺利？", "a": "他冷静分析后认为昨日上涨不会是他一家所为，肯定还有一个思路相同的人在做同一个动作，否则凭他们的能力不会有那么大的能量。"}, {"q": "一个传闻为何让主角迷糊了整整一天？", "a": "因为这几天总希望助手做好，自己疏于关心盘面，缺乏对大盘走势的直接感受，遭遇意外便手忙脚乱——这正是轻慢市场、过度自信的代价。"}, {"q": "主角如何形容消息在市场上的传播速度？", "a": "他认为市场上没有任何东西比消息的流传速度更快，北京的一个小道消息传到深圳要不了一小时，营业大厅的散户还得意地转述，仿佛自己是救世主。"}, {"q": "消息传播之快反映了散户的什么群体心理？", "a": "散户争先恐后地向身边人炫耀“我有朋友传来消息”，满脸得意神色——这正是从众跟风与信息瀑布效应，谣言的扩散令预期自我实现。"}, {"q": "主角引用心理学如何定义恐惧？", "a": "他引用道：“恐惧是人们对预见的危险缺乏应对策略的一种本能反应”——想明白了、有了应对之策，也就不烦恼、不恐惧了。"}, {"q": "次日早上主角对走势作出何种心理判断？", "a": "他认为除非向下才能成功，再向上做多少都是死；人们这段时间的恐高心理需要一次释放，只有释放了这种情绪才能改变他——庄散心理较量的节奏。"}], "quotes": ["你要是胆敢轻视市场，它就会立即给你颜色看。", "恐惧是人们对预见的危险缺乏应对策略的一种本能反应⋯⋯", "人的心理本来就很奇怪，也很微妙，一旦在他的心里形成一种意识，这种意识很难在短时间内消失", "哀乐对生命的赞美我觉得是任何音乐都不能比拟的", "在这个市场上没有任何东西比消息的流传速度更快"], "psych": [{"p": "信息瀑布（謠言市）", "a": "在这个市场上没有任何东西比消息的流传速度更快，北京的一个小道消息要传到深圳要不了一小时", "n": "小道消息一小時傳遍兩地，散戶爭相轉述，謠言市裡預期自我實現。"}, {"p": "孤獨與異化", "a": "每天的高压工作，孤独、寂寞、烦恼等等不健康的情绪每天伴随着我", "n": "職業投資人在高壓孤獨中以哀樂為伴，內心與常人日漸疏離。"}, {"p": "死亡焦慮", "a": "打开哀乐，倒了一杯酒，闭上眼睛头脑空荡荡的，哀乐对生命的赞美我觉得是任何音乐都不能比拟的", "n": "以哀樂淨化靈魂、在生死樂章中求冷靜，透出濃重的末日感與死亡焦慮。"}, {"p": "心理較量（看誰先崩潰）", "a": "人们这段时间来的恐高心理需要一次释放，也只有释放了这种情绪以后你才能改变他", "n": "主力須先擊潰散戶恐高心理方能成事，比的是誰的心理先崩潰。"}]}, {"i": 66, "title": "第六十六回　股海沉浮一碗麵", "kind": "hui", "summary": ["開盤量能枯竭、股價直落，主角識破對手急於倒貨，分批接走紡機三萬股。", "急升一成後主角反手低拋並同步砸鋼管，紡機三分鐘內暴跌百分之七。", "主角重悟心理課：恐懼生應對策略、貪婪為繁衍動力，三年後方真正理解。", "市場眾人沉浸上漲夢想、不捨拋籌，主角午後照計劃拋售，收盤僅餘可憐下影線。", "盤後約兄弟攤牌免兩敗俱傷；盛宴後仍獨往麵館，異化中自認西北人。"], "qa": [{"q": "開盤股價直落、量能不出時，主角憑什麼判斷對方「沉不住氣」？", "a": "他吩咐分批買進三萬股，五分鐘內全部成交且價位比預計理想，證明對手急於一次倒掉三萬股、壓力太大，寧可便宜脫手也不願再等——這是庄家之間比誰先撐不住的心理較量。"}, {"q": "主角為何斷定「這一定是謠言了」？", "a": "他的單子迅速以理想價位成交，證明有人故意散布利好傳聞引他接盤，消息源正是對方。所謂利多是信息瀑布式的謠言，對方企圖用輿論操縱誘他上鉤。"}, {"q": "股價急升一成時，市場眾人為何不願拋出籌碼？", "a": "眾人仍沉浸於上漲夢想之中，捨不得手頭籌碼，貪婪使他們忽視風險、拒絕兌現，正好被主角當作對手盤——他的低拋與同步砸鋼管讓紡機三分鐘內暴跌百分之七。"}, {"q": "主角從心理課上記住了老師關於恐懼與貪婪的什麼觀點？", "a": "老師說恐懼與貪婪是人類進化的優點：恐懼使人學會預防與應對危險，貪婪是繁衍生息的原始動力；沒有它們的物種早已滅絕。三年後親歷搏殺，主角才徹底理解。"}, {"q": "主角為何說「課堂上的知識在三年後才能徹底理解」？", "a": "他親歷股市後才體會到：恐懼是面對危險缺乏應對策略時被動的自我保護，比失去理智的憤怒強得多。沒有這次經歷，他到死也不會真正懂——市場重塑了他的心理認知。"}, {"q": "收盤僅有一根少得可憐的下影線，主角由此看懂了什麼？", "a": "市場幾次反覆始終漲不起來，多方無力，只能勉強守住一線。他親歷多空反覆後，終於讀懂K線形態背後的心理含義：支撐勉強、人氣渙散。"}, {"q": "主角為什麼晚上要約兄弟「攤牌」？", "a": "他不願兩敗俱傷：去年起供給大增、今年民間高人亂出招、券商融資壯大資金，對手盤面複雜。攤牌是庄家間避免互相消耗的心理談判，比硬拼更划算。"}, {"q": "主角為何盛宴之後仍要獨自去吃一碗拉條子拌麵？", "a": "他在大場面中吃不飽，也不習慣被上海人同化的口味，唯有西北麵食讓他踏實。一個人到蘇州河邊吃麵，正是職業投資人精神孤獨、無法融入的異化寫照。"}, {"q": "上午「戰績不大但是心情比較好」，主角的好心情從何而來？", "a": "他終於有了策略、看清楚了方向：先試探對方底牌，再借市場貪婪反手砸盤，節奏盡在掌握。博弈中占據主動，比一時的盈虧更令他安心。"}], "quotes": ["恐惧确实是因为面对危险而缺乏应对策略的一种被动的自我保护行为。愤怒则是一种失去理智的表现，相比而言恐惧要比愤怒强得多。", "在上心理学课的时候，老师说：“恐惧和贪婪是人类的优点，正因为人有了这个优点所以才能在上万年漫长的进化中，优胜劣汰，很多物种在进化的过程中灭绝了，那就是因为他们没有恐惧和贪婪，恐惧可以使人学会预防危险以及面对危险的时候有了应对的策略，贪婪恰恰是人类能够得以繁衍生息的原始动力。”", "5分钟后我的单子全部被成交，而且比我预计成交的时间价格都理想很多，我明白了，消息就是从这儿来的，这一定是谣言了，对方迫不及待地想给我吃进，看来对方还是沉不住气，另外也能看出对方太着急压力太大", "看来市场上的人们还是处于那种梦想之中，不愿意也不舍得抛出自己手头的筹码", "市场经过几次的反复以后，最后还是没有能够涨起来，一直到收盘只有一个少得可怜的下影线，我这时候总算看懂了K线。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "对方迫不及待地想给我吃进，看来对方还是沉不住气，另外也能看出对方太着急压力太大", "n": "主角從對手急於倒貨讀出其壓力極限，庄家之間比的是誰先撐不住。"}, {"p": "情緒操縱", "a": "我明白了，消息就是从这儿来的，这一定是谣言了，对方迫不及待地想给我吃进", "n": "對手散布利好謠言誘他接盤，用輿論造勢操控市場情緒，是典型的誘多。"}, {"p": "追漲（貪婪）", "a": "看来市场上的人们还是处于那种梦想之中，不愿意也不舍得抛出自己手头的筹码", "n": "眾人沉醉於上漲夢想不捨兌現，貪婪使其甘冒回吐風險，反成庄家砸盤對象。"}, {"p": "孤獨與異化", "a": "我经常一个人到那儿去吃，单位上大部分是上海人，一些年轻一点的北方人也被同化", "n": "盛宴與同化氛圍中格格不入、獨自覓食，職業投資人的孤獨疏離躍然紙上。"}]}, {"i": 67, "title": "第六十七回　夜宴谋成独怅然", "kind": "hui", "summary": ["酒店九樓酒吧夜宴，主角對比家鄉貧窮與窗外燈紅酒綠，感慨「天上人間」。", "主角點破眾人心照不宣的「自留地」，斷言謠言必被澄清，主張順勢而為、人心不可違抗。", "定計先做向上假動作減倉，澄清一出砸破千點引恐慌拋盤，千點接貨後推高五百點全身而退。", "眾人統一思路後拿山子情變開涮：與上海女孩買房兩清，另交電台工作的四川女友，老胡成其大舅子。", "章末獨白：操盤群體與社會隔離而孤獨，憂金錢建立的婚姻脆弱，老父待傳宗接代，人海茫茫難覓妻。"], "qa": [{"q": "主角為何說「人心不可違抗」？他引用哪句古訓來闡釋？", "a": "他引用「水能載舟亦能覆舟」的古訓，自認幾人連李世民、朱元璋都比不上，面對的卻是成千上萬的投資人，唯有順勢而為、順應民心，才有活路。"}, {"q": "主角為何斷言「自留地」遲早出問題？", "a": "前兩年十幾隻股票時靠消息刺激尚可；如今消息與上面管理層的意思相反，謠言傳得太凶、影響大局，周六必有人澄清。他今天試買三萬股又賣還，深感此法又累又無效。"}, {"q": "主角的操盤計畫分幾步？請完整複述。", "a": "明日先做向上假動作，把手中籌碼做掉一半、自己持三分之一倉；澄清公告一出順勢猛砸，擊破1000點引恐慌拋盤，於千點大批接貨回補滿倉，再全力推高五百點全身而退。"}, {"q": "莊家為何要「擊破1000點的整數關」？這利用了散戶的什麼心理？", "a": "千點整數關是懸在投資人頭上的心理支撐與定錨，砸穿即擊潰信心、引發恐慌拋盤；莊家再於千點低吸回補，正是利用錨定效應與心理支撐位完成建倉。"}, {"q": "主角預期散戶在「翻本心態」下會有何反應？對應什麼心理現象？", "a": "他預期推高行情會刺激賭徒心理，散戶在強烈翻本心態支配下追漲，誤以為跌久必漲、急跌必反彈，此即賭徒謬誤，莊家恰好借此在高位出貨。"}, {"q": "「恐高意識」指什麼？莊家為何要「先砸後拉」？", "a": "恐高意識指高位累積的懼高心理。先猛烈下跌將其完全釋放，再全力以赴推高，令散戶覺得風險已出清、貪婪蓋過恐懼，從而在追漲中接盤。"}, {"q": "章末主角如何描述操盤群體？反映了他怎樣的心理狀態？", "a": "他說這是與社會隔離、外人難以進入的孤獨群體，自己還憂慮金錢之上的婚姻感情脆弱。這正是職業投資人孤獨、疏離與自我異化的心理寫照。"}, {"q": "主角說家鄉那點土地是「財富和自主權的象徵」，反映了他怎樣的心理？", "a": "他看透那點地收益不大，卻是財富與自主權的象徵，故兩家打得頭破血流；對比窗外「天上人間」的花花世界，可見他對貧富、階層與人性貪慾的洞察。"}, {"q": "老胡如何寬慰主角？這番話體現了什麼心態？", "a": "老胡說那是老天爺的造化、凡人無力改變，不如幹好自己的事、讓周圍人過上好日子。以「造化」合理化階層差距，是圈內人自我安慰式的認知失調。"}, {"q": "山子的感情變故是怎樣的？眾人為何拿此開涮？", "a": "山子覺得與上海小女孩不合適，買房就算兩清，另交一個在電台工作、算主持人非主播的四川女友；主角笑稱老胡成了他大舅子，以玩笑化解操盤的沉重。"}], "quotes": ["两家人为了10厘米宽的土地打得头破血流，其实那点地也不会有多大的收益，但是那可能是一种财富和自主权的象征，其实说到底还是太穷，这儿可以说是天上人间。", "搞自留地跟干社会主义还是有区别的。最大的区别就是政策和资金，因此现在最重要的就是学会顺势而为，人心不可违抗，古代的君王都遵循‘水能载舟亦能覆舟’的古训", "一旦澄清公告出来，我们顺势猛砸，击破1000点的整数关，引致投资人的恐慌抛盘，然后我们在1000点左右，大批量地接货，迅速把仓位回复到100％", "刺激人们的赌徒心理滋生，他们一定会在强烈的翻本心态支配下追涨，当指数推高500点，足以全身而退", "我们这个群体基本上是和社会隔离起来的一个群体，很少和圈子以外的人接触，别人也很难进入这个圈子，这是一个很孤独的群体"], "psych": [{"p": "情緒操縱", "a": "明天做一个向上的假动作，然后把你们手头的筹码做掉一半", "n": "莊家以向上假動作誘多，再借澄清消息猛砸，全程操控散戶情緒以達目的。"}, {"p": "恐慌性拋售（恐懼）", "a": "击破1000点的整数关，引致投资人的恐慌抛盘，然后我们在1000点左右，大批量地接货", "n": "莊家故意砸破千點製造恐慌，散戶不計成本拋售，莊家再低吸接貨。"}, {"p": "賭徒謬誤", "a": "刺激人们的赌徒心理滋生，他们一定会在强烈的翻本心态支配下追涨", "n": "莊家預期散戶在翻本心態下追漲，誤以為跌久必漲，賭徒謬誤正是其突破口。"}, {"p": "孤獨與異化", "a": "我们这个群体基本上是和社会隔离起来的一个群体，很少和圈子以外的人接触，别人也很难进入这个圈子，这是一个很孤独的群体", "n": "操盤群體與社會隔離、外人難入，主角的孤獨正是職業投資人異化的寫照。"}]}, {"i": 68, "title": "第六十八回　冲高回落山洪近", "kind": "hui", "summary": ["早盘低开猛跌后被买盘推起反复创新高，主力试单确认跟风盘仍在，午后可出一半筹码。", "新股额度调控如紧箍咒，年初减发引发半年涨势，四月起政策频出，价格过高信号昭然。", "去年八月快速扩容令指数跌破四百点，巨大差价吸引冒险者聚集，市场影响日趋扩大。", "主角预言山洪爆发：总市值缩水一半则过半人两手空空，众人自认5%幸运儿，在自我安慰中麻痹。", "失败者通病为懒惰浮躁，以否定掩饰懒惰、虚伪掩饰浮躁；下午冲高回落，专家成熟论实为可笑。"], "qa": [{"q": "早盘主力使用了什么心理战术营造向上突破的假象？", "a": "大盘低开猛跌后被疯狂买盘推起，打下去再拉上来，整个上午反复创新高做出突破架式，正是诱多的心理战术；主角试单确认跟风盘仍在，料定下午能顺利出货一半。"}, {"q": "主角为何认为下午还能吸引很多人跟进？这反映散户什么心理？", "a": "上午屡跌屡创新高，营造出跌不下去、只会更高的强势印象；散户只看见暴利一面，自认是5%的幸运儿，在贪婪与侥幸中跟风追入。"}, {"q": "收盘时为何几乎没有恐慌性抛售？", "a": "人们经过跌下去又涨上来的多次洗礼已慢慢适应，都认为明天肯定会涨上来，抱持跌久必涨的赌徒式预期而麻木，故直到收盘都没有多少恐慌性抛售。"}, {"q": "主角如何看待专家“投资者已经成熟”的说法？", "a": "主角认为这种言论非常可笑——人们并非成熟，而是被反复洗礼后变得麻木，把下跌视为常态并自我安慰明天必涨，专家不过把群体的麻痹美化成成熟。"}, {"q": "为何丢100元会伤心，在股市亏100元却毫无感觉？", "a": "因为人只看见暴利一面、自认是那5%的幸运儿，亏了会安慰自己“现在失去100元，明天一定会有1000元进账”，用预期收益将损失合理化，在自欺中慢慢习惯、麻痹。"}, {"q": "主角眼中市场失败者的共同心理特征是什么？", "a": "懒惰、浮躁：对看不懂的事要么破口大骂、要么坚决否定，否定掩饰懒惰、虚伪掩饰浮躁，还常自欺欺人，亏了说成赚了，小赚一点便眉飞色舞讲上许多年。"}, {"q": "失败者为何只谈过去的大涨，绝口不提现在和未来？", "a": "谈起往事时他们的神色不亚于瘾君子吸了一口烟后的舒坦，靠重温旧梦获取快感；因为现在对他们有口难言、未来希望渺茫，只能以过去的荣光自我麻醉。"}, {"q": "主角预言的“山洪”指的是什么？", "a": "他预见今年市场会如山洪般爆发，滚滚而来的不只是钱，还会有大批人被淹没；几百家股票总市值若缩水一半，至少一半人将两手空空。"}, {"q": "散户都自认是5%的幸运儿，体现了什么心理偏差？", "a": "胜率只有5%，人人却都以为自己就是那5%里的一个：只看见暴利与赢家，忽视惨遭打击的另一面，这正是幸存者偏差，让人在不知不觉中快乐地成为穷光蛋。"}, {"q": "新股发行额度调控为何被称为“市场的紧箍咒”？", "a": "上涨太快就加大发行额度，跌得太多就停止或减少发行，像紧箍咒般调控价格；年初减发引发半年涨势，四月起政策频出，即是价格太高的信号。"}], "quotes": ["这个市场的残酷不是人人能够看到的，人们看到的只是它能够带来暴利的一面，恰恰忽视了惨遭打击的那一面，因为人人都会觉得自己是最幸运的那个人，虽然胜率只有5％，但是人人都会以为自己就是那5％里边的，就是这样人们就会在不知不觉当中快乐地成为穷光蛋。", "一个人要是丢了100元钱，他一定会伤心，一定会觉得不公平，但是一个人在这个市场上亏掉100元钱，他绝对不会有这种感觉的，他会安慰自己现在失去100元，明天一定会有1000元进账的，就这样人们慢慢地习惯了、麻痹了。", "懒惰、浮躁！他们对所有看不懂的事情都会采用同样的方式去解决，要么破口大骂，要么坚决否定，他们不肯接受任何需要花力气去研究的东西，否定一切能够很好地掩饰自己的懒惰，虚伪能够掩饰自己的浮躁。", "“上一次我曾经买过一只股票，买进以后结果大涨，那种感觉怎么怎么样⋯⋯”你这时候再去看说话人脸上的神色，不亚于一个瘾君子在吸了一口烟以后的那种舒坦，但是他们从来不谈现在和未来，现在对于他们来说是有口难言，未来对于他们来说是希望渺茫。", "人们经过这段时间的跌下去又涨上来的多次洗礼，已经慢慢地开始适应了，都认为明天肯定会涨上来的，这段时间很多的投资专家都说是投资者已经成熟了，不再追涨杀跌了，我觉得这种言论非常可笑。"], "psych": [{"p": "情緒操縱", "a": "大盘低开顺势向下猛跌几十点，一阵子就被疯狂的买盘推起，打下去再拉上来，最终指数在整整一个上午做出了向上突破的架式", "n": "主力以反复打压与拉抬营造突破假象，诱使跟风盘进场，便于顺利出货。"}, {"p": "羊群效應（從眾）", "a": "我试着放了几笔单子，发现跟风的人还是有，虽然不是很多但是要是下午开盘按照这个架式再向上推动，还是能够吸引很多人的", "n": "跟风盘见强势便蜂拥追入，主力正是利用众人的从众心理完成派发。"}, {"p": "倖存者偏差", "a": "虽然胜率只有5％，但是人人都会以为自己就是那5％里边的", "n": "散户只见赢家、自认幸运儿，忽视绝大多数输家，遂在不知不觉中沦为穷光蛋。"}, {"p": "認知失調／合理化", "a": "他会安慰自己现在失去100元，明天一定会有1000元进账的，就这样人们慢慢地习惯了、麻痹了", "n": "亏钱后用预期收益自我安慰，将损失合理化，在自欺欺人中渐渐麻木。"}]}, {"i": 69, "title": "第六十九回　股海孤眠听妄言", "kind": "hui", "summary": ["職業投資人不交易時最孤獨，長年沉默與隔絕使他失去與人交往的能力，淪為生活的旁觀者。", "城鄉身份迷惘反覆折磨靈魂，自認平庸小人物，只能靠踏實本分證明自己人生的分量。", "對比酒店潔白天花板與煙熏火燎的窯洞頂，慶幸自己只是運氣比人好，透出疏離與宿命感。", "電視股評節目大談周一股市創新高，專家與民間股神對一無所知的行情指手畫腳，過度自信害人害己。", "投資大眾不認識自己、盲信節目妄言，作者冷眼旁觀，為眾人的悲哀與不自知而悲哀。"], "qa": [{"q": "「不交易的時候」對職業投資人意味著什麼心理狀態？", "a": "不交易的時候是最孤獨的時候，長時間的孤獨和沉默使他漸漸失去與人交往的能力，不願與圈子外的人打交道，只想如一個旁觀者般欣賞別人的生活。"}, {"q": "從農村回到城市後，什麼樣的迷茫常常折磨「我」的靈魂？", "a": "「我到底是城裡人曾經到農村，還是農村人回到了城裡」的困惑反覆折磨靈魂；他自認小人物，不願研究社會問題，只想踏實做好本職工作，讓人生價值有點分量。"}, {"q": "作者如何解釋自己能躺在酒店房裡？這反映了什麼心態？", "a": "對比潔白平面的酒店天花板與煙熏火燎的拱形窯洞頂，他慶幸卻自認平庸，世上比他有能力的人多的是，只是運氣比別人好一點，此念不止一次甚至常常縈繞心頭。"}, {"q": "作者為什麼一看到股票節目就立即換頻道？", "a": "因為不想看那些所謂民間高手拙劣地表演，自己丟人不知道，還以為自己很有水平；這種不認識自己、過度自信的表現，令他為他們悲哀。"}, {"q": "「周一大盤要不要創出新高」這個主題，作者為何評為「很有勇氣」？", "a": "這是諷刺：專家與民間股神不知天高地厚，憑自己那點資金豈能決定大盤走勢；對自己一無所知的股市價格運行指手畫腳，害人害己。"}, {"q": "專家與民間股神對下周行情各放出什麼言論？", "a": "專家稱減少新股發行額度的消息一旦被證實，指數一定會一飛沖天、創出新高指日可待；民間股神則列舉「大盤下周要漲需要注意三點」，一點一點講起，口水亂飛。"}, {"q": "按作者的看法，股市價格運行有什麼內在規律？小投資人應如何自處？", "a": "不管誰在操縱股價，都會遵循以營利為目標的內在規律；小投資人只需調整好自己的心態、跟隨市場價格走勢調整操作行為，不該對行情指手畫腳。"}, {"q": "「可憐人必有可憎之處」這句話是針對誰而發？", "a": "針對節目中的專家與民間股神，以及如「我」一樣守在電視機旁的投資大眾：不認識自己是投資大眾受挫最主要的因素，不關心自己的操作，反而對行情指點江山。"}, {"q": "作者如何看待自己的成功與運氣？與節目中的股神有何對照？", "a": "他自認平庸，能躺在酒店房裡只因運氣比別人好一點，不把成績歸功於自己的能力，與節目中自以為是、指點江山的民間股神形成鮮明對照。"}, {"q": "結尾處「我」如何面對送上早餐的服務員？這透出什麼心理？", "a": "他關掉電視、打開房門，面無表情地看著笑容可掬的服務員在餐廳擺放早餐；職業投資人的疏離冷漠與服務員的熱情周到形成強烈反差。"}], "quotes": ["作为一个职业投资人，不交易的时候是最孤独的时候，长时间的孤独和沉默，使一个本来正常的人，渐渐地失去了和人交往的能力，我不愿意和圈子之外的人打交道，只想像一个旁观者一样欣赏别人的生活。", "我到底是一个城里人曾经到农村还是一个农村人回到了城里？这种迷茫常常会折磨我的灵魂。", "强烈地对比之后，我很庆幸自己能够躺在这样的房子里，因为我毕竟是一个平庸的人，这个世界上比我有能力的人多的是，只是我的运气比别人好一点而已，这样的思绪我不止一次有过，甚至是常常有。", "股市价格运行有自己内在的规律，不管是谁在操纵股价，他都会遵循营利为目标的内在规律，小投资人只需要调整好自己的心态，跟随市场价格的走势调整自己的操作行为就可以了，凭什么要对自己一无所知的股市价格运行指手画脚？", "不认识自己是投资大众在这个市场招致挫折最主要的因素，不关心自己的操作是否接近市场的实际走势，反而对市场价格走势指点江山，可笑可怜，真是应了那句话：可怜人必有可憎之处。"], "psych": [{"p": "孤獨與異化", "a": "作为一个职业投资人，不交易的时候是最孤独的时候，长时间的孤独和沉默，使一个本来正常的人，渐渐地失去了和人交往的能力", "n": "職業投資人的長年孤獨與沉默，使他失去與人交往的能力，淪為生活的旁觀者。"}, {"p": "專家崇拜／過度自信", "a": "不管是所谓的专家还是所谓的民间股神，怎么就不动动脑子想想，大盘要不要创出新高是你们几个人能说了算的？", "n": "專家與民間股神對一無所知的行情指手畫腳，正是過度自信害人害己的寫照。"}, {"p": "信息瀑布（謠言市）", "a": "专家说减少新股发行额度消息一旦被证实，那么股票指数一定会一飞冲天，创出新高指日可待。", "n": "一條未證實的消息經節目放大，即成「一飛沖天」的預期，是信息瀑布與預期自我實現。"}, {"p": "認知失調／合理化", "a": "不认识自己是投资大众在这个市场招致挫折最主要的因素，不关心自己的操作是否接近市场的实际走势，反而对市场价格走势指点江山", "n": "投資大眾不認識自己卻對行情指點江山，用幻想合理化判斷，是認知失調的典型。"}]}, {"i": 70, "title": "第七十回　酒醒麻局悟股机", "kind": "hui", "summary": ["替人操盤失去神聖感，主角在鬧吧狂歡中愈感靈魂深處的孤獨與異化。", "消息面真空期，散戶自以為是、迷信專家股神，正是莊家樂見的操縱土壤。", "酩酊大醉是操盤者釋放壓力的麻醉手段，狂歡與酒精都無法填補內在空洞。", "周日麻將局即心理較量：高手互防皆輸，不防他人、先顧好自己的主角反成贏家。", "麻將與炒股同理：先做好自己再攻別人，只圖攻擊他人而不管自身者必敗。"], "qa": [{"q": "主角這次替人操盤的心態與以往有何不同？這說明了什麼心理變化？", "a": "他失去過去的神聖感，無法全身心投入，只把操盤當作敷衍，連例行聚會也取消——職業投資人對重複性博弈已生倦怠，走向異化。"}, {"q": "主角為何偏愛喧囂的鬧吧？狂歡之下他真正感受到的是什麼？", "a": "看著別人瘋狂舞蹈會感染他的心情，但越喧囂越讓他感到發自靈魂深處的孤獨，如無形壓力令人窒息——狂歡只是孤獨與異化的反襯。"}, {"q": "消息面真空時，小投資人表現出什麼樣的心理特徵？", "a": "他們往往尊重自己的主觀意願，自以為是地認定自己的選擇正確；沒有思想的小投資人更願意相信專家與股神的言論——典型的過度自信與專家崇拜。"}, {"q": "從莊家角度看，兩天無發行額度增減的消息為何被視為「好現象」？", "a": "消息真空令散戶失去依據、轉而依賴主觀臆斷與專家言論，預期更容易被引導，有利於操作計劃順利實現——這正是莊家樂見的情緒操縱土壤。"}, {"q": "主角為何選擇在周日反常地召集大家「打麻將」而非直接談操作？", "a": "大家知道主角周日不熬夜玩樂，反常舉動等於暗示有新想法；以輕鬆牌局為載體傳遞思路，避免直白說教，是莊家慣用的節奏鋪墊手法。"}, {"q": "麻將局中高手為何全輸，技術最差的主角為何獨勝？", "a": "高手把精力全用在防範對方攻擊上，互相消耗；主角盯不住下家跟不上上家，索性不防任何人，反而笑到最後——心理較量中專注自身者勝。"}, {"q": "主角從麻將局悟出什麼炒股心理法則？", "a": "技巧好壞是次要的，最重要的是先把自己的事情做好再去攻擊別人；一心只想攻擊別人、不管自身狀況，最終必然失敗——先自守再博弈。"}, {"q": "主角如何解讀「喝酒」這件事？", "a": "他認為只有酩酊大醉才能徹底放鬆，喝酒是解脫、是釋放壓力的手段，他們經常以此麻醉自己——壓力之下靠酒精逃避，反映職業操盤者的內在異化。"}, {"q": "女孩邀主角跳舞時，雙方如何交鋒？", "a": "他冷冷說自己是流氓、別讓我帶壞你；女孩笑嘻嘻回「誰把誰帶壞還說不准呢」，並提議改為比賽喝酒、誰輸誰掏錢，最後湊合喝威士忌。"}, {"q": "周日麻將局的具體規矩是什麼？", "a": "每人拿出1萬元只打一把，6人輪番上陣，輸的人把錢放下起立、換下一個上，最後和了的人把所有錢全部拿走。"}], "quotes": ["越是喧嚣吵闹的地方，越能让人感觉到深深的孤独，这种孤独是发自灵魂深处的那种，它有一种无形的压力束缚你的全部，让你喘不过气来，甚至有一种窒息感。", "小投资人在消息面真空的情况下，往往会尊重自己的主观意愿，自以为是地认为自己的选择是正确的。", "没有思想的小投资人更愿意相信那些专家和股神的言论。", "由于所有的高手把精力全部用在防范对方的攻击上，结果到最后高手们都输了，最后的赢家自然是我了，因为我不防范任何人。", "打麻将和炒股票是相同的道理，技巧好坏是次要的，最主要的就是你首先需要把自己的事情做好，然后再去攻击别人，不然的话一门心思只想攻击别人，不管自己的状况如何，最终必然失败。"], "psych": [{"p": "孤獨與異化", "a": "越是喧嚣吵闹的地方，越能让人感觉到深深的孤独，这种孤独是发自灵魂深处的那种", "n": "操盤者靠酗酒與狂歡麻醉自己，職業投資人的疏離在喧囂中反而更重。"}, {"p": "情緒操縱", "a": "整整两天都很平静，没有任何有关发行额度减少或者增加的报道，这反而是一种好现象", "n": "莊家樂見消息真空期，散戶的主觀臆斷正是可被引導操縱的土壤。"}, {"p": "認知失調／合理化", "a": "小投资人在消息面真空的情况下，往往会尊重自己的主观意愿，自以为是地认为自己的选择是正确的。", "n": "消息真空下散戶自以為選擇正確，用主觀意願合理化自己的無知與盲從。"}, {"p": "心理較量（看誰先崩潰）", "a": "由于所有的高手把精力全部用在防范对方的攻击上，结果到最后高手们都输了", "n": "麻將局即心理戰：高手互防內耗自敗，不防他人、做好自己者反勝。"}]}, {"i": 71, "title": "第七十一回　鹤颈折时千点寒", "kind": "hui", "summary": ["主角噩梦醒来预感巨变，决意全线打压股指跌破千点整数关，庄家主导的恐惧即将降临。", "想起父亲与老阿婆等善良老人，感叹善良诚实反成资本市场致命弱点，良心与职业在零和博弈中撕扯。", "上午拉抬二桥股份跟风寥寥，散户怨涨不追；午间专家高抛低吸博得掌声，盲从与操纵同台上演。", "午后雪崩式抛单令股指如断线风筝坠落，尾盘压盘如丹顶鹤颈被扭断，千点心理关口成为绞杀目标。", "收盘亏损六亿，搭档小丽与会计透支买自家股票巨亏晕倒，主角冷然封存资料，尽显庄家的孤绝异化。"], "qa": [{"q": "主角的\"全线打压计划\"如何利用1000点这个整数关？", "a": "先砸破千点整数关令所有参与者短时间内损失70%以上，再在千点之下接单拉升、突破1400点后自1200点出货，把整数关的锚定心理变成收割工具。"}, {"q": "上午拉抬二桥股份跟风寥寥，说明散户有什么群体心理？", "a": "散户整天埋怨股市不涨，真涨时却不跟进，gp连1都不到，说明缺乏赚钱效应时羊群无从启动，观望与抱怨并存，正是典型的从众前夜心态。"}, {"q": "午间营业部的\"深圳专家\"扮演了什么角色？散户为何鼓掌？", "a": "专家信口开河高谈高抛低吸、1558点指日可待，台下听不明白却掌声一片、欢欣鼓舞，是专家崇拜与从众盲从的典型写照，愚昧与盲从互为表里。"}, {"q": "主角为何觉得自己\"和他们是两个世界的人\"？", "a": "他躲在暗处操纵盘面，给散户一个虚无飘渺的幻觉，职业身份把他与普通投资人彻底隔开，也注定了他作为操盘者的孤独与异化。"}, {"q": "回想70%的亏损，主角为何打了个冷颤？", "a": "100块钱只剩下30元，善良的老人将蒙受灭顶之灾，损失厌恶与道德罪疚同时咬噬内心，连热水也缓解不了\"来自内心的寒冷\"。"}, {"q": "主角对\"谁该拥有财富\"的答案是什么？", "a": "谁也没有罪，但拥有财富的应是懂资本的人，懂市场、懂自己、懂股票、懂资本；可惜多数人连自己都不懂，正是一切认知失当与过度自信的病根。"}, {"q": "下午砸盘时山子与老胡为何犹豫？主角如何应对？", "a": "他们对人气估计乐观、不大乐意执行计划，抛售幅度不大；主角不与他们沟通，直接低挂100元、每笔100万股不撤单狂抛，以决绝节奏宣示谁才是控盘者。"}, {"q": "\"1100点被小投资人当作心理底价\"揭示了什么？", "a": "1100点是散户认定的心理支撑位，主角试探买入后gp竟能到7，证明支撑位是心理而非技术概念，可被庄家识别、试探并反过来加以利用。"}, {"q": "小丽为何晕倒？她的遭遇说明什么心理陷阱？", "a": "她与会计都透支买了自家股票，赌\"我回来一定会有行情\"，结果巨亏，临别致歉时晕倒；把希望押在预期而非规则上，是过度自信与沉没成本叠加的惨痛教训。"}, {"q": "主角为何称焦虑是这一行的\"职业病\"？", "a": "投机实实在在是零和博弈，有人赚钱必有人亏钱，稍有良知便焦虑不安；罪孽之问如蛇噬魂，正是庄家道德冲突与罪疚感的内在写照。"}], "quotes": ["善良、正直、诚实等等生活当中最美好的准则，在资本市场却彻底成了极大的弱点，招致灭顶之灾。", "小投资人整天埋怨股市不涨，真涨的时候他不见得跟进。", "我则躲在暗处给了他们一个虚无飘渺的幻觉。", "看起来1100点被小投资人当作心理底价了。", "指数这个时候看上去好像是一个丹顶鹤的脖子被人强行扭断一样，耷拉下来。"], "psych": [{"p": "心理支撐位", "a": "看起来1100点被小投资人当作心理底价了。", "n": "1100点本是心理而非技术概念，被散户定锚后反成庄家试盘与利用的参照。"}, {"p": "專家崇拜／過度自信", "a": "这家营业部聘请了据说是来自深圳的专家在分析股市，作午间指导。", "n": "散户迷信深圳专家的高抛低吸而掌声雷动，正是迷信权威与盲从的写照。"}, {"p": "道德衝突／罪疚感", "a": "不知道是不是罪孽，但是这是我的工作，我必须赚钱，矛盾的心态一直让人感到非常焦虑", "n": "庄家在零和博弈中良心受拷问，罪孽之问如蛇噬魂，焦虑成了职业病。"}, {"p": "情緒操縱", "a": "我则躲在暗处给了他们一个虚无飘渺的幻觉。", "n": "庄家借盘面与舆论给散户制造幻觉，操控大众情绪以完成打压拉升的计划。"}]}, {"i": 72, "title": "第七十二回　申江夜筹护千点", "kind": "hui", "summary": ["主角包場衡山路酒吧孤身籌謀輿論攻勢，職業投資人的孤獨與疏離盡顯。", "小馬奉命赴京籌辦研討會，以專家與媒體炮製「保衛1000點」的輿論造勢。", "主角嘲諷股評車軲轆話數百年不變，散戶迷信權威而莊家冷眼看穿。", "資金與管理層調控逆勢，主角認定須速戰速決，暗藏心理較量的緊張節奏。", "借上海女性化的城市氣質，主角反思資本市場的殘酷與理性務實的生存之道。"], "qa": [{"q": "莊家在本章用了什麼心理戰術來護盤千點？", "a": "主角讓小馬赴京辦研討會，請有分量的專家和媒體造勢，製造「保衛1000點」的說法，用輿論操縱市場情緒，讓聲音有分量、無人懷疑其真實性。"}, {"q": "「保衛1000點」的說法利用了什麼心理現象？", "a": "千點是整數關口，天然成為散戶心中的心理支撐位與定錨點；莊家刻意強化這一說法，讓散戶相信跌到千點會有支撐，從而穩定市場情緒。"}, {"q": "散戶面對千點關口表現出什麼群體心理？", "a": "散戶集體把千點當作生死線，一旦接近便恐慌或期待反彈，形成從眾的集體預期；莊家正是利用這種群體心理炮製輿論，引導大眾按自己的節奏行動。"}, {"q": "主角如何看待報紙上的股評？說明了什麼心理？", "a": "主角苦笑諷刺股評是車軲轆話，一年只需寫兩篇改改日期，從不說斬釘截鐵的話；這說明散戶迷信「專家權威」，而莊家早已看穿股評只是糊弄股民的套話。"}, {"q": "主角為什麼認定必須「速戰速決」？", "a": "一月以來管理層持續調控、不願股市過高，二月份調控聲更大，這筆資金等於和趨勢做對；若不速戰速決，一旦下跌正式開始，便再也沒有出貨機會，這是莊家與趨勢的心理較量。"}, {"q": "主角包下冷清的酒吧獨自布局，反映了他怎樣的心理狀態？", "a": "下午酒吧冷清「就我一个人」，他孤身籌謀、不與任何人深談，職業莊家的孤獨與異化顯露無遺——資本世界的殘酷使他習慣獨自扛下一切。"}, {"q": "老闆娘送絲巾「討個好彩頭」，主角如何回應？", "a": "主角笑收禮物，並玩笑求婚要老闆娘做女朋友，被以「都能做你姐姐了」婉拒；玩笑背後是他在資本博弈之外的短暫人間溫情與自我調侃。"}, {"q": "主角從上海文化中悟出什麼生存哲學？", "a": "他認為資本市場殘酷如大都市生活，理性解決問題遠比抱怨實際；上海女人精打細算、凡事追求細緻不忽略細節，正是理性務實的生存之道。"}, {"q": "主角為什麼要求研討會的參與人選「一定要合適」？", "a": "因為輿論造勢成敗在於可信度：參與者必須讓聲音有分量、無人懷疑真實性，權威專家與普通人搭配，才能讓「保衛千點」的謊言看起來像市場共識。"}, {"q": "本章中主角與散戶之間的博弈呈現什麼樣貌？", "a": "莊家主動出擊炮製輿論，散戶則被動接收訊息、集體相信千點支撐；一方操縱情緒、一方從眾恐慌，構成典型的莊散心理博弈。"}], "quotes": ["中国的股评什么时候能像男人一样，说一句斩钉截铁的话。不管对错，有个观点远比这样糊弄这些股民要强得多。", "这笔资金等于和趋势做对了。因此，必须速战速决，短时间内必须有个了结，否则，一旦下跌正式开始，根本就没有出货的机会了。", "我希望这种声音能够有分量，没有人怀疑它的真实性。主要是参与人选一定要合适。", "资本市场的残酷犹如一个普通的平凡人生活在上海这个繁华的国际大都市一样，理性的解决你所面临的问题远比抱怨要实际很多。", "上海制造之所以在中国乃至于世界成为优质产品的代名词，可能跟上海的这种文化有关——凡事都追求细致，从来不忽略一个细节。"], "psych": [{"p": "情緒操縱", "a": "我希望明天整个市场能够有一个保卫1000点的说法", "n": "莊家炮製「保衛千點」輿論，操控散戶情緒與市場預期。"}, {"p": "錨定效應", "a": "我希望这种声音能够有分量，没有人怀疑它的真实性", "n": "千點整數關口成為市場心理定錨，主導散戶對支撐位的判斷。"}, {"p": "專家崇拜／過度自信", "a": "股评人士的车轱辘话几百年如一日花样都不变一个", "n": "散戶迷信股評權威，而莊家早已看穿其套話糊弄的本質。"}, {"p": "孤獨與異化", "a": "下午酒吧很冷清，就我一个人，我告诉老板娘从现在开始一直到晚上8点，我要用这个地方", "n": "主角獨自包場密謀護盤，職業莊家深陷孤獨與疏離。"}]}, {"i": 73, "title": "第七十三回　寒夜谋破千点关", "kind": "hui", "summary": ["電視專家斷言大跌必有反彈，主持人視千點為牛市生命線，莊家卻盤算擊破此心理關口。", "散戶套牢不割肉，源於盈轉虧的心理落差與對更好價位的期待，成為莊家可乘之機。", "莊家安排輿論安撫散戶、力促異口同聲的救市呼聲，為破千點後從容出貨佈局。", "散戶決策盲從專家與鄰居致富傳說，自以為是、錯怪市場，正是群體心理的寫照。", "寒夜孤身謀劃，主角在操縱大眾與良心自問之間，陷入孤獨與異化的矛盾。"], "qa": [{"q": "電視專家「大跌必有反彈」的判斷犯了什麼心理學謬誤？主角為何能識破？", "a": "專家把跌深當作必然反彈的理由，正是賭徒謬誤。主角點破：過於激進的專家十有八九不做股票，說錯說對無關痛癢，只有稍顯猶豫者的言論才反映市場真實狀態。"}, {"q": "主持人說「1000點是牛市的生命線」，這在心理學上是什麼現象？莊家如何看待這個點位？", "a": "千點整數關口成為股民的心理定錨與支撐位。莊家同樣盯住它，卻反向運用：決意擊破此位，給小投資人徹底打擊，迫其在千點崩潰吐籌，再趁千點之下的跟風漲勢出貨。"}, {"q": "莊家為何要求聽到「異口同聲救市的呼聲」？這屬於什麼心理戰術？", "a": "這是輿論造勢的情緒操縱。他要媒體、經濟學家、論壇齊聲力保千點，安撫散戶、穩定其持股信心，確保自己破千點出貨時散戶不會同時拋售，以便從容派發籌碼。"}, {"q": "主角分析散戶「不賣出」的原因，揭示了什麼心理機制？", "a": "從盈利變虧損的心理落差令散戶難以適應，寧願套牢也不願實現虧損，即損失厭惡與處置效應。他們並非看好後市，只是希望有個更好的價位賣出，主角稱這是大眾最複雜的投資心理。"}, {"q": "主角認為散戶買賣決策的依據是什麼？這反映什麼群體心理？", "a": "散戶決策只聽專家或資深老股民建議，或憑感覺買賣，對股市的了解僅限於鄰居賺錢、報紙報導炒股發財。他們從沒想過投資失誤如何應對，跟風從眾、迷信權威，順境難賺錢，逆境更危機四伏。"}, {"q": "主角說散戶「最不幸」的是什麼？這屬於什麼心理現象？", "a": "最不幸的是大部分投資人不認識自己，總自以為是，認為自己的作為很有水平，即便是錯了也是市場錯了，自己沒有任何過錯——把失敗歸咎於市場、功勞歸於自己，正是自我服務偏差。"}, {"q": "深夜主角為何睡不著？這反映他怎樣的心理狀態？", "a": "他高度緊張地思索所有可預見的問題，直到有完整應對策略才能入睡。三月上海寒意襲人、街上行人稀少，他自認此時未眠的大概都是股民——職業投資人孤身籌謀，與被操縱的大眾彼此疏離。"}, {"q": "主角提出「把投資行為當作消費」的觀點，有何心理學含義？", "a": "資本本應增值、符合資本運作規律，但許多人用股票買賣滿足情緒體驗，資本淪為支付情緒消費的成本，故股市上不存在虧損：投資人收穫金錢，消費者收穫需求被滿足的體驗。"}, {"q": "「到底誰該死」的自問自答，暴露了莊家怎樣的心理？", "a": "他明知投資人不懂這些道理才讓莊家有機可乘，卻為「不懂就該滅亡」的矛盾而沉重。「誰都不該死，世界就在矛盾中生存和發展」的自答，透出操縱者的罪疚感與道德衝突。"}, {"q": "莊家擊破千點的計劃，本質上是一場什麼較量？", "a": "本質是心理較量，看誰先崩潰。他要求自己萬無一失，因為面對的是直接涉及金錢利益的龐大群體；他堅信只有不輕視對手、每天完善計劃，才能逼散戶在千點崩潰吐籌。"}], "quotes": ["大跌必有反弹，牛市大行情这样大跌幅，应该是建仓的良机，特别短线资金应该大胆买入。", "1000点是牛市的生命线，管理层能否出台相关的救市政策，直接关系到千千万万股民的人气⋯⋯", "不卖出并不是因为看好后市的发展，主要是希望有个好点的价位卖出，这估计是大众目前最为复杂的投资心理。", "最不幸的是大部分投资人不认识自己，总感觉自以为是，认为自己的所作所为还是很有水平的，即便是错了也是市场错了，自己没有任何过错。", "我需要有人安慰这些散户，不能在我出的时候他也出，这样的结果不是我要看到的，最佳的状态是破1000点之后出货。"], "psych": [{"p": "錨定效應", "a": "1000点是牛市的生命线，管理层能否出台相关的救市政策，直接关系到千千万万股民的人气", "n": "千點整數關口成為股民的心理定錨，莊家反向利用此關口佈局。"}, {"p": "情緒操縱", "a": "我需要有人安慰这些散户，不能在我出的时候他也出", "n": "莊家以輿論安撫散戶持股信心，確保破千點後自己能從容出貨。"}, {"p": "心理較量（看誰先崩潰）", "a": "一定要击破这个位置，给小投资人彻底打击，迫使大部分人在1000点位置崩溃，吐出手中的筹码", "n": "莊家與散戶比心理承受力，逼對方在千點關口先崩潰。"}, {"p": "損失厭惡（割肉）", "a": "从盈利变为亏损心理上的落差短时间内很难适应，不卖出并不是因为看好后市的发展", "n": "散戶寧願套牢也不願承認虧損，正是損失厭惡的典型表現。"}]}, {"i": 74, "title": "第七十四回　千点失守老妪惊", "kind": "hui", "summary": ["莊家以節奏試盤與連環砸盤誘發恐慌，跌破千點整數關口，重演大崩盤的心理劇場。", "散戶在恐懼中傾巢拋售，羊群效應使市場一邊倒，跟風拋盤成了莊家最好的幫手。", "五成是心理支撐、六成是崩潰邊緣，主角精準踩踏散戶承受極限，逼出恐慌盤。", "老阿婆病倒入院、中年婦女執意割肉，莊家眼中的數字在散戶身上化作悲劇。", "主角於孤獨與罪疚中反思：資本市場使人成魔，人終究難擺脫動物本能的束縛。"], "qa": [{"q": "开盘后主角先按20元级差小单卖出，为何股价不跌反稳？", "a": "这是试盘摸底：单量小、级差低，不足以撼动人心，指数在开盘价附近震荡约十五分钟，为主角后续重锤砸盘预留了心理预期空间。"}, {"q": "庄家如何用第二道指令引爆千点失守？", "a": "改以120元级差、150万股连续追加抛出，指令下达不到两分钟大盘猛烈下跌，很快跌破1000点，制造出市场几乎一边倒的崩溃走势。"}, {"q": "主角为何把50%视为心理支撑、60%视为崩溃边缘？", "a": "庄家测算散户承受阈值：跌五成才真正动摇信念，跌六成则恐惧决堤、恐慌盘倾巢而出，这正是他逼人割肉、打压吸筹的引爆点。"}, {"q": "跟风抛盘背后体现了散户什么群体心理？", "a": "羊群效应：众人见跌就逃、争相跟随抛售，整个市场几乎一边倒，人人只求比邻人先跑，恐惧在群体中互相传染、不断放大。"}, {"q": "中年妇女为何听不进主角“别卖”的劝告？", "a": "巨大的恐惧已完全控制她的思维，只剩尽快卖掉股票一个信念，逃离才让她有安全感；损失厌恶之下宁可割肉离场，也拒绝任何理性分析。"}, {"q": "老阿婆的遭遇为何让主角心情异常沉重？", "a": "股票一多半跌掉、高血压入院，是他未曾想到的结果。庄家眼中冰冷的数字，落在散户身上是家破人伤的惨剧，他第一次直面自己的“杰作”。"}, {"q": "主角为何说“现在卖出给未来追涨埋下了灾难的种子”？", "a": "低位割肉者将来会在更高价位重新追高入场，此刻的恐慌抛售只是把廉价筹码拱手让给庄家，为下一轮追涨行情埋下伏笔。"}, {"q": "收盘后办公室为何气氛异常沉重、职员无一幸免？", "a": "职员虽按规定不许买卖股票，背地里却都在买卖，暴跌后人人亏损。主角自感无法保护大家，更无人知晓正是他逼人倾家荡产。"}, {"q": "主角看到股民拥挤排队时为何有“末日来临”之感？", "a": "人挤人、不吃饭排队等候报单，各种声音交杂，群情惶惶如世界末日，这是群体恐慌的外化景象；主角冷眼旁观，又不免生出压抑与悲悯。"}, {"q": "结尾主角对人性作了怎样的心理反思？", "a": "他认为资本市场能让人变成魔鬼，关键时刻人总尊重自我、蔑视现实，与善良道德知识无关，因为人再高级也难摆脱动物本能的束缚。"}], "quotes": ["人在完全封闭的状态下，思维是最活跃的，也是最冷静的，所有的思维结果都很接近实际存在。", "50%是一个心理的支撑位置，60%则是崩溃的边缘，计划的第一步已经成功了。", "巨大的恐惧完全控制了她所有的思维，只剩下一个信念，尽快卖掉股票，逃离可能让自己有一些安全感，殊不知现在卖出给未来追涨又埋下了灾难的种子。", "人挤人，各种声音夹杂在一起，让人感到世界的末日仿佛要来临了一样。", "残酷的资本市场可以让人变成魔鬼，也可能让魔鬼变成天使，小投资人失败好像是一种宿命，但是，又有多少人思考过改变自己，让自己的行为能和市场保持高度一致呢？"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "巨大的恐惧完全控制了她所有的思维，只剩下一个信念，尽快卖掉股票", "n": "暴跌中散戶不計成本逃命，恐懼取代一切理性判斷。"}, {"p": "心理支撐位", "a": "50%是一个心理的支撑位置，60%则是崩溃的边缘，计划的第一步已经成功了。", "n": "莊家精準利用跌幅心理關卡，引爆散戶集體崩潰。"}, {"p": "情緒操縱", "a": "所有股票每个级差价格120元，每笔单量150万股，连续追加抛出。", "n": "莊家以連環砸盤與節奏掌控大眾情緒與行情走向。"}, {"p": "道德衝突／罪疚感", "a": "大家也不会知道是我逼大家倾家荡产，我所能做的就是每次资金运作结束之后，建议公司多发奖金。", "n": "操盤手在職業冷酷與良心不安之間，以發獎金自我補償。"}]}, {"i": 75, "title": "第七十五回　静安寺前泪染襟", "kind": "hui", "summary": ["撤單試盤探虛實，再以級差20元、單筆400萬股大單掃貨，盡數吃進拋售籌碼，股價由暴跌30%直逼紅盤。", "停買觀望至千點整數關，再以級差25元持續拋出130萬股，指數狂瀉以最低收盤，追漲短線資金盡數被套。", "兩日統計股價跌79%，跟風盤現巨大恐慌，小資金放棄離場；人氣未散反成極端信號，莊家視為成敗關鍵。", "收市獨行悟道：投機即人玩人、心理較量，金錢面前人只有恐懼與貪婪，須以股價引導眾生該怕時怕、該貪時貪。", "回酒店對鏡自厭，領帶如蛇縛頸，脫衣棄帶思田園；憶老阿婆兩日跌八成，負罪難言，靜安寺禮佛落淚，僧言放下。"], "qa": [{"q": "主角下午的第一道指令是撤單停止拋售，這在心理戰術上有何用意？", "a": "撤單後大盤在960點上下震盪約五分鐘，他據此判斷對方也停止拋售，為下一步大舉買入摸底；同時以平靜盤面試探雙方情緒，是典型的試盤與節奏控制。"}, {"q": "主角以級差20元、單筆400萬股一次買入後股價由暴跌30%直逼紅盤，這利用了散戶的什麼心理？", "a": "製造「跌不下去」的希望，價格不跌後很多投資人彷彿看到希望而不願賣出，止住拋售；但此時尚無人敢跟進，顯示散戶在貪婪與觀望之間搖擺。"}, {"q": "為何主角在指數接近1000點整數關時停手觀察？", "a": "千點是整數關口，具有心理定錨作用，交易因此清淡、雙方進入膠著；他特意在此節點停買，利用整數關的象徵意義觀察多空心態，再決定下一步節奏。"}, {"q": "主角再次以級差25元、單筆130萬股持續拋出，達到了什麼心理效果？", "a": "指數再度瘋狂下跌、以最低收盤，下午追漲做短線的資金全部被套；先拉後砸的節奏誘使貪婪的跟風盤高位進場，再以暴跌懲罰追漲者，製造恐慌。"}, {"q": "為何跟風盤的恐慌被主角視為「極端信號」？", "a": "小資金終於不能承受下跌的痛苦煎熬而大部分放棄，說明恐懼已到極端；但他更在意人氣未散，若人氣散了接下來就不好做、計劃可能失敗，顯示莊家害怕散戶徹底離場。"}, {"q": "主角在淮海路上悟出的投機之道是什麼？", "a": "投機就是人玩人，是心理較量，也是專業知識與智慧的比拼；金錢面前人只有恐懼與貪婪兩種表現，須以股價走勢引導他們在不該恐懼時恐懼、不該貪婪時貪婪，並利用周邊環境製造所需情緒。"}, {"q": "回到酒店後，主角為何感覺領帶如蛇縛頸？", "a": "他心裡特別空虛，厭惡這套行頭，把領帶看成捆住脖子的蛇，瘋了一般扒下衣服、扯下領帶扔進垃圾筐，渴望像父親一樣穿老棉襖、扛鋤頭在田間耕耘，反映投機生涯帶來的異化與窒息。"}, {"q": "主角為何會想起老阿婆並感到煎熬？", "a": "老阿婆的資產兩天跌去近80%，他不知還有多少人如她一般住進醫院；他想去看看她，卻自覺不知以何身份開口、能否說得出對不起，只能想想，折磨自己的靈魂，顯示其道德衝突與罪疚感。"}, {"q": "主角在靜安寺為何忽然淚流滿面？", "a": "點上香那一刻他感到神聖，明白虔誠燒香是發自內心的感受；在大殿跪拜、頭抵墊子時，壓抑已久的罪疚與空虛傾瀉而出，淚流滿面久久不願抬頭，是內心煎熬的釋放。"}, {"q": "全天交易結束後，會計匯報了哪些關鍵數據？", "a": "大盤跌幅6%，持倉總量32%，整體持倉價格下降20%，幾隻統計範圍內股票全天跌幅超過30%，gp收盤前達到12，兩日內統計股價下降79%。"}], "quotes": ["投机就是人玩人，一个心理上的较量，也是专业知识和智慧的比拼，每个人都有自己的弱点，在金钱面前无非就是两种表现：恐惧和贪婪。", "要想成功地从投机市场赚钱，就必须很恰当地把握投资人的心理，用股票的价格走势引导大家，在不该恐惧的时候恐惧，不该贪婪的时候贪婪。", "跟风盘终于显示出巨大的恐慌，小资金终于不能承受下跌的痛苦煎熬，大部分选择了放弃。", "看着看着感觉领带就像一条蛇一样，捆住了我的脖子，我已经厌恶了这套行头，于是疯了一样从身上扒下衣服，扯下领带，一股脑儿扔进垃圾筐。", "我想我应该去看看她，可是我算干什么的？怎么说？我能说对不起么？我只能想想，折磨一下自己的灵魂而已。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "投机就是人玩人，一个心理上的较量，也是专业知识和智慧的比拼", "n": "莊家以撤單試盤、先拉後砸的節奏與散戶比拼心理承受力，看誰先崩潰。"}, {"p": "情緒操縱", "a": "用股价操纵投资人情绪变化是一个方面，还要利用周边环境，让投资人产生你自己所需要的情绪体验", "n": "莊家以價格走勢導演恐懼與貪婪，引導散戶在不該怕時怕、不該貪時貪。"}, {"p": "恐慌性拋售（恐懼）", "a": "跟风盘终于显示出巨大的恐慌，小资金终于不能承受下跌的痛苦煎熬，大部分选择了放弃", "n": "兩日暴跌79%令小資金不計成本離場，正是砸盤建倉所要的恐慌效果。"}, {"p": "孤獨與異化", "a": "回到酒店之后，心里特别空虚，看着镜子里的我，西装革履，领带扎得紧紧的", "n": "投機生涯令主角自我厭棄、空虛孤獨，領帶如蛇象徵其被都市職業生活異化。"}]}, {"i": 76, "title": "第七十六回　哀乐声中谋千点", "kind": "hui", "summary": ["主角授意小马留京再办研讨会，须在四月初听到救市半官方言论，为千点关口造势。", "午夜研讨中，经济学家与股评力陈千点之重：关乎股民利益、信用责任与社会稳定，此为定锚。", "主角看穿媒体造势本质：评论家以善良良心充当其吸筹的合格帮凶，通稿皆经其审核掌控。", "电视功效昙花一现，报纸文章掐头去尾更持久，一切尽在掌控，明天再给股民一点希望。", "深夜独坐地毯静听哀乐，主角自感灵魂无归、心理失衡，反觉看不清希望的散户更为痛苦。"], "qa": [{"q": "主角為何要在午夜安排電視轉播經濟學家研討會？", "a": "他要讓大眾相信「這麼多大人物都說要救市，股市還有希望」；透過媒體放大千點關口的救市預期，使救市言論成為自我實現的市場信念。"}, {"q": "經濟學家與股評人士如何論證1000點的重要性？", "a": "他們從股民利益、信用與社會責任、社會穩定等角度力陳千點之重，股評更直言破千點將傷透人心；這正是把千點經營成大眾心理定錨的關鍵支撐位。"}, {"q": "主角為何稱這些評論家是他「非常合格的幫凶」？", "a": "連續兩天大跌已超出大眾心理承受範圍，市場出現交易疲態，而他正需要低價廉價籌碼；評論家以善良良心呼籲救市，剛好替他穩住情緒、維持交易熱度。"}, {"q": "主角如何評估電視與報紙兩種媒體的操縱功效？", "a": "電視只是曇花一現的即時功效，報紙文章經掐頭去尾加工且由他審核，影響更有生命力；同一通稿多管道同步投放，形成鋪天蓋地的信息瀑布。"}, {"q": "主角為何認為「消息越多越複雜，投資人越難適應」？", "a": "評論越多，市場噪音越大，散戶越難看清真相、越容易在迷茫中被牽著走；所以主角感嘆，若沒有這些評論家，投資人的日子或許還好過些。"}, {"q": "連續兩天暴跌讓市場陷入什麼心理狀態？主角為何樂見？", "a": "跌幅超出所有人心理承受範圍，市場出現交易疲態、不願參與；這正是主力與散戶比心理承受力的較量——散戶先崩潰鬆手，他才能吸到廉價籌碼。"}, {"q": "主角深夜為何打開哀樂、獨坐地毯？", "a": "資本市場的殘酷浮躁令他夜深時心理失衡，坐在地上才有些許安全感；在如泣如訴的哀樂中，他找不到靈魂所在、沒有了心的歸宿，職業投資人日漸孤獨異化。"}, {"q": "主角為何認為散戶比自己更痛苦？", "a": "因為散戶看不到希望，一切都非常渺茫，失去的能否回來都是未知數；而主角雖受折磨，卻對局勢心中有數，站在操盤者的高處俯瞰眾生的絕望。"}, {"q": "股評人士「破千點將徹底傷了投資人的心」的說法為何顯幼稚？", "a": "股評以情緒化的感性呼號代替理性分析，把千點得失誇大成股市存亡；大眾卻把這類言論奉為權威依據，越是權威的廢話越能左右散戶的信念。"}, {"q": "主角為何要「明天給所有人一點點希望」？", "a": "絕望過度會導致大眾徹底離場、交易停滯，他也就無法吸籌；適度給一點希望，讓股民在恐懼與貪婪之間搖擺，才能維持交易節奏，完成低價建倉。"}], "quotes": ["连续两天的跌幅大大超出所有人的心理承受范围，很容易产生交易疲态，都不愿意参与交易就不好收拾了，毕竟我还需要低价位的廉价筹码。", "所以，这些可爱的经济学家和股评人士正好用他们善良的良心，为我当了一次非常合格的帮凶。", "假如市场要是没有了这些评论家，也许投资人的日子过得还能好一些，消息越多越复杂，投资人越难适应。", "我关闭了所有的灯光，坐在地毯上，背靠着床静静地倾听那如泣如诉的音乐。", "我找不到自己灵魂的所在，没有了心的归宿。"], "psych": [{"p": "情緒操縱", "a": "这些可爱的经济学家和股评人士正好用他们善良的良心，为我当了一次非常合格的帮凶。", "n": "主角借學者與媒體之口造勢，操控大眾情緒以低價吸籌。"}, {"p": "信息瀑布（謠言市）", "a": "明天早晨所有报纸都会看到同样内容的文章，主要的内容我都审核过了，基本上都是通稿。", "n": "同一通稿多管道同步投放，救市預期自我實現成信息瀑布。"}, {"p": "錨定效應", "a": "几个经济学家都呼吁救市，同时也谈到了1000点的重要性", "n": "全社會把千點塑造成生死關口，散戶據此定錨預期。"}, {"p": "孤獨與異化", "a": "我找不到自己灵魂的所在，没有了心的归宿。", "n": "操盤者獨坐暗室聽哀樂，職業投資的孤獨令其異化。"}]}, {"i": 77, "title": "第七十七回　双阴如碑血未干", "kind": "hui", "summary": ["媒體刊登專家救市言論，散戶集體亢奮，主角借輿論造勢點燃貪婪，為建倉鋪路。", "指數逼近千點整數關，人氣沸騰，主角停止買入靜待反手，整數關成心理支點。", "上午拉高後主力反手砸盤，指數回到昨收附近，散戶陷入賣也難、守也難的煎熬。", "阿婆因看股暴跌腦溢血身亡，主角自問血因我而流，資本市場的殘酷迎面撲來。", "下午拉至996點後瘋狂拋售，長上影陰線如雙碑，主角驚覺自己日益
