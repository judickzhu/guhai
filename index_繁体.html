冷漠異化。"], "qa": [{"q": "媒體刊登專家救市言論後，散戶為何集體亢奮搶買？", "a": "專家崇拜與羊群效應：散戶迷信「政府救市迫在眉睫」，壓抑的渴望被點燃，每個人都激動地做著同一件事——買進，人氣因此高漲。"}, {"q": "指數逼近1000點整數關時，主角為何下令停止買入？", "a": "他利用錨定效應：千點整數關是散戶的心理支點，人氣在此到達頂點，正是停止拉抬、準備反手收割的最佳時機。"}, {"q": "股價徘徊在昨收價附近時，散戶為何感到「非常難受」？", "a": "短線賣出沒有空間，繼續持有又擔憂股價下跌，主力以溫水煮青蛙式的壓制令其陷入損失厭惡的兩難，交易因此清淡。"}, {"q": "主角為何既要迫使散戶賣出，又不能傷害他們的交易熱情？", "a": "這是心理較量：建倉需要籌碼，卻要維持散戶的幻想與熱情，讓他們心甘情願交出股票，還不能嚇跑後續接盤者。"}, {"q": "營業部阿姨為何興高采烈勸人買股，主角卻勸她賣出？", "a": "她陷入賭徒謬誤與信息瀑布，堅信政策一出股票飛天；主角清楚這是拉高出貨的圈套，好心勸她見好就收，反被罵「你傻啊」。"}, {"q": "白髮阿婆是因何去世的？", "a": "她看電視見股票跌得一塌糊塗，高血壓引起腦溢血，沒能搶救過來；一場暴跌帶來的恐懼，奪去了老人的性命。"}, {"q": "阿婆之死後，主角為何愣愣站著並自問「血因我而流」？", "a": "道德衝突與罪疚感湧上心頭：資本市場血淋淋的定義被現實重演，而他正是操盤壓低股價的人，這血可能因他而流。"}, {"q": "主角把兩根陰線比作黑色墓碑，反映他心理起了什麼變化？", "a": "死亡焦慮與異化：他無法接受現實，想吶喊哭笑卻壓抑著冷靜如常，甚至驚詫自己為何如此冷漠，人與自我日漸疏離。"}, {"q": "下午主角為何希望盡量延長拉升時間？", "a": "他希望指數在996點高位多停留一會兒，好讓幾個人有機會跑掉，這是他在殺戮式操盤中殘存的一點良知與補償。"}, {"q": "本章結尾為何說沾上股票的人都失去了快樂？", "a": "股市把貪婪與恐懼放大到極致：散戶站上影線成犧牲品，操盤者亦在血腥博弈中異化，天堂地獄只在一念之間。"}], "quotes": ["政府救市迫在眉睫，看起来不救都不行了。", "媒体的力量是巨大的，人们压抑在心底里那种渴望终于被点燃，每个人激动地做着同一件事情——买进。", "今日硬是被活生生的现实让我痛苦地领教，而且，这血有可能是因我而流。", "两根阴线如同两根黑色墓碑，上下衔接，这碑上应该写上谁的名字？！", "如果你爱一个人带他到股市，这儿是天堂。如果你恨一个人带他到股市，这儿是地狱。"], "psych": [{"p": "情緒操縱", "a": "媒体的力量是巨大的，人们压抑在心底里那种渴望终于被点燃，每个人激动地做着同一件事情——买进。", "n": "主力借媒體輿論造勢點燃散戶貪婪，再拉高出貨，全程操控大眾情緒節奏。"}, {"p": "羊群效應（從眾）", "a": "走进证券营业部大厅的时候，里面热闹的场景我没有预料到，看起来人们对后面行情的希望非常大。", "n": "專家言論與大廳熱鬧氛圍互相強化，散戶集體跟風搶買，無人願獨立思考。"}, {"p": "孤獨與異化", "a": "我想哭、想笑，我不知所以然。但是我还是冷静地站着，当作什么事情都没有发生。我诧异我为何如此冷漠？", "n": "主角壓抑吶喊與眼淚裝作若無其事，對自己的冷漠感到陌生，職業殺伐令其異化。"}, {"p": "道德衝突／罪疚感", "a": "今日硬是被活生生的现实让我痛苦地领教，而且，这血有可能是因我而流。", "n": "阿婆之死讓主角良心受拷問，莊家的道德罪疚與資本邏輯激烈交戰。"}]}, {"i": 78, "title": "第七十八回　谣传救市股海惊", "kind": "hui", "summary": ["老阿婆離世令主角深陷低落，街頭獨行三小時，思念老父，職業操盤手的孤獨與異化浮現。", "主角佈下謠言局，命小馬於收盤後放出救市政策即將公佈的消息，以輿論造勢操控市場情緒。", "清晨單筆300萬股不限價拋售，半小時指數由960多點直逼900點整數關，散戶恐慌情緒被引爆。", "停拋後以級差150元不限量接盤，恐慌拋單盡數成交；午間聚餐，透出部門解散、各奔前程的離散感。", "午後盤面異動，方知地方電視台提前洩露救市消息；主角放任自流，收盤被搶出30點下影線，感嘆群眾力量。"], "qa": [{"q": "主角向小馬佈置了什麼心理戰術？他為何選擇收盤後讓消息流傳？", "a": "他要求4月5日前消息見報，並讓「救市政策即將公布」的謠言於次日收盤後流傳，先用輿論造勢影響市場情緒，屬典型的情緒操縱與信息佈局。"}, {"q": "早晨巨量拋售時，主角想像營業部委託櫃前是怎樣的群體心理？", "a": "他設想人站在人身上、希望自己單子早點成交的心情足以讓人發瘋——指數暴跌令散戶陷入恐慌性拋售，不計成本爭先出逃。"}, {"q": "指數「從960多點直逼900點整數關」體現了什麼心理現象？", "a": "900點是散戶心中的整數心理關口，跌破關口的恐懼放大了拋壓；主力正是利用整數關口的錨定心理，快速打穿防線引爆恐慌。"}, {"q": "電視台主持人搶先公佈消息，主角為何判斷「不會有影響」？", "a": "救市本就是他計劃要放的消息，提前洩露只是時間問題；只要謠言成為市場預期，就會自我實現，所以他判斷不會影響計劃。"}, {"q": "午後盤面異動、連山子也在納悶，這說明市場中存在什麼博弈？", "a": "說明除他們之外還有更強的力量在操弄行情，莊家與莊家之間也在進行心理較量，看誰先摸透對方意圖、誰先沉不住氣。"}, {"q": "小麗為何透支虧損？她的行為反映了什麼投機心理？", "a": "小麗透支是想臨走前最後再賺一筆，結果出事；這種「撈最後一筆」的孤注一擲，是貪婪壓過理性、離場前賭徒心態的典型表現。"}, {"q": "老阿婆去世後，主角在街頭的反應折射出什麼樣的精神狀態？", "a": "他西裝革履卻領帶斜掛、失魂落魄，走三小時想找人訴說苦衷與歡樂——操盤手長期博弈後內心孤獨疏離，渴望傾訴卻無人可說。"}, {"q": "主角吩咐報單員「級差價格150元，不限量買進」的用意是什麼？", "a": "他要讓此前因跌太快而未成交的賣出單全部成交，令掛單者都如願以償，藉此完成低位吸籌、為後續行情蓄勢。"}, {"q": "收盤時出現了什麼令主角意外的事？他如何感嘆？", "a": "撤掉賣單放任自流後，盤面竟被人搶出一個30點的下影線，他感嘆「群眾還是很強大的」，散戶承接力出乎意料。"}, {"q": "主角為何說「操盤手不出大問題一直能做，會計報單員不斷地在換」？", "a": "這句話道出職業生態：操盤手靠業績與名聲立足，會計報單員卻隨時可被替換，職業命運懸殊，加深了他對這一行人情冷暖的體會。"}], "quotes": ["第七十八章整个一个下午，我始终不能从那个去世的老阿婆低落的情绪里走出来，毫无目的在大街上转，我想找一个人诉说，我想告诉他我的苦衷，也想告诉他我的欢乐。", "人站在人身上希望自己的单子早点成交的心情足以让人发疯。", "我听后告诉她：“明天下午收盘之后，我想有消息在市场流传，救市政策即将公布。”", "我吩咐报单员：“撤掉卖出的单子，放任自流。”一直这样坚持到收盘，没有想到硬是被人抢出一个30点的下影线，看起来群众还是很强大的。", "操盘手不出大问题一直能做，会计报单员不断地在换。"], "psych": [{"p": "情緒操縱", "a": "我听后告诉她：“明天下午收盘之后，我想有消息在市场流传，救市政策即将公布。”", "n": "主角以救市謠言操控大眾情緒，是莊家輿論造勢的典型手法。"}, {"p": "恐慌性拋售（恐懼）", "a": "人站在人身上希望自己的单子早点成交的心情足以让人发疯", "n": "指數暴跌時散戶爭先出逃、不計成本，正是恐慌性拋售的寫照。"}, {"p": "信息瀑布（謠言市）", "a": "原本计划收盘之后公开的信息，谁知道地方电视台中午有个股票栏目，主持人为了炫耀自己的先见之明，提前说了", "n": "救市消息經電視提前擴散，市場預期隨之自我實現，構成謠言市。"}, {"p": "孤獨與異化", "a": "毫无目的在大街上转，我想找一个人诉说，我想告诉他我的苦衷，也想告诉他我的欢乐。", "n": "操盤手在博弈後深陷孤獨，想傾訴而無人可說，顯露職業異化。"}]}, {"i": 79, "title": "第七十九回　洗盘建仓雨转晴", "kind": "hui", "summary": ["主角先砸盤再拉升，利用散戶追漲與恐慌拋售的心理弱點完成建倉，人氣即其博弈籌碼。", "千點整數關成散戶心理定錨，指數在其上下反覆震盪，莊家藉此調控多空情緒。", "營業部人山人海、排隊搶買，群眾的貪婪與從眾令主角斷言再打壓無益，改為加速建倉。", "主角命小馬發布辟謠通稿，以輿論造勢操縱市場預期，展開信息層面的心理戰。", "靜安寺畔主角自覺理性吞噬感性，感嘆職業生涯令自己異化，失去正常人的情感體驗。"], "qa": [{"q": "開盤後主角為何先按兵不動、只靜靜觀察盤面？", "a": "他在試盤：高開25點、衝上千點後量縮價落，據此判斷對方資金實力不大、後市信心不堅，這正是心理較量中先摸清對手與散戶情緒再出手的節奏。"}, {"q": "主角砸盤30分鐘後，從統計數據看出散戶什麼心理弱點？", "a": "他看出人氣雖高漲，散戶仍掩不住內心的恐懼：上漲時敢於追進，下跌時恐慌性的拋盤更嚴重，這正是情緒操縱可以利用的獵物天性。"}, {"q": "散戶為何在千點整數關前表現得如此亢奮？", "a": "千點是整數關口，散戶把它當作心理定錨與行情方向標，越接近越興奮；莊家正是利用這種錨定心理反覆試探，牽動大眾多空情緒。"}, {"q": "中午營業部人山人海、排隊搶買，反映什麼群體心理？", "a": "委託窗口排著長隊，連兩人吵架都無人圍觀，人人不肯放棄排隊發財的機會，正是羊群效應與暴富慾望的寫照，眾人一致看好令主角斷言再打壓無益。"}, {"q": "主角為何放棄繼續打壓以降低成本的想法？", "a": "他見人氣如此高漲，判斷再往下打壓希望降低成本的可能性不大，若不加速建倉就可能功虧一簣，說明莊家也要順應群體情緒、因勢調整節奏。"}, {"q": "主角要小馬發布辟謠通稿，是怎樣的輿論心理戰？", "a": "他以記者採訪形式散布「管理層辟謠、暫無救市打算」，再讓各周刊轉載、措辭藝術，意在製造信息瀑布，動搖散戶預期、壓制人氣，以利建倉。"}, {"q": "全天統計為何讓主角「心裡沉甸甸」？", "a": "全天增倉21%但成本上升20%，總持倉僅49%，距一周後75%的目標尚遠；跟風盤高漲令建倉難度遠超預想，他預感下周必有一場更激烈的心理廝殺。"}, {"q": "主角為何兩年來第一次回應同事「早上好」？", "a": "他長期沉浸於操盤博弈、疏離人際，連日常寒暄都刻意迴避；這天破天荒回應，眾人皆感奇怪，折射出職業莊家與日常社會之間的孤獨與異化。"}, {"q": "傍晚在靜安寺，主角對自己產生了怎樣的反思？", "a": "他看善男信女虔誠至真，靈魂深處莫名感動，自覺從業太久失去了正常人應有的情感體驗，理性太多而感性幾乎缺失，對這種異化的人生不知對錯。"}, {"q": "主角如何「順勢而為」地把群體情緒變成建倉的順風車？", "a": "他上午試出散戶追漲殺跌、千點定錨的心理，中午親見營業部人氣，下午先靜觀、尾盤再以百萬股連單拉升，突破千點收於1039，全程借大眾情緒完成誘多。"}], "quotes": ["看起来虽然人气高涨，可是还是掩饰不住内心的恐惧，上涨的时候敢于追进，下跌的时候恐慌性的抛盘更严重。", "大盘在瞬间开始掉头向下，我控制的这几只股票的价格，更是反应迅速，价格开始向下狂跌，每股从上涨30元到现在开始下跌20元，整个市场疯狂了。", "中午来到邻近的营业部，整个营业部内人山人海，委托窗口排了长长的队，有两个人在吵架，围观的不多起哄的不少，谁也不希望为了看打架放弃自己排队发财的机会。", "照目前这种情况，再往下打压希望降低成本的可能性不大，人气这样高涨，要加速建仓，放弃之前的打算才是最佳的选择。否则，有可能功亏一篑。", "从事资本投资这个行业太久，我渐渐失去了一个正常人应该有的情感体验，更不可能像这些人一样如此虔诚至真。性格里太多的理性，对于几乎完全缺失了感性的我，真不知道是对是错。"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "上涨的时候敢于追进，下跌的时候恐慌性的抛盘更严重。", "n": "主角以砸盤試出散戶追漲殺跌的天性，恐慌拋售正是他建倉的獵物。"}, {"p": "錨定效應", "a": "高开之后，大盘一路向上直至1000点的整数关，成交量渐渐地缩小", "n": "千點整數關是散戶的心理定錨，莊家反覆在其上下試盤，牽動多空情緒。"}, {"p": "羊群效應（從眾）", "a": "整个营业部内人山人海，委托窗口排了长长的队，有两个人在吵架，围观的不多起哄的不少", "n": "人人搶排隊發財、連吵架都不肯圍觀，從眾熱情令主角改判加速建倉。"}, {"p": "孤獨與異化", "a": "从事资本投资这个行业太久，我渐渐失去了一个正常人应该有的情感体验", "n": "主角自覺理性吞噬感性，職業生涯把他異化成失去情感體驗的博弈機器。"}]}, {"i": 80, "title": "第八十回　夜雨江湖谋冷暖", "kind": "hui", "summary": ["小張小麗邀師做客遭婉拒；主角感慨二人心理承受不足，小麗高壓下失去少女歡顏。", "部門撤銷、一線辭退工齡買斷，公司資助留學；主角聞訊頓生兔死狐悲之感。", "酒吧夜會匯報持倉，議定下周倉位增至75%以上，爭取一個月內結束資金運作。", "散戶做多信心十足、跟風盤驚人；莊家謀劃周末放辟謠「澆冷水」壓人氣以利建倉。", "浴缸讀武俠悟股市如江湖，缺乏內功與泥鰍之滑者，終被市場消滅。"], "qa": [{"q": "山子對散戶的什麼現象感到「想不通」？老胡如何解釋這背後的群體心理？", "a": "散戶做多信心很大，稍有風吹草動就往裡衝，跟風盤大得嚇人；老胡指出漲久形成多頭思維，高位震盪不足以喚醒危機感，賺錢的欲望刺激得他們發狂，正是羊群與貪婪心理的寫照。"}, {"q": "「一群聰明人集中在一起，人人都很看得起自己。5%的利潤足以讓一個人失去理智」揭露了莊家眼中的哪種散戶心理？", "a": "過度自信：散戶自視甚高，輕視風險，小利潤便足以令其喪失理智；莊家正是看穿這份自信，才得以屢屢引誘他們在錯誤的位置接盤。"}, {"q": "「我」為何要「試」著往下探跌？這體現了莊家什麼心理戰術？", "a": "這是試盤：試探散戶的心理承受底線。再往下跌會打擊人氣、不利未來出貨；且散戶被套後按兵不動、出現交易疲態，莊家便無法收集籌碼，故跌幅須恰到好處。"}, {"q": "「我」安排小馬在媒體放出辟謠信息，心理用意何在？", "a": "輿論造勢與情緒操縱：利用周末散戶注意力集中之際，把消息做成利空解讀，給做多熱情「澆點冷水」，壓抑人氣、動搖信心，以便下周低價加速建倉。"}, {"q": "為何「維持高位震盪」比直接拉抬對莊家更有利？", "a": "溫水煮青蛙：高位震盪讓散戶習以為常、麻痺警覺，既保住做多信心以維持跟風盤，又不讓風險意識覺醒；待倉位建足，暴跌隨時降臨，出貨便有接盤。"}, {"q": "老胡為何說散戶「賺錢的欲望刺激著他們發狂」？", "a": "漲了這麼長時間，大家思維習慣已形成多頭思維，高位震盪不足以令他們感到危險臨近；貪婪壓過恐懼，追漲慾望使散戶失去理性判斷，成為莊家收割的溫床。"}, {"q": "小張、小麗邀「我」到家做客，「我」如何回應？", "a": "「我」以這段時間事情多、希望冷靜一些為由婉拒，說等這次資金運作做完了再專程登門；言下之意，戰事未了，不願分心。"}, {"q": "主角對小張、小麗的評價折射出職業投資人怎樣的內在處境？", "a": "孤獨與異化：小張兩年未學到多少、心理承受不足，小麗機械執行指令、高壓下失去笑容；主角眼看身邊人被股市耗盡青春，深感疏離與辛酸。"}, {"q": "聽罷頭頭對人員的安排，「我」為何有「兔死狐悲」之感？", "a": "部門解散、助手與報單員被工齡買斷遣散，主角雖有安置卻感同類被棄的寒意；留學雖是最好的出路，仍隱約觸及莊家生涯的良心拷問與自危。"}, {"q": "主角為何在浴缸裡推崇韋小寶、講究「內功」？", "a": "韋小寶無功夫卻像泥鰍般光滑，是生存的能耐；股市如危機四伏的江湖，缺乏內功和泥鰍滑溜技能的人基本上都被消滅，而股市的內功便是專業知識與經驗。"}], "quotes": ["股市本来就这样子，一群聪明人集中在一起，人人都很看得起自己。5%的利润足以让一个人失去理智。", "涨了这么长时间了。大家思维习惯已经形成多头思维，目前维持高位的震荡，还不足以让他们感到这是危险来临的时候。赚钱的欲望刺激着他们发狂。", "这帮散户目前看起来做多的信心很大，稍微有点风吹草动就往里冲。跟风盘大得吓人。", "晚上搞一个辟谣的信息出来，让小散户理解成利空，有利于下周建仓。", "两年的时光就这样机械地执行指令，高压下失去了一个原本属于小姑娘应有的欢乐和笑容，脸上的神色始终和她的年龄不相称。"], "psych": [{"p": "情緒操縱", "a": "晚上搞一个辟谣的信息出来，让小散户理解成利空，有利于下周建仓。", "n": "莊家以辟謠為名製造利空解讀，操控大眾情緒為建倉鋪路。"}, {"p": "羊群效應（從眾）", "a": "这帮散户目前看起来做多的信心很大，稍微有点风吹草动就往里冲。跟风盘大得吓人。", "n": "散戶見漲齊衝、跟風盤驚人，正是眾人一致看好的從眾心理。"}, {"p": "追漲（貪婪）", "a": "赚钱的欲望刺激着他们发狂。", "n": "貪婪慾望壓過危機警覺，散戶在貪婪驅使下盲目追高。"}, {"p": "孤獨與異化", "a": "两年的时光就这样机械地执行指令，高压下失去了一个原本属于小姑娘应有的欢乐和笑容", "n": "高壓機械的操盤生涯吞噬小麗的青春笑容，職業投資人漸被異化。"}]}, {"i": 81, "title": "第八十一回　股评喧嚣人独醒", "kind": "hui", "summary": ["散户大厅人满为患，股民追崇专家与内幕消息，把报告会当作心理依靠，从众迷信可见一斑。", "上海男子吹嘘操盘手朋友传授庄家专用指标，实为移动平均线，众人盲目崇拜，主角暗叹「到底谁在愚弄谁」。", "专家宣称大盘突破1550点势在必行，听众掌声雷动寄望后市，主角听不下去由侧门离场。", "主角嘱小马周日晚电视再播加深印象，又思须借媒体再造恐惧以利低位建仓，舆论造势亦是心理战。", "主角望K线自问人生意义，见善良人遭洗劫良心受谴责，却知职业投资人只须做好分内事；孤独深思愈增痛苦。"], "qa": [{"q": "主角参加股评报告会时，散户大厅呈现出怎样的群体状态？", "a": "散户大厅满满当当找不到空凳，后面站了很多人，股民争相追崇专家；委托窗口前人挤成一团争相买卖，无人理智想想买卖到底因为什么，群体狂热毕现。"}, {"q": "上海男人用什么话术征服听众？这体现何种心理？", "a": "他吹嘘操盘手朋友传授庄家专用特殊指标，庄家买卖一看便知，说了半天其实只是移动平均线；听众满目崇拜，正是对专家与「内幕」的迷信，被主角讥为「葵花宝典」级说法。"}, {"q": "专家宣称了哪些「内幕消息」？这些话起什么心理作用？", "a": "专家称大盘将破1550点、管理层已要求大资金买股票，还与机构操盘手通了电话；以「内幕」包装看多观点，增加可信度与神秘感，令听众对后市寄望更大。"}, {"q": "主角看到众人听讲时忽然感到悲哀，他心里提出什么疑问？", "a": "他问「到底谁在愚弄谁」，是男人被朋友愚弄还是他愚弄了听众，不得而知；只见讲话的和听的都沉浸在幸福喜悦之中，联想到委托窗口前争相买卖的人群，感叹无人理智。"}, {"q": "老胡如何讽刺报告会下的听众？山子又如何接话？", "a": "老胡说台下这帮傻子：牛吹到这个份上居然有人相信，无论是管理层的意图还是机构操盘手，谁有胆子告诉他市场下一步怎么走？山子反问庄家专用指标谁在用，众人哈哈大笑。"}, {"q": "主角为何决定在媒体上大做文章？他要用什么心理战术？", "a": "因听众对后市寄望大、低位建仓难度加大，他决定在媒体上大做文章，再一次给市场以恐惧，从而加大建仓力度；这是借恐吓情绪压低股价、舆论造势配合砸盘建仓之术。"}, {"q": "报纸头版头条登出什么？主角如何解读专家的夸大其辞？", "a": "头版头条是「管理层领导辟谣救市传闻」。主角细想专家言论虽夸大其辞，看多行情的思路却清清楚楚，选择如此讲法不过为增加可信程度与神秘感罢了。"}, {"q": "主角感叹「男人什么时候智商等于0」？这话如何注解股民心理？", "a": "他说女人恋爱时智商等于0，男人则是在股市巨大的利益诱惑下，男女智商都等于0——否则怎会不面对现实，盲目夸大自己的重要性和能力，正是贪婪使人丧失理性的写照。"}, {"q": "主角下午给小马打电话交代什么？这属于什么布局？", "a": "他请小马周日晚上的电视再来一次以加深印象，小马满口应承；配合媒体造恐惧，是庄家借舆论反复强化预期、为低位建仓服务的心理战布局。"}, {"q": "结尾主角对人生意义与孤独有何感悟？", "a": "望着K线图他茫然自问：一生就这样孤独地面对曲线走势，人生意义何在？见善良人被洗劫得两手空空，良心受谴责；却明白职业投资人只须做好分内事，又叹思考太多痛苦越大。"}], "quotes": ["看着周围人的反应和讲话的这个男人，我忽然感到非常的悲哀，到底谁在愚弄谁？", "根据内幕消息，最近一段时间大盘有可能再创新高，突破1550点势在必行，而且管理层已经明确要求大资金开始买股票。", "不管是管理层的意图还是某机构的操盘手，谁有胆子告诉他市场下一步怎么走？可是，下面的人居然相信。", "在巨大的利益诱惑下男人女人的智商都等于0。否则，怎么会不面对现实，盲目地夸大自己的重要性和能力。", "孤独能给人更多思考的空间，但是，思考不一定就是好事情，一个人思考得太多，那么，痛苦的成分就越大。"], "psych": [{"p": "專家崇拜／過度自信", "a": "他传授给我一个机构专门用的特殊指标，特别准确，庄家的买卖你一看就知道。", "n": "散户把操盘手内幕与庄家专用指标奉为圭臬，盲目迷信专家，正是专家崇拜的典型写照。"}, {"p": "羊群效應（從眾）", "a": "哪儿有报告会都参加，不管是谁在讲，去了能不能听出什么名堂倒是其次，主要是心理上有了一个依靠。", "n": "股民不问内容只求心理依靠、赶场跟风，从众行为清晰可辨。"}, {"p": "情緒操縱", "a": "必须在媒体上大做文章，再一次给市场以恐惧，从而加大建仓力度。", "n": "庄家借媒体制造恐惧以压低股价吸筹，正是操纵大众情绪以达成目的。"}, {"p": "孤獨與異化", "a": "就这样一生非常孤独地面对这样的曲线走势？人生的意义到底在哪儿？", "n": "主角自认一生孤独面对K线，职业投资人的疏离与意义迷失跃然纸上。"}]}, {"i": 82, "title": "第八十二回　自拉自唱建仓难", "kind": "hui", "summary": ["周一低开三十余点，主角借媒体辟谣之势连续大手笔买入，指数一度冲上1047点高点。", "随即撤单连续卖出打压，个股骤跌两成、指数跌破千点，散户追涨意愿淡薄，自拉自唱难以为继。", "主角剖析散户群体心理：多数坚信管理层必救市，辟谣后观望浓厚，唯令众人思维混乱方为高招。", "全天两回合增仓仅6%至55%，主角自叹魅力全无、跟随者寥寥，收市后茫然无措，异化之态尽显。", "收盘后安排小马在媒体制造两种对立声音，并与老胡、山子相约周五前压低指数建仓至75%。"], "qa": [{"q": "周一开盘散户表现出怎样的群体心理？主角如何利用这一点？", "a": "低开30多点令大众投资人感到恐惧，追涨意愿不强烈，散户被恐惧笼罩不敢放手追涨；主角借机持续大手笔买入，独自把指数拉升至1047点高点。"}, {"q": "主角为何说股票投资是「零和博弈的游戏」？他对小投资人情绪有何策略？", "a": "因为没有对手参与，一个人单方面不能玩。他主张让小投资人亏钱可以，但一定要令其心情舒畅，把情绪照顾好，否则他们不陪你玩就麻烦了。"}, {"q": "分析散户现状后，主角为何认为「需要大家思维混乱才是高招」？", "a": "多数散户坚信管理层救市会成真，少数优柔寡断，辟谣后心理有阴影、观望浓厚；唯有令众人思维混乱，才能瓦解一致预期、乱中诱其入局。"}, {"q": "专家们在电视上的分析对市场产生了什么心理影响？主角为何满意？", "a": "专家学者「掏心窝子」分析，结论是辟谣后传言不可能成真、下跌还将继续，形成权威背书；正合主角心意，为其次日操盘预先引导了散户预期。"}, {"q": "全天操盘为何让主角感到「悲哀」？反映了他怎样的心理状态？", "a": "涨跌都吸引不了小投资人，震荡逾10%仓位却只增6%，自拉自唱出力不讨好；他自叹魅力全无、跟随者寥寥，是庄家面对无人博弈的挫败与孤独。"}, {"q": "收市后主角坐出租车要去哪里？这个细节说明什么？", "a": "他上车说「到苏州」，被司机拒载后只坐了不到200米便下车，四顾茫茫不知去哪儿。这反映操盘失败后他的茫然与自我疏离，与日常生活严重脱节。"}, {"q": "主角要求小马在研讨会前制造「两种不同的声音」是何种心理战术？", "a": "这是舆论造势之术：让媒体天天出现两种对立声音，形成信息瀑布，令散户预期混乱、无所适从，为研讨会前后的建仓行情埋下伏笔。"}, {"q": "全天交易结束后主角的持仓与成本如何？他如何评价这一天？", "a": "全天增仓6%，整体仓位达55%，持仓成本较初始值下降30%。他称这是有史以来最为悲哀的一天，只吩咐大家「下班吧，资料封存」。"}, {"q": "老胡约主角在衡山路谈了什么？大家当天交易情况如何？", "a": "谈当日交易：大家上下震幅累计超过20%，但成交量不大、收获都很差。主角告诫不能冒进，需压低指数努力建仓，避免因小失大。"}, {"q": "主角制定了怎样的建仓计划？", "a": "每天不要大幅度震荡，压低指数努力建仓，争取周五前达到75%仓位，实在不行也要超过60%方能赚钱。山子、老胡均表示可达75%。"}], "quotes": ["最终的结论非常符合我的要求“既然管理层辟谣了，那么传言就不可能成为真的，因此，股市下跌还将继续进行。”", "股票投资是一个零和博弈的游戏，没有对手参与的话，一个人单方面是不能玩的。", "你让他亏钱可以，但是，你一定要让他心情舒畅才行。否则，他不陪你玩就麻烦了。", "那么，在这个时候非常需要大家思维混乱才是高招。", "真是莫名其妙，坐了不到200米的出租车马上又下来，要到哪儿去自己也不知道，难怪人家担心。"], "psych": [{"p": "情緒操縱", "a": "你让他亏钱可以，但是，你一定要让他心情舒畅才行。否则，他不陪你玩就麻烦了。", "n": "莊家把散戶情緒當作操盤資源：虧錢可以，但必須令其心情舒暢以留住對手。"}, {"p": "心理較量（看誰先崩潰）", "a": "这是一种非常尴尬的局面，涨跌都不能吸引小投资人。", "n": "自拉自唱無人跟隨，莊家與散戶比耐心與承受力，看誰先崩潰。"}, {"p": "信息瀑布（謠言市）", "a": "既然管理层辟谣了，那么传言就不可能成为真的，因此，股市下跌还将继续进行。", "n": "媒體闢謠與專家背書構成信息瀑布，散戶預期被引導而自我實現。"}, {"p": "孤獨與異化", "a": "真是莫名其妙，坐了不到200米的出租车马上又下来，要到哪儿去自己也不知道，难怪人家担心。", "n": "操盤失敗後的茫然與疏離，職業投資人與日常世界徹底斷裂。"}]}, {"i": 83, "title": "第八十三回　温水煮蛙破僵局", "kind": "hui", "summary": ["「交易疲態」如絕症般可怕：割肉重來的資金不容再敗，操盤手職業生涯懸於一念。", "深夜借酒請教小馬，悟出擾敵真諦：沒有方向的走勢會讓人發狂。", "定計打破常規、不漲不跌：令看漲者憂跌、看跌者憂漲，連續三天溫水煮青蛙。", "莊家首日先壓後拉反覆震盪，持倉升至五成六；散戶在營業部怨聲載道卻無計可施。", "操盤手獨自扛壓、以酒澆愁，連一句尋常問好也令同事驚詫，職業投資人的孤獨與異化盡顯。"], "qa": [{"q": "「交易疲態」為何被形容為建倉機構的「絕症」？它最致命的是打擊了什麼？", "a": "建倉若在初級階段陷入僵局、短時間無法打破，整個交易計劃都要重新制定；且此資金是割肉之後重來，一旦失敗便意味職業生涯終結。最致命的是心理層面：操盤手背負輸不起的壓力，這是與自己耐心的較量。"}, {"q": "莊家為何嚴防手下發現自己的困惑？這反映資本世界什麼心理法則？", "a": "眾人都是看他的眼色行事，一旦發現他困惑，就會分心應對、力求自保，不再堅持攻守同盟。領袖的信心一旦動搖便會迅速傳染、瓦解同盟，這是資本的殘酷性，也是職業投資人生存所必需的手段。"}, {"q": "小馬說莊家需要「對手迷茫，失去觀點」——這背後是什麼心理戰術？", "a": "讓對手失去方向感與觀點，正是心理較量的核心：沒有方向的走勢會讓人發狂，散戶在焦躁中失去理性判斷與既定信念，只能任憑莊家擺佈，交出手中的低位籌碼。"}, {"q": "「打破常規，不漲不跌」如何從心理上困住兩類投資人？", "a": "讓看漲的人擔憂下跌、看跌的人擔憂上漲，多空雙方都被懸在猜疑與不安之中；漲跌都不給出明確方向，散戶的信念被架空，情緒取代了判斷，誰先崩潰誰就交出籌碼。"}, {"q": "「溫水煮青蛙」運用了什麼心理機制？為何莊家叮囑「切忌急躁」？", "a": "以緩慢震盪消磨散戶的耐心與警覺，令其逐漸麻木、放棄抵抗而交出低位籌碼；急跌會招散戶搶反彈、急漲會遭高位拋售做短差，唯有慢火才能讓獵物失去警惕而不自知。"}, {"q": "散戶在「不死不活」的行情中大罵「莊家神經病」，反映了什麼群體心理？", "a": "失去方向的羊群情緒低落、怨氣外洩，把虧損歸咎於莊家；營業部人滿為患卻無人交易，正是群體迷茫、觀點盡失的寫照——被架空信念的散戶只剩下罵聲與觀望。"}, {"q": "莊家為何要求「收盤控制在最低價附近，但是不要創新低」？", "a": "這是心理支撐位的精準運用：昨日低點、整數關口都是散戶的心理錨點，創新低會擊潰信心、引發恐慌性拋售與失控；不創新低則在關口之上持續施壓，既消磨散戶又不斷日後出貨的後路。"}, {"q": "主角為何以酒精排解壓力？這段描寫透露了他什麼心理狀態？", "a": "精神高度緊張之下，酒精成了最好的興奮劑，是他長期養成的習慣；職業操盤手獨自扛起全部壓力、連困惑都不能示人，只能借酒與深夜的電話尋求解脫，孤獨與異化不言而喻。"}, {"q": "小張完成操作後，他為何「冷冷地說：資料封存。下班吧」？", "a": "心中雖暗誇小張穩健不冒進、严守紀律，面上卻刻意保持冷淡：既是上位者維持權威的手段，也顯示長年博弈已讓他習慣隱藏真實情緒，連讚許都不肯露半點聲色。"}, {"q": "公園老人打太極與小姑娘的驚訝反應，在心理層面有何用意？", "a": "公園的安詳與股海的緊張形成對照，反襯主角的離群；一句尋常問好竟令同事驚詫「他沒事吧」，側寫他平日冷峻疏離——長期的職業博弈已把他異化成與常人隔絕的孤獨者。"}], "quotes": ["“交易疲态”，这是最可怕的状态。", "打破常规，不涨不跌，让看涨的人担忧下跌，让看跌的人担忧上涨。", "没有方向的走势会让人发狂。", "今天开始，连续三天温水煮青蛙。切忌急躁！", "收盘控制在最低价附近，但是不要创新低即可。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "打破常规，不涨不跌，让看涨的人担忧下跌，让看跌的人担忧上涨。", "n": "以無方向走勢與散戶比拼心理承受力，看誰先失去觀點、先崩潰。"}, {"p": "情緒操縱", "a": "今天开始，连续三天温水煮青蛙。切忌急躁！", "n": "以溫水煮青蛙式震盪操控大眾情緒，消磨耐心逼出低位籌碼。"}, {"p": "心理支撐位", "a": "收盘控制在最低价附近，但是不要创新低即可。", "n": "精準運用昨日低點與收盤價等心理關口，施壓卻不擊潰信心。"}, {"p": "孤獨與異化", "a": "他刚才说早上好？他没事吧今天？！", "n": "一句尋常問好令同事驚詫，反襯職業操盤手長期離群的異化狀態。"}]}, {"i": 84, "title": "第八十四回　静水藏锋守盘局", "kind": "hui", "summary": ["平淡盤局是心理較量：莊家與散戶比耐性，誰先失去耐心誰先輸，主角以忍為攻。", "恐慌散戶增多反成莊家利好，成交量放大意味籌碼鬆動，砸盤低吸趁虛而入。", "莊家情緒操縱：壓抑市場欲望、維持膠著盤局，積聚能量待突破後誘引資金出貨。", "千點整數關口是市場心理錨點，主角圍繞1000點推算倉位，節奏全繫於心理關口。", "主角獨處泡茶愈品愈孤獨，交易吞噬生活，感嘆生命一天天向死亡邁進，內在異化日深。"], "qa": [{"q": "本章開頭主角說「平淡的日子非常難熬」，這在心理博弈上是什麼意思？", "a": "這是典型的心理較量：平淡盤局中雙方都在比耐性，誰先失去耐心、先動手誰就輸。主角明知小投資人已與他無意識地對抗，也必須忍到極致，因為「誰的耐性大誰最終取勝的概率就大」。"}, {"q": "主角為何把「恐慌的人明顯多於前一個交易日」視為積極信號？", "a": "散戶恐慌拋售時不計成本交出籌碼，正是莊家低吸建倉的良機。成交量放大說明群體恐懼在蔓延、籌碼在鬆動換手，所以對主角而言是積極信號——他盼的正是這種群體性恐慌。"}, {"q": "主角為何要讓整個市場「處於極度壓抑的狀態」？", "a": "這是莊家的情緒操縱：先壓抑散戶的交易欲望與熱情，讓大家都壓抑著等大盤突破，積聚能量後再向上突破，才能引來更多資金積極參與；反之急於拉升只會「適得其反」。"}, {"q": "主角反覆念叨「1000點之下」的倉位問題，體現什麼心理？", "a": "體現錨定效應：千點整數關口是市場的心理錨點，主角以此衡量倉位與行情，1000點之上才敢把倉位加到75%。整數關口決定大眾的心理支撐與阻力，莊家操盤也圍繞這些心理關口設計節奏。"}, {"q": "主角一個人品茶為何「越品越孤獨」？", "a": "品茶至少需要兩個人分享，他卻只想獨處、不願與任何人交往，把全部心思集中在交易上。這是職業投資人的孤獨與異化——人群愈喧囂，他離正常生活愈遠，交易成了唯一的寄託。"}, {"q": "「生命就這樣一天一天向著死亡邁進」折射出主角怎樣的心態？", "a": "交易佔據他全部生活，連散步、泡茶都繞著行情打轉；時間流逝在他眼裡不是生活而是向死亡邁進。這透出死亡焦慮：在刀口舔血的博弈中，他感到生命正被行情一天天吞噬。"}, {"q": "開盤跌破950點後，小張先大單買入又撤單改賣，是什麼戰術？", "a": "這是節奏與試盤：先以每筆200萬股、級差100元的買單把價格拉離950點，再撤掉未成交單，改以每筆150萬股、級差10元的賣單壓低指數至930點附近，反覆試探承接力並攤低持倉成本。"}, {"q": "主角分析「散戶觀望、專家言論多空不一、走勢破位後橫盤」，說明什麼群體心理？", "a": "散戶在破位橫盤中普遍觀望，缺乏方向感便不敢出手，寧可等大盤表態；專家言論多空不一更使信息混亂。這是典型的羊群效應——大家都要等別人先動才敢動，主力因而難覓對手盤。"}, {"q": "主角說要「依靠目前聚集起來的能量出貨」，這是什麼心理戰術？", "a": "這是溫水煮青蛙式的布局：先壓抑情緒、維持膠著，讓散戶的參與欲望不斷積聚，日後向上突破時，這股壓抑已久的能量會集體釋放追入，成為莊家從容出貨的對手盤。"}, {"q": "主角「凡是涉及數據的東西都很敏感」、不斷檢討自己的行為，說明什麼？", "a": "他身處必須完美無缺的背水一戰，對倉位、成本、級差每個數據都如履薄冰；這既是專業素養，也是一種勝負心與焦慮——把全部自我價值押在「成敗在此一舉」的博弈上。"}], "quotes": ["平淡的日子非常难熬，这种交易是考验双方耐性的时候，谁的耐性大谁最终取胜的概率就大。", "从全天交易的情况来看，震荡之后成交量较前一个交易日有所放大，从另外一个侧面可以看出，恐慌的人明显多于前一个交易日了，这是比较积极的信号。", "让整个市场都处于极度压抑的状态，然后向上突破才能引来更多的资金积极参与，否则会适得其反。", "一个人品茶越品越孤独，我深有体会。", "天气开始有点热了，时间过得真快，生命就这样一天一天向着死亡迈进。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "这种交易是考验双方耐性的时候，谁的耐性大谁最终取胜的概率就大。", "n": "平淡盤局中莊家與散戶比耐性，看誰先失去耐心先動手。"}, {"p": "情緒操縱", "a": "让整个市场都处于极度压抑的状态，然后向上突破才能引来更多的资金积极参与", "n": "莊家壓抑全場交易欲望，積聚能量再突破誘引資金入場。"}, {"p": "錨定效應", "a": "按照目前这样的状态，1000点之下能否满足75%的仓位确实有点难度", "n": "千點整數關口成為主角操盤的心理錨點與倉位標尺。"}, {"p": "孤獨與異化", "a": "品茶这东西至少需要两个人，一个人品茶越品越孤独，我深有体会。", "n": "職業投資人離群索居，心思全繫交易，愈熱鬧愈孤獨。"}]}, {"i": 85, "title": "第八十五回　万骨功成独怅然", "kind": "hui", "summary": ["午宴剖析操盤職責：掃單推高、撤單砸盤製造恐慌，逼散戶交出籌碼。", "主力與小資金的較量：任其自相殘殺至喪失方向，再猛砸股價令其潰散。", "br居ar上乃散戶行情，如今破位近月散戶心力疲憊，僅餘恐懼與僥倖。", "一將功成萬骨枯：一人賺錢需多人虧損，小麗與會計方悟買賣滿是陰謀。", "小張離去令主角如釋重負卻悵然若失，職業投資人的孤獨與異化籠罩全章。"], "qa": [{"q": "主角指出操盤手具有哪兩種使命？", "a": "一是維持市場價格走勢的趨勢統一，二是為自己效命的利益集團謀取利益；從整體策劃到具體實施都須嚴謹仔細，不可有失。"}, {"q": "小張把操盤變成「保姆」式操作，會造成什麼心理後果？", "a": "他未發揮股價推手作用，股價從低到高再跌下去一路都有他的身影；每次20萬股、15元價差使上漲緩慢，給所有參與者機會，也抬高持倉成本，還可能被做短線資金高位出貨。"}, {"q": "主力如何利用散戶的恐慌心理完成建倉與洗盤？", "a": "先以巨單掃光賣單推高價位，停止交易並撤單，待主動性賣盤出現即大幅拋售砸至低位，製造恐慌性拋盤，逼散戶交出籌碼且無高位出貨機會。"}, {"q": "「每一個數字後面都是一個人」體現了什麼博弈觀念？", "a": "每個數字背後都是有思想、有目的的活人，他們也透過價格變化觀察主力；雙方互為對手，資本市場就是戰場，在戰場上不可小看敵人，這是典型的心理較量思維。"}, {"q": "春節前後的散戶行情中，散戶表現出什麼群體心理？", "a": "小投資人人氣高漲、躍躍欲試、鬥志昂揚，看好後市令他們興奮；主力順勢而為，打壓他建倉、拉高他出貨，群情高漲的散戶反而成了主力搬運籌碼的苦力。"}, {"q": "主力如何運用節奏與試盤消耗小資金的心智？", "a": "建倉時一筆掃光賣單便停止交易，讓小資金自相殘殺，殺到沒有方向感時再猛砸股價；自己絕不持續小成交參與，保持不動才能看清對手行為與目的。"}, {"q": "主角如何解讀br跌破ar將近一個月？", "a": "一來表示主力正在建倉，二來表示散戶已被連續破位下行搞得心力疲憊，缺乏交易熱情，剩下的恐懼成分與僥倖心理居多；此時行情正處於主力行情階段。"}, {"q": "小麗與會計聽完講解後有何感悟？", "a": "小麗說快兩年了只知報單，從未想過買賣有這麼多含義，散戶不賺錢正因不明白買賣的含義；會計說快退休了，這輩子不再碰股票，才知背後有這麼複雜的陰謀。"}, {"q": "小張為何放棄操盤手之路？主角為何不加勸阻？", "a": "小張自認沒有那麼大的智慧，從全局方面根本沒有思路；主角認為他放棄是對的，平平淡淡過日子更好，此番勸解折射出職業投資之路的異化與代價。"}, {"q": "章節結尾主角的心境如何？", "a": "小張離去令主角如釋重負卻又惆悵，好比知己好友逐一離去，只剩自己孤零零一人，茫然若失的感覺令人消沉許久，正是職業投資人孤獨與異化的寫照。"}], "quotes": ["你一定要记住，每一个数字后面都是一个人，他们也是有思想有目的活生生的人，必须高度重视他们的存在。", "这个市场一个人赚钱需要好多人亏损才能满足赚钱的需求。和打仗没有什么区别，一将功成万骨枯就是这个道理。", "你打压他建仓，你拉高他出货，你们完全成了他们的苦力。", "二来表示散户已经被连续的破位下行搞得心力疲惫。缺乏交易的热情，剩下的恐惧成分和侥幸心理大一些。", "好比一直一个人生活，忽然来了许多好友知己，大家在一起非常开心，非常投机，忽然有一天，这些知己好友一个个都离你而去，留下的只有你自己孤零零一个人的时候，那种茫然若失的感觉让人消沉许久。"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "在大盘自由落体下降30点的时候，说明有投资人恐慌性的抛盘卖出", "n": "主力砸盤製造恐慌，逼散戶不計成本拋售交出籌碼。"}, {"p": "心理較量（看誰先崩潰）", "a": "等他们杀到没有方向感的时候，你再加入猛砸股价，让他们搞不清楚到底是怎么回事", "n": "主力放任小資金自相殘殺，比誰先喪失方向感與定力。"}, {"p": "情緒操縱", "a": "你打压他建仓，你拉高他出货，你们完全成了他们的苦力", "n": "主力以打壓、拉高調控散戶情緒，使散戶淪為搬運籌碼的苦力。"}, {"p": "孤獨與異化", "a": "留下的只有你自己孤零零一个人的时候，那种茫然若失的感觉让人消沉许久", "n": "股市生涯令主角習慣孤身，知己離去後只剩茫然若失。"}]}, {"i": 86, "title": "第八十六回　弄堂独行闻雪崩", "kind": "hui", "summary": ["主角穿行上海弄堂，市井喧鬧反襯其孤獨——資本市場的孤獨非人人能承受，職業投資人陷入異化疏離。", "復盤認定兩日增倉15%無望，與小馬密謀論壇直播、小媒體吹風、主流媒體留頭版，輿論造勢步步為營。", "愚人節報載金庸辭職，頭版通告首提防止經濟過熱，主角警覺遊資將撤、雪崩將至，決意四月撤資。", "盤中兩次試盤收效甚微，營業部人氣渙散：散戶大廳寥寥、大戶缺席、職員瞌睡，群體熱情消退殆盡。", "午後放任自流、收盤掃單收高，令小馬發煽動性通稿渲染地量地價，以輿論誘多暗藏出貨。"], "qa": [{"q": "主角走在繁華都市中為何感到特別孤獨？", "a": "小張的決定讓他再次感受到資本市場的孤獨不是每個人能承受的；弄堂市井的喧鬧與其內在孤寂形成對照，凸顯職業操盤手的疏離與異化。"}, {"q": "主角開盤後為何靜觀其變，隨即高價掃單買入？", "a": "他先觀察盤面，見小資金恐慌性拋單仍存、成交量極度下降，便將3隻股票各買300萬股、價格抬高20元一次性買入，意在試探浮籌與拋壓，是典型的試盤心理戰術。"}, {"q": "主角第二次「不撤單、單量加大、價格級差30元」的賣單有何心理用意？", "a": "保留未成交賣單並加大單量、拉開價差，藉此測試承接盤深度與市場心理承受力；兩次交易後見人氣難有進展，他決定當日放棄交易、不再折騰。"}, {"q": "營業部的冷清景象反映了散戶怎樣的群體心理？", "a": "五家營業部散戶大廳不足百人、大戶室無人、中戶打麻將、職員在櫃台睡著：行情無人氣時群體熱情集體消退、羊群式撤離，眾人心態由狂熱轉為麻木離場。"}, {"q": "主角吩咐收盤前掃光單子、高點收盤，有何心理用意？", "a": "以掃單收高營造強勢收盤假象，給觀望者留下關鍵價位與心理信號，配合通稿造勢，為日後誘多出貨埋下伏筆。"}, {"q": "通稿為何要突出「地量地價」並具煽動性與誘惑性？", "a": "以地量地價暗示跌無可跌、底部已至，煽動觀望資金入場接盤，是典型的輿論誘多與情緒操縱：先造人氣、再借人氣出貨。"}, {"q": "主角推斷調控措施何時出台？資金必須何時撤出？", "a": "從傳言到正式見報約一個多月，他推斷具體措施約4月底出台，故資金必須4月中旬撤出，否則等遊資開始撤退就來不及了。"}, {"q": "小馬如何調整論壇與媒體的造勢安排？", "a": "周一不播電視節目，改為周一下午收盤後在小媒體吹風、三大主流媒體預留頭版，周一晚證券時間直播論壇，並從明天起撤銷「兩頭斗」的文章與節目。"}, {"q": "頭版「防止經濟過熱」的通告為何讓主角緊張？", "a": "防止過熱首先影響資本市場：小資金尚處麻木，敏感遊資卻會加速撤離，真正的雪崩將展開；他警覺到群體預期即將逆轉，心中不由發亂。"}, {"q": "老胡與山子當日的操作狀態說明了什麼？", "a": "老胡折騰幾次倉位僅增3%，山子乾脆動都沒動，兩人聽聞主角的情況都笑：連莊家在大勢轉向、人氣渙散時也無計可施，只能順勢觀望。"}], "quotes": ["走在这繁华的都市里，内心特别的孤独，小张的决定让我再次感受到资本市场的孤独不是每个人都能承受的。", "小资金也许正处于麻木状态，但是敏感的游资则会加速撤离市场，真正的雪崩就会展开。", "就目前的市场人气看，很难有进展。", "附近5家营业部散户大厅加起来不到100人，大户室基本上没有人。", "内容主要突出地量地价即可。一定要具有煽动性和诱惑性。"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "从最初10分钟的交易情况看，小资金恐慌性的抛单还是存在，成交量极度下降。", "n": "散戶在縮量行情中仍不計成本拋單，恐懼情緒主導其交易行為。"}, {"p": "情緒操縱", "a": "内容主要突出地量地价即可。一定要具有煽动性和诱惑性。", "n": "主角以煽動性通稿操控輿論，誘導散戶進場承接，為出貨鋪路。"}, {"p": "孤獨與異化", "a": "走在这繁华的都市里，内心特别的孤独，小张的决定让我再次感受到资本市场的孤独不是每个人都能承受的。", "n": "市井喧鬧與內在孤寂對照，職業操盤手的疏離異化躍然紙上。"}, {"p": "信息瀑布（謠言市）", "a": "周一下午收盘之后在小媒体上开始吹风，三大主流媒体预约留出头版的位置。", "n": "小媒體吹風、主流媒體頭版、論壇直播層層放大消息，影響散戶預期。"}]}, {"i": 87, "title": "第八十七回　地量收阳蓄深机", "kind": "hui", "summary": ["收盤前十分鐘莊家分批掃貨拉高收市價，以人為陽線向散戶宣告強勢。", "地量收陽、持倉63%，莊家與散戶的博弈全在收盤價與輿論上做文章。", "上海人寧要浦西一張床不要浦東一間房，群體身份認同深植人心。", "電視股評大談地量地價、底部夯實，莊家借媒體之手操縱大眾情緒。", "主角算計以短時暴漲誘散戶回場，冷靜賬目間流露職業莊家的異化。"], "qa": [{"q": "收盤前十分鐘莊家為何突然下令持續買入？用了什麼心理戰術？", "a": "他令報單員每筆500萬股、價差30元持續買入直至收盤，趁散戶注意力渙散之際將指數拉至最高點報收，用一根人為陽線為次日營造強勢氛圍。"}, {"q": "地量收陽說明莊家在使用什麼心理戰術？", "a": "全天成交不足2億、漲幅卻逾2%，莊家以極小成本推高收盤價，製造「惜售見底」的假象；持倉升至63%、成本降29%，誘多雛形已成。"}, {"q": "上海人對浦東新房的態度體現了什麼群體心理？", "a": "寧擠浦西破舊閣樓也不住浦東新房，異口同聲嫌棄「鄉下」，是城鄉身份標誌的心理錨定，身份認同比居住條件更牽動群體情緒。"}, {"q": "電視股評節目在整個布局中扮演什麼角色？", "a": "主持人與專家大談地量地價、底部夯實，主角暗忖「這不知道是誰的手筆」，可見股評正是莊家輿論造勢的一環，為散戶注入見底預期。"}, {"q": "主角為何看不起股評界？這反映出什麼心理現象？", "a": "他認為股評只解釋漲跌不談後市，輸得越多越說得頭頭是道——輸家以滔滔說辭合理化虧損，主角冷眼旁觀，看穿其自欺本質。"}, {"q": "老胡來電時主角為何斥其蠢貨？", "a": "老胡見股評唱多就想明日建倉，主角點破：無人氣時建倉是找死，須犧牲成本刺激人氣為出貨鋪路——散戶情緒才是莊家真正的獵物。"}, {"q": "主角為何執著於「短時間暴漲」？", "a": "平淡漲幅吸引不了散戶，唯有短時暴漲才能把客戶從家裡誘回營業部；再配媒體推波助瀾，讓貪婪與從眾心理驅動跟風盤入場。"}, {"q": "主角估算達成目標需要多大的漲幅？", "a": "倉位維持70%需花力氣，補回砍倉損失外加30%利潤，股票至少上漲150%以上，相應大盤需漲25%〜30%。"}, {"q": "當日收盤與成交量有何奇特之處？", "a": "大盤幾乎以最高點收盤、漲幅逾2%，成交量卻不足2億，是本輪行情最小地量；主角稱之為「奇跡」，實為尾盤掃單的人為之作。"}, {"q": "主角臨近收官時的心態體現了職業投資人的什麼特質？", "a": "「越是臨近最後關頭越要仔細」，他反覆檢討方案紕漏，冷靜計算漲幅與人氣，財富數字取代日常情感，透出職業博弈者的異化與孤獨。"}], "quotes": ["宁要浦西一张床，不要浦东一间房", "要死了，谁要去住浦东啊!乡下有什么好的。", "从地量地价的角度分析，大盘底部已经夯实，爆发行情一触即发。", "投资人输得越多越能对股市说得头头是道，但是，就是做不好股票", "短期内的暴涨如果能加上媒体的推波助澜，效果将会非常明显。"], "psych": [{"p": "情緒操縱", "a": "现在要利用建仓的最后期限，牺牲一些成本，刺激人气，为后来的出货做准备。", "n": "莊家犧牲成本拉高收盤價刺激人氣，為出貨布下誘餌。"}, {"p": "信息瀑布（謠言市）", "a": "从地量地价的角度分析，大盘底部已经夯实，爆发行情一触即发。", "n": "莊家自導自演的股評輿論經電視放大，預期自我實現。"}, {"p": "專家崇拜／過度自信", "a": "之后又有一位著名的专家，就有关地量地价的问题作了详细地分析，并给出属于自己的看法", "n": "散戶迷信專家解釋漲跌，恰被莊家輿論造勢利用。"}, {"p": "認知失調／合理化", "a": "投资人输得越多越能对股市说得头头是道，但是，就是做不好股票", "n": "輸家以滔滔說辭合理化虧損，離真金白銀越來越遠。"}]}, {"i": 88, "title": "第八十八回　拉抬打压测浮沉", "kind": "hui", "summary": ["媒體統一口徑宣揚地量地價，莊家借輿論造勢誘使散戶形成底部共識，群體預期隨之升溫。", "盤中拉抬至968點又放量砸至940點，反覆試探跟風盤與恐慌盤，比的是誰先承受不住。", "追漲意願隨漲幅遞減，gp由6降至4，顯示弱市散戶心存顧忌，貪婪終敵不過恐懼。", "營業部長凳滿座、「神」滿口兩千點卻無半句專業，散戶對權威盲目膜拜，信息一層層失真。", "主角聽民間「女神」講股心生悲哀，小張失眠欲逃離股海，職業投資人的孤獨與異化在飯桌上無言以對。"], "qa": [{"q": "莊家為什麼樂見媒體統一口徑宣傳「地量地價」的底部信息？", "a": "這是典型的輿論造勢與情緒操縱：讓底部信息傳遍千家萬戶，散戶形成一致預期後才會進場，莊家便可借群體氣氛完成誘多，達到拉抬測試的效果。"}, {"q": "gp人氣指標從6降到4，反映了散戶什麼心理變化？", "a": "說明弱勢狀態下的投資人心里還是有所顧忌：上漲幅度小，追漲買入的資金意願逐漸冷卻，貪婪被恐懼壓制，跟風熱情難以持續。"}, {"q": "莊家先拉高再砸盤反覆折騰，究竟在測試什麼？", "a": "他在做心理較量：先誘多測試跟風盤是否踴躍，再放量砸盤測試恐慌盤有多大，藉此摸清散戶的承受力底線，決定後續是維護還是繼續打壓。"}, {"q": "砸盤至940點後，主角為何認為「繼續砸也沒有多大意義」？", "a": "因為總持倉僅降1%，恐慌性拋盤並不大，說明散戶嚇不跑、也砸不出籌碼；既然心理承受力比預期強，再砸只是白白犧牲成本，於是轉手掃回。"}, {"q": "午間營業部長凳上坐滿股民、「神」們講股，呈現出什麼群體心理？", "a": "這是典型的羊群效應與信息瀑布：散戶聚集聽「神」指點，人氣被渲染成共識，昨天還沒人、今天滿座，眾人一致看好便互相強化進場衝動。"}, {"q": "「女神」只會轉述朋友與報紙之言，為何仍被散戶膜拜？", "a": "這是專家崇拜與信息瀑布的雙重作用：散戶迷信權威與內幕消息，對專業知識一無所知也不妨礙膜拜，信息被一層層轉述放大，誰也不去核實。"}, {"q": "主角聽完「女神」講股後「升起一股悲哀」，這悲哀從何而來？", "a": "來自莊家與散戶的心理隔閡：散戶憑迷信與傳言交易，主角卻能看清這一切正是自己布局利用的氣氛，清醒者看盲從者，職業異化感油然而生。"}, {"q": "主角第一次下令拉升的具體手法是什麼？效果如何？", "a": "每筆200萬股、每次100元價格持續性買入，約3分鐘後老胡、山子的股票啟動，指數穩步上揚一度達968點，較上日漲21點，跟風盤較為踴躍。"}, {"q": "主力掃貨收復失地後，指數收在哪裡？上午交易如何收場？", "a": "撤掉未成交單子後，以每筆400萬股、級差20元一次性買入，指數很快漲至956點附近，較上日漲9點，成交量開始放大，結束上午交易。"}, {"q": "小張為何整夜睡不著？他想用什麼方式逃離這個行業？", "a": "他感到疲憊受傷、心里難過，整夜睡不著，自認還沒深入就選擇退出，不知算成功還是失敗；他想去英國學歷史考古，遠離證券圈子。"}], "quotes": ["从平面媒体和电视媒体统一透露出来的底部信息传遍千家万户，这是我希望看到的局面，也希望能够达到应有的效果。", "gp从6下降到4这足以说明弱势状态下的投资人心里还是有所顾忌。", "如果继续砸的话也没有多大的意义，就这样上下折腾几次马上就快收盘了，于是我吩咐报单员：“撤掉刚才未成交的单子，每笔单子400万股，级差价20元一次性买入。", "虽然对投资的专业知识一无所知，这并不影响她说股票的激情，更不影响其他人对她的膜拜。", "我心里很难过，这几天整夜睡不着觉，还没有深入就选择了退出，不知道算成功还是失败？"], "psych": [{"p": "信息瀑布（謠言市）", "a": "从平面媒体和电视媒体统一透露出来的底部信息传遍千家万户，这是我希望看到的局面", "n": "媒體統一口徑造勢，底部預期在散戶間逐級放大，莊家樂見其成。"}, {"p": "專家崇拜／過度自信", "a": "虽然对投资的专业知识一无所知，这并不影响她说股票的激情，更不影响其他人对她的膜拜。", "n": "散戶迷信權威轉述與內幕消息，不核實便盲從膜拜。"}, {"p": "心理較量（看誰先崩潰）", "a": "看得出恐慌性的抛盘也不是很大。如果继续砸的话也没有多大的意义", "n": "莊家拉高砸盤反覆試探散戶承受力，誰先撐不住誰就輸。"}, {"p": "孤獨與異化", "a": "我心里很难过，这几天整夜睡不着觉，还没有深入就选择了退出", "n": "小張失眠欲逃離股海，投資人的疲憊與疏離盡顯。"}]}, {"i": 89, "title": "第八十九回　孤影临江谋决战", "kind": "hui", "summary": ["周五恐懼成了職業病：不交友、無社交，工作充實而休息成折磨，職業投資人已徹底異化。", "外灘上如孤魂野鬼般穿行於戀人之間，浦西輝煌浦東漆黑，映出主角與人群、與世界的雙重疏離。", "輿論造勢正式鋪開：有影響力者到會、電視周一播出、報紙先預告不報實質，全為下周拉抬出貨蓄勢。", "酒間忠告撕開莊家心理：貪得無厭與散戶無異，扛得越久壓力越大，最先垮台的必是自己。", "兄弟依次托盤出貨：山子先、老胡次、自己殿後扛雷，並擬借利好把大盤推上1300點全部清倉。"], "qa": [{"q": "每到周五，主角為何會有一種「莫名其妙的恐懼」？", "a": "這是職業病式的異化：沒有社交活動、不願交朋友，工作時非常充實，休息反而成為痛苦的折磨，閒暇與孤獨比行情更令他恐懼。"}, {"q": "主角為何把自己形容成外灘的「孤魂野鬼」？", "a": "江邊滿是竊竊私語的戀人，他獨自一人格格不入，只好躲到照相攤後的圍欄旁觀別人的愛情故事，折射出職業投資人與人群、與常態生活的疏離。"}, {"q": "小馬匯報的論壇與電視安排，體現了莊家哪種心理戰術？", "a": "輿論造勢：邀有影響力者到會，電視台周一晚播出，報紙先作預告卻不報道實質內容，用傳媒營造的預期為下周拉抬、出貨鋪路。"}, {"q": "把大盤「推到1300點之上」再清倉，1300點起什麼心理作用？", "a": "整數關口是散戶的心理錨點，突破1300點製造「穩固上攻」的錯覺，誘使散戶追進接盤，莊家則借利好掩護趁機全部清倉。"}, {"q": "我為何質問他們「和散戶有什麼區別」？", "a": "已不看好市場卻因利欲熏心仍參與做私活，明知違背職業道德，這與追漲的散戶同樣敗於貪婪，所以成功的概率非常小。"}, {"q": "「扛的時間越長，最先垮台的是你們」道出了什麼心理困境？", "a": "行情轉勢人心在變，拖得越久資金成本與心理壓力越大、越難抽身；這是沉沒成本式的困局，最先崩潰的往往是扛壓最久的莊家自己。"}, {"q": "「我們就是有錢有權的人養的一條狗」這句自白透露出什麼心理？", "a": "這是道德衝突下的自我貶抑：把操盤說成「責任和義務」，壓低自身分量，以緩解貪得無厭、隨時身敗名裂的罪疚感。"}, {"q": "我為何說給一線人員補貼「不是誰高尚的問題，是利益問題」？", "a": "一線明知做私活卻不說破，補貼既是他們應得之份，更是莊家自保的安全籌碼；把道德問題還原為利益算計，是清醒而理性的自保心理。"}, {"q": "憶起查爾斯河畔的意氣風發，對照今日「把自己放在火爐上烤」，說明什麼？", "a": "三年不到便墮入做私活，昔日理想與今日險境反差巨大；他以此警示眾人：資本市場不是三年，人生也不是三年，走錯一步便難回頭。"}, {"q": "面對浙江人催款，山子、老胡表現出什麼樣的心理狀態？", "a": "兩人承認壓力大、忙著催款，對下周計劃「不要發表意見，直接執行」；在老大威勢與利益綁定下，他們放棄獨立判斷，只能服從安排。"}], "quotes": ["每到周五我都有一种莫名其妙的恐惧，这似乎成了一种职业病，没有太多的社交活动，也不愿意交朋友，工作的时候非常充实，休息成了一种痛苦地折磨。", "我一个人像个孤魂野鬼一样走在这些少男少女中间，显得非常得不协调", "我们实际上不算什么，就是有钱有权的人养的一条狗，我们的工作就是责任和义务。", "只是因为利欲熏心么？那么，你们和散户有什么区别？", "你扛的时间越长，承受的压力和资金成本越大，长期下去最先垮台的是你们"], "psych": [{"p": "孤獨與異化", "a": "每到周五我都有一种莫名其妙的恐惧，这似乎成了一种职业病，没有太多的社交活动，也不愿意交朋友", "n": "工作充實、休息成折磨，職業投資人已與常態生活徹底疏離。"}, {"p": "情緒操縱", "a": "到会的人选都很有影响力，而且电视台那边也已经安排好节目的时间，周一晚上证券时间播出", "n": "論壇、電視、報紙預告層層造勢，用輿論左右散戶預期以利拉抬出貨。"}, {"p": "心理支撐位", "a": "最终我想利用利好信息把大盘推到1300点之上全部清仓", "n": "整數關口是散戶的心理錨點，推上1300點誘多接盤、趁機清倉。"}, {"p": "道德衝突／罪疚感", "a": "我们实际上不算什么，就是有钱有权的人养的一条狗，我们的工作就是责任和义务", "n": "以自我貶抑緩解貪得無厭的罪疚，莊家良心的自我拷問。"}]}, {"i": 90, "title": "第九十回　醉醒思亲对股潮", "kind": "hui", "summary": ["宿醉醒來思念大山深處的父親，五星級酒店與鄉村的對照，折射職業操盤手的孤獨與異化。", "決戰在即卻自認成功必然，屢勝後的過度自信使情緒麻木，警覺性反而下降。", "主角操縱媒體分批釋放救市傳言，含糊吊胃口引導預期，典型的情緒操縱與輿論造勢。", "開盤巨單掃貨、試盤砸盤探測散戶做空意願，順應人心思多做高股價，博弈雙方各施心計。", "營業部散戶篤信政府救市、跌久必漲，群體心理與信息瀑布令謠言自我實現，主力借勢收割。"], "qa": [{"q": "主角為何將次日報道分兩次進行，且首篇含糊其辭？", "a": "他先在大報主要位置含糊報道「有傳言管理層有救市打算」，再於下午向媒體透露具體內容，以吊足胃口、引導預期，讓散戶自行腦補利好，屬典型的情緒操縱與輿論造勢。"}, {"q": "「總持倉68%、成本下降27%」後，主角為何仍說人氣「達不到強烈程度」？", "a": "他判斷這樣的人氣要想出貨是絕對不可能的，說明莊家眼中的「人氣」是散戶的接盤意願，未達強烈程度便無法高位派發，必須繼續製造賺錢效應。"}, {"q": "主角為何在試盤時下令「每筆200萬股賣出」？測試結果說明了什麼群體心理？", "a": "他想往下砸，測試做空心態是否積極；結果拋出的20萬股全部成交而跌幅不大，說明小投資人拋售意願不強、寧願追漲做多，貪婪勝過恐懼，追漲心理根深蒂固。"}, {"q": "「正好投資人人心思多」——主角從這句話中讀出了什麼？", "a": "他讀出多數人看多，順水推舟就能推高行情，且可在上漲突破1000點整數關口時大量收取獲利回吐的短線籌碼，善用群體從眾心理與整數關口的錨定效應。"}, {"q": "主角為何在營業部故意說「萬一是壞消息就要大跌」？", "a": "他以反向言語試探散戶的信念結構，結果被譏為新股民，印證眾人已把救市視為必然，群體極化下異見被當作無知，他也樂得借新兵身份隱藏莊家身分。"}, {"q": "散戶說「政府能看著股市這樣跌下去？那不是白漲了嗎？」反映了什麼心理？", "a": "這是典型的賭徒謬誤與錨定思維：認定政府必救市、跌久必漲，將短期走勢與政策綁定，深信不疑以合理化自己的持股，並在眾人傳言中形成自我強化的信息瀑布。"}, {"q": "「新兵怕炮，老兵怕號。新股民怕跌，老股民怕漲」這句俗語注解了什麼？", "a": "新股民因缺乏經驗而恐懼下跌，老股民見慣漲跌而警惕上漲，注解了不同經驗階層的錨定差異：貪婪與恐懼的對象因經歷而異，各懷其錨。"}, {"q": "主角為何說「成功是必然的」？這折射出什麼心理狀態？", "a": "屢次大勝讓他過度自信，把成功當作必然、不必考慮細節，既是強者的底氣也是自我服務偏差的開端；決戰前的平淡，反而預示情緒已被輸贏麻木。"}, {"q": "主角在五星級酒店發呆時想念父親，這段描寫有何心理意義？", "a": "他在繁華都市操縱資金博弈，父親卻在大山深處，強烈反差凸顯職業操盤手的孤獨與異化：贏得了市場，卻疏離親情與人間煙火，金錢填補不了情感的空洞。"}, {"q": "「大廳看盤的人很多，座無虛席，但是委託窗口的人卻是寥寥無幾」說明了什麼？", "a": "眾人圍觀行情卻不敢下單，都在等待傳說中「晚上的重要消息」，是信息瀑布中的觀望期：群體情緒被傳言牽著走，行動取決於別人即將發出的信號。"}], "quotes": ["虽然含糊其辞模棱两可，但也是充满诱惑挺能吊人胃口。", "相对追涨来讲，小投资人还是愿意追涨做多，大概跟看好行情有绝对的关系。", "虽然下周就要开始决战了，但我没有那种大战前的紧张和焦虑，一切显得非常的平淡，从以往的经历看，成功是必然的。", "新兵怕炮，老兵怕号。新股民怕跌，老股民怕涨，是说你的吧？", "他现在在大山深处而我却在繁华的都市五星级酒店发呆，这个时候我非常想我的父亲。"], "psych": [{"p": "信息瀑布（謠言市）", "a": "大早的报纸在主要位置含糊的报道一下，下午2点钟向媒体透露一些具体的内容", "n": "主角以救市傳言吊胃口、分批釋放訊息，讓預期自我實現，注解謠言市的信息瀑布。"}, {"p": "錨定效應", "a": "可以在上涨突破1000点的时候，大量收取获利回吐的短线筹码", "n": "1000點整數關口成為散戶的心理定錨，莊家借突破關口收取獲利回吐籌碼。"}, {"p": "羊群效應（從眾）", "a": "正好投资人人心思多，推动行情上涨应该是顺水推舟", "n": "眾人一致看多時主力順水推舟，注解散戶跟風的羊群效應。"}, {"p": "孤獨與異化", "a": "他现在在大山深处而我却在繁华的都市五星级酒店发呆", "n": "贏得市場卻疏離親情與人群，注解職業操盤手的孤獨與異化。"}]}, {"i": 91, "title": "第九十一回　股海焚香祈出货", "kind": "hui", "summary": ["主角親赴萬國營業部探人氣，廳內人山人海、掌聲雷動，散戶憑掌聲定漲跌，羊群狂熱畢現。", "小張走五家營業部回報：人氣尚可而觀望居多，斷言行情啟動跟風盤必強，追漲預期蓄勢待發。", "午後主力先以巨單打壓出貨，再於930點反手拉抬，先砸後拉之間，全場情緒盡被操弄。", "收盤前消息靈通人士搶盤，指數收報947.87點，主力歎散戶合力亦可推升大勢，信息瀑布成形。", "主角於靜安寺焚香祈神寬恕，盼眾人高位出貨自求心安，轉念又憂善良散戶將陷夢魘，罪疚纏身。"], "qa": [{"q": "主角到萬國營業部先做什麼？這與莊家的哪項心理戰術有關？", "a": "他先察看散戶大廳的人氣與掌聲熱度，再據此籌劃午後的打壓與拉抬。看人氣、測跟風，正是莊家出手前最典型的節奏試盤與情緒偵察。"}, {"q": "散戶憑「大家都拍巴掌」斷定必漲，體現了什麼群體心理？", "a": "典型的羊群效應。他們不看基本面，只以眾人的掌聲和圍觀熱度為漲跌依據，人越多越確信，個體判斷完全被群體情緒裹挾。"}, {"q": "主角為何先命令巨額賣出打壓，再於930點反手買入？", "a": "先砸盤製造恐慌、壓低成本，待浮籌出清再大單拉抬；一壓一拉之間股價節奏全由他掌控，順勢激活人氣，正是砸盤建倉與節奏試盤的運用。"}, {"q": "「看起來人氣被激活了」一句說明主力拉抬達到了什麼目的？", "a": "通過價格異動操縱大眾情緒：跌勢中眾人觀望，一旦掉頭急升，追漲熱情立即被點燃，主力藉散戶的貪婪情緒完成出貨鋪墊。"}, {"q": "收盤前指數為何急劇向上？反映哪種市場心理機制？", "a": "老胡、山子的股票未動，指數卻急升，主角推斷是消息靈通人士聞訊搶盤。消息先於事實傳播並自我實現，正是信息瀑布下的搶跑效應。"}, {"q": "通完電話後主角產生什麼心理變化？他如何排解？", "a": "他忽然湧起深深的負罪感，自稱這是從事資本投資後第一次刻骨銘心的痛，遂入靜安寺焚香跪拜、頭頂觸地，為自己的行為請求神的諒解。"}, {"q": "主角求神「保佑所有人高位出貨」透露了他怎樣的心理？", "a": "他將坑害散戶的出貨行為包裝成受神啟示的祝福，藉神明之力自我合理化，以化解認知失調帶來的道德痛苦。"}, {"q": "主角望著街上人說「這些人都是善良的」，折射出莊家什麼心態？", "a": "他既清楚自己的行為將毀掉這些善良散戶，又無力抽身，只能以感歎化解愧疚，莊家的良心拷問與道德衝突躍然紙上。"}, {"q": "小張斷言「跟風盤一定會很強」依據何在？預示什麼？", "a": "他走五家營業部，見人氣尚可但觀望居多，料定行情一旦啟動，壓抑的追漲慾望將集中釋放，跟風盤必然洶湧。"}, {"q": "主角歎「散戶也是很厲害的」，指數推上四點說明了什麼？", "a": "指數全日上漲四點全靠散戶合力，可見群體一旦被情緒點燃，力量足以推動大勢，而這股力量也正是主力藉以出貨的燃料。"}], "quotes": ["当然是涨了，你没有看看大家都拍巴掌，跌了准拍巴掌啊？", "我忽然有一种深深的负罪感，我想我要上一炷香，为自己的行为请求神的谅解。", "我希望所有人都能如我一样，受神地启示和保佑能在高位一同出货。", "要是行情启动跟风盘一定会很强。", "要是有的话，那么危机已经从今天开始埋下了种子，梦魇一样的生活将会在不久的将来，毁掉所有参与股票投资的人们，这些人都是善良的！"], "psych": [{"p": "情緒操縱", "a": "刚才还向下的股价忽然直线掉头向上，其他股票也开始向上回升，老胡和山子大概看出我的意图，也开始大量买入，指数开始急速向上，强势股票纷纷翻红。", "n": "主力先砸後拉，以價格節奏操縱全場情緒，瞬間激活追漲人氣。"}, {"p": "羊群效應（從眾）", "a": "当然是涨了，你没有看看大家都拍巴掌，跌了准拍巴掌啊？", "n": "散戶不看事實只看掌聲，群體情緒成為個人判斷的唯一依據。"}, {"p": "道德衝突／罪疚感", "a": "我忽然有一种深深的负罪感，我想我要上一炷香，为自己的行为请求神的谅解。", "n": "莊家首次刻骨銘心的良心拷問，靠焚香求恕仍難自安。"}, {"p": "信息瀑布（謠言市）", "a": "我估计是一些消息灵通的人士得到信息了，开始入市抢盘。", "n": "消息先於事實傳播，收盤前搶盤印證預期的自我實現。"}]}, {"i": 92, "title": "第九十二回　蛇夢縈心股海狂", "kind": "hui", "summary": ["深夜如困獸般徘徊難眠，借哀樂與烈酒麻醉自我，職業投資人的孤獨異化盡顯。", "蛇夢中甩不掉又傷不到的糾纏與撥不出的電話，是股市風險壓迫下死亡焦慮的潛意識顯影。", "報紙頭條「管理層救市」點燃群體情緒，辦公室人人歡欣鼓舞，輿論造勢下的羊群效應畢現。", "指數千點關口反覆拉鋸，主力誘多砸盤逼出恐慌拋盤，與強勢資金展開看誰先崩潰的心理較量。", "市場沸騰、股票和人一起發瘋，主角卻清醒鎖盈交棒，冷眼旁觀中小機構高位接盤。"], "qa": [{"q": "深夜裏「我」為何煩躁難眠？這反映職業投資人怎樣的異化心理？", "a": "心空蕩蕩、找不到原因，如困獸來回踱步，是長期搏殺後職業投資人與自我疏離的孤獨異化，靠哀樂和烈酒麻痺才能入睡。"}, {"q": "噩夢中的蛇群與撥不出去的電話，象徵股市處境中的什麼心理？", "a": "蛇是股市中甩不掉又傷不到的風險與對手，扔走一條又湧出許多小蛇；電話撥不出去，暗示身陷局中無人可依的絕望，是死亡焦慮在潛意識的顯影。"}, {"q": "報紙救市頭條為何讓辦公室人人歡欣鼓舞？屬於什麼群體心理？", "a": "「管理層終於救市」的頭條令每個人喜笑顏開、歡欣鼓舞，眾人一致看好，正是輿論造勢下的羊群效應與信息瀑布，預期在傳播中自我實現。"}, {"q": "指數突破千點後為何出現拋壓？千點關口有什麼心理意義？", "a": "千點是整數關口的心理錨點，指數上穿後獲利拋壓湧出，主力撤單任其跌破975點再以巨單拉回，正是錨定效應與心理支撐位運用的典型手法。"}, {"q": "「我」如何用買賣節奏與對手進行心理較量？", "a": "先撤單放任回調再巨量掃貨，見對手資金跟買後以一千萬股試探、兩千萬股加碼拋售，鏖戰約七分鐘逼出恐慌盤，是看誰先崩潰的承受力較量。"}, {"q": "「恐慌性抛盘出来了」揭示了什麼市場心理？", "a": "主力連續巨量拋壓下，持倉者不計成本奪路而逃，正是恐慌性拋售；賣壓一旦成勢又相互印證、互相踩踏，主力趁勢撤單鎖定戰果。"}, {"q": "「股票和人一样都开始疯了」形容的是什麼群體現象？", "a": "指數狂飆時個股普漲、市場沸騰，眾人貪婪追漲互相感染放大，價格脫離價值由情緒驅動，是羊群效應與群體極化的狂歡。"}, {"q": "收盤前「我」為何把波動主動權交給中小機構？", "a": "價位拉高後他鎖定浮盈、不再戀戰，把波動主動權交給後知後覺的中小機構，讓最遲入場者在高位接盤維持走勢，莊家從容收割。"}, {"q": "主角為何偏愛第五大道香水？有何心理用意？", "a": "淡淡的馨香令他瞬間放鬆、增添自信，他相信長期使用會讓人平靜、絕不會發狂動粗，是壓抑內在衝動、維持交易理智的自我調節。"}, {"q": "上午交易結束時「我」的賬面成績與心態如何？", "a": "持倉70%、實際盈利14%，原始資金浮動總盈利達30%，指數收在最高點附近；歷經驚心動魄的對決仍清醒計算，莊家理性掌控全局。"}], "quotes": ["酒精加上哀乐的作用，我昏昏沉沉地睡着了。", "我做了一个噩梦，我梦见自己总是被一条蛇三番五次地纠缠，我甩不掉它，它也伤不到我", "管理层终于救市，减少新股发行额度，维护股市稳定发展。", "整个市场沸腾了，股票和人一样都开始疯了。", "看起来恐慌性抛盘出来了。"], "psych": [{"p": "孤獨與異化", "a": "我把所有的灯都打开，在屋子里走来走去，我不知道自己要做什么，心里感觉空荡荡的", "n": "職業投資人深夜如困獸般徘徊，借哀樂與烈酒麻醉自己，與自我漸行漸遠。"}, {"p": "死亡焦慮", "a": "打开哀乐，我强迫自己去听，一遍又一遍地听，渐渐地我平静了下来", "n": "哀樂安神、蛇群噩夢與撥不出的報警電話，都是末日感與生死焦慮的潛意識流露。"}, {"p": "錨定效應", "a": "买单撤销之后，股价带动指数开始向下回调，指数跌破1000点，一直跌到975点附近。", "n": "千點整數關口成為心理錨點，突破引來拋壓、失守又觸發承接，多空皆據此布局。"}, {"p": "恐慌性拋售（恐懼）", "a": "对方终于撑不住了，价格开始向下急速下跌，这样重量级的对决差不多进行了7分钟", "n": "主力連續巨量拋售逼出散戶恐慌拋盤，不計成本奪路而逃，正是恐慌性拋售的典型。"}]}, {"i": 93, "title": "第九十三回　人氣如潮人將散", "kind": "hui", "summary": ["主力視察營業部，見人聲鼎沸、散戶爭搶入場，群體熱情高漲，遂棄震倉改順勢而為。", "盤中買單龐大、賣單零碎，連哈爾濱席位也現瘋狂買單，追漲情緒將信息刺激推向極致。", "主力全日不動一筆，借旺盛人氣高位收盤，成交一日超前三日總和，出貨通道就此鋪平。", "成功兌現之際失落撲面而至，與人群永無共同語言，職業操盤手在勝利中走向內在異化。", "見功臣遭「良弓藏走狗烹」，慨嘆資本市場以心理攻擊與情緒操縱打擊散戶，極其殘忍。"], "qa": [{"q": "主角為何判斷「再往下做一次震倉已經沒有任何意義」？他採用了什麼心理戰術？", "a": "他結合大盤點位與營業部所見的人氣判斷：散戶已充分動員，再洗盤只會嚇走買盤，遂棄震倉改用順勢而為，借旺盛人氣把價位維持在高位收盤，為日後出貨鋪路。"}, {"q": "營業部內散戶表現出怎樣的群體心理？", "a": "人聲鼎沸、自行車佔滿人行道，委託窗口排隊者互相摟抱，大屏幕前坐滿神情緊張的股民，收盤了也不去吃飯——羊群效應下跟風搶進，個體理性讓位於群體狂熱。"}, {"q": "盤中買賣單的對比說明散戶處於什麼心理狀態？", "a": "買入單子非常龐大，賣出都是幾手的小單，多屬沒有目的的散戶行為；連最偏遠的哈爾濱席位都出現瘋狂買單，追漲貪婪之下眾人只恨買得慢，賣壓近乎消失。"}, {"q": "「這次信息對人們的刺激達到了極致」注解了什麼心理現象？", "a": "漲勢與人氣本身成為最強的信息信號，一傳十十傳百，買盤如雪崩般湧至——信息瀑布之下，預期自我實現，眾人因漲而買、因買而更漲。"}, {"q": "主力為何「不愁出貨的問題了」？這體現了莊家怎樣的算計？", "a": "人氣旺盛意味著散戶願在高位接盤，強大的承接力就是出貨通道；主角不動聲色地封存資料下班，正是情緒操縱成功後坐享其成的莊家心理。"}, {"q": "成功到來之際，主角為何反而感到失落？", "a": "努力已成定局、結局板上釘釘，付出的艱辛換來的卻不是成就感，而是一種失落撲面而至——勝利之後的空虛、與人群無共同語言的疏離，正是職業投資人的異化寫照。"}, {"q": "小馬說經濟學家「說不出子丑寅卯」、出場費卻出奇地高，主角如何回應？", "a": "主角打趣：真正的經濟學家就是說不清楚的，比如格林斯潘，說清楚了就是普通經濟工作者——以戲謔戳破專家光環，暗諷市場中專家崇拜與話語權的錯位。"}, {"q": "主角飯後為何「非常痛苦地思考」？這背後是什麼道德拷問？", "a": "他想到部門撤銷、一線功臣踏實效力兩年後被毫不留情地驅逐，與「良弓藏走狗烹」如出一轍；繼而慨嘆人比野獸更貪婪殘忍，對人性與自身處境生出罪疚與寒心。"}, {"q": "主角如何描述職業操盤手對散戶的攻擊？", "a": "他直言資本市場是最殘忍的寫照：操盤手用各種手段從心靈深處和靈魂上打擊散戶，從心理上的攻擊一直到情緒上的操縱，直至散戶喪失鬥志、麻木地繼續虧損。"}, {"q": "收盤統計數據如何？主角有何反應？", "a": "指數全天漲逾11%，個股漲幅逾100%的有好幾家，大多漲逾30%，成交7.5億超過之前三天總和。他不動聲色地吩咐「資料封存，下班吧」，並記住4月6日這個日子。"}], "quotes": ["只要能有这样强的人气一直维持到收市的话，确实是一件令人喜悦的事情。", "付出艰辛之后成功的结局不一定会让人成就感十足，相反一种失落会扑面而至。", "踏踏实实地效力2年，之后就毫不留情地驱逐，这和\"良弓藏走狗烹\"似乎如出一辙。", "从心理上的攻击一直到情绪上的操纵，直至在你的灵魂深处造成刻骨铭心地打击，那个时候散户不仅仅是失去了金钱", "可见这次信息对人们的刺激达到了极致。"], "psych": [{"p": "羊群效應（從眾）", "a": "委托窗口那儿排队的人几乎从另外一个大门排出去了，人和人之间几乎是互相搂抱在一起。", "n": "散戶蜂擁排隊搶進，跟風從眾，個體理性完全讓位於群體狂熱。"}, {"p": "追漲（貪婪）", "a": "连最偏远的哈尔滨营业部的交易席位也开始出现疯狂的买单。可见这次信息对人们的刺激达到了极致。", "n": "漲勢本身就是最強誘餌，貪婪驅使全國買盤競相追高。"}, {"p": "情緒操縱", "a": "从心理上的攻击一直到情绪上的操纵，直至在你的灵魂深处造成刻骨铭心地打击", "n": "本章自白操盤手以心理攻擊與情緒操縱打擊散戶，直至其喪失鬥志。"}, {"p": "孤獨與異化", "a": "我和他们这些人似乎永远没有共同语言，爱好兴趣都不在一条线上", "n": "勝利之後主角與人群格格不入，職業投資人的疏離與內在異化躍然紙上。"}]}, {"i": 94, "title": "第九十四回　砸盘洗筹隐忧长", "kind": "hui", "summary": ["主角先誘多、再砸盤洗籌、後拉升試探，全程以節奏與情緒操縱散戶與對手。", "散戶追漲殺跌永遠慢半拍，恐慌性拋盤與跟風買盤交錯，淪為莊家對倒的犧牲品。", "市場在貪婪與恐慌間搖擺，主角卻憂心「大家都理智」，可見博弈正建於非理性之上。", "主角視散戶為烏合之眾，卻深知其為市場的犧牲者，罪疚與殺手式冷血相互撕扯。", "巨量成交、異動建倉皆無異常可查，主角仍隱隱不安，職業直覺嗅到未知對手的威脅。"], "qa": [{"q": "莊家高開誘多後，為何突然下令級差砸盤？", "a": "先以強勢上攻吸引追漲盤，再以每筆1000萬股、級差200元的大單掃跌，製造恐慌性拋盤，讓追高者與對手措手不及，同時試探市場承接實力。"}, {"q": "散戶在上午暴漲暴跌中表現出怎樣的群體心理？", "a": "追漲殺跌、永遠慢半拍：決定買入時股價在瘋漲，決定賣出時在瘋跌，恐慌性拋盤與跟風買盤交錯出現，小投資人被洗劫得虧多贏少。"}, {"q": "主角為何說「大家要是都理智了那就麻煩了」？", "a": "莊家的盈利建立在非理性市場上：散戶情緒化，才有跟風盤與對手盤可收割；買賣趨緩、理智回歸，主力便無法出貨與操縱行情。"}, {"q": "主角想「再嚇唬他一下」體現了什麼心理戰術？", "a": "察覺對手下跌時買單很少、信心不足，便以連續大單砸盤製造恐慌，再借散戶拋壓逼其止損出局；若對手再猶豫三天，便成高位接貨的一把好手。"}, {"q": "為何「割肉走了的人目前不敢進」？", "a": "損失厭惡作祟：割肉者剛承受切膚之痛，即使行情暴漲也不敢再入場，而持倉者大多未解套，貪婪與恐懼交織，市場陷入矛盾。"}, {"q": "主角為何把散戶看成「烏合之眾」？", "a": "在莊家眼中，散戶只是數據背後的老頭老太、年輕小伙、時髦女人組成的群像，他們自以為是能指點江山的經濟學家，卻註定成為犧牲者。"}, {"q": "主角反覆核對資料卻找不出隱憂，這說明了什麼？", "a": "巨量成交與三線股異動令其本能不安，理性分析無法解釋直覺，職業殺手的敏銳嗅覺讓他預感到未知對手與隱患正在逼近。"}, {"q": "主角如何用「職業殺手」邏輯壓下心中罪疚？", "a": "他強迫自己認定：介入利益爭鬥者不論善惡都必須被清除，否則就是將自己送上斷頭台；用他人鮮血染紅戰旗，正是自我合理化的異化。"}, {"q": "跌至1076點時，市場呈現什麼心理狀態？", "a": "恐慌瀰漫：三線股集體向下狂奔，垃圾股瞬間變綠，gp56顯示擔憂加劇；主角判斷該價位正是對手的止損位，對方已被洗出局。"}, {"q": "主角為何要求「每筆500萬股，1分鐘報單一次，持續性買入」？", "a": "以持續掃單重塑上攻氣勢，誘使跟風盤重新進場，股價與指數快速回升；節奏控制正是莊家操縱大眾情緒的核心手法。"}], "quotes": ["能吃到馅饼的毕竟是少数，手里有股票的人大都还没有解套，早些时候割肉走了的人目前不敢进，市场处于一个矛盾的时候。", "大家要是都理智了那就麻烦了。", "下跌的时候居然买单很少，看起来信心不足的厉害，我想应该再吓唬他一下，然后，让这些散户也给他一点压力，让他再能犹豫3天就好了。", "用他们的鲜血染红自己的战旗！", "仿佛每一组数据后面都有无数双眼睛在盯着我看，我闭上眼睛，脑子里跟过电影一样"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "会计统计报表显示：gp达到25。看起来恐慌性抛盘还是有的，但是买盘也不少。", "n": "莊家砸盤瞬間引爆散戶恐慌性拋盤，證實恐慌可被人為製造。"}, {"p": "情緒操縱", "a": "人们渐渐地在向理智回归，这不是个好事情。大家要是都理智了那就麻烦了。", "n": "莊家的命脈在於大眾情緒，理智回歸反而令其無法操縱行情。"}, {"p": "損失厭惡（割肉）", "a": "手里有股票的人大都还没有解套，早些时候割肉走了的人目前不敢进，市场处于一个矛盾的时候。", "n": "割肉者因痛苦記憶而不敢再入場，貪婪與恐懼並存形成市場矛盾。"}, {"p": "孤獨與異化", "a": "仿佛每一组数据后面都有无数双眼睛在盯着我看，我闭上眼睛，脑子里跟过电影一样", "n": "主角眼中散戶只是數據後的群像，職業生涯使他與人性日益疏離。"}]}, {"i": 95, "title": "第九十五回　惊涛股海孤舟撑", "kind": "hui", "summary": ["莊家與莊家互為籌碼：山子心理崩潰先撤，主角猝然陷入獨撐危局的被動博弈。", "熱點越明顯越要速戰速決：主角深知熱情一旦消退操縱即敗，群體情緒是成敗關鍵。", "散戶為求心理安全感湧向三線股，主角欲借其易暴跌之性震倉，截斷資金分流。", "主角低價鎖倉、買入托市、發看多股評多管齊下，操縱散戶預期與盤面情緒。", "收市後主角坦言從未如此孤獨：莊家孤舟獨撐，內在異化與重壓無人可分擔。"], "qa": [{"q": "山子為何突然崩潰出貨？他的心理承受力出了什麼問題？", "a": "他出身農村、是家裏人的希望，承受不起風險，已有約40%淨盈利仍覺被折磨：上午苦苦掙扎，下午再也控制不住情緒，只想了結交易自保——心理較量中先崩潰的一方。"}, {"q": "主角為何想趁三線股震倉？他看穿了散戶什麼心理？", "a": "散戶為求心理安全感，寧選價格低漲幅小的三線股，資金一旦分流操縱就難以為繼；主角欲借三線股風吹草動即暴跌的習性震倉，先下手截斷這股從眾之勢。"}, {"q": "上午的漲勢為何能吸引人下午參戰？體現何種群體心理？", "a": "上漲本身成了誘餌，一開盤就有很強買盤湧入，熱點越明顯跟風者越多——典型的追漲貪婪與羊群效應，眾人見漲而動、趨之若鶩。"}, {"q": "指數暴跌時主角為何要把股價鎖死在低位？防的是什麼？", "a": "防止別人高價賣出形成拋壓、引發恐慌性拋售的連鎖反應；鎖死低價等於鎖住心理防線，讓拋壓無從匯聚，也為自己騰出應對空間。"}, {"q": "主角查出指數暴跌的根源是什麼？他有何反應？", "a": "根源是山子（山國強）在出貨：其股票從上漲70%急降到下跌30%，一反一正100%震幅、全線直線下跌；主角查明後不由得火冒三丈，近乎發狂。"}, {"q": "主角安撫山子用了哪些心理技巧？", "a": "先平緩語氣讓對方喝水冷靜、卸下罪責，強調「已經賺錢了就不會有事」，叮囑持倉不動、維持現狀即可，再約收市後喝酒——以肯定、減壓與轉移注意力穩住其情緒。"}, {"q": "主角明知放棄最多虧10%即可脫身，為何仍加倉托市？", "a": "沉沒成本與不甘心作祟：倉位已增至61%，此刻認輸等於全盤皆輸；他把自己放上火爐，寧冒凶多吉少的風險繼續買入，也不肯讓前期佈局付諸東流。"}, {"q": "主角命小馬發看多股評通稿，想達到什麼心理效果？", "a": "情緒操縱與信息瀑布：以「放量換手十字星、明日必定大漲」的斷言加「管理層救市」的傳言營造利好預期，讓散戶相信明天會漲，引買盤跟進接貨。"}, {"q": "收盤後主角為何感到前所未有的孤獨？", "a": "盟友山子情緒崩潰、恐不再入市，30%籌碼一旦放出行情即毀；他獨自承擔護盤重壓，無人可分擔——職業莊家的孤獨與異化在收市後撲面而來。"}, {"q": "章末「封存資料下班」暗示了什麼？", "a": "當日戰局已定、指數收弱，主角必須獨自謀劃明日之策；首要任務是哄山子重豎勇氣，否則他與老胡兩人撐不起大盤，行情凶多吉少。"}], "quotes": ["人们的热情一旦消退整个操纵计划就很容易失败，因此，热点越是明显的时候越要速战速决。", "估计是因为价格低涨幅小，从心理上能给投资人一些安全感的缘故，大涨之后很容易鸡犬升天。", "我上午很痛苦，一直在苦苦地挣扎，下午我实在不能控制自己的情绪了，我只想早点结束。", "山子的压力太大了，他的精神已经不能承受这种高压", "收盘了，我从来没有今天这样如此地孤独"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "山子的压力太大了，他的精神已经不能承受这种高压", "n": "莊家聯盟內部同樣是心理較量，山子先崩潰使護盤計劃驟然陷入被動。"}, {"p": "情緒操縱", "a": "发一个通稿的股评文章，就说今天放量一个换手十字星，明日必定大涨", "n": "主角以股評通稿與救市傳言調控散戶預期，驅使買盤入場接貨。"}, {"p": "追漲（貪婪）", "a": "上午的上涨在一定程度上还是吸引了不少人下午参战", "n": "漲勢本身即誘餌，散戶見漲而動，熱點愈明顯跟風愈烈。"}, {"p": "孤獨與異化", "a": "收盘了，我从来没有今天这样如此地孤独，要是不加仓就此放弃的话，最多亏损10%就能全部出来", "n": "收市後莊家無人可分擔重壓，贏了數字卻輸了自我，孤獨撲面而來。"}]}, {"i": 96, "title": "第九十六回　衡山夜酌定沉浮", "kind": "hui", "summary": ["众人齐声谴责山子自私，山子装睡不語，沉默对峙一个多小时，气氛沉闷压抑。", "老大先让山子张罗吃喝缓和气氛，又以波士顿往事与父亲乡愁打感情牌，软硬兼施。", "出货计划敲定：明日山子增仓至五成托市，午后拉高，高位稳住出货，本周清空筹码。", "山子已获利脱险，放弃既得利益极难，成败系于他的自我控制与自觉自愿。", "老大归途独自沉思，深知人心难测，只能听天由命，孤独承担决策重压。"], "qa": [{"q": "山子面对众人谴责为何装睡一声不吭？", "a": "装睡是消极抵抗：以沉默回避集体谴责的压力，拖延表态，避免当场答应增仓；众人越骂他越不开口，正是用不作为对抗群体逼迫。"}, {"q": "老大让山子去叫老板娘准备吃的，背后有何心理战术？", "a": "这是缓和对峙的心理战术：用琐事打断众人指责的势头，给山子台阶下，让他在行动中恢复参与感，为随后正式摊牌铺路。"}, {"q": "老大为何不硬性要求山子增仓？", "a": "因为他深知硬性命令效果大打折扣，只有山子自觉自愿、自我控制到位，出货计划才能执行彻底；成败本质是一场心理较量的延续。"}, {"q": "山子已脱离危险还获利，为何反而最难配合？", "a": "正是损失厌恶：山子已脱离危险且获得利润，放弃已到手的利益会带来强烈的痛苦感，所以他抗拒增仓托市，宁可拖延观望。"}, {"q": "老大讲述波士顿《故乡的云》和查尔斯河的用意是什么？", "a": "唤起患难与共的兄弟情谊，以《故乡的云》的乡愁和查尔斯河的旧事制造情感共鸣，降低山子的心理防线，属于典型的情感心理战。"}, {"q": "明日平开不砸、上午托市、午后拉高出货，这套安排有何心理用意？", "a": "平开不砸稳住散户信心，上午增仓托起人气，午后高位稳住阵脚再逐步出货，是庄家节奏控制的经典手法：先托人心，再兑现利润。"}, {"q": "老大说「那就一块死」体现了什么心理？", "a": "破釜沉舟式的决绝：把全体绑上同一战车，堵死退路，既坚定众人意志，也警告山子没有中间选项，只能服从整体计划。"}, {"q": "山子的股票为何对小散户人气影响很大？", "a": "同类型股票是散户跟风的风向标，山子按兵不动，散户便观望不追，整体人气涣散，羊群效应反向放大，足以拖累全军。"}, {"q": "老胡要53度茅台、骂山子想个屁，说明了什么？", "a": "老胡以激烈情绪施压：暴躁怒骂、借酒浇愁，都是团队内的逼迫手段，用愤怒制造紧迫感，逼山子尽快表态，不再唧唧歪歪。"}, {"q": "会议结束后老大为何自忖「听天由命」？", "a": "老大深知人心难测：山子睡一觉后心态可能生变，硬来又无效，他只能把成败寄托于山子一夜之间的自我调整，遂听天由命。"}], "quotes": ["他妈的你还有心思睡觉，一起上学到工作，你孙子是这样自私老子现在才发现。", "那就一块死。这不是你担忧的问题，是我们必须做。", "在波士顿的唐人剧院我们一起听费翔唱故乡的云的时候，我老泪纵横", "他现在不但脱离了危险还获得了利润，所以，要放弃这种已经得到的利益那是非常困难的。", "我只能听天由命⋯⋯"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "山子继续一动不动地躺着，我坐在他对面的桌子上看报纸", "n": "装睡与等待对峙，老大以沉默消耗山子的意志，看谁先崩溃开口。"}, {"p": "情緒操縱", "a": "在波士顿的唐人剧院我们一起听费翔唱故乡的云的时候，我老泪纵横", "n": "老大以乡愁与患难情谊软化山子，用情感叙事逼其增仓配合。"}, {"p": "損失厭惡（割肉）", "a": "他现在不但脱离了危险还获得了利润，所以，要放弃这种已经得到的利益那是非常困难的", "n": "山子已获利在手，放弃既得利益的痛苦令其抗拒增仓托市。"}, {"p": "羊群效應（從眾）", "a": "你手头持有的股票和我们的都属于同一类型，对小散户的人气影响很大", "n": "庄家深知散户跟风，山子股票不动便拖垮整体人气。"}]}, {"i": 97, "title": "第九十七回　独斟哀乐夜未央", "kind": "hui", "summary": ["回到酒店独饮闷酒，低放哀乐蜷缩暗室，悲壮孤独感扑面而来，任灵魂在黑暗中飘荡。", "八岁窑洞冬夜独候父亲的恐惧与此刻如出一辙，环境虽变，孤独与恐惧却一模一样。", "增仓身不由己，对手皆精英而情绪合力难改，最缺时间，山子临阵脱逃更添变数。", "身为头须强装镇静作众人榜样，内心慌乱却必须示人以自信坚强。", "酒吧与陪酒女互编身世，被讹九百八十元仍照付，自嘲酒价太贵。"], "qa": [{"q": "回到酒店后，主角为何不开灯、放哀乐、把自己蜷缩起来？", "a": "绝境中的他极度孤独恐惧，哀乐是死亡意象，黑暗与蜷缩重现童年防御姿态，借让灵魂飘荡来排解劫难将临的压迫与不安。"}, {"q": "主角说环境不同而孤独感恐惧却一模一样，这反映了他怎样的心理状态？", "a": "无论窑洞还是豪华酒店，职业投资人都是独自扛压的；外在环境改变不了内心的孤独恐惧，这正是被股市博弈异化后的疏离状态。"}, {"q": "主角为何认为对手「情绪上的合力」难以一朝一夕改变？", "a": "对手虽不懂股市，却是各领域精英、自我感觉良好；群体情绪一旦形成合力便具惯性，难以靠个别力量扭转，反映群体心理的顽固性。"}, {"q": "作为「头」，主角为什么必须装出镇静自信？", "a": "众人都看着他，他要把镇静理智当作良药稳住军心；一旦露出慌乱，心理防线先崩，在这场比谁先崩溃的较量中便必输无疑。"}, {"q": "主角为何不敢强迫山子增仓？他担心触发什么？", "a": "强迫会激起逆反心理，山子很可能开盘就把剩余筹码自杀式出掉，不计成本的恐慌性抛售将是灾难的开端，所以他只能给时间缓情绪。"}, {"q": "主角喝完一瓶酒后「反而越来越清醒」，说明了什么心理？", "a": "借酒浇愁而不得，酒精也驱不散焦虑，说明重压之下他无法麻痹自己，只能清醒地直面困局，凸显内心的孤独与无助。"}, {"q": "陪酒女孩说二锅头与什么酒同价？两瓶酒最后算了多少钱？", "a": "女孩说在这儿二锅头和马爹利是一个价钱，两瓶共980元；主角离开时念及小姑娘，让经理仍按980元记账，事后自嘲太贵。"}, {"q": "主角向陪酒女孩编造悲惨身世，反映了他怎样的心理？", "a": "在重压下以编造身世、互相吹牛的方式与人周旋，既是荒诞的自嘲，也是借角色扮演暂时逃离现实博弈困局的心理防御。"}, {"q": "主角为何被识破「溜号」后仍要照价付账？", "a": "他不想让陪酒小姑娘白喝那么多酒，一念之善让他改口照980元付账；心软与精明在他身上并存，也流露孤身作战的落寞。"}, {"q": "结尾自嘲「2瓶二锅头就要980元」，折射主角什么心态？", "a": "明知被讹价仍因善意照付，事后又心疼自嘲，用幽默消解委屈，反映他在巨大压力下仍保有的柔软与无奈。"}], "quotes": ["我感到一股悲壮的孤独感向我袭来，四周静悄悄的没有一点声音", "现在的我和那个时候的我有什么区别呢？只不过是蹲的地方不一样，那时是在遥远的老家农村的窑洞里，现在蹲在繁华都市的豪华酒店里。", "环境不同可是孤独感和恐惧却一模一样。", "镇静和理智是给大家的一剂良药，其实我心里慌乱得不行，但是，必须要他们从表面得到我的自信和坚强才能胸有成竹！", "他不仅不会增仓，很可能——开盘就将剩下的筹码自杀式出掉，那将是一场灾难的开始，对我而言。"], "psych": [{"p": "孤獨與異化", "a": "现在的我和那个时候的我有什么区别呢？只不过是蹲的地方不一样", "n": "职业投资人独处酒店借酒浇愁，环境虽异，孤独恐惧却与童年一样，呈现被博弈异化的疏离。"}, {"p": "死亡焦慮", "a": "我打开哀乐把声音放到最低，提着酒瓶我蹲在阳台门口的沙发旁边，把自己全身蜷缩起来", "n": "哀乐与蜷缩姿态暗合末日感，主角在劫难将临前以死亡意象宣泄压抑。"}, {"p": "心理較量（看誰先崩潰）", "a": "镇静和理智是给大家的一剂良药，其实我心里慌乱得不行", "n": "庄家首领强装镇定稳住军心，博弈胜负取决于谁先心理崩溃。"}, {"p": "恐慌性拋售（恐懼）", "a": "他不仅不会增仓，很可能——开盘就将剩下的筹码自杀式出掉", "n": "山子一旦逆反便可能不计成本清仓，正是恐惧支配下的恐慌性抛售。"}]}, {"i": 98, "title": "第九十八回　满城喊涨我独抛", "kind": "hui", "summary": ["宿醉昏睡被敲门叫醒，报端专家齐呼必涨——庄家借舆论造势，媒体已成操盘工具。", "山子纺机暴涨六成，主角眼湿暗骂又趁机加买，情绪与算计在盘面交战。", "指数连破整数关口直逼1300颈线，买盘蜂拥而入——整数位与前期颈线构成心理锚点。", "山子老胡高位放量稳价悄悄出货，庄家之间不动声色，较量的是谁先崩溃。", "午间为一碗烩面动用权力补贴员工，下午三线股狂涨——股市之外，人心与权力亦被异化。"], "qa": [{"q": "报纸专家齐呼「今日必定大涨」，主角为何第一次对专家心存感激？这暴露了庄家什么心理战术？", "a": "主角正欲高位出货，专家造势正好吸引散户接盘，故感激「这些专家真是人才」。庄家借媒体专家之口操控大众预期，让舆论成为操盘的免费工具，此即輿論造勢之術。"}, {"q": "大盘平开缓涨、成交单子都小，主角说「散户行情比较明显，媒体的作用还是有效果的」——这说明了什么群体心理？", "a": "散户缺乏独立判断，媒体齐声喊涨便跟风买入，主力却趁机悄悄派发，正是信息瀑布与羊群效应在盘面上的写照。"}, {"q": "山子股票暴涨60%，主角为何「眼睛忽然潮湿，鼻子酸酸的」却还要继续买入？他的心理状态如何？", "a": "眼湿暗骂是惊恨山子抢先拉升、打乱自己的节奏；骂完立刻加码买入，情绪波动丝毫不妨碍理性算计，贪婪与职业冷静在主角内心交战。"}, {"q": "指数连续突破1150点、1200点大关直逼1300颈线，买盘蜂拥而入——这体现了什么心理现象？", "a": "整数关口与前期颈线成为散户的心理锚点，突破即被解读为「站稳」，追涨资金循锚点蜂拥进场，正是錨定效應在盘面上的显现。"}, {"q": "主角从山子、老胡「成交量很大、下降幅度不大」判断他们在高位卖出，为何称他们「阴得很」？", "a": "三位庄家各自悄悄出货却都维持价格、不动声色，心照不宣地比拼谁先撑不住、谁先崩溃，这是庄家之间典型的心理較量。"}, {"q": "指数跌破1200点后为何仍能维持在1160至1180点震荡？主角把功劳归给谁？", "a": "主角归因于正在启动的三线股：有人介入、上午成交量创40个交易日新高，跟风资金与启动板块持续承接，猛烈抛盘下指数才得以守住。"}, {"q": "主角给报单员的买入指令具体是什么？指令进场后盘面出现什么景象？", "a": "每笔500万股、级差价格100元、持续性买入、一分钟报单2次。指令进场后股价大幅上涨，老胡的股票猛烈拉升，几乎所有主流板块像发疯般向上冲，三线股随后跟上。"}, {"q": "指数在1230点附近主角如何操作？转弱后他又如何卖出？", "a": "在1230点附近吩咐撤掉未成交单子、停止交易，撤单不足报单总量三成；指数转弱后先以每笔500万股、级差200元卖出，再加码至每笔1000万股、级差250元猛抛。"}, {"q": "主角为保住一家面馆动用权力安排全公司员工去吃饭，甚至不惜停发午餐补助——这反映了他怎样的心理状态？", "a": "他为护住口福以权谋私、威逼利诱，权力与私欲已不分界限；股市博弈的算计延伸到日常人事，透出职业投资人情感上的孤独与异化。"}, {"q": "主角最后感叹「真是天助我也，不成都没有办法」——这句感叹藏着怎样的心理？", "a": "他把出货顺利归功于天助与三线股启动，回避承认自己造势诱多之功，既是对风险的自我安慰，也是将成败归因于外界的心理防禦。"}], "quotes": ["几个专家都异口同声地说：“今日必定大涨，昨日巨量庄家完成换手，今日一定会继续承接昨日走势放量大涨。”", "他娘的，这些专家真是人才，说得多好。", "我眼睛忽然潮湿，鼻子酸酸的，心里骂道：“他娘的山子。”", "这帮小子也阴得很，可以说不动声色。", "真是天助我也，不成都没有办法。"], "psych": [{"p": "情緒操縱", "a": "几个专家都异口同声地说：“今日必定大涨，昨日巨量庄家完成换手，今日一定会继续承接昨日走势放量大涨。”", "n": "庄家借媒体专家造势，操控散户情绪与预期，为高位出货铺路。"}, {"p": "信息瀑布（謠言市）", "a": "撤出的单子占到报单总量不足30%，可见买入的人不仅仅是我们，这些资金也在推动行情了。", "n": "专家齐呼必涨形成信息瀑布，跟风资金自我实现，合力推动指数上行。"}, {"p": "錨定效應", "a": "指数已经连续突破1150点、1200点大关，最高直逼1300点一线的前期颈线位置。买盘蜂拥而入。", "n": "整数关口与前期颈线成为心理锚点，突破即引来追涨买盘。"}, {"p": "心理較量（看誰先崩潰）", "a": "我暗暗在想：“这帮小子也阴得很，可以说不动声色。”", "n": "山子老胡与主角各自高位出货却心照不宣，比的是谁先撑不住。"}]}, {"i": 99, "title": "第九十九回　情义冲天收长阳", "kind": "hui", "summary": ["莊家以級差砸盤試探跟風盤，指數急跌至1150點，雙方心理承受力在盤面上一較高下。", "營業部人滿為患、委託窗口擠不進去，散戶群起追漲，羊群效應顯露無遺。", "尾盤主力大單拉高創1238.87點新高，刻意呵護三線股建倉熱情，情緒操縱成局。", "山子心理承受力差、違反倉位紀律，靠指數上漲消解內疚，認知失調現形。", "危機解除後主角哼唱秦腔，驚覺兩年未見上海之美，職業投資人的孤獨與異化盡顯。"], "qa": [{"q": "主角下午砸盤運用了什麼心理戰術？", "a": "他以每筆500萬股、級差150元連續賣出，並觀察跟風盤多寡，屬典型的試盤震倉——先製造恐慌試探散戶與對手盤的承受底線，再決定下一步。"}, {"q": "小張描述的營業部場景暴露了散戶什麼群體心理？", "a": "人滿為患、委託窗口擠不進去、加開窗口仍人擠人，散戶不問個股好壞便蜂擁跟風，正是羊群效應與追漲貪婪的典型寫照。"}, {"q": "山子為何承認自己「心理承受能力太差」？", "a": "他原本應把倉位控制在20%以內，卻在行情刺激下違規加倉至近50%，在心理較量中險些先崩潰，事後才慚愧自責「差點釀成大禍」。"}, {"q": "指數在1200點附近的反覆掉頭說明了什麼？", "a": "上衝1190、觸及1200即掉頭，整數關口成為多空雙方共同的錨定點——莊家與散戶都圍繞這道心理支撐位展開爭奪。"}, {"q": "主角為何在收盤前15分鐘改賣為買？", "a": "他看到三線股走弱、散戶情緒不穩，為鼓勵那位「不知名的勇士」大膽介入，便以大單買入拉抬股價，靠操縱情緒維持建倉熱情。"}, {"q": "山子如何用行情合理化自己的違規加倉？", "a": "他承認坐在電腦前「忽然通知報單員買入」，指數拉上1200點後豪氣雲天，所有不安與內疚隨指數上漲煙消雲散——用結果為衝動開脫，認知失調自洽。"}, {"q": "主角哼唱秦腔、感嘆「差不多两年了」說明了什麼？", "a": "他兩年來被行情與倉位吞噬生活，危機解除心情大好才驚覺上海的可愛，職業投資生涯使他與日常世界疏離，內心早已異化。"}, {"q": "主角為何主張「漲跌要有張有弛」？", "a": "為保護三線股神秘資金的建倉熱情，他要求盤面兼顧大勢與小資金感受，節奏把控本質上仍是針對群體心理的精細操縱。"}, {"q": "當天主力集團的配合體現了怎樣的博弈心理？", "a": "老胡、山子在關鍵時刻跟進砸盤與拉高，主角稱「這裡邊不僅僅是錢，更重要的是義氣和情誼」——莊家之間以信任與默契分擔心理壓力。"}, {"q": "主角如何強調紀律在心理博弈中的作用？", "a": "他要求山子上午把倉位降到20%以下、老胡降到60%以下，指出「道義很重要，但是纪律一定要执行」——在情緒衝動的市場中，唯有紀律能對抗群體心理的裹挾。"}], "quotes": ["这是一个非常漂亮的走势，一根阳线顶天立地，伴随巨大的成交量，从哪个角度看都是非常美丽。", "人满为患。委托窗口根本就挤不进去，有的营业部开辟了新的委托窗口，就这样还是人挤人。", "所有的不安和内疚都随指数的上涨而烟消云散。", "差不多两年了我就从来没有注意到这一点。", "我想我应该帮助一下这位不知名的勇士，一定要鼓励这些资金大胆介入。"], "psych": [{"p": "羊群效應（從眾）", "a": "人满为患。委托窗口根本就挤不进去，有的营业部开辟了新的委托窗口，就这样还是人挤人。", "n": "散戶見行情火爆便蜂擁跟風追漲，群體氣氛吞噬獨立判斷。"}, {"p": "心理較量（看誰先崩潰）", "a": "三线股开始走弱，股价不断地下滑，看起来人们的情绪还是不稳定", "n": "主力以砸盤試探散戶與對手的心理極限，誰先鬆手誰出局。"}, {"p": "情緒操縱", "a": "我想我应该帮助一下这位不知名的勇士，一定要鼓励这些资金大胆介入。", "n": "莊家以買單與節奏調控大眾情緒，誘使資金按計劃入場。"}, {"p": "認知失調／合理化", "a": "所有的不安和内疚都随指数的上涨而烟消云散。", "n": "山子以指數上漲為自己的違規加倉開脫，用結果合理化衝動。"}]}, {"i": 100, "title": "第一百回　冷雨操盘杀机藏", "kind": "hui", "summary": ["陰雨冷灰的早晨，主角在電梯鏡中直面自我：二十多歲卻只剩一條曲線，職業生涯令他孤獨而迷茫。", "指數高開逾6%，大陽線點燃散戶追高熱情，主力卻察覺「追高畏懼」而撤單，處處算計心理定勢。", "主角電話指揮山子撤單，約定先砸盤再狂拉，趁狂拉之際一筆掃出全部籌碼——典型的誘多情緒操縱。", "指數如死蛇急墜至1236點，三線股烏合之眾四散逃跑，羊群在恐慌中互相踩踏，追高者損失逾30%。", "收盤1268「吉利數字」，主角自覺殺敵800自損1000，仍盤算拖三線資金下水，令其自救助自己出貨。"], "qa": [{"q": "天氣預報與實際天氣有何差異？主角心境如何被天氣渲染？", "a": "天氣預報說有大到暴雨，早晨起來卻是毛毛细雨。陰沉淅瀝令主角覺得不適合心境，甚至自嘲「一個殺人狂徒也會鬥志全無」，鬱悶與操盤前的緊張互相渲染。"}, {"q": "主角在電梯鏡中看到怎樣的自己？這反映了他怎樣的心理？", "a": "他很瘦，長髮到肩膀，西裝筆挺卻面無表情地漠然看自己。不過二十多歲，生活卻只剩一條曲線，自問是悲哀還是成就，孤獨與異化讓他徹底迷茫。"}, {"q": "主角為何決定停止買入、撤銷未成交單子？背後是什麼心理考量？", "a": "總持倉65%時他發現小投資人追高有所畏懼，強行拉抬會使股價實際走勢與投資人心理定勢脫節。於是停止買入並撤單，讓指數在1300點上下橫盤震蕩，先穩住群體預期。"}, {"q": "主角對山子說了什麼？用了什麼心理戰術？", "a": "他斥責山子慢騰騰出貨會嚇出散戶的「買入恐懼」，單靠散戶接不起籌碼，能接籌碼的人比他們還警覺。命山子撤單，等自己與老胡先砸盤再狂拉時，把全部籌碼一筆掃出。"}, {"q": "「我要是讓你跑了，我怎麼辦？」這句話的背景與心理是什麼？", "a": "臨近上午收盤，三線股狂拉明顯想借機出貨，主角冷笑後每筆500萬股反手賣出。他把對手當獵物，用暴跌的速度製造群體恐慌，讓三線資金無處可逃。"}, {"q": "指數如何被砸下來？市場反應如何？", "a": "主角重倉股票與老胡股票直線下降，指數像一條死蛇一樣掉下來，直至1236點，從上漲百點到下跌2點，速度之快令所有人目瞪口呆，恐慌瞬間蔓延。"}, {"q": "大陽線高開後，散戶表現出什麼群體心理？", "a": "指數高開逾6%，大陽線讓參與熱情被完全激發，追高者興沖沖殺入，卻在暴跌中損失至少30%。貪婪驅動的追漲，正好成了莊家出貨的接盤力量。"}, {"q": "主角如何評價三線股的資金與操作者？", "a": "他斥其為烏合之眾，狼上狗不上，一遇風吹草動就四散逃跑。操作者半路出家、只靠小聰明，貪婪短視，不按小資金生存法則，結局與散戶同樣悲慘。"}, {"q": "1300點與1268點在盤面上有何心理意義？", "a": "1300點整數關口成為指數震蕩的中心區域，是散戶的心理支撐；上午收盤停在1268這個「吉利數字」，顯示莊家連數字本身都拿來做心理暗示與安撫。"}, {"q": "上午收盤時主角的處境與心情如何？", "a": "總持倉降至58%，低於65%難以控盤，他自覺殺敵800、自損1000有點吃虧，卻盤算拖三線資金下水、令其自救助自己出貨。指數收在1268點，他嘴角露出一絲不易察覺的微笑。"}], "quotes": ["面对这样的天气，我想一个杀人狂徒也会斗志全无。", "可是，我生活的全部就是一条曲线，这是悲哀还是成就，真的无法评述，只能说是一种职责。总之我很迷茫。", "单纯地依靠散户接不起你的筹码，能接的起你筹码的人比我们还警觉。", "我要是让你跑了，我怎么办？", "指数像一条死蛇一样，掉了下来。"], "psych": [{"p": "情緒操縱", "a": "我和老胡开始先砸盘，紧跟着再狂拉，在我们狂拉的时候，你把你手头所有筹码，全部抛出", "n": "莊家以砸盤製造恐慌、狂拉誘多，一手掌控節奏，操縱大眾情緒達成出貨。"}, {"p": "羊群效應（從眾）", "a": "三线股很明显都是乌合之众在参与，关键的时候狼上狗不上，一遇到风吹草动就四散逃跑", "n": "三線資金如羊群般跟風狂拉，風吹草動便四散奔逃、互相踩踏。"}, {"p": "孤獨與異化", "a": "我生活的全部就是一条曲线，这是悲哀还是成就，真的无法评述", "n": "職業投資人的世界只剩一條K線，主角在孤獨中迷失自我、心生迷茫。"}, {"p": "錨定效應", "a": "1300点上下成了指数震荡的中心区域，我看着山子的股票在上涨的时候，涨幅微乎其微，但是成交巨大", "n": "整數關口1300點成為多空心理定錨，收於1268吉利數字，連數字也成暗示。"}]}, {"i": 101, "title": "第一百零一回　翻云覆雨股海惊", "kind": "hui", "summary": ["主角不敢直視營業部老人恐懼無助的眼神，由槍林彈雨的老革命聯想到父親，恐懼面前人皆脆弱。", "操盤手憑專業知識、過硬心理素養與殘缺的情感體驗對陣散戶的可憐資金與無知者無畏。", "莊家等恐慌盤出盡才啟動，先任散戶自殺式多殺多，再注入活力拉升，全程操縱群體情緒。", "山子故意壓低漲幅製造補漲錯覺，誘散戶追漲，尾盤趁機出貨，留下小資金自相殘殺。", "尾盤砸盤使指數由陽轉陰，三線股最後二十分鐘跌逾六成，心理較量以對手崩潰告終。"], "qa": [{"q": "中午主角為什麼不願去營業部看盤？他在心理上逃避什麼？", "a": "他不敢看那些善良可憐的老頭老太太的眼神——面對如此慘烈的走勢，他們眼裡那種孤獨、恐懼、無助讓他撕心裂肺。他逃避的是散戶群體絕望所引發的共情與罪疚感。"}, {"q": "經歷過槍林彈雨的老革命為何在股市暴跌時恐懼到嘴唇顫動？", "a": "槍林彈雨他不曾害怕，面對股市慘烈下跌嘴唇卻不停顫動，眼裡盡是迷茫與無盡恐懼——戰場的敵人可見，市場的風險無形；缺乏知識與技能的人只能聽天由命，恐懼源於無知與無助。"}, {"q": "主角說散戶「聽天由命」注定死無葬身之地，這裡的「天」指什麼？", "a": "這裡的「天」就是那些能操縱股價的資金大鱷，他們恰恰是散戶的對手。把自己的命運交給操縱行情的人，等於自願成為被收割的對象，這正是莊家與散戶間最殘酷的博弈前提。"}, {"q": "職業操盤手與散戶相比，心理層面的差別是什麼？", "a": "操盤手具備專業知識、過硬的心理素養與「殘缺的情感體驗」，加上精英團隊與雄厚資金；散戶只有可憐資金和無知者無畏的冒險精神——情感殘缺正是莊家不被散戶痛苦所動的心理條件。"}, {"q": "主角為什麼堅持等恐慌盤充分釋放後才啟動拉升？這是什麼心理戰術？", "a": "恐慌盤未出盡就貿然啟動，只會加劇更多恐慌盤湧出；他等到散戶情緒從恐慌轉為理性、出現百手以上大單才下令買入——這是節奏與試盤的心理戰術，先讓對手的情緒徹底崩潰。"}, {"q": "三線股「自殺式的多殺多」反映散戶什麼群體心理？", "a": "暴跌中散戶不計成本互相踩踏，拋單不大但壓力巨大，每個價位相差幾乎十幾元——這是典型的恐慌性拋售，恐懼驅使眾人爭相奪路而逃，理性讓位於跟風拋售的本能。"}, {"q": "山子為何故意控制自己股票的漲幅？他利用了散戶什麼心理？", "a": "大盤瘋漲時山子股票只漲不到兩成，讓小投資人產生「強勢股補漲」的錯覺，於是爭相追進——他利用的是散戶追漲與攀比的心理，借眾人的關注在尾盤順利出貨。"}, {"q": "尾盤指數衝上1340點又迅速跌破1300點，1300點在心理上有什麼意義？", "a": "1300點是千點整數關口，指數上穿時市場人氣鼎沸、跌破時人心惶惶——整數關口是眾人的心理錨，莊家反覆穿越它，正是運用心理支撐位來操縱多空雙方的預期。"}, {"q": "對手試圖在三線股翻身時，主角為何冷笑說「豈能讓你先走」？", "a": "這是一場心理較量——比誰先崩潰。主角自恃資金雄厚、看準對手心急翻本，於是不間斷砸盤，三分鐘便把指數打回陰線，讓對手的翻本企圖變成絕望，逼對方先繳械。"}, {"q": "主角總說「老子還要在裡面呆一陣子」，透露出職業操盤手什麼心理狀態？", "a": "他把市場視為長期博弈的陣地，冷漠操弄漲跌，把別人跌六成當作「很理想的走勢」——職業異化使他與散戶的苦難徹底隔絕，情感愈發殘缺，只剩勝負與倉位。"}], "quotes": ["一个职业操盘手具备非常专业的知识，过硬的心理素养，残缺的情感体验，强大的资金实力和集中了各行各业的精英聚集起来的团队，而散户有什么？就是那点可怜的资金和无知者无畏的冒险精神。", "因为股市的“天”就是那些能操纵股价的资金大鳄，他们也恰恰是你的对手，你把自己的命运交给这样的“天”希望能得到一个什么样的结果呢？", "每次想到这位老人家颤巍巍的嘴唇，我就想到我年迈的父亲每次送我离家的时候，也是强忍难过的心情，嘴唇不停地颤动，眼里充满泪水，一再叮嘱：“在城里走路要看方向，城里车多得很。”", "一定要让所有的恐慌盘都发挥之后，才能开始有所动作，不然，在恐慌盘没有得到充分释放之前贸然启动，只会加剧更多的恐慌盘涌出，这是比较糟糕的手法。", "“他娘的，今天就想翻身那还了得，老子还要在里面呆一阵子，岂能让你先走。”"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "三线股的股价还在雪崩式地下跌，抛单虽然不大，但是自杀式的多杀多形成的压力却很大，每个价位之间相差几乎十几元", "n": "暴跌中散戶不計成本互相踩踏，恐懼驅使眾人爭相奪路而逃。"}, {"p": "心理較量（看誰先崩潰）", "a": "“他娘的，今天就想翻身那还了得，老子还要在里面呆一阵子，岂能让你先走。”", "n": "莊家與對手比拼心理承受力，誰先崩潰誰就交出倉位。"}, {"p": "情緒操縱", "a": "报单员的指令进入场内之后，刚才还死气沉沉的大盘一下子被注入了活力，指数开始直线向上，老胡的股票涨", "n": "莊家先放任恐慌蔓延，再注入資金拉升，全程操控大眾情緒。"}, {"p": "錨定效應", "a": "报单员的指令进入场内之后，刚才还死气沉沉的大盘一下子被注入了活力，指数开始直线向上，老胡的股票涨幅达到60%以上，我重仓的几只股票涨幅都达到50%以上，大盘指数迅速上穿1300点，最高达到1340点，成为自从2月16日下跌以后开始反弹的最高点，市场人气鼎沸。", "n": "千點整數關口成為多空的心理錨，莊家反覆穿越以牽動預期。"}]}, {"i": 102, "title": "第一百零二回　股海危局谋砥柱", "kind": "hui", "summary": ["主角重梳盤面資料，深知資金運作如履薄冰、危機四伏，一個不利消息即可能功虧一簣。", "為引導散戶棄三線股、捧藍籌，主角密約媒體策劃小馬，密謀以輿論重塑散戶思維。", "小馬點破媒體心理戰要訣：行情波動時影響力最大，週一至週三發布效果最佳。", "主角定下通稿「三線股集體雪崩、藍籌股頂天立地」，欲連發一週以操控大眾情緒。", "座位尊卑、賭氣疾馳的細節，映出操盤者的機心與疏離，散戶只是可引導的思維模式。"], "qa": [{"q": "主角為何形容資金運作「危機四伏」？這是一場什麼心理較量？", "a": "資金運作至最困難階段，一個不利消息或突發意外即功虧一簣；散戶情緒瞬間可變，高位與熱點疑慮都是致命打擊。這是莊家與散戶比誰先崩潰的心理較量。"}, {"q": "主角想「引導投資人的思維模式」，這在心理學上屬哪種手法？", "a": "屬情緒操縱：透過媒體塑造散戶的認知框架，令其思維更接近莊家設想，使「不看好三線股、看好熱門股」成為散戶自以為是的判斷。"}, {"q": "小馬建議「藍籌股發財、垃圾股傾家蕩產、說得越慘越好」，利用了散戶哪種心理？", "a": "利用損失厭惡與恐懼：把垃圾股描述得極其可怕，放大賠錢的痛感，散戶便會因懼怕虧損而遠離三線股，轉向被反覆吹捧的藍籌股。"}, {"q": "小馬為何認為行情「上上下下」時媒體影響力最大？", "a": "波動市裡投資人不知下一步怎麼辦，急切求助媒體與專家意見，關注度最高，消息易被反覆轉述放大，形成信息瀑布，預期在傳播中自我實現。"}, {"q": "「連續說一個星期，所有人都學會了藍籌股」，體現何種群體心理？", "a": "羊群效應與從眾：多數人不獨立判斷，只要權威口徑持續一周反覆強化，眾人便齊聲認可同一敘事，跟風成為主流，個體意見被淹沒。"}, {"q": "小馬說專家「會及時抓住一些新鮮的名詞亂叫」，散戶迷信專家屬哪種心理？", "a": "專家崇拜／過度自信：散戶把判斷外包給專家，而專家熱衷追逐新名詞湊熱鬧，雙方互相強化，輿論由此滾雪球，真相反而無人追究。"}, {"q": "主角命小馬連發一週「三線股雪崩、藍籌股砥柱」的通稿，預期何種市場效果？", "a": "借輿論造勢製造對三線股的恐慌性拋售，同時給藍籌股套上「中流砥柱」的錨點，令散戶割肉換股，莊家便可低吸籌碼、順勢完成資金運作。"}, {"q": "小馬因主角坐後座而傷自尊、賭氣疾馳，反映哪種心理？", "a": "自尊受損下的情緒化反應：她把「坐後座」解讀為身份卑微的信號，覺得丟面子、不被尊重，於是壓抑不滿化為超速行車的賭氣，行為受情緒驅使。"}, {"q": "主角斷言副駕座「也是最卑微的位置」，顯示他怎樣的心態？", "a": "權力等級意識：他以座次界定尊卑，習慣支配人際距離，連坐車位置都要掌控主動；此種控制欲也延伸到他對市場投資人思維的引導上。"}, {"q": "主角全程以「引導」目光審視小投資人，其職業心態有何異化？", "a": "職業異化與疏離：散戶在他眼中只是可調教的「思維模式」，是完成資金運作的工具；他愈冷靜，愈失去與普通人的共情，孤獨與操控成為職業代價。"}], "quotes": ["资金运作到这个时候是最为困难的时候。可以用危机四伏来形容，一个不利的消息、一个突发的意外都可能会导致功亏一篑。", "因为人情绪的变化是在瞬间就会发生的。", "既要做到让眼下小投资人不看好三线股，又要培养他们继续看高热门股的未来股价。", "这样只要连续说一个星期的时间，所有人都学会了什么叫蓝筹股，那些专家也很喜欢凑热闹，会及时抓住一些新鲜的名词乱叫的。", "像现在这样上上下下的时候影响最大了。投资人都想知道下一步怎么办，所以就会关注媒体、专家的意见了。"], "psych": [{"p": "情緒操縱", "a": "既要做到让眼下小投资人不看好三线股，又要培养他们继续看高热门股的未来股价。", "n": "莊家借媒體通稿雙向引導散戶情緒，使其棄三線股而捧藍籌股。"}, {"p": "信息瀑布（謠言市）", "a": "像现在这样上上下下的时候影响最大了。投资人都想知道下一步怎么办，所以就会关注媒体、专家的意见了。", "n": "波動市散戶求助媒體專家，消息層層轉述放大，預期自我實現。"}, {"p": "羊群效應（從眾）", "a": "这样只要连续说一个星期的时间，所有人都学会了什么叫蓝筹股，那些专家也很喜欢凑热闹，", "n": "持續一週的輿論灌輸令眾人齊聲認可同一敘事，個體喪失獨立判斷。"}, {"p": "專家崇拜／過度自信", "a": "那些专家也很喜欢凑热闹，会及时抓住一些新鲜的名词乱叫的。", "n": "專家追新名詞放大輿論，散戶迷信權威，判斷完全外包。"}]}, {"i": 103, "title": "第一百零三回　豪饮释嫌谋退兵", "kind": "hui", "summary": ["众人难得轻松欢聚，老大却提醒鹿死谁手未定，局面仍处危急混乱之中。", "复盘当日战况：成交量大而金额小，低价股活跃、高价股滞涨，阴线高悬振幅13%令散户承压。", "定计套住三线股小机构，媒体统一通稿鼓吹大行情稳人心，下周第二梯队资金全面撤出。", "山子剖白心迹：斩仓出局后恐惧崩溃，曾想自杀、怕进提篮桥，重入战场却背负罪疚。", "众人举瓶豪饮，老胡调侃、老大许诺法国度假，男人的劝慰就是豪饮，兄弟尽释前嫌。"], "qa": [{"q": "收盤「一根陰線高懸在最高處、全天振幅13%」，老大為何說這對小投資人心理壓力比較大？", "a": "高位陰線與13%振幅令散戶感到高位滯漲、追高被套的危險，較昨日只漲5點更顯上攻乏力，恐懼與不確定感因此被放大。"}, {"q": "三線股小機構被打殘之後，老大為何主張先給他們「緩衝時間」？", "a": "他判斷對方一直繃得太緊會徹底崩潰，崩潰對雙方都不好；先讓其情緒放鬆、留在場內被套，是比誰先撐不住的心理較量。"}, {"q": "老大為何說打擊三線股小機構，散戶就「自然而然地被解決掉」？", "a": "散戶最大的毛病是喜歡撿便宜、不願涉足高價股，思維與三線股小機構幾乎一樣；群體思維趨同之下，套住小機構，散戶也跟著被解決。"}, {"q": "莊家如何利用媒體與輿論穩定人心、調動散戶情緒？", "a": "從下周一起統一通稿口徑，讓吹鼓手一致鼓吹大行情即將到來，並刻意培育散戶資金做多的信心，以輿論造勢穩定人心，是典型的情绪操縱。"}, {"q": "山子「自殺式地拋掉籌碼」反映了他怎樣的群體心理與個人恐懼？", "a": "千點之下23個交易日、30多個自然日的折磨讓他瀕臨崩潰，恐懼中不計成本斬倉出局，是恐慌性拋售的極致寫照，他甚至一度想到自殺。"}, {"q": "山子反覆說「我不是一個壞人也不是一個自私的人」，這背後是什麼心理機制？", "a": "他背棄同伴的事實與自我認同劇烈衝突，於是不斷以「太害怕」為自己開脫、把行為合理化，以緩解內疚，是典型的認知失調與自我合理化。"}, {"q": "山子重入戰場發出買入指令時為何「不由自主」又「猶豫不決」？", "a": "恐懼與情義在交戰：他害怕再次崩潰，但看到老大的股票紋絲不動、知道對方在等他，情義與責任最終壓過恐懼，令他在猶豫中下意識下單。"}, {"q": "山子幾乎全部清倉後為何「沒有輕鬆和喜悅，反而更加沉重」？", "a": "因為大家還都在裏面，他因曾背棄過大家而驕傲不起來；賺再多也無法抹去罪疚，這是莊家操盤手無法迴避的道德拷問。"}, {"q": "上午砸盤時，老胡的倉位為何不降反升、成本上移4%？", "a": "他為配合老大砸盤而著急，沒有撤銷之前的買單，基本上自己賣給自己許多，還接了不少散戶的拋單，導致倉位整體增加、成本上移。"}, {"q": "當天為何「成交量很大而成交金額不大」？這對後續運作有何意義？", "a": "成交大多集中在低價股板塊，高價股幾乎沒有交易，故量大而金額小；散戶做多激情已被調動、思維全面轉勢，對莊家後續出貨十分有利。"}], "quotes": ["散户最大的毛病就是喜欢捡便宜，不愿意涉足高价股票。", "从最终收盘的走势看，一根阴线高悬在最高处，全天振幅高达13%，较昨日收盘只上涨5个点，这对小投资人来说心理压力比较大。", "人不是不坚强，只要是碰到你最软弱的地方你自然而然就会放弃抵抗了。", "当我不由自主地发出买入指令的时候，我还在犹豫不决。看到股价忽然飞速上涨的那一瞬间，我一切的顾虑和担忧都烟消云散了，是的，我们有能力驾驭局面。", "等走过去了，自己回头再看走过的路真的很骄傲。可是，要做成我这样子，有多大的成就都骄傲不起来，因为我曾经背弃过大家。"], "psych": [{"p": "情緒操縱", "a": "我的计划就是把三线股的小机构套住，不让他离开股市，然后我们再从媒体方面鼓吹大行情的走势即将到来，稳定人心", "n": "莊家以媒體統一通稿鼓吹大行情、穩定人心，注解情緒操縱。"}, {"p": "心理較量（看誰先崩潰）", "a": "加上三线股的小机构今天被打残，估计需要一个缓冲的时间，让他们在情绪上放松一下，不然，一直绷得这样紧会让他们崩溃", "n": "莊家把對手逼到崩潰邊緣又故意鬆綁，比的是誰先撐不住。"}, {"p": "羊群效應（從眾）", "a": "散户现在的思想都基本上集中在三线股板块，因为散户最大的毛病就是喜欢捡便宜，不愿意涉足高价股票", "n": "散戶思維與小機構趨同、愛撿便宜，正是莊家可乘的從眾心理。"}, {"p": "道德衝突／罪疚感", "a": "可是，要做成我这样子，有多大的成就都骄傲不起来，因为我曾经背弃过大家", "n": "操盤手因背棄同伴而驕傲不起來，是莊家良心的拷問。"}]}, {"i": 104, "title": "第一百零四回　千金一诺转头空", "kind": "hui", "summary": ["运作将尽，金主张先生翻脸赖账，一句「傻瓜拿住股票都会赚」抹杀操盘手全部价值，庄家与金主的信任一夜崩塌。", "张先生以「股市还要大涨、朋友路子广」为由拒付，实为牛市贪婪下的幸存者偏差与自我合理化，只见赢家不见输家。", "主角惊觉人性两面：春节跪求之人今日在酒吧花天酒地、趾高气扬，同一个人前后判若两人，人心难测。", "主角因对方失信反而卸下良心的重负，得以放手按自己的方法处理问题，道德冲突借他人之恶而化解。", "独对唐诗宋词中的《四块玉》，「贤的是他，愚的是我，争什么」，职业操盘手的孤寂与异化尽在其中。"], "qa": [{"q": "张先生拒付700万时搬出什么理由？这反映出什么心理？", "a": "他说朋友告知股市还要大涨，傻瓜拿住股票都会赚得一塌糊涂，用不着操盘手，只肯给三十万。这是典型的幸存者偏差与牛市过度自信，只见赢家不见输家。"}, {"q": "张先生声称低价股至少能涨到高价股的一半，体现什么心理现象？", "a": "以高价股的价位为心理锚，幻想低价股必然补涨到其一半，正是锚定效应的表现——用个别价位锚定全部预期，完全忽视基本面与风险。"}, {"q": "主角见张先生把见面地点约在徐家汇酒吧包厢、又拖延一个多小时，为何觉得不对劲？", "a": "地点与拖延都偏离了对方往日恭顺的脚本，职业警觉让他从细节中嗅到变故：心里有一丝丝不满和隐忧，估计有什么变故要发生，后来果然应验。"}, {"q": "张先生翻脸后，主角为何反而觉得「心里坦然了许多」、心情轻松？", "a": "对方失信令他卸下分钱的良心包袱，不必再担忧良心的谴责与不安，可放心按自己的方法处理问题——道德冲突借他人之恶得以化解。"}, {"q": "主角拒绝陪唱小姑娘时说「我生来就是个白痴」，这是什么心理战术？", "a": "以自贬自嘲的方式拉开距离、拒绝诱惑，既不失礼节又保持冷峻的气场，是一种以退为进的心理防御，让对方无从纠缠。"}, {"q": "主角感叹「人和人的差异在于一个人的两面性」，原文如何佐证？", "a": "他无法把眼前翻脸的张先生与春节期间跪在面前的男人联系在一起，正如无法把娴熟抽烟的小马与乖乖女形象的小马联系起来——同一个人前后判若两人。"}, {"q": "主角预计何时结束全部交易？北京方面情况如何？", "a": "不出意外最多三个星期结束全部交易；北京期货部三番五次催促，期货数据已经开始传递，到了火烧眉毛的时候，两边事务叠加压身。"}, {"q": "主角计算四人清退需要多少费用？他为何料想对方不会推诿？", "a": "四人至少需要700万，相对本次运作资金与盈利幅度不值一提，对方自己运作时亏损幅度也小得多，且本次盈利高出预期不止一倍，理应爽快兑现。"}, {"q": "张先生私加五万并自称「爽快人」，这反映了什么心理？", "a": "用「朋友一场」的小恩小惠包装赖账，既维持暴发户的面子，又为食言行为自我合理化，同时试探主角底线，是市侩心理的典型表现。"}, {"q": "主角读关汉卿《四块玉》，「贤的是他，愚的是我，争什么」折射出他怎样的心境？", "a": "看破世态炎凉后的孤寂与自省：既感叹人生不必争，又深知人在江湖身不由己，不为自己争却需为大局争，正是职业投资人异化后的内心写照。"}], "quotes": ["我无法把眼前的这个男人跟春节期间跪在我面前的那个男人联系在一起，就如同我无法将娴熟抽烟的小马和一个看起来是乖乖女的小马联系起来一样。", "人和人之间的差异不在不同人之间，而在于一个人的两面性，这才是人需要智慧才能生存的关键所在。", "股市涨得这么好，傻瓜拿住股票都会赚得一塌糊涂，还用得着什么操盘手啊，开国际玩笑。", "朋友说低价股至少能涨到高价股的一半。", "贤的是他，愚的是我，争什么！"], "psych": [{"p": "倖存者偏差", "a": "股市涨得这么好，傻瓜拿住股票都会赚得一塌糊涂，还用得着什么操盘手啊", "n": "金主只看见牛市中赚钱的人，便认定傻瓜也能赚，无视多数散户亏损的真相。"}, {"p": "認知失調／合理化", "a": "看在咱们都是朋友的份上，除过那30万块钱给你们大家之外，我私人在私下给黄先生5万块钱，就算朋友一场", "n": "张先生用小恩小惠包装赖账食言，以「朋友情分」为背信自我开脱。"}, {"p": "道德衝突／罪疚感", "a": "看现在的样子我会很轻松的按照自己的方法去处理问题，而不必担忧良心地谴责和不安等等", "n": "对方失信反令主角卸下分钱的良心包袱，庄家内心的道德冲突由此浮现。"}, {"p": "錨定效應", "a": "朋友说低价股至少能涨到高价股的一半", "n": "以高价股价位为心理锚，幻想低价股必然补涨，正是心理定锚的典型表现。"}]}, {"i": 105, "title": "第一百零五回　蓝筹初兴股海波", "kind": "hui", "summary": ["庄家与老胡联手砸盘，一举砸破1200点心理关口，恐慌性抛售随即蔓延，恐惧主宰盘面。", "「蓝筹股」通稿与股评铺天盖地，舆论造势裹挟散户从众，新名词一夜之间成为时髦。", "「你能挺多久」的追问道出博弈本质：比的不是技术，而是谁先崩溃的心理承受力。", "对手逆势拉高、见涨就追，赌徒心态使其沦为庄家收割对象，领跌股跌幅超过五成。", "受贿被自我合理化为募捐，众人散去独享孤独，主角在算计与博弈中日益异化疏离。"], "qa": [{"q": "庄家用了什么心理战术让大盘由涨转跌？", "a": "先以媒体通稿舆论造势推出「蓝筹股」，再与老胡联手连续巨量砸盘，一举砸破1200点心理关口，恐慌气氛被激发，散户不计成本抛售，借恐惧完成洗盘换手。"}, {"q": "从gp38的数据看，散户表现出什么群体心理？", "a": "恐慌性抛售：统计显示恐慌性投资人确实存在，暴跌中散户不计成本地抛售，把割肉当作自我解脱的最好选择，群体恐惧随指数下跌互相传染、愈演愈烈。"}, {"q": "对手操盘三线股在心理战术上犯了什么错？", "a": "不懂顺势而为：不利消息出台时不顺势下砸锁定成本，反而强行上推、逆势出货，成交量与涨幅不成比例，等于借高价给小散户出货机会，足见其不懂市场规则。"}, {"q": "「我看你能挺多久」道出了博弈的什么本质？", "a": "心理较量：庄家以每笔600万股的连续抛压试探对手的资金与意志，比的不是技术而是心理承受力，谁先崩溃谁就输掉整场战役，这就是看谁先撑不住的博弈。"}, {"q": "主角为何感叹「买了就是你的，想反悔都不行」？", "a": "揭示亏损不可逆转的残酷：领跌股跌幅超过五成，一旦买入即成事实，反悔无门；这正是损失厌恶的根源，赔钱的痛苦让散户更加慌乱，急于割肉止损。"}, {"q": "「蓝筹股」为何一夜之间成为时髦名词？", "a": "信息瀑布与从众：通稿先行、股评铺天盖地，众人一致看好新概念，观点在传播中自我强化，散户跟风追捧，羊群效应让这三个字迅速占领整个资本市场。"}, {"q": "面对35万的受贿举报，主角如何实现心理自洽？", "a": "认知失调与合理化：明明是张先生给的钱，他却以「专程募捐」「寄给希望小学」重新定义整件事，老头子也说「不算」，用自我合理化消解了道德上的不安。"}, {"q": "众人离去后主角「享受孤独」，反映了他怎样的心理状态？", "a": "孤独与异化：他独自留在办公室，看着窗外小鸟感叹世界美好，却无人可诉、无人相伴；在算计与博弈中沉浮日久，职业投机者已与常人的世界渐行渐远。"}, {"q": "对手「稍微有点阳光就开始灿烂」暴露了什么心理误区？", "a": "赌徒谬误：指数稍稍回升他便再度拉高发动行情，把微弱反弹当成转机，以为急跌之后必有反转，结果更大的抛压再度袭来，跌幅反而超过五成。"}, {"q": "主角反复「停止交易、撤单」有何心理用意？", "a": "节奏与试盘：砸盘与买入交替、见势即撤，用节奏变化试探对手虚实、调动散户情绪，制造剧烈波动消耗对方资金，把盘面主动权牢牢握在自己手中。"}], "quotes": ["看起来恐慌性的投资人还是有的，不计成本的抛售已经成为自我解脱的一种最好的选择。", "我看你能挺多久，有多少钱来支撑这个行情？", "市场的恐慌气氛被激发，指数一度跌到1195点左右。", "这样的跌幅可不是小孩子过家家玩儿，不高兴了重来。这东西买了就是你的想反悔都不行。", "我始终站在窗前没有转身，听到关门的声音我知道他们都走了，剩下我一个人在这儿享受孤独。"], "psych": [{"p": "恐慌性拋售（恐懼）", "a": "看起来恐慌性的投资人还是有的，不计成本的抛售已经成为自我解脱的一种最好的选择", "n": "gp38显示暴跌中散户不计成本割肉，把抛售当作自我解脱，恐惧主宰盘面。"}, {"p": "心理較量（看誰先崩潰）", "a": "我看你能挺多久，有多少钱来支撑这个行情？", "n": "庄家以连续巨量抛压比拼心理承受力，谁先崩溃谁就输掉整场博弈。"}, {"p": "心理支撐位", "a": "指数开始快速下跌，迅速由红变绿而且砸破1200点，市场的恐慌气氛被激发", "n": "1200点整数关口一旦被砸破便引爆群体恐慌，关键点位成了情绪开关。"}, {"p": "孤獨與異化", "a": "剩下我一个人在这儿享受孤独", "n": "众叛亲离的算计生活令主角疏离于世，职业投机者的孤独是内在异化的写照。"}]}, {"i": 106, "title": "第一百零六回　雪崩驚魂鎖局深", "kind": "hui", "summary": ["主角自省資本市場人人設局牟利：消息、報表、走勢虛虛實實，道德良心在利益面前歸零，人性被徹底異化。", "一碗麵條勾起職業投資人的孤獨與迷茫，「你別無選擇」迫他壓下心緒，重返博弈戰場。", "下午主力心理較量：買單試盤拉高後撤單，指數一二五七點回落，散戶追高乏力、觀望成風。", "收盤前對手尾盤拉高欲出貨，主角以千萬股大單封殺，三線股雪崩，恐慌瀰漫、指數險守一二○○點。", "主角批對手死扛如散戶、輕視心理博弈，感嘆遊資難成氣候；當晚孤獨裹被獨眠，異化愈深。"], "qa": [{"q": "主角開篇說「道德、良心、責任、義務……統統歸零」，這反映了他怎樣的內心異化？", "a": "他承認自己每天都在為利益設局，也被人設局，社會人的道德規範在利益面前歸零，心與思想乃至情感都被束縛；這正是莊家在利益與良心之間的自我異化，也是本書反覆注解的主角內在衝突。"}, {"q": "主角看著桌上那碗麵條為何「有點心酸和失落」？這暴露了他怎樣的心理狀態？", "a": "設局謀利到頭來只為一碗麵條，他再次迷茫人生的意義；「你別無選擇」與被束縛的心，正是職業投資人孤獨與異化的寫照——贏了博弈，輸了自我。"}, {"q": "上午三線股集體暴跌、主角重倉股跌幅不大，他為當天定下的心理任務是什麼？", "a": "他給自己定下的任務是「控制局面、鎖住三線股的這些小機構」，同時為老胡減倉做好準備；先穩住盤面再圖後計，顯示操盤手把控制對手預期當作第一要務。"}, {"q": "下午不到三十分鐘增倉百分之五而gp只有二十二，主角由此讀出了什麼散戶心理？", "a": "他判斷「拋盤還是很嚴重，人們對追高還是缺乏勇氣」——散戶在暴跌後恐懼未消，寧願埋單等好價位也不願追高，正是損失厭惡與追漲貪婪此消彼長的群體心理。"}, {"q": "指數上衝一二五七點後成交清淡、大單寥寥，主角為何斷言這是「散戶行情」？", "a": "同價位超過一百手的單子寥寥無幾，說明缺少主力資金推動，純靠散戶零散資金難以成勢；這注解了羊群效應——散戶只能跟風，沒有領頭力量時行情便死氣沉沉。"}, {"q": "臨近收盤三線股放量急拉，主角如何識破對手尾盤拉高的意圖？這屬於什麼博弈？", "a": "他發現同價位超百萬股掛單密集於幾隻領頭羊，判斷對方想收盤前推高股價、明天借機出貨；這是一場心理較量——他耐心等對方風頭過去，賭對方撐不到收盤。"}, {"q": "主角以每筆一千萬股、一分鐘報單兩次砸盤，三線股「雪崩式地下跌」，說明了什麼群體心理？", "a": "主力大單一出，本已疲憊的指數急轉直下，三線股聞風雪崩；跟風拋盤的人雖不多，但恐慌瞬間蔓延，說明在情緒操縱之下，恐慌性拋售一旦點燃便難以遏制。"}, {"q": "主角批評對手危急時刻「死扛」、操作思路和散戶一模一樣，對方犯了什麼心理錯誤？", "a": "指數急跌時正確做法是迅速放大單把倉位壓到低位、做到價位倉位雙底以便出貨，對方卻選擇死扛；這是典型的處置效應——不願賣虧損股，和散戶一樣被損失厭惡綁住手腳。"}, {"q": "「操縱股價不僅僅需要資金實力，最重要的是需要駕馭市場的能力」，這句話的心理學內涵是什麼？", "a": "他指對手忽視對市場、對手及散戶心理的把握，做不到順勢而為；資金為王的思維只能鑽單邊上漲的空子，危急時刻缺乏應變，正是過度自信、輕視心理博弈的失敗之道。"}, {"q": "當天成交量為何萎縮近半？小資金「心理處於臨界狀態」對後續操作意味著什麼？", "a": "山子股票無大動作、老胡在出貨，熱點股只有主角重倉在動；小資金屢虧後熱情淡化、觀望濃厚。散戶心理臨界時操作難度加大，主角深知後續運作須格外小心。"}], "quotes": ["资本市场充满了太多欺诈，我每天都为了利益在设局，也有人为我设局，同样也是为了利益", "道德、良心、责任、义务等等属于社会人的道德规范统统在这儿归零。", "在利益地束缚下，人活在世界上没有办法像树上飞来飞去的小鸟一样，自由自在地飞翔。", "这傻瓜真是个生瓜蛋子，缺乏突发事件的应变能力。", "他们忽视了对市场、对手以及散户心理地把握，做不到顺势而为，往往事半功倍。"], "psych": [{"p": "心理較量（看誰先崩潰）", "a": "我耐心地等候他风头正劲的时候过去，我不相信他一直能持续到收盘。", "n": "主力尾盤對轟比定力，賭對手先崩潰，正是看誰先撐不住的心理較量。"}, {"p": "恐慌性拋售（恐懼）", "a": "本来就疲惫不堪的指数，在热点股票地打击下开始急转直下，三线股所有股票闻风而动，价格雪崩式地下跌。", "n": "主力砸盤點燃恐慌，三線股聞風雪崩，注解恐慌性拋售的連鎖傳導。"}, {"p": "處置效應", "a": "这傻瓜真是个生瓜蛋子，缺乏突发事件的应变能力。", "n": "危急時刻死扛不割、與散戶無異，正是處置效應不願賣虧損股的寫照。"}, {"p": "孤獨與異化", "a": "我需要孤独的环境保证让自己心情平静下来，司机送我回酒店。", "n": "職業操盤手束縛心與情感，贏了博弈卻在孤獨中自處，是主角的異化。"}]}, {"i": 107, "title": "第一百零七回　噩梦惊魂筹大计", "kind": "hui", "summary": ["主角連夜噩夢：火窟、高橋與雪山墜落，呼喚父親無人應答，映現其內在的孤獨與死亡焦慮。", "老胡倉位降至52%，主角推算三線股需漲200%、耗時二十個交易日方能出貨，被迫再籌大型動作。", "莊家深諳「事不過三」：三根陰線後市場必絕望，遂以巨單拉抬製造希望，激發全場無限欲望。", "巨單護盤引來眾人齊步跟風，做多思維壓抑兩日後瞬間點燃；他順勢高拋打壓，又反手再拉。", "「唱戲的是瘋子，看戲的是傻子」——主角自喻台上瘋子，篤定散戶從未堅持一輪、慣於關鍵處放棄。"], "qa": [{"q": "開篇的噩夢透露出主角怎樣的心理狀態？", "a": "夢中火窟、高橋與雪山墜落皆為焦慮的投射，呼喚父親無人應答、孤獨奔逃，又聯想老飯店住客皆已死去，顯見其內在孤獨、異化與死亡焦慮交織。"}, {"q": "莊家為什麼必須趕在「三根陰線」之前出手？", "a": "他相信「事不過三」：兩根陰線尚可觀望，三根之後小機構會割肉、小投資人失去熱情就沒人追捧，局面將非常糟糕，故須以希望穩定群體情緒。"}, {"q": "「唱戲的是瘋子，看戲的是傻子」體現了莊家什麼心理戰術？", "a": "他自比台上的瘋子，深知莊家必須以身作餌、大膽表演，散戶才會激情加入；這正是以誇張動作操縱看客情緒、引誘眾人入局的表演式操盤。"}, {"q": "主角驚歎「怎麼這麼多人跟風」，背後是什麼群體心理？", "a": "壓抑兩日的做多思維被巨單拉抬瞬間點燃，眾人見漲齊步追進、爭相捧場，正是典型的羊群效應與從眾心理，也是莊家最樂見的人氣效應。"}, {"q": "主角如何利用「希望」來操控市場情緒？", "a": "他深知「只有希望才能激發無窮的欲望」，故必須不斷給市場參與各方以希望，防止絕望情緒蔓延；希望是他調動散戶欲望、維繫追捧人氣的核心工具。"}, {"q": "1200點在主角的操盤佈局中意味著什麼？", "a": "大盤1204點開盤、臨近1200點失守之際他立即巨單進場護盤，可見千點整數關口是多空的心理定錨，也是他設計拉抬與打壓節奏的關鍵點位。"}, {"q": "主角為何斷言散戶「從來沒有堅持過一個周期」？", "a": "他觀察到無論上漲還是下跌，散戶大都在關鍵時刻放棄，從未完整走完一個週期；他更盤算藉此引導，把散戶的操作習慣培養成後繼莊家輕鬆做莊的基礎。"}, {"q": "主角打算如何「培養」散戶的操作習慣？", "a": "他主張以目前的方式反覆引導，讓散戶的條件反射被馴化，日後莊家便能順勢收割；這正是溫水煮青蛙式的習慣養成，散戶在不知不覺中被塑造。"}, {"q": "主角對戒酒與否的糾結反映什麼心理？", "a": "他明知總這樣喝酒會出麻煩，卻以「煙已戒了，酒再戒了幹什麼去」自我開脫、維持現狀，正是用合理化藉口為成癮行為辯護的認知失調。"}, {"q": "主角與老胡、山子之間的操盤是什麼博弈關係？", "a": "老胡出貨、主角護盤、山子配合拉高，三者步調一致：先聯手把指數推上1300點，再高拋壓至1246點，體現莊家之間以默契進行節奏博弈的合作關係。"}], "quotes": ["所谓的事不过三还是有道理的，两根阴线还可以观望，三根之后就绝望了，必须给市场参与各方一些希望，只有希望才能激发无穷的欲望。", "俗话说：唱戏的是疯子，看戏的是傻子。如果台上的不疯台下的能傻吗？", "是啊，这是一个非常复杂的局面。可是，事实上，散户从来就没有坚持过一个周期，大都是在关键的时候放弃。", "我比较惊讶今天的状态，怎么这么多人跟风？看起来人们做多的思维在压抑了2天之后被完全调动起来了。", "我大声地呐喊，他们似乎听不见我的声音。"], "psych": [{"p": "羊群效應（從眾）", "a": "我比较惊讶今天的状态，怎么这么多人跟风？看起来人们做多的思维在压抑了2天之后被完全调动起来了。", "n": "巨單拉抬瞬間點燃壓抑兩日的做多思維，散戶見漲齊步跟風，正是典型從眾。"}, {"p": "情緒操縱", "a": "必须给市场参与各方一些希望，只有希望才能激发无穷的欲望。", "n": "莊家刻意製造希望以調動全場情緒，視欲望為可被點燃的市場燃料。"}, {"p": "錨定效應", "a": "这样不死不活地交易持续了大约5分钟的时间，指数向下面临1200点失守的境地。", "n": "千點整數關口成為多空心理定錨，主角據此設計護盤與打壓的節奏。"}, {"p": "孤獨與異化", "a": "我在一个小山包上走，看到下面有一些人和骆驼在走，我想下去可是我找不到下去的路，我大声地呐喊，他们似乎听不见我的声音。远远的", "n": "噩夢中無人應答、孤獨奔逃，映照職業莊家與世隔絕的精神疏離。"}]}, {"i": 108, "title": "第一百零八回　红房夜宴谋推涨", "kind": "hui", "summary": ["收盘后跟风盘减少，三线股领涨启动，小资金信心回升，主角从盘面数字中获得喜悦。", "红房子夜宴中得知证券法将出台，主角决意借政策消息与媒体造势推高指数，操纵人气。", "三线股暴涨成热点，短线资金蜂拥追高，主角深恐重仓股被遗忘，须保住明星地位。", "主角连续大单砸盘，至1210心理支撑位收手，个股普跌三成，跟风盘恐慌抛售。", "尾盘大单拉升重仓股，权重股再成热点；生瓜蛋子不撤单自买自卖，庄家心理较量见高下。"], "qa": [{"q": "主角为何在1210点附近停止砸盘？这体现了什么心理现象？", "a": "因为1210点是关键的心理支撑位，再砸下去人气涣散、行情难以重树。这说明关键点位具有心理定锚作用，连庄家的操盘节奏也受其制约。"}, {"q": "主角如何利用消息与媒体操弄大众情绪？", "a": "他得知23日证券法要出台，决定利用这一点推高指数，并派小马赴北京协调媒体协助。庄家以政策预期为诱饵、借舆论造势，正是情绪操纵手法。"}, {"q": "「生瓜蛋子」为何会自己卖给自己股票？他输在哪个心理层面？", "a": "他资金雄厚却不懂盘面，上午的买单未撤销，下午急跌中全部成交，等于高价接回自己抛出的筹码。这是庄家间心理较量的失败——主角砸盘试探，他不撤单先崩溃，成了输家。"}, {"q": "三线股暴涨时，短线资金表现出什么群体心理？", "a": "三线股一启动便成为市场热点，短线资金纷纷追高转入炒作，30%以上的涨幅仍挡不住买盘。这正是追涨的贪婪与羊群效应，众人一致看好，权重股一时被集体遗忘。"}, {"q": "砸盘之后个股普跌，跟风散户呈现出什么状态？", "a": "指数从1280跌至1240时，跌幅达30%的个股比比皆是，随波逐流的三线股跌得更惨。恐慌之下人们不计成本抛售，抛空跟风者众多，正是恐慌性抛售之态。"}, {"q": "主角为何执意保住重仓股的「明星地位」？这与散户心理有何关系？", "a": "在未完全出货前，重仓股必须是市场上最耀眼的明星，才能吸引跟风资金接盘。这是庄家对散户心理的利用——只有明星效应与热点效应才能维持人气，让自己全身而退。"}, {"q": "收盘后主角的统计数字说明了什么？", "a": "收盘持仓65%、gp38，跟风盘较前减少，可能与收盘有关；砸盘后仓位降至58%，尾盘拉升后回到67%，全天上涨94点、涨幅超8%，成交13亿多，尽显庄家高抛低吸节奏。"}, {"q": "红房子西餐厅的描写有何深意？", "a": "红房子是上海最有名的西餐厅，异域风情、绅士贵妇气质与中餐馆的集贸市场气氛截然不同。主角点油泼面、拒番茄酱处处格格不入，暗示他属于另一个世界——职业赌徒与上流社会的疏离。"}, {"q": "老胡的股票下午放量缓跌，主角从中读出什么？", "a": "成交量很大但跌幅不大，主角判断老胡正借三线股上涨的人气托盘出货，遂配合砸盘掩护，山子的股票在平衡区震荡亦助掩护，庄家之间配合默契。"}, {"q": "主角为何在尾盘20分钟突然大单持续买入？", "a": "距收盘20分钟，主角以每笔500万股、级差30元持续买入，重仓股掉头向上，老胡、山子的股票配合起涨，权重股再度成为热点，将指数推上高点，完成全天高抛低吸。"}], "quotes": ["这是一个关键的心理支撑位置，不能再继续砸盘了，再砸下去自己就倒霉了。", "听说23号证券法要出台。我希望利用这一点推高指数，媒体方面需要协助。", "在没有完全出货前一定要保证自己的重仓股是市场上最耀眼的明星。", "看他们吹萨克斯的神态我想那不是表演，而是对自己人生的一种总结。", "这种情况会拖死人的，搞到最后自己吃了一肚子货，还不知道怎么回事。"], "psych": [{"p": "心理支撐位", "a": "直至1210点附近，这是一个关键的心理支撑位置，不能再继续砸盘了，再砸下去自己就倒霉了。", "n": "庄家砸盘也止步于关键点位，说明整数关口对操盘节奏具有心理定锚作用。"}, {"p": "情緒操縱", "a": "听说23号证券法要出台。我希望利用这一点推高指数，媒体方面需要协助。", "n": "庄家借政策消息与媒体造势操控大众预期，以配合拉升出货。"}, {"p": "心理較量（看誰先崩潰）", "a": "我忽然想到是否这小子根本就没有意识到买入的未成交单子需要撤销，否则的话自己买别人高价抛出的筹码就是做好人好事了。", "n": "庄家对庄家以砸盘试探底线，对方不撤单先崩溃，输在心理较量上。"}, {"p": "恐慌性拋售（恐懼）", "a": "个股的跌幅达到30%的比比皆是。三线股受到打击之后，也开始猛烈地下跌，一些随波逐流的三线个股跌幅更大一些。", "n": "砸盘引发恐慌，散户不计成本抛售，随波逐流者跌得更惨。"}]}, {"i": 109, "title": "第一百零九回　夜阑把盏话浮沉", "kind": "hui", "summary": ["庄家以三次大幅震荡、累计约30%的走势激活人气，主动操控市场情绪，然成本消耗太大。", "三次震荡成交仅13亿，参与交易者未增、全是存量资金，暴露人气热情开始衰退。", "老胡仓位仍逾五成，明日须降至三成，主角或增仓至八成以上，庄家间心理较量激烈。", "瞿小姐期货多单过度持仓、亏损严重、出师不利，外表平静难掩内心紧张，被沉没成本困住。", "深夜衡山路主角独坐窗前、行路无言，职业操盘手的孤独与异化尽显。"], "qa": [{"q": "庄家今天采用大幅震荡这一招，心理目的是什么？", "a": "全天震荡三次，每次接近最高价就回调、接近上一交易日收盘价就上涨，累计幅度约30%，目的是激活人气；从三线股走势看确实达到效果，但成本消耗实在太大。"}, {"q": "从成交量数据能看出市场群体心理的什么变化？", "a": "历经三次大幅震荡成交只有13亿，说明参与交易者并没有增加，只是一些存量资金在炒作，充分暴露出人们的热情开始有衰退的迹象，人气已不如最初热烈。"}, {"q": "老胡仓位52%为何让主角脊梁发凉？这属于庄家间的什么博弈？", "a": "明日老胡须降至30%以下才能顺利出逃，否则主角持仓可能增到80%以上，等于把自己放进烤箱，局面失控就彻底失败——这是庄家之间比心理承受力的较量，谁先撑不住谁先崩潰。"}, {"q": "瞿小姐期货大幅亏损的心理根源是什么？", "a": "资料显示过度持仓是最大麻烦，大幅度亏损与它关系很大；她手中多单不愿及时止损，一进去就碰上强对手、出师不利，被已投入的成本困住难以放手。"}, {"q": "瞿小姐外表与内心有何反差？", "a": "她人看起来打击很大，虽然外面看不出什么，但能感觉到她的紧张；壮志未酬身先死、出师不利，主角安慰她还没到山穷水尽的地步后，她脸色才稍好一点。"}, {"q": "主角为什么忽然觉得自己\"不近人情\"？", "a": "他仔细看期货资料时，听到瞿小姐和小马低声交谈，忽然感到自己有点不近人情，便收起资料听她们说话——职业化久了，人情味反而成了奢侈品。"}, {"q": "深夜走在衡山路上，主角呈现出怎样的心理状态？", "a": "初夏夜风凉爽，他一直在思考明天的事情，很少有心情说话；众人聚饮时他独自坐在窗前看天空，努力想理顺思路，尽显职业操盘手的孤独与疏离。"}, {"q": "老胡为何一听说小马也去，连再见都顾不上说就挂电话？", "a": "老胡正急着和小马套近乎，顾不上理主角；听到主角问仓位才答\"52%还多一点\"，他此刻心思全在私事上，对出货风险已无当初那般警觉。"}, {"q": "面对期货的不利局面，主角的底气从何而来？", "a": "他认为期货之事必须有更大的策划才能反败为胜，虽然没到山穷水尽的地步，但也不是手到擒来；他自信有足够把握，仍要等五月赴京再作安排。"}, {"q": "西餐礼仪对主角而言有什么心理意味？", "a": "西餐讲究太多，一顿饭吃近4小时让他烦躁；礼仪课上\"从你进门那一刻起，你就必须改变自己\"的规矩，于他是不得不戴上的社交面具，也是职业生活异化的一部分。"}], "quotes": ["今天的走势震荡激烈，虽然采用这种大幅度震荡的目的激发了人气，但是成本消耗实在太大。", "这充分暴露出人们的热情开始有衰退的迹象。", "从你进门的那一刻起，你就必须改变自己了", "壮志未酬身先死，出师不利。", "可是那样的话，我完全把自己放进了烤箱，一旦局面失控，我将彻底失败。"], "psych": [{"p": "情緒操縱", "a": "今天的走势震荡激烈，虽然采用这种大幅度震荡的目的激发了人气，但是成本消耗实在太大。", "n": "庄家以三次大幅震荡制造火爆假象，主动操控市场情绪以激发人气。"}, {"p": "心理較量（看誰先崩潰）", "a": "搞不好我的持仓会增加到80%以上，否则，他很难顺利出逃。可是那样的话，我完全把自己放进了烤箱", "n": "庄家间比拼心理承受力，谁先撑不住谁先崩潰，主角押上全部身家。"}, {"p": "沉沒成本", "a": "目前过度持仓是最大的麻烦，大幅度亏损和这个有很大的关系。", "n": "瞿小姐多单深亏仍不愿砍仓，被已投入的仓位困住，正是沉沒成本作祟。"}, {"p": "孤獨與異化", "a": "我便一个人坐在窗前，看着外面的天空，努力地想理顺思路。", "n": "聚饮独坐、行路无言，职业操盘手的孤獨與疏離溢於言表。"}]}, {"i": 110, "title": "第一百一十回　股海屠牛夜话长", "kind": "hui", "summary": ["瞿小姐逆勢做空期貨屢戰屢敗，被失敗感與帳面虧損折磨，損失厭惡令她遲遲不肯果斷止損。", "主角看穿她經驗不足遭人算計，卻顧及她的心理承受力而不點破，只勸減倉一半、靜待反轉。", "主角傾訴遭浙江人賴賬設套、背後舉報的鬱結，錢款盡數捐出，職業孤獨與道德自洽交織。", "次日主角誘多拉升指數至1341點新高，隨即撤單縮量，靜待追漲的短線獲利盤自投羅網。", "主角重倉砸盤，指數狂瀉至1250點，散戶恐慌失據，老胡股票重挫四成，市場哀鴻遍野。"], "qa": [{"q": "瞿小姐為何在期貨一路上漲時仍兩次逆勢做空？", "a": "漲到39800點她見走勢露出疲態便再度重倉做空，誤以為漲勢見頂必跌，正是賭徒式的「跌久必漲、漲久必跌」錯覺；結果下探37500點後掉頭向上、屢觸漲停無法出場，破41000點被強制平倉，實際虧損逾50%。"}, {"q": "「我」明知瞿小姐被人算計，為何選擇不說破？", "a": "他判斷她經驗不足、剛剛入行又未經專門訓練，說破對她打擊太大，只安慰她問題不嚴重、自己很快就去北京相助。這是先穩住對手情緒、顧及心理承受力的博弈智慧。"}, {"q": "瞿小姐說「這幫蠢貨根本不知道情況，還真以為股市行情來了」，反映她怎樣的認知？", "a": "她站在莊家視角輕蔑盲目樂觀的散戶，認為他們把行情當常態、不懂資金背後有人操縱；此言也暗含對自己逆勢被套的自嘲與自我合理化。"}, {"q": "「我」為何先以每筆500萬股掃貨、創新高後又立即撤單？", "a": "先以巨單掃貨配合老胡、山子推高指數至1341點，製造多頭氣勢誘人跟風；創新高後撤單，讓指數在1300點上方震盪縮量，正是誘多之後試盤觀望、掌控節奏的操盤術。"}, {"q": "「我」為何說「放在神壇上的就是我而不是他們」？", "a": "若讓短線資金在獲利中從容出逃、自己接最後一棒，被套在山頂的就是他；他必須以75%倉位痛下殺手，逼對手先崩潰，這是莊家與散戶之間的心理承受力之爭。"}, {"q": "指數從1340點急瀉至1250點，散戶表現出什麼群體心理？", "a": "缺乏經驗的散戶「一下子就被打傻了」，毫無應對策略，市場一片恐慌，委托窗口哭爹喊娘；可見暴跌中群體因恐懼而失去理智，成為莊家情緒操縱的獵物。"}, {"q": "「我」說若在過去「一定會有人因為恐懼而超低價斬倉出局」，說明什麼？", "a": "說明恐慌性拋售是暴跌中的慣性反應；如今下跌時跟風者不多，他欣慰投資人「多少有點思路」，也印證這次砸盤意在擊潰透支者的心理防線，而非嚇退理性資金。"}, {"q": "老胡股票從上漲70%急跌40%，參與者為何「今生都會記憶猶新」？", "a": "如此巨幅落差令人刻骨銘心，先給足甜頭再連本帶利收回，正是莊家溫水煮青蛙之後的雷霆一擊；心理落差愈大，恐懼記憶愈深，日後愈容易被行情牽著走。"}, {"q": "「我」被浙江人涮了是怎麼回事？", "a": "浙江人原本答應利潤提成與30萬感謝費、另給他個人5萬，股市起漲後賴賬反悔，還設套舉報他受賄；他把錢款交給小張全部捐助，鬱結難平又無處傾訴。"}, {"q": "主角處理被出賣一事與每日操盤，顯示他怎樣的內心狀態？", "a": "他苦笑說「人生煩惱的事情很多」，把苦悶獨自吞下；站在窗前喝咖啡進入狀態、看走勢圖便入睡，顯示職業投資人已把屠戮與壓力流程化，人際疏離、情感日益異化。"}], "quotes": ["内心一直被失败感和账面亏损30%所折磨，心里很苦。", "人的反应能力永远没有市场的变化快。", "我必须痛下杀手，不能给任何人以喘息的机会。", "可以想象得出市场上一片恐慌，委托窗口一定是哭爹喊娘的声音。", "等你反应过来的时候，股价已经下跌得连你自己都不认识了。"], "psych": [{"p": "情緒操縱", "a": "可以想象得出市场上一片恐慌，委托窗口一定是哭爹喊娘的声音。", "n": "莊家以猛烈砸盤操控市場恐慌情緒，散戶在情緒中喪失理性。"}, {"p": "心理較量（看誰先崩潰）", "a": "我必须痛下杀手，不能给任何人以喘息的机会。", "n": "莊家與散戶比拼心理承受力，主角主動出擊逼對手先崩潰。"}, {"p": "追漲（貪婪）", "a": "在我猛烈地抛盘压力下，上午一路追涨买入未成交的单子，全部成交", "n": "散戶貪婪追高，恰在莊家砸盤前接盤，淪為出逃的犧牲品。"}, {"p": "損失厭惡（割肉）", "a": "内心一直被失败感和账面亏损30%所折磨，心里很苦。", "n": "瞿小姐被帳面虧損折磨卻遲遲不敢果斷止損，正是損失厭惡的寫照。"}]}, {"i": 111, "title": "第一百一十一回　十字星照人间路", "kind": "hui", "summary": ["主力借錨定效應營造安全區，散戶眷戀高價不肯出貨，拋壓因此大減。", "上午高價畫餅誘多，散戶雖未吃到卻不願放手，羊群般齊等回漲。", "1247點破位震懾與尾盤收單皆為心理戰，讓追高者接走籌碼。", "主角壓抑情感不問老胡，強撐平靜穩住軍心，職業投資人的孤獨與異化畢現。", "收盤1272點創本輪天量，三線股暴跌打殘對手心態，兩周大計繫於最後兩日。"], "qa": [{"q": "主力為何認為1249點附近是「安全區域」？這反映哪種心理現象？", "a": "因為人們的思維還沒從高價區走出來，仍懷念高價位曾帶來的利益，「絕對不舍得出貨」，賣壓自然稀少——是錨定效應與處置效應的疊加。"}, {"q": "上午高價被比作「非常有希望的餅」，散戶為何「不願意輕易放手」？", "a": "高價位成了散戶心中的錨點，眾人等著漲回去「吃餅」，誰也不願在低位割肉；主力利用這種捨不得的心態確保拋盤稀少，方便老胡出貨。"}, {"q": "「三線股上午暴跌徹底打殘了對手的心態」——莊家如何運用心理戰術？", "a": "先以暴跌打殘對手心態，收盤前快漲令對方來不及反應，下午慢漲又不足以激起熱情——以節奏與試盤展開心理較量，令跟風者無所適從。"}, {"q": "尾盤主力為何「把所有掛單追漲的單子都給收了」？", "a": "這是誘多與砸盤的配合：先讓追漲者拿到籌碼，再讓老胡瘋狂砸盤，價格迅速下降，追高者接盤、主力出貨，成交金額創本輪新高。"}, {"q": "主角「打消了打電話問老胡的念頭」，反映了他怎樣的心理狀態？", "a": "越到最後關頭越緊張，他強迫自己冷靜按計劃行事，還要在眾人面前維持信心，不讓任何人感到這是終局——職業投資人的孤獨與異化畢現。"}, {"q": "上午收盤前約15分鐘，主力下了什麼指令？效果如何？", "a": "每筆300萬股、級差價格30元買入，股價瞬間推高約50元，指數穿越1300點由負轉正，走出「到過天堂也入過地獄，最終還是在人間」的十字星。"}, {"q": "下午主力用什麼手法試探市場有沒有人追漲？結果如何？", "a": "每筆100萬股、級差10元持續性買入，指數緩升到1320點附近，會計數據顯示gp28——有人跟風但力度不強，沒有了上午的狂熱。"}, {"q": "山子的股票尾盤一度跌30%，主力為何說「這樣的走勢不會有多大的成交量」？", "a": "山子基本上維持現狀、隨波逐流，只是順勢推動走勢；震盪幅度大但上下速度快，來不及換手，所以成交量與成交金額都極少，散戶難以參與。"}, {"q": "全天收盤情況如何？主力最擔心什麼？", "a": "收盤1272點、成交金額23億多，較昨日跌25點，是本輪行情最大成交額；主力擔憂老胡倉位降到何種程度，這直接決定兩周內能否結束全部交易。"}, {"q": "主角為何要在最後關頭「讓大家看到信心」？", "a": "事情越到最後越緊張、變化越多，若讓小張、會計察覺這是收尾時刻，人心浮動必亂節奏；維持眾人平靜，才能冷靜完成心理博弈的收官。"}], "quotes": ["因为人们的思维还没有从刚才那个高价当中走出来，继续怀念那个高价位曾经给自己带来的利益，目前的价位绝对不舍得出货。", "可以用曾经到过天堂也入过地狱，最终还是在人间来描述上午的走势。", "上午的高价给人们画出了一个非常有希望的饼，虽然没有吃到，但是，谁也不愿意轻易放手。", "三线股上午暴跌彻底打残了对手的心态，上午收盘前上涨过快对方来不及反应，下午涨势缓慢不足以激起对方参与的热情。", "不能让任何人感到这是最后的关头，只有这样大家才能够有足够平静的心态。"], "psych": [{"p": "錨定效應", "a": "人们的思维还没有从刚才那个高价当中走出来，继续怀念那个高价位曾经给自己带来的利益", "n": "散戶對高價位的眷戀成心理錨點，主力據此斷定拋壓稀少、區域安全。"}, {"p": "情緒操縱", "a": "不能让任何人感到这是最后的关头，只有这样大家才能够有足够平静的心态", "n": "主角壓抑真實進度、維持眾人平靜，以氛圍操控完成收官的心理戰。"}, {"p": "心理較量（看誰先崩潰）", "a": "三线股上午暴跌彻底打残了对手的心态，上午收盘前上涨过快对方来不及反应", "n": "暴跌打殘對手心態、漲跌節奏拿捏，比的是誰先承受不住而崩潰。"}, {"p": "追漲（貪婪）", "a": "上午的高价给人们画出了一个非常有希望的饼，虽然没有吃到，但是，谁也不愿意轻易放手", "n": "高價畫餅放大貪婪，散戶寧可苦等也不放手，反成莊家出貨的助力。"}]}, {"i": 112, "title": "第一百一十二回　夜读红楼悟机心", "kind": "hui", "summary": ["持仓近七成压于高位、人气不旺，主角心绪沉重如生命不能承受之重，忧出货无门。", "夜读红楼王熙凤，自比机关算尽的聪明人，惧算计过甚、树敌太多反误自己性命。", "由凤姐逼死尤二姐等悟出不可赶尽杀绝，给三线股对手盘留余地，以免其绝望弃守。", "4月15日砸盘撤单、托盘拉升反复试探，指数绕1265点震荡，观测散户跟风人气。", "三线股午后成明星，领头股涨逾四成却成交清淡，涨易出难；老胡趁机抛售露急态。"], "qa": [{"q": "为什么持仓近七成、人气不旺时，主角感到“生命不能承受之重”，甚至“真想有个人说说话”？", "a": "高位重仓无人接盘，出货如走钢丝，四周压抑的建筑与匆匆行人更放大了他的孤独；职业投资者无人可诉，内心负担沉重到近乎窒息，正是孤独与异化的写照。"}, {"q": "主角读到王熙凤“机关算尽太聪明，反误了卿卿性命”，反映出他怎样的心理？", "a": "他自认也是机关算尽的聪明人，怕眼下种种算计终会像凤姐一样误了性命；这既是自省，也是高位重仓下的职业赌徒对末路的死亡焦虑与不安。"}, {"q": "从凤姐的教训中，主角悟出怎样的博弈之道？为什么“留余地”反而是聪明？", "a": "做事不可太绝，否则自己给自己设障碍；给对手盘留一线希望，他们才肯坚守阵地而不拼死相搏，聪明人应让对手活得好些，以免长活于敌人中间。"}, {"q": "上午主角先砸盘再托盘，体现了庄家怎样的心理战术？", "a": "这是典型的试盘与情绪操弄：先大单砸盘看抛压与承接，撤单后反手买入拉升，借一砸一拉测试市场人气与跟风盘，再据统计决定下一步操作。"}, {"q": "“上涨时候跟风的人比较多，散户做多的积极心态仍然没有太多消失”，说明散户处于什么心理状态？", "a": "指数一涨散户便热情洋溢地追多跟风，是典型的羊群从众与追涨心理；人气不散正说明贪念仍在，而这恰恰是庄家出货可以利用的接盘基础。"}, {"q": "主角为什么担心“一旦有风吹草动肯定会多杀多的”？", "a": "多头们都在高位勉强撑着、各怀心思，心理已如绷紧的弦，一旦利空出现，抢先出逃的多头会互相践踏，形成恐慌性抛售的踩踏，正是不崩则已、一崩成灾的群体心理。"}, {"q": "4月15日主角试探盘面时，具体是怎样操作的？", "a": "先以每笔100万股、级差20元卖出砸盘，指数加速下行至1255点附近即撤单；再以每笔300万股、级差30元买入，指数冲破开盘价逼近1300点后停止交易、撤销未成单。"}, {"q": "当天老胡的股票表现出什么迹象？主角如何判断？", "a": "老胡趁上涨抛售筹码，量很大却几乎无涨幅，主角觉得他“有点着急了”；午后其股忽然快速拉升，被疑又要高台跳水，收盘前大幅下跌，判断他筹码已出得差不多了。"}, {"q": "看到三线股领头羊涨逾四成却成交清淡，主角为何说“要上涨很容易，要出货却很难”？", "a": "无量上涨靠拉抬与跟风，散户并不真在买，涨上去只是账面数字；缺乏真实承接盘，庄家想借人气兑现筹码便难上加难，这正是庄家最怕的有价无市。"}, {"q": "主角让会计统计、让小张查开户数据，是在做什么？", "a": "他借统计数据观察人气增减：看多仍占多数、跟风者众；开户数量与地域分布则帮他判断场外还有多少新资金观众，好决定继续拉升还是择机出货。"}], "quotes": ["心情极度沉重,69%的持仓在目前的高位是非常危险的,特别是人气不是很旺的时候。", "有时候真的非常厌倦这个行业，整天这样费尽心机地算计，这个时候我忽然想到王熙凤，说她机关算尽太聪明，反误了卿卿生命。到底是什么误了她的性命呢？", "想想也是做事情不能做得太绝，不然，自己会为自己设置许多障碍", "你表演得再好没有观众，你所有的表演都是发神经病似的神经质。", "一旦有风吹草动肯定会多杀多的。"], "psych": [{"p": "情緒操縱", "a": "不一会儿指数开始加速下跌，其余股票也不同程度地跟随指数而下降", "n": "庄家砸盘撤单、托盘拉升，一砸一拉间操控市场情绪与跟风盘，注解情绪操弄战术。"}, {"p": "心理較量（看誰先崩潰）", "a": "我看老胡的股票，借助股价上涨的过程抛售筹码，成交量很大，但是基本上没有什么涨幅", "n": "庄家与老胡相互试探、比谁先撑不住，注解多空博弈中先崩溃者出局的心理较量。"}, {"p": "羊群效應（從眾）", "a": "看多的人还是多数，上涨时候跟风的人比较多，散户做多的积极心态仍然没有太多消失", "n": "指数一涨散户便热情跟风做多，人气不散，正是追涨从众的羊群心理。"}, {"p": "孤獨與異化", "a": "真想有个人一起说说话，说什么都行，可是，实在没有人能和我说话", "n": "高位重仓、无人可诉，主角在算计中日益孤立，注解职业投资者的疏离异化。"}]}, {"i": 113, "title": "第一百一十三回　浴读红楼悟杀机", "kind": "hui", "summary": ["主力與散戶各懷心事，量能萎縮下形成下跌抵抗形態，主力盤算以單邊下跌誘散戶搶反彈。", "看K線推斷對手意圖、刻畫自身痕跡，散戶拉抬不跟、砸盤不願出，雙方陷入看誰先崩潰的心理較量。", "主角狂擊沙袋發泄狂躁，浴缸讀《紅樓夢》大徹大悟，以「人終歸一死」合理化殺伐，內心日趨決絕冷酷。", "一千點與一千二百點成為心理定錨，主角據此規劃減倉與反彈節奏，關鍵點位牽動群體心理與操作。", "以李斯倉鼠之位為戒自勉拼死一搏，職業投資人的孤獨、狂躁與合理化交織，人與自己展開激烈博弈。"], "qa": [{"q": "主力在「下跌抵抗形態」中運用了什麼心理戰術？", "a": "主力希望散戶看多以便借機出貨，但散戶看多無力推升，量能萎縮無法成功出貨；主力便盤算乾脆單邊下跌消除散戶疑雲，再倡導「急跌必有急漲」激發散戶搶短線慾望，順勢出貨。"}, {"q": "散戶在「下跌抵抗形態」中表現出什麼群體心理？", "a": "散戶心態處於遊離狀態，拉抬不願意跟、砸盤不願意出，看多總覺得不踏實，一根大陰線便對心理形成壓力；從眾觀望、猶豫不決，是典型缺乏主見的群體心理。"}, {"q": "主角為何說「要想用一幅作品感動別人，首先要感動自己」？", "a": "他設想先來一根大陰線、回調到1200點再重新起漲才是大行情的標準走勢；自己先深信這套圖形敘事，才能堅定地依此操作，反映自我說服對建構信心的心理作用。"}, {"q": "主角對沙袋瘋狂擊打，洩露了他什麼內在狀態？", "a": "急於求成使他陷入急躁、行為上太多不理智，對沙袋擊打一個多小時，是將內心的狂躁與不安轉化為肉體宣洩；這顯露職業投資人在高壓與孤獨中的內在異化。"}, {"q": "主角對王熙鳳的重新解讀，反映了他心理上怎樣的轉變？", "a": "他推翻「機關算盡太聰明」之說，主張殺手不能瞻前顧後、須臨危不亂、出手必下殺手，並以「人終歸一死」合理化冷酷，顯示其為適應市場而重塑價值觀、消解罪疚感的過程。"}, {"q": "主角照鏡子誇獎自己一翻，說明了什麼心理？", "a": "他看著鏡中清瘦帥氣的自己自誇「小伙子真是人才」，將意氣風發歸功於自身；這種自我肯定帶有自我服務偏差的色彩，也顯示他在高壓之下亟需藉肯定自己來維持信心。"}, {"q": "主角的持倉比例是多少？他如何形容此時的行情？", "a": "持倉增加到71%，是春節過後持倉的最高階段，也是行情接近尾聲的時候，他形容此刻「真是危機四伏」，並從這根小小的陽線湧出「下跌抵抗形態」一語。"}, {"q": "主角與老胡、山子在飯局上約定了什麼減倉計劃？", "a": "山子倉位不到15%，老胡約35%；主角主張明日單邊下跌，前半截歸老胡、後半截歸他，維持在1200點之上讓老胡把倉位降到20%以下，不能再猶豫。"}, {"q": "主角以李斯為例，悟出了什麼人生與博弈的道理？", "a": "李斯太看重倉鼠之位、顧忌太多而失去鬥志和銳氣，才受制於太監、被送上菜市口；他由此自勉拼死一搏，把人生勝負視為一場不顧一切的心理較量。"}, {"q": "本章中「1200點」扮演了什麼心理角色？", "a": "無論是「回調到1200點重新起漲」的大行情設想，還是「維持在1200點之上」的減倉計劃，一千二百點都是主力與散戶心中的錨定價位與支撐位，牽動雙方的操作節奏與心理預期。"}], "quotes": ["主力希望散户看多，借机出货。散户看多没有能力推动上去，于是各怀心事的双方共同的合力造就了这样的走势。", "拉抬不愿意跟，砸盘不愿意出。散户的心态实际上处于一种游离状态，看多总觉得不踏实，一根大阴线对人的心理还是有一定的压力的", "还不如单边下跌，让散户心头疑云彻底消除，然后，再开始倡导急跌必有急涨的理念", "一个杀手如何能这样瞻前顾后？必须要做到临危不乱，出手必下杀手，干他娘的！", "对着那一个个沙袋疯狂地击打，内心的狂躁和不安在这样的疯狂之中渐渐地发泄出去。"], "psych": [{"p": "情緒操縱", "a": "还不如单边下跌，让散户心头疑云彻底消除，然后，再开始倡导急跌必有急涨的理念", "n": "主力設計單邊下跌洗清散戶疑雲，再宣揚急跌必漲誘其搶反彈，是典型的操控情緒以出貨。"}, {"p": "心理較量（看誰先崩潰）", "a": "拉抬不愿意跟，砸盘不愿意出。散户的心态实际上处于一种游离状态，看多总觉得不踏实", "n": "主力拉抬無人跟、砸盤散戶不願割，雙方在僵持中比拚心理承受力，誰先崩潰誰就輸。"}, {"p": "認知失調／合理化", "a": "就是因为王熙凤对所有的对手痛下杀手，才能游刃有余，至于后来的结局谁能逃脱一死？", "n": "主角以「人終歸一死」合理化殺伐決斷，用重讀《紅樓夢》為自己的冷酷賦予正當性。"}, {"p": "心理支撐位", "a": "从最初的1000点起步到最高的1350点附近，回调下去到1200点，重新起涨这才是有大行情的标准走势", "n": "一千點與一千二百點是眾人心理定錨，主角據此規劃減倉與反彈，印證關鍵點位牽動人心。"}]}, {"i": 114, "title": "第一百一十四回　砸盘惊魂洗浮筹", "kind": "hui", "summary": ["莊家洞悉散戶急功近利、崇尚短線的心理弱點，視「順應投資人心理傾向」為大資金運作成敗的關鍵。", "砸盤也是一種心理戰術：急跌後再漲可給投資人吃定心丸，借股價波動與媒體造勢操縱散戶情緒。", "指數急跌破1250點心理支撐位，三線股高開套牢追漲客，投機資金如短跑專家聞風即逃、群體躁動。", "午間營業部委託單紅藍各半、散戶心情矛盾，莊家決意急跌急漲把散戶洗一遍，令買者自喜賣者後悔。", "收盤前瘋狂拋壓連破1230、1220點，恐慌性拋盤湧現，主角在操控人心的盤算中日趨冷血、自我異化。"], "qa": [{"q": "主力為何把「砸盤」也當作一種策略？背後有什麼心理考量？", "a": "最近指數高位不破不跌，短線資金既無追漲熱情也無低吸激情；大幅下砸可吸引抄底資金，急跌後再漲對投資人心理鼓勵很大，如同給散戶吃定心丸，故砸盤實為心理戰術。"}, {"q": "主角認為眾多小投資人身上最普遍的規律是什麼？", "a": "他們大都沒有自己的方法與思路，卻普遍急功近利、特別崇尚短線交易，對所謂的短線絕招鑽研極多；這種群體心理弱點，正是大資金可以利用的破綻。"}, {"q": "為何「順應投資人的心理傾向」被主角視為成敗關鍵？", "a": "利用股價變動與媒體造勢影響小投資人的心理變化，是考驗操盤手的重要任務；大資金運作的成敗，繫於能否操控散戶的情緒與預期，故順應其心理是操盤核心。"}, {"q": "開盤後指數快速跌破1250點，說明了什麼心理現象？", "a": "1250點是散戶的心理支撐位置，跌破即動搖多頭信念；主力正是利用關鍵點位的心理定錨效應製造恐慌與賣壓，為砸盤計劃服務，錨點一破散戶便失去方向。"}, {"q": "為什麼說三線股是「非常浮躁的板塊」？它吸引了什麼人？", "a": "它時刻處於莫名的躁動之中，稍微有點陽光就能燦爛；投機資金喜歡追逐熱點，把愛投機的短跑專家集中在一起，稍有風吹草動便跑，故高開即套牢上午追漲的短線客。"}, {"q": "午間營業部委託單紅藍各半，說明散戶處於什麼狀態？主角由此生出什麼盤算？", "a": "買賣各半反映散戶心情極為矛盾。主角認為最好的走勢是把這些人都吃掉：急跌把籌碼交給想短線的人，急漲再接回低位籌碼，把散戶洗一遍，令買者沾沾自喜、賣者後悔不迭。"}, {"q": "下午指數跌至1230點附近，主力為何立即停止拋售？", "a": "此價位已是散戶的心理價位，再跌破就會打破他們的心理極限，極易引發大量拋盤；且統計顯示無人接盤也無人低價拋售，再砸已無意義，故停止交易改為小單買入。"}, {"q": "主力「不想大幅推高股價，只是維持小幅度上漲」的用意是什麼？", "a": "他只是維持價格小漲給大家一些安慰，既讓散戶安心持有，又不讓追高者獲利太多，更不願在高位接到籌碼，為下一輪砸盤清洗保留心理空間。"}, {"q": "收盤前最後15分鐘主力為何再次持續拋壓？結果如何？", "a": "周五收盤前參與者不多，繼續拉抬沒有意義；他以每筆800萬股持續賣出，指數連破1230、1220點，成交量放大，恐慌性拋盤開始出現，為低位吸籌制造機會。"}, {"q": "「進一步就是天堂，退一步就是地獄」反映了什麼市場心理狀態？", "a": "收盤時恐慌性拋盤出現而底部短線客也在增加，多空在關鍵位置膠著；散戶既怕踏空又怕套牢，方向未明之際進退兩難，正是主力刻意制造的心理僵持局面。"}], "quotes": ["顺应投资人的心理倾向，这对于大资金地运作来说是成败的关键，利用股价变动以及媒体造势，影响小投资人的心理变化也是考验一个操盘手的重要任务。", "砸盘也是一种策略。这样可以给所有投资人吃一颗定心丸，急跌之后再涨起来对投资人的心理鼓励还是很大的。", "一定要让短线买入的人沾沾自喜，卖出的人后悔不迭才行。", "股价跌到目前的位置是散户的心理价位，要是跌破就打破了他们的心理极限，这很容易引发大量的抛盘出现。", "这样的行情持续到收盘的时候，我看了会计送来的统计数据：持仓64%，gp18。看起来这个时候恐慌性的抛盘开始出现，但是，底部作短线的人也开始增加，这是一个进一步就是天堂，退一步就是地狱的位置。"], "psych": [{"p": "情緒操縱", "a": "顺应投资人的心理倾向，这对于大资金地运作来说是成败的关键，利用股价变动以及媒体造势，影响小投资人的心理变化", "n": "莊家借砸盤與造勢操控散戶情緒，把心理戰術當作操盤手的核心任務。"}, {"p": "心理支撐位", "a": "股价跌到目前的位置是散户的心理价位，要是跌破就打破了他们的心理极限", "n": "關鍵點位成為散戶的心理標尺，跌破即動搖信念、誘發賣壓。"}, {"p": "恐慌性拋售（恐懼）", "a": "看起来这个时候恐慌性的抛盘开始出现，但是，底部作短线的人也开始增加", "n": "連續砸盤製造的恐慌令散戶不計成本拋售，正落入莊家低位接籌的算計。"}, {"p": "追漲（貪婪）", "a": "上涨的跟风盘随交易时间地延续而逐渐下降。看起来人们追涨的激情在消退", "n": "散戶追漲熱情隨行情起伏被莊家反覆利用，成為其洗盤節奏的依據。"}]}, {"i": 115, "title": "第一百一十五回　夜宿水乡听蛙声", "kind": "hui", "summary": ["倉位下降印證思路正確，主角在忐忑中獲難得輕鬆。", "小馬籌辦管理制度研討會並安排每日媒體報道，主角放手交辦。", "周末恐懼症令職業操盤手休市即陷孤獨失落，人際疏離成常態。", "一行人遠離都市赴周庄水鄉，寧靜古鎮令主角深深感動留宿。", "夜宿溪邊涼台聽村長講古，蛙聲皓月勾起辛棄疾田園詞句。"], "qa": [{"q": "為何職業操盤手會患上「周末恐懼症」？", "a": "休市讓交易時間消失，擔憂反而增加，無所事事帶來失落；每到周末主角都情緒低落、倍感孤獨，可見他的精神寄托已完全繫於交易之上。"}, {"q": "主人公把「今天」的滿意歸因於什麼？這反映什麼心理？", "a": "他認為主要證實了思路的正確性，倉位下降不是大事；把順遂歸功於自身判斷而非運氣，正是自我服務偏差——成功歸己、化運為理。"}, {"q": "公司兩百多人他大多不認識、從不正視任何人，說明了什麼？", "a": "兩年來每天講話屈指可數，打招呼也只目不斜視地點頭；高壓職業令他自我封閉、與人群疏離，儼然孤獨的異化者。"}, {"q": "他為何堅決拒絕老胡去三亞散心的提議？", "a": "他自認「這邊還危險著」，怕萬一周一趕不回來「問題就不是一點點」；寧可近處相聚也不冒遠行之險，是長期高危環境下的過度警覺。"}, {"q": "小馬安排的贊助研討會，暗含什麼心理戰術？", "a": "借高級別機構研討會的名義，從開會到5月每日安排專業媒體報道；持續的輿論造勢足以塑造公眾預期，是典型的心理攻勢。"}, {"q": "即使放鬆時刻，主人公為何仍如此講究風險控制？", "a": "他連去哪兒都先定「晚上能回來就回來」，把休閒也納入風險管理；職業慣性使然，操盤手的思維已內化為處處防範萬一的模式。"}, {"q": "小馬請示的是什麼事情？主人公如何交辦？", "a": "一家級別較高的研究機構策劃管理制度研討會、尋找贊助商，議題正合公司所需；主人公自認不熟此行，放手讓小馬負責，只要達到效果即可。"}, {"q": "他們最終去了哪裡？那是一個怎樣的地方？", "a": "去了尚未被人知道的周庄：明清老建築、溪水穿鎮、吳儂軟語，寧靜恬淡；主角被寫滿滄桑的景致深深感動，決定留宿夜聽蛙聲。"}, {"q": "「牛車公務艙」是什麼？老胡為何討厭這個稱呼？", "a": "是老胡改裝的十七座麵包車，拆後座裝小桌改成八人麻將車；眾人如此稱呼是貶低他的勞動成果，誰當面叫，他都要辯論半天。"}, {"q": "夜宿水鄉時，他為何想起辛棄疾的詞？", "a": "蛙聲一片、小河靜流、皓月淒涼，與股市高壓形成巨大反差；觸景生情，田園詞句喚起他心底對寧靜生活的嚮往與鄉愁。"}], "quotes": ["最主要的是证实了一个思路的正确性，心情格外轻松。", "不交易的时间增加了太多的担忧，无所事事的感觉所带来的失落也是恐惧症的一个主要因素，每到周末的时候我都会情绪低落，感觉到非常的孤独。", "两年了我每天和大家讲的话屈指可数，也难为在这样的高压下大家能够如此默契地配合。", "无论在哪儿碰到有人打招呼，我都是目不斜视的点一下头，继续往前走。", "触景生情，忽然想起辛弃疾的：\"七八个星天外，两三点雨山前，稻花香里说丰年，听取蛙声一片。\""], "psych": [{"p": "孤獨與異化", "a": "每到周末的时候我都会情绪低落，感觉到非常的孤独。", "n": "休市時無所事事、情緒低落，職業操盤手的疏離感在周末集中爆發。"}, {"p": "自我服務偏差（吹噓）", "a": "最主要的是证实了一个思路的正确性，心情格外轻松。", "n": "把倉位順遂歸功於自身思路正確，正是將成功歸因於自己的傾向。"}, {"p": "情緒操縱", "a": "这次研讨会从明天就开始，一直持续到5月份，每天会安排专业媒体进行报道的。", "n": "借研討會與每日媒體報道持續造勢，是操控公眾預期的輿論手法。"}, {"p": "死亡焦慮", "a": "不怕一万就怕万一，那么远周一回不来，那问题就不是一点点了。", "n": "自認身處危險、怕遠行回不來，長期高危環境下的末日式警覺。"}]}, {"i": 116, "title": "第一百一十六回　水乡鼓乐涤尘心", "kind": "hui", "summary": ["主角返鄉靜思，首次聚會不言股票，少了查爾斯河畔的激情，多了成熟與冷靜。", "莊家輿論造勢：安排小馬赴北京策劃媒體宣傳，讓「需要的聲音」佔主流，操控大眾情緒。", "心理較量中莊家忌憚散戶覺醒：散戶優勢在跑得快，幸而他們一直不明白自己要什麼。", "指數錨定千點關口：1200點之上橫盤、1400點未破，主力無心做多、出逃意圖暴露。", "田園鼓樂滌心終難改本，主角自比不餓之狼望羊群：疏離與異化已成資本搏殺的代價。"], "qa": [{"q": "在主角眼中，散户对手有哪些优势？庄家为何庆幸他们不明白自己的处境？", "a": "主角認為對手雖是小資金卻與莊家智商相若，利益面前高度警覺，優勢是跑得快；他慶幸「感謝上帝他們一直不明白自己要什麼」，否則莊家難以取勝。"}, {"q": "针对监管制度规则的讨论，庄家如何借舆论造势影响大众？", "a": "山子提議利用市場監管制度規則的討論，主角回應已安排小馬赴北京策劃媒體宣傳，讓「需要的聲音」佔主流地位，以輿論引導大眾預期與情緒。"}, {"q": "主角如何借整数关口判断主力真实意图？", "a": "他以千點為心理錨：指數維持1200點之上、17號仍未觸及1400點、高點多為上影線，斷言若有大行情早破1500點，高位橫盤正暴露主力無心做多、準備出逃。"}, {"q": "马克在讲心理学时如何刻画散户的心态？", "a": "馬克說那些可憐的人「望著耀眼的金色，總是把自己幻想成那金色的主人」，因此從不覺得主人有何不對——散户用幻想與合理化扭曲了自己的真實處境。"}, {"q": "戴维的话揭示了散户怎样的致命弱点？", "a": "戴維稱若全世界小投資人都懂得靠防守取勝，所有機構都會斃命；說明散户的致命弱點是只攻不守、從不認識自身優勢，莊家方能存活至今。"}, {"q": "结尾「一匹不饿的狼」的比喻如何注解主角的心理异化？", "a": "主角自比不餓的狼遠望羊群，不撲殺並非善良而只是不餓；兩天田園鼓樂滌不盡塵心，返滬即重啟冷酷資本搏殺，孤獨與疏離已成他的底色。"}, {"q": "老胡和山子目前的仓位如何？他们对周一对倒有何考虑？", "a": "老胡倉位15%多一點，因預料周一对倒吸籌不易而多留籌碼；山子收盤前基本維持15%以下，配合盤中交易有增有減，兩人下周主導行情。"}, {"q": "主角的减仓目标与困难是什么？", "a": "主角專事減倉，力爭週五前把實際持倉從64%降到20%附近；因倉位過高，若成交量太小，整個出貨計劃恐怕還需延長。"}, {"q": "公差资
