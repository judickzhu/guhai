預期在傳播中自我實現，正是消息市的寫照。"}, {"hui": "第六十五回　哀乐涤心探虚实", "anchor": "在这个市场上没有任何东西比消息的流传速度更快，北京的一个小道消息要传到深圳要不了一小时", "note": "小道消息一小時傳遍兩地，散戶爭相轉述，謠言市裡預期自我實現。"}, {"hui": "第六十九回　股海孤眠听妄言", "anchor": "专家说减少新股发行额度消息一旦被证实，那么股票指数一定会一飞冲天，创出新高指日可待。", "note": "一條未證實的消息經節目放大，即成「一飛沖天」的預期，是信息瀑布與預期自我實現。"}, {"hui": "第七十六回　哀乐声中谋千点", "anchor": "明天早晨所有报纸都会看到同样内容的文章，主要的内容我都审核过了，基本上都是通稿。", "note": "同一通稿多管道同步投放，救市預期自我實現成信息瀑布。"}, {"hui": "第七十八回　谣传救市股海惊", "anchor": "原本计划收盘之后公开的信息，谁知道地方电视台中午有个股票栏目，主持人为了炫耀自己的先见之明，提前说了", "note": "救市消息經電視提前擴散，市場預期隨之自我實現，構成謠言市。"}, {"hui": "第八十二回　自拉自唱建仓难", "anchor": "既然管理层辟谣了，那么传言就不可能成为真的，因此，股市下跌还将继续进行。", "note": "媒體闢謠與專家背書構成信息瀑布，散戶預期被引導而自我實現。"}, {"hui": "第八十六回　弄堂独行闻雪崩", "anchor": "周一下午收盘之后在小媒体上开始吹风，三大主流媒体预约留出头版的位置。", "note": "小媒體吹風、主流媒體頭版、論壇直播層層放大消息，影響散戶預期。"}, {"hui": "第八十七回　地量收阳蓄深机", "anchor": "从地量地价的角度分析，大盘底部已经夯实，爆发行情一触即发。", "note": "莊家自導自演的股評輿論經電視放大，預期自我實現。"}, {"hui": "第八十八回　拉抬打压测浮沉", "anchor": "从平面媒体和电视媒体统一透露出来的底部信息传遍千家万户，这是我希望看到的局面", "note": "媒體統一口徑造勢，底部預期在散戶間逐級放大，莊家樂見其成。"}, {"hui": "第九十回　醉醒思亲对股潮", "anchor": "大早的报纸在主要位置含糊的报道一下，下午2点钟向媒体透露一些具体的内容", "note": "主角以救市傳言吊胃口、分批釋放訊息，讓預期自我實現，注解謠言市的信息瀑布。"}, {"hui": "第九十一回　股海焚香祈出货", "anchor": "我估计是一些消息灵通的人士得到信息了，开始入市抢盘。", "note": "消息先於事實傳播，收盤前搶盤印證預期的自我實現。"}, {"hui": "第九十八回　满城喊涨我独抛", "anchor": "撤出的单子占到报单总量不足30%，可见买入的人不仅仅是我们，这些资金也在推动行情了。", "note": "专家齐呼必涨形成信息瀑布，跟风资金自我实现，合力推动指数上行。"}, {"hui": "第一百零二回　股海危局谋砥柱", "anchor": "像现在这样上上下下的时候影响最大了。投资人都想知道下一步怎么办，所以就会关注媒体、专家的意见了。", "note": "波動市散戶求助媒體專家，消息層層轉述放大，預期自我實現。"}, {"hui": "第一百一十九回　阴线蓄势夜筹谋", "anchor": "我想如果有媒体的配合宣传，那么，事情就好办一些。计划好明天的交易，我想趁明天的机会，完成倒仓。", "note": "以通稿與民間股神造勢傳播預期，令看多消息自我實現，為倒倉鋪路。"}, {"hui": "第一百二十三回　股海狂潮夜运筹", "anchor": "下午收盘之后出消息，那么整整一天的交易都会笼罩在传言之中", "note": "新制度消息未公布先传开，传言支配次日交易，预期在传播中自我实现。"}, {"hui": "第一百二十四回　晴日股海暗潮生", "anchor": "这些人都在传说新制度的问题，说是今天要发布了。", "note": "一則傳言口耳相傳便推高指數，預期自我實現，主力再借勢拋售。"}, {"hui": "第一百二十五回　夜释私仇心自宽", "anchor": "整体上专家们的意思很明白，新规则有利于股市长期发展，从而奠定了中国股市长期的牛市格局。", "note": "利好言論經專家統一傳播，莊家盼開盤前加大力度，注解輿論造勢與預期自我實現。"}, {"hui": "第一百二十八回　一夕狂澜万家泪", "anchor": "今天的缺口属于突破性缺口，说明现在的牛市才刚刚进行了一半", "note": "莊家借媒體散播牛市論調，散戶跟風搶籌，預期自我實現而抬轎接貨。"}, {"hui": "附錄二：作者手札", "anchor": "但是，最主要的还是投资者的心理预期对股价变动影响巨大。", "note": "點明股價由投資者心理預期主導，預期自我實現正是訊息驅動市場的寫照。"}], "群體極化": [{"hui": "第一百二十二回　晴空股海千层浪", "anchor": "要是委托柜台那儿人站在人身上，保安拿个棍子乱打的时候，这是最出神入化的时候。", "note": "人群聚集後理智喪失、情緒互相點燃，極化到櫃台人踩人的地步。"}], "倖存者偏差": [{"hui": "第五十三回　卸甲收官看众生", "anchor": "你们看到过没有，春节前到现在哪一次不是这样的走势赚大钱", "note": "只記住賺錢的幾次而無視多數輸家，暴富敘事正是倖存者偏差的產物。"}, {"hui": "第六十八回　冲高回落山洪近", "anchor": "虽然胜率只有5％，但是人人都会以为自己就是那5％里边的", "note": "散户只见赢家、自认幸运儿，忽视绝大多数输家，遂在不知不觉中沦为穷光蛋。"}, {"hui": "第一百零四回　千金一诺转头空", "anchor": "股市涨得这么好，傻瓜拿住股票都会赚得一塌糊涂，还用得着什么操盘手啊", "note": "金主只看见牛市中赚钱的人，便认定傻瓜也能赚，无视多数散户亏损的真相。"}], "心理帳戶／開戶潮": [{"hui": "第十二回　萬人搶籌我獨清", "anchor": "新开户数增加了40％还多，短短的三个月时间居然这么厉害，看来股市确实涨了，涨得在家坐着的人都坐不住了。", "note": "新開戶激增四成、老人與外地客入市，注解開戶潮背後的群眾心理。"}, {"hui": "第十三回　跳空惊澜独醒时", "anchor": "参与交易的资金几乎全部是新开户资金", "note": "新資金蜂擁入市正是開戶潮信號，主角據此預警行情脆弱、隨時反轉。"}, {"hui": "第二十七回　酒吧夜話全民兵", "anchor": "在内地开户的人晚上排队等候开户，这是很危险的全民皆兵的时候", "note": "全民排隊開戶、新資金蜂擁入市，正是行情狂熱見頂的信號。"}, {"hui": "第五十七回　别却青苗入市寒", "anchor": "他们就是上次浙江的那些资金，托人找到领导的，希望能够得到帮助", "note": "自有資金與虧不起的錢分屬不同心理帳戶，主角拒絕為這筆資金操盤。"}], "攀比與暴富敘事": [{"hui": "第二回　股海滄桑見浮沉", "anchor": "那些人之所以那样在大街上打电话，是想显示自己的身份而已", "note": "大哥大成為身份象徵，街頭炫機正是暴富年代攀比與炫耀心理的寫照。"}, {"hui": "第十四回　股海虚火K线凉", "anchor": "豫园商城100元的发行价，短短几个月就狂涨到10000元的高价，这种暴富的事例时时刻刻在刺激着人们发财的神经", "note": "百元狂漲萬元的暴富傳說刺激發財神經，注解攀比與暴富敘事之力。"}, {"hui": "第二十七回　酒吧夜話全民兵", "anchor": "股市的暴富神话无时无刻不在刺激着每个参与股市投资的人们", "note": "暴富傳說撩撥浮躁人心，令人失去四平八穩生活的耐心。"}, {"hui": "第三十七回　独倚阳台望寒星", "anchor": "孩子的上学、家里的家用电器、老婆身上的衣服，光棍的媳妇，女孩子的嫁妆和化妆品等等，人们居然把这个市场当成了满足所有希望的地方", "note": "散戶把學費、嫁妝等人生願望盡數押注股市，暴富幻想驅使新資金蜂擁入市。"}, {"hui": "第五十八回　山村歸途念姐恩", "anchor": "他总是因为有我这样一个弟弟而自豪，经常跟别人提起：“我娃他舅本事大，在大城市工作。”", "note": "鄉人以城裏親戚為榮四處炫耀，攀比心理把城市身份當作成功的符號。"}], "孤獨與異化": [{"hui": "序", "anchor": "当我画完70年的数据之后，我已经开始学会了孤独、独立思考、沉静。我的性格也就是那个时候发生了改变", "note": "畫線訓練令主角走向孤獨沉靜，職業投資徹底改變其內在性格。"}, {"hui": "第一回　夢繞股海冬夜長", "anchor": "在这个酒店已经住了1年多了，每当看见大堂经理脸上那种职业的微笑，我就想冲上去狠狠地给上一拳", "note": "職業股民居無定所，連職業微笑都令其窒息，人際疏離感溢於言表。"}, {"hui": "第二回　股海滄桑見浮沉", "anchor": "我冷冷地听大家说话没有任何反应，我这时候也惊讶自己怎么就会无动于衷。", "note": "主角對老太太暈倒無動於衷，股市搏殺已把他異化成冷血旁觀者。"}, {"hui": "第三回　衡山夜半叉头声", "anchor": "看看表，已经凌晨2点了，上海就是繁华，2点钟的衡山路还是人来人往，估计这些人大都和我一样有心事吧。", "note": "深夜街头独行、两年长住酒店，他把心事投射给路人，职业投资人疏离孤独的心理写照。"}, {"hui": "第四回　股海冬深忆故牛", "anchor": "看着父亲伤心的样子，心里偷偷地乐，这下子父亲终于可以省心了。", "note": "至親傷慟入院，主角竟暗自慶幸，職業投機者對人情的冷漠與疏離畢現。"}, {"hui": "第五回　心战股海忆父恩", "anchor": "我努力地克制自己内心的恐惧，面无表情地说：“继续买进，加大买进的数量", "note": "职业要求他压抑情感、面无表情，投资生涯使主角與常人情感疏離。"}, {"hui": "第七回　除夕股海話歸程", "anchor": "这是他不愿意让我走的最大理由，绝对不是看在我父亲对他的笑脸上", "note": "主角被當成賺錢機器，價值僅繫於金錢，注解職業投資人的疏離。"}, {"hui": "第八回　雪夜归乡思股海", "anchor": "思绪再次游弋到节前的行情，确确实实我无法判断我的决策是否正确", "note": "歸鄉仍被股海牽絆、以謊言粉飾孤獨，職業投資人的疏離躍然紙上。"}, {"hui": "第九回　父子炉前忆股潮", "anchor": "面条做好了，我和父亲还像我小时候一样坐在一起，过我们只有两个人的年", "note": "縱橫股市的莊家年節僅餘父子二人，職業生涯換來的是孤獨與疏離。"}, {"hui": "第十回　煤油燈下話滄桑", "anchor": "这其中的原因我给父亲讲不清楚，也就不多讲了", "note": "职业投资人无法向至亲讲清自己的工作，精神世界日渐疏离。"}, {"hui": "第十一回　村口别父赴股海", "anchor": "我性格里边的那种叛逆精神，根本就不具备让我在这儿长久生存下去的可能", "note": "以叛逆性格註定漂泊為宿命，注解職業投資人式疏離與回不了家的異化。"}, {"hui": "第十二回　萬人搶籌我獨清", "anchor": "那个人回过头像看外星人一样看着我说：“你脑子有毛病啊？才涨了几天啊，就怕成这样子。”", "note": "獨醒的主角被狂熱大眾視為外星人，注解職業投資人的疏離與異化。"}, {"hui": "第十三回　跳空惊澜独醒时", "anchor": "由于在观点上的分歧，我几乎成了局外人", "note": "清醒的職業投資人在群體狂熱中與眾疏離，孤獨與異化油然而生。"}, {"hui": "第十四回　股海虚火K线凉", "anchor": "缺口、上影线、缩量、涨幅减少，我从这根K线上，看出了市场虚弱的迹象，为此我感到轻松的同时，也感到无比的苦闷", "note": "眾人狂熱中主角獨自看穿虛弱，輕鬆與苦悶並存，注解職業投資人的疏離。"}, {"hui": "第十六回　密谋托市夜深沉", "anchor": "我心里感到特别的苦，我想哭！我走过去，有人给我倒上酒", "note": "職業莊家與散戶隔著信息鴻溝，明知真相卻無人可說，愈懂市場愈感孤獨。"}, {"hui": "第十七回　夜设奇局梦白发", "anchor": "总是喜欢到没有人的地方走走，连我自己都开始怀疑，我的精神会不会出问题", "note": "职业投资者远离人群、自我怀疑，人被股市异化而日益孤独。"}, {"hui": "第十八回　殺手整裝佈陷阱", "anchor": "资金的搏杀并没有被看成是金钱的投资，而是一场厮杀", "note": "職業操盤手把資金搏殺視為廝殺，自我異化為戰場殺手，與普通人情感疏離。"}, {"hui": "第十九回　暗涌浙资夜梦惊", "anchor": "今天的成交量很大，晚上我不想跟任何人说话，心理潜意识有一种恐惧", "note": "職業庄家無人可訴、表裡不一，內心恐懼日漸異化。"}, {"hui": "第二十回　破千五布连环计", "anchor": "我不知道我是不是好人，我想要是有时间我一定要到海南的南山寺去祈祷，我不知道为什么？更不知道为谁！", "note": "操盘者屠杀散户后良心难安、无人亲近，连祈祷都说不清为谁，尽显职业投资者的疏离。"}, {"hui": "第二十一回　断珠惊魂沪上夜", "anchor": "我觉得自己在裂变，睡觉的时候穿睡衣，我不知道这是一种进步还是愚昧", "note": "主角被城市同化卻無法融入，睡前深感自己在裂變。"}, {"hui": "第二十二回　灯红酒绿夜筹谋", "anchor": "我觉得自己在裂变，睡觉的时候穿睡衣，我不知道这是一种进步还是愚昧，总之我一直被这个城市同化", "note": "職業投資人被都市同化卻無法融入，深夜獨行，顯露孤獨與自我異化。"}, {"hui": "第二十四回　驚魂周五急出倉", "anchor": "站在窗前，等待价格再上1400点的时候，我心潮起伏，心底升起一股莫名的烦恼，不知道该去对谁诉说", "note": "博弈中無人可訴的煩惱，暴露莊家內心深處的孤獨與職業異化。"}, {"hui": "第二十五回　黃昏出盡滿倉愁", "anchor": "我想人可能在感到孤独无助、对周围人或者事物都失去信任的时候，就很容易走进这儿寻求寄托", "note": "主角自認孤獨無助、對人失去信任，出貨後更覺空虛沉重，職業投資人的疏離畢現。"}, {"hui": "第二十九回　钟鸣惊梦停报单", "anchor": "就这样我在这个纯净的世界里净化我另外的灵魂", "note": "职业投资人独自赴寺洗涤心灵，道尽操盘生涯的孤寂与自我疏离。"}, {"hui": "第三十回　哀乐忆父股海愁", "anchor": "看着镜子里边那个陌生的我，就这样我越看越觉得自己很陌生", "note": "職業投資人自我疏離，鏡中自己竟覺陌生，內在已被股市異化。"}, {"hui": "第三十一回　夜听人言谋退路", "anchor": "说句实在话，自从这次杀入重围解救兄弟们以来我很少看电视，一门心思只是在想怎么操纵好参与市场的投资者的情绪，我们这样一个小小规模的市场在国民经济发展中占的比例实在太小，", "note": "職業操盤手與散戶世界徹底割裂，只算情緒操縱，自感孤陋寡聞而疏離。"}, {"hui": "第三十二回　冬晨股海起波澜", "anchor": "每当这个时候我就特别地感到我这个事业的神圣，更加感觉到高不可测，连我自己对自己都开始崇敬起来", "note": "幕後操盤與世隔絕，主角對自己產生異化的崇敬，職業投資人的疏離畢現。"}, {"hui": "第三十三回　笑看資潮逐浪高", "anchor": "我是一个站在旁边看的人，我并没有被烧死被燃尽", "note": "眼看他人將被燒盡而自認旁觀者，注解職業投資人的疏離異化。"}, {"hui": "第三十四回　春野爭田悟股場", "anchor": "我不愿意别人知道我的生活规律，所以不愿意要专门的人专门的车", "note": "職業操盤手隱藏生活規律、獨來獨往，透出被股市異化的疏離。"}, {"hui": "第三十六回　股海翻云出货忙", "anchor": "我不知道为什么总是在价格上涨的时候心情非常轻松，这对于一个职业操盘手来说是要不得的", "note": "主角以操盘手标准自我审查情绪，职业理性已异化为心理常态。"}, {"hui": "第三十七回　独倚阳台望寒星", "anchor": "我喜欢在夜里坐在阳台上看星星，我童年怎么就没有一点关于星星的想象？", "note": "職業投資人獨坐陽台望星、生日無人知曉，成功與罪疚並存，人在股市中日益疏離。"}, {"hui": "第三十八回　狼来三唤人犹醉", "anchor": "我感到自己有点蜕变，已经失去了农民的本色，不能干活了，我很伤心", "note": "职业投资生涯使主角与劳动世界疏离，身份失落带来内在异化。"}, {"hui": "第三十九回　诱多砸盘路不归", "anchor": "我每次听到这样的声音的时候简直是在接受一种刺激，一种心理、情感地刺激", "note": "主角對殘酷操盤生出心理快感，與散戶痛苦隔絕，職業投資人日益異化。"}, {"hui": "第四十一回　三震急抛哀乐眠", "anchor": "我只有在这种音乐的陶冶下才能入睡，才能每天保持清醒的头脑", "note": "操盤者唯有借哀樂入眠，職業生涯已使其與常人情感疏離。"}, {"hui": "第四十二回　红盘如饵钓浮沉", "anchor": "我几乎把自己生命的全部交给了这个市场，我总是担心一旦有一天这个市场忽然不存在了", "note": "主角把生命押給市場，自認接近失去人性，與自身愈發疏離。"}, {"hui": "第四十三回　哀乐低回股海长", "anchor": "我不能向任何人去诉说我的感受。", "note": "懺悔與痛苦只能深埋心底，體現職業投資人的疏離。"}, {"hui": "第四十四回　砸破千二誘眾生", "anchor": "我一直认为我是一个善良的人，但是在股市上的残忍连我自己都不认识自己了。", "note": "職業操盤手在血腥博弈中與善良自我漸行漸遠，完成異化。"}, {"hui": "第四十八回　静安寺前股海潮", "anchor": "我心中暗暗地得意，连整天在身边的人都难以想明白我想干什么", "note": "主角以無人能懂為榮，連身邊人也猜不透他，職業操盤的疏離盡顯。"}, {"hui": "第五十回　晴日高开暗出货", "anchor": "我闭上眼睛，想象着营业部那些疯狂的人们", "note": "主角以旁观者姿态审视人群，职业操盘手的疏离感跃然纸上。"}, {"hui": "第五十一回　哀乐声中别股海", "anchor": "明天我想利用休息的时间到海边去走走，不想见任何人了，我需要休息也需要放松。", "note": "操盘得胜后谢绝一切应酬独赴海滨，职业投资人的疏离与孤寂尽显。"}, {"hui": "第五十二回　海畔觀潮識盈虛", "anchor": "每次资金运作完了，我都会像逃一样离开工作的地方，我讨厌股票，讨厌那样每天没有人性的工作。", "note": "職業操盤手厭惡工作、逃離職場，正是職業投資人疏離與孤獨的寫照。"}, {"hui": "第五十三回　卸甲收官看众生", "anchor": "下午开盘以后，我就像一个散户一样，站在交易大厅里，别人看大盘我看别人。", "note": "職業莊家與散戶群體隔絕，冷眼旁觀人性，正是投資人的孤獨與異化。"}, {"hui": "第五十四回　口脂书血记归期", "anchor": "我说：“没有什么废品，我感觉我自己就是个废品。”", "note": "职业投资人自贬为废品、谎称杀猪者，注解其身份疏离与精神孤独。"}, {"hui": "第五十五回　独饮还乡步夜山", "anchor": "昨天晚上，巨大的孤独和寂寞让我根本无法平静，我一口气喝下去一瓶五粮液", "note": "職業投資人獨飲買醉、滿牆亂寫，都市股市生活已讓他與自己嚴重疏離。"}, {"hui": "第五十六回　山道夜話憶童年", "anchor": "两个儿时的同伴就坐在我们小时候一起走过的这条山道上，聊起了我们小时候念书的快乐时光。", "note": "主角独行夜路追忆童年，借旧友旧事寻回温暖，反衬成人世界的孤寂疏离。"}, {"hui": "第五十七回　别却青苗入市寒", "anchor": "我现在离开了黄土地在干什么，我不知道我是在毁灭还是创造", "note": "職業投資人離開土地與傳統生活，對自身意義產生疏離與自我懷疑。"}, {"hui": "第五十八回　山村歸途念姐恩", "anchor": "这时候的我也很难受，但是我没有流露出一点伤心的情绪", "note": "主角強忍離愁不露情緒，見歷經城市與股市磨礪後情感收斂、與家鄉日漸疏離的內在異化。"}, {"hui": "第五十九回　村口望断慈父影", "anchor": "在未来的日子里只有父亲一个人孤单单地在这个窑洞里生活", "note": "事業與親情兩端，父親陷於孤獨守望，主角亦與家漸行漸遠，雙向異化。"}, {"hui": "第六十回　黄浦江畔夜布局", "anchor": "我不能失去这个能够让我舒展自己人性的战场。", "note": "職業投資人只在戰場中舒展人性，日常生活已然異化疏離。"}, {"hui": "第六十二回　股海翻雲夜獨行", "anchor": "这时候我忽然感觉到很孤独，我几乎没有什么朋友，除过行业内的那几个兄弟，也只能算是战友了", "note": "能操控萬千情緒的莊家自身卻無友可訴，職業使人與人、與己雙重疏離。"}, {"hui": "第六十三回　月临黄浦夜藏锋", "anchor": "会不会也有一个人就这样孤零零地在人潮涌动的大上海，看着这弯月亮在思考⋯⋯", "note": "主角在人潮萬千中自感孤零零，職業投資人的疏離感在月下獨白中顯露。"}, {"hui": "第六十五回　哀乐涤心探虚实", "anchor": "每天的高压工作，孤独、寂寞、烦恼等等不健康的情绪每天伴随着我", "note": "職業投資人在高壓孤獨中以哀樂為伴，內心與常人日漸疏離。"}, {"hui": "第六十六回　股海沉浮一碗麵", "anchor": "我经常一个人到那儿去吃，单位上大部分是上海人，一些年轻一点的北方人也被同化", "note": "盛宴與同化氛圍中格格不入、獨自覓食，職業投資人的孤獨疏離躍然紙上。"}, {"hui": "第六十七回　夜宴谋成独怅然", "anchor": "我们这个群体基本上是和社会隔离起来的一个群体，很少和圈子以外的人接触，别人也很难进入这个圈子，这是一个很孤独的群体", "note": "操盤群體與社會隔離、外人難入，主角的孤獨正是職業投資人異化的寫照。"}, {"hui": "第六十九回　股海孤眠听妄言", "anchor": "作为一个职业投资人，不交易的时候是最孤独的时候，长时间的孤独和沉默，使一个本来正常的人，渐渐地失去了和人交往的能力", "note": "職業投資人的長年孤獨與沉默，使他失去與人交往的能力，淪為生活的旁觀者。"}, {"hui": "第七十回　酒醒麻局悟股机", "anchor": "越是喧嚣吵闹的地方，越能让人感觉到深深的孤独，这种孤独是发自灵魂深处的那种", "note": "操盤者靠酗酒與狂歡麻醉自己，職業投資人的疏離在喧囂中反而更重。"}, {"hui": "第七十二回　申江夜筹护千点", "anchor": "下午酒吧很冷清，就我一个人，我告诉老板娘从现在开始一直到晚上8点，我要用这个地方", "note": "主角獨自包場密謀護盤，職業莊家深陷孤獨與疏離。"}, {"hui": "第七十五回　静安寺前泪染襟", "anchor": "回到酒店之后，心里特别空虚，看着镜子里的我，西装革履，领带扎得紧紧的", "note": "投機生涯令主角自我厭棄、空虛孤獨，領帶如蛇象徵其被都市職業生活異化。"}, {"hui": "第七十六回　哀乐声中谋千点", "anchor": "我找不到自己灵魂的所在，没有了心的归宿。", "note": "操盤者獨坐暗室聽哀樂，職業投資的孤獨令其異化。"}, {"hui": "第七十七回　双阴如碑血未干", "anchor": "我想哭、想笑，我不知所以然。但是我还是冷静地站着，当作什么事情都没有发生。我诧异我为何如此冷漠？", "note": "主角壓抑吶喊與眼淚裝作若無其事，對自己的冷漠感到陌生，職業殺伐令其異化。"}, {"hui": "第七十八回　谣传救市股海惊", "anchor": "毫无目的在大街上转，我想找一个人诉说，我想告诉他我的苦衷，也想告诉他我的欢乐。", "note": "操盤手在博弈後深陷孤獨，想傾訴而無人可說，顯露職業異化。"}, {"hui": "第七十九回　洗盘建仓雨转晴", "anchor": "从事资本投资这个行业太久，我渐渐失去了一个正常人应该有的情感体验", "note": "主角自覺理性吞噬感性，職業生涯把他異化成失去情感體驗的博弈機器。"}, {"hui": "第八十回　夜雨江湖谋冷暖", "anchor": "两年的时光就这样机械地执行指令，高压下失去了一个原本属于小姑娘应有的欢乐和笑容", "note": "高壓機械的操盤生涯吞噬小麗的青春笑容，職業投資人漸被異化。"}, {"hui": "第八十一回　股评喧嚣人独醒", "anchor": "就这样一生非常孤独地面对这样的曲线走势？人生的意义到底在哪儿？", "note": "主角自认一生孤独面对K线，职业投资人的疏离与意义迷失跃然纸上。"}, {"hui": "第八十二回　自拉自唱建仓难", "anchor": "真是莫名其妙，坐了不到200米的出租车马上又下来，要到哪儿去自己也不知道，难怪人家担心。", "note": "操盤失敗後的茫然與疏離，職業投資人與日常世界徹底斷裂。"}, {"hui": "第八十三回　温水煮蛙破僵局", "anchor": "他刚才说早上好？他没事吧今天？！", "note": "一句尋常問好令同事驚詫，反襯職業操盤手長期離群的異化狀態。"}, {"hui": "第八十四回　静水藏锋守盘局", "anchor": "品茶这东西至少需要两个人，一个人品茶越品越孤独，我深有体会。", "note": "職業投資人離群索居，心思全繫交易，愈熱鬧愈孤獨。"}, {"hui": "第八十五回　万骨功成独怅然", "anchor": "留下的只有你自己孤零零一个人的时候，那种茫然若失的感觉让人消沉许久", "note": "股市生涯令主角習慣孤身，知己離去後只剩茫然若失。"}, {"hui": "第八十六回　弄堂独行闻雪崩", "anchor": "走在这繁华的都市里，内心特别的孤独，小张的决定让我再次感受到资本市场的孤独不是每个人都能承受的。", "note": "市井喧鬧與內在孤寂對照，職業操盤手的疏離異化躍然紙上。"}, {"hui": "第八十八回　拉抬打压测浮沉", "anchor": "我心里很难过，这几天整夜睡不着觉，还没有深入就选择了退出", "note": "小張失眠欲逃離股海，投資人的疲憊與疏離盡顯。"}, {"hui": "第八十九回　孤影临江谋决战", "anchor": "每到周五我都有一种莫名其妙的恐惧，这似乎成了一种职业病，没有太多的社交活动，也不愿意交朋友", "note": "工作充實、休息成折磨，職業投資人已與常態生活徹底疏離。"}, {"hui": "第九十回　醉醒思亲对股潮", "anchor": "他现在在大山深处而我却在繁华的都市五星级酒店发呆", "note": "贏得市場卻疏離親情與人群，注解職業操盤手的孤獨與異化。"}, {"hui": "第九十二回　蛇夢縈心股海狂", "anchor": "我把所有的灯都打开，在屋子里走来走去，我不知道自己要做什么，心里感觉空荡荡的", "note": "職業投資人深夜如困獸般徘徊，借哀樂與烈酒麻醉自己，與自我漸行漸遠。"}, {"hui": "第九十三回　人氣如潮人將散", "anchor": "我和他们这些人似乎永远没有共同语言，爱好兴趣都不在一条线上", "note": "勝利之後主角與人群格格不入，職業投資人的疏離與內在異化躍然紙上。"}, {"hui": "第九十四回　砸盘洗筹隐忧长", "anchor": "仿佛每一组数据后面都有无数双眼睛在盯着我看，我闭上眼睛，脑子里跟过电影一样", "note": "主角眼中散戶只是數據後的群像，職業生涯使他與人性日益疏離。"}, {"hui": "第九十五回　惊涛股海孤舟撑", "anchor": "收盘了，我从来没有今天这样如此地孤独，要是不加仓就此放弃的话，最多亏损10%就能全部出来", "note": "收市後莊家無人可分擔重壓，贏了數字卻輸了自我，孤獨撲面而來。"}, {"hui": "第九十七回　独斟哀乐夜未央", "anchor": "现在的我和那个时候的我有什么区别呢？只不过是蹲的地方不一样", "note": "职业投资人独处酒店借酒浇愁，环境虽异，孤独恐惧却与童年一样，呈现被博弈异化的疏离。"}, {"hui": "第一百回　冷雨操盘杀机藏", "anchor": "我生活的全部就是一条曲线，这是悲哀还是成就，真的无法评述", "note": "職業投資人的世界只剩一條K線，主角在孤獨中迷失自我、心生迷茫。"}, {"hui": "第一百零五回　蓝筹初兴股海波", "anchor": "剩下我一个人在这儿享受孤独", "note": "众叛亲离的算计生活令主角疏离于世，职业投机者的孤独是内在异化的写照。"}, {"hui": "第一百零六回　雪崩驚魂鎖局深", "anchor": "我需要孤独的环境保证让自己心情平静下来，司机送我回酒店。", "note": "職業操盤手束縛心與情感，贏了博弈卻在孤獨中自處，是主角的異化。"}, {"hui": "第一百零七回　噩梦惊魂筹大计", "anchor": "我在一个小山包上走，看到下面有一些人和骆驼在走，我想下去可是我找不到下去的路，我大声地呐喊，他们似乎听不见我的声音。远远的", "note": "噩夢中無人應答、孤獨奔逃，映照職業莊家與世隔絕的精神疏離。"}, {"hui": "第一百零九回　夜阑把盏话浮沉", "anchor": "我便一个人坐在窗前，看着外面的天空，努力地想理顺思路。", "note": "聚饮独坐、行路无言，职业操盘手的孤獨與疏離溢於言表。"}, {"hui": "第一百一十二回　夜读红楼悟机心", "anchor": "真想有个人一起说说话，说什么都行，可是，实在没有人能和我说话", "note": "高位重仓、无人可诉，主角在算计中日益孤立，注解职业投资者的疏离异化。"}, {"hui": "第一百一十五回　夜宿水乡听蛙声", "anchor": "每到周末的时候我都会情绪低落，感觉到非常的孤独。", "note": "休市時無所事事、情緒低落，職業操盤手的疏離感在周末集中爆發。"}, {"hui": "第一百一十六回　水乡鼓乐涤尘心", "anchor": "我明白两天的田园生活不会改变我，正如一匹不饿的狼远远地看着羊群不是因为善良，而仅仅是因为不饿！", "note": "田園淨土滌不盡資本心性，職業投資人的疏離與冷漠畢現。"}, {"hui": "第一百一十七回　阴线高悬引狂潮", "anchor": "看看大家的神态和老板娘热情的向我伸出她还带着油水的手，我生怕她抓住我的手或者我的衣服急忙说", "note": "操盤手與人群格格不入，連同事聚餐都急於抽身，博弈生涯使人際日漸疏離。"}, {"hui": "第一百一十九回　阴线蓄势夜筹谋", "anchor": "我看着k线在沉思，思考自己的交易行为有没有需要检讨的地方，思考投资大众的心理思维。", "note": "主角獨處畫線、只研究大眾心理，對婚戀家常漠然，已成冷眼操盤的異化者。"}, {"hui": "第一百二十二回　晴空股海千层浪", "anchor": "我怀着惴惴不安的心情在附近的包子店买了2笼包子，一碗小馄饨，简单地吃了午饭就赶回公司。", "note": "眾人狂歡之際操縱者獨自吃飯、心事重重，職業投資人的疏離感盡顯。"}, {"hui": "第一百二十七回　哀乐声中收巨阳", "anchor": "我一路闭着眼睛听着哀乐，此时此刻，在所有股民都疯狂的时候，我必须有足够的冷静和理智", "note": "全民狂熱之際主角以哀樂隔離自我，職業操盤者的孤獨與異化盡現。"}, {"hui": "第一百三十回　泪别沪上熊途遥", "anchor": "离开上海的时候，我没有给任何人打招呼，在酒店给小张留了一封信", "note": "職業投資人離場無人送別，只留一信，疏離感盡顯於無聲告別。"}, {"hui": "附錄四：《股道》目錄", "anchor": "尽可能地远离股票投资大众", "note": "主張遠離大眾獨立思考，注解職業投資者疏離人群的異化狀態。"}], "道德衝突／罪疚感": [{"hui": "第十回　煤油燈下話滄桑", "anchor": "父亲越听越糊涂，但是在他心里总是认为这不是好事情，何况这个事情是从国外来的。", "note": "父亲的质朴道德质问，使主角的职业成为一场良心的拷问。"}, {"hui": "第十一回　村口别父赴股海", "anchor": "这个时候的我总是非常地恨自己：“我要是没有念书该多好，我就可以在家了，最起码能和父亲在一起过一个完整的年。", "note": "無法陪伴年邁父親的自責與罪疚，是主角內心道德衝突的呈現。"}, {"hui": "第十六回　密谋托市夜深沉", "anchor": "我不知道为什么从上次看到那个人自杀以后，我一直有一种深深的罪孽感", "note": "莊家的良心拷問：每次計畫都拿散戶的血淚做代價，罪孽感壓過了勝利的快感。"}, {"hui": "第十七回　夜设奇局梦白发", "anchor": "梦里我再次梦见我在营业部经常看到的那个可怜的白发苍苍的、炒股的老大娘！我梦见她在哭", "note": "建仓前的良心不安化作老大娘之哭，庄家的罪疚无处安放。"}, {"hui": "第二十七回　酒吧夜話全民兵", "anchor": "大家说得开心，但是没有人能够在心里感到内疚，我不知道为什么在最近一年里，这种内疚越来越深", "note": "莊家在眾人狂歡中獨自內疚，良心拷問隨行情愈演愈烈。"}, {"hui": "第二十九回　钟鸣惊梦停报单", "anchor": "我这样的做法在神明眼里应该是作孽，所以神明肯定不会帮我的", "note": "庄家自认操纵股价是作孽、神明必不庇护，良心拷问尽在其中。"}, {"hui": "第三十五回　卅点低开梦碎时", "anchor": "我知道这时候的我已经没有什么良心或者道德的观念", "note": "主角自認喪失良心道德，正是莊家良心底線崩潰的自我剖白。"}, {"hui": "第三十七回　独倚阳台望寒星", "anchor": "我知道这将使一大批人的终身所得化为乌有，看着电视上呼呼闪闪的画面，我不想知道上面在演什么，我陷入深深地自责当中", "note": "莊家明知出貨將毀人積蓄，卻不願看電視畫面，良心在逃避與自責間備受煎熬。"}, {"hui": "第四十三回　哀乐低回股海长", "anchor": "也正是我一次次毁灭了他们的所有梦想和希望，我忏悔。", "note": "主角全身而退即陷深深自責，注解莊家的良心拷問。"}, {"hui": "第四十五回　千点疯涨血雨腥", "anchor": "一个一辈子都不能偿还的感情债，精神上将会一辈子接受灵魂的拷问", "note": "庄家预见小姑娘将因崩盘背负终身罪疚，也暴露自身的良心拷问。"}, {"hui": "第四十六回　血雨腥风葬股魂", "anchor": "我对自己这样的成功并不感到高兴，只有深深地自责。", "note": "莊家的良心在血洗散戶後受拷問，成功與罪疚同時壓身。"}, {"hui": "第四十七回　哀曲繞梁夜謀深", "anchor": "我们这样做虽然少，但是使自己的心里平衡而已。", "note": "莊家以捐款撫慰良心，罪疚感與道德衝突貫穿全章。"}, {"hui": "第四十九回　破千四陽線如刀", "anchor": "我想这时候人们已经疯了，已经失去理智了，我不知道那个可怜的老阿婆把自己赚钱的股票卖掉没有？", "note": "操盤者明知散戶將高位接盤，仍記掛老阿婆，良心備受拷問。"}, {"hui": "第五十二回　海畔觀潮識盈虛", "anchor": "无论是杀人还是掠夺别人的财富，都是丑陋的把美好的事物给毁掉了。因此我觉得不应该兴奋才是对的", "note": "主角以殺手自比，掠奪散戶財富的罪疚令其低落，注解莊家的良心拷問。"}, {"hui": "第五十五回　独饮还乡步夜山", "anchor": "去你妈的，什么警署，你不好好的去抓坏人，找我干什么？老子绝对良民，祖上三代都是穷光蛋！！！", "note": "聞警即怒、急證三代貧農出身，隱約透出對自身財富來路的罪疚與不安。"}, {"hui": "第五十九回　村口望断慈父影", "anchor": "我恨我自己不是东西，把父亲一个人扔在这个破窑洞里，无依无靠", "note": "事業與盡孝的拉扯令主角反覆自責，以強烈罪疚清算對父親的虧欠。"}, {"hui": "第七十一回　鹤颈折时千点寒", "anchor": "不知道是不是罪孽，但是这是我的工作，我必须赚钱，矛盾的心态一直让人感到非常焦虑", "note": "庄家在零和博弈中良心受拷问，罪孽之问如蛇噬魂，焦虑成了职业病。"}, {"hui": "第七十四回　千点失守老妪惊", "anchor": "大家也不会知道是我逼大家倾家荡产，我所能做的就是每次资金运作结束之后，建议公司多发奖金。", "note": "操盤手在職業冷酷與良心不安之間，以發獎金自我補償。"}, {"hui": "第七十七回　双阴如碑血未干", "anchor": "今日硬是被活生生的现实让我痛苦地领教，而且，这血有可能是因我而流。", "note": "阿婆之死讓主角良心受拷問，莊家的道德罪疚與資本邏輯激烈交戰。"}, {"hui": "第八十九回　孤影临江谋决战", "anchor": "我们实际上不算什么，就是有钱有权的人养的一条狗，我们的工作就是责任和义务", "note": "以自我貶抑緩解貪得無厭的罪疚，莊家良心的自我拷問。"}, {"hui": "第九十一回　股海焚香祈出货", "anchor": "我忽然有一种深深的负罪感，我想我要上一炷香，为自己的行为请求神的谅解。", "note": "莊家首次刻骨銘心的良心拷問，靠焚香求恕仍難自安。"}, {"hui": "第一百零三回　豪饮释嫌谋退兵", "anchor": "可是，要做成我这样子，有多大的成就都骄傲不起来，因为我曾经背弃过大家", "note": "操盤手因背棄同伴而驕傲不起來，是莊家良心的拷問。"}, {"hui": "第一百零四回　千金一诺转头空", "anchor": "看现在的样子我会很轻松的按照自己的方法去处理问题，而不必担忧良心地谴责和不安等等", "note": "对方失信反令主角卸下分钱的良心包袱，庄家内心的道德冲突由此浮现。"}, {"hui": "第一百二十回　雨中哀乐倒仓时", "anchor": "虽然，不是为了我自己，也不会伤害公司的利益，但是这样还是不符合职业道德的", "note": "主角深夜失眠，莊家良心在利益與職業道德間遭受拷問。"}, {"hui": "第一百二十三回　股海狂潮夜运筹", "anchor": "干掉这些人的资金不需要太多的内疚，因为能在股市上投资数十万的人，亏损完了不会影响生活。", "note": "庄家以「亏完不影响生活」自我开脱，用合理化消解杀伐操盘的罪疚。"}, {"hui": "第一百二十五回　夜释私仇心自宽", "anchor": "这毕竟属于私仇，如果不顾一切这样做的话，好像有失君子风范。", "note": "復仇誘惑與良心拷問交戰，主角以君子風範自持，最終放下私仇。"}, {"hui": "第一百二十八回　一夕狂澜万家泪", "anchor": "每次到这个时候我都是心情极为低落，失落和忏悔深深地折磨着我的灵魂", "note": "收割萬家積蓄後，莊家深陷罪疚，哀樂與自傷皆無法平息靈魂的拷問。"}], "死亡焦慮": [{"hui": "第一回　夢繞股海冬夜長", "anchor": "报纸上的消息让我很苦恼，说是有个人炒股赔钱以后自杀了，我不知道我会不会也去自杀", "note": "同業自殺新聞直擊其生死恐懼，股海沉浮牽動末日感。"}, {"hui": "第八回　雪夜归乡思股海", "anchor": "父亲那时候最担心的就是怕我不能长大，因此，在这方面他总是显得很虔诚", "note": "篝火避邪的虔誠儀式，折射出父親對孩子無法長大的死亡焦慮。"}, {"hui": "第十一回　村口别父赴股海", "anchor": "你要好好照顾你自己，你现在这么大岁数，就不要再干活了。", "note": "叮嚀父親「歲數大、別再幹活」，流露對父親衰老與離別無常的隱憂。"}, {"hui": "第十八回　殺手整裝佈陷阱", "anchor": "几十亿的资金要是有10％的闪失，枪毙我100次不是什么大问题", "note": "背負數十億資金，操盤手把「閃失」等同於「槍斃」，失控即死的焦慮無處不在。"}, {"hui": "第三十回　哀乐忆父股海愁", "anchor": "我最喜欢听的音乐就是哀乐，我从那个乐曲里听不到恐惧，我听到了生命的可贵", "note": "以哀樂直面死亡焦慮，反從中確認自己還活著而得到安慰。"}, {"hui": "第四十六回　血雨腥风葬股魂", "anchor": "晚上我不打算去喝咖啡了，我想一个人静静地聆听哀乐，为那些今天葬送了炒股生涯的人们哀悼。", "note": "哀樂、跳樓與「葬送」之語，把股市博弈推到生死與末日的高度。"}, {"hui": "第四十七回　哀曲繞梁夜謀深", "anchor": "一曲哀怨的《天堂之约》在整个夜的空间游荡", "note": "哀樂縈迴與天堂幻想，折射莊家對死亡與罪孽的焦慮。"}, {"hui": "第五十四回　口脂书血记归期", "anchor": "看着这血红的字，我感觉那就是血，我忽然像疯了一样", "note": "血红字迹如血、疯狂书写归期，注解崩溃边缘的末日感与死亡焦虑。"}, {"hui": "第五十五回　独饮还乡步夜山", "anchor": "酒店总是怕在自己单位忽然睡死一个人，那谁还敢来这儿住", "note": "一句「我不行了」被當真即驚動警署酒店，折射都市交易關係中對死亡的恐懼。"}, {"hui": "第五十九回　村口望断慈父影", "anchor": "我不敢看父亲颤巍巍的身影，更不敢看父亲满脸期待的眼神", "note": "父親衰老的身影與期待眼神，喚起主角對歲月與喪失的隱隱恐懼。"}, {"hui": "第六十一回　暗燈哀樂布虛實", "anchor": "一杯酒、一盏暗色的灯，整个空气里弥漫着哀乐⋯⋯", "note": "哀樂暗燈如葬禮，股市成了生死場，注解操盤手的末日焦慮。"}, {"hui": "第六十五回　哀乐涤心探虚实", "anchor": "打开哀乐，倒了一杯酒，闭上眼睛头脑空荡荡的，哀乐对生命的赞美我觉得是任何音乐都不能比拟的", "note": "以哀樂淨化靈魂、在生死樂章中求冷靜，透出濃重的末日感與死亡焦慮。"}, {"hui": "第九十二回　蛇夢縈心股海狂", "anchor": "打开哀乐，我强迫自己去听，一遍又一遍地听，渐渐地我平静了下来", "note": "哀樂安神、蛇群噩夢與撥不出的報警電話，都是末日感與生死焦慮的潛意識流露。"}, {"hui": "第九十七回　独斟哀乐夜未央", "anchor": "我打开哀乐把声音放到最低，提着酒瓶我蹲在阳台门口的沙发旁边，把自己全身蜷缩起来", "note": "哀乐与蜷缩姿态暗合末日感，主角在劫难将临前以死亡意象宣泄压抑。"}, {"hui": "第一百一十五回　夜宿水乡听蛙声", "anchor": "不怕一万就怕万一，那么远周一回不来，那问题就不是一点点了。", "note": "自認身處危險、怕遠行回不來，長期高危環境下的末日式警覺。"}, {"hui": "第一百二十回　雨中哀乐倒仓时", "anchor": "司机打开哀乐之后启动车子，车子在雨中穿行，这样的天气配上这样的的音乐，一切都显得异乎寻常地沉重", "note": "哀樂與暴雨將倒倉行動渲染出末日般的沉重壓抑感。"}, {"hui": "第一百二十九回　股海雪崩钟摆停", "anchor": "关闭所有的灯，打开哀乐我为自己的灵魂默哀，更为即将发生的股价雪崩默哀", "note": "哀樂與默哀是主角對自我與大眾的雙重死亡預演，雪崩前夜的儀式感盡顯焦慮。"}, {"hui": "第一百三十回　泪别沪上熊途遥", "anchor": "坐在飞往北京的飞机上，我头靠在椅背上，闭着眼睛，我的眼泪不由自主地流了下来", "note": "主角以淚祭奠逝去的牛市，離場如訣別，透出末日般的哀慟。"}], "心理支撐位": [{"hui": "第九回　父子炉前忆股潮", "anchor": "股票价格突破460点以后，整个行情发生了根本性的逆转", "note": "460點成為關鍵點位，突破後行情逆轉，顯示點位對群體心理的定錨作用。"}, {"hui": "第二十三回　晨筹低吸午砸盘", "anchor": "价格已经开始回升了，而且跟盘还是比较踊跃的，gp现在还是6，你放心吧", "note": "六元是市場心理防線，守住關鍵價位方能維持跟盤信心。"}, {"hui": "第三十三回　笑看資潮逐浪高", "anchor": "虽然少，这对这些不懂股市的人来说就是希望，有这几个点他们就不会对行情产生绝望", "note": "收盤微漲數點成為追高者的心理支撐，使其不至絕望而安心持倉。"}, {"hui": "第三十六回　股海翻云出货忙", "anchor": "在上午临收盘前价格只是在昨天收盘价的基础上摸了一下就下去了", "note": "昨日收盘价成为心理参照，庄家刻意压制不让散户解套获利。"}, {"hui": "第三十九回　诱多砸盘路不归", "anchor": "开盘也就是半小时的时间，价格在低开近50点的基础上迅速冲上1500点", "note": "快速拉回1500點整數關口，令散戶深信跌不下去，心理支撐淪為誘多道具。"}, {"hui": "第四十四回　砸破千二誘眾生", "anchor": "我大概计算了一下，这样地抛售30分钟之内一定会打破1200点的。", "note": "千二整數關口是散戶的心理支撐，擊破即擊潰眾人信心。"}, {"hui": "第四十八回　静安寺前股海潮", "anchor": "大盘指数开始从1350点的位置开始回落到1300点左右", "note": "1300點整數關口成為心理支撐位，指數一逼近即被莊家迅速拉回。"}, {"hui": "第四十九回　破千四陽線如刀", "anchor": "指数在没有人护理的情况下一直维持到收盘前的40分钟左右，开始往下走，最高冲到1420多点，当指数向下触及1400点的时候，我没有理睬，在跌破1400点以后，我开始介入，在收盘前我重新把指数推上1400点，收盘价格在人们的眼中看起来是非常地完美。", "note": "主力刻意護住1400點關鍵位，令收盤形態完美，以維繫散戶信心。"}, {"hui": "第五十回　晴日高开暗出货", "anchor": "但是我知道现在这个位置是赚钱的散户愿意抛售的点位", "note": "庄家利用散户获利兑现的心理定势，在关键点位完成低吸。"}, {"hui": "第五十三回　卸甲收官看众生", "anchor": "等到接近1300整数关的时候他再次吩咐报单员抛出，频率价格幅度都是恰到好处", "note": "莊家利用千三整數關作心理支撐位，控制拋售節奏，正是心理戰術的運用。"}, {"hui": "第七十一回　鹤颈折时千点寒", "anchor": "看起来1100点被小投资人当作心理底价了。", "note": "1100点本是心理而非技术概念，被散户定锚后反成庄家试盘与利用的参照。"}, {"hui": "第七十四回　千点失守老妪惊", "anchor": "50%是一个心理的支撑位置，60%则是崩溃的边缘，计划的第一步已经成功了。", "note": "莊家精準利用跌幅心理關卡，引爆散戶集體崩潰。"}, {"hui": "第八十三回　温水煮蛙破僵局", "anchor": "收盘控制在最低价附近，但是不要创新低即可。", "note": "精準運用昨日低點與收盤價等心理關口，施壓卻不擊潰信心。"}, {"hui": "第八十九回　孤影临江谋决战", "anchor": "最终我想利用利好信息把大盘推到1300点之上全部清仓", "note": "整數關口是散戶的心理錨點，推上1300點誘多接盤、趁機清倉。"}, {"hui": "第一百零五回　蓝筹初兴股海波", "anchor": "指数开始快速下跌，迅速由红变绿而且砸破1200点，市场的恐慌气氛被激发", "note": "1200点整数关口一旦被砸破便引爆群体恐慌，关键点位成了情绪开关。"}, {"hui": "第一百零八回　红房夜宴谋推涨", "anchor": "直至1210点附近，这是一个关键的心理支撑位置，不能再继续砸盘了，再砸下去自己就倒霉了。", "note": "庄家砸盘也止步于关键点位，说明整数关口对操盘节奏具有心理定锚作用。"}, {"hui": "第一百一十三回　浴读红楼悟杀机", "anchor": "从最初的1000点起步到最高的1350点附近，回调下去到1200点，重新起涨这才是有大行情的标准走势", "note": "一千點與一千二百點是眾人心理定錨，主角據此規劃減倉與反彈，印證關鍵點位牽動人心。"}, {"hui": "第一百一十四回　砸盘惊魂洗浮筹", "anchor": "股价跌到目前的位置是散户的心理价位，要是跌破就打破了他们的心理极限", "note": "關鍵點位成為散戶的心理標尺，跌破即動搖信念、誘發賣壓。"}, {"hui": "第一百一十七回　阴线高悬引狂潮", "anchor": "1213点，10日均线和64日均线的交汇之处，潜意识里我感觉这个点位看起来很安全，是不是大多数人都会这样想呢？", "note": "主角以均線交匯處為心理錨點，堅信眾人同感，支撐位由此而生。"}, {"hui": "第一百二十一回　股海陰雲夢飛山", "anchor": "这样的跌幅不会影响抄底资金的热情，也能更加坚定现在持仓的投资人的信心。", "note": "主角刻意控制跌幅，以關鍵價位維繫持股信心與抄底人氣。"}, {"hui": "第一百二十九回　股海雪崩钟摆停", "anchor": "我知道这个位置是最近几天以来的交易中枢，很难逾越", "note": "1365點是數日交易中樞的心理錨點，跌破1300整數關口隨即觸發恐慌性拋售。"}], "自我服務偏差（吹噓）": [{"hui": "第三回　衡山夜半叉头声", "anchor": "小姐还没有反应过来，我就扬长而去，在电梯里我还暗暗地高兴了好一阵子，一直走进房间，居然连澡都没有洗就倒在床上呼呼大睡。", "note": "他把口舌之胜归功于自己的机敏，暗自得意，靠自我陶醉补偿压抑的日常。"}, {"hui": "第二十回　破千五布连环计", "anchor": "我今天下午抢反弹已经有5块钱的获利了，我跟你们说啊，这急跌的时候你要大胆地跟进，不要犹豫", "note": "散户把抢反弹的运气归功于自己的果断，吹嘘战绩，反成庄家出货的活广告。"}, {"hui": "第四十七回　哀曲繞梁夜謀深", "anchor": "你要是劝他们注意风险，他们就会教育你：“你懂什么？现在是什么时候啊，我曾经有一次怎么怎么。”", "note": "散戶把一次運氣吹成經驗，勸阻反遭大話教訓。"}, {"hui": "第一百一十五回　夜宿水乡听蛙声", "anchor": "最主要的是证实了一个思路的正确性，心情格外轻松。", "note": "把倉位順遂歸功於自身思路正確，正是將成功歸因於自己的傾向。"}]}, "acts": [{"name": "第一幕「誤入股海」", "rng": "第 1～11 回", "theme": "從散戶視角初識心理較量：1992 年上海、暴跌、祈禱、歸鄉。", "line": "開篇以「散戶恐慌拋盤如山洪暴發」呈現集體恐慌，主角在狂瀉中保持冷靜，首次說出「這是心理的較量，看誰先崩潰」——全書主軸在此立起；同時以父親、酒店、報紙自殺新聞鋪陳孤獨與死亡焦慮。", "evolve": "從「想去祈禱」的普通股民，覺醒為「股市是心理戰」的旁觀者。", "reps": "1, 2, 4, 5, 10", "top": [["孤獨與異化", 10], ["恐慌性拋售（恐懼）", 6], ["情緒操縱", 5], ["心理較量（看誰先崩潰）", 5]], "quotes_html": "<p class=\"q\">「散户恐慌性抛盘一出来，就像山洪暴发一样，下跌的场面难以收拾」——第 2 回<\/p><p class=\"q\">「这是心理的较量，最后总有一些坚持不住的人」——第 5 回<\/p>"}, {"name": "第二幕「第一次做莊」", "rng": "第 12～35 回", "theme": "莊家心理戰術全景演練：清倉、誘多、砸盤、千三攻防。", "line": "主角以職業操盤手身份完成第一次做莊：高點清倉後用誘多、砸盤、試盤、消息造勢反覆調度散戶情緒——「股市就是騙跟被騙的過程」「能操縱投資人的情緒，就能讓他幹你最需要他幹的事情」。", "evolve": "從冷靜旁觀者變成主動的「情緒調度者」，同時罪惡感開始萌芽（「資本市場是趟著血河走過」）。", "reps": "12～21, 26, 28, 32, 35", "top": [["情緒操縱", 19], ["孤獨與異化", 18], ["追漲（貪婪）", 7], ["羊群效應（從眾）", 6]], "quotes_html": "<p class=\"q\">「股市是什么？就是一场斗智的游戏，说白了就是骗跟被骗的一个过程」——第 26 回<\/p><p class=\"q\">「这样没有命的往下跌，带来的不是机会而是恐惧」——第 23 回<\/p>"}, {"name": "第三幕「撤退與內省」", "rng": "第 36～60 回", "theme": "良心的代價與孤獨的深淵：跳樓者、老阿婆、歸鄉療傷。", "line": "出貨尾聲的毀滅性打擊（股民跳樓、老阿婆腦溢血）令道德衝突與罪疚感爆發；主角以哀樂、烈酒、靜安寺、歸鄉尋求解脫，心理異化（口紅寫日期、醉酒「我不行了」）達到頂峰。", "evolve": "從「殺手無笑容」到自我厭棄，重尋鄉土之根，職業熱情開始瓦解。", "reps": "37, 40, 42, 47, 52, 54, 55, 59", "top": [["孤獨與異化", 20], ["情緒操縱", 14], ["心理較量（看誰先崩潰）", 10], ["道德衝突／罪疚感", 9]], "quotes_html": "<p class=\"q\">「资本运作的核心就是情绪调整，把自己的情绪调整到最佳的状态，把别人的情绪调整到最恶劣的状态」——第 let cur = 0;
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function copyUrl(){
  navigator.clipboard.writeText(location.href).then(function(){alert("連結已複製，可分享");});
}
function goQA(i){cur=i;renderList(document.getElementById('q').value);renderPanel(i)}
function renderList(kw){
  kw=(kw||"").trim();
  const ul=document.getElementById('list');ul.innerHTML="";
  DATA.chapters.forEach((c,idx)=>{
    const hay=(c.title+" "+c.summary.join(" ")+" "+c.qa.map(q=>q.q).join(" "));
    if(kw && !hay.includes(kw)) return;
    const li=document.createElement('li');
    li.textContent=c.title;
    if(idx===cur) li.className='active';
    li.onclick=()=>goQA(idx);
    ul.appendChild(li);
  });
}
function renderPanel(i){
  const c=DATA.chapters[i];if(!c)return;
  const p=document.getElementById('panel');
  let h=`<h2>《股路不归》${$1}　重点提炼 · 一问一答</h2>`;
  h+=`<div class="sec-h">重點提要</div><ul class="sum">`+c.summary.map(s=>`<li>${$1}</li>`).join("")+`</ul>`;
  if(c.psych&&c.psych.length){
    h+=`<div class="sec-h">心理學錨點</div>`+c.psych.map(x=>`<div class="psych"><b>${$1}</b>：「${$1}」——${$1}</div>`).join("");
  }
  h+=`<div class="sec-h">一問一答</div>`+c.qa.map((q,n)=>`<div class="qa-item"><b>Q${$1}　${$1}</b><br>A：${$1}</div>`).join("");
  h+=`<div class="sec-h">原文名句</div>`+c.quotes.map(q=>`<div class="quote">「${$1}」</div>`).join("");
  p.innerHTML=h;window.scrollTo(0,0);
}
function renderPsych(){
  const p=document.getElementById('psych-panel');
  let h="";
  Object.keys(DATA.phen).sort((a,b)=>DATA.phen[b].length-DATA.phen[a].length).forEach(ph=>{
    const items=DATA.phen[ph];
    h+=`<div class="phen-block"><h3>${$1}（${$1} 回）</h3><table><tr><th>回目</th><th>原文錨點</th><th>注解</th></tr>`;
    h+=items.map(it=>`<tr><td><a class="jump" onclick="goPsych('${$1}')">${$1}</a></td><td>${$1}</td><td>${$1}</td></tr>`).join("");
    h+=`</table></div>`;
  });
  p.innerHTML=h;
}
function goPsych(title){
  const idx=DATA.chapters.findIndex(c=>c.title===title);
  if(idx>=0){
    document.querySelector('[data-tab="qa"]').click();
    document.getElementById('q').value="";
    goQA(idx);
  }
}

  const p=document.getElementById('acts-panel');

    return `<div class="act-card"><h3>${$1}（${$1}）</h3>

      <p><b>心理博弈主線：</b>${$1}</p>

}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');document.getElementById('tab-'+b.dataset.tab).classList.add('active');
  if(b.dataset.tab==='psych')renderPsych();
  if(b.dataset.tab==='acts')renderActs();
  if(b.dataset.tab==='map')renderMap('');
  if(b.dataset.tab==='action')renderAction();
  if(b.dataset.tab==='check')renderCheck();
});

function renderCheck(){
  const p=document.getElementById('check-panel');
  let h='<h2>22 現象自檢表</h2><p style="color:#666">逐條勾選你在交易中出現過的心理現象，最後生成「體檢報告」。勾選會自動保存在本機瀏覽器。</p>';
  DATA.checklist.forEach(function(c,i){
    h+='<label class="chk"><input type="checkbox" id="chk'+i+'" onchange="saveCheck('+i+',this.checked)"> <b>'+esc(c.ph)+'</b> — 自檢：'+esc(c.q)+'<br><span class="hint">行動：'+esc(c.act)+'</span></label>';
  });
  h+='<button onclick="report()">生成我的體檢報告</button><div id="report"></div>';
  p.innerHTML=h;
  for(let i=0;i<DATA.checklist.length;i++){const el=document.getElementById('chk'+i);if(el)el.checked=localStorage.getItem('chk'+i)==='1';}
}
function saveCheck(i,v){localStorage.setItem('chk'+i, v?'1':'0');}
function report(){
  let checked=0;const names=[];
  DATA.checklist.forEach(function(c,i){if(localStorage.getItem('chk'+i)==='1'){checked++;names.push(c.ph);}});
  const el=document.getElementById('report');
  el.innerHTML='<h3>體檢結果：'+checked+' / '+DATA.checklist.length+' 項已識別</h3>'+(checked?('<p><b>你已識別的高風險心理：</b>'+names.join('、')+'</p><p>建議：把對應的「應對行動」抄進交易前自檢卡，臨盤前逐條核對。</p>'):'<p>尚未勾選任何項——先逐條自檢，誠實面對自己。</p>');
}
