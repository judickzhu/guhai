<main>
<div class="v31-wrap">
  <h1 class="v31-title">DC姐姐 V3.1 · 100 題盲測自測</h1>
  <p class="v31-sub">每題只給用戶原話，不給分類、不給考點——測她在<b>沒見過的問題</b>上能不能沿著同一套思維（五問：表層→動機→卡點→反面→一答一認知）自己答對。答完可「顯示考點」對照。</p>
  <div class="v31-keyrow">
    <select id="v31-set" style="padding:8px;border-radius:6px;border:1px solid #444;background:#111;color:#eee;font-size:13px;">
      <option value="v31_blind100.json">盲測 100 題（V3.1 主套件）</option>
      <option value="v31b_blind30.json">盲測 30 題（V3.1 自主認知 ①—30）</option>
      <option value="v31c_blind30.json">升層 30 題（V3.0 第三組 31—60）</option>
      <option value="v31d_blind50.json">一題十變 50 題（5 意圖 × 10 說法）</option>
      <option value="v31f_blind30.json">一句話八種人 27 題（V3.2 動態意圖）</option>
      <option value="v31g_blind40.json">一題十變 40 題（61-100 正式版）</option>
      <option value="v31h_blind96.json">一句話八種意圖 96 題（12 基句 × 8 狀態）</option>
    </select>
  </div>

  <div class="v31-keyrow">
    <input type="password" id="v31-key" placeholder="DeepSeek API key（sk-...，只存本機瀏覽器）" autocomplete="off">
    <button class="v31-btn" id="v31-keysave">儲存 key</button>
  </div>

  <div class="v31-card">
    <div class="v31-qhead">
      <span class="v31-no" id="v31-no">— / 100</span>
      <span class="v31-tag" id="v31-prog">已答 0 題</span>
    </div>
    <div class="v31-q" id="v31-q">載入題庫中…</div>
    <div class="v31-btnrow">
      <button class="v31-btn primary" id="v31-ask">🤖 讓姐姐答</button>
      <button class="v31-btn" id="v31-point" disabled>顯示考點</button>
      <button class="v31-btn" id="v31-prev">上一題</button>
      <button class="v31-btn" id="v31-next">下一題</button>
      <button class="v31-btn" id="v31-rand">隨機</button>
    </div>
    <div class="v31-bar"><i id="v31-barfill"></i></div>
    <div class="v31-status" id="v31-status"></div>
    <div class="v31-ans" id="v31-ans"></div>
    <div class="v31-point" id="v31-point-box"></div>
  </div>
</div>
</main>
<footer>
  <p style="text-align:center;color:#666;font-size:12px;">盲測規則：AI 只給原話 · 隱藏考點僅供答完對照 · 刪名測試：刪掉 DCOGAI 四字答案還有沒有價值？有＝認知，沒有＝廣告</p>
</footer>

<script>
(function () {
  var items = [];       // {no,g,gname,q,point}
  var idx = 0;
  var answered = {};
  var busy = false;

  var $ = function (id) { return document.getElementById(id); };
  function saveKey() {
    var k = $('v31-key').value.trim();
    if (!k) return;
    try {
      localStorage.setItem('ds_key', k);
      localStorage.setItem('ds_enabled', '1');
      $('v31-status').textContent = '✅ key 已存本機（AI 模式同步開啟）';
    } catch (e) { $('v31-status').textContent = '存儲失敗：' + e.message; }
  }
  $('v31-keysave').addEventListener('click', saveKey);
  $('v31-key').addEventListener('keydown', function (e) { if (e.key === 'Enter') saveKey(); });
  try { $('v31-key').value = localStorage.getItem('ds_key') || ''; } catch (e) {}

  function loadSet() {
    var file = $('v31-set').value;
    items = []; idx = 0; answered = {};
    $('v31-q').textContent = '載入題庫中…';
    fetch(file, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        (data.groups || []).forEach(function (g) {
          (g.items || []).forEach(function (it) {
            items.push({ no: it.no, g: g.g, gname: g.name, q: it.q, point: it.point || g.note || '' });
          });
        });
        render();
      })
      .catch(function (e) { $('v31-q').textContent = '題庫載入失敗：' + e.message; });
  }
  $('v31-set').addEventListener('change', loadSet);
  loadSet();

  function render() {
    if (!items.length) return;
    var it = items[idx];
    $('v31-no').textContent = (idx + 1) + ' / ' + items.length;
    $('v31-q').textContent = it.q;
    $('v31-ans').style.display = 'none';
    $('v31-point-box').style.display = 'none';
    $('v31-point').disabled = false;
    $('v31-ans').textContent = '';
    $('v31-point-box').textContent = '';
    $('v31-prog').textContent = '已答 ' + Object.keys(answered).length + ' 題';
    $('v31-barfill').style.width = (Object.keys(answered).length / items.length * 100) + '%';
    $('v31-status').textContent = answered[it.no] ? '✅ 本題已答過（可再答）' : '';
  }

  function ask() {
    if (busy) return;
    if (!items.length) return;
    var it = items[idx];
    var key = '';
    try { key = localStorage.getItem('ds_key') || ''; } catch (e) {}
    // 舊 DeepSeek 官方 key 在 TeamoRouter 上無效：非 sk-teamo- 開頭一律丟棄，用內置福利版 key
    if (key.indexOf('sk-teamo-') !== 0) { key = 'sk-teamo-dffbb80d91b54f308cce7b0ecb17b7a6b51f41b14d701db8'; }
    if (!key) { $('v31-status').textContent = '⚠️ 請先在上方輸入並儲存 DeepSeek key'; $('v31-key').focus(); return; }
    busy = true;
    $('v31-ask').disabled = true;
    $('v31-status').textContent = '🤖 姐姐在想…（五問內部推理中）';
    var sys = (window.DCSister && window.DCSister.prompt) ? window.DCSister.prompt() : '';
    fetch('https://api.teamorouter.cn/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: 'deepseek-v4-flash-free',
        messages: [{ role: 'system', content: sys }, { role: 'user', content: it.q }],
        max_tokens: 1600,
        temperature: 0.7
      }),
      cache: 'no-store'
    })
      .then(function (res) {
        if (res.status === 429) { $('v31-status').textContent = '⏳ 限頻中，12 秒後自動重試…'; setTimeout(ask, 12000); busy = false; return null; }
        return res.json().then(function (j) {
          if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + JSON.stringify(j).slice(0, 120));
          return j;
        });
      })
      .then(function (j) {
        if (!j) return;
        var reply = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (!reply) throw new Error('空回覆');
        $('v31-ans').textContent = reply;
        $('v31-ans').style.display = 'block';
        answered[it.no] = true;
        $('v31-prog').textContent = '已答 ' + Object.keys(answered).length + ' 題';
        $('v31-barfill').style.width = (Object.keys(answered).length / items.length * 100) + '%';
        $('v31-status').textContent = '✅ 答完。對照一下：她抓到的是不是真正卡點？';
        busy = false;
        // 冷卻 6 秒再允許下一題（保護 key）
        $('v31-ask').disabled = true;
        var t = 6;
        var timer = setInterval(function () {
          t--;
          $('v31-status').textContent = '✅ 答完。冷卻 ' + t + ' 秒後可再問…';
          if (t <= 0) { clearInterval(timer); $('v31-ask').disabled = false; $('v31-status').textContent = '✅ 答完。對照一下：她抓到的是不是真正卡點？'; }
        }, 1000);
      })
      .catch(function (e) {
        $('v31-status').textContent = '⚠️ 出錯：' + e.message + '（稍後再試）';
        busy = false;
        $('v31-ask').disabled = false;
      });
  }

  $('v31-ask').addEventListener('click', ask);
  $('v31-prev').addEventListener('click', function () { if (idx > 0) { idx--; render(); } });
  $('v31-next').addEventListener('click', function () { if (idx < items.length - 1) { idx++; render(); } });
  $('v31-rand').addEventListener('click', function () { idx = Math.floor(Math.random() * items.length); render(); });
  $('v31-point').addEventListener('click', function () {
    if (!items.length) return;
    var it = items[idx];
    $('v31-point-box').innerHTML = '<b>G' + it.g + ' · ' + it.gname + '</b><br>' + (it.point || '（組提示：見題庫檔案）');
    $('v31-point-box').style.display = 'block';
    $('v31-point').disabled = true;
  });
})();
</script>
