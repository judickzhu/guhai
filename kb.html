<main><h1>知識庫 · 一問一答翻頁閱讀</h1>
<p class="sub">《股路不归》1354 題 ＋ 《股道》1031 題 ＝ 2385 題 · 可切換書本＋關鍵字檢索</p>
<div class="booktabs">
  <button class="bt active" data-b="" onclick="setBook('')">全部（2385）</button>
  <button class="bt" data-b="股路不归" onclick="setBook('股路不归')">《股路不归》（1354）</button>
  <button class="bt" data-b="股道" onclick="setBook('股道')">《股道》（1031）</button>
</div>
<div class="search" style="max-width:640px;margin-top:10px">
  <input type="search" id="kbq" placeholder="輸入關鍵字（如：沽空、止損、恐懼）過濾，留空＝全部…" oninput="kbSearch(this.value)" autocomplete="off">
</div>
<div class="pager" id="kb-pager" style="display:none">
  <button onclick="prev()">← 上一頁</button>
  <span id="kb-pageinfo"></span>
  <span class="goto">跳頁：<input type="number" id="kb-goto" min="1" value="1" style="width:60px"> <button onclick="jump()">GO</button></span>
  <button onclick="next()">下一頁 →</button>
</div>
<div id="kb-results"><p class="muted">載入知識庫中…</p></div>
<div class="pager" id="kb-pager2" style="display:none">
  <button onclick="prev()">← 上一頁</button>
  <span id="kb-pageinfo2"></span>
  <button onclick="next()">下一頁 →</button>
</div>
<script>
function escK(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var KB = [], page = 1, perPage = 20, lastKw = '', book = '';
function items(){
  var base = book ? KB.filter(function(a){ return a.part === book; }) : KB;
  if(!lastKw) return base;
  return base.filter(function(a){
    return (a.q||'').indexOf(lastKw)>=0 || (a.a||'').indexOf(lastKw)>=0 || (a.reflection||'').indexOf(lastKw)>=0 ||
           (a.title||'').indexOf(lastKw)>=0 || (a.keywords||[]).some(function(k){return k.indexOf(lastKw)>=0;});
  });
}
function setBook(b){ book = b; page = 1; updateTabs(); render(); }
function updateTabs(){
  var els = document.querySelectorAll('.bt');
  for(var i=0;i<els.length;i++){ els[i].className = 'bt' + (els[i].getAttribute('data-b')===book?' active':''); }
}
function render(){
  var all = items();
  var totalPages = Math.max(1, Math.ceil(all.length / perPage));
  if(page < 1) page = 1; if(page > totalPages) page = totalPages;
  var slice = all.slice((page-1)*perPage, page*perPage);
  var box = document.getElementById('kb-results');
  if(!slice.length){ box.innerHTML = '<p class="none">無相符結果</p>'; }
  else {
    box.innerHTML = slice.map(function(a){
      return '<div class="kb-item"><p class="kb-h"><b>'+escK(a.title)+'</b>｜'+escK(a.part)+'</p>'+
        '<p class="kb-q">'+escK(a.q)+'</p><p class="kb-a">'+escK(a.a)+'</p>'+
        (a.reflection?'<p class="jian">照見　'+escK(a.reflection)+'</p>':'')+'</div>';
    }).join('');
  }
  var name = book ? '《'+book+'》' : '全部';
  var info = '第 ' + page + ' / ' + totalPages + ' 頁（' + name + ' ' + all.length + ' 題' + (lastKw?'，過濾後':'') + '）';
  document.getElementById('kb-pageinfo').textContent = info;
  document.getElementById('kb-pageinfo2').textContent = info;
  document.getElementById('kb-pager').style.display = 'flex';
  document.getElementById('kb-pager2').style.display = 'flex';
  var g = document.getElementById('kb-goto'); if(g){ g.value = page; }
}
function jump(){
  var g = document.getElementById('kb-goto');
  var n = parseInt(g.value, 10);
  if(!isNaN(n) && n >= 1){ page = n; render(); } else { g.value = page; }
}
document.addEventListener('keydown', function(e){ if(e.target && e.target.id === 'kb-goto' && e.key === 'Enter'){ jump(); } });
function prev(){ page--; render(); }
function next(){ page++; render(); }
function kbSearch(kw){ lastKw = (kw||'').trim(); page = 1; render(); }
fetch('kb-books.json?v=2').then(function(r){return r.json();}).then(function(d){ KB = d.articles || []; render(); })
  .catch(function(){ document.getElementById('kb-results').innerHTML='<p class="none">知識庫載入失敗</p>'; });
</script></main>
