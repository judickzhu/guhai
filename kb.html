<main><h1>知識庫 · 一問一答全文檢索</h1>
<p class="sub">《股路不归》1354 題 ＋ 《股道》1031 題 ＝ 2385 題 · 可搜題目／答案／照見／關鍵字</p>
<div class="search" style="max-width:640px">
  <input type="search" id="kbq" placeholder="輸入關鍵字（如：沽空、止損、恐懼、圓弧底）…" oninput="kbSearch(this.value)" autocomplete="off">
</div>
<p class="muted" id="kb-count"></p>
<div id="kb-results"></div>
<script>
function escK(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var KB = [], shown = 0, lastKw = '';
function render(items, header, more){
  var box = document.getElementById('kb-results');
  document.getElementById('kb-count').textContent = header;
  box.innerHTML = items.map(function(a){
    return '<div class="kb-item"><p class="kb-h"><b>'+escK(a.title)+'</b>｜'+escK(a.part)+'</p>'+
      '<p class="kb-q">'+escK(a.q)+'</p><p class="kb-a">'+escK(a.a)+'</p>'+
      (a.reflection?'<p class="jian">照見　'+escK(a.reflection)+'</p>':'')+'</div>';
  }).join('') + (more ? '<p style="text-align:center"><button onclick="kbMore()">顯示更多</button></p>' : '');
}
function kbMore(){
  shown += 15;
  if(!lastKw){ render(KB.slice(0, shown), '共 2385 題 · 顯示前 ' + shown + ' 題', shown < KB.length); }
  else { var hits = search(lastKw); render(hits.slice(0, shown), hits.length + ' 題相符', shown < hits.length); }
}
function search(kw){
  return KB.filter(function(a){
    return (a.q||'').indexOf(kw)>=0 || (a.a||'').indexOf(kw)>=0 || (a.reflection||'').indexOf(kw)>=0 ||
           (a.title||'').indexOf(kw)>=0 || (a.keywords||[]).some(function(k){return k.indexOf(kw)>=0;});
  });
}
function kbSearch(kw){
  kw = (kw||'').trim(); lastKw = kw; shown = 15;
  if(!kw){ render(KB.slice(0,15), '共 2385 題 · 顯示前 15 題', true); return; }
  var hits = search(kw);
  render(hits.slice(0,15), hits.length + ' 題相符', hits.length > 15);
}
fetch('kb-books.json').then(function(r){return r.json();}).then(function(d){ KB = d.articles || []; render(KB.slice(0,15), '共 '+(d.articles?d.articles.length:2385)+' 題 · 顯示前 15 題', true); })
  .catch(function(){ document.getElementById('kb-results').innerHTML='<p class="none">知識庫載入失敗</p>'; });
</script></main>
