<main><h1>知識庫 · 全文檢索</h1>
<p class="sub">《股路不归》1354 題 ＋ 《股道》1031 題 ＝ 2385 題 · 可搜題目／答案／照見／關鍵字</p>
<div class="search" style="max-width:640px">
  <input type="search" id="kbq" placeholder="輸入關鍵字（如：沽空、止損、恐懼、圓弧底）…" oninput="kbSearch(this.value)" autocomplete="off">
</div>
<p class="muted" id="kb-count"></p>
<div id="kb-results"><p class="muted">輸入關鍵字開始檢索（共 2385 題）</p></div>
<script>
function escK(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var KB = [];
fetch('kb-books.json').then(function(r){return r.json();}).then(function(d){ KB = d.articles || []; })
  .catch(function(){ document.getElementById('kb-results').innerHTML='<p class="none">知識庫載入失敗</p>'; });
function kbSearch(kw){
  kw = (kw||'').trim();
  var box = document.getElementById('kb-results');
  var cnt = document.getElementById('kb-count');
  if(kw.length < 1){ box.innerHTML = '<p class="muted">輸入關鍵字開始檢索（共 2385 題）</p>'; cnt.textContent=''; return; }
  var hits = KB.filter(function(a){
    return (a.q||'').indexOf(kw)>=0 || (a.a||'').indexOf(kw)>=0 || (a.reflection||'').indexOf(kw)>=0 ||
           (a.title||'').indexOf(kw)>=0 || (a.keywords||[]).some(function(k){return k.indexOf(kw)>=0;});
  });
  cnt.textContent = hits.length + ' 題相符';
  if(!hits.length){ box.innerHTML = '<p class="none">無相符結果</p>'; return; }
  box.innerHTML = hits.slice(0,30).map(function(a){
    return '<div class="kb-item"><p class="kb-h"><b>'+escK(a.title)+'</b>｜'+escK(a.part)+'</p>'+
      '<p class="kb-q">'+escK(a.q)+'</p>'+
      '<p class="kb-a">'+escK(a.a)+'</p>'+
      (a.reflection?'<p class="jian">照見　'+escK(a.reflection)+'</p>':'')+
      '</div>';
  }).join('') + (hits.length>30 ? '<p class="muted">…還有 '+ (hits.length-30) +' 題，請用更精確的關鍵字</p>' : '');
}
</script></main>
